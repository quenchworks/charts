name: release-grafana-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/grafana-operator/**"
      - ".github/workflows/release-grafana-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/grafana-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          grafana="$(awk '/^grafanaImage:/{f=1} f&&/repository:/{r=$2} f&&/digest:/{gsub(/"/,"",$2); print r"@"$2; exit}' "${CHART_DIR}/values.yaml")"

          # --- PROVE THE OPERATOR RUNS GRAFANA AND PUSHES A DASHBOARD INTO IT. ---
          # 1. The thirteen CRDs are installed.
          test "$(kubectl get crd -o name | grep -c 'grafana.integreatly.org')" -eq 13

          # 2. A Grafana, a folder and a dashboard in that folder.
          kubectl apply -f - <<'YAML'
          apiVersion: grafana.integreatly.org/v1beta1
          kind: Grafana
          metadata: { name: gate, labels: { dashboards: gate } }
          spec: {}
          ---
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaFolder
          metadata: { name: gate }
          spec:
            title: Gate Folder
            instanceSelector: { matchLabels: { dashboards: gate } }
          ---
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaDashboard
          metadata: { name: gate }
          spec:
            folderRef: gate
            instanceSelector: { matchLabels: { dashboards: gate } }
            json: '{"title": "Gate Dashboard", "uid": "gate-dash", "panels": []}'
          YAML

          # 3. The operator runs it as a ready Deployment on the QuenchWorks Grafana image.
          for i in $(seq 1 60); do kubectl get deploy gate-deployment >/dev/null 2>&1 && break; sleep 5; done
          kubectl rollout status deployment/gate-deployment --timeout=300s
          img="$(kubectl get deploy gate-deployment -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test "$img" = "$grafana" || { echo "FAIL: Grafana runs $img, not $grafana"; exit 1; }
          echo "Grafana reconciled into a ready Deployment on our image"

          # 4. The folder and dashboard reached Grafana's API, with the admin login the operator generated.
          user="$(kubectl get secret gate-admin-credentials -o jsonpath='{.data.GF_SECURITY_ADMIN_USER}' | base64 -d)"
          pass="$(kubectl get secret gate-admin-credentials -o jsonpath='{.data.GF_SECURITY_ADMIN_PASSWORD}' | base64 -d)"
          kubectl port-forward svc/gate-service 13000:3000 >/tmp/pf.log 2>&1 & pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from' /tmp/pf.log && break; sleep 1; done
          dash=""
          for i in $(seq 1 40); do
            dash="$(curl -fsS -u "${user}:${pass}" http://127.0.0.1:13000/api/dashboards/uid/gate-dash || true)"
            grep -q '"folderTitle":"Gate Folder"' <<<"$dash" && break; sleep 5
          done
          grep -q '"folderTitle":"Gate Folder"' <<<"$dash" || { echo "FAIL: dashboard not in Grafana: ${dash:0:300}"; kubectl logs deploy/rtest-grafana-operator --tail=40; exit 1; }
          echo "GrafanaDashboard pushed into Grafana inside its GrafanaFolder"

          # 5. Deleting the resource removes the dashboard from Grafana.
          kubectl delete grafanadashboard gate --wait
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -u "${user}:${pass}" http://127.0.0.1:13000/api/dashboards/uid/gate-dash || true)"
            [ "$code" = 404 ] && break; sleep 3
          done
          test "$code" = 404 || { echo "FAIL: dashboard still in Grafana after delete ($code)"; exit 1; }
          echo "deleting the GrafanaDashboard removed it from Grafana"

          restarts="$(kubectl get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: a container restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/grafana-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/grafana-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/grafana-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

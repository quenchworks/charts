name: release-matomo

on:
  push:
    branches: [main]
    paths:
      - "quench/matomo/**"
      - ".github/workflows/release-matomo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/matomo
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-matomo --timeout=300s

          # The runtime image has no HTTP client, so probe over a port-forward.
          kubectl port-forward deployment/rtest-matomo 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT; sleep 5

          ok=""
          for i in $(seq 1 40); do
            code="$(curl -s -o /tmp/m.html -w '%{http_code}' -L http://127.0.0.1:8080/)" || true
            echo "GET /: $code"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 3
          done
          test -n "$ok" || { echo "Matomo never served 200"; kubectl logs deployment/rtest-matomo --tail=40; exit 1; }

          # Assert MATOMO answered, not merely that something on 8080 did. A bare nginx with a
          # broken php-fpm upstream also returns 200 (its own error page), so match the app's
          # own title. On a fresh deploy that title is the INSTALLER, which is the correct
          # state -- the gate provisions no database.
          grep -qi "matomo" /tmp/m.html \
            || { echo "200 but the body is not Matomo -- php-fpm upstream is probably broken"; head -c 400 /tmp/m.html; exit 1; }
          grep -oiE "<title>[^<]*" /tmp/m.html | head -1

          helm uninstall rtest --wait

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/matomo-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/matomo@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/matomo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-odoo

on:
  push:
    branches: [main]
    paths:
      - "quench/odoo/**"
      - ".github/workflows/release-odoo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/odoo
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The init container installs base into the empty database first.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-odoo --timeout=600s

          kubectl port-forward deployment/rtest-odoo 8069:8069 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:8069' /tmp/pf.log && break; sleep 1; done
          B=http://127.0.0.1:8069

          # 1. Healthy, and the chart's nightly build.
          curl -fsS -m 20 $B/web/health | tee /tmp/health.json; echo
          grep -q '"pass"' /tmp/health.json
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          got="$(kubectl exec deployment/rtest-odoo -c odoo -- /opt/odoo/venv/bin/python -c 'import importlib.metadata as m; print(m.version("odoo"))')"
          echo "odoo $got (want $want)"
          test "$got" = "${want%.*}.post${want##*.}"

          # 2. The generated admin password logs in; upstream's default "admin" does not.
          PW="$(kubectl get secret rtest-odoo -o jsonpath='{.data.admin-password}' | base64 -d)"
          test -n "$PW"
          auth() { curl -fsS -m 30 -H 'Content-Type: application/json' -X POST $B/web/session/authenticate \
            -d "{\"jsonrpc\":\"2.0\",\"params\":{\"db\":\"odoo\",\"login\":\"admin\",\"password\":\"$1\"}}"; }
          auth admin > /tmp/bad.json || true
          if grep -q '"uid": *[0-9]' /tmp/bad.json; then echo "default admin password still works"; exit 1; fi
          auth "$PW" | tee /tmp/good.json; echo
          grep -q '"uid": *2' /tmp/good.json
          echo "  generated admin password logs in; the default is refused"

          # 3. The data is in the bundled PostgreSQL.
          pgpw="$(kubectl get secret rtest-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)"
          kubectl exec rtest-postgresql-0 -- env PGPASSWORD="$pgpw" psql -h 127.0.0.1 -U odoodb -d odoo -tAc "select login from res_users where id = 2" | tee /tmp/pguser.txt
          grep -qx admin /tmp/pguser.txt

          # 4. A restart finds the database initialised and leaves it alone.
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=odoo --wait
          kubectl rollout status deployment/rtest-odoo --timeout=600s
          kubectl logs deployment/rtest-odoo -c init-database | tee /tmp/init2.txt
          grep -q 'already initialised' /tmp/init2.txt
          echo "install gate OK: base installed, admin password set, restart keeps the database"
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/odoo-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/odoo@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/odoo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

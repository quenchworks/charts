name: release-mariadb

on:
  push:
    branches: [main]
    paths:
      - "quench/mariadb/**"
      - ".github/workflows/release-mariadb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mariadb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 6m
          # galera ci-values brings up a 3-node OrderedReady cluster: node-0 bootstraps,
          # then nodes 1 and 2 join sequentially via mariabackup SST, so allow ample time.
          kubectl rollout status statefulset/rtest-mariadb --timeout=420s
          # prove it's a real 3-node cluster in sync (not just a single bootstrap node)
          pw0=$(kubectl get secret rtest-mariadb -o jsonpath='{.data.mariadb-root-password}' | base64 -d)
          for i in $(seq 1 30); do
            sz=$(kubectl exec rtest-mariadb-0 -- mariadb --socket=/run/mysqld/mysqld.sock -uroot -p"$pw0" -N -B -e "show status like 'wsrep_cluster_size'" 2>/dev/null | awk '{print $2}')
            [ "$sz" = "3" ] && break
            sleep 4
          done
          kubectl exec rtest-mariadb-0 -- mariadb --socket=/run/mysqld/mysqld.sock -uroot -p"$pw0" -N -B -e "show status like 'wsrep_cluster_size'" | grep -qw 3
          pw=$(kubectl get secret rtest-mariadb -o jsonpath='{.data.mariadb-root-password}' | base64 -d)
          # authenticated ping prints "mysqld is alive"; an unauthenticated ping only proves the server is up
          kubectl exec rtest-mariadb-0 -- mariadb-admin --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" ping | grep -q "mysqld is alive"
          kubectl exec rtest-mariadb-0 -- mariadb --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" qwapp -e "select 1" | grep -q 1

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mariadb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mariadb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/mariadb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-nebula

on:
  push:
    branches: [main]
    paths:
      - "quench/nebula/**"
      - ".github/workflows/release-nebula.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/nebula
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          img="ghcr.io/quenchworks/images/nebula@$(awk '/^  digest:/{gsub(/"/,"",$2); print $2; exit}' "${CHART_DIR}/values.yaml")"
          # Nebula PKI from the image's own nebula-cert: the chart's CA, a lighthouse, a host,
          # and a host signed by another CA
          mkdir -p /tmp/pki && chmod 0777 /tmp/pki
          nc() { docker run --rm -v /tmp/pki:/w -w /w --entrypoint /usr/bin/nebula-cert "$img" "$@"; }
          nc ca -name gate-ca
          nc sign -name lighthouse -ip 192.168.100.1/24
          nc sign -name host -ip 192.168.100.2/24
          nc ca -name rogue-ca -out-crt rogue-ca.crt -out-key rogue-ca.key
          nc sign -name rogue -ip 192.168.100.3/24 -ca-crt rogue-ca.crt -ca-key rogue-ca.key
          kubectl create secret generic nebula-pki --from-file=ca.crt=/tmp/pki/ca.crt \
            --from-file=host.crt=/tmp/pki/lighthouse.crt --from-file=host.key=/tmp/pki/lighthouse.key
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-nebula --timeout=300s
          # a host and a rogue as pods, finding the lighthouse through its Service
          for n in host rogue; do
            ca=ca.crt; [ "$n" = rogue ] && ca=rogue-ca.crt
            kubectl create secret generic "pki-$n" --from-file=ca.crt=/tmp/pki/$ca \
              --from-file=host.crt=/tmp/pki/$n.crt --from-file=host.key=/tmp/pki/$n.key
            kubectl create configmap "conf-$n" --from-literal=config.yml="$(printf '%s\n' \
              'pki: { ca: /pki/ca.crt, cert: /pki/host.crt, key: /pki/host.key }' \
              'listen: { host: 0.0.0.0, port: 4242 }' 'tun: { disabled: true }' \
              'lighthouse: { am_lighthouse: false, hosts: ["192.168.100.1"] }' \
              'static_host_map: { "192.168.100.1": ["rtest-nebula:4242"] }' \
              'firewall: { outbound: [{port: any, proto: any, host: any}], inbound: [{port: any, proto: any, host: any}] }')"
            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata: { name: nb-$n }
          spec:
            securityContext: { runAsUser: 1001, runAsNonRoot: true }
            containers:
              - name: nebula
                image: $img
                args: [-config, /conf/config.yml]
                volumeMounts: [{ name: c, mountPath: /conf }, { name: p, mountPath: /pki }, { name: r, mountPath: /run }]
            volumes:
              - { name: c, configMap: { name: conf-$n } }
              - { name: p, secret: { secretName: pki-$n } }
              - { name: r, emptyDir: {} }
          EOF
          done
          kubectl wait --for=condition=Ready pod/nb-host pod/nb-rogue --timeout=120s
          ok=0
          for i in $(seq 1 30); do grep -q 'Handshake message received' <<<"$(kubectl logs nb-host)" && { ok=1; break; }; sleep 2; done
          kubectl logs nb-host | tail -5
          [ "$ok" = 1 ] || { echo "host never completed a handshake with the lighthouse"; exit 1; }
          sleep 5
          if grep -q 'Handshake message received' <<<"$(kubectl logs nb-rogue)"; then echo "a host from another CA was let in"; exit 1; fi
          grep -q 'could not find ca' <<<"$(kubectl logs deploy/rtest-nebula)" || { echo "lighthouse did not report the rogue certificate"; exit 1; }
          # metrics count the handshakes
          kubectl port-forward svc/rtest-nebula 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; sleep 5
          m="$(curl -fsS http://127.0.0.1:8080/metrics)"; kill $pf 2>/dev/null || true
          grep -q '^nebula_' <<<"$m" || { echo "no nebula metrics"; exit 1; }
          echo "nebula: lighthouse handshake through the Service, foreign CA refused, metrics: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/nebula-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/nebula@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/nebula:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-lgtm-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/lgtm-stack/**"
      - ".github/workflows/release-lgtm-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/lgtm-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # Heaviest stack (9 workloads) — give it a longer timeout.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m

          # all components reached Ready (--wait already gates this, assert explicitly)
          kubectl rollout status statefulset/rtest-victoriametrics --timeout=300s
          kubectl rollout status statefulset/rtest-loki            --timeout=300s
          kubectl rollout status statefulset/rtest-tempo           --timeout=300s
          kubectl rollout status statefulset/rtest-grafana         --timeout=300s
          kubectl rollout status statefulset/rtest-alertmanager    --timeout=300s
          kubectl rollout status deployment/rtest-otel-collector       --timeout=300s
          kubectl rollout status deployment/rtest-kube-state-metrics   --timeout=300s
          kubectl rollout status daemonset/rtest-vector                --timeout=300s

          # ---- INTEGRATION ASSERT 1: VictoriaMetrics is healthy and scraping ----
          kubectl port-forward svc/rtest-victoriametrics 8428:8428 >/tmp/vm-pf.log 2>&1 &
          vmpf=$!; trap 'kill $vmpf 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8428/health" >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "VictoriaMetrics /health never returned 200"; kubectl logs statefulset/rtest-victoriametrics --tail=50 || true; exit 1; }
          echo "VictoriaMetrics /health: 200"

          # `up` query returns data once the first promscrape lands.
          ok=""
          for i in $(seq 1 30); do
            body="$(curl -fsS "http://127.0.0.1:8428/api/v1/query?query=up" || true)"
            echo "vm up attempt $i: $body"
            if echo "$body" | grep -q '"status":"success"' && echo "$body" | grep -qE '"result":\[[^]]'; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok" || { echo "VictoriaMetrics 'up' query returned no data — promscrape not working"; exit 1; }
          echo "VictoriaMetrics promscrape confirmed (up has data)."

          # ---- INTEGRATION ASSERT 2: Loki ready + Vector->Loki ingestion ----
          kubectl port-forward svc/rtest-loki 3100:3100 >/tmp/loki-pf.log 2>&1 &
          lpf=$!; trap 'kill $vmpf $lpf 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3100/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "Loki /ready never returned 200"; exit 1; }
          echo "Loki /ready: 200"

          ingested=""
          for i in $(seq 1 30); do
            body="$(curl -fsS "http://127.0.0.1:3100/loki/api/v1/label/namespace/values" || true)"
            echo "loki ns attempt $i: $body"
            if echo "$body" | grep -q '"status":"success"' && echo "$body" | grep -qE '"data":\[[^]]'; then ingested=1; break; fi
            sleep 5
          done
          test -n "$ingested" || { echo "Loki has no 'namespace' label values — Vector->Loki not working"; exit 1; }
          echo "Vector -> Loki ingestion confirmed."

          # ---- INTEGRATION ASSERT 3: Tempo ready ----
          kubectl port-forward svc/rtest-tempo 3200:3200 >/tmp/tempo-pf.log 2>&1 &
          tpf=$!; trap 'kill $vmpf $lpf $tpf 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3200/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "Tempo /ready never returned 200"; kubectl logs statefulset/rtest-tempo --tail=50 || true; exit 1; }
          echo "Tempo /ready: 200"

          # ---- INTEGRATION ASSERT 4: Grafana has all THREE datasources ----
          pw="$(kubectl get secret rtest-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          test -n "$pw"
          kubectl port-forward svc/rtest-grafana 3000:3000 >/tmp/gf-pf.log 2>&1 &
          gpf=$!; trap 'kill $vmpf $lpf $tpf $gpf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:3000/api/health" >/dev/null 2>&1 && break
            sleep 5
          done
          ds=""
          for i in $(seq 1 12); do
            body="$(curl -fsS -u "admin:${pw}" 'http://127.0.0.1:3000/api/datasources' || true)"
            echo "datasources attempt $i: $body"
            # require all three provisioned datasource UIDs to be present
            if echo "$body" | grep -q '"uid":"metrics"' \
               && echo "$body" | grep -q '"uid":"loki"' \
               && echo "$body" | grep -q '"uid":"tempo"'; then ds=1; break; fi
            sleep 5
          done
          test -n "$ds" || { echo "Grafana is missing one of the three provisioned datasources (metrics/loki/tempo)"; exit 1; }
          echo "Grafana has all three datasources (metrics, loki, tempo)."

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/lgtm-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/lgtm-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/lgtm-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

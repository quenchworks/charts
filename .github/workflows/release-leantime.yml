name: release-leantime

on:
  push:
    branches: [main]
    paths:
      - "quench/leantime/**"
      - ".github/workflows/release-leantime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/leantime
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-leantime --timeout=600s
          SESS=$(kubectl get secret rtest-leantime -o jsonpath='{.data.session-password}')
          [ "$(echo "$SESS" | base64 -d | wc -c)" -ge 32 ] || { echo "the generated LEAN_SESSION_PASSWORD is too short"; exit 1; }
          PW=$(kubectl get secret rtest-leantime -o jsonpath='{.data.admin-password}' | base64 -d)
          # local port 8080 so the browser-style Origin header equals the chart's appUrl (ci/default-values.yaml)
          fwd() { kubectl port-forward svc/rtest-leantime 8080:8080 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:8080
          up() { for _ in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/auth/login")" = 200 ] && return 0; sleep 2; done; echo "/auth/login never answered"; return 1; }
          # login <password>: the CSRF token from the page and an Origin header, as a browser posts it; prints the redirect
          login() { local j; j=$(mktemp)
            local tok; tok=$(curl -s -c "$j" "$B/auth/login" | sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' | head -1)
            [ -n "$tok" ] || { echo "no-token"; return; }
            curl -s -o /dev/null -w '%{redirect_url}' -b "$j" -H "Origin: $B" --data-urlencode "_token=$tok" \
              --data-urlencode username=admin@quench.test --data-urlencode "password=$1" --data-urlencode redirectUrl= "$B/auth/login"; }
          kept() {
            up || return 1
            r=$(login wrong-password-1); case "$r" in *auth/login*) ;; *) echo "a wrong password was not sent back to /auth/login: $r"; return 1;; esac
            r=$(login "$PW"); case "$r" in ""|*auth/login*|no-token) echo "the admin cannot sign in: $r"; return 1;; esac
          }
          fwd kept
          # the account (PostgreSQL) survives a pod restart; the session secret and the admin password survive an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=leantime --wait=true
          kubectl rollout status deployment/rtest-leantime --timeout=600s
          fwd kept
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          [ "$(kubectl get secret rtest-leantime -o jsonpath='{.data.session-password}')" = "$SESS" ] || { echo "LEAN_SESSION_PASSWORD changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-leantime --timeout=600s
          fwd kept
          echo "leantime: schema installed and admin created at install, wrong password refused, admin signs in, kept across a pod restart (PostgreSQL) and an upgrade (secrets): ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/leantime-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/leantime@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/leantime:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-proxysql

on:
  push:
    branches: [main]
    paths:
      - "quench/proxysql/**"
      - ".github/workflows/release-proxysql.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/proxysql
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # A real backend first: our own mariadb chart, as `db`, so the Service is
          # db-mariadb and matches ci/default-values.yaml.
          helm install db oci://ghcr.io/quenchworks/charts/mariadb --version 0.0.19 \
            --set auth.rootPassword=root-gate-pw --set auth.database=app \
            --set auth.username=app --set auth.password=app-gate-pw \
            --set primary.persistence.enabled=false --wait --timeout 8m

          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-proxysql --timeout=300s

          CLIENT=ghcr.io/quenchworks/images/mariadb:11.8.9
          sql() { kubectl run "q$RANDOM" --rm -i --restart=Never --quiet --image="$CLIENT" \
            --command -- /usr/bin/mariadb --skip-ssl -N -B "$@"; }

          # --- PROVE PROXYSQL ROUTES QUERIES, not that a port is open. ---
          # 1. A query through the MySQL port reaches the backend: @@hostname is the
          #    mariadb pod's name, which only the backend knows. ProxySQL answers
          #    SELECT @@version_comment itself, so ask for something it cannot fake.
          host="$(sql -h rtest-proxysql -P 3306 -u app -papp-gate-pw app -e 'SELECT @@hostname')"
          echo "backend hostname via proxysql: $host"
          [[ "$host" == db-mariadb-* ]]

          # 2. The remote admin account works through the admin Service, and the
          #    connection pool shows the query above was served by the backend.
          stats="$(sql -h rtest-proxysql-admin -P 6032 -u radmin -pgate-admin-pw \
            -e 'SELECT srv_host, status, Queries FROM stats_mysql_connection_pool')"
          echo "$stats"
          awk '$1=="db-mariadb" && $2=="ONLINE" && $3>0 {ok=1} END {exit !ok}' <<<"$stats"

          # 3. A wrong password is refused by ProxySQL with 1045.
          err="$(sql -h rtest-proxysql -P 3306 -u app -pwrong -e 'SELECT 1' 2>&1 || true)"
          echo "$err"
          grep -q 'ERROR 1045' <<<"$err"

          # 4. The generated-password path: an install without admin.password keeps
          #    the same password across an upgrade.
          helm install gen "${CHART_DIR}" --wait --timeout 5m
          p1="$(kubectl get secret gen-proxysql -o jsonpath='{.data.admin-password}')"
          helm upgrade gen "${CHART_DIR}" --wait --timeout 5m
          p2="$(kubectl get secret gen-proxysql -o jsonpath='{.data.admin-password}')"
          test -n "$p1" && test "$p1" = "$p2"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/proxysql-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/proxysql@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/proxysql:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-pgadmin4

on:
  push:
    branches: [main]
    paths:
      - "quench/pgadmin4/**"
      - ".github/workflows/release-pgadmin4.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/pgadmin4
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # a PostgreSQL for pgAdmin to manage: the catalog chart, open to other releases
          helm install gatepg oci://ghcr.io/quenchworks/charts/postgresql --set auth.password=Quench-CI-Pg-2026 \
            --set networkPolicy.allowExternal=true --wait --timeout 10m
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set 'servers[0].Name=gate-pg' --set 'servers[0].Host=gatepg-postgresql' --set 'servers[0].Username=postgres' \
            --wait --timeout 15m
          kubectl rollout status deployment/rtest-pgadmin4 --timeout=600s
          fwd() { kubectl port-forward svc/rtest-pgadmin4 8080:8080 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          C=""; B=http://127.0.0.1:8080; EMAIL=gate@example.com; PW='Quench-CI-pgAdmin-2026!'
          csrf() { sed -n "s/.*[\"']csrfToken[\"']: *[\"']\([^\"']*\)[\"'].*/\1/p;s/.*pgAdmin\['csrf_token'\] = '\([^']*\)'.*/\1/p" "$1" | head -1; }
          up() { for _ in $(seq 1 90); do [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/misc/ping")" = 200 ] && return 0; sleep 2; done; echo "/misc/ping never answered"; return 1; }
          # signs in with a fresh cookie jar; succeeds only when /browser/ answers 200 afterwards
          login() {
            rm -f /tmp/jar; curl -s $C -c /tmp/jar -b /tmp/jar "$B/login" > /tmp/login.html
            T=$(csrf /tmp/login.html); [ -n "$T" ] || { echo "no CSRF token on the login page"; return 1; }
            curl -s $C -c /tmp/jar -b /tmp/jar -o /dev/null --data-urlencode "email=$EMAIL" --data-urlencode "password=$1" \
              --data-urlencode "csrf_token=$T" "$B/authenticate/login"
            [ "$(curl -s $C -c /tmp/jar -b /tmp/jar -o /dev/null -w '%{http_code}' "$B/browser/")" = 200 ]
          }
          managed() {
            up || return 1
            ! login wrong-password-1 || { echo "a wrong password reached the browser"; return 1; }
            login "$PW" || { echo "the first user could not sign in"; return 1; }
            curl -s $C -b /tmp/jar "$B/browser/js/utils.js" > /tmp/utils.js
            X=$(csrf /tmp/utils.js); [ -n "$X" ] || { echo "no CSRF token in utils.js"; return 1; }
            curl -s $C -b /tmp/jar -e "$B/browser/" -H "X-pgA-CSRFToken: $X" "$B/browser/server/obj/1/" > /tmp/servers.json
            jq -e '[.[]? | .name] | index("gate-pg")' /tmp/servers.json >/dev/null \
              || { echo "the pre-registered server is missing: $(head -c 400 /tmp/servers.json)"; return 1; }
            SID=$(jq -r '.[] | select(.name=="gate-pg") | .id' /tmp/servers.json)
            curl -s $C -b /tmp/jar -e "$B/browser/" -H "X-pgA-CSRFToken: $X" -H 'Content-Type: application/json' \
              -d '{"password":"Quench-CI-Pg-2026","save_password":true}' "$B/browser/server/connect/1/$SID" > /tmp/connect.json
            jq -e '.data.connected == true' /tmp/connect.json >/dev/null || { echo "connecting failed: $(head -c 400 /tmp/connect.json)"; return 1; }
          }
          fwd managed
          # the config DB (user, servers) lives on the volume: it survives a pod restart, and servers.json is not loaded twice
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=pgadmin4 --wait=true
          kubectl rollout status deployment/rtest-pgadmin4 --timeout=600s
          kept() {
            managed || return 1
            [ "$(jq '[.[] | select(.name=="gate-pg")] | length' /tmp/servers.json)" = 1 ] || { echo "servers.json was loaded twice"; return 1; }
          }
          fwd kept
          # native TLS from gunicorn on the same Service port, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --reuse-values --set tls.enabled=true --wait --timeout 15m
          kubectl rollout status deployment/rtest-pgadmin4 --timeout=600s
          kubectl get secret rtest-pgadmin4-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/pga-ca.crt
          tlsgate() {
            kept || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:8080/misc/ping 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          C="--cacert /tmp/pga-ca.crt --resolve rtest-pgadmin4:8080:127.0.0.1"; B=https://rtest-pgadmin4:8080
          fwd tlsgate
          echo "pgadmin4: wrong password refused, first user signed in, pre-registered server connected to PostgreSQL, kept across a pod restart without duplicates, native TLS with plain HTTP refused: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/pgadmin4-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/pgadmin4@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/pgadmin4:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

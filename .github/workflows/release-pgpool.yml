name: release-pgpool

on:
  push:
    branches: [main]
    paths:
      - "quench/pgpool/**"
      - ".github/workflows/release-pgpool.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/pgpool
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled postgresql subchart into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-pgpool --timeout=540s
          # backend PG password (deterministic shared cred)
          PW="$(kubectl get secret rtest-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)"

          # Run a throwaway client pod to completion, then read its logs. Using a
          # non-interactive Never pod (not `kubectl run -i`) avoids the attach/TTY race
          # that can swallow output; PGPASSWORD keeps the secret off the command line.
          run_psql() {
            local name="$1"; shift
            kubectl delete pod "$name" --ignore-not-found --now >/dev/null 2>&1 || true
            kubectl run "$name" --restart=Never --image=ghcr.io/quenchworks/images/postgresql:18.4 \
              --env="PGPASSWORD=${PW}" --command -- \
              psql "host=rtest-pgpool port=9999 user=appuser dbname=appdb" "$@"
            kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/"$name" --timeout=120s \
              || { echo "client pod $name did not succeed"; kubectl logs "$name" || true; \
                   kubectl logs deployment/rtest-pgpool || true; return 1; }
            kubectl logs "$name"
          }

          # --- PROVE pooling end-to-end: the client authenticates to Pgpool-II over
          # SCRAM (pool_hba + pool_passwd) and Pgpool-II proxies the query to the
          # backend PostgreSQL, returning 1. A tcpSocket probe would pass even with a
          # dead backend, so this is the check that actually gates the release. ---
          run_psql pgclient -tAc 'SELECT 1;' | tee /tmp/pool.out
          grep -qx '1' /tmp/pool.out

          # --- SHOW POOL_NODES is a Pgpool-II-only command answered by the pooler
          # itself: it proves we are really talking to Pgpool-II (not a bare TCP
          # forward) and that it considers the backend node "up". ---
          run_psql pgnodes -c 'SHOW POOL_NODES;' | tee /tmp/nodes.out
          grep -q 'rtest-postgresql' /tmp/nodes.out
          grep -q 'up' /tmp/nodes.out

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/pgpool-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/pgpool@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/pgpool:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

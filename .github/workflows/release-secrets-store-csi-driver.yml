name: release-secrets-store-csi-driver

on:
  push:
    branches: [main]
    paths:
      - "quench/secrets-store-csi-driver/**"
      - ".github/workflows/release-secrets-store-csi-driver.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/secrets-store-csi-driver
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -n kube-system -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 5m
          sel=app.kubernetes.io/instance=rtest
          kubectl -n kube-system rollout status "$(kubectl -n kube-system get ds -l "$sel" -o name)" --timeout=180s
          kubectl get csidriver secrets-store.csi.k8s.io
          imgs="$(kubectl -n kube-system get pods -l "$sel" -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' | sort -u)"
          echo "$imgs"
          ! grep -v '^ghcr.io/quenchworks/images/[a-z-]*@sha256:' <<<"$imgs"

          # Upstream's e2e mock provider from the same tag, test only (never published).
          ver="$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          mkdir -p /tmp/sscsi && curl -fsSL "https://github.com/kubernetes-sigs/secrets-store-csi-driver/archive/refs/tags/v${ver}.tar.gz" | tar xz -C /tmp/sscsi --strip-components=1
          docker run --rm -v /tmp/sscsi:/src -w /src/test/e2eprovider -e CGO_ENABLED=0 golang:1.26 go build -tags e2e -o e2e-provider .
          printf 'FROM scratch\nCOPY e2e-provider /e2e-provider\nENTRYPOINT ["/e2e-provider"]\n' > /tmp/sscsi/test/e2eprovider/Dockerfile.gate
          docker build -t e2e-provider:gate -f /tmp/sscsi/test/e2eprovider/Dockerfile.gate /tmp/sscsi/test/e2eprovider
          kind load docker-image e2e-provider:gate --name chart-testing
          sed 's|replace/this/image/at/build/time|e2e-provider:gate|; s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|' \
            /tmp/sscsi/test/e2eprovider/e2e-provider-installer.yaml | kubectl -n kube-system apply -f -
          kubectl -n kube-system rollout status daemonset/csi-secrets-store-e2e-provider --timeout=180s

          kubectl apply -f - <<'EOF'
          apiVersion: secrets-store.csi.x-k8s.io/v1
          kind: SecretProviderClass
          metadata: { name: e2e-provider, namespace: default }
          spec:
            provider: e2e-provider
            secretObjects:
              - secretName: foosecret
                type: Opaque
                data: [{ objectName: foo, key: username }]
            parameters:
              objects: |
                array:
                  - |
                    objectName: foo
                    objectVersion: v1
          ---
          apiVersion: v1
          kind: Pod
          metadata: { name: reader, namespace: default }
          spec:
            containers:
              - name: reader
                image: ghcr.io/quenchworks/images/busybox:1.38.0
                command: [sleep, "3600"]
                volumeMounts: [{ name: secrets, mountPath: /mnt/secrets-store, readOnly: true }]
            volumes:
              - name: secrets
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes: { secretProviderClass: e2e-provider }
          EOF
          kubectl wait --for=condition=Ready pod/reader --timeout=180s
          got="$(kubectl exec reader -- cat /mnt/secrets-store/foo)"
          echo "mounted foo: $got"
          test "$got" = secret
          for i in $(seq 1 30); do kubectl get secret foosecret >/dev/null 2>&1 && break; sleep 2; done
          synced="$(kubectl get secret foosecret -o jsonpath='{.data.username}' | base64 -d)"
          echo "synced Secret foosecret.username: $synced"
          test "$synced" = secret
          kubectl get secretproviderclasspodstatuses -n default
          echo "Secrets Store CSI Driver: secret mounted from the provider and synced to a Secret: ok"

      # A failed install gate otherwise reports only a timeout; keep the driver's side of it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n kube-system describe ds || true
          kubectl describe pod reader || true
          for p in $(kubectl -n kube-system get pods -l app.kubernetes.io/instance=rtest -o name) $(kubectl -n kube-system get pods -l app=csi-secrets-store-e2e-provider -o name); do
            for c in $(kubectl -n kube-system get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c]"; kubectl -n kube-system logs "$p" -c "$c" --tail=200 || true
            done
          done
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true

      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/secrets-store-csi-driver-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/secrets-store-csi-driver@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/secrets-store-csi-driver:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

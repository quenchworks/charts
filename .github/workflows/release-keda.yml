name: release-keda

on:
  push:
    branches: [main]
    paths:
      - "quench/keda/**"
      - ".github/workflows/release-keda.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/keda
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # CRDs install from crds/ before the templates; both deployments must
          # reach Ready under --wait.
          helm install rtest "${CHART_DIR}" -n keda --create-namespace \
            -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-keda-operator -n keda --timeout=300s
          kubectl rollout status deployment/rtest-keda-metrics-apiserver -n keda --timeout=300s

          # Ready pods do NOT prove the adapter serves. The aggregation layer has
          # to reach it over TLS and accept its certificate, which is what
          # Available=True on the APIService means. This is the single most common
          # KEDA misconfiguration.
          for i in $(seq 1 30); do
            avail="$(kubectl get apiservice v1beta1.external.metrics.k8s.io \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')"
            [ "$avail" = "True" ] && break
            sleep 5
          done
          test "$avail" = "True"
          # ...and it answers a real discovery request through the aggregator.
          kubectl get --raw /apis/external.metrics.k8s.io/v1beta1 | grep -q externalmetrics

          # CR round-trip: a cron trigger needs no external system. KEDA must
          # reconcile the ScaledObject to Ready and create the backing HPA.
          kubectl create deployment demo --image registry.k8s.io/pause:3.10 -n keda
          kubectl apply -f - <<'EOF'
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata: { name: demo, namespace: keda }
          spec:
            scaleTargetRef: { name: demo }
            minReplicaCount: 1
            maxReplicaCount: 5
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 6 * * *", end: "0 20 * * *", desiredReplicas: "3" }
          EOF
          kubectl wait --for=condition=Ready scaledobject/demo -n keda --timeout=180s
          kubectl get hpa keda-hpa-demo -n keda

          # Nothing may have crash-looped.
          test -z "$(kubectl get pods -n keda \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[?(@.restartCount!=0)].restartCount}{end}')"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/keda-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/keda@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/keda:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

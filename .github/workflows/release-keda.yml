name: release-keda

on:
  push:
    branches: [main]
    paths:
      - "quench/keda/**"
      - ".github/workflows/release-keda.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/keda
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # CRDs install from crds/ before the templates; both deployments must
          # reach Ready under --wait.
          helm install rtest "${CHART_DIR}" -n keda --create-namespace \
            -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-keda-operator -n keda --timeout=300s
          kubectl rollout status deployment/rtest-keda-metrics-apiserver -n keda --timeout=300s

          # Ready pods do NOT prove the adapter serves. The aggregation layer has
          # to reach it over TLS and accept its certificate, which is what
          # Available=True on the APIService means. This is the single most common
          # KEDA misconfiguration.
          for i in $(seq 1 30); do
            avail="$(kubectl get apiservice v1beta1.external.metrics.k8s.io \
              -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')"
            [ "$avail" = "True" ] && break
            sleep 5
          done
          test "$avail" = "True"
          # ...and it answers a real discovery request through the aggregator.
          kubectl get --raw /apis/external.metrics.k8s.io/v1beta1 | grep -q externalmetrics

          # CR round-trip: a cron trigger needs no external system. KEDA must
          # reconcile the ScaledObject to Ready and create the backing HPA.
          kubectl create deployment demo --image registry.k8s.io/pause:3.10 -n keda
          kubectl apply -f - <<'EOF'
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata: { name: demo, namespace: keda }
          spec:
            scaleTargetRef: { name: demo }
            minReplicaCount: 1
            maxReplicaCount: 5
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 6 * * *", end: "0 20 * * *", desiredReplicas: "3" }
          EOF
          kubectl wait --for=condition=Ready scaledobject/demo -n keda --timeout=180s
          kubectl get hpa keda-hpa-demo -n keda

          # Nothing may have crash-looped.
          test -z "$(kubectl get pods -n keda \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[?(@.restartCount!=0)].restartCount}{end}')"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/keda-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/keda@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/keda:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

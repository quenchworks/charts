name: release-netbox

on:
  push:
    branches: [main]
    paths:
      - "quench/netbox/**"
      - ".github/workflows/release-netbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/netbox
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 20m
          kubectl rollout status deployment/rtest-netbox --timeout=900s
          kubectl rollout status deployment/rtest-netbox-worker --timeout=600s
          fwd() { kubectl port-forward svc/rtest-netbox 8080:8080 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          C=""; B=http://127.0.0.1:8080; PW='Quench-CI-NetBox-2026!'
          J=(-H 'Content-Type: application/json' -H 'Accept: application/json')
          up() { for _ in $(seq 1 90); do [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/login/")" = 200 ] && return 0; sleep 2; done; echo "/login/ never answered"; return 1; }
          # v2 tokens authenticate as "Bearer nbt_<key>.<token>"
          auth() {
            curl -s $C "${J[@]}" -d "{\"username\":\"admin\",\"password\":\"$1\"}" "$B/api/users/tokens/provision/" > /tmp/tok.json
            jq -r 'if .version == 2 then "Bearer nbt_\(.key).\(.token)" elif .token then "Token \(.token)" else empty end' /tmp/tok.json
          }
          created() {
            up || return 1
            [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/static/netbox.css")" = 200 ] || { echo "static CSS not served"; return 1; }
            [ -z "$(auth wrong-password-1)" ] || { echo "a wrong password got a token"; return 1; }
            A=$(auth "$PW"); [ -n "$A" ] || { echo "the admin password got no token: $(cat /tmp/tok.json)"; return 1; }
            curl -s $C "${J[@]}" -H "Authorization: $A" -o /tmp/site.json -w '%{http_code}\n' \
              -d '{"name":"Quench Gate","slug":"quench-gate","status":"active"}' "$B/api/dcim/sites/" | grep -q '^201$' \
              || { echo "creating a site failed: $(cat /tmp/site.json)"; return 1; }
            curl -s $C "${J[@]}" -H "Authorization: $A" -o /tmp/pfx.json -w '%{http_code}\n' \
              -d '{"prefix":"10.42.0.0/24","status":"active"}' "$B/api/ipam/prefixes/" | grep -q '^201$' \
              || { echo "creating a prefix failed: $(cat /tmp/pfx.json)"; return 1; }
          }
          kept() {
            up || return 1
            A=$(auth "$PW"); [ -n "$A" ] || return 1
            curl -s $C "${J[@]}" -H "Authorization: $A" "$B/api/dcim/sites/?slug=quench-gate" > /tmp/s.json
            jq -e '.count == 1' /tmp/s.json >/dev/null || { echo "the site is missing: $(head -c 400 /tmp/s.json)"; return 1; }
            curl -s $C "${J[@]}" -H "Authorization: $A" "$B/api/ipam/prefixes/?prefix=10.42.0.0/24" > /tmp/p.json
            jq -e '.count == 1' /tmp/p.json >/dev/null || { echo "the prefix is missing: $(head -c 400 /tmp/p.json)"; return 1; }
          }
          fwd created
          # the data (PostgreSQL), the keys (Secret) and the admin survive a web pod restart; the init container reruns cleanly
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=netbox --wait=true
          kubectl rollout status deployment/rtest-netbox --timeout=900s
          fwd kept
          # native TLS from gunicorn on the same Service port, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 20m
          kubectl rollout status deployment/rtest-netbox --timeout=900s
          kubectl get secret rtest-netbox-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/nb-ca.crt
          tlsgate() {
            kept || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:8080/login/ 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          C="--cacert /tmp/nb-ca.crt --resolve rtest-netbox:8080:127.0.0.1"; B=https://rtest-netbox:8080
          fwd tlsgate
          echo "netbox: static CSS, wrong password refused, v2 token, a site and a prefix created and kept across a web pod restart, native TLS with plain HTTP refused: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/netbox-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/netbox@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/netbox:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

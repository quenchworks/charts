name: release-argo-workflows

on:
  push:
    branches: [main]
    paths:
      - "quench/argo-workflows/**"
      - ".github/workflows/release-argo-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/argo-workflows
  OCI_REPO: oci://ghcr.io/quenchworks/charts
  # A step image we publish ourselves. The gate must never reach for an upstream
  # example image (docker/whalesay and friends).
  STEP_IMAGE: ghcr.io/quenchworks/images/busybox@sha256:96bfb56285a65f978985de00bec071bb9e52d3c588cd26febed64ff36651c526

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-argo-workflows-controller --timeout=300s
          kubectl rollout status deployment/rtest-argo-workflows-server --timeout=300s

          # ---------------------------------------------------------------
          # The real gate: run a workflow. Ready pods prove nothing here --
          # the controller injects the argoexec executor into every workflow
          # pod, and if that image is wrong or missing the workflow sits in
          # Pending/Error while both Deployments stay perfectly healthy.
          # ---------------------------------------------------------------
          cat <<EOF | kubectl create -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            name: smoke
          spec:
            entrypoint: main
            templates:
              - name: main
                container:
                  image: ${STEP_IMAGE}
                  command: ["/bin/sh", "-c"]
                  args: ["echo QUENCHWORKS-ARGO-SMOKE-OK"]
          EOF

          for i in $(seq 1 60); do
            phase="$(kubectl get workflow smoke -o jsonpath='{.status.phase}' || true)"
            echo "t=$((i*5))s phase=${phase:-<none>}"
            case "$phase" in
              Succeeded) break ;;
              Failed|Error)
                kubectl get workflow smoke -o yaml
                kubectl describe pod smoke || true
                echo "workflow did not succeed (phase=$phase)"; exit 1 ;;
            esac
            sleep 5
          done

          test "$(kubectl get workflow smoke -o jsonpath='{.status.phase}')" = "Succeeded"
          # the step really ran: its own stdout must be in the pod log
          kubectl logs smoke -c main | tee /tmp/step.log
          grep -q QUENCHWORKS-ARGO-SMOKE-OK /tmp/step.log
          # and it ran from OUR executor image, not quay.io
          kubectl get pod smoke -o jsonpath='{.spec.initContainers[0].image}' | tee /tmp/exec.img
          grep -q '^ghcr.io/quenchworks/images/argo-workflows@sha256:' /tmp/exec.img

          # the server answers with real JSON over the Service
          kubectl port-forward svc/rtest-argo-workflows-server 2746:2746 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          curl -fsS http://127.0.0.1:2746/api/v1/info | tee /tmp/info.json
          grep -q '{' /tmp/info.json
          curl -fsS http://127.0.0.1:2746/api/v1/workflows/default | grep -q '"name":"smoke"'

          # nothing crash-looped
          test -z "$(kubectl get pods -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{"\n"}{end}{end}' | grep -v '^0$')"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/argo-workflows-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/argo-workflows@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/argo-workflows:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

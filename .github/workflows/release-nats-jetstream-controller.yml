name: release-nats-jetstream-controller

on:
  push:
    branches: [main]
    paths:
      - "quench/nats-jetstream-controller/**"
      - ".github/workflows/release-nats-jetstream-controller.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/nats-jetstream-controller
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The NATS server NACK manages: our nats chart, JetStream on by default.
          helm dependency build quench/nats
          helm install nats quench/nats --wait --timeout 10m
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-nats-jetstream-controller --timeout=300s

          # --- PROVE NACK CREATES JETSTREAM OBJECTS ON THE SERVER AND REMOVES THEM. ---
          test "$(kubectl get crd -o name | grep -c 'jetstream.nats.io')" -eq 6
          kubectl apply -f - <<'YAML'
          apiVersion: jetstream.nats.io/v1beta2
          kind: Stream
          metadata: { name: gate }
          spec: { name: gate, subjects: ["gate.>"], storage: memory, maxAge: 1h }
          ---
          apiVersion: jetstream.nats.io/v1beta2
          kind: Consumer
          metadata: { name: gate-worker }
          spec: { streamName: gate, durableName: gate-worker, ackPolicy: explicit }
          ---
          apiVersion: jetstream.nats.io/v1beta2
          kind: KeyValue
          metadata: { name: gate-kv }
          spec: { bucket: gate-kv, history: 3 }
          YAML
          ready() { kubectl get "$1" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null; }
          for r in stream/gate consumer/gate-worker keyvalue/gate-kv; do
            for i in $(seq 1 60); do [ "$(ready $r)" = True ] && break; sleep 3; done
            test "$(ready $r)" = True || { kubectl get "$r" -o yaml | tail -25; echo "FAIL: $r not Ready"; exit 1; }
          done
          echo "Stream, Consumer and KeyValue created on the NATS server (Ready=True)"

          # The stream really exists on the server: NATS reports it in /jsz (pretty-printed JSON).
          rm -f /tmp/pf.log
          kubectl port-forward "$(kubectl get pod -l app.kubernetes.io/instance=nats -o name | head -1)" 18222:8222 >/tmp/pf.log 2>&1 & pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from' /tmp/pf.log && break; sleep 1; done
          for i in $(seq 1 20); do
            js="$(curl -fsS 'http://127.0.0.1:18222/jsz?streams=true&consumers=true' || true)"
            grep -qE '"name": ?"gate"' <<<"$js" && break; sleep 2
          done
          grep -qE '"name": ?"gate"' <<<"$js" || { echo "FAIL: stream gate not on the server: ${js:0:300}"; exit 1; }
          grep -qE '"name": ?"gate-worker"' <<<"$js" || { echo "FAIL: consumer gate-worker not on the server"; exit 1; }
          echo "NATS /jsz lists stream gate and consumer gate-worker"

          # Deleting the resources deletes them on the server.
          kubectl delete consumer gate-worker --wait
          kubectl delete stream gate --wait
          for i in $(seq 1 30); do
            js="$(curl -fsS 'http://127.0.0.1:18222/jsz?streams=true' || true)"
            grep -qE '"name": ?"gate"' <<<"$js" || break; sleep 2
          done
          ! grep -qE '"name": ?"gate"' <<<"$js" || { echo "FAIL: stream gate still on the server after delete"; exit 1; }
          echo "deleting the Stream removed it from the server"

          restarts="$(kubectl get pods -l app.kubernetes.io/instance=rtest -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: the controller restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/nats-jetstream-controller-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/nats-jetstream-controller@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/nats-jetstream-controller:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-healthchecks

on:
  push:
    branches: [main]
    paths:
      - "quench/healthchecks/**"
      - ".github/workflows/release-healthchecks.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/healthchecks
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-healthchecks --timeout=300s
          fwd() { kubectl port-forward svc/rtest-healthchecks 8000:8000 >/tmp/pf.log 2>&1 & local pf=$!; for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/health 2>/dev/null && break; sleep 1; done; "$@"; local rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          # SITE_ROOT is http://localhost:8000, so Django accepts only that host
          H=http://localhost:8000
          hcpy() { kubectl exec deploy/rtest-healthchecks -c healthchecks -- python manage.py shell -c "$1"; }
          gate1() {
            rm -f /tmp/jar
            tok="$(curl -fsS -c /tmp/jar "$H/accounts/login/" | grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' | cut -d'"' -f4)"
            [ -n "$tok" ] || { echo "no CSRF token on the login page"; return 1; }
            # the admin from the init container: a good login redirects, a bad one shows the form
            code="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar -c /tmp/jar -e "$H/accounts/login/" \
              --data-urlencode csrfmiddlewaretoken="$tok" -d action=login --data-urlencode email=admin@example.com \
              --data-urlencode password=quench-ci-admin-pass "$H/accounts/login/")"
            [ "$code" = 302 ] || { echo "admin login answered $code"; return 1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar "$H/accounts/profile/")" = 200 ] || { echo "profile page after login is not 200"; return 1; }
            uuid="$(hcpy "from hc.api.models import Check; from hc.accounts.models import Project; print(Check.objects.create(project=Project.objects.get(owner__email='admin@example.com'), name='gate').code)" | tail -1)"
            echo "$uuid" > /tmp/uuid
            curl -fsS "$H/ping/$uuid" | grep -q OK || { echo "ping failed"; return 1; }
          }
          up() { hcpy "from hc.api.models import Check; print(Check.objects.get(code='$(cat /tmp/uuid)').status)" | tail -1 | grep -qx up; }
          fwd gate1
          up || { echo "the pinged check is not up"; exit 1; }
          # SQLite on the PVC: the check must survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-healthchecks --timeout=300s
          up || { echo "the check did not survive the pod restart"; exit 1; }
          # native TLS on the same port: HTTPS answers, plain HTTP does not, the check is still there
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true \
            --set siteRoot=https://localhost:8000 --wait --timeout 8m
          kubectl rollout status deployment/rtest-healthchecks --timeout=300s
          tlsgate() {
            for _ in $(seq 1 20); do curl -kfsS -o /dev/null https://localhost:8000/health 2>/dev/null && break; sleep 1; done
            curl -kfsS https://localhost:8000/health >/dev/null || { echo "no HTTPS after the TLS upgrade"; return 1; }
            ! curl -fsS -o /dev/null http://localhost:8000/health 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
            curl -kfsS "https://localhost:8000/ping/$(cat /tmp/uuid)" | grep -q OK || { echo "ping over HTTPS failed"; return 1; }
          }
          kubectl port-forward svc/rtest-healthchecks 8000:8000 >/tmp/pf.log 2>&1 & pf=$!
          tlsgate; rc=$?; kill $pf 2>/dev/null || true; [ $rc = 0 ] || exit 1
          up || { echo "the check did not survive the TLS upgrade"; exit 1; }
          echo "healthchecks: admin from the init container logs in, a pinged check is up and kept across a pod restart and a native-TLS upgrade: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/healthchecks-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/healthchecks@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/healthchecks:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-langflow

on:
  push:
    branches: [main]
    paths:
      - "quench/langflow/**"
      - ".github/workflows/release-langflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/langflow
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-langflow --timeout=900s
          fwd() { kubectl port-forward svc/rtest-langflow 7860:7860 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:7860
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          token() { curl -fsS -d "username=admin&password=Quench-CI-Langflow-2026" "$B/api/v1/login" | jq -r .access_token; }
          checks() {
            grep -q '"version":"1.13.3"' <<<"$(curl -fsS "$B/api/v1/version")" || { echo "version API"; return 1; }
            grep -qi langflow <<<"$(curl -fsS "$B/")" || { echo "React UI not served"; return 1; }
            [ "$(code "$B/api/v1/auto_login")" != 200 ] || { echo "auto-login is on"; return 1; }
            [ "$(code -d 'username=admin&password=wrong-password-1' "$B/api/v1/login")" = 401 ] || { echo "wrong password accepted"; return 1; }
            T=$(token); [ -n "$T" ] && [ "$T" != null ] || { echo "superuser login failed"; return 1; }
            # the flow is stored in the bundled PostgreSQL
            curl -fsS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
              -d '{"name":"quench-gate","description":"gate","data":{"nodes":[],"edges":[]}}' "$B/api/v1/flows/" | jq -r .id > /tmp/fid
            [ -n "$(cat /tmp/fid)" ] && [ "$(cat /tmp/fid)" != null ] || { echo "flow not created"; return 1; }
          }
          readback() {
            T=$(token)
            grep -q quench-gate <<<"$(curl -fsS -H "Authorization: Bearer $T" "$B/api/v1/flows/$(cat /tmp/fid)")" || { echo "flow $(cat /tmp/fid) not found"; return 1; }
          }
          fwd checks
          pgpw=$(kubectl get secret rtest-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)
          n=$(kubectl exec rtest-postgresql-0 -- env PGPASSWORD="$pgpw" psql -h 127.0.0.1 -U langflow -d langflow_db -tAc "select count(*) from flow where name = 'quench-gate'")
          [ "$n" = 1 ] || { echo "the flow is not in PostgreSQL ($n)"; exit 1; }
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=langflow --wait=true
          kubectl rollout status deployment/rtest-langflow --timeout=900s
          fwd readback
          # the generated secret key is kept on upgrade (stored provider credentials stay readable)
          before=$(kubectl get secret rtest-langflow -o jsonpath='{.data.secret-key}')
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          [ "$(kubectl get secret rtest-langflow -o jsonpath='{.data.secret-key}')" = "$before" ] || { echo "upgrade rotated the secret key"; exit 1; }
          echo "langflow: version, UI, auto-login off, wrong password 401, superuser login, a flow stored in PostgreSQL and read back after a pod restart, secret key kept on upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/langflow-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/langflow@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/langflow:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

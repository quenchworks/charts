name: release-rekor-tiles

on:
  push:
    branches: [main]
    paths:
      - "quench/rekor-tiles/**"
      - ".github/workflows/release-rekor-tiles.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/rekor-tiles
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-rekor-tiles --timeout=300s
          test "$(kubectl get pvc data-rtest-rekor-tiles-0 -o jsonpath='{.status.phase}')" = Bound
          uid="$(kubectl get pod rtest-rekor-tiles-0 -o jsonpath='{.spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"; test "$uid" = "1001"
          pf() { kubectl port-forward svc/rtest-rekor-tiles 3000:3000 8080:8080 >/tmp/pf.log 2>&1 & echo $!; }
          PF=$(pf); sleep 5
          curl -fsS http://127.0.0.1:3000/healthz | grep -F '"status":"SERVING"'
          # an ECDSA-signed hashedrekord entry
          entry() {
            echo "$1" > /tmp/art
            openssl ecparam -name prime256v1 -genkey -noout -out /tmp/ec.pem
            openssl dgst -sha256 -sign /tmp/ec.pem -out /tmp/art.sig /tmp/art
            printf '{"hashedRekordRequestV002":{"digest":"%s","signature":{"content":"%s","verifier":{"publicKey":{"rawBytes":"%s"},"keyDetails":"PKIX_ECDSA_P256_SHA_256"}}}}' \
              "$(openssl dgst -sha256 -binary /tmp/art | base64 -w0)" "$(base64 -w0 /tmp/art.sig)" \
              "$(openssl ec -in /tmp/ec.pem -pubout -outform DER 2>/dev/null | base64 -w0)" > /tmp/req.json
            curl -fsS -X POST -H 'Content-Type: application/json' --data @/tmp/req.json http://127.0.0.1:3000/api/v2/log/entries
          }
          # the read server publishes a checkpoint for our origin at the given size
          checkpoint() {
            for i in $(seq 1 30); do
              cp="$(curl -fsS http://127.0.0.1:8080/checkpoint 2>/dev/null)" || cp=""
              [ "$(sed -n 1p <<<"$cp")" = rekor.gate ] && [ "$(sed -n 2p <<<"$cp")" = "$1" ] && { echo "checkpoint: $(head -2 <<<"$cp" | tr '\n' ' ')"; return 0; }
              sleep 1
            done
            echo "no checkpoint of size $1: $cp"; return 1
          }
          r="$(entry first)"; echo "${r:0:120}"; grep -qF '"logIndex":"0"' <<<"$r"
          checkpoint 1
          kill $PF
          # the log and its key are on the PVC and in the Secret: restart and append
          kubectl delete pod rtest-rekor-tiles-0 --wait
          kubectl rollout status statefulset/rtest-rekor-tiles --timeout=300s
          PF=$(pf); sleep 5
          checkpoint 1
          r="$(entry second)"; echo "${r:0:120}"; grep -qF '"logIndex":"1"' <<<"$r"
          checkpoint 2
          echo "log survived a restart"
          kill $PF
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/rekor-tiles-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/rekor-tiles@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/rekor-tiles:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

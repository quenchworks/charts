name: release-komga

on:
  push:
    branches: [main]
    paths:
      - "quench/komga/**"
      - ".github/workflows/release-komga.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/komga
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # a one-page comic on the kind node, mounted read-only as the media
          node=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > /tmp/001.png
          (cd /tmp && zip -q gate.cbz 001.png)
          docker exec "$node" mkdir -p /srv/komga-gate/Gate
          docker cp /tmp/gate.cbz "$node:/srv/komga-gate/Gate/Gate 01.cbz"
          docker exec "$node" chmod -R a+rX /srv/komga-gate
          SET="--set media.hostPath=/srv/komga-gate"
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" $SET --wait --wait-for-jobs --timeout 12m
          kubectl rollout status deployment/rtest-komga --timeout=600s
          U=admin@quench-works.com PW=Quench-CI-komga-2026
          fwd() { kubectl port-forward svc/rtest-komga 25600:25600 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          # api <base> <user:pass> <path> [curl args]: prints the status, body in /tmp/k.out
          api() { local b=$1 a=$2 p=$3; shift 3; curl -s -o /tmp/k.out -w '%{http_code}' $CURL -u "$a" "$@" "$b$p"; }
          gate() {
            local b=$1
            for _ in $(seq 1 90); do [ "$(curl -s -o /tmp/k.out -w '%{http_code}' $CURL "$b/api/v1/claim")" = 200 ] && break; sleep 2; done
            grep -q '"isClaimed" *: *true' /tmp/k.out || { echo "the server was not claimed: $(cat /tmp/k.out)"; return 1; }
            [ "$(api "$b" "$U:wrong-password-1" /api/v2/users/me)" = 401 ] || { echo "a wrong password was not refused"; return 1; }
            [ "$(api "$b" "$U:$PW" /api/v2/users/me)" = 200 ] || { echo "the admin was refused: $(cat /tmp/k.out)"; return 1; }
          }
          book() {
            local b=$1 n id
            for _ in $(seq 1 60); do
              [ "$(api "$b" "$U:$PW" "/api/v1/books?library_id=$(cat /tmp/libid)")" = 200 ] && n=$(jq -r .totalElements /tmp/k.out) && [ "$n" = 1 ] && break
              sleep 2
            done
            [ "$n" = 1 ] || { echo "the library holds ${n:-no} books, want 1"; return 1; }
            id=$(jq -r '.content[0].id' /tmp/k.out)
            for _ in $(seq 1 30); do [ "$(api "$b" "$U:$PW" "/api/v1/books/$id/thumbnail")" = 200 ] && break; sleep 2; done
            [ "$(head -c 2 /tmp/k.out | od -An -tx1 | tr -d ' ')" = ffd8 ] || { echo "no JPEG thumbnail for the book"; return 1; }
          }
          addlib() {
            gate "$1" || return 1
            [ "$(api "$1" "$U:$PW" /api/v1/libraries -H 'Content-Type: application/json' -d '{"name":"Gate","root":"/media"}')" = 200 ] || { echo "library refused: $(cat /tmp/k.out)"; return 1; }
            jq -r .id /tmp/k.out > /tmp/libid
            book "$1" || return 1
          }
          again() { gate "$1" && book "$1"; }
          CURL="" fwd addlib http://127.0.0.1:25600
          # the account, library and book (SQLite on the PVC) survive a pod restart
          kubectl delete pod -l app.kubernetes.io/name=komga,app.kubernetes.io/component!=claim --wait=true
          kubectl rollout status deployment/rtest-komga --timeout=600s
          CURL="" fwd again http://127.0.0.1:25600
          # native TLS on the same port from the Helm-made PEM pair; the claim Job reruns and verifies it against the CA
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" $SET --set tls.enabled=true --wait --wait-for-jobs --timeout 12m
          kubectl rollout status deployment/rtest-komga --timeout=600s
          kubectl get secret rtest-komga-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/k-ca.crt
          tlsgate() {
            again https://rtest-komga:25600 || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:25600/api/v1/claim 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          CURL="--cacert /tmp/k-ca.crt --resolve rtest-komga:25600:127.0.0.1" fwd tlsgate
          echo "komga: claimed by the hook Job (over verified TLS on upgrade), wrong password refused, media library scanned into a book with a JPEG thumbnail, kept across a pod restart, native TLS: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/komga-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/komga@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/komga:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

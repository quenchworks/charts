name: release-loki

on:
  push:
    branches: [main]
    paths:
      - "quench/loki/**"
      - ".github/workflows/release-loki.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/loki
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-loki --timeout=420s
          # probe the HTTP API over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward rtest-loki-0 3100:3100 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # /ready returns 503 until single-binary startup completes; poll it.
          ok=""
          for i in $(seq 1 30); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ready || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok"   # fail loudly if /ready never reported 200
          curl -fsS http://127.0.0.1:3100/ready    # -> "ready"
          curl -fsS http://127.0.0.1:3100/metrics >/dev/null
          # round-trip a log line: push then query it back via LogQL.
          ts="$(date +%s)000000000"
          curl -fsS -H 'Content-Type: application/json' \
            -XPOST 'http://127.0.0.1:3100/loki/api/v1/push' \
            --data-raw '{"streams":[{"stream":{"app":"citest"},"values":[["'"$ts"'","ci hello loki"]]}]}'
          got=""
          for i in $(seq 1 24); do
            out="$(curl -fsS -G 'http://127.0.0.1:3100/loki/api/v1/query_range' --data-urlencode 'query={app="citest"}')" || true
            echo "$out"
            if echo "$out" | grep -q 'ci hello loki'; then got=1; break; fi
            sleep 5
          done
          test -n "$got"   # fail loudly if the pushed line never came back

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/loki-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/loki@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/loki:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

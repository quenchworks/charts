name: release-scylladb

on:
  push:
    branches: [main]
    paths:
      - "quench/scylladb/**"
      - ".github/workflows/release-scylladb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/scylladb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          # Readiness gates on the unauthenticated REST API
          # (GET /storage_service/scylla_release_version :10000), so a Ready pod has
          # already proven the REST health endpoint works. The REST port is firewalled
          # to Scylla's own pods by the NetworkPolicy, so we don't probe it from a
          # throwaway pod here (that would fight our own policy) — readiness covers it.
          kubectl rollout status statefulset/rtest-scylladb --timeout=600s
          # The Wolfi runtime image has no in-image cqlsh, so verify a real CQL
          # roundtrip with a throwaway upstream client against the in-cluster service
          # (CQL on 9042 is the client-facing port the NetworkPolicy allows). Readiness
          # gates on the REST API, which comes up a few seconds before the CQL server
          # accepts queries, so retry the roundtrip until CQL is actually serving.
          # ScyllaDB 2026.2 enables tablets by default, and tablet keyspaces reject
          # SimpleStrategy ("SimpleStrategy doesn't support tablet replication"), so the
          # CREATE KEYSPACE must use NetworkTopologyStrategy (works single- and multi-node).
          CQL="CREATE KEYSPACE IF NOT EXISTS gate WITH replication={'class':'NetworkTopologyStrategy','replication_factor':1}; CREATE TABLE IF NOT EXISTS gate.t(id int PRIMARY KEY, v text); INSERT INTO gate.t(id,v) VALUES (1,'quench'); SELECT v FROM gate.t WHERE id=1;"
          ok=""
          for i in $(seq 1 12); do
            out="$(kubectl run "cqlclient-${i}" --rm -i --restart=Never --image=scylladb/scylla:6.2 --command -- \
              cqlsh rtest-scylladb 9042 --connect-timeout=20 --request-timeout=30 -e "$CQL" 2>&1 || true)"
            echo "attempt ${i}:"; echo "$out"
            if echo "$out" | grep -q quench; then ok=1; break; fi
            echo "CQL not ready yet, retrying in 15s..."; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::CQL roundtrip did not return the expected value"; exit 1; }

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Diagnostics on install-gate failure
        if: failure()
        run: |
          # Runs ONLY when an earlier step failed (typically the install gate).
          # Dumps enough in-cluster state to root-cause a rollout timeout, CrashLoop,
          # or failed CQL roundtrip from the CI log alone. `|| true` keeps the step
          # going so we always get the full picture even if one call errors.
          echo "::group::pods + events (all namespaces)"
          kubectl get pods,events -A -o wide || true
          echo "::endgroup::"
          echo "::group::describe statefulset/rtest-scylladb"
          kubectl describe statefulset/rtest-scylladb || true
          echo "::endgroup::"
          for p in $(kubectl get pods -l app.kubernetes.io/name=scylladb -o name 2>/dev/null); do
            echo "::group::describe ${p}"
            kubectl describe "${p}" || true
            echo "::endgroup::"
            echo "::group::logs ${p} (current)"
            kubectl logs "${p}" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::logs ${p} (previous / crashed)"
            kubectl logs "${p}" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/scylladb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/scylladb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/scylladb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

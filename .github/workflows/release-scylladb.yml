name: release-scylladb

on:
  push:
    branches: [main]
    paths:
      - "quench/scylladb/**"
      - ".github/workflows/release-scylladb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/scylladb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          # Readiness gates on the unauthenticated REST API
          # (GET /storage_service/scylla_release_version :10000), so a Ready pod has
          # already proven the REST health endpoint works. The REST port is firewalled
          # to Scylla's own pods by the NetworkPolicy, so we don't probe it from a
          # throwaway pod here (that would fight our own policy) — readiness covers it.
          kubectl rollout status statefulset/rtest-scylladb --timeout=600s
          # The Wolfi runtime image has no in-image cqlsh, so verify a real CQL
          # roundtrip with a throwaway upstream client against the in-cluster service
          # (CQL on 9042 is the client-facing port the NetworkPolicy allows).
          out="$(kubectl run cqlclient --rm -i --restart=Never --image=scylladb/scylla:6.2 --command -- \
            cqlsh rtest-scylladb 9042 -e "CREATE KEYSPACE IF NOT EXISTS gate WITH replication={'class':'SimpleStrategy','replication_factor':1}; CREATE TABLE IF NOT EXISTS gate.t(id int PRIMARY KEY, v text); INSERT INTO gate.t(id,v) VALUES (1,'quench'); SELECT v FROM gate.t WHERE id=1;" 2>&1)"
          echo "$out"
          echo "$out" | grep -q quench || { echo "::error::CQL roundtrip did not return the expected value"; exit 1; }

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/scylladb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/scylladb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/scylladb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

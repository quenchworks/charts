name: release-argo-events

on:
  push:
    branches: [main]
    paths:
      - "quench/argo-events/**"
      - ".github/workflows/release-argo-events.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/argo-events
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 5m
          kubectl wait --for=condition=Established crd/eventbus.argoproj.io crd/eventsources.argoproj.io crd/sensors.argoproj.io --timeout=60s
          cat > /tmp/gate.yaml <<'YAML'
          apiVersion: argoproj.io/v1alpha1
          kind: EventBus
          metadata: { name: default }
          spec:
            jetstream:
              version: latest
              securityContext: { fsGroup: 1001 }
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: EventSource
          metadata: { name: gate }
          spec:
            service:
              ports: [{ port: 12000, targetPort: 12000 }]
            webhook:
              hook: { port: "12000", endpoint: /hook, method: POST }
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata: { name: gate-sensor }
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata: { name: gate-sensor }
          rules:
            - { apiGroups: [""], resources: [configmaps], verbs: [create, get] }
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata: { name: gate-sensor }
          roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: gate-sensor }
          subjects: [{ kind: ServiceAccount, name: gate-sensor }]
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: Sensor
          metadata: { name: gate }
          spec:
            template: { serviceAccountName: gate-sensor }
            dependencies:
              - { name: hook, eventSourceName: gate, eventName: hook }
            triggers:
              - template:
                  name: make-configmap
                  k8s:
                    operation: create
                    source:
                      resource:
                        apiVersion: v1
                        kind: ConfigMap
                        metadata: { name: gate-fired }
                        data: { from: argo-events }
          YAML
          kubectl apply -f /tmp/gate.yaml
          # the JetStream EventBus runs on the QuenchWorks nats image
          for i in $(seq 1 60); do kubectl get statefulset eventbus-default-js >/dev/null 2>&1 && break; sleep 2; done
          kubectl rollout status statefulset/eventbus-default-js --timeout=300s
          # every EventBus container is a QuenchWorks image: nats, reloader and exporter
          imgs="$(kubectl get statefulset eventbus-default-js -o jsonpath='{range .spec.template.spec.containers[*]}{.image}{"\n"}{end}')"
          echo "$imgs"
          test "$(echo "$imgs" | grep -c .)" = 3
          ! echo "$imgs" | grep -v '^ghcr.io/quenchworks/images/'
          # and the reloader and exporter are running beside nats
          kubectl get pod eventbus-default-js-0 -o jsonpath='{.status.containerStatuses[*].ready}' | grep -qv false
          for d in gate-eventsource gate-sensor; do
            for i in $(seq 1 60); do kubectl get deploy -l "$( [ $d = gate-eventsource ] && echo eventsource-name=gate || echo sensor-name=gate )" -o name | grep -q . && break; sleep 2; done
          done
          kubectl wait --for=condition=Available deploy -l eventsource-name=gate --timeout=180s
          kubectl wait --for=condition=Available deploy -l sensor-name=gate --timeout=180s
          kubectl port-forward svc/gate-eventsource-svc 12000:12000 >/dev/null 2>&1 &
          # POST until the webhook accepts (it opens once the bus connection is up)
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"gate":true}' http://127.0.0.1:12000/hook)" = 200 ] && break
            sleep 2
          done
          # the event crossed the bus and the sensor's trigger created the ConfigMap
          for i in $(seq 1 60); do kubectl get configmap gate-fired >/dev/null 2>&1 && break; sleep 2; done
          test "$(kubectl get configmap gate-fired -o jsonpath='{.data.from}')" = argo-events
          ! kubectl logs deployment/rtest-argo-events-controller | grep -E '"level":"fatal"|panic:'
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl get eventbus,eventsource,sensor -o yaml | tail -80 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/argo-events-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/argo-events@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/argo-events:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

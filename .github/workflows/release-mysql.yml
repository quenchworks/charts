name: release-mysql

on:
  push:
    branches: [main]
    paths:
      - "quench/mysql/**"
      - ".github/workflows/release-mysql.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mysql
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          # lint + template BOTH topologies
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/standalone-values.yaml"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/standalone-values.yaml" >/dev/null
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          # default-values.yaml is the 3-node Group Replication (single-primary) HA gate.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          # 3-node OrderedReady: node-0 bootstraps, then nodes 1 and 2 join via distributed
          # recovery one at a time, so allow ample time for the sequential join.
          kubectl rollout status statefulset/rtest-mysql --timeout=420s
          pw=$(kubectl get secret rtest-mysql -o jsonpath='{.data.mysql-root-password}' | base64 -d)
          Q="SELECT MEMBER_STATE, MEMBER_ROLE FROM performance_schema.replication_group_members"
          # prove a real single-primary group: 3 ONLINE members with exactly 1 PRIMARY.
          for i in $(seq 1 30); do
            online=$(kubectl exec rtest-mysql-0 -- mysql --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" -N -B -e "$Q" 2>/dev/null | grep -c ONLINE || true)
            [ "$online" = "3" ] && break
            sleep 6
          done
          out=$(kubectl exec rtest-mysql-0 -- mysql --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" -N -B -e "$Q")
          echo "$out"
          [ "$(echo "$out" | grep -c ONLINE)" = "3" ]
          [ "$(echo "$out" | grep -c PRIMARY)" = "1" ]
          # authenticated ping + a write on the primary Service
          kubectl exec rtest-mysql-0 -- mysqladmin --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" ping | grep -q "mysqld is alive"
          kubectl exec rtest-mysql-0 -- mysql --socket=/run/mysqld/mysqld.sock -uroot -p"$pw" qwapp -e "select 1" | grep -q 1

      - name: Package and push (OCI)
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mysql-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mysql@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/mysql:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

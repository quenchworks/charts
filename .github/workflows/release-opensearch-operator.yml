name: release-opensearch-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/opensearch-operator/**"
      - ".github/workflows/release-opensearch-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/opensearch-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m

          # --- PROVE THE OPERATOR RUNS AN OPENSEARCH CLUSTER THAT INDEXES AND SEARCHES. ---
          kubectl get crd opensearchclusters.opensearch.org >/dev/null

          # 1. A one-node cluster with operator-generated TLS. Creation goes through the validating
          #    webhook, whose Service can lag the operator's readiness right after install: retry.
          cat > /tmp/gate-cluster.yaml <<'YAML'
          apiVersion: opensearch.org/v1
          kind: OpenSearchCluster
          metadata: { name: gate }
          spec:
            general:
              serviceName: gate
              version: "3.2.0"
              setVMMaxMapCount: true
            security:
              tls:
                transport: { generate: true, perNode: true }
                http: { generate: true }
            nodePools:
              - component: nodes
                replicas: 1
                diskSize: 2Gi
                resources:
                  requests: { cpu: 500m, memory: 1536Mi }
                  limits: { memory: 1536Mi }
                roles: [cluster_manager, data]
          YAML
          for i in $(seq 1 12); do kubectl apply -f /tmp/gate-cluster.yaml && break; sleep 5; done
          kubectl get opensearchcluster gate >/dev/null

          # 2. The cluster is initialized and healthy. phase turns RUNNING before any OpenSearch pod is
          #    scheduled, so it proves nothing: wait for initialized and a green or yellow health.
          st() { kubectl get opensearchcluster gate -o jsonpath='{.status.initialized} {.status.health}' 2>/dev/null; }
          for i in $(seq 1 90); do case "$(st)" in "true green"|"true yellow") break ;; esac; sleep 10; done
          case "$(st)" in "true green"|"true yellow") ;; *) kubectl get opensearchcluster gate -o yaml | tail -30; kubectl get pods -o wide; echo "FAIL: cluster not initialized and healthy: $(st)"; exit 1 ;; esac
          echo "OpenSearchCluster initialized, health $(st | cut -d' ' -f2)"

          # 3. Index a document and find it again, with the admin login the operator generated.
          pw="$(kubectl get secret gate-admin-password -o jsonpath='{.data.password}' | base64 -d)"
          test -n "$pw" || { echo "FAIL: no generated admin password"; exit 1; }
          kubectl run gate-client --image=curlimages/curl:8.17.0 --restart=Never --command -- sleep 900
          kubectl wait --for=condition=ready pod/gate-client --timeout=300s
          os() { kubectl exec gate-client -- curl -sk -u "$1" "${@:2}"; }
          os "admin:$pw" -XPUT 'https://gate:9200/gate/_doc/1?refresh=true' -H 'Content-Type: application/json' -d '{"msg":"quench-works"}' >/dev/null
          hits="$(os "admin:$pw" 'https://gate:9200/gate/_search?q=msg:quench-works')"
          grep -q '"value":1' <<<"$hits" || { echo "FAIL: search did not find the document: $hits"; exit 1; }
          echo "Indexed and found a document over TLS"

          # 4. An OpenSearchUser is reconciled into the security plugin: the user can log in.
          kubectl create secret generic gate-user --from-literal=password='Kq7v-R2mX-z9Lp-T4wN'
          kubectl apply -f - <<'YAML'
          apiVersion: opensearch.org/v1
          kind: OpensearchUser
          metadata: { name: gate-user }
          spec:
            opensearchCluster: { name: gate }
            passwordFrom: { name: gate-user, key: password }
            backendRoles: [readall]
          YAML
          for i in $(seq 1 30); do grep -q '"username"' <<<"$(os 'gate-user:Kq7v-R2mX-z9Lp-T4wN' 'https://gate:9200/_plugins/_security/authinfo')" && break; sleep 5; done
          who="$(os 'gate-user:Kq7v-R2mX-z9Lp-T4wN' 'https://gate:9200/_plugins/_security/authinfo')"
          grep -q '"user_name":"gate-user"' <<<"$who" || { echo "FAIL: OpenSearchUser cannot log in: $who"; exit 1; }
          echo "OpenSearchUser gate-user logs in"

          restarts="$(kubectl get pods -l app.kubernetes.io/name=opensearch-operator -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: the operator restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/opensearch-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/opensearch-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/opensearch-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

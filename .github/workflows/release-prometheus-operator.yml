name: release-prometheus-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/prometheus-operator/**"
      - ".github/workflows/release-prometheus-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/prometheus-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: CRDs match the release (descriptions stripped, nothing else)
        run: |
          go -C tools/qw run . gen-prometheus-crds "$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")" --check

      - name: Install gate (kind)
        env:
          # the Prometheus the gate asks the operator to run (a QuenchWorks image, by digest)
          PROM: ghcr.io/quenchworks/images/prometheus@sha256:16f3cd7173ef3e838c3896162f384ddb68d652e456194cadaf913a9474efa168
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          reloader="$(awk '/^configReloader:/{f=1} f&&/repository:/{r=$2} f&&/digest:/{gsub(/"/,"",$2); print r"@"$2; exit}' "${CHART_DIR}/values.yaml")"

          # --- PROVE THE OPERATOR RECONCILES A PROMETHEUS THAT SCRAPES A SERVICEMONITOR. ---
          # 1. The CRDs are installed and the operator reports the release's version.
          test "$(kubectl get crd -o name | grep -c 'monitoring.coreos.com')" -eq 10
          v="$(kubectl exec deploy/rtest-prometheus-operator -- /usr/bin/prometheus-operator --version 2>&1 | head -1)"
          echo "$v"; grep -qF "$want" <<<"$v"

          # 2. A Prometheus resource and a ServiceMonitor for the operator's own metrics.
          kubectl apply -f - <<YAML
          apiVersion: v1
          kind: ServiceAccount
          metadata: { name: prometheus }
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata: { name: gate-prometheus }
          rules:
            - { apiGroups: [""], resources: [services, endpoints, pods], verbs: [get, list, watch] }
            - { apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch] }
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata: { name: gate-prometheus }
          roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gate-prometheus }
          subjects: [{ kind: ServiceAccount, name: prometheus, namespace: default }]
          ---
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata: { name: operator }
          spec:
            selector: { matchLabels: { app.kubernetes.io/instance: rtest } }
            endpoints: [{ port: http, interval: 10s }]
          ---
          apiVersion: monitoring.coreos.com/v1
          kind: Prometheus
          metadata: { name: gate }
          spec:
            image: ${PROM}
            replicas: 1
            serviceAccountName: prometheus
            serviceMonitorSelector: {}
            containers:
              - name: prometheus
                command: [/usr/bin/prometheus]
          YAML

          # 3. The operator turns it into a ready StatefulSet with our config-reloader sidecar.
          for i in $(seq 1 60); do
            [ "$(kubectl get statefulset prometheus-gate -o jsonpath='{.status.readyReplicas}' 2>/dev/null)" = 1 ] && break; sleep 5
          done
          kubectl rollout status statefulset/prometheus-gate --timeout=120s
          imgs="$(kubectl get pod prometheus-gate-0 -o jsonpath='{range .spec.containers[*]}{.image}{"\n"}{end}')"
          grep -qxF "$reloader" <<<"$imgs" || { echo "FAIL: config-reloader is not ours: $imgs"; exit 1; }
          echo "Prometheus reconciled into a ready StatefulSet with the QuenchWorks config-reloader"

          # 4. Prometheus scrapes the operator through the ServiceMonitor: up == 1.
          kubectl port-forward svc/prometheus-operated 19090:9090 >/tmp/pf.log 2>&1 & pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from' /tmp/pf.log && break; sleep 1; done
          up=""
          for i in $(seq 1 40); do
            up="$(curl -fsS 'http://127.0.0.1:19090/api/v1/query?query=up%7Bnamespace%3D%22default%22%2Cservice%3D%22rtest-prometheus-operator%22%7D' || true)"
            grep -q '"value":\[[0-9.]*,"1"\]' <<<"$up" && break; sleep 5
          done
          grep -q '"value":\[[0-9.]*,"1"\]' <<<"$up" || { echo "FAIL: the operator target is not up: $up"; kubectl logs prometheus-gate-0 -c prometheus --tail=30; exit 1; }
          echo "ServiceMonitor target scraped: up == 1"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/prometheus-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/prometheus-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/prometheus-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

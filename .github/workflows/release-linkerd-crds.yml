name: release-linkerd-crds

on:
  push:
    branches: [main]
    paths:
      - "quench/linkerd-crds/**"
      - "scripts/gen-linkerd-crds.py"
      - ".github/workflows/release-linkerd-crds.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/linkerd-crds
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null
          # keep=false is a shipped code path and must render too.
          helm template "${CHART_DIR}" --set crds.keep=false >/dev/null

      - name: Provenance -- the template must be what the generator produces
        run: |
          set -o pipefail
          # templates/crds.yaml is generated from linkerd/linkerd2 at the appVersion
          # this chart declares. --check regenerates and diffs, so a hand-edit, a
          # re-cut upstream tag, or an upstream change to the metadata block all fail
          # HERE rather than shipping a bundle nobody can audit.
          ver="$(helm show chart "${CHART_DIR}" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')"
          test -n "$ver"
          uv run scripts/gen-linkerd-crds.py "$ver" --check

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # No workload to wait on: this chart ships only CRDs. The gate is an
          # API-surface check.
          helm install rtest "${CHART_DIR}" -n linkerd --create-namespace \
            -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 5m

          for n in serviceprofiles.linkerd.io \
                   servers.policy.linkerd.io \
                   serverauthorizations.policy.linkerd.io \
                   authorizationpolicies.policy.linkerd.io \
                   meshtlsauthentications.policy.linkerd.io \
                   networkauthentications.policy.linkerd.io \
                   egressnetworks.policy.linkerd.io \
                   httplocalratelimitpolicies.policy.linkerd.io \
                   externalworkloads.workload.linkerd.io; do
            kubectl wait --for=condition=Established "crd/${n}" --timeout=120s
            keep="$(kubectl get "crd/${n}" -o jsonpath='{.metadata.annotations.helm\.sh/resource-policy}')"
            test "$keep" = keep || { echo "::error::${n} resource-policy=${keep}"; exit 1; }
          done

          # The Gateway API CRDs must NOT be here. quench/gateway-api-crds owns those
          # names, and a cluster-scoped CRD with two owners belongs to whichever
          # applied last. If a future upstream bump drags them in, fail here.
          test -z "$(kubectl get crd -o name | grep 'gateway.networking.k8s.io' || true)" \
            || { echo "::error::this chart installed Gateway API CRDs; gateway-api-crds owns those"; exit 1; }

          # The schemas must accept real objects. A CRD chart that installs cleanly
          # and then rejects a valid Server is still broken, and nothing else here
          # would catch it.
          kubectl apply -f - <<'EOF'
          apiVersion: policy.linkerd.io/v1beta3
          kind: Server
          metadata:
            name: smoke
            namespace: linkerd
          spec:
            podSelector:
              matchLabels: { app: smoke }
            port: 8080
            proxyProtocol: HTTP/2
          EOF
          kubectl get server.policy.linkerd.io smoke -n linkerd

          kubectl apply -f - <<'EOF'
          apiVersion: linkerd.io/v1alpha2
          kind: ServiceProfile
          metadata:
            name: smoke.linkerd.svc.cluster.local
            namespace: linkerd
          spec:
            routes:
              - name: GET /
                condition:
                  method: GET
                  pathRegex: /
          EOF
          kubectl get serviceprofile.linkerd.io smoke.linkerd.svc.cluster.local -n linkerd

          # An invalid object must be REJECTED. Without this the accept test above
          # would pass just as well against a CRD carrying no validation at all.
          #
          # The invalid input is a missing spec.port, which v1beta3 lists in
          # `required`. It is deliberately NOT a bad proxyProtocol: run 35232014787
          # asserted that and failed, because upstream ships proxyProtocol as a plain
          # `type: string` with `default: unknown` and no enum, so every string is
          # valid and the apiserver was right to accept it. Assert what the schema
          # actually promises, not what the field name suggests.
          if kubectl apply --dry-run=server -f - <<'EOF'
          apiVersion: policy.linkerd.io/v1beta3
          kind: Server
          metadata: { name: bad, namespace: linkerd }
          spec:
            podSelector: { matchLabels: { app: bad } }
          EOF
          then
            echo "::error::the apiserver accepted a Server with no spec.port; the schema is not being enforced"
            exit 1
          fi

          # keep=true means the CRDs outlive the release. Prove it rather than
          # trusting the annotation.
          helm uninstall rtest -n linkerd
          kubectl get crd servers.policy.linkerd.io \
            || { echo "::error::uninstall removed the CRDs despite resource-policy keep"; exit 1; }

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get crd -o wide | grep linkerd || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          helm status rtest -n linkerd || true

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          helm package "${CHART_DIR}" -d .
          ver="$(helm show chart "${CHART_DIR}" | awk '/^version:/ {print $2}')"
          helm push "linkerd-crds-${ver}.tgz" "${OCI_REPO}" 2>&1 | tee push.log
          digest="$(awk '/Digest:/ {print $2}' push.log)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        run: cosign sign --yes "ghcr.io/quenchworks/charts/linkerd-crds@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          # Anchored to the repositoryID LINE, matching every other release
          # workflow. A bare `grep -q REPLACE_WITH_REPOSITORY_ID` also matches the
          # file's own comment explaining the guard, so it skipped forever even
          # with a real id present (run 35248130125 reported success and pushed
          # nothing; the artifacthub.io tag was simply absent from the registry).
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          oras push "ghcr.io/quenchworks/charts/linkerd-crds:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-meilisearch

on:
  push:
    branches: [main]
    paths:
      - "quench/meilisearch/**"
      - ".github/workflows/release-meilisearch.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/meilisearch
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-meilisearch --timeout=420s

          # probe the search API over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward rtest-meilisearch-0 7700:7700 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5

          # /health is unauthenticated -> 200 with {"status":"available"}
          ok=""
          for i in $(seq 1 30); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:7700/health || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok"   # fail loudly if /health never reported 200
          curl -fsS http://127.0.0.1:7700/health | grep -q '"available"'
          echo "/health -> 200 (available)"

          # PROVE AUTH end-to-end: pull the generated master key from the chart Secret.
          KEY="$(kubectl get secret rtest-meilisearch-masterkey -o jsonpath='{.data.master-key}' | base64 -d)"
          test -n "$KEY"

          # WITH the key: GET /keys -> 200
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $KEY" http://127.0.0.1:7700/keys)" = "200" ]
          echo "GET /keys WITH master key -> 200"

          # WITHOUT the key -> 401/403
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7700/keys || true)"
          case "$code" in 401|403) echo "GET /keys WITHOUT key -> $code (rejected)";; *) echo "expected 401/403, got $code"; exit 1;; esac

          # WRONG key -> 401/403
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong-key" http://127.0.0.1:7700/keys || true)"
          case "$code" in 401|403) echo "GET /keys WRONG key -> $code (rejected)";; *) echo "expected 401/403, got $code"; exit 1;; esac

          # DASHBOARD: the mini-dashboard is compiled INTO the binary (offline-vendored).
          # Meilisearch DELIBERATELY disables serving it at GET / when MEILI_ENV=production
          # (security: the dashboard HTML is only served at / in MEILI_ENV=development), so
          # in this production gate GET / returns the JSON status, not the HTML. We instead
          # prove the dashboard ASSETS are embedded in the running binary -- the vendored
          # mini-dashboard HTML carries the "Mini-dashboard" <title>, so the string is present
          # in the compiled binary only when the assets were embedded at build time.
          [ "$(curl -s -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:7700/)" = "200" ]
          grep -q '"Meilisearch is running"' /tmp/root.html
          echo "GET / -> 200 JSON status (dashboard intentionally hidden in production)"
          kubectl exec rtest-meilisearch-0 -- grep -aq "Mini-dashboard" /usr/bin/meilisearch
          echo "mini-dashboard assets are embedded in the binary (served at / in MEILI_ENV=development)"

          # real API roundtrip (WITH key): create index, add a doc, search it back typo-tolerantly.
          curl -fsS -X POST 'http://127.0.0.1:7700/indexes' \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"uid":"citest","primaryKey":"id"}' | grep -q '"taskUid"'
          curl -fsS -X POST 'http://127.0.0.1:7700/indexes/citest/documents' \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '[{"id":1,"title":"Interstellar"},{"id":2,"title":"Inception"}]' | grep -q '"taskUid"'
          # wait for the async indexing task to finish processing
          for i in $(seq 1 30); do
            done_n="$(curl -fsS -H "Authorization: Bearer $KEY" 'http://127.0.0.1:7700/tasks?statuses=succeeded' | grep -o '"uid"' | wc -l || true)"
            [ "${done_n:-0}" -ge 2 ] && break
            sleep 2
          done
          out="$(curl -fsS -X POST 'http://127.0.0.1:7700/indexes/citest/search' \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"q":"interstelar"}')"
          echo "$out"
          echo "$out" | grep -q '"id":1'
          echo "typo-tolerant search hit matched"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/meilisearch-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/meilisearch@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/meilisearch:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

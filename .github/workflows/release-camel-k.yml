name: release-camel-k

on:
  push:
    branches: [main]
    paths:
      - "quench/camel-k/**"
      - ".github/workflows/release-camel-k.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/camel-k
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The registry the operator pushes integration images to: the QuenchWorks
          # distribution image (pinned like images/catalog.lock.yaml), plain HTTP.
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: gate-registry
          spec:
            selector:
              matchLabels: { app: gate-registry }
            template:
              metadata:
                labels: { app: gate-registry }
              spec:
                containers:
                  - name: registry
                    image: ghcr.io/quenchworks/images/distribution@sha256:f03969346ca6ea1d53af076719fba5c6ce1a54f75422e5194afc3d37bdeb8c02
                    ports: [{ containerPort: 5000 }]
                    volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
                volumes: [{ name: data, emptyDir: {} }]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: gate-registry
          spec:
            selector: { app: gate-registry }
            ports: [{ port: 5000, targetPort: 5000 }]
          EOF
          kubectl rollout status deployment/gate-registry --timeout=180s
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-camel-k --timeout=300s
          for c in builds camelcatalogs integrationkits integrationplatforms integrationprofiles integrations kamelets pipes; do
            kubectl wait --for=condition=Established "crd/$c.camel.apache.org" --timeout=60s
          done
          # An IntegrationPlatform CR does not inherit the env platform: it reaches
          # Ready once the operator installs its CamelCatalog and finds the registry it
          # names. It goes first: its create step fails on a catalog that already exists.
          cat <<EOF | kubectl apply -f -
          apiVersion: camel.apache.org/v1
          kind: IntegrationPlatform
          metadata:
            name: camel-k
            annotations:
              camel.apache.org/operator.id: camel-k
          spec:
            build:
              registry:
                address: gate-registry:5000
                insecure: true
          EOF
          for i in $(seq 1 60); do
            phase="$(kubectl get integrationplatform camel-k -o jsonpath='{.status.phase}')"
            [ "$phase" = Ready ] && break
            sleep 5
          done
          kubectl get integrationplatform camel-k -o yaml | sed -n '/^status:/,$p'
          [ "$phase" = Ready ] || { echo "IntegrationPlatform phase: $phase"; kubectl logs deploy/rtest-camel-k --tail=200; exit 1; }
          # Deprecated in 2.11 (operator env replaces it); remove it so the build below
          # runs on the env platform the chart configures.
          kubectl delete integrationplatform camel-k --wait=true
          # Real work, with no IntegrationPlatform: the operator builds from the
          # platform the chart configures by env (REGISTRY_ADDRESS, REGISTRY_INSECURE).
          # An Integration makes it run Maven on the image's JDK and Jib, then push the
          # kit image to the registry. The kit reaching Ready proves the toolchain; the
          # kind node cannot pull from a Service name, so the integration pod itself is
          # not waited for.
          cat <<EOF | kubectl apply -f -
          apiVersion: camel.apache.org/v1
          kind: Integration
          metadata:
            name: gate
            annotations:
              camel.apache.org/operator.id: camel-k
          spec:
            flows:
              - from:
                  uri: "timer:tick?period=5000"
                  steps:
                    - setBody:
                        constant: "Hello from QuenchWorks Camel K"
                    - to: "log:info"
          EOF
          kit=""
          for i in $(seq 1 180); do
            kit="$(kubectl get integration gate -o jsonpath='{.status.integrationKit.name}')"
            if [ -n "$kit" ]; then
              kphase="$(kubectl get integrationkit "$kit" -o jsonpath='{.status.phase}')"
              [ "$kphase" = Ready ] && break
              [ "$kphase" = Error ] && break
            fi
            sleep 5
          done
          kubectl get builds -o wide || true
          [ -n "$kit" ] && [ "$kphase" = Ready ] \
            || { echo "integration kit '$kit' phase: ${kphase:-none}"; kubectl get integration gate -o yaml | sed -n '/^status:/,$p'; kubectl logs deploy/rtest-camel-k --tail=300; exit 1; }
          img="$(kubectl get integrationkit "$kit" -o jsonpath='{.status.image}')"
          echo "kit image: $img"
          grep -q '^gate-registry:5000/' <<<"$img"
          bphase="$(kubectl get build "$kit" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          echo "build phase: ${bphase:-n/a}"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/camel-k-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/camel-k@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/camel-k:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

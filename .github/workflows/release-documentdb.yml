name: release-documentdb

on:
  push:
    branches: [main]
    paths:
      - "quench/documentdb/**"
      - ".github/workflows/release-documentdb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/documentdb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind, MongoDB wire-protocol roundtrip)
        run: |
          set -o pipefail
          # first boot runs initdb + CREATE EXTENSION documentdb CASCADE + creates the
          # Mongo admin user before the gateway binds 10260, so allow time.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-documentdb --timeout=420s

          # port-forward the MongoDB wire-protocol port
          kubectl port-forward statefulset/rtest-documentdb 10260:10260 >/tmp/pf.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          # wait for the forwarded port to accept connections
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/10260) 2>/dev/null && { exec 3>&- 3<&-; break; }
            sleep 2
          done

          # Wolfi runtime has no mongo client, so drive the roundtrip from qw (Go mongo driver).
          # The gateway enforces TLS with a self-signed cert -> allow invalid certs.
          go -C tools/qw run . mongo-roundtrip --uri 'mongodb://default_user:gatepw@127.0.0.1:10260/?tls=true&tlsInsecure=true&authMechanism=SCRAM-SHA-256&directConnection=true'

          # native TLS: the gateway serves the chart certificate instead of its self-signed one;
          # a client that verifies the chart CA (localhost is a SAN) writes and reads a document
          # (the gate runs on an emptyDir, so the upgrade starts from an empty database)
          kill "$pf" 2>/dev/null || true
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status statefulset/rtest-documentdb --timeout=420s
          kubectl get secret rtest-documentdb-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/documentdb-ca.crt
          kubectl port-forward statefulset/rtest-documentdb 10260:10260 >/tmp/pf.log 2>&1 &
          pf=$!
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/10260) 2>/dev/null && { exec 3>&- 3<&-; break; }
            sleep 2
          done
          go -C tools/qw run . mongo-roundtrip --uri 'mongodb://default_user:gatepw@localhost:10260/?tls=true&tlsCAFile=/tmp/documentdb-ca.crt&authMechanism=SCRAM-SHA-256&directConnection=true'

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/documentdb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/documentdb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/documentdb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

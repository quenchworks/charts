name: release-documentdb

on:
  push:
    branches: [main]
    paths:
      - "quench/documentdb/**"
      - ".github/workflows/release-documentdb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/documentdb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind, MongoDB wire-protocol roundtrip)
        run: |
          set -o pipefail
          # first boot runs initdb + CREATE EXTENSION documentdb CASCADE + creates the
          # Mongo admin user before the gateway binds 10260, so allow time.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-documentdb --timeout=420s

          # port-forward the MongoDB wire-protocol port
          kubectl port-forward statefulset/rtest-documentdb 10260:10260 >/tmp/pf.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          # wait for the forwarded port to accept connections
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/10260) 2>/dev/null && { exec 3>&- 3<&-; break; }
            sleep 2
          done

          python3 -m pip install --quiet --break-system-packages 'pymongo>=4.6' \
            || python3 -m pip install --quiet 'pymongo>=4.6'
          # Wolfi runtime has no mongo client, so drive the roundtrip from pymongo.
          # The gateway enforces TLS with a self-signed cert -> allow invalid certs.
          PW=gatepw python3 - <<'PY'
          import os, sys, time
          from pymongo import MongoClient
          uri = ("mongodb://default_user:%s@127.0.0.1:10260/"
                 "?tls=true&tlsAllowInvalidCertificates=true"
                 "&authMechanism=SCRAM-SHA-256&directConnection=true" % os.environ["PW"])
          last = None
          for _ in range(30):
              try:
                  c = MongoClient(uri, serverSelectionTimeoutMS=3000)
                  c.admin.command("ping")
                  break
              except Exception as e:
                  last = e; time.sleep(3)
          else:
              print("connect failed:", last); sys.exit(1)
          coll = c["gate"]["c"]
          coll.insert_one({"_id": 1, "k": "v"})
          doc = coll.find_one({"_id": 1})
          assert doc and doc.get("k") == "v", "roundtrip mismatch: %r" % doc
          print("MongoDB wire-protocol roundtrip OK:", doc)
          PY

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/documentdb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/documentdb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/documentdb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

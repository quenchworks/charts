name: release-etherpad

on:
  push:
    branches: [main]
    paths:
      - "quench/etherpad/**"
      - ".github/workflows/release-etherpad.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/etherpad
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-etherpad --timeout=600s
          fwd() { kubectl port-forward svc/rtest-etherpad 9001:9001 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          C=""; B=http://127.0.0.1:9001
          key() { kubectl exec deploy/rtest-etherpad -- node -p "require('fs').readFileSync('/var/lib/etherpad/APIKEY.txt','utf8').trim()"; }
          up() { for _ in $(seq 1 90); do [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/health")" = 200 ] && return 0; sleep 2; done; echo "/health never answered"; return 1; }
          api() { curl -s $C -o /tmp/body -w '%{http_code}' "$B/api/1.3.1/$1?apikey=$2&padID=quench-gate${3:+&text=$3}"; }
          create() {
            up || return 1
            K=$(key); [ ${#K} -ge 16 ] || { echo "no API key on the volume"; return 1; }
            [ "$(api createPad "$K" "Quench%20gate%20pad")" = 200 ] && grep -q '"code":0' /tmp/body || { echo "createPad failed: $(cat /tmp/body)"; return 1; }
            [ "$(api getText wrong-key-00000000000000000)" != 200 ] || { echo "a wrong API key was accepted"; return 1; }
          }
          kept() {
            up || return 1
            [ "$(key)" = "$K" ] || { echo "the API key changed"; return 1; }
            [ "$(api getText "$K")" = 200 ] && grep -q 'Quench gate pad' /tmp/body || { echo "the pad is gone: $(cat /tmp/body)"; return 1; }
          }
          fwd create
          # pads (PostgreSQL) and the API key (the volume) survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=etherpad --wait=true
          kubectl rollout status deployment/rtest-etherpad --timeout=600s
          fwd kept
          # native TLS on the same port with the Helm-made CA, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 15m
          kubectl rollout status deployment/rtest-etherpad --timeout=600s
          kubectl get secret rtest-etherpad-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ep-ca.crt
          tlsgate() {
            kept || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:9001/health 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          C="--cacert /tmp/ep-ca.crt --resolve rtest-etherpad:9001:127.0.0.1"; B=https://rtest-etherpad:9001
          fwd tlsgate
          echo "etherpad: pad created and read over the API with the volume's key, wrong key refused, kept across a pod restart, native TLS with plain HTTP refused: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/etherpad-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/etherpad@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/etherpad:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-k6

on:
  push:
    branches: [main]
    paths:
      - "quench/k6/**"
      - ".github/workflows/release-k6.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/k6
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait-for-jobs is REQUIRED here: plain --wait does NOT wait for Jobs, so the
          # install returns while k6 is still ContainerCreating and the gate would pass
          # without the test having run at all. Verified locally.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --wait --wait-for-jobs --timeout 8m

          job="$(kubectl get job -l app.kubernetes.io/name=k6 -o jsonpath='{.items[0].metadata.name}')"
          test -n "$job" || { echo "no k6 Job was created"; exit 1; }

          # The Job must have SUCCEEDED, not merely finished.
          succeeded="$(kubectl get job "$job" -o jsonpath='{.status.succeeded}')"
          echo "job $job succeeded=$succeeded"
          test "$succeeded" = "1" || { echo "k6 Job did not succeed"; kubectl logs "job/$job" --tail=60; exit 1; }

          # And k6 must have actually RUN A SCRIPT. A Job can exit 0 having done nothing
          # useful (bad args, empty script), so assert on k6's own summary output.
          kubectl logs "job/$job" --tail=200 > /tmp/k6.log
          grep -q "checks_succeeded" /tmp/k6.log \
            || { echo "k6 produced no checks summary -- it did not execute the script"; cat /tmp/k6.log; exit 1; }
          grep -q "k6 runtime works" /tmp/k6.log \
            || { echo "the default script's check did not pass"; cat /tmp/k6.log; exit 1; }
          grep -E "checks_succeeded|iterations" /tmp/k6.log | head -2

          helm uninstall rtest --wait

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/k6-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/k6@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/k6:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

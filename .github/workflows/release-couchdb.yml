name: release-couchdb

on:
  push:
    branches: [main]
    paths:
      - "quench/couchdb/**"
      - ".github/workflows/release-couchdb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/couchdb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait blocks until the post-install hook Job (system DBs) completes; the
          # hook-succeeded delete policy then removes that Job, so we do NOT kubectl wait
          # on it here (it is already gone). The system DBs are asserted via the API below.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-couchdb --timeout=420s

          # probe the HTTP API over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward rtest-couchdb-0 5984:5984 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5

          USER=admin
          PASS="$(kubectl get secret rtest-couchdb -o jsonpath='{.data.adminPassword}' | base64 -d)"
          test -n "$PASS"
          H=http://127.0.0.1:5984

          # GET / welcome (unauthenticated)
          curl -fsS "$H/" | grep -q '"couchdb":"Welcome"'
          # GET /_up requires admin auth once an admin is set
          curl -fsS -u "$USER:$PASS" "$H/_up" | grep -q '"status":"ok"'
          # system DBs exist (proves the post-install Job worked)
          curl -fsS -u "$USER:$PASS" "$H/_users" >/dev/null

          # create a database
          curl -fsS -u "$USER:$PASS" -X PUT "$H/gate" | grep -q '"ok":true'
          # put a document
          curl -fsS -u "$USER:$PASS" -X PUT "$H/gate/doc1" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","n":42}' | grep -q '"ok":true'
          # create a JavaScript map view (runs on the QuickJS view server)
          curl -fsS -u "$USER:$PASS" -X PUT "$H/gate/_design/d" \
            -H 'Content-Type: application/json' \
            -d '{"views":{"by_name":{"map":"function(doc){ if(doc.name){ emit(doc.name, doc.n); } }"}}}' \
            | grep -q '"ok":true'
          # query the view and assert the emitted row comes back (QuickJS end to end)
          curl -fsS -u "$USER:$PASS" "$H/gate/_design/d/_view/by_name" | tee /tmp/view.json
          grep -q '"key":"ci"' /tmp/view.json
          grep -q '"value":42' /tmp/view.json

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/couchdb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/couchdb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/couchdb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-ergo

on:
  push:
    branches: [main]
    paths:
      - "quench/ergo/**"
      - ".github/workflows/release-ergo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/ergo
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-ergo --timeout=300s
          # irc PORT plain|tls NICK EXPECT [LINE...]: connect, send the lines after 001, wait for EXPECT (a numeric or text)
          irc() { python3 - "$@" <<'PY'
          import socket, ssl, sys, time
          port, tls, nick, expect, cmds = int(sys.argv[1]), sys.argv[2] == "tls", sys.argv[3], sys.argv[4], sys.argv[5:]
          s = socket.create_connection(("127.0.0.1", port), 15)
          if tls:
              c = ssl.create_default_context(); c.check_hostname = False; c.verify_mode = ssl.CERT_NONE
              s = c.wrap_socket(s)
          f = s.makefile("rwb")
          def send(l): f.write((l + "\r\n").encode()); f.flush()
          send("NICK " + nick); send("USER " + nick + " 0 * :gate")
          want, end = " 001 ", time.time() + 40
          for raw in f:
              l = raw.decode(errors="replace").rstrip()
              if l.startswith("PING"): send("PONG" + l[4:])
              if want in l:
                  if want != " 001 " or not cmds: print("ok:", l); sys.exit(0)
                  for c in cmds: send(c)
                  want = " " + expect + " " if expect.isdigit() else expect
              if time.time() > end: break
          print("no", expect, "from", nick); sys.exit(1)
          PY
          }
          fwd() { kubectl port-forward svc/rtest-ergo 6667:6667 $TLSPORT >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          gate1() {
            irc 6667 plain gate1 001 || return 1
            irc 6667 plain gate2 381 "OPER admin quench-ci-oper-pass" || { echo "the oper password was refused"; return 1; }
            ! irc 6667 plain gate3 381 "OPER admin wrong-password-1" || { echo "a wrong oper password was accepted"; return 1; }
            irc 6667 plain gatenick "now logged in" "PRIVMSG NickServ :REGISTER quench-nick-pass" || { echo "NickServ register failed"; return 1; }
          }
          gate2() { irc "${1:-6667}" "${2:-plain}" gateuser "now logged in" "PRIVMSG NickServ :IDENTIFY gatenick quench-nick-pass" || { echo "the account is gone"; return 1; }; }
          fwd gate1
          # accounts live in ircd.db on the PVC: the registration must survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-ergo --timeout=300s
          fwd gate2
          # IRC over TLS on 6697 with a Helm-made certificate, plain 6667 still answers, the account is still there
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status deployment/rtest-ergo --timeout=300s
          TLSPORT=6697:6697 fwd gate2 6697 tls
          echo "ergo: generated oper password enforced, NickServ account kept across a pod restart and a TLS upgrade: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/ergo-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/ergo@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/ergo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

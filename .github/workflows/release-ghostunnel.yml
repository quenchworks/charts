name: release-ghostunnel

on:
  push:
    branches: [main]
    paths:
      - "quench/ghostunnel/**"
      - ".github/workflows/release-ghostunnel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/ghostunnel
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # the plaintext service ghostunnel wraps: our caddy image answering a fixed body
          kubectl create deployment gate-backend --image=ghcr.io/quenchworks/images/caddy:2.11.9 --port=8000 -- \
            /usr/bin/caddy respond --listen :8000 quench-backend
          kubectl expose deployment gate-backend --port=8000
          kubectl rollout status deployment/gate-backend --timeout=180s
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-ghostunnel --timeout=300s
          img="ghcr.io/quenchworks/images/ghostunnel@$(awk '/^  digest:/{gsub(/"/,"",$2); print $2; exit}' "${CHART_DIR}/values.yaml")"
          # a ghostunnel client pod with the chart's generated client certificate and the server CA
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata: { name: gt-client, labels: { app: gt-client } }
          spec:
            securityContext: { runAsUser: 1001, runAsNonRoot: true }
            containers:
              - name: client
                image: $img
                args: [client, --listen=0.0.0.0:8080, --unsafe-listen, --target=rtest-ghostunnel:8443,
                       --cert=/c/tls.crt, --key=/c/tls.key, --cacert=/s/ca.crt]
                ports: [{ containerPort: 8080 }]
                volumeMounts: [{ name: c, mountPath: /c }, { name: s, mountPath: /s }]
            volumes:
              - { name: c, secret: { secretName: rtest-ghostunnel-client } }
              - { name: s, secret: { secretName: rtest-ghostunnel-tls } }
          EOF
          kubectl wait --for=condition=Ready pod/gt-client --timeout=120s
          kubectl port-forward pod/gt-client 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; sleep 5
          out=""
          for i in $(seq 1 20); do out="$(curl -sS --max-time 5 http://127.0.0.1:8080/ 2>/dev/null)" && [ -n "$out" ] && break; sleep 2; done
          kill $pf; kubectl logs gt-client | tail -5
          [ "$out" = quench-backend ] || { echo "through the mTLS tunnel got: $out"; exit 1; }
          # without a client certificate the server must refuse the handshake
          kubectl get secret rtest-ghostunnel-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/server-ca.crt
          kubectl port-forward svc/rtest-ghostunnel 8443:8443 >/tmp/pf.log 2>&1 &
          pf=$!; sleep 5
          if curl -sS --max-time 5 --cacert /tmp/server-ca.crt https://localhost:8443/ >/tmp/nocert.log 2>&1; then
            kill $pf; echo "a client without a certificate got through:"; cat /tmp/nocert.log; exit 1
          fi
          cat /tmp/nocert.log
          # the status endpoint reports the backend reachable
          kubectl port-forward svc/rtest-ghostunnel 6060:6060 >/tmp/pf2.log 2>&1 &
          pf2=$!; sleep 5
          st="$(curl -sS --max-time 5 http://127.0.0.1:6060/_status)"
          kill $pf $pf2 2>/dev/null || true
          grep -q '"backend_ok":true' <<<"$st" || { echo "status: $st"; exit 1; }
          echo "ghostunnel: mTLS tunnel to the backend, certificate-less client refused, status ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/ghostunnel-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/ghostunnel@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/ghostunnel:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

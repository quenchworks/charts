name: release-dragonfly

# Dragonfly is BSL-1.1 (NOT open source) — prefer Valkey (BSD), the clean alternative.

on:
  push:
    branches: [main]
    paths:
      - "quench/dragonfly/**"
      - ".github/workflows/release-dragonfly.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/dragonfly
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 6m
          # ci/default-values enables HA (replication + Sentinel auto-failover): the
          # workloads are rtest-dragonfly-{primary,replica,sentinel}, 1 primary + 2
          # replicas + a 3-node Sentinel quorum (valkey-sentinel monitoring Dragonfly).
          kubectl rollout status statefulset/rtest-dragonfly-primary  --timeout=300s
          kubectl rollout status statefulset/rtest-dragonfly-replica  --timeout=300s
          kubectl rollout status statefulset/rtest-dragonfly-sentinel --timeout=300s

          # auth is on in ci-values; read the generated password for the redis-cli pods.
          PW="$(kubectl get secret rtest-dragonfly -o jsonpath='{.data.dragonfly-password}' | base64 -d)"
          rc() { kubectl run "rc$RANDOM" --rm -i --restart=Never --image=redis:7-alpine --command -- \
                   redis-cli --no-auth-warning -a "$PW" "$@"; }

          # Sentinel must have discovered the primary + both replicas + the other 2 sentinels.
          rc -h rtest-dragonfly-sentinel -p 26379 SENTINEL master mymaster | tr '\n' ' ' | tee sm.txt
          grep -q 'num-slaves 2' sm.txt || { echo "::error::Sentinel did not discover 2 replicas"; exit 1; }
          grep -q 'num-other-sentinels 2' sm.txt || { echo "::error::Sentinel quorum incomplete"; exit 1; }

          # Replication works: write to the primary Service, read it back off a replica.
          rc -h rtest-dragonfly SET gate quench
          out="$(rc -h rtest-dragonfly-replica-0.rtest-dragonfly-replica-headless GET gate)"
          echo "replica GET gate -> ${out}"
          echo "${out}" | grep -q quench || { echo "::error::Dragonfly replication round-trip failed (expected 'quench')"; exit 1; }

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/dragonfly-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/dragonfly@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/dragonfly:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-feature-flags-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/feature-flags-stack/**"
      - ".github/workflows/release-feature-flags-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/feature-flags-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace flags
          kubectl config set-context --current --namespace=flags
          helm install ff "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl port-forward svc/ff-unleash 4242:4242 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
          U=http://127.0.0.1:4242
          for _ in $(seq 1 30); do curl -fsS "$U/health" >/dev/null 2>&1 && break; sleep 2; done
          tok() { kubectl get secret feature-flags-api-tokens -o jsonpath="{.data.$1}" | base64 -d; }
          ADMIN="$(tok admin)"; BACK="$(tok backend-development)"; FRONT="$(tok frontend-development)"
          case "$BACK" in default:development.*) ;; *) echo "FAIL: backend token shape: $BACK"; exit 1 ;; esac

          # --- PROVE THE GENERATED TOKENS WORK: admin creates a flag, backend and frontend read it. ---
          curl -fsS -X POST -H "Authorization: $ADMIN" -H 'Content-Type: application/json' \
            -d '{"name":"gate-flag","type":"release"}' "$U/api/admin/projects/default/features" >/dev/null
          curl -fsS -X POST -H "Authorization: $ADMIN" -H 'Content-Type: application/json' \
            -d '{"name":"flexibleRollout","constraints":[],"parameters":{"rollout":"100","stickiness":"default","groupId":"gate-flag"}}' \
            "$U/api/admin/projects/default/features/gate-flag/environments/development/strategies" >/dev/null
          curl -fsS -X POST -H "Authorization: $ADMIN" "$U/api/admin/projects/default/features/gate-flag/environments/development/on" >/dev/null
          b="$(curl -fsS -H "Authorization: $BACK" "$U/api/client/features")"
          [ "$(jq -r '.features[]|select(.name=="gate-flag")|.enabled' <<<"$b")" = true ] || { echo "FAIL: backend token does not see the flag on: $b"; exit 1; }
          f=""
          for _ in $(seq 1 15); do
            f="$(curl -fsS -H "Authorization: $FRONT" "$U/api/frontend")"
            jq -e '.toggles[]|select(.name=="gate-flag" and .enabled==true)' <<<"$f" >/dev/null && break
            sleep 2
          done
          jq -e '.toggles[]|select(.name=="gate-flag" and .enabled==true)' <<<"$f" >/dev/null || { echo "FAIL: frontend token does not see the flag: $f"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: default:development.not-a-real-token' "$U/api/client/features")"
          [ "$code" = 401 ] || { echo "FAIL: a wrong token got HTTP $code"; exit 1; }

          # --- AN UPGRADE KEEPS THE TOKENS. ---
          kill $pf 2>/dev/null || true
          helm upgrade ff "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          [ "$(tok backend-development)" = "$BACK" ] && [ "$(tok admin)" = "$ADMIN" ] || { echo "FAIL: upgrade changed the tokens"; exit 1; }
          kubectl port-forward svc/ff-unleash 4242:4242 >/tmp/pf.log 2>&1 &
          pf=$!
          for _ in $(seq 1 30); do curl -fsS "$U/health" >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS -H "Authorization: $BACK" "$U/api/client/features" | jq -e '.features[]|select(.name=="gate-flag")' >/dev/null
          echo "gate passed: generated admin, backend and frontend tokens work, a wrong token is refused, an upgrade keeps them"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/feature-flags-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/feature-flags-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/feature-flags-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

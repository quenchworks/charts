name: release-apisix-hybrid-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/apisix-hybrid-stack/**"
      - ".github/workflows/release-apisix-hybrid-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/apisix-hybrid-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace gw
          # the failure-diagnostics step below reads the current namespace
          kubectl config set-context --current --namespace=gw
          helm install gw "${CHART_DIR}" -n gw -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m

          kubectl create deployment gate-upstream --image=nginx:alpine
          kubectl expose deployment gate-upstream --port=80
          kubectl wait --for=condition=available deploy/gate-upstream --timeout=300s
          kubectl run gate-client --image=curlimages/curl:latest --restart=Never --command -- sleep 1800
          kubectl wait --for=condition=ready pod/gate-client --timeout=300s
          k() { kubectl exec gate-client -- "$@"; }
          served() { # $1 url, $2 optional Host header: the upstream's own body comes back
            for i in $(seq 1 60); do
              body="$(k curl -sS ${2:+-H "Host: $2"} "$1" || true)"
              case "$body" in *"Welcome to nginx"*) return 0 ;; esac
              sleep 2
            done
            echo "FAIL: $1 ${2:-} did not reach the upstream: ${body:0:200}"; return 1
          }

          # 1. etcd refuses a client without a certificate from the stack's CA.
          if kubectl exec apisix-etcd-0 -- etcdctl --endpoints=https://apisix-etcd:2379 \
               --cacert=/tls/ca.crt --command-timeout=5s endpoint health >/dev/null 2>&1; then
            echo "FAIL: etcd answered a client with no certificate"; exit 1; fi
          echo "etcd: a client without a certificate is refused"

          # 2. Each plane exposes only its own port.
          ports() { kubectl get svc "$1" -o jsonpath='{.spec.ports[*].name}'; }
          case " $(ports apisix-control-plane) " in *" http "*) echo "FAIL: the control plane Service exposes the proxy"; exit 1 ;; esac
          case " $(ports apisix-data-plane) " in *" admin "*) echo "FAIL: the data plane Service exposes the Admin API"; exit 1 ;; esac

          # 3. A route written through the control plane is served by the data planes.
          key="$(kubectl get secret apisix-control-plane-admin -o jsonpath='{.data.admin-key}' | base64 -d)"
          k curl -fsS -X PUT http://apisix-control-plane:9180/apisix/admin/routes/1 -H "X-API-KEY: ${key}" \
            -d '{"uri":"/get","plugins":{"proxy-rewrite":{"uri":"/"}},"upstream":{"type":"roundrobin","nodes":{"gate-upstream:80":1}}}'
          served http://apisix-data-plane:9080/get
          echo "hybrid: route written through the control plane is served by the data plane"
          # A chunked body passes the proxy (APISIX's default client_max_body_size 0 answers 413).
          # The nginx upstream refuses POST on a static page with 405, which proves it got there.
          code="$(k sh -c 'head -c 65536 /dev/zero | curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Transfer-Encoding: chunked" --data-binary @- http://apisix-data-plane:9080/get')"
          test "$code" = 405 || { echo "FAIL: a chunked POST got ${code}, not the upstream's 405"; exit 1; }
          echo "hybrid: a chunked request body reaches the upstream"

          # 4. The ingress controller turns an Ingress into a route on the data plane.
          kubectl apply -f - <<'YAML'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: gate }
          spec:
            ingressClassName: apisix
            rules:
              - host: gate.example.internal
                http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: gate-upstream, port: { number: 80 } } } }] }
          YAML
          served http://apisix-data-plane:9080/ gate.example.internal
          echo "ingress: an Ingress is served by the data plane"

          # 5. The data planes keep serving with the control plane gone.
          kubectl scale deployment apisix-control-plane --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/name=controlPlane --timeout=120s || true
          test -z "$(kubectl get pods -l app.kubernetes.io/name=controlPlane -o name)"
          kubectl delete pod -l app.kubernetes.io/name=dataPlane --wait
          kubectl rollout status deployment/apisix-data-plane --timeout=300s
          served http://apisix-data-plane:9080/get
          echo "hybrid: restarted data planes serve from etcd with no control plane"

          # 6. An upgrade keeps the generated certificates; everything still serves.
          before="$(kubectl get secret apisix-etcd-server-tls apisix-etcd-client-tls -o jsonpath='{.items[*].data.tls\.crt}' | sha256sum)"
          helm upgrade gw "${CHART_DIR}" -n gw -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          after="$(kubectl get secret apisix-etcd-server-tls apisix-etcd-client-tls -o jsonpath='{.items[*].data.tls\.crt}' | sha256sum)"
          test "$before" = "$after" || { echo "FAIL: the upgrade replaced the etcd certificates"; exit 1; }
          served http://apisix-data-plane:9080/get
          served http://apisix-data-plane:9080/ gate.example.internal
          echo "upgrade: certificates kept, routes served"

          restarts="$(kubectl get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: a container restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/apisix-hybrid-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/apisix-hybrid-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/apisix-hybrid-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

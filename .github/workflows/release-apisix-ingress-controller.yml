name: release-apisix-ingress-controller

on:
  push:
    branches: [main]
    paths:
      - "quench/apisix-ingress-controller/**"
      - ".github/workflows/release-apisix-ingress-controller.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/apisix-ingress-controller
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail

          # The Gateway API CRDs are cluster-scoped singletons owned by a different
          # chart. This chart does not bundle them and gatewayAPI.enabled is on by
          # default.
          helm install gwapi quench/gateway-api-crds --wait --timeout 5m

          # There is nothing to prove without a data plane: this controller's whole
          # job is pushing configuration into an APISIX Admin API. The catalogue's
          # own apisix chart is that data plane, etcd-backed with the Admin API on
          # 9180. ci/default-values.yaml points at release `dp` by name.
          helm dependency build quench/apisix
          helm install dp quench/apisix --wait --timeout 10m

          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-apisix-ingress-controller --timeout=300s

          # The pod is 2/2 Ready here and that means almost nothing. A controller
          # whose adc sidecar is missing, whose /tmp is read-only, or whose RBAC is
          # short one rule reports Ready and reconciles nothing. Everything below is
          # the real gate.

          # 1. It claimed its classes. The cheapest proof the Gateway API half is
          #    wired and that the CRDs installed above are the ones it wants.
          kubectl wait --for=condition=Accepted --timeout=120s gatewayclass/apisix

          # 2. A real ApisixRoute, reconciled and pushed. The backend is the data
          #    plane's own metrics listener (9091, a port in its Service): a genuine
          #    upstream hop with a deterministic body and no extra image to pull.
          kubectl apply -f - <<'EOF'
          apiVersion: apisix.apache.org/v2
          kind: ApisixRoute
          metadata: { name: rtest, namespace: default }
          spec:
            ingressClassName: apisix
            http:
              - name: metrics
                match: { paths: ["/apisix/prometheus/metrics"] }
                backends: [{ serviceName: dp-apisix, servicePort: 9091 }]
          EOF

          # Accepted goes True only AFTER adc's sync to the Admin API succeeds, so
          # this one condition covers translation, RBAC on the /status subresource,
          # the shared adc Unix socket and the Admin API round trip.
          kubectl wait --for=condition=Accepted --timeout=180s apisixroute/rtest

          # 3. And it actually serves. 9080 is the proxy port;
          #    /apisix/prometheus/metrics is NOT served there by APISIX itself (the
          #    apisix chart binds the exporter to 9091), so a 200 here can only come
          #    from the route the controller pushed.
          kubectl port-forward svc/dp-apisix 8080:9080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          curl -fsS --retry 15 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:8080/apisix/prometheus/metrics -o /tmp/routed.txt
          # capture-then-grep, never `curl | grep -q`: under pipefail grep exits at
          # the first match, curl takes SIGPIPE, and the pipeline fails BECAUSE the
          # pattern matched.
          grep -q '^apisix_' /tmp/routed.txt

          # The control. An unrouted path must 404 from APISIX, which is what makes
          # the 200 above evidence of route matching rather than of something
          # answering everything.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/quench-no-such-route)"
          test "$code" = "404"

          # 4. Gateway API end to end on the same GatewayProxy. NOTE: a Gateway needs
          #    its OWN spec.infrastructure.parametersRef -- the GatewayClass's
          #    parametersRef is NOT inherited, and without it the Gateway sits at
          #    Accepted=False "gateway proxy not found" while its listener happily
          #    reports Programmed=True.
          kubectl apply -f - <<'EOF'
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata: { name: rtest, namespace: default }
          spec:
            gatewayClassName: apisix
            infrastructure:
              parametersRef:
                group: apisix.apache.org
                kind: GatewayProxy
                name: rtest-apisix-ingress-controller
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes: { namespaces: { from: All } }
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: { name: rtest, namespace: default }
          spec:
            parentRefs: [{ name: rtest }]
            rules:
              - matches: [{ path: { type: PathPrefix, value: /gwapi-metrics } }]
                filters:
                  - type: URLRewrite
                    urlRewrite:
                      path: { type: ReplaceFullPath, replaceFullPath: /apisix/prometheus/metrics }
                backendRefs: [{ name: dp-apisix, port: 9091 }]
          EOF
          kubectl wait --for=condition=Accepted --timeout=180s gateway/rtest
          kubectl wait --for=condition=Programmed --timeout=180s gateway/rtest
          curl -fsS --retry 15 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:8080/gwapi-metrics -o /tmp/gwapi.txt
          grep -q '^apisix_' /tmp/gwapi.txt

          # 5. RBAC, explicitly. A controller short a permission logs `forbidden` and
          #    silently does nothing while its pod looks perfectly Ready, so the
          #    absence of those lines is asserted rather than assumed. This assertion
          #    was verified to have teeth: deleting the apisix.apache.org/*/status
          #    rule from the ClusterRole makes it fail.
          log="$(kubectl logs deploy/rtest-apisix-ingress-controller -c apisix-ingress-controller --tail=-1)"
          test 0 -eq "$(printf '%s' "$log" | grep -cE 'forbidden|cannot list|is not allowed' || true)"

          # 6. Nothing crash-looped on the way here, in EITHER container.
          test -z "$(kubectl get pods -o jsonpath='{range .items[*].status.containerStatuses[*]}{.restartCount}{"\n"}{end}' | grep -v '^0$')"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/apisix-ingress-controller-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/apisix-ingress-controller@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/apisix-ingress-controller:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

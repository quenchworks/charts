name: release-profiling-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/profiling-stack/**"
      - ".github/workflows/release-profiling-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/profiling-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status statefulset/rtest-pyroscope --timeout=300s
          kubectl rollout status statefulset/rtest-grafana --timeout=300s
          kubectl port-forward svc/rtest-pyroscope 4040:4040 >/tmp/pyro-pf.log 2>&1 &
          p1=$!
          kubectl port-forward svc/rtest-grafana 3000:3000 >/tmp/graf-pf.log 2>&1 &
          p2=$!; trap 'kill $p1 $p2 2>/dev/null || true' EXIT; sleep 5
          # Push a CPU profile in folded-stack form, the way an SDK or Alloy would.
          now=$(date +%s)
          printf 'main;work;quench_hot_fn 100\nmain;idle 10\n' > /tmp/gate.folded
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @/tmp/gate.folded \
            "http://127.0.0.1:4040/ingest?name=quench.gate.cpu&format=folded&from=$((now-10))&until=$now")"
          [ "$code" = 200 ] || { echo "ingest answered $code"; exit 1; }
          q='process_cpu:cpu:nanoseconds:cpu:nanoseconds{service_name="quench.gate"}'
          # Read it back from Pyroscope (the store is eventually consistent; retry briefly).
          ok=""
          for i in $(seq 1 12); do
            out="$(curl -s -G http://127.0.0.1:4040/pyroscope/render --data-urlencode "query=$q" \
              --data-urlencode from=now-1h --data-urlencode until=now)"
            grep -q quench_hot_fn <<<"$out" && { ok=1; break; }
            sleep 5
          done
          test -n "$ok" || { echo "profile not readable from Pyroscope: ${out:0:300}"; exit 1; }
          echo "Pyroscope stored and served the profile"
          # The provisioned datasource reaches Pyroscope and returns the same flame graph
          # through Grafana, with the generated admin password.
          pw="$(kubectl get secret rtest-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          health="$(curl -s -u "admin:$pw" http://127.0.0.1:3000/api/datasources/uid/pyroscope/health)"
          grep -q '"status":"OK"' <<<"$health" || { echo "datasource health: $health"; exit 1; }
          body='{"from":"now-1h","to":"now","queries":[{"refId":"A","datasource":{"uid":"pyroscope"},"queryType":"profile","profileTypeId":"process_cpu:cpu:nanoseconds:cpu:nanoseconds","labelSelector":"{service_name=\"quench.gate\"}","groupBy":[]}]}'
          out="$(curl -s -u "admin:$pw" -H 'content-type: application/json' -d "$body" http://127.0.0.1:3000/api/ds/query)"
          grep -q quench_hot_fn <<<"$out" || { echo "Grafana query: ${out:0:400}"; exit 1; }
          echo "Grafana renders the profile through the provisioned Pyroscope datasource"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/profiling-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/profiling-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/profiling-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

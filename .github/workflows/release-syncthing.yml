name: release-syncthing

on:
  push:
    branches: [main]
    paths:
      - "quench/syncthing/**"
      - ".github/workflows/release-syncthing.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/syncthing
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # Two instances, each its own release and volume, paired over the REST API.
          for r in a b; do
            helm install $r "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          done
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          key() { kubectl get secret $1-syncthing -o jsonpath="{.data.$2}" | base64 -d; }
          kubectl get secret a-syncthing-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca-a.crt
          kubectl get secret b-syncthing-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca-b.crt
          kubectl port-forward svc/a-syncthing 18384:8384 >/tmp/pfa.log 2>&1 & pfa=$!
          kubectl port-forward svc/b-syncthing 18385:8384 >/tmp/pfb.log 2>&1 & pfb=$!
          trap 'kill $pfa $pfb 2>/dev/null || true' EXIT
          for f in /tmp/pfa.log /tmp/pfb.log; do for i in $(seq 1 30); do grep -q Forwarding $f && break; sleep 1; done; done
          # the chart's certificate names the Service; port-forward reaches it as localhost
          api() { r=$1; p=$2; shift 2; curl -fsS -m 20 --cacert /tmp/ca-$r.crt --resolve "$r-syncthing:$p:127.0.0.1" -H "X-API-Key: $(key $r api-key)" "$@"; }
          url() { echo "https://$1-syncthing:$2/rest/$3"; }

          # --- PROVE TWO SYNCTHING PODS SYNC A FILE. ---
          # 1. HTTPS with the chart CA, the release's version, the key and the GUI password enforced.
          api a 18384 "$(url a 18384 system/version)" | tee /tmp/ver.json; echo
          python3 -c "import json,sys; assert json.load(open(\"/tmp/ver.json\"))[\"version\"] == \"v$want\""
          code="$(curl -s -m 20 -o /dev/null -w '%{http_code}' --cacert /tmp/ca-a.crt --resolve a-syncthing:18384:127.0.0.1 "$(url a 18384 system/status)")"
          echo "no key: $code"; test "$code" = 403 -o "$code" = 401
          # the GUI login (session cookie) takes the generated password and refuses a wrong one
          login() { curl -s -m 20 -o /dev/null -w '%{http_code}' --cacert /tmp/ca-a.crt --resolve a-syncthing:18384:127.0.0.1 \
            -H 'Content-Type: application/json' -X POST "$(url a 18384 noauth/auth/password)" -d "{\"username\":\"admin\",\"password\":\"$1\"}"; }
          code="$(login "$(key a password)")"; echo "password login: $code"; test "$code" = 204 -o "$code" = 200
          code="$(login wrong)"; echo "wrong password: $code"; test "$code" = 403 -o "$code" = 401
          id() { api $1 $2 "$(url $1 $2 system/status)" | jq -er '.myID'; }
          A="$(id a 18384)"; B="$(id b 18385)"; echo "devices $A / $B"

          # 2. Each side knows the other at its sync Service; one shared folder.
          for s in "a 18384 $B b" "b 18385 $A a"; do
            set -- $s
            api $1 $2 -X POST -H 'Content-Type: application/json' "$(url $1 $2 config/devices)" \
              -d "{\"deviceID\":\"$3\",\"name\":\"$4\",\"addresses\":[\"tcp://$4-syncthing-sync:22000\"]}" >/dev/null
            api $1 $2 -X POST -H 'Content-Type: application/json' "$(url $1 $2 config/folders)" \
              -d "{\"id\":\"gate\",\"label\":\"gate\",\"path\":\"/var/syncthing/gate\",\"rescanIntervalS\":5,\"devices\":[{\"deviceID\":\"$A\"},{\"deviceID\":\"$B\"}]}" >/dev/null
          done

          # 3. A file written into A's volume arrives in B's volume.
          vol() { kubectl get deploy $1-syncthing -o jsonpath='{.spec.template.spec.volumes[?(@.name=="data")].persistentVolumeClaim.claimName}'; }
          pod() { # $1 name, $2 claim, $3 command; runs as the app user on the claim, beside the app pod
            kubectl run $1 --restart=Never --image=ghcr.io/quenchworks/images/busybox@sha256:041302c8da3a2e182ecc2eac3c56c4f47a13c03cc284d255489c0be741893b64 \
              --overrides="{\"spec\":{\"securityContext\":{\"runAsUser\":1001,\"runAsGroup\":1001,\"fsGroup\":1001},\"volumes\":[{\"name\":\"d\",\"persistentVolumeClaim\":{\"claimName\":\"$2\"}}],\"containers\":[{\"name\":\"c\",\"image\":\"ghcr.io/quenchworks/images/busybox@sha256:041302c8da3a2e182ecc2eac3c56c4f47a13c03cc284d255489c0be741893b64\",\"command\":[\"/bin/sh\",\"-c\",\"$3\"],\"volumeMounts\":[{\"name\":\"d\",\"mountPath\":\"/d\"}]}]}}" >/dev/null
            kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/$1 --timeout=120s >/dev/null
            kubectl logs $1; kubectl delete pod $1 --wait=false >/dev/null
          }
          for i in $(seq 1 30); do api a 18384 "$(url a 18384 'db/status?folder=gate')" >/dev/null 2>&1 && break; sleep 2; done
          pod writer "$(vol a)" "until [ -d /d/gate ]; do sleep 1; done; echo quench-gate-synced > /d/gate/hello.txt; echo written"
          api a 18384 -X POST "$(url a 18384 'db/scan?folder=gate')" >/dev/null || true
          got=""
          for i in $(seq 1 12); do
            got="$(pod reader$i "$(vol b)" "cat /d/gate/hello.txt 2>/dev/null || true")"
            [ "$got" = quench-gate-synced ] && break; sleep 5
          done
          echo "on B: $got"; test "$got" = quench-gate-synced

          # 4. A restart keeps the device ID (key on the volume) and the GUI password.
          kubectl rollout restart deployment/a-syncthing
          kubectl rollout status deployment/a-syncthing --timeout=300s
          kill $pfa 2>/dev/null || true
          kubectl port-forward svc/a-syncthing 18384:8384 >/tmp/pfa2.log 2>&1 & pfa=$!
          for i in $(seq 1 30); do grep -q Forwarding /tmp/pfa2.log && break; sleep 1; done
          test "$(id a 18384)" = "$A"
          code="$(login "$(key a password)")"; test "$code" = 204 -o "$code" = 200
          echo "restart kept device $A and the GUI password"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/syncthing-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/syncthing@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/syncthing:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

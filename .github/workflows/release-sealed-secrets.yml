name: release-sealed-secrets

on:
  push:
    branches: [main]
    paths:
      - "quench/sealed-secrets/**"
      - ".github/workflows/release-sealed-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/sealed-secrets
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-sealed-secrets --timeout=300s
          kubectl get crd sealedsecrets.bitnami.com

          # probe over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward deployment/rtest-sealed-secrets 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          # the controller generated a sealing key and serves its public half
          curl -fsS http://127.0.0.1:8080/v1/cert.pem | tee /tmp/cert.pem | grep -q "BEGIN CERTIFICATE"

          # full seal -> unseal roundtrip: proves the controller decrypts for real.
          ver="$(helm show chart "${CHART_DIR}" | awk '/^appVersion:/{gsub(/"/,"");print $2}')"
          curl -fsSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${ver}/kubeseal-${ver}-linux-amd64.tar.gz" \
            | tar xz -C /tmp kubeseal
          kubectl create secret generic gate-secret --dry-run=client \
            --from-literal=password=s3cr3t -o yaml \
          | /tmp/kubeseal --cert /tmp/cert.pem --format yaml | kubectl apply -f -
          for i in $(seq 1 30); do
            kubectl get secret gate-secret >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "controller did not unseal the SealedSecret"; \
              kubectl describe sealedsecret gate-secret; \
              kubectl logs deployment/rtest-sealed-secrets; exit 1; }
            sleep 2
          done
          got="$(kubectl get secret gate-secret -o jsonpath='{.data.password}' | base64 -d)"
          [ "$got" = "s3cr3t" ] || { echo "unsealed value mismatch: '$got'"; exit 1; }
          echo "seal -> unseal roundtrip OK"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/sealed-secrets-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/sealed-secrets@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/sealed-secrets:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

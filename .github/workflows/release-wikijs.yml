name: release-wikijs

on:
  push:
    branches: [main]
    paths:
      - "quench/wikijs/**"
      - ".github/workflows/release-wikijs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/wikijs
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl rollout status deployment/rtest-wikijs --timeout=300s
          PW=$(kubectl get secret rtest-wikijs -o jsonpath='{.data.password}' | base64 -d)
          [ "$PW" = Quench-CI-wikijs-2026 ] || { echo "the Secret does not hold the values password"; exit 1; }
          L=$(kubectl logs deploy/rtest-wikijs); grep -qF 'Created administrator account <gate@quench.test> with the password from ADMIN_PASS' <<<"$L" || { echo "the admin did not come from ADMIN_PASS"; exit 1; }
          fwd() { kubectl port-forward svc/rtest-wikijs 13000:3000 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:13000
          ready() { for _ in $(seq 1 60); do curl -sf "$B/_live" >/dev/null && return 0; sleep 2; done; echo "/_live never answered"; return 1; }
          # login <password>: the response body; the site and its local strategy are looked up first
          login() {
            local s st; s=$(curl -s "$B/_api/sites/localhost" | jq -r .id)
            st=$(curl -s "$B/_api/sites/$s/auth/strategies" | jq -r '[.[]|select(.activeStrategy.strategy.key=="local")][0].id')
            curl -s -X PUT -H 'Content-Type: application/json' -d "$(jq -n --arg st "$st" --arg p "$1" '{strategyId:$st,username:"gate@quench.test",password:$p}')" "$B/_api/sites/$s/auth/login"
          }
          signin() { ready || return 1; login "$PW" | jq -e '.ok == true' >/dev/null || { echo "the generated password does not sign in"; return 1; }; }
          refused() {
            ready || return 1
            login 12345678 | jq -e '.ok == true' >/dev/null && { echo "upstream's default password signed in"; return 1; }
            login wrong-password-1 | jq -e '.ok == true' >/dev/null && { echo "a wrong password signed in"; return 1; }
            curl -s "$B/" | grep -qi '<html' || { echo "no web UI"; return 1; }
          }
          fwd signin
          fwd refused
          # the account (PostgreSQL) survives a pod restart; the Secret survives an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=wikijs --wait=true
          kubectl rollout status deployment/rtest-wikijs --timeout=300s
          fwd signin
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          [ "$(kubectl get secret rtest-wikijs -o jsonpath='{.data.password}' | base64 -d)" = "$PW" ] || { echo "the password changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-wikijs --timeout=300s
          fwd signin
          echo "wikijs: admin from ADMIN_PASS signs in, 12345678 and a wrong password refused, web UI served, kept across a pod restart and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/wikijs-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/wikijs@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/wikijs:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

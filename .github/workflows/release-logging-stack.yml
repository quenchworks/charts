name: release-logging-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/logging-stack/**"
      - ".github/workflows/release-logging-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/logging-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m

          # all components reached Ready (--wait already gates this, assert explicitly)
          kubectl rollout status statefulset/rtest-loki    --timeout=300s
          kubectl rollout status statefulset/rtest-grafana --timeout=300s
          kubectl rollout status daemonset/rtest-vector    --timeout=300s

          # port-forward Loki's HTTP API and wait for readiness.
          kubectl port-forward svc/rtest-loki 3100:3100 >/tmp/pf-loki.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT

          # INTEGRATION ASSERT 1: Loki is ready (GET /ready -> 200, body "ready").
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3100/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "Loki /ready never returned 200"; exit 1; }
          echo "Loki ready."

          # INTEGRATION ASSERT 2: Vector -> Loki works. Once Vector has tailed pod
          # logs and pushed them, Loki knows about the `namespace` label and returns
          # at least one value. This proves the whole pipeline end to end.
          ingested=""
          for i in $(seq 1 30); do
            body="$(curl -fsS "http://127.0.0.1:3100/loki/api/v1/label/namespace/values" || true)"
            echo "attempt $i: $body"
            # require status success AND a non-empty data array
            if echo "$body" | grep -q '"status":"success"' && echo "$body" | grep -qE '"data":\[[^]]'; then ingested=1; break; fi
            sleep 5
          done
          test -n "$ingested" || { echo "Loki has no 'namespace' label values — Vector->Loki ingestion not working"; exit 1; }
          echo "Vector -> Loki ingestion confirmed."

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/logging-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/logging-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/logging-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-kube-state-metrics

on:
  push:
    branches: [main]
    paths:
      - "quench/kube-state-metrics/**"
      - ".github/workflows/release-kube-state-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/kube-state-metrics
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The image is pinned by digest and lives in a non-public GHCR package,
          # so give the pod credentials to pull the real, signed artifact. A
          # pre-created ServiceAccount carries the pull secret from pod-creation
          # time (patching a chart-created SA would not affect the running pod).
          # It keeps the default automount, which this exporter needs: watching
          # cluster objects over the API is the whole job.
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl create serviceaccount ksm-puller
          kubectl patch serviceaccount ksm-puller \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set serviceAccount.create=false --set serviceAccount.name=ksm-puller \
            --wait --timeout 5m
          kubectl rollout status deployment/rtest-kube-state-metrics --timeout=300s
          # probe over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward svc/rtest-kube-state-metrics 8080:8080 8081:8081 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # health: /livez on the metrics listener, /readyz on the telemetry one
          curl -fsS -o /dev/null http://127.0.0.1:8080/livez
          curl -fsS -o /dev/null http://127.0.0.1:8081/readyz
          # the exporter must actually export cluster state, not just answer health
          curl -fsS http://127.0.0.1:8080/metrics >/tmp/metrics.txt
          grep -q '^kube_node_info{'                /tmp/metrics.txt
          grep -q '^kube_deployment_status_replicas{' /tmp/metrics.txt
          grep -q '^kube_endpointslice_info{'        /tmp/metrics.txt
          # RBAC regression guard. A missing ClusterRole rule does NOT fail the
          # install: the exporter starts, serves metrics and silently drops the
          # collector while logging a forbidden reflector error. Only this check
          # catches it (it is how the missing discovery.k8s.io rule was found).
          if kubectl logs deployment/rtest-kube-state-metrics --tail=500 | grep -i forbidden; then
            echo "::error::kube-state-metrics logged an RBAC 'forbidden' error -- the ClusterRole is missing a rule for a default collector"
            exit 1
          fi

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/kube-state-metrics-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/kube-state-metrics@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/kube-state-metrics:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

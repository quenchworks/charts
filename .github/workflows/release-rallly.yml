name: release-rallly

on:
  push:
    branches: [main]
    paths:
      - "quench/rallly/**"
      - ".github/workflows/release-rallly.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/rallly
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # sign-in is by emailed code: the QuenchWorks Mailpit chart is the SMTP server and the inbox the gate reads
          helm install mail oci://ghcr.io/quenchworks/charts/mailpit --version 0.0.16 --wait --timeout 8m
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl rollout status deployment/rtest-rallly --timeout=300s
          SP=$(kubectl get secret rtest-rallly -o jsonpath='{.data.secret-password}' | base64 -d)
          [ ${#SP} -ge 32 ] || { echo "the generated SECRET_PASSWORD is too short"; exit 1; }
          # baseUrl is http://127.0.0.1:3000: better-auth checks the Origin header against it
          fwd() {
            kubectl port-forward svc/rtest-rallly 3000:3000 >/tmp/pf.log 2>&1 & local pf=$!
            kubectl port-forward svc/mail-mailpit 8025:8025 >/tmp/pf-mail.log 2>&1 & local pm=$!
            sleep 3; local rc=0; "$@" || rc=$?; kill $pf $pm 2>/dev/null || true; return $rc
          }
          B=http://127.0.0.1:3000 M=http://127.0.0.1:8025 EMAIL=gate@quench.test
          # auth <path> <json>: prints the status, body in /tmp/r.out, session in /tmp/r.jar
          auth() { curl -s -o /tmp/r.out -w '%{http_code}' -b /tmp/r.jar -c /tmp/r.jar -H "Origin: $B" -H 'Content-Type: application/json' -X POST "$B/api/better-auth$1" -d "$2"; }
          up() { for _ in $(seq 1 60); do curl -sf "$B/api/status" -o /tmp/s.json && jq -e '.database == "connected"' /tmp/s.json >/dev/null && return 0; sleep 2; done; echo "/api/status never reported the database"; return 1; }
          session() { curl -s -b /tmp/r.jar -H "Origin: $B" "$B/api/better-auth/get-session" | jq -e --arg e "$EMAIL" '.user.email == $e' >/dev/null; }
          signin() {
            up || return 1
            curl -s -X DELETE "$M/api/v1/messages" >/dev/null || return 1
            [ "$(auth /email-otp/send-verification-otp "{\"email\":\"$EMAIL\",\"type\":\"sign-in\"}")" = 200 ] || { echo "asking for a code failed: $(cat /tmp/r.out)"; return 1; }
            local id="" code
            for _ in $(seq 1 30); do id=$(curl -s "$M/api/v1/messages" | jq -r --arg e "$EMAIL" '[.messages[]|select(.To[].Address==$e)][0].ID // empty'); [ -n "$id" ] && break; sleep 2; done
            [ -n "$id" ] || { echo "no sign-in code reached Mailpit"; return 1; }
            code=$(curl -s "$M/api/v1/message/$id" | jq -r .Text | grep -oE '\b[0-9]{6}\b' | head -1)
            [ -n "$code" ] || { echo "no 6-digit code in the mail"; return 1; }
            rm -f /tmp/r.jar
            [ "$(auth /sign-in/email-otp "{\"email\":\"$EMAIL\",\"otp\":\"000000\"}")" != 200 ] || [ "$code" = 000000 ] || { echo "a wrong code signed in"; return 1; }
            [ "$(auth /sign-in/email-otp "{\"email\":\"$EMAIL\",\"otp\":\"$code\"}")" = 200 ] || { echo "the emailed code was refused: $(cat /tmp/r.out)"; return 1; }
            session || { echo "no session for $EMAIL after sign-in"; return 1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/v1/polls")" = 401 ] || { echo "an unkeyed API call was not refused"; return 1; }
          }
          kept() { up || return 1; session || { echo "the session did not survive"; return 1; }; }
          fwd signin
          # the account and session (PostgreSQL) survive a pod restart; SECRET_PASSWORD survives an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=rallly --wait=true
          kubectl rollout status deployment/rtest-rallly --timeout=300s
          fwd kept
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          [ "$(kubectl get secret rtest-rallly -o jsonpath='{.data.secret-password}' | base64 -d)" = "$SP" ] || { echo "SECRET_PASSWORD changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-rallly --timeout=300s
          fwd kept
          echo "rallly: sign-in code mailed through Mailpit, wrong code refused, emailed code signs in, unkeyed API refused, session kept across a pod restart and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/rallly-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/rallly@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/rallly:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

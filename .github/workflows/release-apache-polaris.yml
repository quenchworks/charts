name: release-apache-polaris

on:
  push:
    branches: [main]
    paths:
      - "quench/apache-polaris/**"
      - ".github/workflows/release-apache-polaris.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/apache-polaris
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          # the admin-tool bootstrap ran against the bundled PostgreSQL
          boot="$(kubectl logs deployment/rtest-apache-polaris -c bootstrap)"
          grep -qE "Realm 'POLARIS' (successfully bootstrapped|is already bootstrapped)" <<<"$boot"
          ID="$(kubectl get secret rtest-apache-polaris -o jsonpath='{.data.client-id}' | base64 -d)"
          SECRET="$(kubectl get secret rtest-apache-polaris -o jsonpath='{.data.client-secret}' | base64 -d)"
          test -n "$SECRET"
          pf() { kubectl port-forward svc/rtest-apache-polaris 8181:8181 >/dev/null 2>&1 & PF=$!
                 for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8181/api/catalog/v1/config && return; sleep 1; done; return 1; }
          token() { r="$(curl -fsS "$B/catalog/v1/oauth/tokens" -d grant_type=client_credentials \
                      -d client_id="$ID" -d client_secret="$SECRET" -d scope=PRINCIPAL_ROLE:ALL)"
                    T="$(sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p' <<<"$r")"; test -n "$T"; }
          B=http://127.0.0.1:8181/api
          pf
          token
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json')
          # an S3 catalog: creating it and its namespaces stores metadata only, no bucket needed
          curl -fsS "${H[@]}" "$B/management/v1/catalogs" -d '{"catalog":{"name":"gate","type":"INTERNAL",
            "properties":{"default-base-location":"s3://quench-gate/wh"},
            "storageConfigInfo":{"storageType":"S3","allowedLocations":["s3://quench-gate/wh"],
            "roleArn":"arn:aws:iam::123456789012:role/quench-gate"}}}' >/dev/null
          curl -fsS "${H[@]}" "$B/catalog/v1/gate/namespaces" -d '{"namespace":["smoke"]}' >/dev/null
          cats="$(curl -fsS "${H[@]}" "$B/management/v1/catalogs")"; grep -q '"name" *: *"gate"' <<<"$cats"
          ns="$(curl -fsS "${H[@]}" "$B/catalog/v1/gate/namespaces")"; grep -q '"smoke"' <<<"$ns"
          kill $PF
          # PostgreSQL keeps them: recreate the pod (bootstrap must skip the realm) and list again
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=apache-polaris --wait
          kubectl rollout status deployment/rtest-apache-polaris --timeout=300s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=apache-polaris --timeout=300s
          boot="$(kubectl logs deployment/rtest-apache-polaris -c bootstrap)"
          grep -q "Realm 'POLARIS' is already bootstrapped" <<<"$boot"
          pf
          token
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json')
          cats="$(curl -fsS "${H[@]}" "$B/management/v1/catalogs")"; grep -q '"name" *: *"gate"' <<<"$cats"
          ns="$(curl -fsS "${H[@]}" "$B/catalog/v1/gate/namespaces")"; grep -q '"smoke"' <<<"$ns"
          kill $PF
          # readiness warnings (the realm header default) are fine; a severe one aborts startup
          logs="$(kubectl logs deployment/rtest-apache-polaris -c polaris | tr -d '\000')"
          ! grep -E 'ClassNotFound|NoClassDefFound|LinkageError|Severe production readiness' <<<"$logs" || exit 1
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/apache-polaris-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/apache-polaris@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/apache-polaris:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-apisix

on:
  push:
    branches: [main]
    paths:
      - "quench/apisix/**"
      - ".github/workflows/release-apisix.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/apisix
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-apisix --timeout=300s

          # A real upstream to route to. Ready before APISIX is asked to reach it.
          kubectl create deployment gate-upstream --image=nginx:alpine
          kubectl expose deployment gate-upstream --port=80
          kubectl wait --for=condition=available deploy/gate-upstream --timeout=300s

          key="$(kubectl get secret rtest-apisix-admin -o jsonpath='{.data.admin-key}' | base64 -d)"
          test -n "$key"

          # The runtime image ships no HTTP client, so drive both ports from a
          # curl pod inside the cluster.
          kubectl run gate-client --image=curlimages/curl:latest --restart=Never --command -- sleep 900
          kubectl wait --for=condition=ready pod/gate-client --timeout=300s
          k() { kubectl exec gate-client -- "$@"; }

          # 1. Admin API writes the route into etcd.
          k curl -fsS -X PUT "http://rtest-apisix:9180/apisix/admin/routes/1" \
            -H "X-API-KEY: ${key}" \
            -d '{"uri":"/get","plugins":{"proxy-rewrite":{"uri":"/"}},"upstream":{"type":"roundrobin","nodes":{"gate-upstream:80":1}}}'

          # 2. The DATA PLANE actually routes it. A 404 here means routing is
          #    broken, so assert the upstream's own body, not just a status code.
          for i in $(seq 1 30); do
            body="$(k curl -sS http://rtest-apisix:9080/get || true)"
            case "$body" in *"Welcome to nginx"*) break ;; esac
            sleep 2
          done
          case "$body" in
            *"Welcome to nginx"*) echo "proxy round trip OK" ;;
            *) echo "FAIL: the data plane did not route to the upstream: ${body:0:200}"
               kubectl logs deployment/rtest-apisix --tail=50; exit 1 ;;
          esac

          # 3. The Admin API is really key-protected.
          code="$(k curl -sS -o /dev/null -w '%{http_code}' -H 'X-API-KEY: wrong' http://rtest-apisix:9180/apisix/admin/routes)"
          test "$code" = "401" || { echo "FAIL: a bad admin key returned ${code}, not 401"; exit 1; }

          # 4. Nothing crash-looped on the way here.
          restarts="$(kubectl get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: a container restarted"; exit 1 ;; esac

      - name: Role gates (hybrid control/data plane, standalone file + API)
        run: |
          set -o pipefail
          V="${CHART_DIR}/ci/default-values.yaml"
          k() { kubectl exec gate-client -- "$@"; }
          served() { # $1 url: the upstream's own body comes back through APISIX
            for i in $(seq 1 45); do
              body="$(k curl -sS "$1" || true)"
              case "$body" in *"Welcome to nginx"*) return 0 ;; esac
              sleep 2
            done
            echo "FAIL: $1 did not reach the upstream: ${body:0:200}"; return 1
          }
          route='{"uri":"/get","plugins":{"proxy-rewrite":{"uri":"/"}},"upstream":{"type":"roundrobin","nodes":{"gate-upstream:80":1}}}'

          # Hybrid: the control plane owns etcd and the Admin API, the data plane
          # proxies what it reads from that etcd and runs no Admin API.
          helm install cp "${CHART_DIR}" -f "$V" --set role=control_plane --wait --timeout 10m
          helm install dp "${CHART_DIR}" -f "$V" --set role=data_plane --set etcd.enabled=false \
            --set 'etcdClient.hosts={http://cp-etcd:2379}' --wait --timeout 10m
          ports() { kubectl get svc "$1" -o jsonpath='{.spec.ports[*].name}'; }
          case " $(ports cp-apisix) " in *" http "*) echo "FAIL: the control plane Service exposes the proxy"; exit 1 ;; esac
          case " $(ports dp-apisix) " in *" admin "*) echo "FAIL: the data plane Service exposes the Admin API"; exit 1 ;; esac
          test "$(kubectl get svc cp-apisix -o jsonpath='{.spec.type}')" = ClusterIP
          if helm template x "${CHART_DIR}" -f "$V" --set role=control_plane --set service.type=LoadBalancer >/dev/null 2>&1; then
            echo "FAIL: a LoadBalancer control plane rendered"; exit 1; fi
          cpkey="$(kubectl get secret cp-apisix-admin -o jsonpath='{.data.admin-key}' | base64 -d)"
          k curl -fsS -X PUT http://cp-apisix:9180/apisix/admin/routes/1 -H "X-API-KEY: ${cpkey}" -d "$route"
          served http://dp-apisix:9080/get
          echo "hybrid: route written through the control plane is served by the data plane"
          kubectl delete pod -l app.kubernetes.io/instance=dp --wait
          kubectl rollout status deployment/dp-apisix --timeout=300s
          served http://dp-apisix:9080/get
          echo "hybrid: a restarted data plane serves the route again from etcd"

          # Standalone, file-driven: the route table comes from values, no etcd, no Admin API.
          cat > /tmp/sa.yaml <<'YAML'
          role: standalone
          etcd: {enabled: false}
          standalone:
            mode: file
            config:
              routes:
                - id: "1"
                  uri: /get
                  plugins: {proxy-rewrite: {uri: /}}
                  upstream: {type: roundrobin, nodes: {"gate-upstream:80": 1}}
          YAML
          helm install sa "${CHART_DIR}" -f "$V" -f /tmp/sa.yaml --wait --timeout 10m
          case " $(ports sa-apisix) " in *" admin "*) echo "FAIL: file standalone exposes an Admin API"; exit 1 ;; esac
          if kubectl get statefulset sa-etcd >/dev/null 2>&1; then echo "FAIL: standalone installed etcd"; exit 1; fi
          served http://sa-apisix:9080/get
          echo "standalone file: route from values served with no etcd"

          # Standalone, API-driven: the whole config is pushed into memory.
          helm install sapi "${CHART_DIR}" -f "$V" --set role=standalone --set standalone.mode=api \
            --set etcd.enabled=false --wait --timeout 10m
          akey="$(kubectl get secret sapi-apisix-admin -o jsonpath='{.data.admin-key}' | base64 -d)"
          # APISIX 3.19 refuses a push without X-Digest (400 "missing digest header"); it stores
          # the value to tell when every worker has applied the config, so a body hash fits.
          body="{\"routes\":[$(echo "$route" | sed 's/^{/{"id":"1",/')]}"
          k curl -fsS -X PUT http://sapi-apisix:9180/apisix/admin/configs -H "X-API-KEY: ${akey}" \
            -H "X-Digest: $(printf %s "$body" | sha256sum | cut -d' ' -f1)" -H 'Content-Type: application/json' -d "$body"
          served http://sapi-apisix:9080/get
          echo "standalone api: config pushed through the Admin API is served"

          restarts="$(kubectl get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: a container restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/apisix-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/apisix@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/apisix:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-tetragon

on:
  push:
    branches: [main]
    paths:
      - "quench/tetragon/**"
      - ".github/workflows/release-tetragon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/tetragon
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status daemonset/rtest-tetragon-agent --timeout=300s
          kubectl rollout status deployment/rtest-tetragon-operator --timeout=300s

          # --- PROVE THE AGENT TRACES THE KERNEL AND KNOWS THE CLUSTER. ---
          # 1. The operator installed the TracingPolicy CRD.
          kubectl wait --for=condition=Established crd/tracingpolicies.cilium.io --timeout=120s

          # 2. The agent loaded its BPF sensors (its gRPC health probe is what made
          #    the DaemonSet Ready) and answers tetra over its local socket.
          T() { kubectl exec ds/rtest-tetragon-agent -c tetragon -- tetra "$@"; }
          T status | tee /tmp/status.txt
          grep -qi running /tmp/status.txt

          # 3. A TracingPolicy from the CRD reaches the agent: a kprobe on
          #    security_file_permission for /etc/hostname.
          kubectl apply -f - <<'YAML'
          apiVersion: cilium.io/v1alpha1
          kind: TracingPolicy
          metadata: { name: quench-gate }
          spec:
            kprobes:
              - call: security_file_permission
                syscall: false
                args:
                  - { index: 0, type: file }
                  - { index: 1, type: int }
                selectors:
                  - matchArgs:
                      - { index: 0, operator: Equal, values: ["/etc/hostname"] }
          YAML
          for i in $(seq 1 30); do T tracingpolicy list 2>/dev/null | grep -q quench-gate && break; sleep 2; done
          T tracingpolicy list | tee /tmp/tp.txt
          grep -q quench-gate /tmp/tp.txt

          # 4. A pod reading /etc/hostname in a loop. Its events must carry the
          #    pod name (Kubernetes API enrichment) and include the kprobe.
          kubectl run gate-reader --image=ghcr.io/quenchworks/images/busybox:1.38.0 --restart=Never \
            --command -- sh -c 'while true; do cat /etc/hostname >/dev/null; sleep 1; done'
          kubectl wait --for=condition=Ready pod/gate-reader --timeout=180s
          timeout 30 kubectl exec ds/rtest-tetragon-agent -c tetragon -- tetra getevents -o compact > /tmp/events.txt 2>&1 || true
          # Filter to a file first: grep | head SIGPIPEs under pipefail.
          grep 'default/gate-reader' /tmp/events.txt > /tmp/pod-events.txt || true
          sed -n 1,5p /tmp/pod-events.txt
          # exec events enriched with namespace/pod ...
          grep -qE 'process +default/gate-reader .*/cat /etc/hostname' /tmp/pod-events.txt
          # ... and the kprobe from the TracingPolicy, attributed to the same pod.
          grep -qE 'read +default/gate-reader .*/etc/hostname' /tmp/pod-events.txt

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/tetragon-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/tetragon@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/tetragon:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

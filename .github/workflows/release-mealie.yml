name: release-mealie

on:
  push:
    branches: [main]
    paths:
      - "quench/mealie/**"
      - ".github/workflows/release-mealie.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mealie
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          kubectl get secret rtest-mealie-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
          fwd() { kubectl port-forward svc/rtest-mealie 19000:9000 18443:443 >/tmp/pf.log 2>&1 & pf=$!
            for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:18443' /tmp/pf.log && break; sleep 1; done; }
          fwd; trap 'kill $pf 2>/dev/null || true' EXIT
          B=http://127.0.0.1:19000
          T=(--cacert /tmp/ca.crt --resolve rtest-mealie:18443:127.0.0.1)
          H=https://rtest-mealie:18443
          login() { curl -fsS -m 30 "$B/api/auth/token" -d username=changeme@example.com -d password=MyPassword | jq -er '.access_token'; }

          # --- PROVE MEALIE STORES RECIPES ON ITS VOLUME. ---
          # 1. The release's version, and the frontend over HTTPS with the chart CA.
          v="$(curl -fsS -m 20 $B/api/app/about | jq -er '.version')"
          echo "version $v (want $want)"; test "${v#v}" = "$want"
          grep -qi '<html' <<<"$(curl -fsS -m 20 "${T[@]}" "$H/")"

          # 2. The seeded admin logs in; a wrong password is refused.
          code="$(curl -s -m 20 -o /dev/null -w '%{http_code}' $B/api/auth/token -d username=changeme@example.com -d password=wrong)"
          echo "wrong password: $code"; test "$code" = 401
          tok="$(login)"

          # 3. A recipe, read back over HTTPS.
          slug="$(curl -fsS -m 30 -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' $B/api/recipes -d '{"name":"Quench Gate Soup"}' | tr -d '"')"
          grep -q 'Quench Gate Soup' <<<"$(curl -fsS -m 20 -H "Authorization: Bearer $tok" "${T[@]}" "$H/api/recipes/$slug")"
          echo "recipe $slug created, read over HTTPS"

          # 4. A settings change through helm upgrade rolls the pod; the recipe is still there (SQLite on the PVC).
          kill $pf 2>/dev/null || true
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set-string settings.TZ=Europe/Amsterdam --wait --timeout 10m
          kubectl rollout status deployment/rtest-mealie --timeout=600s
          fwd
          for i in $(seq 1 60); do curl -fsS -m 10 $B/api/app/about >/dev/null 2>&1 && break; sleep 2; done
          grep -q 'Quench Gate Soup' <<<"$(curl -fsS -m 20 -H "Authorization: Bearer $(login)" "$B/api/recipes/$slug")"
          echo "recipe kept across the upgrade"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mealie-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mealie@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/mealie:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-firefly-iii

on:
  push:
    branches: [main]
    paths:
      - "quench/firefly-iii/**"
      - ".github/workflows/release-firefly-iii.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/firefly-iii
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-firefly-iii --timeout=600s
          EMAIL=gate@quench-works.com PW=quench-ci-firefly-pass-2026
          fwd() { kubectl port-forward svc/rtest-firefly-iii 8080:8080 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          # form <base> <page> <field=value>...: GET the page for its CSRF token, POST it; prints the Location
          form() {
            local b=$1 p=$2; shift 2; rm -f /tmp/ff.jar
            local tok; tok=$(curl -fsS -c /tmp/ff.jar -b /tmp/ff.jar $CURL "$b$p" | grep -o 'name="_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
            [ -n "$tok" ] || { echo "no CSRF token on $p" >&2; return 1; }
            local a=(--data-urlencode "_token=$tok"); for f in "$@"; do a+=(--data-urlencode "$f"); done
            curl -s -o /dev/null -w '%{redirect_url}' -c /tmp/ff.jar -b /tmp/ff.jar $CURL "${a[@]}" "$b$p"
          }
          ready() { for _ in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' $CURL "$1/login")" = 200 ] && return 0; sleep 2; done; return 1; }
          signin() {
            local b=$1; ready "$b"
            case "$(form "$b" /login "email=$EMAIL" password=wrong-password-1)" in */login) ;; *) echo "a wrong password was not sent back to /login"; return 1;; esac
            case "$(form "$b" /login "email=$EMAIL" "password=$PW")" in */login|"") echo "sign-in failed"; return 1;; esac
          }
          first() {
            local b=http://127.0.0.1:8080; ready "$b"
            case "$(form "$b" /register "email=$EMAIL" "password=$PW" "password_confirmation=$PW")" in */register|"") echo "registration failed"; return 1;; esac
            signin "$b"
          }
          CURL="" fwd first
          # the account and the APP_KEY survive a pod restart (storage on the PVC, key in the Secret)
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-firefly-iii --timeout=600s
          CURL="" fwd signin http://127.0.0.1:8080
          # native TLS on the same port with the Helm-made CA, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 10m
          kubectl rollout status deployment/rtest-firefly-iii --timeout=600s
          kubectl get secret rtest-firefly-iii-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ff-ca.crt
          tlsgate() {
            signin https://rtest-firefly-iii:8080 || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:8080/login 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          CURL="--cacert /tmp/ff-ca.crt --resolve rtest-firefly-iii:8080:127.0.0.1" fwd tlsgate
          echo "firefly-iii: first account registered, wrong password refused, sign-in kept across a pod restart, native TLS: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/firefly-iii-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/firefly-iii@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/firefly-iii:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

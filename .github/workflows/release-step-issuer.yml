name: release-step-issuer

on:
  push:
    branches: [main]
    paths:
      - "quench/step-issuer/**"
      - ".github/workflows/release-step-issuer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/step-issuer
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind, cert-manager + step-ca)
        run: |
          set -o pipefail
          for ns in cert-manager pki; do
            kubectl create namespace $ns
            kubectl -n $ns create secret docker-registry ghcr-pull --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          done
          kubectl -n pki create serviceaccount step-ca-puller
          kubectl -n pki patch serviceaccount step-ca-puller -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          helm dependency build quench/cert-manager
          helm dependency build quench/step-ca
          helm install cm quench/cert-manager -n cert-manager --set 'imagePullSecrets[0]=ghcr-pull' --wait --timeout 6m
          helm install ca quench/step-ca -n pki --set serviceAccount.create=false --set serviceAccount.name=step-ca-puller \
            --set auth.password=gatepw --set auth.provisionerPassword=gateprov --wait --timeout 6m
          helm install rtest "${CHART_DIR}" -n pki -f "${CHART_DIR}/ci/default-values.yaml" \
            --set 'imagePullSecrets[0]=ghcr-pull' \
            --set approver.certManagerServiceAccount.name=cm-cert-manager-controller \
            --set approver.certManagerServiceAccount.namespace=cert-manager --wait --timeout 4m
          kubectl -n pki rollout status deployment/rtest-step-issuer --timeout=180s
          # The CA's root and its first JWK provisioner's key id, from step-ca's public API.
          kubectl -n pki port-forward svc/ca-step-ca 9000:443 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          root="$(curl -fsSk https://127.0.0.1:9000/roots.pem)"
          kid="$(curl -fsSk https://127.0.0.1:9000/provisioners | jq -r '[.provisioners[]|select(.type=="JWK")][0].key.kid')"
          [ -n "$kid" ] && [ "$kid" != null ]
          printf '%s\n' "$root" > /tmp/root.pem
          printf '%s\n' 'apiVersion: certmanager.step.sm/v1beta1' 'kind: StepClusterIssuer' 'metadata:' '  name: step-ca' \
            'spec:' '  url: https://ca-step-ca.pki.svc' "  caBundle: $(base64 -w0 /tmp/root.pem)" '  provisioner:' \
            '    name: admin@quench-works.com' "    kid: $kid" \
            '    passwordRef: {name: ca-step-ca, namespace: pki, key: provisioner-password}' > /tmp/issuer.yaml
          kubectl apply -f /tmp/issuer.yaml
          kubectl wait stepclusterissuer/step-ca --for=condition=Ready --timeout=120s
          # cert-manager approves the request (approver binding) and step-issuer signs it via step-ca.
          kubectl create namespace app
          printf '%s\n' 'apiVersion: cert-manager.io/v1' 'kind: Certificate' 'metadata: {name: web, namespace: app}' \
            'spec:' '  secretName: web-tls' '  dnsNames: [web.app.svc]' '  duration: 24h' \
            '  issuerRef: {group: certmanager.step.sm, kind: StepClusterIssuer, name: step-ca}' > /tmp/cert.yaml
          kubectl apply -f /tmp/cert.yaml
          kubectl -n app wait certificate/web --for=condition=Ready --timeout=180s
          kubectl -n app get secret web-tls -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/web.crt
          openssl verify -CAfile /tmp/root.pem -untrusted /tmp/web.crt /tmp/web.crt
          san="$(openssl x509 -in /tmp/web.crt -noout -ext subjectAltName)"
          grep -q 'DNS:web.app.svc' <<<"$san" || { echo "SAN: $san"; exit 1; }
          echo "step-issuer signed web.app.svc through step-ca; the chain verifies against the CA root"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/step-issuer-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/step-issuer@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/step-issuer:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

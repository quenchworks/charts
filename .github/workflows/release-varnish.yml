name: release-varnish

on:
  push:
    branches: [main]
    paths:
      - "quench/varnish/**"
      - ".github/workflows/release-varnish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/varnish
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-varnish --timeout=300s

          # The runtime image has no HTTP client, so probe over a port-forward.
          kubectl port-forward deployment/rtest-varnish 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5

          # --- PROVE VARNISH IS SERVING, not that a port is open. X-Varnish and
          # Server: Varnish are emitted by varnishd itself, so a 200 carrying both
          # means the VCL compiled, the child process is alive and the cache
          # answered the request. A tcpSocket check would pass on a varnishd whose
          # child had died, and port-forward accepts before the pod even serves. ---
          curl -fsS -D /tmp/h1 -o /tmp/b1 "http://127.0.0.1:8080/varnish-health"
          grep -qi '^x-varnish:' /tmp/h1
          grep -qi '^server: *varnish' /tmp/h1
          grep -q 'varnish OK' /tmp/b1

          # A second request must get its OWN transaction id: the xid counter moved,
          # so a live child is minting transactions.
          curl -fsS -D /tmp/h2 -o /dev/null "http://127.0.0.1:8080/second"
          x1="$(grep -i '^x-varnish:' /tmp/h1 | tr -dc '0-9')"
          x2="$(grep -i '^x-varnish:' /tmp/h2 | tr -dc '0-9')"
          test -n "$x1" && test -n "$x2" && test "$x1" != "$x2"

          # varnishstat reads the shared-memory log out of the working dir, so this
          # also proves -n /var/lib/varnish is writable on the read-only rootfs.
          kubectl exec deployment/rtest-varnish -- varnishstat -1 -n /var/lib/varnish \
            -f MAIN.client_req | tee /tmp/stat.out
          grep -q 'MAIN.client_req' /tmp/stat.out

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/varnish-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/varnish@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/varnish:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

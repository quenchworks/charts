name: release-nginx-proxy-manager

on:
  push:
    branches: [main]
    paths:
      - "quench/nginx-proxy-manager/**"
      - ".github/workflows/release-nginx-proxy-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/nginx-proxy-manager
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-nginx-proxy-manager --timeout=300s
          for c in data letsencrypt; do
            test "$(kubectl get pvc $c-rtest-nginx-proxy-manager-0 -o jsonpath='{.status.phase}')" = Bound
          done
          pw="$(kubectl get secret rtest-nginx-proxy-manager-admin -o jsonpath='{.data.password}' | base64 -d)"
          kubectl port-forward svc/rtest-nginx-proxy-manager-admin 8181:81 >/tmp/pf-admin.log 2>&1 &
          pfa=$!
          kubectl port-forward svc/rtest-nginx-proxy-manager 8080:80 >/tmp/pf-http.log 2>&1 &
          pfh=$!; trap 'kill $pfa $pfh' EXIT; sleep 5
          grep -q '"status":"OK"' <<<"$(curl -fsS http://127.0.0.1:8181/api/)"
          # real function: log in as the chart's admin, create a proxy host, and fetch through it
          token="$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identity\":\"admin@quench.test\",\"secret\":\"$pw\"}" \
            http://127.0.0.1:8181/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          created="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"domain_names":["gate.test"],"forward_scheme":"http","forward_host":"127.0.0.1","forward_port":8181,"meta":{}}' \
            http://127.0.0.1:8181/api/nginx/proxy-hosts)"
          id="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$created")"
          # the backend writes the config, runs nginx -t and reloads after answering, then
          # records the outcome in the host's meta
          ok=0
          for i in $(seq 1 30); do
            host="$(curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8181/api/nginx/proxy-hosts/$id || true)"
            body="$(curl -sS -H 'Host: gate.test' http://127.0.0.1:8080/ || true)"
            grep -q '"nginx_online":true' <<<"$host" && grep -q '<div id="root"' <<<"$body" && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = 1 ]
          echo "nginx-proxy-manager: proxy host created through the API serves on Service port 80"

          # the proxy host config survives a restart (it lives on the PVC)
          kill $pfa $pfh || true; trap - EXIT
          kubectl delete pod rtest-nginx-proxy-manager-0 --wait
          kubectl rollout status statefulset/rtest-nginx-proxy-manager --timeout=300s
          kubectl wait --for=condition=Ready pod/rtest-nginx-proxy-manager-0 --timeout=300s

          # admin TLS: the same release upgraded IN PLACE to tls.enabled serves the admin UI over
          # HTTPS with a certificate that verifies against the chart CA, and the proxy host still works
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status statefulset/rtest-nginx-proxy-manager --timeout=600s
          kubectl get secret rtest-nginx-proxy-manager-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
          kubectl port-forward svc/rtest-nginx-proxy-manager-admin 8181:81 >/tmp/pf-tls.log 2>&1 &
          pfa=$!
          kubectl port-forward svc/rtest-nginx-proxy-manager 8080:80 >/tmp/pf-http2.log 2>&1 &
          pfh=$!; trap 'kill $pfa $pfh' EXIT; sleep 5
          A="https://rtest-nginx-proxy-manager-admin:8181"
          C="--cacert /tmp/ca.crt --resolve rtest-nginx-proxy-manager-admin:8181:127.0.0.1"
          grep -q '"status":"OK"' <<<"$(curl -fsS $C $A/api/)"
          # the proxy host survived the restart; its upstream (the admin port) is HTTPS now, so
          # switch it through the API and fetch through it again
          token="$(curl -fsS $C -H 'Content-Type: application/json' \
            -d "{\"identity\":\"admin@quench.test\",\"secret\":\"$pw\"}" \
            $A/api/tokens | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          curl -fsS $C -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"forward_scheme":"https"}' $A/api/nginx/proxy-hosts/$id >/dev/null
          ok=0
          for i in $(seq 1 30); do
            grep -q '<div id="root"' <<<"$(curl -sS -H 'Host: gate.test' http://127.0.0.1:8080/ || true)" && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = 1 ]
          echo "nginx-proxy-manager: admin HTTPS verified against the chart CA; proxy host kept across restarts"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/nginx-proxy-manager-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/nginx-proxy-manager@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/nginx-proxy-manager:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

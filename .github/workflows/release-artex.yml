name: release-artex

on:
  push:
    branches: [main]
    paths:
      - "quench/artex/**"
      - ".github/workflows/release-artex.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/artex
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-artex --timeout=600s
          PW=Gate-Artex-Admin-2026
          fwd() { kubectl port-forward svc/rtest-artex 8787:8787 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:8787
          j() { curl -s -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' "$@"; }
          up() { for _ in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/ready")" = 200 ] && return 0; sleep 2; done; echo "/api/ready never answered"; return 1; }
          setup() {
            up || return 1
            curl -s "$B/" | grep -qi artex || { echo "the embedded console is not served"; return 1; }
            curl -s "$B/api/auth/status" | grep -q '"initialized":false' || { echo "already initialized before setup"; return 1; }
            tok=$(kubectl logs deploy/rtest-artex | sed -n 's/.*Setup token for the \/setup page: \([0-9a-f]*\).*/\1/p' | tail -1)
            [ -n "$tok" ] || { echo "no setup token in the log"; return 1; }
            [ "$(j -d '{"password":"'"$PW"'","setup_token":"wrong"}' "$B/api/auth/init")" = 403 ] || { echo "a wrong setup token was not refused"; return 1; }
            [ "$(j -d '{"password":"'"$PW"'","setup_token":"'"$tok"'"}' "$B/api/auth/init")" = 200 ] || { echo "init failed: $(cat /tmp/body)"; return 1; }
          }
          kept() {
            up || return 1
            curl -s "$B/api/auth/status" | grep -q '"initialized":true' || { echo "the admin password was lost"; return 1; }
            [ "$(j -d '{"username":"ARTEX","password":"wrong-password-123"}' "$B/api/auth/login")" != 200 ] || { echo "a wrong password was accepted"; return 1; }
            [ "$(j -d '{"username":"ARTEX","password":"'"$PW"'"}' "$B/api/auth/login")" = 200 ] || { echo "the admin cannot sign in: $(cat /tmp/body)"; return 1; }
            t=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' /tmp/body)
            curl -s -H "Authorization: Bearer $t" "$B/api/health" | grep -q '"version":"'"$(awk '/^appVersion:/{gsub(/"/,"",$2);print $2}' "${CHART_DIR}/Chart.yaml")"'"' || { echo "signed-in /api/health does not report the version"; return 1; }
          }
          fwd setup
          fwd kept
          # the password (PostgreSQL) and the JWT keys (the volume) survive a pod restart and an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=artex --wait=true
          kubectl rollout status deployment/rtest-artex --timeout=600s
          fwd kept
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-artex --timeout=600s
          fwd kept
          echo "artex: console served, setup token sets the admin password (a wrong token refused), wrong password refused, admin signs in, version reported, kept across a pod restart and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/artex-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/artex@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/artex:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

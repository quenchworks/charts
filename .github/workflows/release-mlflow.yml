name: release-mlflow

on:
  push:
    branches: [main]
    paths:
      - "quench/mlflow/**"
      - ".github/workflows/release-mlflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mlflow
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled postgresql subchart into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Warm mlflow image on the kind node
        run: |
          set -o pipefail
          # The mlflow image unpacks a large python venv (pandas/numpy + 78 pkgs = tens of
          # thousands of small files); extracting it in kind's nested overlayfs is slow.
          # Pull the exact pinned digest onto the node HERE (outside the helm --wait window)
          # so the pod starts immediately and the readiness gate isn't eaten by extraction.
          IMG="$(helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" | grep -oE 'ghcr.io/quenchworks/images/mlflow@sha256:[a-f0-9]{64}' | head -1)"
          echo "warming image: $IMG"
          NODE="$(docker ps --filter name=control-plane --format '{{.Names}}' | head -1)"
          echo "kind node: $NODE"
          time docker exec "$NODE" crictl pull "$IMG"
          docker exec "$NODE" crictl images | grep -i mlflow || true

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait blocks until BOTH the bundled PostgreSQL and MLflow are Ready. MLflow
          # only becomes Ready once it connects to Postgres and runs its DB migrations on
          # first boot, so this is the real integration test. The image is pre-warmed on
          # the node above, so this window covers boot + migrations, not extraction.
          helm install rtest "${CHART_DIR}" -n ml --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-mlflow -n ml --timeout=540s
          # --- confirm the container runs as the nonroot uid 1001 ---
          uid="$(kubectl get pod -n ml -l app.kubernetes.io/name=mlflow -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"
          test "$uid" = "1001"
          # --- smoke: /health returns 200, experiments API returns 200 JSON ---
          kubectl port-forward -n ml svc/rtest-mlflow 5000:5000 >/tmp/pf5000.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          hcode="$(curl -s -o /tmp/health.txt -w '%{http_code}' http://127.0.0.1:5000/health)"
          echo "health HTTP status: $hcode"; cat /tmp/health.txt
          test "$hcode" = "200"
          ecode="$(curl -s -o /tmp/exp.json -w '%{http_code}' 'http://127.0.0.1:5000/api/2.0/mlflow/experiments/search?max_results=10')"
          echo "experiments HTTP status: $ecode"; cat /tmp/exp.json
          test "$ecode" = "200"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="; kubectl get pods -n ml -o wide || true
          echo "=== mlflow describe ==="; kubectl describe pod -n ml -l app.kubernetes.io/name=mlflow || true
          echo "=== mlflow logs ==="; kubectl logs -n ml -l app.kubernetes.io/name=mlflow --tail=80 || true
          echo "=== mlflow previous logs ==="; kubectl logs -n ml -l app.kubernetes.io/name=mlflow --previous --tail=80 || true
          echo "=== postgres logs ==="; kubectl logs -n ml -l app.kubernetes.io/name=postgresql --tail=40 || true

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mlflow-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mlflow@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/mlflow:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-grocy

on:
  push:
    branches: [main]
    paths:
      - "quench/grocy/**"
      - ".github/workflows/release-grocy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/grocy
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-grocy --timeout=300s
          PW=quench-ci-admin-pass
          fwd() { kubectl port-forward svc/rtest-grocy 8080:8080 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          # login PASS [BASE [curl flags]]: post the login form with a fresh cookie jar; prints the redirect target
          login() { local p=$1 W=${2:-http://127.0.0.1:8080}; shift; [ $# -gt 0 ] && shift; rm -f /tmp/gr.jar
            curl -ks -c /tmp/gr.jar -b /tmp/gr.jar -o /dev/null -w '%{redirect_url}' "$@" --data-urlencode username=admin --data-urlencode "password=$p" $W/login; }
          gate1() { local W=http://127.0.0.1:8080
            # the first GET / runs the migrations, which create the chart's admin
            for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' -L $W/)" = 200 ] && break; sleep 2; done
            grep -q 'invalid' <<<"$(login admin)" || { echo "the default admin/admin password works"; return 1; }
            grep -q 'invalid' <<<"$(login $PW)" && { echo "the admin could not sign in"; return 1; }
            for o in 'locations {"name":"Gate fridge"}' 'quantity_units {"name":"Gate piece"}'; do
              curl -ks -b /tmp/gr.jar -o /dev/null -H 'Content-Type: application/json' -d "${o#* }" $W/api/objects/${o%% *}; done
            local loc qu; loc=$(curl -ks -b /tmp/gr.jar "$W/api/objects/locations?query%5B%5D=name%3DGate%20fridge" | jq -r '.[0].id')
            qu=$(curl -ks -b /tmp/gr.jar "$W/api/objects/quantity_units?query%5B%5D=name%3DGate%20piece" | jq -r '.[0].id')
            local out; out=$(curl -ks -b /tmp/gr.jar -H 'Content-Type: application/json' -w ' %{http_code}' \
              -d "{\"name\":\"Gate milk\",\"location_id\":$loc,\"qu_id_purchase\":$qu,\"qu_id_stock\":$qu,\"qu_id_consume\":$qu,\"qu_id_price\":$qu}" $W/api/objects/products)
            [ "${out##* }" = 200 ] || { echo "adding a product failed: $out"; return 1; }
          }
          gate2() { local W=${1:-http://127.0.0.1:8080}; shift || true
            for _ in $(seq 1 30); do curl -ks -o /dev/null "$@" $W/login && break; sleep 1; done
            grep -q 'invalid' <<<"$(login $PW $W "$@")" && { echo "the admin could not sign in"; return 1; }
            grep -q '"Gate milk"' <<<"$(curl -ks -b /tmp/gr.jar "$@" $W/api/objects/products)" || { echo "the product is gone"; return 1; }
          }
          fwd gate1
          # grocy.db lives on the PVC: the admin and the product survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-grocy --timeout=300s
          fwd gate2
          # native TLS on the same port with the Helm-made CA, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status deployment/rtest-grocy --timeout=300s
          kubectl get secret rtest-grocy-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/gr-ca.crt
          tlsgate() {
            local r="--resolve rtest-grocy:8080:127.0.0.1"
            for _ in $(seq 1 20); do curl -fsS -o /dev/null --cacert /tmp/gr-ca.crt $r https://rtest-grocy:8080/login && break; sleep 1; done
            ! curl -fsS -o /dev/null http://127.0.0.1:8080/login 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
            gate2 https://rtest-grocy:8080 --cacert /tmp/gr-ca.crt --resolve rtest-grocy:8080:127.0.0.1
          }
          fwd tlsgate
          echo "grocy: no admin/admin, the generated admin signs in, a product is kept across a pod restart and over native TLS: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/grocy-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/grocy@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/grocy:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

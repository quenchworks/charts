name: release-umami

on:
  push:
    branches: [main]
    paths:
      - "quench/umami/**"
      - ".github/workflows/release-umami.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/umami
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-umami --timeout=600s

          kubectl port-forward deployment/rtest-umami 3000:3000 3443:3443 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:3443' /tmp/pf.log && break; sleep 1; done
          B=http://127.0.0.1:3000
          J=(-H 'Content-Type: application/json')

          # --- PROVE UMAMI COUNTS A PAGE VIEW IN THE BUNDLED POSTGRESQL. ---
          # 1. Up (it migrated the database on start), and the release's version.
          curl -fsS -m 20 $B/api/heartbeat | grep -q '"ok":true'
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          got="$(kubectl exec deployment/rtest-umami -c umami -- node -p 'require("/app/package.json").version')"
          echo "version $got (want $want)"; test "$got" = "$want"

          # 2. A wrong password is refused; the seeded admin logs in.
          code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "${J[@]}" $B/api/auth/login -d '{"username":"admin","password":"wrong"}')"
          test "$code" = 401
          token="$(curl -fsS -m 20 "${J[@]}" $B/api/auth/login -d '{"username":"admin","password":"umami"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          A=(-H "Authorization: Bearer $token" "${J[@]}")

          # 3. A website, a page view sent the way the tracker sends it, read back from stats.
          id="$(curl -fsS -m 20 "${A[@]}" $B/api/websites -d '{"name":"gate","domain":"gate.example"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          curl -fsS -m 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36' "${J[@]}" $B/api/send \
            -d "{\"type\":\"event\",\"payload\":{\"website\":\"$id\",\"hostname\":\"gate.example\",\"url\":\"/hello\",\"language\":\"en-US\",\"screen\":\"1920x1080\"}}" >/dev/null
          now=$(($(date +%s) * 1000))
          views() { curl -fsS -m 20 "${A[@]}" "$1/api/websites/$id/stats?startAt=$((now - 3600000))&endAt=$((now + 600000))" "${@:2}" | python3 -c 'import json,sys; v=json.load(sys.stdin)["pageviews"]; print(v["value"] if isinstance(v,dict) else v)'; }
          n=0; for i in $(seq 1 15); do n="$(views $B)"; [ "$n" -ge 1 ] && break; sleep 2; done
          echo "page views: $n"; test "$n" -ge 1

          # 4. The data is in PostgreSQL: the event row is in website_event.
          pgpw="$(kubectl get secret rtest-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)"
          kubectl exec rtest-postgresql-0 -- env PGPASSWORD="$pgpw" psql -h 127.0.0.1 -U umamidb -d umami -tAc \
            "select count(*) from website_event where website_id = '$id' and url_path = '/hello'" | tee /tmp/rows.txt
          test "$(tr -d '[:space:]' </tmp/rows.txt)" -ge 1

          # 5. TLS: the sidecar serves HTTPS on 3443 with the chart CA; plain HTTP there must fail.
          kubectl get secret rtest-umami-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
          T=https://localhost:3443
          curl -fsS -m 20 --cacert /tmp/ca.crt $T/api/heartbeat | grep -q '"ok":true'
          test "$(views $T --cacert /tmp/ca.crt)" -ge 1
          # caddy answers plain HTTP on its TLS port with a 400; it must never serve the app there.
          code="$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3443/api/heartbeat || true)"
          echo "plain HTTP on 3443: $code"; test "$code" != 200

          # 6. A new pod keeps the app secret: the old token still reads the stats.
          kill $pf 2>/dev/null || true
          kubectl rollout restart deployment/rtest-umami
          kubectl rollout status deployment/rtest-umami --timeout=600s
          kubectl port-forward deployment/rtest-umami 3000:3000 >/tmp/pf2.log 2>&1 &
          pf=$!
          for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:3000' /tmp/pf2.log && break; sleep 1; done
          test "$(views $B)" -ge 1

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/umami-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/umami@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/umami:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

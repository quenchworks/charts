name: release-chhoto-url

on:
  push:
    branches: [main]
    paths:
      - "quench/chhoto-url/**"
      - ".github/workflows/release-chhoto-url.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/chhoto-url
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-chhoto-url --timeout=300s
          PW=Quench-CI-chhoto-2026 TARGET=https://quench-works.com/gate
          KEY=$(kubectl get secret rtest-chhoto-url -o jsonpath='{.data.api-key}' | base64 -d)
          [ ${#KEY} -ge 86 ] || { echo "the generated API key is too short"; exit 1; }
          fwd() { kubectl port-forward svc/rtest-chhoto-url 4567:4567 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:4567
          # call <method> <path> [curl args]: prints "status location", body in /tmp/c.out
          call() { local m=$1 p=$2; shift 2; curl -s -o /tmp/c.out -w '%{http_code} %{redirect_url}' -X "$m" "$@" "$B$p"; }
          redirects() { [ "$(call GET /quench-gate)" = "301 $TARGET" ] || [ "$(call GET /quench-gate)" = "308 $TARGET" ] || [ "$(call GET /quench-gate)" = "307 $TARGET" ] || { echo "/quench-gate does not redirect to $TARGET: $(call GET /quench-gate)"; return 1; }; }
          add() {
            for _ in $(seq 1 20); do [ "$(call GET /api/version | cut -d' ' -f1)" = 200 ] && break; sleep 1; done
            grep -q "Chhoto URL v" /tmp/c.out || { echo "no version"; return 1; }
            local link="{\"shortlink\":\"quench-gate\",\"longlink\":\"$TARGET\"}"
            call POST /api/new -H 'Content-Type: application/json' -H 'X-API-Key: wrong-key-1' -d "$link" >/dev/null
            jq -e '.success == false' /tmp/c.out >/dev/null || { echo "a wrong API key added a link"; return 1; }
            call POST /api/new -H 'Content-Type: application/json' -H "X-API-Key: $KEY" -d "$link" >/dev/null
            jq -e '.success == true' /tmp/c.out >/dev/null || { echo "the API key could not add a link: $(cat /tmp/c.out)"; return 1; }
            redirects || return 1
          }
          login() {
            for _ in $(seq 1 20); do [ "$(call GET /api/version | cut -d' ' -f1)" = 200 ] && break; sleep 1; done
            [ "$(call POST /api/login -H 'Content-Type: text/plain' --data-raw wrong-password-1 | cut -d' ' -f1)" = 401 ] || { echo "a wrong password was not refused"; return 1; }
            [ "$(call POST /api/login -H 'Content-Type: text/plain' --data-raw "$PW" | cut -d' ' -f1)" = 200 ] || { echo "the password was refused"; return 1; }
            redirects || return 1
          }
          fwd add
          # the link (SQLite on the PVC) survives a pod restart; the password and API key survive an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-chhoto-url --timeout=300s
          fwd login
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          [ "$(kubectl get secret rtest-chhoto-url -o jsonpath='{.data.api-key}' | base64 -d)" = "$KEY" ] || { echo "the API key changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-chhoto-url --timeout=300s
          fwd login
          echo "chhoto-url: wrong API key and password refused, link added with the generated key and redirecting, kept across a pod restart, secrets kept on upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/chhoto-url-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/chhoto-url@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/chhoto-url:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-terralist

on:
  push:
    branches: [main]
    paths:
      - "quench/terralist/**"
      - ".github/workflows/release-terralist.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/terralist
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 6m
          test "$(kubectl get pvc rtest-terralist-data -o jsonpath='{.status.phase}')" = Bound
          KEY="$(kubectl get secret rtest-terralist -o jsonpath='{.data.master-api-key}' | base64 -d)"
          test -n "$KEY"
          pf() { kubectl port-forward svc/rtest-terralist 5758:5758 >/dev/null 2>&1 & PF=$!
                 for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5758/.well-known/terraform.json >/dev/null 2>&1 && return; sleep 1; done; return 1; }
          B=http://127.0.0.1:5758
          pf
          curl -fsS "$B/.well-known/terraform.json" | grep -q 'modules.v1'
          curl -fsS -o /dev/null -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"name":"gate","public":true,"owner":"gate@example.com"}' "$B/v1/api/authorities/"
          curl -fsS -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"download_url":"https://github.com/cloudposse/terraform-null-label/archive/refs/tags/0.25.0.tar.gz"}' \
            "$B/v1/api/modules/gate/label/null/0.25.0/upload" | grep -q '"errors":\[\]'
          curl -fsS "$B/v1/modules/gate/label/null/versions" | grep -q '"version":"0.25.0"'
          fetch() {
            get="$(curl -fsS -o /dev/null -D - "$B/v1/modules/gate/label/null/0.25.0/download" | tr -d '\r' | sed -n 's/^[Xx]-[Tt]erraform-[Gg]et: //p')"
            test -n "$get"; curl -fsS -o /tmp/m.zip "$get"; unzip -l /tmp/m.zip | grep -q 'main.tf'
          }
          fetch
          # no key, no upload
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"download_url":"x"}' \
            "$B/v1/api/modules/gate/other/null/1.0.0/upload")" -ge 400
          kill $PF
          # SQLite and the archive are on the PVC: recreate the pod and fetch again
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait
          kubectl rollout status deployment/rtest-terralist --timeout=300s
          pf
          fetch
          kill $PF
          ! kubectl logs deployment/rtest-terralist | grep -E '"level":"(fatal|panic)"'
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/terralist-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/terralist@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/terralist:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

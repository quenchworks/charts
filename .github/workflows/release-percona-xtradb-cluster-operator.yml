name: release-percona-xtradb-cluster-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/percona-xtradb-cluster-operator/**"
      - ".github/workflows/release-percona-xtradb-cluster-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/percona-xtradb-cluster-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          uid="$(kubectl get pod -l app.kubernetes.io/name=percona-xtradb-cluster-operator -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"; test "$uid" = "1001"
          op_image="$(kubectl get deploy rtest-percona-xtradb-cluster-operator -o jsonpath='{.spec.template.spec.containers[0].image}')"
          # A one-node cluster behind HAProxy, with upstream's images for this
          # operator version. The operator's own image is the init image.
          kubectl apply -f - <<'CR'
          apiVersion: pxc.percona.com/v1
          kind: PerconaXtraDBCluster
          metadata:
            name: gate
          spec:
            crVersion: 1.20.0
            secretsName: gate-secrets
            unsafeFlags:
              tls: true
              pxcSize: true
              proxySize: true
            upgradeOptions:
              apply: disabled
            tls:
              enabled: false
            pxc:
              size: 1
              image: percona/percona-xtradb-cluster:8.4.8-8.1
              resources:
                requests: { cpu: 200m, memory: 1G }
              volumeSpec:
                persistentVolumeClaim:
                  resources:
                    requests:
                      storage: 2G
            haproxy:
              enabled: true
              size: 1
              image: percona/haproxy:2.8.18-1
            logcollector:
              enabled: false
          CR
          for i in $(seq 1 90); do
            state="$(kubectl get pxc gate -o jsonpath='{.status.state}' 2>/dev/null)"
            [ "$state" = ready ] && break
            [ "$i" = 90 ] && {
              echo "cluster not ready: ${state:-none}"; kubectl get pxc gate -o yaml | tail -40
              # what mysqld in the database pod actually reads
              kubectl exec gate-pxc-0 -c pxc -- bash -c 'ls -la /etc/my.cnf /etc/mysql /etc/my.cnf.d /etc/percona-xtradb-cluster.conf.d; for f in /etc/my.cnf /etc/my.cnf.d/* /etc/percona-xtradb-cluster.conf.d/*; do echo "== $f"; cat "$f"; done; echo "== print-defaults"; mysqld --print-defaults; env | sort | grep -iE "^my|wsrep"' || true
              exit 1; }
            sleep 10
          done
          echo "cluster state: $state"
          # the database and proxy pods ran our image as their init container
          for p in gate-pxc-0 $(kubectl get pod -l app.kubernetes.io/component=haproxy -o name | head -1 | cut -d/ -f2); do
            init="$(kubectl get pod "$p" -o jsonpath='{.spec.initContainers[0].image}')"
            echo "$p init image: $init"; test "$init" = "$op_image"
          done
          # a query through HAProxy reaches the Galera node
          pw="$(kubectl get secret gate-secrets -o jsonpath='{.data.root}' | base64 -d)"
          size="$(kubectl exec gate-pxc-0 -c pxc -- mysql -uroot -p"$pw" -h gate-haproxy -N -e "SELECT variable_value FROM performance_schema.global_status WHERE variable_name='wsrep_cluster_size'" 2>/dev/null)"
          echo "wsrep_cluster_size via HAProxy: $size"; test "$size" = 1

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/percona-xtradb-cluster-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/percona-xtradb-cluster-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/percona-xtradb-cluster-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-kroxylicious

on:
  push:
    branches: [main]
    paths:
      - "quench/kroxylicious/**"
      - ".github/workflows/release-kroxylicious.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/kroxylicious
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The backend: the quench kafka chart as release "kafka", one KRaft broker (node id 0).
          helm install kafka oci://ghcr.io/quenchworks/charts/kafka --set replicaCount=1 \
            --set kraft.defaultReplicationFactor=1 --set kraft.minInsyncReplicas=1 \
            --set kraft.offsetsTopicReplicationFactor=1 --set kraft.transactionStateLogReplicationFactor=1 \
            --set kraft.transactionStateLogMinIsr=1 \
            --wait --timeout 8m
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-kroxylicious --timeout=300s

          # --- PROVE KAFKA FLOWS THROUGH THE PROXY, not that a port is open. ---
          # The broker's own CLI with only the proxy as bootstrap: metadata, create, produce and
          # fetch all go through Kroxylicious, which advertises itself for every broker.
          K="env KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin"
          BS=rtest-kroxylicious.default.svc.cluster.local:9192
          kubectl exec kafka-kafka-0 -- $K/kafka-topics.sh --bootstrap-server $BS --create --topic gate --partitions 1 --replication-factor 1
          kubectl exec kafka-kafka-0 -- $K/kafka-topics.sh --bootstrap-server $BS --list | grep -qx gate
          echo "through-kroxylicious" | kubectl exec -i kafka-kafka-0 -- $K/kafka-console-producer.sh --bootstrap-server $BS --topic gate
          kubectl exec kafka-kafka-0 -- $K/kafka-console-consumer.sh --bootstrap-server $BS --topic gate \
            --from-beginning --max-messages 1 --timeout-ms 30000 | grep -qx through-kroxylicious
          # metadata handed to clients names the proxy, not the broker
          kubectl exec kafka-kafka-0 -- $K/kafka-broker-api-versions.sh --bootstrap-server $BS | grep -q '^rtest-kroxylicious.default.svc.cluster.local:9193'
          kubectl logs deployment/rtest-kroxylicious > /tmp/krox.log
          if grep -qiE 'UnsatisfiedLinkError|Permission denied|Read-only file system' /tmp/krox.log; then
            cat /tmp/krox.log; exit 1
          fi

          # native TLS: the gateway over TLS, the client verifying against the chart CA
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 5m
          kubectl rollout status deployment/rtest-kroxylicious --timeout=300s
          kubectl get secret rtest-kroxylicious-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/krox-ca.crt
          kubectl exec -i kafka-kafka-0 -- sh -c 'cat > /tmp/krox-ca.crt' < /tmp/krox-ca.crt
          kubectl exec kafka-kafka-0 -- sh -c "printf 'security.protocol=SSL\nssl.truststore.type=PEM\nssl.truststore.location=/tmp/krox-ca.crt\n' > /tmp/krox-ssl.properties"
          kubectl exec kafka-kafka-0 -- $K/kafka-topics.sh --bootstrap-server $BS --command-config /tmp/krox-ssl.properties --list | grep -qx gate
          kubectl exec kafka-kafka-0 -- $K/kafka-console-consumer.sh --bootstrap-server $BS --consumer.config /tmp/krox-ssl.properties \
            --topic gate --from-beginning --max-messages 1 --timeout-ms 30000 | grep -qx through-kroxylicious

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/kroxylicious-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/kroxylicious@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/kroxylicious:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

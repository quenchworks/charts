name: release-changedetection

on:
  push:
    branches: [main]
    paths:
      - "quench/changedetection/**"
      - ".github/workflows/release-changedetection.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/changedetection
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          kubectl get secret rtest-changedetection-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt

          # A page to watch, inside the cluster.
          kubectl create deployment gate-page --image=nginx:alpine
          kubectl expose deployment gate-page --port=80
          kubectl wait --for=condition=available deploy/gate-page --timeout=300s

          fwd() { kubectl port-forward svc/rtest-changedetection 18443:5000 >/tmp/pf.log 2>&1 & pf=$!
            for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:18443' /tmp/pf.log && break; sleep 1; done; }
          fwd; trap 'kill $pf 2>/dev/null || true' EXIT
          H=https://rtest-changedetection:18443
          C=(-sS -m 30 --cacert /tmp/ca.crt --resolve rtest-changedetection:18443:127.0.0.1)
          key() { kubectl exec deploy/rtest-changedetection -- /opt/changedetection/bin/python -c \
            'import json; print(json.load(open("/datastore/changedetection.json"))["settings"]["application"]["api_access_token"])'; }
          watches() { curl -f "${C[@]}" -H "x-api-key: $k" "$H/api/v1/watch"; }

          # --- PROVE CHANGEDETECTION.IO WATCHES A PAGE OVER HTTPS AND KEEPS IT ON ITS VOLUME. ---
          # 1. HTTPS with the chart CA, the release's version.
          curl -f "${C[@]}" "$H/" >/dev/null
          v="$(kubectl exec deploy/rtest-changedetection -- /opt/changedetection/bin/python -c 'import sys; sys.path.insert(0,"/app"); import changedetectionio; print(changedetectionio.__version__)')"
          echo "version $v (want $want)"; test "$v" = "$want"

          # 2. The generated API key works and a wrong one is refused.
          for i in $(seq 1 30); do k="$(key 2>/dev/null || true)"; [ -n "$k" ] && break; sleep 2; done
          test -n "$k"
          code="$(curl "${C[@]}" -o /dev/null -w '%{http_code}' -H 'x-api-key: wrong' "$H/api/v1/watch")"
          case "$code" in 401|403) ;; *) echo "FAIL: a wrong API key got HTTP $code"; exit 1 ;; esac

          # 3. A watch on the in-cluster page is created and actually fetched.
          curl -f "${C[@]}" -H "x-api-key: $k" -H 'Content-Type: application/json' "$H/api/v1/watch" \
            -d '{"url":"http://gate-page/","title":"quench-gate-watch"}' >/dev/null
          # last_checked proves nothing (a BLOCKED fetch sets it too): the snapshot must hold
          # nginx's page. The page is in-cluster, so ci values allow private addresses.
          # by URL: first start also adds a default watch (news.ycombinator.com)
          uuid="$(watches | python3 -c 'import json,sys; print(next(u for u, w in json.load(sys.stdin).items() if w.get("url") == "http://gate-page/"))')"
          snap=""
          for i in $(seq 1 60); do
            snap="$(curl -fsS "${C[@]}" -H "x-api-key: $k" "$H/api/v1/watch/$uuid/history/latest" 2>/dev/null || true)"
            grep -q 'Welcome to nginx' <<<"$snap" && break; sleep 3
          done
          grep -q 'Welcome to nginx' <<<"$snap" || { echo "FAIL: the page was never fetched"; kubectl logs deploy/rtest-changedetection --tail=40; exit 1; }
          echo "wrong key refused, watch created, page fetched into its snapshot"

          # 4. A settings change through helm upgrade rolls the pod; the watch and the key are kept.
          kill $pf 2>/dev/null || true
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set-string settings.HIDE_REFERER=true --wait --timeout 5m
          kubectl rollout status deployment/rtest-changedetection --timeout=300s
          fwd
          for i in $(seq 1 30); do curl -f "${C[@]}" "$H/" >/dev/null 2>&1 && break; sleep 2; done
          grep -q quench-gate-watch <<<"$(watches)"
          echo "watch and API key kept across the upgrade"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/changedetection-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/changedetection@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/changedetection:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

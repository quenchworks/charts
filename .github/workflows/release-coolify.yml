name: release-coolify

on:
  push:
    branches: [main]
    paths:
      - "quench/coolify/**"
      - ".github/workflows/release-coolify.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/coolify
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled postgresql + redis subcharts into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail

          # The CI admin credentials — must match app.rootUser in ci/default-values.yaml.
          ADMIN_PW="Coolify12345"

          # Bundled PG15 (image-overridden) + Redis + the app + realtime control plane.
          # The app runs DB migrations + seeder + app:init on boot, so give it time.
          helm install ctest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --wait --timeout 12m

          # Both control-plane Deployments Ready (--wait already blocks, but assert each
          # rollout so a stuck component fails loud).
          kubectl rollout status deployment/ctest-coolify-app --timeout=600s
          kubectl rollout status deployment/ctest-coolify-realtime --timeout=300s
          # bundled datastores are StatefulSets (helm --wait already gates on these)
          kubectl rollout status statefulset/ctest-postgresql --timeout=300s || true
          kubectl rollout status statefulset/ctest-redis --timeout=300s || true

          # --- app: GET /healthcheck through the app Service -> 200 ("OK") ---
          kubectl port-forward svc/ctest-coolify-app 8080:8080 >/tmp/pf-app.log 2>&1 &
          PFA=$!
          # --- realtime: soketi :6001 /ready and terminal :6002 /ready -> 200 ---
          kubectl port-forward svc/ctest-coolify-realtime 6001:6001 6002:6002 >/tmp/pf-rt.log 2>&1 &
          PFR=$!
          trap 'kill $PFA $PFR 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 40); do
            code="$(curl -s -o /tmp/hc.txt -w '%{http_code}' http://127.0.0.1:8080/healthcheck || true)"
            echo "app /healthcheck -> ${code} :: $(cat /tmp/hc.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 6
          done
          test "$ok" = 1
          echo "app OK: /healthcheck 200"

          for ep in "6001:/ready" "6002:/ready"; do
            port="${ep%%:*}"; path="${ep#*:}"
            up=0
            for i in $(seq 1 20); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}${path}" || true)"
              if [ "$code" = "200" ]; then up=1; break; fi
              sleep 3
            done
            test "$up" = 1
            echo "realtime OK: :${port}${path} 200"
          done

          echo "INSTALL GATE PASSED: app /healthcheck 200 + realtime soketi/terminal ready"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/coolify-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/coolify@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/coolify:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

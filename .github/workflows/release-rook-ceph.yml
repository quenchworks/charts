name: release-rook-ceph

on:
  push:
    branches: [main]
    paths:
      - "quench/rook-ceph/**"
      - ".github/workflows/release-rook-ceph.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/rook-ceph
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # An OSD needs a real block device that ceph-volume can query through udev. A kind node
      # runs no udev, so the loop device is made on the runner (which does) and /dev and
      # /run/udev are shared into the node.
      - name: Loop device and kind config
        run: |
          sudo truncate -s 10G /mnt/osd.img
          loop="$(sudo losetup -f --show /mnt/osd.img)"
          echo "LOOP=${loop#/dev/}" >> "$GITHUB_ENV"
          echo "loop device: $loop"
          cat > /tmp/kind-rook.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraMounts:
                - { hostPath: /dev, containerPath: /dev }
                - { hostPath: /run/udev, containerPath: /run/udev }
          EOF
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: /tmp/kind-rook.yaml
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -eo pipefail
          helm install r "${CHART_DIR}" -n rook-ceph --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" \
            --wait --timeout 12m
          kubectl config set-context --current --namespace=rook-ceph
          ceph_image="$(helm get notes r -n rook-ceph | sed -n 's/^ *image: //p' | head -1)"
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          echo "ceph image: $ceph_image"
          # One mon, one mgr, one OSD on the loop device; pools of size 1 so health can settle.
          kubectl apply -f - <<EOF
          apiVersion: ceph.rook.io/v1
          kind: CephCluster
          metadata: {name: gate}
          spec:
            cephVersion: {image: "$ceph_image"}
            dataDirHostPath: /var/lib/rook
            mon: {count: 1, allowMultiplePerNode: true}
            mgr: {count: 1, allowMultiplePerNode: true, modules: []}
            dashboard: {enabled: false}
            crashCollector: {disable: true}
            cephConfig:
              global: {osd_pool_default_size: "1", mon_warn_on_pool_no_redundancy: "false"}
            # Rook takes a loop device only when it is named in devices, not by deviceFilter.
            storage:
              useAllNodes: false
              useAllDevices: false
              nodes:
                - name: "$node"
                  devices: [{name: "/dev/${LOOP}"}]
          EOF
          ok=""
          for _ in $(seq 1 90); do
            st="$(kubectl get cephcluster gate -o jsonpath='{.status.phase} {.status.ceph.health}' 2>/dev/null || true)"
            echo "$(date +%T) $st"
            case "$st" in "Ready HEALTH_OK"|"Ready HEALTH_WARN") ok=1; break;; esac
            sleep 10
          done
          test -n "$ok"
          # The OSD Deployment appears after the prepare Job; kubectl wait errors on no match.
          for _ in $(seq 1 60); do kubectl get pod -l app=rook-ceph-osd -o name | grep -q . && break; sleep 10; done
          kubectl wait pod -l app=rook-ceph-osd --for=condition=Ready --timeout=600s
          echo "CephCluster Ready with an OSD on /dev/${LOOP}"
          # Object storage: an RGW store and a user, then an S3 put and get through the gateway.
          kubectl apply -f - <<'EOF'
          apiVersion: ceph.rook.io/v1
          kind: CephObjectStore
          metadata: {name: store}
          spec:
            metadataPool: {replicated: {size: 1, requireSafeReplicaSize: false}}
            dataPool: {replicated: {size: 1, requireSafeReplicaSize: false}}
            gateway: {port: 80, instances: 1}
          ---
          apiVersion: ceph.rook.io/v1
          kind: CephObjectStoreUser
          metadata: {name: gate}
          spec: {store: store, displayName: gate}
          EOF
          kubectl wait cephobjectstore/store --for=jsonpath='{.status.phase}'=Ready --timeout=900s
          kubectl wait cephobjectstoreuser/gate --for=jsonpath='{.status.phase}'=Ready --timeout=300s
          sec=rook-ceph-object-user-store-gate
          export AWS_ACCESS_KEY_ID="$(kubectl get secret $sec -o jsonpath='{.data.AccessKey}' | base64 -d)"
          export AWS_SECRET_ACCESS_KEY="$(kubectl get secret $sec -o jsonpath='{.data.SecretKey}' | base64 -d)"
          export AWS_DEFAULT_REGION=us-east-1
          kubectl port-forward svc/rook-ceph-rgw-store 8080:80 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          echo quench-rook-gate > /tmp/obj.txt
          aws --endpoint-url http://127.0.0.1:8080 s3 mb s3://gate
          aws --endpoint-url http://127.0.0.1:8080 s3 cp /tmp/obj.txt s3://gate/obj.txt
          [ "$(aws --endpoint-url http://127.0.0.1:8080 s3 cp s3://gate/obj.txt -)" = quench-rook-gate ]
          echo "S3 put/get through RGW: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            # init containers too: Rook's OSD pods fail in activate, before any container runs
            for c in $(kubectl get "$p" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/rook-ceph-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/rook-ceph@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/rook-ceph:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

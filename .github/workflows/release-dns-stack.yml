name: release-dns-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/dns-stack/**"
      - ".github/workflows/release-dns-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/dns-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          command -v dig >/dev/null || { sudo apt-get update && sudo apt-get install -y bind9-dnsutils; }
          kubectl create namespace dns
          # the failure-diagnostics step below reads the current namespace
          kubectl config set-context --current --namespace=dns
          # --wait also waits for the post-install zone Job.
          helm install dns "${CHART_DIR}" -n dns -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl rollout status statefulset/dns-powerdns --timeout=300s
          kubectl rollout status deployment/dns-external-dns --timeout=300s

          # A Service annotated the way users will do it. No pods behind it: the
          # record is the ClusterIP, which exists without endpoints.
          kubectl apply -f - <<YAML
          apiVersion: v1
          kind: Service
          metadata:
            name: web
            annotations: { external-dns.kubernetes.io/hostname: web.k8s.internal }
          spec: { selector: { app: web }, ports: [{ port: 80 }] }
          YAML
          ip="$(kubectl get service web -o jsonpath='{.spec.clusterIP}')"

          kubectl port-forward pod/dns-powerdns-0 15353:5353 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from 127.0.0.1:15353' /tmp/pf.log && break; sleep 1; done

          # --- PROVE THE WIRING: external-dns read the annotation, wrote through the
          # PowerDNS API with the stack's key, into the zone the Job created, and
          # PowerDNS serves it. Any broken link leaves the name unresolved. ---
          ans=""
          for i in $(seq 1 36); do
            ans="$(dig @127.0.0.1 -p 15353 +tcp +time=3 +tries=1 web.k8s.internal A || true)"
            grep -qE "^web\.k8s\.internal\.\s+[0-9]+\s+IN\s+A\s+${ip//./\\.}\$" <<<"$ans" && break
            [ "$i" = 36 ] && { echo "$ans"; kubectl logs deployment/dns-external-dns --tail=50; exit 1; }
            sleep 5
          done
          echo "$ans"
          grep -qE 'flags:[^;]* aa' <<<"$ans"

          # external-dns's ownership record, so policy=sync deletes only its own.
          txt="$(dig @127.0.0.1 -p 15353 +tcp +short TXT a-web.k8s.internal; dig @127.0.0.1 -p 15353 +tcp +short TXT web.k8s.internal)"
          echo "$txt"
          grep -q 'external-dns/owner=dns-stack' <<<"$txt"

          # policy=sync: deleting the Service deletes its record.
          kubectl delete service web
          for i in $(seq 1 36); do
            dig @127.0.0.1 -p 15353 +tcp +time=3 +tries=1 web.k8s.internal A | grep -q 'status: NXDOMAIN' && break
            [ "$i" = 36 ] && { echo "record not removed"; exit 1; }
            sleep 5
          done
          echo "record removed after the Service was deleted"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/dns-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/dns-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/dns-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

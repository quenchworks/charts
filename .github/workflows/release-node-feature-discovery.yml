name: release-node-feature-discovery

on:
  push:
    branches: [main]
    paths:
      - "quench/node-feature-discovery/**"
      - ".github/workflows/release-node-feature-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/node-feature-discovery
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace node-feature-discovery
          helm install rtest "${CHART_DIR}" -n node-feature-discovery -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl -n node-feature-discovery rollout status deployment/nfd-master --timeout=300s
          kubectl -n node-feature-discovery rollout status daemonset/nfd-worker --timeout=300s

          # --- PROVE NFD LABELS THE NODE AND APPLIES A NODEFEATURERULE. ---
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          # jsonpath ['key'] returns nothing for keys with dots: escape them instead
          label() { kubectl get node "$node" -o jsonpath="{.metadata.labels.${1//./\\.}}"; }

          # 1. The worker reads the host and the master labels the node with discovered features.
          nfl() { kubectl get node "$node" -o jsonpath='{.metadata.labels}' | tr ',' '\n' | grep -c 'feature.node.kubernetes.io/' || true; }
          for i in $(seq 1 60); do [ "$(nfl)" -gt 0 ] && break; sleep 5; done
          n="$(nfl)"
          test "$n" -gt 0 || { kubectl get node "$node" --show-labels; echo "FAIL: no feature labels on $node"; exit 1; }
          echo "node labelled with $n feature labels"

          # 2. A NodeFeatureRule turns a discovered feature into a custom label.
          kubectl apply -f - <<'YAML'
          apiVersion: nfd.k8s-sigs.io/v1alpha1
          kind: NodeFeatureRule
          metadata: { name: gate }
          spec:
            rules:
              - name: gate-kernel
                labels: { quench-works.com/nfd-gate: "true" }
                matchFeatures:
                  - feature: kernel.version
                    matchExpressions: { major: { op: Exists } }
          YAML
          for i in $(seq 1 60); do [ "$(label quench-works.com/nfd-gate)" = true ] && break; sleep 5; done
          test "$(label quench-works.com/nfd-gate)" = true || { echo "FAIL: NodeFeatureRule label missing"; exit 1; }
          echo "NodeFeatureRule label applied to $node"

          img="$(kubectl -n node-feature-discovery get ds nfd-worker -o jsonpath='{.spec.template.spec.containers[0].image}')"
          case "$img" in ghcr.io/quenchworks/images/node-feature-discovery@sha256:*) ;; *) echo "FAIL: worker runs $img"; exit 1 ;; esac
          restarts="$(kubectl -n node-feature-discovery get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl -n node-feature-discovery get pods; echo "FAIL: a component restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n node-feature-discovery logs deploy/nfd-master --tail=200 || true
          kubectl -n node-feature-discovery logs ds/nfd-worker --tail=200 || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/node-feature-discovery-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/node-feature-discovery@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/node-feature-discovery:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-paperless-ngx

on:
  push:
    branches: [main]
    paths:
      - "quench/paperless-ngx/**"
      - ".github/workflows/release-paperless-ngx.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/paperless-ngx
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 20m
          kubectl rollout status deployment/rtest-paperless-ngx --timeout=900s
          KEY=$(kubectl get secret rtest-paperless-ngx -o jsonpath='{.data.secret-key}')
          [ "$(echo "$KEY" | base64 -d | wc -c)" -ge 50 ] || { echo "the generated PAPERLESS_SECRET_KEY is too short"; exit 1; }
          PW=$(kubectl get secret rtest-paperless-ngx -o jsonpath='{.data.admin-password}' | base64 -d)
          fwd() { kubectl port-forward svc/rtest-paperless-ngx 18000:8000 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:18000
          # a one-page PDF whose text layer holds "archive" (OCR's skip mode keeps it), xref offsets computed
          pdf() {
            local c='BT /F1 24 Tf 72 720 Td (Quench archive document) Tj ET' body=$'%PDF-1.4\n' xref='' line o i=1
            for o in '<< /Type /Catalog /Pages 2 0 R >>' '<< /Type /Pages /Kids [3 0 R] /Count 1 >>' \
              '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>' \
              "<< /Length ${#c} >>"$'\nstream\n'"$c"$'\nendstream' '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'; do
              printf -v line '%010d 00000 n \n' "${#body}"; xref+=$line
              body+="$i 0 obj"$'\n'"$o"$'\nendobj\n'; i=$((i+1))
            done
            printf '%sxref\n0 6\n0000000000 65535 f \n%strailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n' "$body" "$xref" "${#body}"
          }
          LC_ALL=C pdf > /tmp/smoke.pdf
          # token <password>: the API token, or nothing
          token() { curl -s -H 'Content-Type: application/json' -d "$(jq -n --arg p "$1" '{username:"admin",password:$p}')" "$B/api/token/" | jq -r '.token // empty'; }
          up() { for _ in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/accounts/login/")" = 200 ] && return 0; sleep 2; done; echo "/accounts/login/ never answered 200"; return 1; }
          # found: full-text search (the tantivy index the worker writes) finds the document
          found() {
            local t; t=$(token "$PW"); [ -n "$t" ] || { echo "the admin password gets no API token"; return 1; }
            for _ in $(seq 1 90); do
              curl -s -H "Authorization: Token $t" "$B/api/documents/?query=archive" > /tmp/q.json
              jq -e '.count >= 1' /tmp/q.json >/dev/null && return 0; sleep 2
            done
            echo "search never found the document: $(cat /tmp/q.json)"; curl -s -H "Authorization: Token $t" "$B/api/documents/" | head -c 600; return 1
          }
          first() {
            up || return 1
            local t; t=$(token "$PW"); [ -n "$t" ] || { echo "the generated admin password gets no API token"; return 1; }
            [ -z "$(token wrong-password-1)" ] || { echo "a wrong password got a token"; return 1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Token $t" -F document=@/tmp/smoke.pdf -F 'title=Quench smoke' "$B/api/documents/post_document/")" = 200 ] || { echo "post_document refused the PDF"; return 1; }
            found
          }
          again() { up && found; }
          fwd first
          # the document (PostgreSQL, the volume) and its index survive a pod restart; the secret key survives an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=paperless-ngx --wait=true
          kubectl rollout status deployment/rtest-paperless-ngx --timeout=900s
          fwd again
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 20m
          [ "$(kubectl get secret rtest-paperless-ngx -o jsonpath='{.data.secret-key}')" = "$KEY" ] || { echo "PAPERLESS_SECRET_KEY changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-paperless-ngx --timeout=900s
          fwd again
          echo "paperless-ngx: migrate + index + superuser init on PostgreSQL + Valkey, generated admin gets an API token (a wrong password does not), a posted PDF is OCRed, indexed and found by full-text search, kept across a pod restart and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/paperless-ngx-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/paperless-ngx@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/paperless-ngx:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-kueue

on:
  push:
    branches: [main]
    paths:
      - "quench/kueue/**"
      - ".github/workflows/release-kueue.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/kueue
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace kueue-system
          helm install rtest "${CHART_DIR}" -n kueue-system -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl -n kueue-system rollout status deployment/kueue-controller-manager --timeout=300s

          # --- PROVE KUEUE HOLDS A JOB UNTIL ITS QUEUE ADMITS IT, THEN RUNS IT. ---
          # 1. The eleven CRDs and our image.
          test "$(kubectl get crd -o name | grep -c 'kueue.x-k8s.io')" -eq 11
          img="$(kubectl -n kueue-system get deploy kueue-controller-manager -o jsonpath='{.spec.template.spec.containers[0].image}')"
          case "$img" in ghcr.io/quenchworks/images/kueue@sha256:*) ;; *) echo "FAIL: runs $img"; exit 1 ;; esac

          # 2. A flavor, a ClusterQueue with 1 CPU, a LocalQueue, and a suspended Job on it. Creation
          #    goes through Kueue's webhooks, which answer once its rotated certificate lands: retry.
          cat > /tmp/kueue-gate.yaml <<'YAML'
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ResourceFlavor
          metadata: { name: gate-flavor }
          ---
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata: { name: gate }
          spec:
            namespaceSelector: {}
            resourceGroups:
              - coveredResources: [cpu, memory]
                flavors: [{ name: gate-flavor, resources: [{ name: cpu, nominalQuota: 1 }, { name: memory, nominalQuota: 1Gi }] }]
          ---
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: LocalQueue
          metadata: { name: gate, namespace: default }
          spec: { clusterQueue: gate }
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: gate
            namespace: default
            labels: { kueue.x-k8s.io/queue-name: gate }
          spec:
            suspend: true
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: main
                    image: busybox:1.37
                    command: [sh, -c, "echo admitted-by-kueue"]
                    resources: { requests: { cpu: 100m, memory: 64Mi } }
          YAML
          for i in $(seq 1 60); do kubectl apply -f /tmp/kueue-gate.yaml && break; sleep 3; done

          # 3. Kueue admits the Workload and unsuspends the Job, which completes.
          kubectl wait --for=condition=Complete job/gate --timeout=300s
          wl="$(kubectl get workloads -o jsonpath='{.items[0].status.conditions[?(@.type=="Admitted")].status}')"
          test "$wl" = True || { kubectl get workloads -o yaml | tail -30; echo "FAIL: Workload not Admitted"; exit 1; }
          grep -q admitted-by-kueue <<<"$(kubectl logs job/gate)" || { echo "FAIL: job output missing"; exit 1; }
          echo "Kueue admitted the Workload through ClusterQueue gate and the Job completed"

          # 4. A Job that does not fit the quota stays suspended.
          cat > /tmp/kueue-big.yaml <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: gate-big
            namespace: default
            labels: { kueue.x-k8s.io/queue-name: gate }
          spec:
            suspend: true
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: main
                    image: busybox:1.37
                    command: [sh, -c, "echo should-not-run"]
                    resources: { requests: { cpu: "2", memory: 64Mi } }
          YAML
          kubectl apply -f /tmp/kueue-big.yaml
          sleep 20
          test "$(kubectl get job gate-big -o jsonpath='{.spec.suspend}')" = true || { echo "FAIL: a Job over quota was started"; exit 1; }
          echo "a Job over the ClusterQueue quota stays suspended"

          restarts="$(kubectl -n kueue-system get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl -n kueue-system get pods; echo "FAIL: the controller restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n kueue-system logs deploy/kueue-controller-manager --tail=200 || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/kueue-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/kueue@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/kueue:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-flux

on:
  push:
    branches: [main]
    paths:
      - "quench/flux/**"
      - ".github/workflows/release-flux.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/flux
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace flux-system
          helm install rtest "${CHART_DIR}" -n flux-system -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          for n in source kustomize helm notification; do
            kubectl -n flux-system rollout status deployment/rtest-flux-$n --timeout=300s
          done
          kubectl wait crd --all --for=condition=Established --timeout=120s
          # 1. Git source + Kustomization: podinfo's kustomize dir deployed into default
          cat <<Y | kubectl apply -f -
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: GitRepository
          metadata: { name: podinfo, namespace: flux-system }
          spec: { interval: 5m, url: https://github.com/stefanprodan/podinfo, ref: { tag: "6.15.0" } }
          ---
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata: { name: podinfo, namespace: flux-system }
          spec:
            interval: 10m
            path: ./kustomize
            prune: true
            targetNamespace: default
            sourceRef: { kind: GitRepository, name: podinfo }
            wait: true
            timeout: 5m
          Y
          kubectl -n flux-system wait gitrepository/podinfo --for=condition=Ready --timeout=300s
          kubectl -n flux-system wait kustomization/podinfo --for=condition=Ready --timeout=400s
          kubectl -n default rollout status deployment/podinfo --timeout=120s
          echo "  GitRepository + Kustomization: podinfo deployed"
          # 2. OCI Helm repository + HelmRelease: the QuenchWorks opa chart
          cat <<Y | kubectl apply -f -
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: HelmRepository
          metadata: { name: quenchworks, namespace: flux-system }
          spec: { type: oci, interval: 10m, url: oci://ghcr.io/quenchworks/charts }
          ---
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata: { name: opa, namespace: flux-system }
          spec:
            interval: 10m
            targetNamespace: default
            # with targetNamespace set, Flux names the release <namespace>-<name> by default
            releaseName: opa
            chart:
              spec: { chart: opa, version: ">=0.0.1", sourceRef: { kind: HelmRepository, name: quenchworks } }
          Y
          kubectl -n flux-system wait helmrelease/opa --for=condition=Ready --timeout=400s
          kubectl -n default get deploy -l app.kubernetes.io/instance=opa -o name | grep -q deployment
          echo "  HelmRepository (OCI) + HelmRelease: opa installed"
          # 3. notification-controller: a Provider and an Alert on the Kustomization
          cat <<Y | kubectl apply -f -
          apiVersion: notification.toolkit.fluxcd.io/v1beta3
          kind: Provider
          metadata: { name: sink, namespace: flux-system }
          spec: { type: generic, address: "http://rtest-flux-notification.flux-system.svc/" }
          ---
          apiVersion: notification.toolkit.fluxcd.io/v1beta3
          kind: Alert
          metadata: { name: podinfo, namespace: flux-system }
          spec:
            providerRef: { name: sink }
            eventSources: [ { kind: Kustomization, name: podinfo } ]
          Y
          for i in $(seq 1 30); do
            kubectl -n flux-system get provider/sink alert/podinfo >/dev/null 2>&1 && break; sleep 2
          done
          kubectl -n flux-system get provider/sink alert/podinfo
          # notification objects no longer carry a Ready condition in v1beta3; the
          # controller must at least have accepted them without errors
          ! kubectl -n flux-system logs deployment/rtest-flux-notification | grep -iE '"level":"error".*(podinfo|sink)'
          echo "install gate OK: Git + Kustomization, OCI Helm + HelmRelease, notification objects accepted"
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/flux-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/flux@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/flux:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-vault

on:
  push:
    branches: [main]
    paths:
      - "quench/vault/**"
      - ".github/workflows/release-vault.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/vault
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # A real Vault node boots SEALED, and a sealed node answers 501/503 forever --
          # indistinguishable from a wedged process to a TCP probe. So the gate runs
          # ci/default-values.yaml in DEV MODE (auto-unsealed, fixed root token): health
          # must return 200 and a real kv-v2 put/get roundtrip must come back with the
          # value we wrote. That proves Vault ANSWERS ITS API, not just that :8200 is open.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 6m
          kubectl rollout status statefulset/rtest-vault --timeout=300s

          # dev mode = initialized + unsealed: /v1/sys/health returns 200 over a
          # port-forward (the runtime image has no HTTP client).
          kubectl port-forward rtest-vault-0 8200:8200 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          ok=""
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/v1/sys/health)" || true
            echo "health: $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          test -n "$ok"   # fail loudly if the dev node never reports init+unsealed

          # Sealed status straight from the API, not just the HTTP code.
          curl -s http://127.0.0.1:8200/v1/sys/health | grep -q '"sealed":false'

          # Real kv-v2 roundtrip via the in-image `vault` CLI. The image is SHELL-FREE, so
          # exec the binary directly -- VAULT_ADDR and VAULT_TOKEN are already in the
          # container's env (kubectl exec cannot set them), which is exactly what the
          # chart wires up in dev mode.
          kubectl exec rtest-vault-0 -- vault kv put secret/gate v=quench
          out="$(kubectl exec rtest-vault-0 -- vault kv get -field=v secret/gate)"
          echo "kv get -> $out"
          echo "$out" | grep -q '^quench$'   # fail loudly on mismatch
          kubectl exec rtest-vault-0 -- vault status

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: HA install gate (kind, raft 3 nodes)
        run: |
          set -o pipefail
          # The dev-mode gate above proves the API answers. It CANNOT catch a broken raft
          # cluster: dev mode is a single in-memory node with no storage stanza at all. So
          # ha.enabled=true gets its own gate, or a chart rendering unjoinable retry_join
          # addresses would publish green.
          # The previous step backgrounded a port-forward on 8200 and killed it via an EXIT
          # trap. If one somehow survives, it would still be bound to 8200 while pointing
          # at a pod that is about to be deleted, and every curl below would hit a corpse.
          # (Safe from self-matching: the runner executes this block as a script FILE, so
          # the pattern is not in any process cmdline.)
          pkill -f 'kubectl port-forward' || true
          helm uninstall rtest --wait
          kubectl delete pvc --all --ignore-not-found

          helm install hatest "${CHART_DIR}" \
            --set dev.enabled=false --set ha.enabled=true --set ha.replicas=3 \
            --set persistence.size=1Gi
          # NO --wait: a real Vault boots SEALED, so readiness never passes until unsealed.
          n=0
          for i in $(seq 1 60); do
            n="$(kubectl get pods -l app.kubernetes.io/name=vault --no-headers | grep -c Running || true)"
            [ "${n:-0}" -ge 3 ] && break
            sleep 5
          done
          kubectl get pods -l app.kubernetes.io/name=vault
          test "${n:-0}" -ge 3

          # The runtime image is SHELL-FREE and has no HTTP client, so every step below
          # talks to the API over a port-forward from the runner.
          pf() {
            kubectl port-forward "hatest-vault-$1" 8200:8200 >"/tmp/pf-$1.log" 2>&1 &
            PF=$!
            for i in $(seq 1 20); do
              curl -sf -o /dev/null "http://127.0.0.1:8200/v1/sys/seal-status" && return 0
              sleep 2
            done
            return 1
          }

          pf 0 || { echo "no port-forward to pod 0"; exit 1; }
          init="$(curl -sS -X PUT -d '{"secret_shares":1,"secret_threshold":1}' \
                    http://127.0.0.1:8200/v1/sys/init)"
          key="$(echo "$init" | jq -r '.keys_base64[0]')"
          tok="$(echo "$init" | jq -r '.root_token')"
          test -n "$key" && test "$key" != "null"   # fail loudly instead of unsealing with ""
          kill $PF

          # Unseal every node. A joiner cannot unseal until its retry_join reaches the
          # leader, so this retries rather than assuming first-try success.
          for p in 0 1 2; do
            pf "$p" || { echo "no port-forward to pod $p"; exit 1; }
            s=""
            for i in $(seq 1 24); do
              s="$(curl -sS -X PUT -d "{\"key\":\"$key\"}" \
                     http://127.0.0.1:8200/v1/sys/unseal | jq -r '.sealed')"
              [ "$s" = "false" ] && break
              sleep 5
            done
            echo "hatest-vault-$p sealed=$s"
            kill $PF
            test "$s" = "false"
          done

          # THE assertion: raft must report 3 VOTERS. Three Running pods each reporting one
          # voter would be three SEPARATE single-node clusters -- which is exactly what a
          # pod-count or per-pod health check cannot tell apart from a real cluster.
          pf 0 || { echo "no port-forward to pod 0"; exit 1; }
          v=0
          for i in $(seq 1 24); do
            cfg="$(curl -sS -H "X-Vault-Token: $tok" \
                     http://127.0.0.1:8200/v1/sys/storage/raft/configuration)"
            v="$(echo "$cfg" | jq '[.data.config.servers[] | select(.voter)] | length')"
            [ "${v:-0}" -ge 3 ] && break
            sleep 5
          done
          echo "$cfg" | jq -r '.data.config.servers[] | "  \(.node_id) voter=\(.voter)"'
          test "${v:-0}" -ge 3

          # Write through the leader...
          curl -sS -H "X-Vault-Token: $tok" -X POST \
            -d '{"type":"kv","options":{"version":"2"}}' \
            http://127.0.0.1:8200/v1/sys/mounts/qw
          curl -sS -H "X-Vault-Token: $tok" -X POST \
            -d '{"data":{"value":"quench"}}' http://127.0.0.1:8200/v1/qw/data/gate

          # ...and read it back from a DIFFERENT pod: proves the write REPLICATED, not just
          # that one node accepted it.
          curl -sS -o /tmp/ui.html -w 'ui http=%{http_code}\n' http://127.0.0.1:8200/ui/
          kill $PF
          pf 2 || { echo "no port-forward to pod 2"; exit 1; }
          got="$(curl -sS -H "X-Vault-Token: $tok" \
                   http://127.0.0.1:8200/v1/qw/data/gate | jq -r '.data.data.value')"
          echo "replicated read from pod 2 -> $got"
          kill $PF
          test "$got" = "quench"

          # The web UI must actually be compiled into the binary (built with -tags ui).
          #
          # Checking for HTTP 200 here would be WORTHLESS: a Vault built WITHOUT the ui tag
          # still answers /ui/ with 200 and a ~1.4KB HTML stub reading "Vault UI is not
          # available in this binary." Verified against the previous image, which returned
          # 200 with no UI whatsoever. So assert on CONTENT: the stub phrase must be absent
          # and the real Ember bundle must be referenced (the built index.html is ~1MB).
          if grep -qi 'not available in this binary' /tmp/ui.html; then
            echo "UI stub served: image lacks -tags ui"; exit 1
          fi
          grep -qE '/ui/assets/[A-Za-z0-9._-]+\.js' /tmp/ui.html || { echo "no Ember bundle referenced in /ui/"; exit 1; }
          echo "UI served: $(wc -c </tmp/ui.html) bytes, Ember bundle referenced"

          helm uninstall hatest --wait

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/vault-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/vault@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/vault:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

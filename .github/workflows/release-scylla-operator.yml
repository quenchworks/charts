name: release-scylla-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/scylla-operator/**"
      - ".github/workflows/release-scylla-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/scylla-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl wait --for=condition=Established crd/scyllaclusters.scylla.scylladb.com --timeout=120s
          kubectl rollout status deployment/rtest-scylla-operator --timeout=300s
          kubectl rollout status deployment/rtest-scylla-operator-webhook --timeout=300s
          sc() {
            cat <<YAML
          apiVersion: scylla.scylladb.com/v1
          kind: ScyllaCluster
          metadata:
            name: $1
          spec:
            version: 2026.3.6
            agentVersion: 3.4.0
            repository: ghcr.io/quenchworks/images/scylladb
            developerMode: true
            datacenter:
              name: dc1
              racks:
              - name: rack1
                members: 1
                storage: { capacity: 1Gi }
                resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
          $2
          YAML
          }
          # the webhook rejects what only it validates: a duplicate rack name (the CRD schema has no uniqueness rule)
          dup='    - name: rack1
                members: 1
                storage: { capacity: 1Gi }
                resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }'
          if sc bad "$dup" | kubectl apply -f - 2>/tmp/bad.txt; then echo "a duplicate rack was accepted"; exit 1; fi
          # the webhook returns the operator's field errors as an Invalid status; "Duplicate value" on the rack name comes
          # only from that validation (cluster_validation.go), since the CRD schema has no uniqueness rule for racks
          grep -q 'racks\[1\].name: Duplicate value' /tmp/bad.txt || { echo "rejected, but not for the duplicate rack: $(cat /tmp/bad.txt)"; exit 1; }
          # a valid cluster is admitted and the operator reconciles it into a StatefulSet
          sc gate "" | kubectl apply -f -
          for _ in $(seq 1 60); do kubectl get statefulset gate-dc1-rack1 >/dev/null 2>&1 && break; sleep 3; done
          kubectl get statefulset gate-dc1-rack1 -o jsonpath='{.spec.template.spec.initContainers[*].image}' | grep -q 'images/scylla-operator@sha256:' \
            || { echo "the StatefulSet does not run the operator image in its init containers"; kubectl get statefulset gate-dc1-rack1 -o yaml | head -80; exit 1; }
          kubectl delete scyllacluster gate --wait=true --timeout=120s
          echo "scylla-operator: CRDs established, webhook rejected a duplicate rack and admitted a valid cluster, the operator reconciled it into a StatefulSet running its own image: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/scylla-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/scylla-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/scylla-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

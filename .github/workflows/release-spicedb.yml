name: release-spicedb

on:
  push:
    branches: [main]
    paths:
      - "quench/spicedb/**"
      - ".github/workflows/release-spicedb.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/spicedb
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # The image is pinned by digest and lives in a non-public GHCR package,
          # so give the pod credentials to pull the real, signed artifact. A
          # pre-created ServiceAccount carries the pull secret from pod-creation
          # time (patching a chart-created SA would not affect the running pod).
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl create serviceaccount spicedb-puller
          kubectl patch serviceaccount spicedb-puller \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set serviceAccount.create=false --set serviceAccount.name=spicedb-puller \
            --wait --timeout 5m
          kubectl rollout status deployment/rtest-spicedb --timeout=300s
          # Pod must be Ready (readiness gate = gRPC :50051 accepting connections).
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=rtest --timeout=120s
          # Smoke: the metrics endpoint returns 200 and the gRPC port accepts a
          # connection. The runtime image is shell-free, so probe from the client
          # side over a port-forward.
          kubectl port-forward svc/rtest-spicedb 9090:9090 >/tmp/pf-metrics.log 2>&1 &
          pfm=$!
          kubectl port-forward svc/rtest-spicedb 50051:50051 >/tmp/pf-grpc.log 2>&1 &
          pfg=$!
          trap 'kill $pfm $pfg' EXIT
          sleep 5
          # /metrics returns 200 once SpiceDB is serving.
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9090/metrics | grep -q '^200$'
          # gRPC port accepts a TCP connection.
          python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',50051)); s.close(); print('grpc :50051 reachable')"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/spicedb-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/spicedb@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/spicedb:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

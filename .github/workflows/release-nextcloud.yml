name: release-nextcloud

on:
  push:
    branches: [main]
    paths:
      - "quench/nextcloud/**"
      - ".github/workflows/release-nextcloud.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/nextcloud
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled mariadb subchart into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Warm nextcloud image on the kind node
        run: |
          set -o pipefail
          # Pull the exact pinned digest onto the kind node HERE (outside the helm --wait
          # window) so the pod starts immediately and the gate isn't eaten by image
          # extraction. The same digest is used by the install initContainer and the
          # nextcloud container.
          IMG="$(helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" | grep -oE 'ghcr.io/quenchworks/images/nextcloud@sha256:[a-f0-9]{64}' | head -1)"
          echo "warming image: $IMG"
          NODE="$(docker ps --filter name=control-plane --format '{{.Names}}' | head -1)"
          echo "kind node: $NODE"
          time docker exec "$NODE" crictl pull "$IMG"
          docker exec "$NODE" crictl images | grep -i nextcloud || true

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait blocks until BOTH the bundled MariaDB and Nextcloud are Ready. Nextcloud
          # only becomes Ready after the install initContainer has run occ maintenance:install
          # against MariaDB (schema creation) and php-fpm/nginx serve /status.php, so this is
          # the real integration test. The image is pre-warmed on the node above.
          helm install rtest "${CHART_DIR}" -n cloud --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-nextcloud -n cloud --timeout=540s
          # --- confirm the container runs as the nonroot uid 1001 ---
          uid="$(kubectl get pod -n cloud -l app.kubernetes.io/name=nextcloud -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"
          test "$uid" = "1001"
          # --- smoke: /status.php reports installed:true; GET / serves the app ---
          kubectl port-forward -n cloud svc/rtest-nextcloud 8080:8080 >/tmp/pf8080.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          code="$(curl -s -o /tmp/status.json -w '%{http_code}' http://127.0.0.1:8080/status.php)"
          echo "GET /status.php HTTP status: $code"; cat /tmp/status.json; echo
          test "$code" = "200"
          grep -q '"installed":true' /tmp/status.json || { echo "instance not installed"; exit 1; }
          code="$(curl -s -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "GET / HTTP status: $code"
          case "$code" in
            200|302|303) echo "nextcloud is serving (HTTP $code)";;
            *) echo "unexpected HTTP status $code"; head -c 500 /tmp/home.html; exit 1;;
          esac

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="; kubectl get pods -n cloud -o wide || true
          echo "=== nextcloud describe ==="; kubectl describe pod -n cloud -l app.kubernetes.io/name=nextcloud || true
          echo "=== nextcloud install init logs ==="; kubectl logs -n cloud -l app.kubernetes.io/name=nextcloud -c install --tail=80 || true
          echo "=== nextcloud logs ==="; kubectl logs -n cloud -l app.kubernetes.io/name=nextcloud --tail=80 || true
          echo "=== nextcloud previous logs ==="; kubectl logs -n cloud -l app.kubernetes.io/name=nextcloud --previous --tail=80 || true
          echo "=== mariadb describe ==="; kubectl describe pod -n cloud -l app.kubernetes.io/name=mariadb || true
          echo "=== mariadb logs ==="; kubectl logs -n cloud -l app.kubernetes.io/name=mariadb --tail=40 || true

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/nextcloud-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/nextcloud@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE-ME "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/nextcloud:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

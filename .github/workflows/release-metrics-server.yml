name: release-metrics-server

on:
  push:
    branches: [main]
    paths:
      - "quench/metrics-server/**"
      - ".github/workflows/release-metrics-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/metrics-server
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # kind's kubelets serve certificates the cluster CA never signed, so
          # ci/default-values.yaml sets kubelet.insecureTLS=true. The chart itself
          # ships that OFF -- a default install on such a cluster is supposed to fail.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-metrics-server --timeout=300s

          # The aggregation layer has to accept it...
          kubectl wait --for=condition=Available --timeout=180s apiservice/v1beta1.metrics.k8s.io
          kubectl get apiservice v1beta1.metrics.k8s.io

          # ...and Available=True is NOT enough: it says the apiserver can reach the
          # backend, not that any kubelet scrape succeeded. Demand real numbers.
          ok=0
          for i in $(seq 1 24); do
            if kubectl top nodes --no-headers 2>/dev/null | grep -qE '[0-9]+m +[0-9]+%'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1" || { kubectl logs deployment/rtest-metrics-server | tail -30; echo "kubectl top nodes returned no metrics"; exit 1; }
          kubectl top nodes
          kubectl top pods -n kube-system

          # delegated-auth RBAC failures look like a healthy pod serving 403s
          if kubectl logs deployment/rtest-metrics-server | grep -iE 'forbidden|cannot list|Unauthorized'; then
            echo "RBAC denial in the metrics-server log"; exit 1
          fi
          echo "no RBAC denials in the metrics-server log"

          restarts="$(kubectl get pods -l app.kubernetes.io/instance=rtest \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')"
          echo "restartCount=${restarts}"
          test "${restarts}" = "0"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/metrics-server-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/metrics-server@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/metrics-server:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

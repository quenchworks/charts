name: release-openbao

on:
  push:
    branches: [main]
    paths:
      - "quench/openbao/**"
      - ".github/workflows/release-openbao.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/openbao
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          set -o pipefail
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # ci/default-values.yaml runs dev mode (auto-unsealed) with a fixed root token,
          # so /v1/sys/health returns 200 and a kv roundtrip can run.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 6m
          kubectl rollout status statefulset/rtest-openbao --timeout=300s

          # dev mode = init + unsealed: /v1/sys/health returns 200 over a port-forward
          # (the runtime image has no HTTP client).
          kubectl port-forward rtest-openbao-0 8200:8200 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          ok=""
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/v1/sys/health)" || true
            echo "health: $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          test -n "$ok"   # fail loudly if the dev node never reports init+unsealed

          # Real kv roundtrip via the in-image `bao` CLI using the dev root token.
          TOKEN="$(kubectl get secret rtest-openbao-dev -o jsonpath='{.data.dev-root-token}' | base64 -d)"
          test -n "$TOKEN"
          kubectl exec rtest-openbao-0 -- sh -c \
            "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=$TOKEN bao kv put secret/gate v=quench"
          out="$(kubectl exec rtest-openbao-0 -- sh -c \
            "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=$TOKEN bao kv get -field=v secret/gate")"
          echo "kv get -> $out"
          echo "$out" | grep -q '^quench$'   # fail loudly on mismatch

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/openbao-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/openbao@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/openbao:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-derper

on:
  push:
    branches: [main]
    paths:
      - "quench/derper/**"
      - ".github/workflows/release-derper.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/derper
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-derper --timeout=300s
          kubectl get secret rtest-derper-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/derp-ca.crt
          # DERP over HTTPS on 443 with the chart's certificate (derper wants the SNI to be its hostname)
          kubectl port-forward svc/rtest-derper 8443:443 >/tmp/pf.log 2>&1 & pf=$!; sleep 3
          R="--cacert /tmp/derp-ca.crt --resolve rtest-derper:8443:127.0.0.1"
          for _ in $(seq 1 20); do curl -fsS -o /dev/null $R https://rtest-derper:8443/ && break; sleep 1; done
          grep -q DERP <<<"$(curl -fsS $R https://rtest-derper:8443/)" || { echo "no DERP home page over HTTPS"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' $R https://rtest-derper:8443/derp/probe)" = 200 ] || { echo "the probe endpoint failed"; exit 1; }
          kill $pf 2>/dev/null || true
          # derpprobe (in the image) inside the cluster: a DERP connection (its mesh probe) over TLS with the
          # certificate pinned (sha256-raw of its DER) and a STUN probe over UDP to the Service IP; port-forward
          # cannot carry UDP. Its separate "tls" probe checks the system roots, which a private CA never passes.
          PIN=$(kubectl get secret rtest-derper-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -outform der | sha256sum | cut -d' ' -f1)
          IP=$(kubectl get svc rtest-derper -o jsonpath='{.spec.clusterIP}')
          IMG="$(grep -m1 '^  repository:' "${CHART_DIR}/values.yaml" | awk '{print $2}')@$(grep -m1 '^  digest:' "${CHART_DIR}/values.yaml" | tr -d '"' | awk '{print $2}')"
          cat > /tmp/derpmap.json <<JSON
          {"Regions": {"900": {"RegionID": 900, "RegionCode": "gate", "RegionName": "gate", "Nodes": [
            {"Name": "900a", "RegionID": 900, "HostName": "rtest-derper", "CertName": "sha256-raw:$PIN", "IPv4": "$IP", "STUNPort": 3478, "DERPPort": 443}]}}}
          JSON
          kubectl create configmap derpmap --from-file=map.json=/tmp/derpmap.json
          sed "s|IMAGE|$IMG|" <<'POD' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata: { name: derpprobe }
          spec:
            restartPolicy: Never
            securityContext: { runAsNonRoot: true, runAsUser: 1001 }
            containers:
              - name: probe
                image: IMAGE
                command: ["/usr/bin/derpprobe", "-once", "-derp-map", "file:///m/map.json"]
                volumeMounts: [{ name: m, mountPath: /m }]
            volumes: [{ name: m, configMap: { name: derpmap } }]
          POD
          for _ in $(seq 1 60); do p=$(kubectl get pod derpprobe -o jsonpath='{.status.phase}'); [ "$p" = Succeeded ] || [ "$p" = Failed ] && break; sleep 2; done
          kubectl logs derpprobe | tee /tmp/derpprobe.log | tail -20
          grep -q 'good: derp/gate/900a/900a/mesh' /tmp/derpprobe.log || { echo "no DERP connection through the relay"; exit 1; }
          grep -Eq 'good: derp/gate/900a/udp' /tmp/derpprobe.log || { echo "no STUN answer over UDP"; exit 1; }
          echo "derper: DERP over HTTPS on 443 as nonroot with the chart's certificate, probe endpoint, derpprobe DERP and STUN in-cluster: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/derper-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/derper@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/derper:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

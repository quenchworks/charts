name: release-ghost

on:
  push:
    branches: [main]
    paths:
      - "quench/ghost/**"
      - ".github/workflows/release-ghost.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/ghost
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled mariadb subchart into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Warm ghost image on the kind node
        run: |
          set -o pipefail
          # Pull the exact pinned digest onto the kind node HERE (outside the helm --wait
          # window) so the pod starts immediately and the readiness gate isn't eaten by
          # image extraction. The same digest is used by both the seed initContainer and
          # the ghost container.
          IMG="$(helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" | grep -oE 'ghcr.io/quenchworks/images/ghost@sha256:[a-f0-9]{64}' | head -1)"
          echo "warming image: $IMG"
          NODE="$(docker ps --filter name=control-plane --format '{{.Names}}' | head -1)"
          echo "kind node: $NODE"
          time docker exec "$NODE" crictl pull "$IMG"
          docker exec "$NODE" crictl images | grep -i ghost || true

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait blocks until BOTH the bundled MariaDB and Ghost are Ready. Ghost only
          # becomes Ready once it connects to MariaDB and runs its migrations on first boot
          # (and the seed initContainer has populated the content PVC), so this is the real
          # integration test. The image is pre-warmed on the node above.
          helm install rtest "${CHART_DIR}" -n blog --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-ghost -n blog --timeout=540s
          # --- confirm the container runs as the nonroot uid 1001 ---
          uid="$(kubectl get pod -n blog -l app.kubernetes.io/name=ghost -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"
          test "$uid" = "1001"
          # --- smoke: GET / returns 200 (or a 301/302 redirect to the configured url) ---
          kubectl port-forward -n blog svc/rtest-ghost 2368:2368 >/tmp/pf2368.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          code="$(curl -s -o /tmp/home.txt -w '%{http_code}' http://127.0.0.1:2368/)"
          echo "GET / HTTP status: $code"
          case "$code" in
            200|301|302) echo "ghost is serving (HTTP $code)";;
            *) echo "unexpected HTTP status $code"; head -c 500 /tmp/home.txt; exit 1;;
          esac

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="; kubectl get pods -n blog -o wide || true
          echo "=== ghost describe ==="; kubectl describe pod -n blog -l app.kubernetes.io/name=ghost || true
          echo "=== ghost logs ==="; kubectl logs -n blog -l app.kubernetes.io/name=ghost --tail=80 || true
          echo "=== ghost previous logs ==="; kubectl logs -n blog -l app.kubernetes.io/name=ghost --previous --tail=80 || true
          echo "=== ghost seed-content init logs ==="; kubectl logs -n blog -l app.kubernetes.io/name=ghost -c seed-content --tail=40 || true
          echo "=== mariadb describe ==="; kubectl describe pod -n blog -l app.kubernetes.io/name=mariadb || true
          echo "=== mariadb logs ==="; kubectl logs -n blog -l app.kubernetes.io/name=mariadb --tail=40 || true

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/ghost-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/ghost@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/ghost:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-commafeed

on:
  push:
    branches: [main]
    paths:
      - "quench/commafeed/**"
      - ".github/workflows/release-commafeed.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/commafeed
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # a feed served inside the cluster (CommaFeed blocks local addresses by default; the gate turns that off)
          kubectl run gate-feed --restart=Never --port=8080 --image=ghcr.io/quenchworks/images/busybox:1.38.0 --command -- sh -c \
            'mkdir -p /tmp/w && printf "%s" "<?xml version=\"1.0\"?><rss version=\"2.0\"><channel><title>Quench gate feed</title><link>http://example.test/</link><description>d</description><item><title>quench gate entry</title><link>http://example.test/1</link><guid>quench-gate-1</guid><description>hello</description></item></channel></rss>" > /tmp/w/feed.xml && exec httpd -f -p 8080 -h /tmp/w'
          kubectl expose pod gate-feed --port=8080
          kubectl wait --for=condition=Ready pod/gate-feed --timeout=180s
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set settings.COMMAFEED_HTTP_CLIENT_BLOCK_LOCAL_ADDRESSES=false --wait --timeout 15m
          kubectl rollout status deployment/rtest-commafeed --timeout=600s
          fwd() { kubectl port-forward svc/rtest-commafeed 8082:8082 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          C=""; B=http://127.0.0.1:8082; PW='Quench-CI-CommaFeed-2026!'
          J=(-H 'Content-Type: application/json' -H 'Accept: application/json')
          up() { for _ in $(seq 1 90); do [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/rest/server/get")" = 200 ] && return 0; sleep 2; done; echo "/rest/server/get never answered"; return 1; }
          setup() {
            up || return 1
            curl -s $C "${J[@]}" -o /tmp/setup.txt -w '%{http_code}\n' -d "{\"name\":\"admin\",\"password\":\"$PW\",\"email\":\"admin@example.com\"}" \
              "$B/rest/user/initialSetup" | grep -q '^200$' || { echo "initial setup failed: $(cat /tmp/setup.txt)"; return 1; }
            [ "$(curl -s $C -o /dev/null -w '%{http_code}' -u admin:wrong-password-1 "$B/rest/user/profile")" != 200 ] || { echo "a wrong password was accepted"; return 1; }
            curl -s $C "${J[@]}" -u "admin:$PW" -o /tmp/sub.txt -w '%{http_code}\n' \
              -d '{"url":"http://gate-feed.default.svc:8080/feed.xml","title":"Quench gate feed"}' "$B/rest/feed/subscribe" | grep -q '^200$' \
              || { echo "subscribe failed: $(cat /tmp/sub.txt)"; return 1; }
          }
          read_entry() {
            up || return 1
            for _ in $(seq 1 45); do
              curl -s $C -u "admin:$PW" "$B/rest/category/entries?id=all&readType=all" > /tmp/entries.json
              grep -q 'quench gate entry' /tmp/entries.json && return 0
              sleep 2
            done
            echo "the feed entry never appeared: $(head -c 400 /tmp/entries.json)"; return 1
          }
          both() { setup && read_entry; }
          fwd both
          # the account, the subscription and the entries live in PostgreSQL: they survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=commafeed --wait=true
          kubectl rollout status deployment/rtest-commafeed --timeout=600s
          fwd read_entry
          # native TLS from Quarkus on the same Service port, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --reuse-values --set tls.enabled=true --wait --timeout 15m
          kubectl rollout status deployment/rtest-commafeed --timeout=600s
          kubectl get secret rtest-commafeed-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/cf-ca.crt
          tlsgate() {
            read_entry || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:8082/rest/server/get 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          C="--cacert /tmp/cf-ca.crt --resolve rtest-commafeed:8082:127.0.0.1"; B=https://rtest-commafeed:8082
          fwd tlsgate
          echo "commafeed: initial setup, wrong password refused, an in-cluster feed subscribed and its entry read, kept across a pod restart, native TLS with plain HTTP refused: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/commafeed-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/commafeed@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/commafeed:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-supply-chain-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/supply-chain-stack/**"
      - ".github/workflows/release-supply-chain-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/supply-chain-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace supply-chain
          # the failure-diagnostics step below reads the current namespace
          kubectl config set-context --current --namespace=supply-chain
          helm install sc "${CHART_DIR}" -n supply-chain -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl wait --for=condition=Ready clusterpolicy/quench-signed-images --timeout=120s
          echo "clusterpolicy quench-signed-images: Ready"
          kubectl create namespace demo
          kubectl label namespace demo quench-works.com/verify-images=true
          # a signed QuenchWorks image, by tag: admitted and pinned to its digest
          kubectl -n demo run signed --image=ghcr.io/quenchworks/images/nginx:1.28.3 --restart=Never \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1001}}}'
          img="$(kubectl -n demo get pod signed -o jsonpath='{.spec.containers[0].image}')"
          echo "admitted: $img"; grep -q '@sha256:' <<<"$img"
          kubectl -n demo wait --for=condition=Ready pod/signed --timeout=180s
          # an image from another registry: denied
          if out="$(kubectl -n demo run outsider --image=docker.io/library/busybox:1.37 --restart=Never 2>&1)"; then
            echo "an image from docker.io was admitted: $out"; exit 1
          fi
          echo "denied: $(grep -o 'Only images from[^"]*' <<<"$out" | head -1)"
          grep -q "allowed-registries" <<<"$out"
          # trivy-operator scans the admitted pod. Its scan Job appeared about 7.5
          # minutes after the pod in kind, then fetches the Trivy DB before scanning:
          # allow 15 minutes, as the trivy-operator chart's own gate does.
          for i in $(seq 1 180); do
            # items[0] of an empty list is an error; under set -e that ended the step
            r="$(kubectl -n demo get vulnerabilityreports -o jsonpath='{.items[0].report.summary}' 2>/dev/null || true)"
            [ -n "$r" ] && break
            # every minute: where the scan stands, and why any scan container exited
            if [ $((i % 12)) = 0 ]; then
              echo "--- t=$((i*5))s"
              kubectl get jobs,pods -l app.kubernetes.io/managed-by=trivy-operator -o wide 2>/dev/null | tail -n +1
              for p in $(kubectl get pods -l app.kubernetes.io/managed-by=trivy-operator -o name 2>/dev/null); do
                kubectl get "$p" -o jsonpath='{range .status.initContainerStatuses[*]}{"init "}{.name}{" "}{.state}{"\n"}{end}{range .status.containerStatuses[*]}{.name}{" "}{.state}{"\n"}{end}' 2>/dev/null
                kubectl logs "$p" --all-containers --tail=15 2>/dev/null | sed 's/^/    /'
              done
              kubectl get events --sort-by=.lastTimestamp 2>/dev/null | grep -iE "scan|trivy" | tail -5
            fi
            sleep 5
          done
          echo "trivy-operator report for the signed pod: $r"; test -n "$r"
          for p in $(kubectl get pods -o name | grep -v scan-vulnerabilityreport); do
            uid="$(kubectl get "$p" -o jsonpath='{.spec.securityContext.runAsUser}')"
            echo "runAsUser $p: $uid"; test "$uid" = "1001"
          done

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/supply-chain-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/supply-chain-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/supply-chain-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

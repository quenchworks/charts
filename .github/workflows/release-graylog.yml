name: release-graylog

on:
  push:
    branches: [main]
    paths:
      - "quench/graylog/**"
      - ".github/workflows/release-graylog.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/graylog
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled mongodb and opensearch subcharts into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Warm images on the kind node
        run: |
          set -o pipefail
          # Pull the exact pinned digests onto the kind node HERE (outside the helm --wait
          # window) so the pods start immediately and the readiness gate isn't eaten by image
          # extraction. Graylog + MongoDB + OpenSearch are all warmed.
          NODE="$(docker ps --filter name=control-plane --format '{{.Names}}' | head -1)"
          echo "kind node: $NODE"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            | grep -oE 'ghcr.io/quenchworks/images/(graylog|mongodb|opensearch)@sha256:[a-f0-9]{64}' \
            | sort -u | while read -r IMG; do
                echo "warming image: $IMG"
                time docker exec "$NODE" crictl pull "$IMG"
              done

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # --wait blocks until the bundled MongoDB, OpenSearch AND Graylog are Ready. Graylog
          # only becomes Ready once it connects to both backends and /api/system/lbstatus
          # reports ALIVE on first boot, so this is the real integration test. Graylog + a JVM
          # OpenSearch node are heavy; heaps are shrunk in ci/default-values.yaml and the
          # startup probe grants ~600s, so a generous timeout is used and the images are
          # pre-warmed on the node above.
          helm install rtest "${CHART_DIR}" -n logs --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-graylog -n logs --timeout=840s
          # --- confirm the container runs as the nonroot uid 1001 ---
          uid="$(kubectl get pod -n logs -l app.kubernetes.io/name=graylog -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          echo "runAsUser: $uid"
          test "$uid" = "1001"
          # --- smoke: the load-balancer status endpoint reports ALIVE (Graylog is serving) ---
          kubectl port-forward -n logs svc/rtest-graylog 9000:9000 >/tmp/pf9000.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          status="$(curl -s http://127.0.0.1:9000/api/system/lbstatus)"
          echo "lbstatus: $status"
          echo "$status" | grep -qi ALIVE || { echo "graylog not ALIVE"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="; kubectl get pods -n logs -o wide || true
          echo "=== graylog describe ==="; kubectl describe pod -n logs -l app.kubernetes.io/name=graylog || true
          echo "=== graylog logs ==="; kubectl logs -n logs -l app.kubernetes.io/name=graylog --tail=100 || true
          echo "=== graylog previous logs ==="; kubectl logs -n logs -l app.kubernetes.io/name=graylog --previous --tail=80 || true
          echo "=== mongodb logs ==="; kubectl logs -n logs -l app.kubernetes.io/name=mongodb --tail=40 || true
          echo "=== opensearch logs ==="; kubectl logs -n logs -l app.kubernetes.io/name=opensearch --tail=40 || true

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/graylog-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/graylog@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qi REPLACE "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/graylog:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-gitlab

on:
  push:
    branches: [main]
    paths:
      - "quench/gitlab/**"
      - ".github/workflows/release-gitlab.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/gitlab
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          F=rtest-gitlab
          # migrations is a Job: --wait-for-jobs holds the install until the schema is loaded and seeded
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --wait-for-jobs --timeout 30m
          for d in webservice sidekiq gitlab-shell; do kubectl rollout status deployment/$F-$d --timeout=900s; done
          kubectl rollout status statefulset/$F-gitaly --timeout=600s
          DKB=$(kubectl get secret $F -o jsonpath='{.data.db-key-base}')
          # a root token through rails runner, the way an admin bootstraps automation
          T="glpat-gate$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          kubectl exec deploy/$F-sidekiq -c sidekiq -- bundle exec rails runner \
            "u=User.find_by_username('root'); t=u.personal_access_tokens.create!(name: 'gate', scopes: [:api, :write_repository], expires_at: 1.day.from_now); t.set_token('$T'); t.save!; puts 'TOKEN_OK'" | grep -q TOKEN_OK
          kubectl port-forward svc/$F-webservice 18181:8181 >/tmp/pf1.log 2>&1 & P1=$!
          kubectl port-forward svc/$F-gitlab-shell 12222:22 >/tmp/pf2.log 2>&1 & P2=$!
          sleep 5
          B=http://127.0.0.1:18181
          [ "$(curl -s -o /dev/null -w '%{http_code}' $B/users/sign_in)" = 200 ] || { echo "the sign-in page is not served"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: $T" -X POST "$B/api/v4/projects?name=gate")" = 201 ] || { echo "the API cannot create a project"; exit 1; }
          W=$(mktemp -d); cd $W
          git init -q -b main && git -c user.email=gate@quench.test -c user.name=gate commit -q --allow-empty -m via-http
          git push -q "http://root:$T@127.0.0.1:18181/root/gate.git" main
          [ "$(curl -s -H "PRIVATE-TOKEN: $T" "$B/api/v4/projects/root%2Fgate/repository/commits?ref_name=main" | jq -r '.[0].title')" = via-http ] || { echo "the HTTP push did not reach gitaly"; exit 1; }
          ssh-keygen -q -t ed25519 -N '' -f $W/k
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: $T" -X POST $B/api/v4/user/keys --data-urlencode title=gate --data-urlencode "key=$(cat $W/k.pub)")" = 201 ] || { echo "cannot add an SSH key"; exit 1; }
          git checkout -q -b ssh && git -c user.email=gate@quench.test -c user.name=gate commit -q --allow-empty -m via-ssh
          GIT_SSH_COMMAND="ssh -i $W/k -p 12222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes" git push -q git@127.0.0.1:root/gate.git ssh
          [ "$(curl -s -H "PRIVATE-TOKEN: $T" "$B/api/v4/projects/root%2Fgate/repository/commits?ref_name=ssh" | jq -r '.[0].title')" = via-ssh ] || { echo "the SSH push did not reach gitaly"; exit 1; }
          kill $P1 $P2 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          # the generated secrets survive an upgrade (db_key_base encrypts data at rest), and the upgrade migrates again
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --wait-for-jobs --timeout 30m
          [ "$(kubectl get secret $F -o jsonpath='{.data.db-key-base}')" = "$DKB" ] || { echo "db_key_base changed on upgrade"; exit 1; }
          echo "gitlab: migrations loaded the schema, sign-in served, root token, API project, HTTP push and SSH push stored by gitaly, secrets kept and migrations re-run across an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/gitlab-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/gitlab@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/gitlab:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

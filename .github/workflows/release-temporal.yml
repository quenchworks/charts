name: release-temporal

on:
  push:
    branches: [main]
    paths:
      - "quench/temporal/**"
      - ".github/workflows/release-temporal.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/temporal
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          # pulls quench-common + the bundled postgresql subchart into charts/
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # PG + schema-setup Job (two databases) + Temporal all-in-one boot is slow.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-temporal --timeout=540s

          # --- frontend gRPC health on :7233 ---
          # install grpc_health_probe (Temporal serves grpc.health.v1.Health)
          GHP_VERSION=v0.4.36
          curl -fsSL -o /tmp/grpc_health_probe \
            "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/${GHP_VERSION}/grpc_health_probe-linux-amd64"
          chmod +x /tmp/grpc_health_probe
          kubectl port-forward svc/rtest-temporal 7233:7233 >/tmp/pf7233.log 2>&1 &
          pf7=$!; sleep 5
          # retry a few times — the frontend health check flips to SERVING once the
          # namespace registry + matching/history are ready.
          ok=0
          for i in $(seq 1 30); do
            if /tmp/grpc_health_probe -addr=127.0.0.1:7233; then ok=1; break; fi
            sleep 4
          done
          kill $pf7 || true
          test "$ok" = 1

          # --- metrics on :8000/metrics ---
          kubectl port-forward svc/rtest-temporal 8000:8000 >/tmp/pf8000.log 2>&1 &
          pf8=$!; trap 'kill $pf8' EXIT; sleep 5
          code="$(curl -s -o /tmp/metrics.txt -w '%{http_code}' http://127.0.0.1:8000/metrics)"
          echo "metrics HTTP status: $code"
          test "$code" = "200"

          # --- logs show the frontend started ---
          # Write to a file first: piping `kubectl logs` straight into `grep -q`
          # makes grep close the pipe on its first match, SIGPIPE-killing kubectl
          # (exit 141) which `pipefail` would then propagate as a spurious failure.
          kubectl logs deployment/rtest-temporal --tail=400 >/tmp/temporal.log 2>&1
          grep -qiE 'frontend started|Service resources started|Starting to serve' /tmp/temporal.log

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/temporal-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/temporal@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/temporal:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-seerr

on:
  push:
    branches: [main]
    paths:
      - "quench/seerr/**"
      - ".github/workflows/release-seerr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/seerr
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-seerr --timeout=300s
          # a Jellyfin stand-in (the chart's own image running node) answering the calls Seerr's setup makes
          IMG=$(yq -r '.image.repository + "@" + .image.digest' "${CHART_DIR}/values.yaml")
          cat > /tmp/fake-jellyfin.js <<'JS'
            const http = require("http");
            const user = { Id: "a1b2c3d4e5f6", Name: "admin", ServerId: "fake-server-1", Policy: { IsAdministrator: true } };
            const send = (res, code, body) => { res.writeHead(code, { "Content-Type": "application/json" }); res.end(body === undefined ? "" : JSON.stringify(body)); };
            http.createServer((req, res) => {
              let b = "";
              req.on("data", (c) => (b += c));
              req.on("end", () => {
                const p = req.url.split("?")[0];
                console.log(req.method, p);
                if (req.method === "POST" && p === "/Users/AuthenticateByName") {
                  let j = {}; try { j = JSON.parse(b); } catch {}
                  if (j.Username === "admin" && j.Pw === "FakeJellyfin-2026") return send(res, 200, { User: user, AccessToken: "fake-user-token" });
                  return send(res, 401);
                }
                if (p === "/Auth/Keys") return req.method === "POST" ? send(res, 204) : send(res, 200, { Items: [{ AppName: "Seerr", AccessToken: "fake-api-key" }] });
                if (p === "/System/Info/Public") return send(res, 200, { ServerName: "Fake Jellyfin", Id: "fake-server-1", Version: "10.11.0" });
                if (p === "/System/Info") return send(res, 200, { ServerName: "Fake Jellyfin", Id: "fake-server-1", Version: "10.11.0" });
                if (p.startsWith("/Users/")) return send(res, 200, user);
                send(res, 200, { Items: [], TotalRecordCount: 0 });
              });
            }).listen(8096, () => console.log("fake jellyfin on 8096"));
          JS
          kubectl run jellyfin --image="$IMG" --port=8096 --command -- /usr/bin/node -e "$(cat /tmp/fake-jellyfin.js)"
          kubectl expose pod jellyfin --port=8096
          kubectl wait --for=condition=Ready pod/jellyfin --timeout=180s
          W=http://127.0.0.1:5055
          fwd() { kubectl port-forward svc/rtest-seerr 5055:5055 >/tmp/pf.log 2>&1 & local pf=$!; for _ in $(seq 1 30); do curl -fsS -o /dev/null "$W/api/v1/status" 2>/dev/null && break; sleep 1; done; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          post() { curl -s -o /tmp/out.json -w '%{http_code}' -b /tmp/jar -c /tmp/jar -H 'Content-Type: application/json' -d "$2" "$W$1"; }
          me() { curl -fsS -b /tmp/jar "$W/api/v1/auth/me" | grep -q '"jellyfinUsername":"admin"'; }
          setup() {
            rm -f /tmp/jar
            curl -fsS "$W/api/v1/settings/public" | grep -q '"initialized":false' || { echo "already initialized before setup"; return 1; }
            [ "$(post /api/v1/auth/jellyfin '{"username":"admin","password":"wrong-password-1","hostname":"jellyfin","port":8096,"useSsl":false,"urlBase":"","email":"admin@quench-works.com","serverType":2}')" != 200 ] \
              || { echo "a wrong Jellyfin password was accepted"; return 1; }
            c=$(post /api/v1/auth/jellyfin '{"username":"admin","password":"FakeJellyfin-2026","hostname":"jellyfin","port":8096,"useSsl":false,"urlBase":"","email":"admin@quench-works.com","serverType":2}')
            [ "$c" = 200 ] || { echo "setup sign-in through Jellyfin: $c"; cat /tmp/out.json; kubectl logs jellyfin; return 1; }
            me || { echo "no admin session"; return 1; }
            [ "$(post /api/v1/settings/initialize '')" = 200 ] || { echo "finish setup failed"; cat /tmp/out.json; return 1; }
          }
          signin() {
            rm -f /tmp/jar
            curl -fsS "$W/api/v1/settings/public" | grep -q '"initialized":true' || { echo "setup was lost"; return 1; }
            [ "$(post /api/v1/auth/jellyfin '{"username":"admin","password":"FakeJellyfin-2026"}')" = 200 ] || { echo "admin sign-in failed"; cat /tmp/out.json; return 1; }
            me || { echo "no admin session"; return 1; }
          }
          fwd setup
          # settings and the database live on the PVC: the setup and the admin survive a pod restart and an upgrade
          kubectl delete pod -l app.kubernetes.io/name=seerr,app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-seerr --timeout=300s
          fwd signin
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          fwd signin
          echo "seerr: setup through Jellyfin (wrong password refused), admin session, kept across a pod restart and an upgrade: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/seerr-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/seerr@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/seerr:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

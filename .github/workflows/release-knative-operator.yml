name: release-knative-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/knative-operator/**"
      - ".github/workflows/release-knative-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/knative-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          kubectl create namespace knative-operator
          helm install rtest "${CHART_DIR}" -n knative-operator -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m

          # --- PROVE THE OPERATOR INSTALLS KNATIVE SERVING AND EVENTING FROM THE MANIFESTS IN ITS IMAGE. ---
          kubectl create namespace knative-serving
          kubectl create namespace knative-eventing
          cat > /tmp/gate-knative.yaml <<'YAML'
          apiVersion: operator.knative.dev/v1beta1
          kind: KnativeServing
          metadata: { name: knative-serving, namespace: knative-serving }
          spec:
            ingress: { kourier: { enabled: true } }
            config: { network: { ingress-class: kourier.ingress.networking.knative.dev } }
          ---
          apiVersion: operator.knative.dev/v1beta1
          kind: KnativeEventing
          metadata: { name: knative-eventing, namespace: knative-eventing }
          YAML
          # Creation goes through the operator webhook, whose Service can lag readiness: retry.
          for i in $(seq 1 30); do kubectl apply -f /tmp/gate-knative.yaml && break; sleep 5; done

          for i in $(seq 1 90); do
            s="$(kubectl -n knative-serving get knativeserving knative-serving -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
            e="$(kubectl -n knative-eventing get knativeeventing knative-eventing -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
            echo "serving=$s eventing=$e"
            [ "$s" = True ] && [ "$e" = True ] && break
            [ "$i" = 90 ] && { kubectl get knativeserving,knativeeventing -A -o yaml; kubectl get pods -A; exit 1; }
            sleep 10
          done
          v="$(kubectl -n knative-serving get knativeserving knative-serving -o jsonpath='{.status.version}')"
          case "$v" in 1.24.*) ;; *) echo "FAIL: serving version $v, want the 1.24 manifests the operator carries"; exit 1 ;; esac
          kubectl -n knative-serving get deploy activator autoscaler controller webhook net-kourier-controller
          kubectl -n knative-eventing get deploy eventing-controller eventing-webhook

          restarts="$(kubectl -n knative-operator get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl -n knative-operator get pods; echo "FAIL: the operator or its webhook restarted"; exit 1 ;; esac
          echo "gate passed: KnativeServing (Kourier) and KnativeEventing Ready, installed by the operator"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods -A || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/knative-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/knative-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/knative-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-policy-reporter

on:
  push:
    branches: [main]
    paths:
      - "quench/policy-reporter/**"
      - ".github/workflows/release-policy-reporter.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/policy-reporter
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind, with the catalog Kyverno writing PolicyReports)
        run: |
          set -o pipefail
          helm dependency build quench/kyverno
          helm install kyv quench/kyverno -n kyverno --create-namespace \
            -f quench/kyverno/ci/default-values.yaml --wait --timeout 10m
          # Kyverno's webhook endpoint answers a little after its rollout (see release-kyverno).
          for _ in $(seq 1 60); do
            eps="$(kubectl get endpointslices -n kyverno -l kubernetes.io/service-name=kyv-kyverno-svc \
              -o jsonpath='{.items[*].endpoints[*].conditions.ready}' 2>/dev/null || true)"
            case "$eps" in *true*) break;; esac
            sleep 2
          done
          printf '%s\n' 'apiVersion: kyverno.io/v1' 'kind: ClusterPolicy' 'metadata: {name: require-team-label}' \
            'spec:' '  validationFailureAction: Audit' '  background: true' '  rules:' \
            '    - name: check-team-label' '      match: {any: [{resources: {kinds: [Pod]}}]}' \
            '      validate:' '        message: "every Pod must carry the label team"' \
            '        pattern: {metadata: {labels: {team: "?*"}}}' > /tmp/policy.yaml
          ok=""
          for _ in $(seq 1 30); do kubectl apply -f /tmp/policy.yaml && { ok=1; break; }; sleep 5; done
          test -n "$ok"
          kubectl create namespace app
          kubectl -n app run nolabel --image=registry.k8s.io/pause:3.10 --restart=Never
          helm install pr "${CHART_DIR}" -n policy-reporter --create-namespace \
            -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 5m
          uid="$(kubectl get pod -n policy-reporter -l app.kubernetes.io/name=policy-reporter -o jsonpath='{.items[0].spec.securityContext.runAsUser}')"
          test "$uid" = "1001"
          kubectl -n policy-reporter port-forward svc/pr-policy-reporter 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # The audit result reaches Policy Reporter's REST API and its metrics.
          got=""
          for _ in $(seq 1 36); do
            out="$(curl -s 'http://127.0.0.1:8080/v1/namespaced-resources/results?namespaces=app')"
            grep -q '"name":"nolabel"' <<<"$out" && grep -q '"policy":"require-team-label"' <<<"$out" \
              && grep -q '"status":"fail"' <<<"$out" && { got=1; break; }
            sleep 5
          done
          test -n "$got" || { echo "no fail result for app/nolabel: ${out:0:400}"; exit 1; }
          metrics="$(curl -s http://127.0.0.1:8080/metrics)"
          grep -q 'policy_report_result{.*name="nolabel".*namespace="app".*status="fail"' <<<"$metrics" \
            || { echo "policy_report_result has no fail for app/nolabel"; exit 1; }
          echo "Policy Reporter serves Kyverno's audit result over REST and metrics"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/policy-reporter-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/policy-reporter@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/policy-reporter:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-vllm

on:
  push:
    branches: [main]
    paths:
      - "quench/vllm/**"
      - ".github/workflows/release-vllm.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/vllm
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # vLLM can't serve without a (multi-GB) model, so the gate proves the chart
          # renders + installs against the real signed image: ci/default-values.yaml
          # idles the image's venv python (no model download) and disables the HTTP
          # probes. The runtime image is large; give the pull plenty of time.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-vllm --timeout=480s
          # exec the real image binary (no shell needed) to prove it is healthy:
          # `vllm --version` reports <X.Y.Z>+cpu on the CPU build.
          kubectl exec statefulset/rtest-vllm -- /usr/bin/vllm --version | grep -E '\+cpu$'

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/vllm-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/vllm@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml" || grep -q REPLACE-ME "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/vllm:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-dapr

on:
  push:
    branches: [main]
    paths:
      - "quench/dapr/**"
      - ".github/workflows/release-dapr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/dapr
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -n dapr-system --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl -n dapr-system get pods -o wide
          kubectl -n dapr-system wait pod --all --for=condition=Ready --timeout=300s
          want="$(helm get values rtest -n dapr-system -a -o json | jq -r .quenchworksImage)"
          # 1. every control-plane pod runs the QuenchWorks image
          imgs="$(kubectl -n dapr-system get pods -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' | sort -u)"
          echo "$imgs"
          test "$imgs" = "$want"
          # 2. an annotated pod gets the daprd sidecar from that image
          #    The webhook fails open (failurePolicy Ignore): until the injector has written
          #    its CA into the webhook config, pods are admitted without a sidecar.
          for i in $(seq 1 60); do
            ca="$(kubectl get mutatingwebhookconfiguration dapr-sidecar-injector -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null)"
            [ -n "$ca" ] && break
            [ "$i" = 60 ] && { echo "injector never published its CA"; kubectl -n dapr-system logs deploy/dapr-sidecar-injector --tail=40; exit 1; }
            sleep 2
          done
          cat <<Y | kubectl apply -f -
          apiVersion: dapr.io/v1alpha1
          kind: Component
          metadata: { name: gatestate, namespace: default }
          spec: { type: state.in-memory, version: v1, metadata: [] }
          ---
          # a Deployment, not a bare Pod: the injector only patches pods a controller
          # (here the ReplicaSet controller) creates, not ones a user creates directly
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: gate-app, namespace: default }
          spec:
            selector: { matchLabels: { app: gate-app } }
            template:
              metadata:
                labels: { app: gate-app }
                annotations: { dapr.io/enabled: "true", dapr.io/app-id: "gate-app" }
              spec:
                securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
                containers:
                  - name: app
                    image: ghcr.io/quenchworks/images/opa@sha256:ee532239a909beba856a6caf4039667f3d2984eb9c29d42810fea722bb258d34
                    securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          Y
          kubectl -n default rollout status deployment/gate-app --timeout=300s
          pod="$(kubectl -n default get pod -l app=gate-app -o jsonpath='{.items[0].metadata.name}')"
          # recent Dapr injects daprd as a native sidecar (an initContainer with
          # restartPolicy Always) where the cluster supports it, a container otherwise
          side="$(kubectl -n default get pod "$pod" -o jsonpath='{.spec.initContainers[?(@.name=="daprd")].image}{.spec.containers[?(@.name=="daprd")].image}')"
          echo "sidecar: $side"
          [ "$side" = "$want" ] || { kubectl -n default get pod "$pod" -o yaml | head -60; kubectl -n dapr-system logs deploy/dapr-sidecar-injector --tail=40; exit 1; }
          # 3. state round-trips through the sidecar's API
          kubectl -n default port-forward "pod/$pod" 13500:3500 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT; sleep 5
          curl -fsS -X POST -H 'Content-Type: application/json' -d '[{"key":"k","value":"quenchworks"}]' http://127.0.0.1:13500/v1.0/state/gatestate
          test "$(curl -fsS http://127.0.0.1:13500/v1.0/state/gatestate/k)" = '"quenchworks"'
          grep -q '"id":"gate-app"' <<<"$(curl -fsS http://127.0.0.1:13500/v1.0/metadata)"
          echo "install gate OK: control plane on the QuenchWorks image, sidecar injected from it, state saved and read"
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/dapr-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/dapr@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/dapr:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

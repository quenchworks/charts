name: release-thelounge

on:
  push:
    branches: [main]
    paths:
      - "quench/thelounge/**"
      - ".github/workflows/release-thelounge.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/thelounge
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # an IRC server for The Lounge to connect to: our Ergo chart
          helm install irc oci://ghcr.io/quenchworks/charts/ergo --version 0.0.1 --set serverName=irc.quench.test --set oper.password=quench-ci-oper-pass --wait --timeout 8m
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set defaults.host=irc-ergo --set defaults.port=6667 --set defaults.tls=false --wait --timeout 8m
          kubectl rollout status deployment/rtest-thelounge --timeout=300s
          PW=quench-ci-admin-pass
          # sio: a socket.io session over HTTP long-polling (EIO 4); B is the session URL after sio_open
          sio_open() { B="${1:-http://127.0.0.1:9000}/socket.io/?EIO=4&transport=polling"; local sid
            sid=$(curl -ksS "$B" | sed -n 's/.*"sid":"\([^"]*\)".*/\1/p'); [ -n "$sid" ] || return 1
            B="$B&sid=$sid"; curl -ksS -XPOST -d 40 "$B" >/dev/null; curl -ksS "$B" >/dev/null; }
          sio_send() { curl -ksS -XPOST -d "$1" "$B" >/dev/null; }
          sio_read() { curl -ksS --max-time 30 "$B"; }
          # login USER PASS [BASE]: sign in on a new session, the reply in LOUT (no subshell: B must survive)
          login() { sio_open "$3" && sio_send "42[\"auth:perform\",{\"user\":\"$1\",\"password\":\"$2\"}]" && LOUT="$(sio_read)"; }
          fwd() { kubectl port-forward svc/rtest-thelounge 9000:9000 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          gate1() {
            login admin wrong-password-1; grep -q 'auth:failed' <<<"$LOUT" || { echo "a wrong password was not refused"; return 1; }
            login admin $PW; grep -q '"configuration"' <<<"$LOUT" || { echo "the admin could not sign in"; return 1; }
            # a network on the default server: The Lounge connects to Ergo and stays connected for the user
            sio_send '42["network:new",{"name":"GateNet","host":"irc-ergo","port":"6667","tls":false,"nick":"lounge","username":"lounge","realname":"gate","join":"#gate"}]'
            local all=""; for _ in 1 2 3 4 5 6; do all="$all$(sio_read)"; grep -q 'Connected to the network' <<<"$all" && break; done
            grep -q 'Connected to the network' <<<"$all" || { echo "The Lounge never connected to Ergo:"; echo "$all" | tail -c 2000; return 1; }
          }
          gate2() {
            login admin $PW "$@"; local out="$LOUT"
            grep -q '"configuration"' <<<"$out" || { echo "the admin could not sign in"; return 1; }
            local all="$out"; for _ in 1 2 3; do all="$all$(sio_read)"; grep -q '"GateNet"' <<<"$all" && break; done
            grep -q '"GateNet"' <<<"$all" || { echo "the network is gone"; return 1; }
          }
          fwd gate1
          # The Lounge writes user files on a debounce: wait for the network to land in admin.json, then the
          # user and its network must survive a pod restart (they live on the PVC)
          saved() { kubectl exec deploy/rtest-thelounge -c thelounge -- /usr/bin/node -e \
            'process.exit(require("fs").readFileSync("/var/opt/thelounge/users/admin.json","utf8").includes("GateNet") ? 0 : 1)'; }
          for _ in $(seq 1 30); do saved && break; sleep 2; done
          saved || { echo "the network was never saved to admin.json"; exit 1; }
          kubectl delete pod -l app.kubernetes.io/instance=rtest --wait=true
          kubectl rollout status deployment/rtest-thelounge --timeout=300s
          fwd gate2
          # native TLS on the same port with the Helm-made CA, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set defaults.host=irc-ergo --set defaults.port=6667 --set defaults.tls=false --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status deployment/rtest-thelounge --timeout=300s
          kubectl get secret rtest-thelounge-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/tl-ca.crt
          tlsgate() {
            local u=https://rtest-thelounge:9000/ r="--resolve rtest-thelounge:9000:127.0.0.1"
            for _ in $(seq 1 20); do curl -fsS -o /dev/null --cacert /tmp/tl-ca.crt $r $u && break; sleep 1; done
            curl -fsS --cacert /tmp/tl-ca.crt $r $u | grep -q 'The Lounge' || { echo "no web UI over HTTPS"; return 1; }
            ! curl -fsS -o /dev/null http://127.0.0.1:9000/ 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
            gate2 https://127.0.0.1:9000
          }
          fwd tlsgate
          echo "thelounge: admin sign-in enforced, connected to Ergo, user and network kept across a restart and a TLS upgrade: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/thelounge-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/thelounge@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/thelounge:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

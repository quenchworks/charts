name: release-vpn-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/vpn-stack/**"
      - ".github/workflows/release-vpn-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/vpn-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 20m
          kubectl rollout status statefulset/rtest-postgresql --timeout=900s
          for c in management signal relay dashboard; do kubectl rollout status deployment/rtest-netbird-$c --timeout=600s; done
          KEY=$(kubectl get secret rtest-netbird -o jsonpath='{.data.store-key}')
          leader() { kubectl get pods -l app.kubernetes.io/instance=rtest,role=master -o name; }
          one_leader() {
            for _ in $(seq 1 90); do [ "$(leader | wc -l)" = 1 ] && return 0; sleep 2; done
            echo "the Patroni cluster has no single leader:"; kubectl get pods -L role; return 1
          }
          one_leader
          [ "$(kubectl get pods -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=postgresql --field-selector=status.phase=Running -o name | wc -l)" = 3 ] || { echo "not 3 database members"; kubectl get pods; exit 1; }
          fwd() { local svc=$1 ports=$2; shift 2; kubectl port-forward "svc/$svc" "$ports" >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          mgmt() {
            for _ in $(seq 1 60); do
              curl -s http://127.0.0.1:18080/oauth2/.well-known/openid-configuration | jq -e '.issuer == "http://netbird.quench.test/oauth2"' >/dev/null \
                && [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/users)" = 401 ] && return 0
              sleep 2
            done
            echo "management is not serving sign-in and the API"; return 1
          }
          export -f mgmt
          owner() {
            PGPW=$(kubectl get secret rtest-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)
            n=$(kubectl exec "$(leader)" -c postgresql -- env PGPASSWORD="$PGPW" psql -h 127.0.0.1 -U netbird -d netbird_store -tAc "select count(*) from password where email = 'admin@example.com'")
            [ "$(echo "$n" | tr -d ' ')" = 1 ] || { echo "owner not in the store (count: $n)"; return 1; }
          }
          check() { fwd rtest-netbird-management 18080:80 bash -c mgmt && owner; }
          check
          # failover: delete the database leader; Patroni promotes a replica, the Service follows it,
          # and NetBird keeps serving with its data
          old=$(leader); echo "killing the leader $old"
          kubectl delete "$old" --wait=false
          for _ in $(seq 1 90); do n=$(leader); [ -n "$n" ] && [ "$n" != "$old" ] && break; sleep 2; done
          [ -n "$(leader)" ] && [ "$(leader)" != "$old" ] || { echo "no new leader after deleting $old"; kubectl get pods -L role; exit 1; }
          echo "new leader $(leader)"
          kubectl rollout status deployment/rtest-netbird-management --timeout=300s
          check
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 20m
          [ "$(kubectl get secret rtest-netbird -o jsonpath='{.data.store-key}')" = "$KEY" ] || { echo "the store key changed on upgrade"; exit 1; }
          one_leader
          check
          echo "vpn-stack: NetBird on a 3-member Patroni cluster (one leader), sign-in, protected API and the owner in the store; survives killing the database leader and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/vpn-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/vpn-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/vpn-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

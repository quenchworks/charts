name: release-calibre-web

on:
  push:
    branches: [main]
    paths:
      - "quench/calibre-web/**"
      - ".github/workflows/release-calibre-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/calibre-web
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl rollout status deployment/rtest-calibre-web --timeout=300s
          PW=$(kubectl get secret rtest-calibre-web -o jsonpath='{.data.password}' | base64 -d)
          [ "$PW" = Quench-CI-calibreweb-2026 ] || { echo "the Secret does not hold the values password"; exit 1; }
          kubectl logs deploy/rtest-calibre-web -c set-admin-password | grep -qF "Password for user 'admin' changed" || { echo "the init container did not set the password"; exit 1; }
          fwd() { kubectl port-forward svc/rtest-calibre-web 18083:8083 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          B=http://127.0.0.1:18083
          ready() { for _ in $(seq 1 60); do curl -sf "$B/login" >/dev/null && return 0; sleep 2; done; echo "/login never answered"; return 1; }
          # login <password>: prints the redirect target of the form post (empty when refused)
          login() {
            rm -f /tmp/cw.jar
            local t; t=$(curl -s -c /tmp/cw.jar "$B/login" | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' | head -1)
            [ -n "$t" ] || { echo "no-csrf"; return 0; }
            curl -s -o /dev/null -w '%{redirect_url}' -b /tmp/cw.jar -c /tmp/cw.jar --data-urlencode "csrf_token=$t" --data-urlencode username=admin --data-urlencode "password=$1" --data-urlencode submit=Login "$B/login"
          }
          ok() { local r; r=$(login "$1"); [ -n "$r" ] && [ "$r" != no-csrf ] && ! grep -q login <<<"$r"; }
          signin() { ready || return 1; ok "$PW" || { echo "the Secret's password does not sign in"; return 1; }; }
          refused() {
            ready || return 1
            ! ok admin123 || { echo "upstream's admin123 signed in"; return 1; }
            ! ok wrong-password-1 || { echo "a wrong password signed in"; return 1; }
          }
          fwd signin
          fwd refused
          # the account (app.db on the PVC) survives a pod restart; the Secret survives an upgrade
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=calibre-web --wait=true
          kubectl rollout status deployment/rtest-calibre-web --timeout=300s
          fwd signin
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          [ "$(kubectl get secret rtest-calibre-web -o jsonpath='{.data.password}' | base64 -d)" = "$PW" ] || { echo "the password changed on upgrade"; exit 1; }
          kubectl rollout status deployment/rtest-calibre-web --timeout=300s
          fwd signin
          echo "calibre-web: init container set the password, it signs in through the CSRF form, admin123 and a wrong password refused, kept across a pod restart and an upgrade: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/calibre-web-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/calibre-web@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/calibre-web:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

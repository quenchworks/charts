name: release-elasticsearch

on:
  push:
    branches: [main]
    paths:
      - "quench/elasticsearch/**"
      - ".github/workflows/release-elasticsearch.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/elasticsearch
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-elasticsearch --timeout=420s
          # probe the REST API over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward rtest-elasticsearch-0 9200:9200 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT
          # wait for the port-forward to come up and the node to answer (CI is slower than local)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9200/ >/tmp/root.json 2>/dev/null && break
            sleep 5
          done
          # GET / reports the Elasticsearch version
          grep -q '"number" : "9.4.2"' /tmp/root.json
          # cluster health must be green or yellow (single-node yields yellow once replicas unassigned)
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=10s' >/tmp/health.json 2>/dev/null \
              && grep -qE '"status":"(green|yellow)"' /tmp/health.json && break
            sleep 5
          done
          grep -qE '"status":"(green|yellow)"' /tmp/health.json
          # index + read back a document and assert it round-trips
          curl -fsS -XPUT 'http://127.0.0.1:9200/gate/_doc/1?refresh=true' -H 'Content-Type: application/json' -d '{"k":"quench"}' >/dev/null
          curl -fsS 'http://127.0.0.1:9200/gate/_doc/1' | grep -q '"quench"'

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/elasticsearch-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/elasticsearch@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/elasticsearch:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

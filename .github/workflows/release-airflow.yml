name: release-airflow

on:
  push:
    branches: [main]
    paths:
      - "quench/airflow/**"
      - ".github/workflows/release-airflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/airflow
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # LocalExecutor + bundled PostgreSQL; --wait blocks until the db-migrate Job
          # completes and every component (api-server + scheduler + dag-processor +
          # triggerer) is Ready. Reaching Ready proves the migration ran, the
          # check-migrations init containers passed, and the api-server connected to PG.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-airflow-api-server --timeout=600s
          kubectl rollout status deployment/rtest-airflow-scheduler --timeout=600s
          # Smoke the health endpoint over a port-forward (the runtime image has no HTTP client).
          kubectl port-forward deployment/rtest-airflow-api-server 8080:8080 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # /api/v2/monitor/health returns HTTP 200 once the api-server is up.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v2/monitor/health)"
          echo "health endpoint returned HTTP ${code}"
          case "$code" in 200) : ;; *) echo "unexpected status"; exit 1 ;; esac

      - name: Diagnostics on install-gate failure
        if: failure()
        run: |
          # Runs ONLY when an earlier step failed (typically the install gate). Dumps
          # enough in-cluster state to root-cause a "Progress deadline exceeded" or
          # CrashLoop from the CI log alone. `|| true` keeps the step going.
          echo "::group::pods + events (all namespaces)"
          kubectl get pods,events -A -o wide || true
          echo "::endgroup::"
          echo "::group::jobs"
          kubectl get jobs -A -o wide || true
          echo "::endgroup::"
          # db-migrate Job pods: the first thing to fail if PostgreSQL never came up.
          for p in $(kubectl get pods -l "app.kubernetes.io/name=airflow,app.kubernetes.io/component=db-migrate" -o name 2>/dev/null); do
            echo "::group::logs ${p} (db-migrate)"
            kubectl logs "${p}" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
          # Airflow components: describe (probe/init/restart reasons) + current & previous logs.
          for w in api-server scheduler dag-processor triggerer worker; do
            dep="rtest-airflow-${w}"
            echo "::group::describe deployment/${dep}"
            kubectl describe "deployment/${dep}" || true
            echo "::endgroup::"
            for p in $(kubectl get pods -l "app.kubernetes.io/name=airflow,app.kubernetes.io/component=${w}" -o name 2>/dev/null); do
              echo "::group::describe ${p}"
              kubectl describe "${p}" || true
              echo "::endgroup::"
              echo "::group::logs ${p} (current)"
              kubectl logs "${p}" --all-containers --tail=200 || true
              echo "::endgroup::"
              echo "::group::logs ${p} (previous / crashed)"
              kubectl logs "${p}" --all-containers --previous --tail=200 || true
              echo "::endgroup::"
            done
          done
          # Bundled PostgreSQL: if it never went Ready, airflow cannot migrate or connect.
          echo "::group::describe pod/rtest-postgresql-0"
          kubectl describe pod/rtest-postgresql-0 || true
          echo "::endgroup::"
          echo "::group::logs pod/rtest-postgresql-0"
          kubectl logs pod/rtest-postgresql-0 --tail=100 || true
          echo "::endgroup::"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/airflow-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/airflow@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/airflow:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

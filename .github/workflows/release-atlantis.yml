name: release-atlantis

on:
  push:
    branches: [main]
    paths:
      - "quench/atlantis/**"
      - ".github/workflows/release-atlantis.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/atlantis
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-atlantis --timeout=300s
          # /healthz returns 200 once the server binds (server + webhook + UI port)
          kubectl port-forward statefulset/rtest-atlantis 4141:4141 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4141/healthz | grep -q 200
          # the bundled OpenTofu (NOT Terraform) is on PATH in the pod
          kubectl exec rtest-atlantis-0 -- tofu version | grep -q OpenTofu
          # nonroot uid 1001 + read-only rootfs
          test "$(kubectl get pod rtest-atlantis-0 -o jsonpath='{.spec.securityContext.runAsUser}')" = "1001"
          test "$(kubectl get pod rtest-atlantis-0 -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')" = "true"
          kubectl exec rtest-atlantis-0 -- id | grep -q 'uid=1001'

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/atlantis-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/atlantis@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/atlantis:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-tracing-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/tracing-stack/**"
      - ".github/workflows/release-tracing-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/tracing-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m

          # all components reached Ready (--wait already gates this, assert explicitly)
          kubectl rollout status statefulset/rtest-tempo          --timeout=300s
          kubectl rollout status statefulset/rtest-grafana        --timeout=300s
          kubectl rollout status deployment/rtest-otel-collector  --timeout=300s

          # INTEGRATION ASSERT 1: Tempo is ready. /ready returns 200 once the
          # single-binary has started all components.
          kubectl port-forward svc/rtest-tempo 3200:3200 >/tmp/tempo-pf.log 2>&1 &
          tpf=$!; trap 'kill $tpf 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3200/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "Tempo /ready never returned 200"; kubectl logs statefulset/rtest-tempo --tail=50 || true; exit 1; }
          echo "Tempo /ready: 200"

          # INTEGRATION ASSERT 2: the otel-collector pod is Ready and its OTLP/metrics
          # are live. The collector exposes its own Prometheus metrics on :8888; a 200
          # there proves the process is up with its pipelines loaded.
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=otel-collector,app.kubernetes.io/instance=rtest --timeout=300s
          kubectl port-forward svc/rtest-otel-collector 8888:8888 >/tmp/otel-pf.log 2>&1 &
          opf=$!; trap 'kill $tpf $opf 2>/dev/null || true' EXIT
          ometrics=""
          for i in $(seq 1 24); do
            if curl -fsS "http://127.0.0.1:8888/metrics" >/dev/null 2>&1; then ometrics=1; break; fi
            sleep 5
          done
          test -n "$ometrics" || { echo "otel-collector :8888/metrics never returned 200"; kubectl logs deployment/rtest-otel-collector --tail=50 || true; exit 1; }
          echo "otel-collector :8888/metrics: 200"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/tracing-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/tracing-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/tracing-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

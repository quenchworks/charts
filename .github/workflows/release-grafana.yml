name: release-grafana

on:
  push:
    branches: [main]
    paths:
      - "quench/grafana/**"
      - ".github/workflows/release-grafana.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/grafana
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # pin actions to SHAs before going public (renovate)
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status statefulset/rtest-grafana --timeout=420s
          # probe the HTTP API over a port-forward (the runtime image has no HTTP client)
          kubectl port-forward rtest-grafana-0 3000:3000 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # /api/health returns 200 with database ok + the running version
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -q '"database": *"ok"' /tmp/health.json
          # Derive from Chart.yaml: a hardcoded version silently fails every bump
          # (grep -q prints nothing, so the step exits 1 after a healthy rollout and
          # looks like the app died). Same trap that stalled the elasticsearch chart.
          APPVER="$(grep '^appVersion:' "${CHART_DIR}/Chart.yaml" | head -1 | tr -d '\"' | awk '{print $2}')"
          echo "asserting Grafana version ${APPVER} (from Chart.yaml appVersion)"
          grep -q "\"version\": *\"${APPVER}\"" /tmp/health.json \
            || { echo "::error::/api/health did not report ${APPVER}"; cat /tmp/health.json; exit 1; }
          # exercise an authenticated endpoint with the admin creds from the Secret:
          # basic-auth GET /api/org must return the default org (asserts login works).
          USER="$(kubectl get secret rtest-grafana -o jsonpath='{.data.admin-user}' | base64 -d)"
          PASS="$(kubectl get secret rtest-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          test -n "$USER"; test -n "$PASS"
          curl -fsS -u "$USER:$PASS" http://127.0.0.1:3000/api/org | tee /tmp/org.json
          grep -q '"name"' /tmp/org.json

      - name: Diagnostics on install-gate failure
        if: failure()
        run: |
          # Runs ONLY when an earlier step failed (typically the install gate).
          # Dumps enough in-cluster state to root-cause a rollout timeout, CrashLoop,
          # or failed probe/assertion from the CI log alone. `|| true` keeps the step
          # going so we always get the full picture even if one call errors.
          echo "::group::pods + events (all namespaces)"
          kubectl get pods,events -A -o wide || true
          echo "::endgroup::"
          echo "::group::describe statefulset/rtest-grafana"
          kubectl describe statefulset/rtest-grafana || true
          echo "::endgroup::"
          for p in $(kubectl get pods -l app.kubernetes.io/name=grafana -o name 2>/dev/null); do
            echo "::group::describe ${p}"
            kubectl describe "${p}" || true
            echo "::endgroup::"
            echo "::group::logs ${p} (current)"
            kubectl logs "${p}" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::logs ${p} (previous / crashed)"
            kubectl logs "${p}" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/grafana-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"   # fail loudly rather than handing cosign an empty ref
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/grafana@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push. Register the ArtifactHub repo and set the ID."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/grafana:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-hydra

on:
  push:
    branches: [main]
    paths:
      - "quench/hydra/**"
      - ".github/workflows/release-hydra.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/hydra
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          trap 'kubectl get events --sort-by=.lastTimestamp | tail -40 || true' ERR
          # The image is pinned by digest and lives in a non-public GHCR
          # package, so give the pod credentials to pull the real, signed
          # artifact. A pre-created ServiceAccount carries the pull secret
          # from pod-creation time (patching a chart-created SA would not
          # affect the running pod).
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl create serviceaccount hydra-puller
          kubectl patch serviceaccount hydra-puller \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set serviceAccount.create=false --set serviceAccount.name=hydra-puller \
            --wait --timeout 8m
          kubectl rollout status deployment/rtest-hydra --timeout=300s
          # probe over a pod port-forward (the Admin API is not on the Service by
          # default, and the runtime image has no HTTP client of its own)
          pod="$(kubectl get pod -l "app.kubernetes.io/name=hydra,app.kubernetes.io/instance=rtest" -o jsonpath='{.items[0].metadata.name}')"
          kubectl port-forward "pod/${pod}" 4445:4445 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # /health/ready returns 200 once Hydra has migrated + connected to PostgreSQL
          curl -fsS http://127.0.0.1:4445/health/ready >/dev/null
          # public discovery document proves the public server is serving too
          kubectl port-forward "pod/${pod}" 4444:4444 >>/tmp/pf.log 2>&1 &
          pf2=$!; trap 'kill $pf $pf2' EXIT; sleep 5
          curl -fsS http://127.0.0.1:4444/.well-known/openid-configuration >/dev/null

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/hydra-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/hydra@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/hydra:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-frp

on:
  push:
    branches: [main]
    paths:
      - "quench/frp/**"
      - ".github/workflows/release-frp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/frp
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-frp --timeout=300s
          img="$(kubectl get deploy rtest-frp -o jsonpath='{.spec.template.spec.containers[0].image}')"
          # an in-cluster frpc (same image) exposes the frps dashboard back through frps on 6000
          frpc() {  # $1: extra TOML lines, $2: extra volume yaml for the CA
            kubectl delete pod/frpc configmap/frpc --ignore-not-found --wait >/dev/null
            kubectl create configmap frpc --from-literal=frpc.toml="$(printf '%s\n' \
              'serverAddr = "rtest-frp"' 'serverPort = 7000' 'auth.token = "quench-ci-frp-token"' "$1" \
              '[[proxies]]' 'name = "dash"' 'type = "tcp"' 'localIP = "rtest-frp"' 'localPort = 7500' 'remotePort = 6000')"
          printf '%s\n' "apiVersion: v1
          kind: Pod
          metadata: {name: frpc}
          spec:
            securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
            containers:
              - name: frpc
                image: $img
                command: [/usr/bin/frpc, -c, /conf/frpc.toml]
                securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                volumeMounts: [{name: conf, mountPath: /conf}$2]
            volumes: [{name: conf, configMap: {name: frpc}}${3:-}]" | sed 's/^          //' | kubectl apply -f - >/dev/null
            for _ in $(seq 1 60); do
              logs="$(kubectl logs frpc 2>/dev/null || true)"
              grep -q 'start proxy success' <<<"$logs" && return 0
              sleep 2
            done
            echo "frpc never started its proxy"; kubectl logs frpc || true; return 1
          }
          tunnel() {
            kubectl port-forward svc/rtest-frp 6000:6000 7500:7500 >/tmp/pf.log 2>&1 &
            pf=$!; sleep 5
            page="$(curl -fsSL -u admin:quench-ci-dash-pass http://127.0.0.1:6000/)"
            grep -qi '<html' <<<"$page" || { echo "no dashboard through the tunnel"; kill $pf; return 1; }
            info="$(curl -fsS -u admin:quench-ci-dash-pass http://127.0.0.1:7500/api/serverinfo)"
            jq -e '.clientCounts >= 1' <<<"$info" >/dev/null || { echo "serverinfo: $info"; kill $pf; return 1; }
            code="$(curl -s -o /dev/null -w '%{http_code}' -u admin:wrong http://127.0.0.1:7500/api/serverinfo)"
            kill $pf
            [ "$code" = 401 ] || { echo "wrong dashboard password got HTTP $code"; return 1; }
          }
          frpc ''
          tunnel
          echo "frps: client login, tcp proxy on Service port 6000, dashboard API, auth refusal: ok"
          # TLS forced on the control channel: frpc must verify the chart's certificate
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 8m
          kubectl rollout status deployment/rtest-frp --timeout=300s
          frpc "$(printf '%s\n' 'transport.tls.enable = true' 'transport.tls.trustedCaFile = "/tls/ca.crt"' 'transport.tls.serverName = "rtest-frp.default.svc"')" \
            ', {name: tls, mountPath: /tls}' ', {name: tls, secret: {secretName: rtest-frp-tls}}'
          tunnel
          echo "frps: TLS control channel verified against the chart CA: ok"
          # no crash-looping
          test "$(kubectl get pod -l app.kubernetes.io/name=frp -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}')" = "0"
          # an upgrade keeps a generated token (frpc clients stay logged in)
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set auth.token= --wait --timeout 8m
          before="$(kubectl get secret rtest-frp -o jsonpath='{.data.token}')"
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set auth.token= --wait --timeout 8m
          after="$(kubectl get secret rtest-frp -o jsonpath='{.data.token}')"
          [ -n "$before" ] && [ "$before" = "$after" ] || { echo "token changed on upgrade"; exit 1; }
          echo "frp: tunnel, dashboard, TLS, upgrade-stable token: ok"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/frp-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/frp@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/frp:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

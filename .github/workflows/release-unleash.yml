name: release-unleash

on:
  push:
    branches: [main]
    paths:
      - "quench/unleash/**"
      - ".github/workflows/release-unleash.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/unleash
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-unleash --timeout=300s
          test "$(kubectl get pvc -l app.kubernetes.io/instance=rtest -o jsonpath='{.items[0].status.phase}')" = Bound
          pf() { kubectl port-forward svc/rtest-unleash 4242:4242 >/dev/null 2>&1 & PF=$!
                 for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4242/health >/dev/null 2>&1 && return; sleep 1; done; return 1; }
          B=http://127.0.0.1:4242
          J=(-H 'Content-Type: application/json')
          pf
          curl -fsS "$B/health" | grep -q '"health":"GOOD"'
          # the admin from values signs in; a wrong password does not
          curl -fsS -c /tmp/c "${J[@]}" -d '{"username":"admin","password":"Quench-gate-Pw-1"}' "$B/auth/simple/login" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "${J[@]}" -d '{"username":"admin","password":"no"}' "$B/auth/simple/login")" -ge 400
          # a flag, switched on in development
          curl -fsS -b /tmp/c "${J[@]}" -d '{"name":"gate-flag","type":"release"}' "$B/api/admin/projects/default/features" >/dev/null
          curl -fsS -b /tmp/c "${J[@]}" -d '{"name":"flexibleRollout","parameters":{"rollout":"100","stickiness":"default","groupId":"gate-flag"}}' \
            "$B/api/admin/projects/default/features/gate-flag/environments/development/strategies" >/dev/null
          curl -fsS -b /tmp/c -X POST "$B/api/admin/projects/default/features/gate-flag/environments/development/on" >/dev/null
          # an application reads it through the client API with a client token
          tok="$(curl -fsS -b /tmp/c "${J[@]}" -d '{"tokenName":"gate","type":"client","environment":"development","projects":["*"]}' \
            "$B/api/admin/api-tokens" | sed -n 's/.*"secret":"\([^"]*\)".*/\1/p')"
          test -n "$tok"
          client() { curl -fsS -H "Authorization: $tok" "$B/api/client/features" | jq -e '.features[] | select(.name == "gate-flag") | .enabled == true' >/dev/null; }
          client
          kill $PF
          # all state is in PostgreSQL: recreate the Unleash pod and read the flag again
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=unleash --wait
          kubectl rollout status deployment/rtest-unleash --timeout=300s
          pf
          client
          kill $PF
          ! kubectl logs deployment/rtest-unleash | grep -E '"level":"(error|fatal)"|FATAL'
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/unleash-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/unleash@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/unleash:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

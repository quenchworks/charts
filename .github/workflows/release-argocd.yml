name: release-argocd

on:
  push:
    branches: [main]
    paths:
      - "quench/argocd/**"
      - ".github/workflows/release-argocd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/argocd
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --namespace argocd --create-namespace --wait --timeout 12m
          kubectl -n argocd rollout status deployment/rtest-argocd-server --timeout=300s
          kubectl -n argocd rollout status deployment/rtest-argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status statefulset/rtest-argocd-application-controller --timeout=300s
          kubectl -n argocd rollout status deployment/rtest-argocd-applicationset-controller --timeout=300s

          # --- real smoke checks, not a TCP probe ----------------------------
          # 1. all three CRDs were applied AND Established by the API server.
          #    `kubectl wait --for=condition=Established` fails on a CRD that was
          #    applied but rejected, which a port probe would never notice.
          for crd in applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io ; do
            kubectl wait --for=condition=Established "crd/${crd}" --timeout=120s
          done

          # 2. the API server answers on its OWN health endpoint, serves the API,
          #    and -- the check that matters most for this image -- serves the REAL
          #    embedded React console. A build against the untouched source tree
          #    compiles fine and 404s every UI route; only fetching / and finding
          #    the SPA proves the yarn/webpack stage actually ran.
          kubectl -n argocd port-forward svc/rtest-argocd-server 8080:8080 >/tmp/pf-server.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT; sleep 5
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          ver="$(curl -fsS http://127.0.0.1:8080/api/version)"
          echo "api/version: $ver"
          echo "$ver" | jq -e --arg v "v$(helm show chart "${CHART_DIR}" | awk '/^appVersion:/{gsub(/"/,"");print $2}')" \
            '.Version == $v' >/dev/null \
            || { echo "api/version does not match the chart appVersion"; exit 1; }
          index="$(curl -fsS http://127.0.0.1:8080/)"
          echo "$index" | grep -qi '<title>Argo CD</title>' \
            || { echo "the web console is NOT being served (no SPA index.html)"; \
                 echo "$index" | head -20; exit 1; }
          # the SPA loads hashed webpack chunks; a stub tree would have none.
          bundle="$(echo "$index" | grep -oE 'src="[^"]*\.js"' | head -1 | cut -d'"' -f2)"
          test -n "$bundle" || { echo "index.html references no js bundle"; exit 1; }
          # Argo CD 3.4's index.html references its chunks RELATIVELY (src="main.<hash>.js",
          # no leading slash), so concatenating it straight onto the authority produced
          # http://127.0.0.1:8080main.<hash>.js and curl read "8080main" as the port:
          #   curl: (3) URL rejected: Port number was not a decimal number
          # Strip any leading slash and add exactly one, so both forms work.
          bundle="/${bundle#/}"
          curl -fsS "http://127.0.0.1:8080${bundle}" -o /tmp/bundle.js
          [ "$(stat -c%s /tmp/bundle.js)" -gt 100000 ] \
            || { echo "the served js bundle is implausibly small"; exit 1; }
          echo "  console served: index.html + ${bundle} ($(stat -c%s /tmp/bundle.js) bytes)"

          # 3. the repo server really has the toolbelt it needs to render manifests.
          #    Missing/broken helm or kustomize means every Application fails to
          #    render at sync time, long after this gate would have passed.
          repo_pod="$(kubectl -n argocd get pod -l app.kubernetes.io/component=repo-server \
                       -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n argocd exec "$repo_pod" -- /usr/bin/helm version --short
          kubectl -n argocd exec "$repo_pod" -- /usr/bin/kustomize version
          kubectl -n argocd exec "$repo_pod" -- /usr/bin/git --version
          kubectl -n argocd exec "$repo_pod" -- /usr/bin/gpg-wrapper.sh --version >/dev/null

          # 4. the applicationset controller actually RECONCILES. A list generator
          #    needs no git and no network, so this is deterministic: if the
          #    controller is up and its RBAC is right, the Application appears.
          kubectl apply -f - <<'EOF'
          apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: gate
            namespace: argocd
          spec:
            sourceRepos: ["*"]
            destinations:
              - namespace: "*"
                server: "*"
            clusterResourceWhitelist:
              - group: "*"
                kind: "*"
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: ApplicationSet
          metadata:
            name: gate-set
            namespace: argocd
          spec:
            generators:
              - list:
                  elements:
                    - name: gate-app
            template:
              metadata:
                name: '{{name}}'
              spec:
                project: gate
                source:
                  repoURL: https://github.com/argoproj/argocd-example-apps.git
                  targetRevision: HEAD
                  path: guestbook
                destination:
                  server: https://kubernetes.default.svc
                  namespace: default
          EOF
          for i in $(seq 1 60); do
            kubectl -n argocd get application gate-app >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "applicationset controller never generated the Application"; \
              kubectl -n argocd describe applicationset gate-set; \
              kubectl -n argocd logs deployment/rtest-argocd-applicationset-controller --tail=200; exit 1; }
            sleep 2
          done
          echo "  applicationset -> Application gate-app generated"

          # 5. the application controller reconciled that Application. Its own
          #    /healthz plus the per-app metric it only emits for Applications it
          #    has actually loaded -- a dead or RBAC-starved controller passes a
          #    readiness probe but never publishes argocd_app_info.
          ctrl_pod="$(kubectl -n argocd get pod -l app.kubernetes.io/component=application-controller \
                       -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n argocd port-forward "pod/${ctrl_pod}" 8082:8082 >/tmp/pf-ctrl.log 2>&1 &
          pfc=$!; trap 'kill $pf $pfc 2>/dev/null || true' EXIT; sleep 5
          # Here-string, not a pipe: grep -q exits on the first match, curl takes
          # SIGPIPE on a large /metrics body, and pipefail fails the found line.
          curl -fsS http://127.0.0.1:8082/healthz >/dev/null
          for i in $(seq 1 60); do
            grep -q 'argocd_app_info{.*name="gate-app"' <<<"$(curl -fsS http://127.0.0.1:8082/metrics)" && break
            [ "$i" = 60 ] && { echo "application controller never reported argocd_app_info for gate-app"; \
              kubectl -n argocd logs "$ctrl_pod" --tail=200; exit 1; }
            sleep 2
          done
          echo "  application controller reconciled gate-app"

          # 6. Redis came from the quench/redis subchart and Argo CD is authenticated
          #    against it. An unauthenticated or unreachable Redis leaves the API
          #    server's cache endpoints erroring while /healthz still returns 200.
          kubectl -n argocd get secret rtest-redis -o jsonpath='{.data.redis-password}' \
            | base64 -d | grep -q . || { echo "no redis password secret from the subchart"; exit 1; }
          #    A refused dial at startup is a race (the controller can beat Redis to
          #    Ready) and says nothing, so the proof is that the controller's cache
          #    reached Redis. Auth errors never clear on their own and stay fatal.
          clog="$(kubectl -n argocd logs "$ctrl_pod" --tail=500)"
          grep -qiE 'NOAUTH|WRONGPASS' <<<"$clog" \
            && { echo "controller is not authenticated against redis"; exit 1; }
          rpw="$(kubectl -n argocd get secret rtest-redis -o jsonpath='{.data.redis-password}' | base64 -d)"
          keys=0
          for i in $(seq 1 30); do
            keys="$(kubectl -n argocd exec rtest-redis-0 -- redis-cli --no-auth-warning -a "$rpw" DBSIZE 2>/dev/null | tr -dc 0-9)"
            [ "${keys:-0}" -gt 0 ] && break
            sleep 2
          done
          [ "${keys:-0}" -gt 0 ] || { echo "controller never wrote its cache to redis"; tail -40 <<<"$clog"; exit 1; }
          echo "  controller cache in redis: $keys keys"

          echo "install gate OK: CRDs Established, console served, repo-server toolbelt present, ApplicationSet -> Application reconciled"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/argocd-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/argocd@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/argocd:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

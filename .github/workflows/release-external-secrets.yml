name: release-external-secrets

on:
  push:
    branches: [main]
    paths:
      - "quench/external-secrets/**"
      - ".github/workflows/release-external-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/external-secrets
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # CRDs install from crds/ before the templates; all three deployments
          # (controller, webhook, cert-controller) must reach Ready under --wait.
          helm install rtest "${CHART_DIR}" -n external-secrets --create-namespace \
            -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl rollout status deployment/rtest-external-secrets-controller -n external-secrets --timeout=300s
          kubectl rollout status deployment/rtest-external-secrets-webhook -n external-secrets --timeout=300s
          kubectl rollout status deployment/rtest-external-secrets-cert-controller -n external-secrets --timeout=300s
          # Smoke test: a fake-provider SecretStore + ExternalSecret must produce a
          # target Secret. This exercises the controller AND the webhook admission
          # path (the SecretStore create is validated by the webhook, whose CA was
          # injected by the cert-controller).
          kubectl apply -n external-secrets -f - <<'EOF'
          apiVersion: external-secrets.io/v1
          kind: SecretStore
          metadata: { name: fake }
          spec: { provider: { fake: { data: [{ key: "/example", value: "hello" }] } } }
          ---
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata: { name: example }
          spec:
            refreshInterval: 1h
            secretStoreRef: { name: fake, kind: SecretStore }
            target: { name: example-secret }
            data: [{ secretKey: greeting, remoteRef: { key: "/example" } }]
          EOF
          for i in $(seq 1 30); do
            if kubectl get secret -n external-secrets example-secret >/dev/null 2>&1; then break; fi
            sleep 5
          done
          val="$(kubectl get secret -n external-secrets example-secret -o jsonpath='{.data.greeting}' | base64 -d)"
          test "$val" = "hello"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/external-secrets-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/external-secrets@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/external-secrets:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

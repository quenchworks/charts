name: release-pentagi

on:
  push:
    branches: [main]
    paths:
      - "quench/pentagi/**"
      - ".github/workflows/release-pentagi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/pentagi
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-pentagi --timeout=600s
          fwd() { kubectl port-forward svc/rtest-pentagi 8443:8443 >/tmp/pf.log 2>&1 & local pf=$!; sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc; }
          C=""; B=http://127.0.0.1:8443; PW=quench-ci-pentagi-admin
          up() { for _ in $(seq 1 90); do [ "$(curl -s $C -o /dev/null -w '%{http_code}' "$B/")" = 200 ] && return 0; sleep 2; done; echo "/ never answered"; return 1; }
          login() { rm -f /tmp/jar; curl -s $C -c /tmp/jar -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"mail\":\"admin@pentagi.com\",\"password\":\"$1\"}" "$B/api/v1/auth/login"; }
          signin() {
            up || return 1
            [ "$(login admin)" != 200 ] || { echo "the seeded password still works"; return 1; }
            [ "$(login wrong-password-1)" != 200 ] || { echo "a wrong password was accepted"; return 1; }
            [ "$(login "$PW")" = 200 ] || { echo "the generated password was refused: $(cat /tmp/body)"; return 1; }
            curl -s $C -b /tmp/jar "$B/api/v1/info" > /tmp/info
            grep -q '"password_change_required":false' /tmp/info || { echo "admin still has to change its password: $(cat /tmp/info)"; return 1; }
          }
          fwd signin
          # the agents' Docker API: a container pulled and run through the sidecar's service
          kubectl exec deploy/rtest-pentagi -c docker -- podman --remote --url tcp://127.0.0.1:2375 run --rm docker.io/library/busybox:1.37 echo nested-ok | tee /tmp/nested
          grep -q nested-ok /tmp/nested
          # the password (PostgreSQL) survives a pod restart, and an upgrade does not reset it
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=pentagi --wait=true
          kubectl rollout status deployment/rtest-pentagi --timeout=600s
          fwd signin
          # native TLS on the same port with the Helm-made CA, plain HTTP refused
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 15m
          kubectl rollout status deployment/rtest-pentagi --timeout=600s
          kubectl get secret rtest-pentagi-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/pg-ca.crt
          tlsgate() {
            signin || return 1
            ! curl -fsS -o /dev/null http://127.0.0.1:8443/ 2>/dev/null || { echo "plain HTTP still answers with tls.enabled"; return 1; }
          }
          C="--cacert /tmp/pg-ca.crt --resolve rtest-pentagi:8443:127.0.0.1"; B=https://rtest-pentagi:8443
          fwd tlsgate
          echo "pentagi: seeded admin password replaced and refused, generated one signs in without a change prompt, a container ran through the Docker API sidecar, kept across a pod restart and an upgrade, native TLS with plain HTTP refused: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/pentagi-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/pentagi@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/pentagi:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

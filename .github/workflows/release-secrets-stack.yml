name: release-secrets-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/secrets-stack/**"
      - ".github/workflows/release-secrets-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/secrets-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/secrets-keycloak --timeout=600s
          kubectl rollout status statefulset/rtest-openbao --timeout=600s
          kubectl port-forward svc/rtest-openbao 8200:8200 >/tmp/pf-bao.log 2>&1 &
          p1=$!
          kubectl port-forward svc/secrets-keycloak 8080:8080 >/tmp/pf-kc.log 2>&1 &
          p2=$!; trap 'kill $p1 $p2 2>/dev/null || true' EXIT; sleep 5
          B=http://127.0.0.1:8200/v1
          sec() { kubectl get secret secrets-stack-openbao -o jsonpath="{.data.$1}" | base64 -d; }

          # 1. self-initialized and auto-unsealed
          st="$(curl -fsS $B/sys/seal-status)"; echo "seal-status: $st"
          jq -e '.initialized and (.sealed|not) and .type=="static"' <<<"$st" >/dev/null

          # 2. a Keycloak client-credentials token logs in through auth/jwt
          tok="$(curl -fsS -d grant_type=client_credentials -u "openbao:$(sec client-secret)" \
                  http://127.0.0.1:8080/realms/secrets/protocol/openid-connect/token | jq -r .access_token)"
          login="$(curl -fsS -X POST -d "{\"role\":\"machine\",\"jwt\":\"$tok\"}" $B/auth/jwt/login)"
          T="$(jq -r .auth.client_token <<<"$login")"
          jq -e '.auth.policies|index("secrets-user")' <<<"$login" >/dev/null
          echo "  jwt login: $(jq -c .auth.policies <<<"$login")"

          # 3. the policy: write + read under secret/shared, denied elsewhere
          curl -fsS -H "X-Vault-Token: $T" -X POST -d '{"data":{"gate":"ok"}}' $B/secret/data/shared/gate >/dev/null
          test "$(curl -fsS -H "X-Vault-Token: $T" $B/secret/data/shared/gate | jq -r .data.data.gate)" = ok
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $T" -X POST -d '{"data":{"x":1}}' $B/secret/data/private)"
          test "$code" = 403 || { echo "a write outside secret/shared was not denied (HTTP $code)"; exit 1; }

          # 4. OIDC for people: OpenBao hands out a Keycloak authorize URL
          url="$(curl -fsS -X POST -d '{"role":"user","redirect_uri":"http://localhost:8250/oidc/callback"}' $B/auth/oidc/oidc/auth_url | jq -r .data.auth_url)"
          grep -q '/realms/secrets/protocol/openid-connect/auth?client_id=openbao' <<<"$url" \
            || { echo "no Keycloak authorize URL: $url"; exit 1; }

          # 5. break-glass admin
          curl -fsS -X POST -d "{\"password\":\"$(sec admin-password)\"}" $B/auth/userpass/login/admin \
            | jq -e '.auth.policies|index("admin")' >/dev/null

          # 6. a restarted pod unseals itself and still has the data
          kill $p1; kubectl delete pod rtest-openbao-0 --wait
          kubectl wait pod/rtest-openbao-0 --for=condition=Ready --timeout=300s
          kubectl port-forward svc/rtest-openbao 8200:8200 >/tmp/pf-bao.log 2>&1 &
          p1=$!; sleep 5
          jq -e '.sealed|not' <<<"$(curl -fsS $B/sys/seal-status)" >/dev/null
          tok="$(curl -fsS -d grant_type=client_credentials -u "openbao:$(sec client-secret)" \
                  http://127.0.0.1:8080/realms/secrets/protocol/openid-connect/token | jq -r .access_token)"
          T="$(curl -fsS -X POST -d "{\"role\":\"machine\",\"jwt\":\"$tok\"}" $B/auth/jwt/login | jq -r .auth.client_token)"
          test "$(curl -fsS -H "X-Vault-Token: $T" $B/secret/data/shared/gate | jq -r .data.data.gate)" = ok
          echo "install gate OK: self-init + static unseal, JWT and OIDC through Keycloak, policy scope, admin, unseal after restart"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/secrets-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/secrets-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/secrets-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

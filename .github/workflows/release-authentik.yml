name: release-authentik

on:
  push:
    branches: [main]
    paths:
      - "quench/authentik/**"
      - ".github/workflows/release-authentik.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/authentik
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # Bundled PostgreSQL + valkey; --wait blocks until server + worker + subcharts
          # are Ready. Reaching Ready proves the worker migrated the DB and the server
          # connected to BOTH PostgreSQL and Redis.
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 12m
          kubectl rollout status deployment/rtest-authentik-server --timeout=600s
          kubectl rollout status deployment/rtest-authentik-worker --timeout=600s
          # probe over a port-forward (the distroless runtime image has no HTTP client)
          kubectl port-forward deployment/rtest-authentik-server 9000:9000 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          # /-/health/ready/ returns 200 (or 204) once the server is up, the DB is
          # migrated/reachable, and Redis is connected. Accept 2xx.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/-/health/ready/)"
          echo "readiness probe returned HTTP ${code}"
          case "$code" in 200|204) : ;; *) echo "unexpected status"; exit 1 ;; esac

      - name: Diagnostics on install-gate failure
        if: failure()
        run: |
          # Runs ONLY when an earlier step failed (typically the install gate).
          # Dumps enough in-cluster state to root-cause a "Progress deadline exceeded"
          # or CrashLoop from the CI log alone, without a local repro. `|| true` keeps
          # the step going so we always get the full picture even if one call errors.
          echo "::group::pods + events (all namespaces)"
          kubectl get pods,events -A -o wide || true
          echo "::endgroup::"
          # Authentik server + worker: describe (probe/restart/mount reasons) and logs
          # for both the current and the crashed (previous) container.
          for w in server worker; do
            dep="rtest-authentik-${w}"
            echo "::group::describe deployment/${dep}"
            kubectl describe "deployment/${dep}" || true
            echo "::endgroup::"
            for p in $(kubectl get pods -l "app.kubernetes.io/name=authentik,app.kubernetes.io/component=${w}" -o name 2>/dev/null); do
              echo "::group::describe ${p}"
              kubectl describe "${p}" || true
              echo "::endgroup::"
              echo "::group::logs ${p} (current)"
              kubectl logs "${p}" --all-containers --tail=200 || true
              echo "::endgroup::"
              echo "::group::logs ${p} (previous / crashed)"
              kubectl logs "${p}" --all-containers --previous --tail=200 || true
              echo "::endgroup::"
            done
          done
          # Bundled backends: if PostgreSQL or valkey never went Ready, authentik cannot
          # connect, so surface their describe + logs too.
          for b in rtest-postgresql-0 rtest-valkey-0; do
            echo "::group::describe pod/${b}"
            kubectl describe "pod/${b}" || true
            echo "::endgroup::"
            echo "::group::logs pod/${b}"
            kubectl logs "pod/${b}" --tail=100 || true
            echo "::endgroup::"
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/authentik-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/authentik@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/authentik:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-kubescape-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/kubescape-operator/**"
      - ".github/workflows/release-kubescape-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/kubescape-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -n kubescape --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          imgs="$(kubectl -n kubescape get pods -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' | sort -u)"
          echo "$imgs"
          ! grep -v '^ghcr.io/quenchworks/images/[a-z-]*@sha256:' <<<"$imgs"
          kubectl wait --for=condition=Available apiservice/v1beta1.spdx.softwarecomposition.kubescape.io --timeout=300s
          # A workload to scan: its image gets a vulnerability manifest, its Deployment a
          # configuration scan summary. The operator scans at startup and on new pods.
          kubectl create deployment demo --image=ghcr.io/quenchworks/images/busybox:1.38.0 -- sleep 3600
          kubectl rollout status deployment/demo --timeout=180s
          for kind in workloadconfigurationscansummaries vulnerabilitymanifests; do
            n=0
            for i in $(seq 1 90); do
              n="$(kubectl get "$kind" -A --no-headers 2>/dev/null | wc -l)"
              [ "$n" -gt 0 ] && break
              sleep 10
            done
            echo "$kind: $n"
            [ "$n" -gt 0 ] || { echo "no $kind after 15 minutes"; exit 1; }
          done
          kubectl get workloadconfigurationscansummaries -A | head -20
          kubectl get vulnerabilitymanifestsummaries -A | head -20
          echo "Kubescape: storage API available, configuration scan and vulnerability manifest produced: ok"

      # A failed install gate otherwise reports only a timeout; keep every component's side of it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get apiservice v1beta1.spdx.softwarecomposition.kubescape.io -o yaml || true
          kubectl -n kubescape describe pods || true
          for d in operator kubescape kubevuln storage; do
            echo "=== $d"; kubectl -n kubescape logs deployment/$d --all-containers --tail=300 || true
          done
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true

      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/kubescape-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/kubescape-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/kubescape-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

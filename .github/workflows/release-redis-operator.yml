name: release-redis-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/redis-operator/**"
      - ".github/workflows/release-redis-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/redis-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          op="$(awk '/^image:/{f=1} f&&/repository:/{r=$2} f&&/digest:/{gsub(/"/,"",$2); print r"@"$2; exit}' "${CHART_DIR}/values.yaml")"

          # --- PROVE THE OPERATOR RUNS A REPLICATED REDIS THAT SERVES COMMANDS. ---
          kubectl get crd redisreplications.redis.redis.opstreelabs.in >/dev/null

          # 1. A primary and a replica on the official redis image. The chart turns on
          #    GenerateConfigInInitContainer, so our operator image writes redis.conf as the init
          #    container; our redis-exporter image runs as the metrics sidecar.
          kubectl apply -f - <<'YAML'
          apiVersion: redis.redis.opstreelabs.in/v1beta2
          kind: RedisReplication
          metadata: { name: gate }
          spec:
            clusterSize: 2
            kubernetesConfig:
              image: redis:8.2
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
            redisExporter:
              enabled: true
              image: ghcr.io/quenchworks/images/redis-exporter:1.97.0
            storage:
              volumeClaimTemplate:
                spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
          YAML

          # 2. Both pods ready, one labelled master and one slave.
          for i in $(seq 1 60); do
            master="$(kubectl get pod -l app=gate,redis-role=master -o jsonpath='{.items[*].metadata.name}')"
            replica="$(kubectl get pod -l app=gate,redis-role=slave -o jsonpath='{.items[*].metadata.name}')"
            [ -n "$master" ] && [ -n "$replica" ] && break; sleep 5
          done
          test -n "$master" && test -n "$replica" || { kubectl get pods --show-labels; kubectl get redisreplication gate -o yaml | tail -20; echo "FAIL: no master/replica pair"; exit 1; }
          kubectl wait --for=condition=ready pod "$master" "$replica" --timeout=300s
          init="$(kubectl get pod "$master" -o jsonpath='{.spec.initContainers[?(@.name=="init-config")].image}')"
          test "$init" = "$op" || { echo "FAIL: init-config runs '$init', not $op"; exit 1; }
          echo "RedisReplication up: master $master, replica $replica; init-config on our operator image"

          # 3. A write on the primary is read back from the replica.
          kubectl run gate-client --image=redis:8.2-alpine --restart=Never --command -- sleep 900
          kubectl wait --for=condition=ready pod/gate-client --timeout=300s
          cli() { kubectl exec gate-client -- redis-cli "$@"; }
          mip="$(kubectl get pod "$master" -o jsonpath='{.status.podIP}')"
          rip="$(kubectl get pod "$replica" -o jsonpath='{.status.podIP}')"
          test "$(cli -h "$mip" SET gate-key quench-works)" = OK
          for i in $(seq 1 20); do [ "$(cli -h "$rip" GET gate-key)" = quench-works ] && break; sleep 2; done
          test "$(cli -h "$rip" GET gate-key)" = quench-works || { echo "FAIL: the replica does not have the key"; exit 1; }
          echo "SET on the primary, GET from the replica: replication works"

          # 4. The exporter sidecar reports the server up.
          m="$(kubectl exec gate-client -- sh -c "wget -qO- http://$mip:9121/metrics" 2>/dev/null || true)"
          grep -q '^redis_up 1' <<<"$m" || { echo "FAIL: redis_exporter does not report redis_up 1"; exit 1; }
          echo "redis-exporter sidecar reports redis_up 1"

          restarts="$(kubectl get pods -l app.kubernetes.io/name=redis-operator -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | tr -d '\n' | tr -s ' ')"
          case "$restarts" in *[1-9]*) kubectl get pods; echo "FAIL: the operator restarted"; exit 1 ;; esac

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/redis-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/redis-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/redis-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

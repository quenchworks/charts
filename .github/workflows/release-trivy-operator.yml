name: release-trivy-operator

on:
  push:
    branches: [main]
    paths:
      - "quench/trivy-operator/**"
      - ".github/workflows/release-trivy-operator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/trivy-operator
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -n trivy-system --create-namespace -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 8m
          kubectl -n trivy-system rollout status deployment/rtest-trivy-operator --timeout=300s
          # a small workload in the scanned namespace: the QuenchWorks distribution image
          kubectl create namespace gate
          kubectl -n gate create deployment registry --image=ghcr.io/quenchworks/images/distribution:3.1.2
          kubectl -n gate rollout status deployment/registry --timeout=300s
          # the first scan downloads the vulnerability DB, so allow several minutes
          for i in $(seq 1 90); do
            v=$(kubectl -n gate get vulnerabilityreports -o name 2>/dev/null | wc -l)
            c=$(kubectl -n gate get configauditreports -o name 2>/dev/null | wc -l)
            echo "vulnerabilityreports=$v configauditreports=$c"
            [ "$v" -ge 1 ] && [ "$c" -ge 1 ] && break
            sleep 10
          done
          kubectl -n gate get vulnerabilityreports,configauditreports
          test "$(kubectl -n gate get vulnerabilityreports -o name | wc -l)" -ge 1
          test "$(kubectl -n gate get configauditreports -o name | wc -l)" -ge 1
          # the report was made by the QuenchWorks trivy scanner
          kubectl -n gate get vulnerabilityreports -o jsonpath='{.items[0].report.scanner.name} {.items[0].report.scanner.version}{"\n"}' | tee /tmp/scanner.txt
          grep -q '^Trivy 0.74.0' /tmp/scanner.txt
      - name: Dump the operator on failure
        if: failure()
        run: |
          kubectl -n trivy-system get pods,jobs || true
          kubectl -n trivy-system logs deployment/rtest-trivy-operator --tail=200 || true
          for p in $(kubectl -n trivy-system get pods -o name | grep -v rtest-trivy-operator); do kubectl -n trivy-system logs "$p" --all-containers --tail=80 || true; done
      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/trivy-operator-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/trivy-operator@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/trivy-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

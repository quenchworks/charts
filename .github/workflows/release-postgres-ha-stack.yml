name: release-postgres-ha-stack

on:
  push:
    branches: [main]
    paths:
      - "quench/postgres-ha-stack/**"
      - ".github/workflows/release-postgres-ha-stack.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/postgres-ha-stack
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status statefulset/postgres-ha --timeout=600s
          ns="$(kubectl config view --minify -o jsonpath='{..namespace}')"; ns="${ns:-default}"
          pw="$(kubectl get secret postgres-ha-auth -o jsonpath='{.data.postgres-password}' | base64 -d)"
          leader() { kubectl get pod -l app.kubernetes.io/name=postgresql,role=master -o jsonpath='{.items[*].metadata.name}'; }
          # psql from a cluster pod (every node image carries it). EX is set to a
          # non-leader below, so the pod the failover deletes is never the client.
          EX=postgres-ha-0
          sql() { kubectl exec "$EX" -c postgresql -- env PGPASSWORD="$pw" psql -X -tA -h "$1" -p "$2" -U postgres -d appdb -c "$3"; }

          # 1. Patroni elected exactly one leader and a replica streams from it.
          for i in $(seq 1 60); do [ -n "$(leader)" ] && break; sleep 5; done
          l1="$(leader)"; echo "leader: $l1"
          [ "$(wc -w <<<"$l1")" = 1 ] || { echo "expected one leader, got '$l1'"; exit 1; }
          kubectl exec postgres-ha-0 -c postgresql -- patronictl list
          kubectl exec postgres-ha-0 -c postgresql -- patronictl list | grep -q streaming
          EX="$(kubectl get pod -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -vx "$l1" | head -1)"
          echo "psql client pod: $EX"

          # 2. Writes go through PgBouncer to the leader; a replica has them.
          sql postgres-ha-pgbouncer 6432 "CREATE TABLE gate (n int); INSERT INTO gate VALUES (1);"
          got=""
          for i in $(seq 1 30); do
            got="$(sql postgres-ha-replica 5432 "SELECT count(*) FROM gate" 2>/dev/null || true)"
            [ "$got" = "1" ] && break; sleep 2
          done
          [ "$got" = "1" ] || { echo "the replica never received the write (got '$got')"; exit 1; }
          echo "  pgbouncer -> leader write, replica read: ok"

          # 3. Failover: kill the leader. Patroni must promote another node, and
          #    PgBouncer must reach it through postgres-ha-primary.
          kubectl delete pod "$l1" --wait=false
          l2=""
          for i in $(seq 1 60); do
            l2="$(leader)"
            [ -n "$l2" ] && [ "$l2" != "$l1" ] && break; sleep 5
          done
          [ -n "$l2" ] && [ "$l2" != "$l1" ] || { echo "no new leader after deleting $l1"; exit 1; }
          echo "  failover: $l1 -> $l2"
          ok=""
          for i in $(seq 1 30); do
            sql postgres-ha-pgbouncer 6432 "INSERT INTO gate VALUES (2)" >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          [ -n "$ok" ] || { echo "PgBouncer could not write to the new leader"; exit 1; }
          test "$(sql postgres-ha-pgbouncer 6432 "SELECT count(*) FROM gate")" = 2
          echo "  write after failover through pgbouncer: ok"
          kubectl rollout status statefulset/postgres-ha --timeout=600s

          # 4. Prometheus discovered the exporter and it reports the (new) leader up.
          kubectl port-forward svc/rtest-prometheus 9090:9090 >/tmp/pf-prom.log 2>&1 &
          ppf=$!; trap 'kill $ppf 2>/dev/null || true' EXIT; sleep 5
          q() { curl -fsS --get http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$1" | jq -r '.data.result[0].value[1] // empty'; }
          up=""
          for i in $(seq 1 40); do
            up="$(q "pg_up{job=\"postgresql\",namespace=\"$ns\"}")"
            [ "$up" = "1" ] && break; sleep 5
          done
          [ "$up" = "1" ] || { echo "pg_up never reached 1"; \
            curl -fsS http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[]|{job:.labels.job,health,lastError}'; exit 1; }
          rec="$(q "pg_stat_database_xact_commit{job=\"postgresql\",datname=\"appdb\"}")"
          [ -n "$rec" ] || { echo "no per-database stats for appdb"; exit 1; }
          echo "  prometheus: pg_up=1, appdb commits=$rec"

          # 5. Grafana: provisioned dashboard, and a query through its datasource.
          kubectl port-forward svc/rtest-grafana 3000:3000 >/tmp/pf-graf.log 2>&1 &
          gpf=$!; trap 'kill $ppf $gpf 2>/dev/null || true' EXIT; sleep 5
          g() { curl -fsS -u admin:ci-postgres-ha-2026 "http://127.0.0.1:3000$1"; }
          for i in $(seq 1 30); do g /api/health >/dev/null 2>&1 && break; sleep 3; done
          dash=""
          for i in $(seq 1 20); do
            dash="$(g '/api/search?type=dash-db' | jq -r '.[]|select(.uid=="postgres-ha-stack-overview")|.title')"
            [ -n "$dash" ] && break; sleep 3
          done
          [ -n "$dash" ] || { echo "the dashboard was not provisioned"; exit 1; }
          via="$(g "/api/datasources/proxy/uid/prometheus/api/v1/query?query=pg_up" | jq -r '.data.result[0].value[1] // empty')"
          [ "$via" = "1" ] || { echo "Grafana could not query Prometheus through the datasource"; exit 1; }
          echo "install gate OK: leader $l1 -> $l2 failover, pgbouncer writes before and after, replica streaming, pg_up=1, dashboard '$dash'"

      # A failed install gate otherwise reports only "Progress deadline exceeded",
      # which says a pod never became ready and nothing about why: helm --wait
      # aborts before the smoke checks, so no logs are kept. Per container, not
      # --all-containers, because a chatty sidecar spends the whole tail; and a
      # large tail, because a crash floods the log with every open request failing
      # at once and buries the error that triggered it.
      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/postgres-ha-stack-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/postgres-ha-stack@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/postgres-ha-stack:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-coraza-spoa

on:
  push:
    branches: [main]
    paths:
      - "quench/coraza-spoa/**"
      - ".github/workflows/release-coraza-spoa.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/coraza-spoa
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          kubectl rollout status deployment/rtest-coraza-spoa --timeout=300s
          # the catalog's HAProxy in front of nginx, wired to the agent as upstream's example
          kubectl create deployment web --image=ghcr.io/quenchworks/images/nginx:1.30.8 --port=8080
          kubectl expose deployment web --port=80 --target-port=8080
          kubectl create configmap hp --from-file=haproxy.cfg=/dev/stdin <<'CFG'
          global
            log stdout format raw local0
          defaults
            log global
            timeout client 30s
            timeout server 30s
            timeout connect 5s
          frontend web
            mode http
            bind :8080
            http-request set-var(txn.coraza.app) str(default)
            filter spoe engine coraza config /etc/haproxy/coraza.cfg
            http-request send-spoe-group coraza coraza-req
            http-request deny deny_status 403 if { var(txn.coraza.action) -m str deny }
            http-request deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }
            default_backend app
          backend app
            mode http
            server app web.default.svc.cluster.local:80
          backend coraza-spoa
            mode tcp
            server spoa rtest-coraza-spoa.default.svc.cluster.local:9000
          CFG
          kubectl create configmap hp-spoe --from-file=coraza.cfg=/dev/stdin <<'CFG'
          [coraza]
          spoe-agent coraza-agent
            groups coraza-req
            option var-prefix coraza
            option set-on-error error
            timeout hello 2s
            timeout idle 2m
            timeout processing 2s
            use-backend coraza-spoa
          spoe-message coraza-req
            args app=var(txn.coraza.app) src-ip=src src-port=src_port dst-ip=dst dst-port=dst_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body exportRuleIDs=bool(false)
          spoe-group coraza-req
            messages coraza-req
          CFG
          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: hp }
          spec:
            selector: { matchLabels: { app: hp } }
            template:
              metadata: { labels: { app: hp } }
              spec:
                containers:
                  - name: haproxy
                    image: ghcr.io/quenchworks/images/haproxy:3.4.0
                    ports: [{ containerPort: 8080 }]
                    volumeMounts:
                      - { name: cfg, mountPath: /etc/haproxy/haproxy.cfg, subPath: haproxy.cfg }
                      - { name: spoe, mountPath: /etc/haproxy/coraza.cfg, subPath: coraza.cfg }
                volumes:
                  - { name: cfg, configMap: { name: hp } }
                  - { name: spoe, configMap: { name: hp-spoe } }
          YAML
          kubectl rollout status deployment/web --timeout=180s
          kubectl rollout status deployment/hp --timeout=180s
          kubectl port-forward deployment/hp 18085:8080 >/tmp/pf.log 2>&1 & pf=$!; sleep 3
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:18085/$1" || true; }
          ok=0
          for _ in $(seq 1 30); do [ "$(code '?q=hello')" = 200 ] && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "clean request answered $(code '?q=hello'), want 200"; kubectl logs deployment/hp --tail=40; exit 1; }
          for p in '?q=%3Cscript%3Ealert(1)%3C%2Fscript%3E' '?id=1%27%20OR%20%271%27%3D%271'; do
            c=$(code "$p"); [ "$c" = 403 ] || { echo "probe $p answered $c, want 403"; kubectl logs deployment/hp --tail=40; exit 1; }
          done
          kill $pf 2>/dev/null || true
          echo "coraza-spoa: behind HAProxy, clean request 200, XSS and SQLi probes 403: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/coraza-spoa-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/coraza-spoa@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/coraza-spoa:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

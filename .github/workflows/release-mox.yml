name: release-mox

on:
  push:
    branches: [main]
    paths:
      - "quench/mox/**"
      - ".github/workflows/release-mox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mox
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          kubectl rollout status deployment/rtest-mox --timeout=600s
          PW=Quench-CI-Mail-2026; U=gate@quench-gate.test
          printf '%s\n' "$PW" | kubectl exec -i deploy/rtest-mox -- mox setaccountpassword gate
          fwd() {
            # the Service has 465 and 993 only with TLS: forward what this phase has
            kubectl port-forward svc/rtest-mox 2587:587 1143:143 8080:8080 $PORTS >/tmp/pf.log 2>&1 & local pf=$!
            sleep 3; local rc=0; "$@" || rc=$?; kill $pf 2>/dev/null || true; return $rc
          }
          printf 'From: %s\r\nTo: %s\r\nSubject: quench gate\r\n\r\nhello from the gate\r\n' "$U" "$U" > /tmp/msg.eml
          # submission with SMTP AUTH is accepted and queued (delivery goes out through the domain's MX, which the
          # test domain has none of), a message appended over IMAP reads back, a wrong password is refused
          mail() {
            ok=0; for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/)" = 200 ] && { ok=1; break; }; sleep 2; done
            [ "$ok" = 1 ] || { echo "admin UI did not answer"; return 1; }
            curl -sS --url smtp://127.0.0.1:2587 --login-options AUTH=PLAIN -u "$U:$PW" --mail-from "$U" --mail-rcpt "$U" -T /tmp/msg.eml \
              || { echo "SMTP submission failed"; return 1; }
            ! curl -sS --url imap://127.0.0.1:1143/INBOX -u "$U:wrong-password-1" 2>/dev/null || { echo "IMAP accepted a wrong password"; return 1; }
            curl -sS --url imap://127.0.0.1:1143/INBOX -u "$U:$PW" -T /tmp/msg.eml || { echo "IMAP APPEND failed"; return 1; }
          }
          read_back() {
            curl -sS --url "imap://127.0.0.1:1143/INBOX;UID=1;SECTION=HEADER.FIELDS%20(SUBJECT)" -u "$U:$PW" > /tmp/subj.txt
            grep -q 'quench gate' /tmp/subj.txt || { echo "the appended message did not read back: $(cat /tmp/subj.txt)"; return 1; }
          }
          both() { mail && read_back; }
          fwd both
          # the account and the mailbox live on the volume: they survive a pod restart
          kubectl delete pod -l app.kubernetes.io/instance=rtest,app.kubernetes.io/name=mox --wait=true
          kubectl rollout status deployment/rtest-mox --timeout=600s
          fwd read_back
          # TLS: STARTTLS on submission, implicit TLS on 465 and 993, with the Helm-made CA
          helm upgrade rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --set tls.enabled=true --wait --timeout 15m
          kubectl rollout status deployment/rtest-mox --timeout=600s
          kubectl get secret rtest-mox-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/mox-ca.crt
          tlsgate() {
            curl -sS --cacert /tmp/mox-ca.crt --resolve rtest-mox:9993:127.0.0.1 \
              --url "imaps://rtest-mox:9993/INBOX;UID=1;SECTION=HEADER.FIELDS%20(SUBJECT)" -u "$U:$PW" > /tmp/subj.txt
            grep -q 'quench gate' /tmp/subj.txt || { echo "IMAPS read failed: $(cat /tmp/subj.txt)"; return 1; }
            curl -sS --cacert /tmp/mox-ca.crt --resolve rtest-mox:4465:127.0.0.1 --url smtps://rtest-mox:4465 \
              -u "$U:$PW" --mail-from "$U" --mail-rcpt "$U" -T /tmp/msg.eml || { echo "submissions (465) failed"; return 1; }
            curl -sS --cacert /tmp/mox-ca.crt --resolve rtest-mox:2587:127.0.0.1 --ssl-reqd --url smtp://rtest-mox:2587 \
              -u "$U:$PW" --mail-from "$U" --mail-rcpt "$U" -T /tmp/msg.eml || { echo "STARTTLS submission failed"; return 1; }
          }
          PORTS="9993:993 4465:465" fwd tlsgate
          echo "mox: admin UI, SMTP AUTH submission queued, IMAP append read back, wrong password refused, kept across a pod restart, IMAPS + submissions + STARTTLS with the Helm CA: ok"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mox-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mox@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/mox:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-mastodon

on:
  push:
    branches: [main]
    paths:
      - "quench/mastodon/**"
      - ".github/workflows/release-mastodon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mastodon
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # cosign signs by pushing to GHCR and reads ~/.docker/config.json for creds.
      # docker/login-action writes there (helm/oras logins do not).
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          helm install mtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 15m
          for d in web sidekiq streaming; do kubectl rollout status deployment/mtest-mastodon-$d --timeout=600s; done

          kubectl port-forward svc/mtest-mastodon-web 3000:3000 >/tmp/pf.log 2>&1 &
          kubectl port-forward svc/mtest-mastodon-streaming 4000:4000 >/tmp/pf2.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do grep -q 'Forwarding from' /tmp/pf.log && grep -q 'Forwarding from' /tmp/pf2.log && break; sleep 1; done
          H=(-H 'Host: mastodon.example.com' -H 'X-Forwarded-Proto: https')

          # web: the instance API answers for the configured domain at the chart's appVersion
          curl -fsS -m 30 "${H[@]}" http://127.0.0.1:3000/api/v2/instance > /tmp/inst.json
          grep -q '"domain":"mastodon.example.com"' /tmp/inst.json
          want="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")"
          grep -q "\"version\":\"${want}\"" /tmp/inst.json
          curl -fsS -m 30 "${H[@]}" http://127.0.0.1:3000/about | grep -q '/packs/'
          echo "  web serves ${want} with its compiled packs"

          # streaming: health, and an unauthenticated stream is refused
          test "$(curl -fsS -m 10 http://127.0.0.1:4000/api/v1/streaming/health)" = OK
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/v1/streaming/public)" = 401
          echo "  streaming healthy and enforcing auth"

          # an owner account is created, and sidekiq takes the mail job it enqueues. The
          # address needs a real MX: Mastodon refuses domains that cannot receive mail.
          kubectl exec deployment/mtest-mastodon-web -c web -- ruby launch.rb tootctl accounts create gateadmin \
            --email quench-gate@gmail.com --confirmed --role Owner | tee /tmp/acct.txt
          grep -q 'New password' /tmp/acct.txt
          for i in $(seq 1 30); do kubectl logs deployment/mtest-mastodon-sidekiq | grep -q 'MailDeliveryJob' && break; sleep 2; done
          kubectl logs deployment/mtest-mastodon-sidekiq | grep -q 'MailDeliveryJob'
          echo "  owner account created; sidekiq picked up its mail job"

          # the generated Rails secrets survive an upgrade, and a restarted web pod re-runs the
          # schema step against the existing database without losing the account
          before="$(kubectl get secret mtest-mastodon -o jsonpath='{.data.secret-key-base}')"
          helm upgrade mtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" --wait --timeout 10m
          test "$(kubectl get secret mtest-mastodon -o jsonpath='{.data.secret-key-base}')" = "$before"
          kubectl delete pod -l app.kubernetes.io/instance=mtest,app.kubernetes.io/component=web --wait
          kubectl rollout status deployment/mtest-mastodon-web --timeout=600s
          kubectl exec deployment/mtest-mastodon-web -c web -- ruby launch.rb rails runner 'exit(Account.find_local("gateadmin") ? 0 : 1)'
          echo "install gate OK: web, sidekiq and streaming up; secrets kept across upgrade; data kept across restart"

      - name: Why the install gate failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl get pods -o name); do
            for c in $(kubectl get "$p" -o jsonpath='{.spec.containers[*].name}'); do
              echo "=== $p [$c] current"
              kubectl logs "$p" -c "$c" --tail=400 || true
              echo "=== $p [$c] previous"
              kubectl logs "$p" -c "$c" --previous --tail=400 || true
            done
          done

      # A push that edits this workflow re-runs the whole release, including for a
      # chart whose version is already published (one bulk edit once fired 161
      # releases). The gate above still runs, which is what a workflow edit needs;
      # an existing version is never re-pushed, re-signed or overwritten. Manual
      # dispatch always publishes: that is an explicit operator decision.
      - name: Skip a version that is already published
        id: published
        run: |
          name="$(awk '/^name:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          ver="$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [ "${{ github.event_name }}" = push ] && helm show chart "${OCI_REPO}/${name}" --version "${ver}" >/dev/null 2>&1; then
            echo "::notice::${name} ${ver} is already on GHCR; gate ran, nothing re-published. Bump the chart version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push (OCI)
        if: steps.published.outputs.skip != 'true'
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mastodon-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        if: steps.published.outputs.skip != 'true'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mastodon@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        if: steps.published.outputs.skip != 'true'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish ArtifactHub metadata (verified publisher)
        if: steps.published.outputs.skip != 'true'
        run: |
          if grep -qE '^repositoryID:[[:space:]]*REPLACE_WITH' "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "${CHART_DIR}"
          oras push ghcr.io/quenchworks/charts/mastodon:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

name: release-mediamtx

on:
  push:
    branches: [main]
    paths:
      - "quench/mediamtx/**"
      - ".github/workflows/release-mediamtx.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push the OCI chart to GHCR
  id-token: write

env:
  CHART_DIR: quench/mediamtx
  OCI_REPO: oci://ghcr.io/quenchworks/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and template
        run: |
          helm dependency build "${CHART_DIR}"
          helm lint "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml"
          helm template "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" >/dev/null

      - name: Install gate (kind)
        run: |
          set -o pipefail
          # mediamtx's image lives in a non-public GHCR package and is pinned by
          # digest, so give the pod credentials to pull the real, signed artifact.
          # A pre-created ServiceAccount carries the pull secret from pod-creation
          # time (patching a chart-created SA would not affect the running pod).
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl create serviceaccount mediamtx-puller
          kubectl patch serviceaccount mediamtx-puller \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          helm install rtest "${CHART_DIR}" -f "${CHART_DIR}/ci/default-values.yaml" \
            --set serviceAccount.create=false --set serviceAccount.name=mediamtx-puller \
            --wait --timeout 5m
          kubectl rollout status deployment/rtest-mediamtx --timeout=300s
          # readiness is a TCP check on RTSP :8554 (--wait already gates on it);
          # additionally prove the RTSP port is reachable over a port-forward.
          kubectl port-forward svc/rtest-mediamtx 8554:8554 >/tmp/pf.log 2>&1 &
          pf=$!; trap 'kill $pf' EXIT; sleep 5
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8554' && echo "RTSP :8554 reachable"

      - name: Package and push (OCI)
        id: push
        run: |
          set -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "${CHART_DIR}" -d ./dist
          helm push ./dist/mediamtx-*.tgz "${OCI_REPO}" 2>&1 | tee push.txt
          digest="$(awk '/Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/quenchworks/charts/mediamtx@${{ steps.push.outputs.digest }}"

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Publish ArtifactHub metadata (verified publisher)
        run: |
          if grep -q REPLACE_WITH "${CHART_DIR}/artifacthub-repo.yml"; then
            echo "::warning::artifacthub-repo.yml has a placeholder repositoryID; skipping metadata push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/quenchworks/charts/mediamtx:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${CHART_DIR}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

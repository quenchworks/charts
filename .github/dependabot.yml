# Keeps the SHA-pinned actions current. Dependabot reads the "# vX.Y.Z" comment
# beside each pin and rewrites both. One grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # cosign-installer v4 installs cosign v3, which signs in the new bundle format
      # (OCI referrers, no .sig tag). ArtifactHub's signed badge and cosign v2
      # verifiers read the .sig tag, so the move to v4 is a deliberate change.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # A grouped update touches every release workflow; without this, merging it
      # runs all ~209 kind gates. The next real release exercises the new pins.
      prefix: "ci(deps) [skip ci]"

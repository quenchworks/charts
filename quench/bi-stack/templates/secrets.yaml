{{- /* Generated once and kept across upgrades (and on uninstall). Fixed name: the subcharts read
it from plain values. The Metabase password ends in a digit: Metabase's default password rule
asks for one. */ -}}
{{- $name := "bi-secrets" -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  clickhouse-password: {{ index $old "clickhouse-password" | default (randAlphaNum 32 | b64enc) }}
  metabase-admin-password: {{ index $old "metabase-admin-password" | default (printf "%s7" (randAlphaNum 31) | b64enc) }}

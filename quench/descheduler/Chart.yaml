apiVersion: v2
name: descheduler
description: "The Kubernetes descheduler evicts running pods so the scheduler can reschedule them onto more suitable nodes, correcting drift from node taints, affinity, topology spread and utilisation over time. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.9
appVersion: "0.36.0"
keywords:
  - descheduler
  - kubernetes
  - scheduling
  - eviction
  - rebalancing
  - operations
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes-sigs/descheduler
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: descheduler republished to a new 0-CVE digest."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: descheduler
      image: ghcr.io/quenchworks/images/descheduler@sha256:dc2873097ae63c7317bdf46c938805a618c51ae6be3fbae3466f087a7dbd18ae
  artifacthub.io/operator: "false"

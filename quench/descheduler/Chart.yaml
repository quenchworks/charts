apiVersion: v2
name: descheduler
description: "The Kubernetes descheduler evicts running pods so the scheduler can reschedule them onto more suitable nodes, correcting drift from node taints, affinity, topology spread and utilisation over time. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.19
appVersion: "0.36.0"
keywords:
  - descheduler
  - kubernetes
  - scheduling
  - eviction
  - rebalancing
  - operations

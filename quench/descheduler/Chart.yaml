apiVersion: v2
name: descheduler
description: "The Kubernetes descheduler evicts running pods so the scheduler can reschedule them onto more suitable nodes, correcting drift from node taints, affinity, topology spread and utilisation over time. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "0.36.0"
keywords:
  - descheduler
  - kubernetes
  - scheduling
  - eviction
  - rebalancing
  - operations
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes-sigs/descheduler
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pin to rebuilt 0-CVE image digest(s) (nightly CVE remediation)."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: descheduler
      image: ghcr.io/quenchworks/images/descheduler@sha256:184afaae471b6635fb26741d2829914d7f49c1bf1955cab5af32d335ab4fe534
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

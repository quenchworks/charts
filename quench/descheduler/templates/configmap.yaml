{{- if and .Values.policy.config (not .Values.policy.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "descheduler.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /policy/policy.yaml and passed to descheduler via --policy-config-file.
  policy.yaml: |-
    {{- .Values.policy.config | nindent 4 }}
{{- end }}

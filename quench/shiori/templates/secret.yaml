{{- /* Values generated once and read back on upgrade: the first owner's password (Shiori creates
       the owner on first start only) and the session signing key (a random one per start would
       log everyone out on every restart). */}}
{{- if not .Values.owner.existingSecret }}
{{- $name := include "shiori.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.owner.password | default (get (($old | default dict).data | default dict) "password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}
---
{{- $sname := include "shiori.sessionSecretName" . }}
{{- $sold := lookup "v1" "Secret" .Release.Namespace $sname }}
{{- $key := get (($sold | default dict).data | default dict) "key" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sname }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ $key | b64enc | quote }}

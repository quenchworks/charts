{{- /* The SSH host key, generated once and read back on upgrade so clients keep trusting the
       server, and the authorized client keys (one file per key; sish reads the directory). */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-hostkey" $name) }}
{{- $key := get (($old | default dict).data | default dict) "ssh_key" | b64dec | default (genPrivateKey "ecdsa") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-hostkey
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  ssh_key: {{ $key | b64enc | quote }}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-pubkeys
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $k := .Values.auth.authorizedKeys }}
  key-{{ $i }}.pub: {{ $k | quote }}
  {{- end }}
{{- end }}

{{- /* Generated once and read back on upgrade: the data encryption key (losing it makes stored secrets
       unreadable) and the secret webapp-server derives the desktop bundle signing key from. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  data-encryption-key: {{ get $old "data-encryption-key" | b64dec | default (randAlphaNum 32) | b64enc | quote }}
  bundle-signing-secret: {{ get $old "bundle-signing-secret" | b64dec | default (randAlphaNum 48) | b64enc | quote }}
{{- end }}

{{- $c := dict "ctx" . "component" "backend" }}
{{- $sec := include "hoppscotch.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hoppscotch.name" $c }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hoppscotch.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hoppscotch.selectorLabels" $c | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # Prisma's migrations with its _prisma_migrations bookkeeping, on the pg driver; a no-op when current.
        # Fails until the database answers; the kubelet re-runs it with backoff.
        - name: migrate
          image: {{ include "hoppscotch.image" .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/node", "quench-migrate.mjs"]
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "hoppscotch.dbEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: {{ include "hoppscotch.image" .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "hoppscotch.dbEnv" . | nindent 12 }}
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ $sec }}, key: data-encryption-key }
            {{- $origins := concat (list (include "hoppscotch.webUrl" .) (include "hoppscotch.adminUrl" .) "app://hoppscotch") .Values.backend.extraOrigins }}
            - { name: WHITELISTED_ORIGINS, value: {{ join "," $origins | quote }} }
            - { name: TRUST_PROXY, value: {{ .Values.backend.trustProxy | toString | quote }} }
            {{- include "hoppscotch.viteEnv" . | nindent 12 }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 3170, protocol: TCP }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hoppscotch.name" $c }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 3170, targetPort: http, protocol: TCP }
  selector:
    {{- include "hoppscotch.selectorLabels" $c | nindent 4 }}

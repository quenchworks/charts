# Public hosts. domain serves the web app (/), the backend (/graphql, /v1) and the desktop app bundle
# (/desktop-app-server); adminDomain serves the admin dashboard. Both required.
domain: ""
adminDomain: ""
publicScheme: https

# Digests are the contract with the image factory; CI rewrites them after each green image build.
backend:
  image: { repository: ghcr.io/quenchworks/images/hoppscotch-backend, digest: "sha256:652c0aa36f1002ba21e1fc32e08c69a98b1c65d069e2c218c445dcfb855d4d0b" }
  # left-most X-Forwarded-For entry is the client IP (set true behind your ingress)
  trustProxy: false
  # extra WHITELISTED_ORIGINS beside the web and admin URLs and the desktop app's app://hoppscotch
  extraOrigins: []
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
web:
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/hoppscotch-web, digest: "sha256:70172f534b41b0663962a63429a675bc63b528f06678dceff7dd586424e753f8" }
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 500m, memory: 512Mi }
admin:
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/hoppscotch-admin, digest: "sha256:ced5446f1f4367a72ea02b79a320c10cdc50b1770c867a062cacb62f6866d20a" }
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Extra VITE_* settings for the web app and the admin dashboard (VITE_APP_TOS_LINK, VITE_PROXYSCOTCH_ACCESS_TOKEN, ...).
viteEnv: {}

# The data encryption key (32 characters; losing it makes stored secrets unreadable) and the desktop bundle
# signing secret: generated into the Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # keys data-encryption-key, bundle-signing-secret

# The bundled QuenchWorks PostgreSQL.
postgresql:
  enabled: true
  auth:
    username: hoppscotch
    password: ""        # generated by the subchart if empty
    database: hoppscotch_db   # must differ from the username: the image only creates a database with another name
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false).
externalDatabase:
  host: ""
  port: 5432
  username: hoppscotch
  database: hoppscotch
  sslmode: require
  existingSecret: ""
  existingSecretKey: password

ingress:
  enabled: false
  className: ""
  annotations: {}
  # e.g. [{hosts: [hoppscotch.example.com, hoppscotch-admin.example.com], secretName: hoppscotch-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

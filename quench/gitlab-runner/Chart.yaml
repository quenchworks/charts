type: application
version: 0.0.3
appVersion: "19.4.1"
keywords:
  - gitlab
  - gitlab-runner
  - ci
  - kubernetes-executor
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks

{{- if not .Values.existingConfigSecret }}
{{- if not .Values.runner.token }}
{{- fail "runner.token is required: create a runner in GitLab (Settings > CI/CD > Runners) and set its glrt- authentication token, or set existingConfigSecret" }}
{{- end }}
{{/* config.toml carries the runner token, so it lives in a Secret. The runner
     reads it read-only; glrt- authentication tokens do not rotate by default. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glr.secretName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
    concurrent = {{ .Values.concurrent }}
    check_interval = {{ .Values.checkInterval }}
    listen_address = ":9252"
    shutdown_timeout = 0

    [[runners]]
      name = {{ .Values.runner.name | default (include "quench-common.fullname" .) | quote }}
      url = {{ required "gitlabUrl is required" .Values.gitlabUrl | quote }}
      token = {{ .Values.runner.token | quote }}
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = {{ .Values.jobs.namespace | default .Release.Namespace | quote }}
        image = {{ .Values.jobs.image | quote }}
        {{- with .Values.jobs.helperImage }}
        helper_image = {{ . | quote }}
        {{- end }}
        service_account = {{ include "glr.serviceAccountName" . | quote }}
        poll_timeout = {{ .Values.jobs.pollTimeout }}
        {{- with .Values.jobs.cpuLimit }}
        cpu_limit = {{ . | quote }}
        {{- end }}
        {{- with .Values.jobs.memoryLimit }}
        memory_limit = {{ . | quote }}
        {{- end }}
{{- end }}

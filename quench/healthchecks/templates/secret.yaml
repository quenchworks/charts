{{- /* Generated once and read back on upgrade: the admin's password (the init container creates
       the admin with it) and Django's SECRET_KEY (changing it logs everyone out). */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.admin.existingSecret }}
  password: {{ .Values.admin.password | b64enc | default (get $old "password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  secret-key: {{ get $old "secret-key" | default (randAlphaNum 50 | b64enc) | quote }}

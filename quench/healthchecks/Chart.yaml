apiVersion: v2
name: healthchecks
description: "Healthchecks: cron job and heartbeat monitoring. Jobs ping a URL and missed pings raise alerts by email, chat and webhooks; SQLite on a volume or PostgreSQL, with the admin created at install. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "5.0.3"
keywords:

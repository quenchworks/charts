apiVersion: v2
name: camel-k
description: "Apache Camel K operator: build and run Camel integrations on Kubernetes from CRDs (Integration, Pipe, Kamelet, IntegrationPlatform). Integration builds run inside the operator on the image's Wolfi OpenJDK 17 and Maven 3.9 and push to the registry you configure. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "2.11.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - camel
  - camel-k
  - kamelets
  - integration
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/camel-k
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: camel-k
      image: ghcr.io/quenchworks/images/camel-k@sha256:dc15fdbca2df1d1dc4ee7da8597138b3f006623647c9f0a16975afbcd9ea3ba0
  artifacthub.io/crds: |
    - kind: Integration
      version: v1
      name: integrations.camel.apache.org
      displayName: Integration
      description: A Camel route the operator builds into an image and runs.
    - kind: Pipe
      version: v1
      name: pipes.camel.apache.org
      displayName: Pipe
      description: Connects a source to a sink through Kamelets.
    - kind: Kamelet
      version: v1
      name: kamelets.camel.apache.org
      displayName: Kamelet
      description: A reusable route snippet (source, sink or action).
    - kind: IntegrationPlatform
      version: v1
      name: integrationplatforms.camel.apache.org
      displayName: Integration platform
      description: Build settings for a namespace (registry, Maven, runtime).
    - kind: IntegrationKit
      version: v1
      name: integrationkits.camel.apache.org
      displayName: Integration kit
      description: A built integration image the operator reuses.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

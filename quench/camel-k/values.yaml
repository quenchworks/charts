# The digest below is the contract with the image factory. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/camel-k
  digest: "sha256:dc15fdbca2df1d1dc4ee7da8597138b3f006623647c9f0a16975afbcd9ea3ba0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# false: watch the release namespace only (Role). true: watch every namespace
# (ClusterRole). Integrations and IntegrationPlatforms must live in a watched namespace.
watchAnyNamespace: false

# Matches the camel.apache.org/operator.id annotation on resources this operator owns.
operatorId: camel-k
logLevel: info

# Where built integration images are pushed. Required on Kubernetes (not OpenShift): an
# IntegrationPlatform without a registry address stays in phase Error. An
# IntegrationPlatform's spec.build.registry overrides these.
registry:
  address: ""
  insecure: false
  # name of a Secret holding registry credentials (.dockerconfigjson)
  secret: ""
  organization: ""

extraEnvVars: []

# Builds run in the operator pod (Maven, then Jib), so it needs more than a controller.
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
imagePullSecrets: []
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
customLivenessProbe: {}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
replicaCount: 1
persistence:
  enabled: false
config:
  smp: 1
  # HARD memory cap. Seastar's in-cgroup available-memory probe is conservative, so
  # --memory must sit well under the request: 512M under a 1Gi request / 2Gi limit
  # boots reliably in kind. (1G under a 2Gi limit fails Seastar's headroom check.)
  memory: 512M
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }

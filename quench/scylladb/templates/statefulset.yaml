{{/* Health via the unauthenticated REST API on port 10000: GET
     /storage_service/scylla_release_version returns the version string once the
     storage service is up, so the kubelet can probe without credentials. Scylla in
     developer mode boots slowly (~60-120s in kind), so both probes are patient and
     liveness starts late so a slow bootstrap is never killed mid-flight. */}}
{{- $liveness := dict "httpGet" (dict "path" "/storage_service/scylla_release_version" "port" "rest") "initialDelaySeconds" 120 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/storage_service/scylla_release_version" "port" "rest") "initialDelaySeconds" 60 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "scylladb.headlessName" . }}
  podManagementPolicy: OrderedReady
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "scylladb.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: scylladb
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCYLLA_CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            # The entrypoint resolves listen/broadcast/rpc from the pod IP via
            # `hostname -i`; pin broadcast addresses to the pod IP explicitly so a
            # multi-node ring advertises a routable address.
            - name: SCYLLA_BROADCAST_ADDRESS
              value: "$(POD_IP)"
            - name: SCYLLA_BROADCAST_RPC_ADDRESS
              value: "$(POD_IP)"
            {{- if gt (int .Values.replicaCount) 1 }}
            # Multi-node: wire seeds to the first seedCount pods over the headless
            # service. (Single node leaves this unset so the entrypoint seeds = self.)
            - name: SCYLLA_SEEDS
              value: {{ include "scylladb.seeds" . | quote }}
            {{- end }}
            - name: SCYLLA_SMP
              value: {{ .Values.config.smp | quote }}
            - name: SCYLLA_MEMORY
              value: {{ .Values.config.memory | quote }}
            - name: SCYLLA_DEVELOPER_MODE
              value: {{ ternary "1" "0" .Values.config.developerMode | quote }}
            - name: SCYLLA_OVERPROVISIONED
              value: {{ ternary "1" "0" .Values.config.overprovisioned | quote }}
            - name: SCYLLA_REACTOR_BACKEND
              value: {{ .Values.config.reactorBackend | quote }}
            {{- if .Values.auth.enabled }}
            - name: SCYLLA_AUTHENTICATOR
              value: {{ .Values.auth.authenticator | quote }}
            - name: SCYLLA_AUTHORIZER
              value: {{ .Values.auth.authorizer | quote }}
            {{- end }}
            {{- with .Values.config.yamlExtra }}
            - name: SCYLLA_YAML_EXTRA
              value: {{ . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: internode
              containerPort: {{ .Values.service.internodePort }}
            - name: cql
              containerPort: {{ .Values.service.cqlPort }}
            - name: rest
              containerPort: {{ .Values.service.apiPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # data/commitlog/hints/view_hints/saved_caches: read-only rootfs requires
            # this be a writable, exec-capable mount (the libreloc loader mmaps here).
            - name: data
              mountPath: /var/lib/scylla
            # conf is seeded from the dist default on first boot and rewritten from env
            # each start; rides on emptyDir (writable + exec under a read-only rootfs).
            - name: conf
              mountPath: /etc/scylla
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: conf
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.cqlPort }}
      targetPort: cql
      name: cql
    # REST API for in-cluster admin/health only (no auth) — not for client traffic.
    - port: {{ .Values.service.apiPort }}
      targetPort: rest
      name: rest
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scylladb.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true   # seeds must resolve each other before they are ready
  ports:
    - port: {{ .Values.service.internodePort }}
      targetPort: internode
      name: internode
    - port: {{ .Values.service.cqlPort }}
      targetPort: cql
      name: cql
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

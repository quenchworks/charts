{{- $tls := include "quench-common.tls.enabled" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if not $tls }}
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    {{- end }}
    {{- /* tls.enabled: the API server's HTTPS listener (5682) carries the chart's
         certificate and is published on httpsPort (443) in place of the plain port */}}
    - name: https
      port: {{ ternary .Values.service.httpsPort .Values.service.ports.https (eq $tls "true") }}
      targetPort: https
      protocol: TCP
    - name: dp-server
      port: {{ .Values.service.ports.dpServer }}
      targetPort: dp-server
      protocol: TCP
    - name: mads
      port: {{ .Values.service.ports.mads }}
      targetPort: mads
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: https
      protocol: TCP
    - name: dp-server
      port: {{ .Values.service.ports.dpServer }}
      targetPort: dp-server
      protocol: TCP
    - name: mads
      port: {{ .Values.service.ports.mads }}
      targetPort: mads
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

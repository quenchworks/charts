{{- /* The admin's password, generated once and kept on upgrade. The bootstrap Job creates the admin with it. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) | b64enc | quote }}
{{- end }}

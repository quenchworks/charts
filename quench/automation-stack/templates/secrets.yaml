{{- /*
Shared secrets, generated once and kept: an existing Secret is reused on upgrade, and Helm keeps
it on uninstall, because encryption-key decrypts every credential stored in n8n. Fixed name: the
subcharts read it from plain values.
*/ -}}
{{- $name := "automation-secrets" -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "automation-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ index $old "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  valkey-password: {{ index $old "valkey-password" | default (randAlphaNum 32 | b64enc) }}
  encryption-key: {{ index $old "encryption-key" | default (randAlphaNum 48 | b64enc) }}

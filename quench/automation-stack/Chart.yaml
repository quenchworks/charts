apiVersion: v2
name: automation-stack
description: "n8n in queue mode with PostgreSQL and Valkey: workflow automation that scales out, with the main instance taking webhooks and the editor, workers running executions, and the database, queue and shared secrets wired at install. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.2
appVersion: "2.40.7"
keywords:
  - n8n
  - workflow-automation
  - queue
  - valkey
  - postgresql
  - stack

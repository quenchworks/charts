apiVersion: v2
name: yourls
description: "YOURLS, the self-hosted URL shortener with click statistics, an admin UI and an API, with a bundled MariaDB. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "1.10.6"
keywords:
  - yourls
  - url-shortener
  - short-links
  - php
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/YOURLS/YOURLS
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "native TLS (tls.enabled): nginx serves the site over HTTPS on 8443 beside HTTP with the quench-common certificate"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: yourls
      image: ghcr.io/quenchworks/images/yourls@sha256:f5b37a1e6b0a0169349364260f5d1e9065fd648ed2b17137c7e55b053a0fb8a8
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

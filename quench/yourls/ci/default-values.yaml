# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest. Bundles MariaDB on a small PVC with NO passwords set, so the gate exercises the
# default path (generated MariaDB password read from the subchart's Secret, generated admin
# password and cookie key). --wait passes only once yourls-install created the tables and
# /admin/ renders.
yourls:
  site: http://127.0.0.1:8080
mariadb:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

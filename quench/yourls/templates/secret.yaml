{{/*
The managed Secret holds the cookie key (always), the admin password (unless
yourls.admin.existingSecret supplies it) and, for an external database without an
existingSecret, the DB password. Generated values are read back from the live Secret, so
they stay stable across upgrades. The bundled MariaDB's password lives in its own Secret,
which the pod reads directly.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-key: {{ .Values.yourls.cookieKey | b64enc | default (get $existing "cookie-key") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- if not .Values.yourls.admin.existingSecret }}
  admin-password: {{ .Values.yourls.admin.password | b64enc | default (get $existing "admin-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
  db-password: {{ .Values.externalDatabase.password | b64enc | default (get $existing "db-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}

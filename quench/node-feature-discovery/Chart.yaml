apiVersion: v2
name: node-feature-discovery
description: "Node Feature Discovery: label Kubernetes nodes with their CPU, kernel, PCI, USB, memory and OS features, and add custom labels from NodeFeatureRule resources. Upstream's default deployment (master, worker DaemonSet, garbage collector) with its three CRDs, on the QuenchWorks image: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.20.1"
kubeVersion: ">=1.26.0-0"
keywords:
  - node-feature-discovery
  - nfd
  - node-labels
  - scheduling
  - operator

apiVersion: v2
name: zipline
description: "Zipline: file and image sharing with ShareX/Flameshot uploads, URL shortening, folders and invites, on the bundled PostgreSQL, with the super-admin created at install. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "4.8.4"
keywords:
  - zipline
  - file-sharing
  - sharex
  - screenshots
  - self-hosted
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/diced/zipline
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: zipline
      image: ghcr.io/quenchworks/images/zipline@sha256:8f67796cbed28eb1f7731d25e15c9770342fe738af9893aaa90a9786341f8116
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

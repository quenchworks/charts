# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/zipline
  digest: "sha256:1b43130be28fc4b3e61def5c0322ecd3465a859c9b38b0dc88f4a118fc2b3c7b"
  pullPolicy: IfNotPresent

nameOverride: ""

# SQLite on a ReadWriteOnce volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The super-admin, created by a post-install Job through Zipline's first-setup API (so /setup is never open to the
# first visitor). Empty password: generated into the Secret <fullname> (password), kept on upgrade with the
# generated CORE_SECRET (core-secret).
auth:
  username: admin
  password: ""
  existingSecret: ""   # a Secret with keys "password" and "core-secret" instead

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" (the image creates them).
postgresql:
  enabled: true
  auth:
    username: zipline
    password: ""        # generated by the subchart if empty
    database: zipline
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false): a Secret holding the full DATABASE_URL.
externalDatabase:
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# More Zipline settings as environment variables, e.g. CORE_RETURN_HTTPS_URLS: "true", CORE_DEFAULT_DOMAIN:
# files.example.com, DATASOURCE_TYPE: s3 (+ DATASOURCE_S3_*), FILES_MAX_FILE_SIZE: 100mb.
settings: {}

# The uploads volume (/var/lib/zipline/uploads).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# Zipline has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: files.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [files.example.com], secretName: files-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

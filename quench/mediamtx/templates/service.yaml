apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: rtsp
      port: {{ .Values.service.ports.rtsp }}
      targetPort: rtsp
      protocol: TCP
    - name: rtmp
      port: {{ .Values.service.ports.rtmp }}
      targetPort: rtmp
      protocol: TCP
    - name: hls
      port: {{ .Values.service.ports.hls }}
      targetPort: hls
      protocol: TCP
    - name: webrtc
      port: {{ .Values.service.ports.webrtc }}
      targetPort: webrtc
      protocol: TCP
    {{- if include "quench-common.tls.enabled" . }}
    - name: rtsps
      port: {{ .Values.service.ports.rtsps }}
      targetPort: rtsps
      protocol: TCP
    - name: rtmps
      port: {{ .Values.service.ports.rtmps }}
      targetPort: rtmps
      protocol: TCP
    {{- end }}
    {{- if .Values.api.enabled }}
    - name: api
      port: {{ .Values.api.port }}
      targetPort: api
      protocol: TCP
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

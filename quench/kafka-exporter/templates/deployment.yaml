{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" "metrics") "initialDelaySeconds" 10 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" "metrics") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kafka-exporter.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: kafka-exporter
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            {{- range .Values.kafkaServers }}
            - --kafka.server={{ . }}
            {{- end }}
            - --verbosity={{ .Values.verbosity }}
            {{- with .Values.kafkaVersion }}
            - --kafka.version={{ . }}
            {{- end }}
            {{- with .Values.topicFilter }}
            - --topic.filter={{ . }}
            {{- end }}
            {{- with .Values.groupFilter }}
            - --group.filter={{ . }}
            {{- end }}
            {{- if .Values.sasl.enabled }}
            - --sasl.enabled
            - --sasl.mechanism={{ .Values.sasl.mechanism }}
            - --sasl.username={{ .Values.sasl.username }}
            # kafka_exporter takes the password only as a flag; the kubelet expands it from the Secret.
            - --sasl.password=$(SASL_PASSWORD)
            {{- end }}
            {{- if .Values.tls.enabled }}
            - --tls.enabled
            {{- if .Values.tls.insecureSkipVerify }}
            - --tls.insecure-skip-tls-verify
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - --tls.ca-file=/tls/ca.crt
            - --tls.cert-file=/tls/tls.crt
            - --tls.key-file=/tls/tls.key
            {{- end }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.sasl.enabled .Values.extraEnvVars }}
          env:
            {{- if .Values.sasl.enabled }}
            - name: SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "sasl.existingSecret is required with sasl.enabled" .Values.sasl.existingSecret }}
                  key: {{ .Values.sasl.existingSecretPasswordKey }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (and .Values.tls.enabled .Values.tls.existingSecret) .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if and .Values.tls.enabled .Values.tls.existingSecret }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
          {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- if or (and .Values.tls.enabled .Values.tls.existingSecret) .Values.extraVolumes }}
      volumes:
        {{- if and .Values.tls.enabled .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
      {{- end }}

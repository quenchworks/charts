# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-kafka-exporter, OCI URL oci://ghcr.io/quenchworks/charts/kafka-exporter.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # kafka-exporter (oci://ghcr.io/quenchworks/charts/kafka-exporter)

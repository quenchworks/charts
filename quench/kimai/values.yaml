# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kimai
  digest: "sha256:371d2c18e28d6a5a37dc7b1ce782c1b8354ea3dbfcf47fe7fb970cea203c3834"
  pullPolicy: IfNotPresent

nameOverride: ""

# Kimai keeps var/ (cache, logs, sessions, invoices, plugins) on the volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# APP_SECRET (Symfony's secret: CSRF tokens, remember-me cookies). Empty: generated into the Secret
# <fullname> (app-secret) once and kept across upgrades.
appSecret:
  value: ""
  existingSecret: ""   # a Secret with key "app-secret" instead

# The super admin the image creates on start when it does not exist yet. Empty password: generated into
# the Secret <fullname> (admin-password). Kimai reads it once: change the password later in the UI.
admin:
  username: admin
  email: admin@example.com
  password: ""

# More environment variables, e.g. TZ, MAILER_FROM, MAILER_URL (smtp://user:pass@host:587),
# DEFAULT_URI (the public URL, used in mails), TRUSTED_PROXIES; secrets through extraEnvVarsSecret.
settings: {}

# --- DATABASE, mode 1 (default): the bundled MariaDB subchart. ---
mariadb:
  enabled: true
  auth:
    # Both are generated into MariaDB's Secret if left empty.
    rootPassword: ""
    password: ""
    database: kimai
    username: kimai
  primary:
    persistence:
      enabled: true
      size: 8Gi

# --- DATABASE, mode 2: external MySQL or MariaDB (mariadb.enabled=false). The password goes into the
# connection URL as is: use a URL-safe one. ---
externalDatabase:
  host: ""
  port: 3306
  database: kimai
  user: kimai
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: db-password
  # DATABASE_URL serverVersion: the server's version, e.g. 8.4.0 for MySQL or 11.8.0-MariaDB
  serverVersion: 11.8.0-MariaDB

# The data volume: var/ (/var/lib/kimai/var).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { cpu: 1, memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: nginx serves HTTPS instead of HTTP on its one port from the PEM pair at /tls. The
# certificate comes from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

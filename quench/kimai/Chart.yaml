apiVersion: v2
name: kimai
description: "Kimai: open-source time tracking for freelancers and teams, with timesheets, projects, invoices, reports and a REST API, the admin and APP_SECRET generated at install and a bundled MariaDB. Hardened by QuenchWorks: nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "2.72.0"
keywords:
  - kimai
  - time-tracking
  - timesheet
  - invoicing
  - self-hosted
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kimai/kimai
annotations:

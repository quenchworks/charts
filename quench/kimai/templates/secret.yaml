{{- /* APP_SECRET, the admin password and (external database without existingSecret) the database
       password: generated once and read back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.appSecret.existingSecret }}
  app-secret: {{ .Values.appSecret.value | default (get $old "app-secret" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  {{- end }}
  admin-password: {{ .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}
  {{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}

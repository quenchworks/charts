{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{/* Preserve the password across upgrades: reuse the one already stored if values
     did not pin a password. The stored value is the full `neo4j/<pw>` string. */}}
{{- if and (not $pw) $existing -}}
{{- $stored := index $existing.data "neo4j-auth" | b64dec -}}
{{- $pw = trimPrefix "neo4j/" $stored -}}
{{- end -}}
{{- if not $pw -}}
{{- $pw = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  # Full NEO4J_AUTH value: the entrypoint parses `neo4j/<password>` and runs
  # set-initial-password on first boot. Stored whole so it maps to NEO4J_AUTH via a
  # single secretKeyRef (a value built from `value:` + secretKeyRef cannot concatenate).
  neo4j-auth: {{ printf "%s/%s" .Values.auth.username $pw | b64enc | quote }}
  # The bare password, for convenience (cypher-shell -p, drivers).
  neo4j-password: {{ $pw | b64enc | quote }}
{{- end }}

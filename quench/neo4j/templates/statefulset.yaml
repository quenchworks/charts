{{/* httpGet probes: GET / on 7474 returns 200 unauthenticated (the discovery JSON).
     The JVM needs ~30-60s to boot, so both probes start late and are patient; liveness
     is generous so a slow start is never killed mid-boot. */}}
{{- $liveness := dict "httpGet" (dict "path" "/" "port" "http") "initialDelaySeconds" 60 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 10 -}}
{{- $readiness := dict "httpGet" (dict "path" "/" "port" "http") "initialDelaySeconds" 30 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "neo4j.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "neo4j.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: neo4j
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            {{- if .Values.auth.enabled }}
            # Full `neo4j/<password>` string from the Secret; the entrypoint parses it
            # and runs set-initial-password on the first ever boot.
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "neo4j.secretName" . }}
                  key: {{ include "neo4j.secretAuthKey" . }}
            {{- else }}
            - name: NEO4J_AUTH
              value: "none"
            {{- end }}
            # Advertise the ClusterIP service DNS so Bolt drivers route correctly.
            - name: NEO4J_ADVERTISED_HOST
              value: {{ include "neo4j.advertisedHost" . | quote }}
            # JVM heap + page cache.
            - name: NEO4J_HEAP_INITIAL
              value: {{ .Values.heap.initial | quote }}
            - name: NEO4J_HEAP_MAX
              value: {{ .Values.heap.max | quote }}
            - name: NEO4J_PAGECACHE
              value: {{ .Values.heap.pagecache | quote }}
            {{- range $k, $v := .Values.extraConfig }}
            # extraConfig.{{ $k }} -> neo4j.conf via NEO4J_<setting> (`.`->`_`, `_`->`__`)
            - name: {{ printf "NEO4J_%s" ($k | replace "_" "__" | replace "." "_") }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: bolt
              containerPort: {{ .Values.service.boltPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # graph store + transaction logs + JNA tmpdir (/data/tmp). MUST be exec.
            - name: data
              mountPath: /data
            # read-only rootfs: conf is seeded from the dist on first boot; logs + the
            # run dir are written at runtime -- all ride on emptyDir.
            - name: conf
              mountPath: /conf
            - name: logs
              mountPath: /logs
            - name: run
              mountPath: /var/run/neo4j
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: run
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

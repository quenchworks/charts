# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-rekor-tiles, OCI URL oci://ghcr.io/quenchworks/charts/rekor-tiles.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # rekor-tiles (oci://ghcr.io/quenchworks/charts/rekor-tiles)

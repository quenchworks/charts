{{- if not .Values.signer.existingSecret }}
{{- $name := include "rekor-tiles.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := genPrivateKey "ed25519" -}}
{{- if $existing }}{{- $key = index $existing.data "private.pem" | b64dec -}}{{- end }}
# The checkpoint signing key. Generated once and kept across upgrades: a new key
# makes every existing checkpoint unverifiable against the published log key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  private.pem: {{ $key | b64enc | quote }}
{{- end }}

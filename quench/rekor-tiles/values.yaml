# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rekor-tiles
  digest: "sha256:202641c7c879f98c7e550e28b4b8826807178abb49c7efe5dd98ad4124145f05"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# The log origin, signed into every checkpoint. Empty uses the release fullname.
# Set it once, before the first entry: changing it later starts a different log.
hostname: ""

# The checkpoint signing key (ed25519, ECDSA or RSA, PEM). Empty generates an
# ed25519 key into a Secret that is kept across upgrades and uninstalls. With
# existingSecret, that Secret must hold the key under `key`.
signer:
  existingSecret: ""
  key: private.pem

checkpointInterval: 10s
logLevel: info

# Extra rekor-server flags, e.g. ["--witness-policy-path=/etc/witness/policy.yaml"].
extraArgs: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

# Serves the log directory (checkpoint, tiles, entry bundles) read-only, which is
# the whole Rekor v2 read API. Turn it off to serve the volume some other way.
readServer:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/caddy
    digest: "sha256:6377c513134e78bd41fad0819c9d45830b1868398c1805a5b3ee8494f93072d7"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

# Native TLS: the write API (HTTP, 3000) and gRPC (3001) serve TLS with the certificate mounted
# at /tls; the read server keeps serving the static tiles over plain HTTP. It comes from the first
# source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

service:
  type: ClusterIP
  port: 3000
  grpcPort: 3001
  readPort: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext: {}
containerSecurityContext: {}

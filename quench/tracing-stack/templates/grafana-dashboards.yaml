{{- if .Values.grafana.enabled }}
# Grafana dashboard provisioning, owned by the umbrella. Two ConfigMaps:
#   1. tracing-stack-dashboard-provider — a Grafana "dashboards" provisioning
#      provider that watches a folder on disk.
#   2. tracing-stack-dashboards — the dashboard JSON files (one key each), mounted
#      as that folder (/var/lib/grafana/dashboards) via grafana.extraVolumes.
# Both are FIXED names so they can be referenced from the static grafana.extraVolumes
# value in values.yaml. ponytail: fixed names => one tracing-stack per namespace.
#
# The bundled dashboard is Tempo's own operational/metrics dashboard; it populates
# from Tempo's /metrics with no trace volume required. Live trace exploration is via
# Grafana Explore -> Tempo (the provisioned "tempo" datasource).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-stack-dashboard-provider
  labels:
    {{- include "tracing-stack.labels" . | nindent 4 }}
data:
  stack.yaml: |
    apiVersion: 1
    providers:
      - name: tracing-stack
        orgId: 1
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-stack-dashboards
  labels:
    {{- include "tracing-stack.labels" . | nindent 4 }}
data:
  {{- if .Values.dashboards.enabled }}
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{- $key := trimSuffix ".json" (base $path) }}
  {{- if index $.Values.dashboards.include $key }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}

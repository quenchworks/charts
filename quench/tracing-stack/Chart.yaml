apiVersion: v2
name: tracing-stack
description: "Hardened, operator-free distributed tracing stack: Tempo (trace store/query) + Grafana (Tempo datasource + trace exploration) + an OpenTelemetry Collector gateway that receives OTLP from your apps and forwards spans to Tempo. No operator, no CRDs. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed. Apps send traces to <release>-otel-collector:4317 (OTLP gRPC) / :4318 (OTLP HTTP); explore them in Grafana via Explore -> Tempo."
type: application
version: 0.0.28
appVersion: "1.0.0"
keywords:
  - tracing
  - distributed-tracing
  - tempo
  - opentelemetry
  - otel
  - otlp
  - grafana
  - observability
  - traces
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/tempo
  - https://github.com/grafana/grafana
  - https://github.com/open-telemetry/opentelemetry-collector
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |

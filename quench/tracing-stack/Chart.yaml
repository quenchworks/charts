apiVersion: v2
name: tracing-stack
description: "Hardened, operator-free distributed tracing stack: Tempo (trace store/query) + Grafana (Tempo datasource + trace exploration) + an OpenTelemetry Collector gateway that receives OTLP from your apps and forwards spans to Tempo. No operator, no CRDs. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed. Apps send traces to <release>-otel-collector:4317 (OTLP gRPC) / :4318 (OTLP HTTP); explore them in Grafana via Explore -> Tempo."
type: application
version: 0.0.26
appVersion: "1.0.0"
keywords:
  - tracing
  - distributed-tracing
  - tempo
  - opentelemetry
  - otel
  - otlp
  - grafana
  - observability
  - traces
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/tempo
  - https://github.com/grafana/grafana
  - https://github.com/open-telemetry/opentelemetry-collector
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: otel-collector republished to a new 0-CVE digest."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: tempo
      image: ghcr.io/quenchworks/images/tempo@sha256:f6057d7ee6a19f2283b010d4eb8b02c5dbc7a1ffbfa79ff7466381539bb13e7e
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:ae745b72a3bdc64caf10472593bfc7c5ce134d78a60631f39c289e23c5fdce7c
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:8541e271660511bf470cd0982cde09a0df49d5a83bf613308edea138d6da95ce
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: tempo
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: tempo.enabled
  - name: grafana
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

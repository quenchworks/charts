      image: ghcr.io/quenchworks/images/tempo@sha256:8a879434b1732ab1fdb1e241063a3670e9f787f87200e7c108cc2722df80ae94
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:4b7e7a1342831602a31232c1dce40d8ea6a14bb44d6acb3aa095c029e1520d55
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:19e461bc40f0e4e16cd02792d94fc0ce60fa48a0400ce1422044f9f77acd0a17
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

      image: ghcr.io/quenchworks/images/tempo@sha256:546daa3aa221181cf3df0879a7565e456bcef7f7f919c31d94d2e028a065ba95
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:5fad18f2054178ba8e6ecbc39b4a1127318060a69b2edf2ed4d2b6b312d62c88
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:c47ea76447d7c83289e07ae418107d4f581e9a16534691e8bd1c6916040f7c38
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |

# Install gate values. Fits a single kind node: ephemeral storage (kind ships a
# default StorageClass but we keep PVCs small and short-lived), modest resources.
# Enables all components. Components use their charts' real CI-maintained digests.
tempo:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

grafana:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

otelCollector:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

dashboards:
  enabled: true

  name: kubeflow-trainer-controller-manager
subjects:
- kind: ServiceAccount
  name: kubeflow-trainer-controller-manager
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
data:
  controller_manager_config.yaml: |
    # Copyright The Kubeflow Authors.
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    apiVersion: config.trainer.kubeflow.org/v1alpha1
    kind: Configuration
    # Health configuration
    health:
      healthProbeBindAddress: :8081
      readinessEndpointName: readyz
      livenessEndpointName: healthz

    # Metrics configuration
    metrics:
      bindAddress: :8443
      secureServing: true

    # Webhook configuration
    webhook:
      port: 9443
      host: ""

    # Leader election configuration
    leaderElection:
      leaderElect: true
      resourceName: trainer.kubeflow.org
      resourceNamespace: ""
      leaseDuration: 15s
      renewDeadline: 10s
      retryPeriod: 2s

    # Controller configuration
    controller:
      groupKindConcurrency:
        TrainJob.trainer.kubeflow.org: 5
        TrainingRuntime.trainer.kubeflow.org: 1
        ClusterTrainingRuntime.trainer.kubeflow.org: 1

    # Certificate management configuration
    certManagement:
      enable: true
      serviceName: kubeflow-trainer-controller-manager
      secretName: kubeflow-trainer-webhook-cert

    # Client connection configuration
    clientConnection:
      qps: 50
      burst: 100

    statusServer:
      port: 10443
      qps: 5
      burst: 10
kind: ConfigMap
metadata:
  name: kubeflow-trainer-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
data:
  kubeflow_trainer_version: v2.4.0
kind: ConfigMap
metadata:
  name: kubeflow-trainer-public
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
data: {}
kind: Secret
metadata:
  name: kubeflow-trainer-webhook-cert
  namespace: {{ .Release.Namespace }}
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/name: trainer
    app.kubernetes.io/part-of: kubeflow
  name: kubeflow-trainer-controller-manager
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: monitoring-port
    port: 8443
    targetPort: metrics
  - name: webhook-server
    port: 443
    protocol: TCP
    targetPort: webhook
  - name: status-server
    port: 10443
    protocol: TCP
    targetPort: status-server
  selector:
    app.kubernetes.io/component: manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/name: trainer
    app.kubernetes.io/part-of: kubeflow
  name: kubeflow-trainer-controller-manager
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: manager
      app.kubernetes.io/name: trainer
      app.kubernetes.io/part-of: kubeflow
  template:
    metadata:
      labels:
        app.kubernetes.io/component: manager
        app.kubernetes.io/name: trainer
        app.kubernetes.io/part-of: kubeflow
    spec:
      containers:
      - args:
        - --config=/controller_manager_config.yaml
        - --zap-log-level=2
        image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 10443
          name: status-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /controller_manager_config.yaml
          name: kubeflow-trainer-config
          readOnly: true
          subPath: controller_manager_config.yaml
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      serviceAccountName: kubeflow-trainer-controller-manager
      volumes:
      - configMap:
          name: kubeflow-trainer-config
        name: kubeflow-trainer-config
      - name: cert
        secret:
          defaultMode: 420
          secretName: kubeflow-trainer-webhook-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: defaulter.trainer.kubeflow.org
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubeflow-trainer-controller-manager
      namespace: {{ .Release.Namespace }}
      path: /mutate-trainer-kubeflow-org-v1alpha1-trainjob
  failurePolicy: Fail
  name: defaulter.trainjob.trainer.kubeflow.org
  rules:
  - apiGroups:
    - trainer.kubeflow.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trainjobs
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validator.trainer.kubeflow.org
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubeflow-trainer-controller-manager
      namespace: {{ .Release.Namespace }}
      path: /validate-trainer-kubeflow-org-v1alpha1-clustertrainingruntime
  failurePolicy: Fail
  name: validator.clustertrainingruntime.trainer.kubeflow.org
  objectSelector:
    matchExpressions:
    - key: trainer.kubeflow.org/webhook-validation
      operator: NotIn
      values:
      - disabled
  rules:
  - apiGroups:
    - trainer.kubeflow.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clustertrainingruntimes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubeflow-trainer-controller-manager
      namespace: {{ .Release.Namespace }}
      path: /validate-trainer-kubeflow-org-v1alpha1-optimizationjob
  failurePolicy: Fail
  name: validator.optimizationjob.trainer.kubeflow.org
  rules:
  - apiGroups:
    - trainer.kubeflow.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - optimizationjobs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubeflow-trainer-controller-manager
      namespace: {{ .Release.Namespace }}
      path: /validate-trainer-kubeflow-org-v1alpha1-trainingruntime
  failurePolicy: Fail
  name: validator.trainingruntime.trainer.kubeflow.org
  objectSelector:
    matchExpressions:
    - key: trainer.kubeflow.org/webhook-validation
      operator: NotIn
      values:
      - disabled
  rules:
  - apiGroups:
    - trainer.kubeflow.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trainingruntimes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kubeflow-trainer-controller-manager
      namespace: {{ .Release.Namespace }}
      path: /validate-trainer-kubeflow-org-v1alpha1-trainjob
  failurePolicy: Fail
  name: validator.trainjob.trainer.kubeflow.org
  rules:
  - apiGroups:
    - trainer.kubeflow.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trainjobs
  sideEffects: None

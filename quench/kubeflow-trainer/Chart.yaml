apiVersion: v2
name: kubeflow-trainer
description: "Kubeflow Trainer: distributed training on Kubernetes (PyTorch, JAX, MPI) as TrainJob resources on TrainingRuntime templates, run through JobSet. The trainer controller, the JobSet controller and their CRDs ship with the chart. Hardened by QuenchWorks: both controllers built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "2.4.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - kubeflow
  - training
  - pytorch
  - jobset
  - mlops
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubeflow/trainer
  - https://github.com/kubernetes-sigs/jobset
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Kubeflow Trainer 2.4.0 with JobSet 0.13.0 and their CRDs"
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: kubeflow-trainer
      image: ghcr.io/quenchworks/images/kubeflow-trainer@sha256:51a3299b36c3e6d48fe75e6796f5e3a0fd6b52476414acd1871e6dd8a06be3ab
    - name: jobset
      image: ghcr.io/quenchworks/images/jobset@sha256:4d3033aa13bf1fa470e0ec15ad93b732e03394f7539b93329b93eaf5f486afec
  artifacthub.io/crds: |
    - kind: ClusterTrainingRuntime
      version: v1alpha1
      name: clustertrainingruntimes.trainer.kubeflow.org
      displayName: Cluster Training Runtime
    - kind: JobSet
      version: v1alpha2
      name: jobsets.jobset.x-k8s.io
      displayName: Job Set
    - kind: OptimizationJob
      version: v1alpha1
      name: optimizationjobs.trainer.kubeflow.org
      displayName: Optimization Job
    - kind: TrainingRuntime
      version: v1alpha1
      name: trainingruntimes.trainer.kubeflow.org
      displayName: Training Runtime
    - kind: TrainJob
      version: v1alpha1
      name: trainjobs.trainer.kubeflow.org
      displayName: Train Job
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md

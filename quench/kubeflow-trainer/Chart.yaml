apiVersion: v2
name: kubeflow-trainer
description: "Kubeflow Trainer: distributed training on Kubernetes (PyTorch, JAX, MPI) as TrainJob resources on TrainingRuntime templates, run through JobSet. The trainer controller, the JobSet controller and their CRDs ship with the chart. Hardened by QuenchWorks: both controllers built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "2.4.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - kubeflow
  - training
  - pytorch
  - jobset
  - mlops
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubeflow/trainer
  - https://github.com/kubernetes-sigs/jobset
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: kubeflow-trainer
      image: ghcr.io/quenchworks/images/kubeflow-trainer@sha256:296f19f94081b1fb6840628663fc1fb9a177291ae25863b4abda73aac38b200c
    - name: jobset
      image: ghcr.io/quenchworks/images/jobset@sha256:ffa1256db75a03b1f1b9ed6958839b986bb2c7a486c7985595f7d7462b8de336
  artifacthub.io/crds: |
    - kind: ClusterTrainingRuntime
      version: v1alpha1
      name: clustertrainingruntimes.trainer.kubeflow.org
      displayName: Cluster Training Runtime
    - kind: JobSet
      version: v1alpha2
      name: jobsets.jobset.x-k8s.io
      displayName: Job Set
    - kind: OptimizationJob
      version: v1alpha1
      name: optimizationjobs.trainer.kubeflow.org
      displayName: Optimization Job
    - kind: TrainingRuntime
      version: v1alpha1
      name: trainingruntimes.trainer.kubeflow.org
      displayName: Training Runtime
    - kind: TrainJob
      version: v1alpha1
      name: trainjobs.trainer.kubeflow.org
      displayName: Train Job
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md

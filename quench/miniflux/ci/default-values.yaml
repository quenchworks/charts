# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# The bundled PostgreSQL subchart stays ON so the gate proves the self-contained
# path end-to-end: postgres comes up, miniflux migrates its schema against it and
# serves /healthcheck. Fixed, deterministic credentials make the install
# reproducible; change them (or use externalDatabase) in a real deployment.
postgresql:
  enabled: true
  auth:
    username: postgres
    password: quench-ci-pg
    database: miniflux
  primary:
    persistence:
      enabled: true
      size: 1Gi

admin:
  create: true
  username: admin
  password: quench-admin

apiVersion: v2
name: miniflux
description: "Minimalist, opinionated feed reader (Go, single binary) backed by PostgreSQL. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest. Ships a bundled PostgreSQL by default for a self-contained install."
type: application
version: 0.0.37
appVersion: "2.3.5"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/miniflux/v2
keywords:
  - miniflux
  - rss
  - atom
  - feed-reader
  - reader
  - news
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the 2026-11-13 update round's rebuilt images."
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: miniflux
      image: ghcr.io/quenchworks/images/miniflux@sha256:c56a3cffe57313542a10edbe47914beca916bcaa3cb76b0fe459acbc89c48eb0
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

apiVersion: v2
name: miniflux
description: "Minimalist, opinionated feed reader (Go, single binary) backed by PostgreSQL. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Ships a bundled PostgreSQL by default for a self-contained install."
type: application
version: 0.0.12
appVersion: "2.3.2"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/miniflux/v2
keywords:
  - miniflux
  - rss
  - atom
  - feed-reader
  - reader
  - news
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Metadata fix: declare the bundled PostgreSQL 18.6 image (postgresql subchart, enabled by default) in artifacthub.io/images so the ArtifactHub security report covers it."
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: miniflux
      image: ghcr.io/quenchworks/images/miniflux@sha256:80f7ef80f0f4efcf20e8f5538155e50ddc3c31ad52095bb15d7bd89df3704207
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac4c4674d703666282dbbae9e4365114039160a982a9a72b7ea7241bfb23c829
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

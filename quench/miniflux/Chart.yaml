apiVersion: v2
name: miniflux
description: "Minimalist, opinionated feed reader (Go, single binary) backed by PostgreSQL. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Ships a bundled PostgreSQL by default for a self-contained install."
type: application
version: 0.0.28
appVersion: "2.3.4"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/miniflux/v2
keywords:
  - miniflux
  - rss
  - atom
  - feed-reader
  - reader
  - news
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles postgresql=0.0.30 (2026-10-22 CVE rebuild)"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: miniflux
      image: ghcr.io/quenchworks/images/miniflux@sha256:5a30b51673b552ec47cf43f5b8aaa461c8e1f18828c4995ce89823c4491c41e6
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:42316ed44fa7722f611c35af6edb37882ceaac8c83f48a59735d329d5c12d977
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

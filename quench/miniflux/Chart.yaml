    - kind: added
      description: "Initial QuenchWorks release: hardened, digest-pinned, cosign-signed miniflux with a bundled PostgreSQL subchart (self-contained) and an external-database option."
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |

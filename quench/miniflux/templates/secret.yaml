{{- if eq (include "miniflux.createsSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if or .Values.postgresql.enabled (not .Values.externalDatabase.existingSecret) }}
  database-url: {{ include "miniflux.databaseURL" . | b64enc | quote }}
  {{- end }}
  {{- if and .Values.admin.create (not .Values.admin.existingSecret) }}
  admin-password: {{ include "miniflux.adminPassword" . | b64enc | quote }}
  {{- end }}
{{- end }}

{{- /* The first user's password, generated once and read back on upgrade. pgAdmin stores the user in its config DB
       on the first start; changing this later does not change an existing login. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}
{{- if .Values.servers }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-servers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- $servers := dict }}
  {{- range $i, $s := .Values.servers }}
  {{- $_ := set $servers (toString (add1 $i)) (merge (dict "Group" "Servers" "Port" 5432 "MaintenanceDB" "postgres" "SSLMode" "prefer") $s) }}
  {{- end }}
  servers.json: {{ dict "Servers" $servers | toJson | quote }}
{{- end }}

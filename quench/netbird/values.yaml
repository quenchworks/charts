# The public host clients and browsers use for everything: the dashboard (/), the API and sign-in
# (management), signal and relay, routed by path (see ingress). Required.
domain: ""
publicScheme: https

# Digests are the contract with the image factory; CI rewrites them after each green image build.
management:
  image: { repository: ghcr.io/quenchworks/images/netbird-management, digest: "sha256:7d040af372ec5f6fce277c4d2d69c28aa7a39b61790e484701e41d00c2f113b7" }
  logLevel: info
  # appended to peer names: <peer>.netbird.selfhosted
  dnsDomain: netbird.selfhosted
  # CIDRs of reverse proxies whose X-Forwarded-For management trusts (your ingress controller)
  trustedProxies: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
signal:
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/netbird-signal, digest: "sha256:b7e5a9603dbacb16873f6af4b7b77ce7f044092101cfd507b8c3695b798e6f39" }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 500m, memory: 256Mi }
relay:
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/netbird-relay, digest: "sha256:4c1b9e1c34288ca7188a094c2011852d93417618580785fd772717ae55e8d8a5" }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: "1", memory: 256Mi }
dashboard:
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/netbird-dashboard, digest: "sha256:c771bc5b4c39575267fbc7aa1944ed47775d2d7c8e376b4c68662cca74fe5d8f" }
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# STUN servers peers use to find their public address (NetBird's relay does not serve STUN here).
stunServers:
  - stun:stun.l.google.com:19302

# The first administrator in NetBird's built-in sign-in (Dex), created at the first start.
owner:
  email: admin@example.com
  username: admin
  password: ""   # generated (24 characters) if empty; read it from the Secret

# Relay secret, store encryption key, sign-in cookie key and the owner password: generated into the
# Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # keys relay-secret, store-key, cookie-key, owner-password, owner-hash (bcrypt)

# Routing peers: NetBird clients that join with a setup key and route networks for the mesh.
router:
  enabled: false
  replicas: 1
  image: { repository: ghcr.io/quenchworks/images/netbird, digest: "sha256:bc9cfcab715c779695abbe59164ca74bd341cea3c0777a2cb5271bf0e6d8ef7b" }
  setupKey:
    existingSecret: ""   # create a setup key in the dashboard, store it in a Secret
    key: setup-key
  # false: userspace netstack mode as uid 1001. true: kernel WireGuard and iptables (root, NET_ADMIN).
  kernelMode: false
  hostNetwork: false
  env: {}
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

# The bundled QuenchWorks PostgreSQL holds the NetBird store and the sign-in (Dex) data.
postgresql:
  enabled: true
  auth:
    username: netbird
    password: ""        # generated by the subchart if empty
    database: netbird_store   # must differ from the username: the image only creates a database with another name
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false).
externalDatabase:
  host: ""
  port: 5432
  username: netbird
  database: netbird_store
  sslmode: require
  existingSecret: ""
  existingSecretKey: password

ingress:
  enabled: false
  className: ""
  annotations: {}
  # added to the gRPC Ingress (management and signal): ingress-nginx needs the backend protocol
  grpcAnnotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
  # e.g. [{hosts: [netbird.example.com], secretName: netbird-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

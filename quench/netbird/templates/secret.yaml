{{- /* Generated once and read back on upgrade: the relay secret (peers and relay share it), the store
       encryption key (losing it makes stored secrets unreadable), the IdP cookie key and the first
       owner's password with its bcrypt hash. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $relay := get $old "relay-secret" | b64dec | default (randAlphaNum 48) }}
{{- $store := get $old "store-key" | b64dec | default (randAlphaNum 32 | b64enc) }}
{{- $cookie := get $old "cookie-key" | b64dec | default (randAlphaNum 32) }}
{{- $pw := get $old "owner-password" | b64dec | default (.Values.owner.password | default (randAlphaNum 24)) }}
{{- $hash := get $old "owner-hash" | b64dec | default (bcrypt $pw) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  relay-secret: {{ $relay | b64enc | quote }}
  store-key: {{ $store | b64enc | quote }}
  cookie-key: {{ $cookie | b64enc | quote }}
  owner-password: {{ $pw | b64enc | quote }}
  owner-hash: {{ $hash | b64enc | quote }}
{{- end }}

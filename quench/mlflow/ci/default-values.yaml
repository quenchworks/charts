# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Bundles the Quenchworks PostgreSQL subchart with a small PVC + a small artifact PVC;
# deterministic shared DB credentials; small resources for the runner. The gate confirms
# MLflow connects to PostgreSQL, runs its DB migrations, and /health returns 200 (i.e.
# it is actually serving).
postgresql:
  enabled: true
  auth:
    username: mlflowuser
    password: ci-test-password
    database: mlflow
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

persistence:
  enabled: true
  size: 1Gi

resources:
  # mlflow + pandas/numpy resident set is ~0.5-0.7GB even at --workers 1; 1Gi OOMed.
  requests: { cpu: 250m, memory: 768Mi }
  limits: { cpu: "2", memory: 2Gi }

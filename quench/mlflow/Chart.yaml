apiVersion: v2
name: mlflow
description: Hardened MLflow Tracking Server (experiment tracking + model registry) on a 0-CVE nonroot image, with a bundled PostgreSQL backend store.
type: application
version: 0.0.18
appVersion: "3.15.2"
kubeVersion: ">=1.23.0-0"
home: https://github.com/quenchworks/charts
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mlflow/mlflow
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - mlflow
  - mlops
  - experiment-tracking
  - model-registry
  - machine-learning
  - ai
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bumped the bundled postgresql subchart to 0.0.19, which pins the rebuilt PostgreSQL 18.6 image that ships the uuid-ossp extension."
  category: ai-machine-learning
  licenses: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/mlflow/mlflow
  artifacthub.io/images: |
    - name: mlflow
      image: ghcr.io/quenchworks/images/mlflow@sha256:b6e937696995437df6128f24c5575de9d27d770ddd4d257427a0f0dc8864ce29
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

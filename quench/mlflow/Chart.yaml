apiVersion: v2
name: mlflow
description: Hardened MLflow Tracking Server (experiment tracking + model registry) on a 0-CVE nonroot image, with a bundled PostgreSQL backend store.
type: application
version: 0.0.25
appVersion: "3.16.1"
kubeVersion: ">=1.23.0-0"
home: https://github.com/quenchworks/charts
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mlflow/mlflow
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - mlflow
  - mlops
  - experiment-tracking
  - model-registry
  - machine-learning
  - ai
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt with psycopg2, cryptography and pandas from Wolfi; the previous image carried OpenSSL 3.5.8 inside psycopg2-binary, where the scan cannot see it."
  category: ai-machine-learning
  licenses: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/mlflow/mlflow
  artifacthub.io/images: |
    - name: mlflow
      image: ghcr.io/quenchworks/images/mlflow@sha256:f0d848e3bfb219791474e790e1baade7d875e14357af47b8d518f19ea5a2ebe8
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

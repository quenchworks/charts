apiVersion: v2
name: mlflow
description: Hardened MLflow Tracking Server (experiment tracking + model registry) on a 0-CVE nonroot image, with a bundled PostgreSQL backend store.
type: application
version: 0.0.6
appVersion: "3.14.0"
kubeVersion: ">=1.23.0-0"
home: https://github.com/quenchworks/charts
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mlflow/mlflow
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - mlflow
  - mlops
  - experiment-tracking
  - model-registry
  - machine-learning
  - ai
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Maintenance re-release: re-validated against the chart's current pinned, cosign-signed 0-CVE images."
  category: ai-machine-learning
  licenses: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/mlflow/mlflow
  artifacthub.io/images: |
    - name: mlflow
      image: ghcr.io/quenchworks/images/mlflow@sha256:86680dc8c9cfae82c0c1a71a4b129d746fcf19fcdb2380530f81dbe83b416df0
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:b492e8f2aa8528a0af8bc1aa835522ab222aa8e0a0a6c135b2d5fdc3e9467bd4
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

{{/*
The managed Secret carries:
  - db-password         : the PostgreSQL backend-store password.
  - backend-store-uri   : the FULL SQLAlchemy DSN MLflow connects with, assembled here
                          (postgresql://USER:PASS@HOST:PORT/DB?sslmode=...). It is
                          injected into the pod as MLFLOW_BACKEND_STORE_URI so the
                          password never appears in argv / the process list.

When the bundled PostgreSQL is enabled the password is the bundled superuser's password
(postgresql.auth.username is created by the image as the superuser). To keep it identical
to what the subchart actually uses, the value is resolved in this order: explicit
postgresql.auth.password -> the subchart's already-rendered Secret
(<release>-postgresql / postgres-password) via lookup -> this Secret's prior value ->
a fresh 24-char random. Set postgresql.auth.password for a deterministic install.

When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart
renders no Secret — the referenced Secret must already supply backend-store-uri and the
password key (see externalDatabase.existingSecretPasswordKey).
*/}}
{{- if include "mlflow.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- DB password ---- */}}
{{- $pw := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $pw = .Values.postgresql.auth.password -}}
{{- if not $pw -}}
{{- $pgSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name) -}}
{{- if $pgSecret -}}{{- $pw = index $pgSecret.data "postgres-password" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- else -}}
{{- $pw = .Values.externalDatabase.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- end -}}

{{/* ---- assemble the SQLAlchemy DSN ---- */}}
{{- $dsn := printf "postgresql://%s:%s@%s:%s/%s?sslmode=%s"
    (include "mlflow.db.user" .)
    (urlquery $pw)
    (include "mlflow.db.host" .)
    (include "mlflow.db.port" .)
    (include "mlflow.db.name" .)
    (include "mlflow.db.sslMode" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $pw | b64enc | quote }}
  backend-store-uri: {{ $dsn | b64enc | quote }}
{{- end }}

# Install gate. No image override: the install uses the chart's real, CI-maintained digest. The gate adds a local
# rule and sends matching traffic out of the node from the Suricata pod (host network).
rules:
  localRules: |
    alert http any any -> any any (msg:"quench gate probe"; http.uri; content:"/quench-gate-probe"; sid:1000002; rev:1;)

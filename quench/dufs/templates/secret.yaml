{{- /* The account: its password is generated once and read back on upgrade; "auth" is the
       DUFS_AUTH rule (user:password@/:rw, read-write on the whole tree). */}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  auth: {{ printf "%s:%s@/:rw" .Values.auth.username $pw | b64enc | quote }}
{{- end }}

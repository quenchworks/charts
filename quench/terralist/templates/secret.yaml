{{- $name := include "quench-common.fullname" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- /* signing and encryption secrets: generated once, then kept across upgrades. The
       cookie secret keys AES, so it is exactly 32 bytes. */ -}}
{{- $keep := dict -}}
{{- range $k, $n := dict "token-signing-secret" 40 "local-token-signing-secret" 40 "oauth-state-secret" 40 "master-api-key" 40 "cookie-secret" 32 -}}
{{- if hasKey $old $k -}}
{{- $_ := set $keep $k (index $old $k | b64dec) -}}
{{- else -}}
{{- $_ := set $keep $k (randAlphaNum $n) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := list "token-signing-secret" "local-token-signing-secret" "oauth-state-secret" "cookie-secret" }}
  {{ $k }}: {{ get $keep $k | b64enc | quote }}
  {{- end }}
  {{- if .Values.masterApiKey.enabled }}
  master-api-key: {{ get $keep "master-api-key" | b64enc | quote }}
  {{- end }}
  {{- if not .Values.oauth.existingSecret }}
  client-id: {{ .Values.oauth.clientId | b64enc | quote }}
  client-secret: {{ .Values.oauth.clientSecret | b64enc | quote }}
  {{- end }}

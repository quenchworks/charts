# Install gate on kind: a placeholder GitHub OAuth app (Terralist calls it only at login),
# the master API key on for the gate's uploads, SQLite and the local store on the PVC.
url: http://127.0.0.1:5758
oauth:
  provider: github
  clientId: gate
  clientSecret: gate
masterApiKey:
  enabled: true
persistence:
  size: 1Gi

apiVersion: v2
name: terralist
description: "Terralist, a private Terraform and OpenTofu registry for modules and providers: the registry protocol, a web UI, OAuth login (GitHub, GitLab, Bitbucket, OIDC) and API keys, on SQLite, PostgreSQL or MySQL. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.10.9"
keywords:
  - terralist
  - terraform
  - opentofu
  - registry
  - iac

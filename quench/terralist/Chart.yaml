apiVersion: v2
name: terralist
description: "Terralist, a private Terraform and OpenTofu registry for modules and providers: the registry protocol, a web UI, OAuth login (GitHub, GitLab, Bitbucket, OIDC) and API keys, on SQLite, PostgreSQL or MySQL. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."

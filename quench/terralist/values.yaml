# Quenchworks Terralist on the QuenchWorks terralist image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). Every setting reaches Terralist as a TERRALIST_*
# environment variable; secrets come from Secrets.
image:
  repository: ghcr.io/quenchworks/images/terralist
  digest: "sha256:447f6563e020b2bb70d5c112abed4fe3d7348fdffa8a3f1068035530747c46c1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# The public URL: Terraform and OpenTofu resolve module and provider downloads under it,
# and the OAuth app's callback is <url>/v1/api/auth/redirect.
url: http://terralist.local

# Login. Terralist refuses to start without an OAuth provider.
oauth:
  # github, gitlab, bitbucket or oidc (provider-specific settings go in extraEnvVars,
  # e.g. TERRALIST_OI_AUTHORIZE_URL for oidc)
  provider: github
  clientId: ""
  clientSecret: ""
  # a Secret with client-id and client-secret instead
  existingSecret: ""

# A pre-shared key with full access (X-API-Key header), for bootstrapping authorities
# and CI uploads. Off by default; when on, the chart generates it (key master-api-key).
masterApiKey:
  enabled: false

# Where uploaded module and provider archives live: local (the PVC), proxy (only the
# upstream URL is stored), or s3, gcs, azure (configure through extraEnvVars).
storage:
  resolver: local

database:
  # sqlite (on the PVC), postgresql or mysql
  type: sqlite
  # a Secret whose key holds the connection URL, e.g. postgres://user:pw@host:5432/terralist
  existingSecret: ""
  urlKey: url

extraEnvVars: []

persistence:
  size: 5Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1000m, memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 5758

# Native TLS: the port serves HTTPS only (the probes follow), with the certificate mounted at
# /tls; set url to the https address. It comes from the first source set: existingSecret,
# then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

# The digest below is the contract with the image factory. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/tika
  digest: "sha256:defcc52ddc9eb15ddbef6c987f30dd3c698085b5523835bd9cb66e63d509c9ee"
  pullPolicy: IfNotPresent

nameOverride: ""
replicaCount: 1

# Options for the server JVM (JAVA_TOOL_OPTIONS also reaches the forked parser JVMs).
javaOpts: "-XX:MaxRAMPercentage=40"
# Appended to the server command line (see the Tika server documentation).
extraArgs: []

resources:
  requests: { cpu: 200m, memory: 1Gi }
  limits: { memory: 3Gi }

service:
  enabled: true
  type: ClusterIP
  port: 9998

# Native TLS: the server port turns HTTPS only, from Tika 4's JSON config (server.tlsConfig,
# marked BETA upstream) and a PKCS12 an init container on the openssl image builds; the probes
# move to HTTPS. The certificate comes from the first source set: existingSecret, then a
# cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:914fbcf857be13a249ebb27c4266f30ced006e80ffc5b63a8c00298bd211e519"
  pullPolicy: IfNotPresent

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: false
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

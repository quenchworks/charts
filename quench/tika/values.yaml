# The digest below is the contract with the image factory. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/tika
  digest: "sha256:dea7a5c71a9ebbe3e2797b47a26d763e91bf6b072ecd2c270616a67a66a19e63"
  pullPolicy: IfNotPresent

nameOverride: ""
replicaCount: 1

# Options for the server JVM (JAVA_TOOL_OPTIONS also reaches the forked parser JVMs).
javaOpts: "-XX:MaxRAMPercentage=40"
# Appended to the server command line (see the Tika server documentation).
extraArgs: []

resources:
  requests: { cpu: 200m, memory: 1Gi }
  limits: { memory: 3Gi }

service:
  enabled: true
  type: ClusterIP
  port: 9998

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: false
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

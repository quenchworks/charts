# ponytail: Vector, the OpenTelemetry Collector, kube-state-metrics and node-exporter
# are NOT chart dependencies. Their quench/* component charts render config via
# `toYaml` and cannot template the release name into a sink/exporter endpoint, nor run
# as the DaemonSets these roles require. They are templated inline by this umbrella
# (templates/{vector,otel-collector,kube-state-metrics,node-exporter}.yaml), exactly
# as the sibling stacks do. Images are still pinned by digest and listed in
# artifacthub.io/images above for provenance.

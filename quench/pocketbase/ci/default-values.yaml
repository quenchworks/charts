# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and PocketBase writes
# its SQLite DB to it. No admin bootstrap is needed: PocketBase serves /api/health
# and initializes pb_data before any superuser exists.
persistence:
  enabled: true
  size: 1Gi

apiVersion: v2
name: connaisseur
description: "Connaisseur, the Kubernetes admission controller that verifies container image signatures (Cosign/Sigstore, Notary v1 and v2) against your trust roots before workloads are admitted. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "3.13.1"
keywords:
  - connaisseur
  - admission-controller
  - image-signature
  - cosign
  - notary
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sse-secure-systems/connaisseur
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned connaisseur to a rebuilt image digest (no application version change)."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: connaisseur
      image: ghcr.io/quenchworks/images/connaisseur@sha256:aba1d27c008e2ba8b103ca314c12b0987036df2843684abbc7f9a4d7ea405c2b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

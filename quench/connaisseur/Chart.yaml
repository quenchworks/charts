apiVersion: v2
name: connaisseur
description: "Connaisseur, the Kubernetes admission controller that verifies container image signatures (Cosign/Sigstore, Notary v1 and v2) against your trust roots before workloads are admitted. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "3.13.1"
keywords:
  - connaisseur
  - admission-controller
  - image-signature
  - cosign
  - notary
  - supply-chain

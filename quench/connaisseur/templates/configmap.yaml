apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # /app/config/config.yaml: validators and the image policy
  config.yaml: |-
    {{- toYaml (dict "validators" .Values.validators "policy" .Values.policy) | nindent 4 }}
  # /app/alerts/config.yaml: an empty file fails to parse, so the default is {}
  alerts.yaml: |-
    {{- toYaml (.Values.alerting | default dict) | nindent 4 }}

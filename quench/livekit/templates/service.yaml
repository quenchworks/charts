apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: rtc-tcp
      port: {{ .Values.service.rtcTcpPort }}
      targetPort: rtc-tcp
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

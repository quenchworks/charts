apiVersion: v2
name: sealed-secrets
description: "Sealed Secrets, the Kubernetes controller that decrypts one-way-encrypted SealedSecret resources into regular Secrets, so secrets can live safely in Git. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "0.38.4"
kubeVersion: ">=1.24.0-0"
keywords:
  - sealed-secrets
  - secrets
  - gitops
  - encryption
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/bitnami-labs/sealed-secrets
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: security
  artifacthub.io/crds: |
    - kind: SealedSecret
      version: v1alpha1
      name: sealedsecrets.bitnami.com
      displayName: Sealed Secret
      description: An encrypted Secret that only the in-cluster controller's private key can decrypt.
  artifacthub.io/images: |
    - name: sealed-secrets
      image: ghcr.io/quenchworks/images/sealed-secrets@sha256:f26dcd0283bf9e50f8dfe2650c969b5c6bd44397e15ea1f0707ee516974cfb2e
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

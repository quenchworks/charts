{{/* The controller serves /healthz on its HTTP port as soon as the HTTP server is
     up, which is also when it has loaded (or generated) its sealing key. Used for
     both liveness and readiness. */}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 2 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sealed-secrets.serviceAccountName" . }}
      {{/* The controller talks to the API server on every reconcile, so it needs
           its ServiceAccount token mounted. */}}
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: sealed-secrets
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/controller"]
          args:
            - "--key-prefix={{ .Values.controller.keyPrefix }}"
            - "--key-size={{ .Values.controller.keySize }}"
            {{- with .Values.controller.keyRenewPeriod }}
            - "--key-renew-period={{ . }}"
            {{- end }}
            - "--all-namespaces={{ .Values.controller.allNamespaces }}"
            {{- with .Values.controller.additionalNamespaces }}
            - "--additional-namespaces={{ . }}"
            {{- end }}
            {{- with .Values.controller.labelSelector }}
            - "--label-selector={{ . }}"
            {{- end }}
            - "--update-status={{ .Values.controller.updateStatus }}"
            - "--log-level={{ .Values.controller.logLevel }}"
            - "--log-format={{ .Values.controller.logFormat }}"
            - "--listen-addr=:{{ .Values.controller.httpPort }}"
            - "--listen-metrics-addr=:{{ .Values.controller.metricsPort }}"
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{/* Root filesystem is read-only; the controller only ever writes scratch to /tmp. */}}
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

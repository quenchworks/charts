{{/*
Global NGINX configuration ConfigMap. The controller is pointed at this via
--configmap=$(POD_NAMESPACE)/<name> and watches it: changes here are rendered
into nginx.conf and reloaded without a pod restart. Ships empty (NGINX defaults);
operators populate data: with the documented ingress-nginx ConfigMap keys.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ingress-nginx.configMapName" . }}
  labels:
    {{- include "ingress-nginx.controllerLabels" . | nindent 4 }}
data:
  allow-snippet-annotations: "false"

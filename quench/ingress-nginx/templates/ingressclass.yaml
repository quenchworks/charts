{{- if .Values.ingressClass.create }}
{{/*
The IngressClass this controller serves. Its spec.controller value must match the
controller's --controller-class flag; an Ingress is handled by this controller
only when its ingressClassName resolves to this class.
*/}}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass.name }}
  labels:
    {{- include "ingress-nginx.controllerLabels" . | nindent 4 }}
  {{- if .Values.ingressClass.isDefaultClass }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: {{ .Values.ingressClass.controllerValue }}
{{- end }}

# The controller digest is the contract with the image factory. CI rewrites it
# from the image-published dispatch after every green image build. It is never a
# tag.
image:
  repository: ghcr.io/quenchworks/images/ingress-nginx
  digest: "sha256:8353b7f5cd55bd3585dd4dc51695a786c7dc2be72dcc313f65395023cf51b32f"
  pullPolicy: IfNotPresent

nameOverride: ""

# IngressClass this controller owns. controllerValue is the controller identity
# the controller advertises (--controller-class) and that the IngressClass spec
# points at; only Ingresses whose ingressClassName resolves to this class (or
# that carry the legacy kubernetes.io/ingress.class annotation) are served.
ingressClass:
  create: true
  name: nginx
  # Make this the cluster default IngressClass (Ingresses with no class use it).
  isDefaultClass: false
  controllerValue: "k8s.io/ingress-nginx"

controller:
  replicaCount: 1
  # Leader-election ID. With >1 replica only the leader writes status; the lease
  # is held in the release namespace (Role-scoped, no kube-system grant needed).
  electionID: ""
  # NGINX container ports. 80/443 are the data plane (the controller binds them
  # directly via the NET_BIND_SERVICE capability — see containerSecurityContext).
  containerPorts:
    http: 80
    https: 443
  # The healthz/metrics server (--healthz-port / default metrics listener). Probes
  # hit /healthz here; this is also the Prometheus scrape target.
  metricsPort: 10254
  # The admission webhook HTTPS port the apiserver dials (via the webhook Service).
  webhookPort: 8443
  logLevel: 2
  # Watch a single namespace instead of cluster-wide (empty = all namespaces).
  watchNamespace: ""
  # Extra raw flags appended to nginx-ingress-controller (advanced).
  extraArgs: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

  service:
    # Default is LoadBalancer for real clusters. The ci/default-values.yaml and
    # the kind install gate override this to NodePort so kind can route to it.
    type: LoadBalancer
    # NodePorts used only when type is NodePort (kind / bare-metal). Leave empty
    # to let the apiserver allocate.
    nodePorts:
      http: ""
      https: ""
    # Annotations for the controller Service (e.g. cloud LB controls).
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""

  # The validating admission webhook for Ingress objects. It rejects malformed
  # Ingress resources (bad nginx snippets, conflicting paths) at admission time.
  # The serving cert + caBundle are bootstrapped self-contained at install time:
  # Helm generates a self-signed CA + serving cert (Sprig genSignedCert) into the
  # webhook cert Secret, mounts it into the controller, and bakes the matching
  # caBundle straight into the ValidatingWebhookConfiguration. No cert-manager,
  # no extra Jobs, no kubectl image — the cert is regenerated only on a fresh
  # install (kept stable across upgrades via a lookup of the existing Secret).
  admissionWebhooks:
    enabled: true
    # Reject Ingress writes when the webhook is unreachable. Fail is the safe
    # default; the webhook only validates Ingress objects, so it cannot deadlock
    # the controller's own startup (the controller creates no Ingresses).
    failurePolicy: Fail
    timeoutSeconds: 10
    # Validity of the generated self-signed serving cert, in days.
    certValidityDays: 3650

serviceAccount:
  create: true
  # Override the derived ServiceAccount name. Empty = derive from release fullname.
  name: ""
  annotations: {}

# RBAC is required: the controller needs cluster-wide read of Ingresses,
# IngressClasses, Services, Endpoints/EndpointSlices, Secrets, ConfigMaps, Nodes
# and Pods, write of ingresses/status and event recording, plus a namespaced Role
# for the leader-election Lease and its own ConfigMap. The admission webhook cert
# is generated by Helm, so no cert-bootstrap Job RBAC is needed.
rbac:
  create: true

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 300
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
# Container security context overrides MERGE over the hardened quench-common
# defaults (drop ALL caps, no privilege escalation, readonly rootfs, seccomp
# RuntimeDefault). The controller legitimately binds 80/443, so this one chart
# adds back NET_BIND_SERVICE (and nothing else) on top of the dropped-ALL base.
containerSecurityContext:
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]

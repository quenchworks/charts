# zabbix: the Zabbix server, the web frontend and PostgreSQL.
#
# Names of the database pieces are FIXED (zabbix-postgresql, the zabbix-db Secret)
# because the postgresql subchart takes them as plain values. One install per namespace.
# No SNMP checks: the server image is built without net-snmp (Wolfi's has no MD5).

# The digests below are the contract with the image factory. They are never tags.
image:
  repository: ghcr.io/quenchworks/images/zabbix-server
  digest: "sha256:3a2eb7b73ca3cc728e41ae3636cf8aa52127c542b79cf78e9c66f35fa7545950"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Admin password. Upstream's data creates Admin/zabbix; the schema init replaces
# that password on first install. Empty generates one, kept across upgrades in the
# zabbix-db Secret (key admin-password).
admin:
  password: ""

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "2", memory: 1Gi }

server:
  # Extra zabbix_server.conf settings, one key per line (e.g. StartPollers: 10,
  # CacheSize: 64M). The database settings come from the zabbix-db Secret.
  config: {}
  service:
    type: ClusterIP

# Native TLS: the web frontend's nginx also serves HTTPS on 8443 (web.service.httpsPort) beside
# HTTP on 8080, with the certificate mounted at /tls (a drop-in in the image's server block). The
# server's trapper port (10051) is unchanged. The certificate comes from the first source set:
# existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

web:
  image:
    repository: ghcr.io/quenchworks/images/zabbix-web
    digest: "sha256:0ec7eef488b1c6f6de9e9adba35e08d93538c7d50f29b06c26a5031e563254f4"
  replicaCount: 1
  # Shown in the frontend's title bar and tab.
  serverName: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  service:
    type: ClusterIP
    port: 8080
    # HTTPS (the web pod's 8443), only with tls.enabled
    httpsPort: 8443

# ---------------------------------------------------------------------------
# PostgreSQL (subchart). The schema init loads Zabbix's tables on first install;
# later upgrades leave existing tables alone (the server upgrades them itself).
# ---------------------------------------------------------------------------
postgresql:
  fullnameOverride: zabbix-postgresql
  auth:
    username: zabbix
    database: zabbix_db
    existingSecret: zabbix-db
    existingSecretPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

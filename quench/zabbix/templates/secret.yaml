{{/*
zabbix-db: the database password (the postgresql subchart reads it as existingSecret),
the Admin password the schema init sets, and the server's DB include file. Read back
from the live Secret first, so upgrades keep matching the running database.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "zabbix-db" -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $db := index $prior "postgres-password" | default "" | b64dec -}}
{{- if not $db }}{{- $db = randAlphaNum 32 }}{{- end -}}
{{- $admin := .Values.admin.password -}}
{{- if not $admin }}{{- $admin = index $prior "admin-password" | default "" | b64dec }}{{- end -}}
{{- if not $admin }}{{- $admin = randAlphaNum 24 }}{{- end -}}
{{- $conf := printf "DBHost=zabbix-postgresql\nDBPort=5432\nDBName=%s\nDBUser=%s\nDBPassword=%s\n" .Values.postgresql.auth.database .Values.postgresql.auth.username $db -}}
apiVersion: v1
kind: Secret
metadata:
  name: zabbix-db
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    # The database outlives a helm uninstall when its PVC does; keep its password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $db | b64enc | quote }}
  admin-password: {{ $admin | b64enc | quote }}
  db.conf: {{ $conf | b64enc | quote }}

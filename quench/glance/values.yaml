# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/glance
  digest: "sha256:25896268a378856ee8e6b0a6805e58c90ad577f952d119f2a358deb9e48f74f1"
  pullPolicy: IfNotPresent

nameOverride: ""

# Stateless: scale freely.
replicaCount: 1
updateStrategy: {}

# glance.yml as YAML (https://github.com/glanceapp/glance/blob/main/docs/configuration.md).
# server.port is fixed by the chart. Use ${VAR} for secrets and pass them with extraEnvVarsSecret.
config:
  pages:
    - name: Home
      columns:
        - size: small
          widgets:
            - type: calendar
        - size: full
          widgets:
            - type: rss
              limit: 10
              collapse-after: 5
              feeds:
                - url: https://kubernetes.io/feed.xml
                  title: Kubernetes
            - type: releases
              repositories:
                - glanceapp/glance

# More files beside glance.yml in /app/config, for `!include: <name>` in the config.
extraConfigFiles: {}

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 8080
  # HTTPS Service port (to the TLS sidecar's 8443), only with tls.enabled
  httpsPort: 443
  annotations: {}
  externalTrafficPolicy: ""

# TLS: Glance serves plain HTTP, so with tls.enabled a caddy sidecar terminates HTTPS on 8443
# (Service port service.httpsPort) and proxies to it over localhost. Certificate: existingSecret,
# then certManager, else a Helm-generated CA.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# The TLS sidecar (our caddy image, pinned by digest).
proxy:
  image:
    repository: ghcr.io/quenchworks/images/caddy
    digest: "sha256:6377c513134e78bd41fad0819c9d45830b1868398c1805a5b3ee8494f93072d7"
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 500m, memory: 128Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

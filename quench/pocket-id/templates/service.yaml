apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # one port: Pocket ID serves HTTPS on it instead of HTTP when tls.enabled
    - name: {{ ternary "https" "http" (eq (include "quench-common.tls.enabled" .) "true") }}
      port: {{ .Values.service.port }}
      targetPort: web
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

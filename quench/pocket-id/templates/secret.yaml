{{- /* ENCRYPTION_KEY encrypts the signing keys Pocket ID stores; losing it makes them unreadable,
       so it is generated once and read back on upgrade. */}}
{{- if not .Values.encryptionKey.existingSecret }}
{{- $name := include "pocket-id.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.encryptionKey.value | default (get (($old | default dict).data | default dict) "encryption-key" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  encryption-key: {{ $key | b64enc | quote }}
{{- end }}

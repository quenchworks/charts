# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false        # emptyDir at /alertmanager for the gate
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 256Mi }
# A trivial valid config: one route, one no-op receiver.
alertmanagerConfig: |
  route:
    receiver: "null"
    group_by: ["alertname"]
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 1h
  receivers:
    - name: "null"

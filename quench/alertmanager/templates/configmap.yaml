apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alertmanager.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/alertmanager/alertmanager.yml (the entrypoint's --config.file).
  # alertmanagerConfig is templated so values render inside it; edit it and
  # `helm upgrade` (the pod checksum annotation rolls the StatefulSet).
  alertmanager.yml: |-
    {{- tpl .Values.alertmanagerConfig . | nindent 4 }}
  {{- if include "quench-common.tls.enabled" . }}
  # exporter-toolkit web config: HTTPS with the chart's certificate (re-read on each
  # handshake, so a renewed certificate needs no restart)
  web.yml: |-
    tls_server_config:
      cert_file: /tls/tls.crt
      key_file: /tls/tls.key
  {{- end }}

{{/* Alertmanager exposes lifecycle endpoints on the web port: /-/healthy (process
     up) and /-/ready (ready to serve the API/UI). */}}
{{- $liveness := dict "httpGet" (dict "path" "/-/healthy" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/-/ready" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "alertmanager.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when alertmanager.yml changes (a live POST /-/reload is also
        # available on the API).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "alertmanager.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: alertmanager
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{/* Flags pass through the entrypoint's "$@". The entrypoint already pins
               --config.file (AM_CONFIG_FILE), --storage.path (AM_STORAGE_PATH) and
               --web.listen-address (AM_WEB_LISTEN). When replicaCount > 1 we bind the
               gossip mesh and point each pod at every peer over the headless service
               for HA dedup/silence sharing. */}}
          args:
            {{- if gt (int .Values.replicaCount) 1 }}
            - --cluster.listen-address=0.0.0.0:{{ .Values.service.clusterPort }}
            {{- $fullname := include "quench-common.fullname" . }}
            {{- $headless := include "alertmanager.headlessName" . }}
            {{- $ns := .Release.Namespace }}
            {{- $port := .Values.service.clusterPort }}
            {{- range $i := until (int .Values.replicaCount) }}
            - --cluster.peer={{ $fullname }}-{{ $i }}.{{ $headless }}.{{ $ns }}.svc.cluster.local:{{ $port }}
            {{- end }}
            {{- else }}
            # Single replica: no gossip mesh. Bind to an empty address to disable it.
            - --cluster.listen-address=
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # read-only rootfs: the entrypoint pins the state path to AM_STORAGE_PATH
            # (the writable volume), the listener to AM_WEB_LISTEN, and the config to
            # AM_CONFIG_FILE (the ConfigMap mounted below).
            - name: AM_STORAGE_PATH
              value: /alertmanager
            - name: AM_WEB_LISTEN
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: AM_CONFIG_FILE
              value: /etc/alertmanager/alertmanager.yml
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - name: cluster-tcp
              containerPort: {{ .Values.service.clusterPort }}
              protocol: TCP
            - name: cluster-udp
              containerPort: {{ .Values.service.clusterPort }}
              protocol: UDP
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # nflog + silences state. The only writable persistent state Alertmanager
            # keeps; must be a writable mount on the read-only rootfs.
            - name: storage
              mountPath: /alertmanager
            # mount the single config file over the image's default, leaving the rest
            # of /etc/alertmanager (read-only rootfs) intact.
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            # writable scratch for the read-only rootfs.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "alertmanager.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: storage
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

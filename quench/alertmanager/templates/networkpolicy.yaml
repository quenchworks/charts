{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Alertmanager has no built-in auth: this policy is the trust boundary. http
    # carries the web UI + v2 API (Prometheus posts alerts here, users open the UI).
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    {{- if gt (int .Values.replicaCount) 1 }}
    # HA gossip mesh (9094, tcp+udp): only the chart's own pods peer with each other.
    - ports:
        - port: cluster-tcp
          protocol: TCP
        - port: cluster-udp
          protocol: UDP
      from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
    {{- end }}
{{- end }}

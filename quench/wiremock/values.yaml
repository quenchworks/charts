# Quenchworks WireMock on the QuenchWorks wiremock image (nonroot, 0-CVE, cosign-signed,
# pinned by digest). Stubs come from values (loaded at start) or the admin API (in memory,
# lost on restart).
image:
  repository: ghcr.io/quenchworks/images/wiremock
  digest: "sha256:6864c029600bcf8bc238ddaf05b272919d4d7dd88d03790a00ee9a42000b226b"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Each replica keeps its own admin-API stubs and journal; use more than one only when
# every stub comes from values.
replicas: 1

# Stub files, as WireMock's mappings/ directory: file name to JSON (an object or a string).
#   mappings:
#     hello.json:
#       request: { method: GET, urlPath: /hello }
#       response: { status: 200, body: "hi {{request.query.name}}", transformers: [response-template] }
mappings: {}
# Response bodies, as WireMock's __files/ directory (bodyFileName in a stub): name to content.
files: {}

# Render every response as a handlebars template (otherwise per stub, with
# transformers: [response-template]).
globalResponseTemplating: false

# https.enabled turns on WireMock's HTTPS port 8443 with its built-in self-signed certificate.
https:
  enabled: false

# Native TLS with a real certificate: HTTPS on 8443 (Service service.httpsPort) serves the
# chart certificate beside HTTP on 8080 (implies https.enabled). WireMock reads only a
# keystore, so an init container on the openssl image builds a PKCS12. The certificate comes
# from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:914fbcf857be13a249ebb27c4266f30ced006e80ffc5b63a8c00298bd211e519"
  pullPolicy: IfNotPresent

# More WireMock flags, e.g. --verbose, --max-request-journal-entries=1000, --no-request-journal.
extraArgs: []
javaOpts: "-XX:MaxRAMPercentage=75"
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 768Mi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8080
  httpsPort: 8443

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

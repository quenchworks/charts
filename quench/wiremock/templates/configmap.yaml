apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-mappings
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $name, $stub := .Values.mappings }}
  {{ $name }}: |
    {{- if kindIs "string" $stub }}
    {{- $stub | nindent 4 }}
    {{- else }}
    {{- toJson $stub | nindent 4 }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-files
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.files }}
  {{ $name }}: {{ $body | toString | quote }}
  {{- end }}

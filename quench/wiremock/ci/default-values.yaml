# Install gate on kind: one templated stub and one body file from values, HTTPS on.
mappings:
  hello.json:
    request: { method: GET, urlPath: /hello }
    response:
      status: 200
      transformers: [response-template]
      body: "hi {{request.query.name}} {{math 2 '+' 3}}"
  file.json: '{"request":{"method":"GET","urlPath":"/file"},"response":{"status":200,"bodyFileName":"greeting.txt"}}'
files:
  greeting.txt: "from a file"
https:
  enabled: true

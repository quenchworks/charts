{{/* Jetty serves on 8080 but GET / is 404 until a web app claims the root context,
     so probes are tcpSocket: they gate on the connector accepting, not on an HTTP
     status. The startup probe is generous to cover JVM start and web app deploys. */}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 3 -}}
{{- $readiness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 3 -}}
{{- $startup := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 10 "periodSeconds" 5 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "jetty.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if or .Values.initContainers (include "quench-common.tls.enabled" .) }}
      initContainers:
        {{- include "quench-common.tls.pkcs12InitContainer" (dict "ctx" . "image" (printf "%s@%s" .Values.openssl.repository .Values.openssl.digest) "password" "changeit") | nindent 8 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: jetty
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- if include "quench-common.tls.enabled" . }}
          # Jetty's ssl + https modules on 8443 from the PKCS12 the init container builds. The
          # keystore password guards nothing extra: the PEM key it comes from is in the same pod.
          args:
            - --module=ssl,https
            - jetty.ssl.port=8443
            - jetty.sslContext.keyStoreType=PKCS12
            - jetty.sslContext.keyStorePath=/tls-pkcs12/keystore.p12
            - jetty.sslContext.keyStorePassword=changeit
          {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if include "quench-common.tls.enabled" . }}
            - name: https
              containerPort: 8443
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # read-only rootfs: Jetty unpacks WARs and keeps work files in
            # java.io.tmpdir, which the image points at /tmp.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.pkcs12VolumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.tls.pkcs12Volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/pushgateway
  digest: "sha256:ec48d07f06a66fb01ee6496a736a083b7ec4e1a7be3a2d6e1d6e60042c59d4c9"
  pullPolicy: IfNotPresent

nameOverride: ""

# Pushgateway keeps pushed metrics in one process: run one replica (two would each hold a
# different subset). The Deployment uses Recreate so a persistent volume is never shared.
replicaCount: 1
updateStrategy:
  type: Recreate

# Keep pushed metrics across restarts in a PersistentVolumeClaim (written every interval).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}
  interval: 5m

# Enable /api/v1/admin/wipe (deletes every group).
adminApi: false

# Extra `pushgateway` flags, e.g. --push.disable-consistency-check.
extraArgs: []

# TLS on the listener (exporter-toolkit web config); clients and Prometheus then scrape
# https://. The first source set wins:
# existingSecret, then certManager, else a Helm-generated self-signed CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: "1", memory: 256Mi }

service:
  type: ClusterIP
  port: 9091
  annotations: {}
  externalTrafficPolicy: ""

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

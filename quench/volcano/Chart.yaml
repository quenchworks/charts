apiVersion: v2
name: volcano
description: "Volcano: batch scheduler and job controller for AI, ML and HPC workloads, with gang scheduling, queues, fair share and Job, Queue and PodGroup resources. The scheduler, controllers, admission webhooks and CRDs ship with the chart. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.16.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - volcano
  - scheduler
  - batch
  - gang-scheduling
  - hpc

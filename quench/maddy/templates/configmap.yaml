{{- $tls := include "quench-common.tls.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  maddy.conf: |
    $(hostname) = {{ required "hostname is required: the mail server's public name, e.g. mx.example.com" .Values.hostname }}
    $(primary_domain) = {{ required "primaryDomain is required, e.g. example.com" .Values.primaryDomain }}
    $(local_domains) = $(primary_domain){{ range .Values.extraDomains }} {{ . }}{{ end }}
    hostname $(hostname)
    {{- if $tls }}
    tls file /tls/tls.crt /tls/tls.key
    {{- else }}
    # no certificate: plain listeners, logins allowed without TLS (inside the cluster or behind a TLS proxy only)
    tls off
    {{- end }}

    auth.pass_table local_authdb {
        table sql_table {
            driver sqlite3
            dsn credentials.db
            table_name passwords
        }
    }

    storage.imapsql local_mailboxes {
        driver sqlite3
        dsn imapsql.db
    }

    # MX: mail for local domains goes to local mailboxes
    smtp tcp://0.0.0.0:2525 {
        limits {
            all rate 20 1s
            all concurrency 10
        }
        destination $(local_domains) {
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }

    # submission: authenticated users send mail
    submission tcp://0.0.0.0:1587 {
        {{- if not $tls }}
        insecure_auth yes
        {{- end }}
        auth &local_authdb
        source $(local_domains) {
            destination $(local_domains) {
                deliver_to &local_mailboxes
            }
            default_destination {
                deliver_to &remote_queue
            }
        }
        default_source {
            reject 501 5.1.8 "Non-local sender domain"
        }
    }

    # maddy reads "{}" on one line as a block name: keep the braces on separate lines
    target.remote outbound_delivery {
    }

    target.queue remote_queue {
        target &outbound_delivery
    }

    imap tcp://0.0.0.0:1143 {{- if $tls }} tls://0.0.0.0:1993{{ end }} {
        {{- if not $tls }}
        insecure_auth yes
        {{- end }}
        auth &local_authdb
        storage &local_mailboxes
    }
    {{- with .Values.extraConfig }}

    {{ . | nindent 4 }}
    {{- end }}

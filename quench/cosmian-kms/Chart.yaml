apiVersion: v2
name: cosmian-kms
description: "Cosmian KMS -- KMIP 2.1 key management server with PKCS#11 and Google/Microsoft CSE support, the only KMIP speaker in this catalog. Shipped under BUSL-1.1, which is NOT OSI-approved AND caps production use at 2 vCPUs while barring third-party offering; read the licence before deploying. Built non-FIPS against current OpenSSL, so NOT FIPS 140-3 despite upstream's description. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "5.25.0"
kubeVersion: ">=1.23.0-0"
keywords:
  - kms
  - kmip
  - key-management
  - encryption
  - pkcs11
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Cosmian/kms
maintainers:
  - name: mkabumattar
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Cosmian KMS 5.25.0 on a hardened, nonroot, 0-CVE image built from source, pinned by digest."
    - kind: added
      description: "SQLite on a PVC by default, with PostgreSQL / MySQL / Redis-Findex backends passed through; optional TLS termination, Ingress, and a namespace-scoped NetworkPolicy."
  artifacthub.io/category: security
  artifacthub.io/images: |

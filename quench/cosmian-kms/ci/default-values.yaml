# Install gate. No image override: uses the chart's real CI-maintained digest.
# emptyDir instead of a PVC keeps the gate small; SQLite still works because the
# image's work-dir points at the mount either way.
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1, memory: 1Gi }

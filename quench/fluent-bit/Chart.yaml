    - kind: changed
      description: "Add an ArtifactHub changelog; maintenance re-release re-validated against the chart's pinned, signed image."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: fluent-bit
      image: ghcr.io/quenchworks/images/fluent-bit@sha256:6f8f931acdeb6c0b4b8c373e94314ca8f8e2f5144f708f51c27e4d09089f2b1b

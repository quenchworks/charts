# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest. Keeps the default config (dummy input -> stdout output + HTTP monitoring
# server on :2020) so the gate is self-contained -- it ships nowhere and needs no
# backend. Small resources for the kind runner.
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }

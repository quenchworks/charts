apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluent-bit.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /fluent-bit/etc/fluent-bit.conf and passed as `-c` to fluent-bit.
  # The image ships a minimal default that this replaces. Edit `config` in your
  # values and `helm upgrade`; the pod checksum annotation rolls the Deployment.
  fluent-bit.conf: |-
    {{- .Values.config | nindent 4 }}

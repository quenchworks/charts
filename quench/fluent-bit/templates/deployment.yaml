{{/* The HTTP monitoring server serves GET /api/v1/health -> 200 on :2020 (the
     [SERVICE] block enables it with HTTP_Server On + Health_Check On); use it for
     both liveness and readiness. */}}
{{- $liveness := dict "httpGet" (dict "path" "/api/v1/health" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/v1/health" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the Fluent Bit config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fluent-bit.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: fluent-bit
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- if .Values.command }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- end }}
          {{/* The image entrypoint already points fluent-bit at
               /fluent-bit/etc/fluent-bit.conf, which we mount over. Honor an
               explicit args override, otherwise leave the entrypoint as-is. */}}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          {{- if .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # mount the single config file; the read-only rootfs is otherwise intact.
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            # writable scratch for the read-only rootfs.
            - name: tmp
              mountPath: /tmp
            # writable buffer/storage dir for filesystem buffering (storage.path);
            # harmless when only memory buffering is used.
            - name: buffer
              mountPath: /var/log/flb-storage
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fluent-bit.configMapName" . }}
        - name: tmp
          emptyDir: {}
        - name: buffer
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

{{- $fullname := include "quench-common.fullname" . -}}
{{- $probe := dict "httpGet" (dict "path" "/v1/info" "port" "http") -}}
{{- $liveness := merge (dict "initialDelaySeconds" 30 "periodSeconds" 20 "timeoutSeconds" 5) $probe -}}
{{- $readiness := merge (dict "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5) (deepCopy $probe) -}}
{{- range $role := list "coordinator" "worker" }}
{{- $r := index $.Values $role }}
{{- if or (eq $role "coordinator") (gt (int $r.replicas) 0) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $role }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- /* one coordinator: Trino has no coordinator failover */}}
  replicas: {{ if eq $role "coordinator" }}1{{ else }}{{ $r.replicas }}{{ end }}
  selector:
    matchLabels:
      {{- include "trino.componentLabels" (dict "ctx" $ "component" $role) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trino.componentLabels" (dict "ctx" $ "component" $role) | nindent 8 }}
        {{- include "quench-common.podLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trino.serviceAccountName" $ }}
      securityContext:
        {{- include "quench-common.podSecurityContext" $ | nindent 8 }}
      {{- include "quench-common.podSpecFields" $ | nindent 6 }}
      {{- $tls := and (eq $role "coordinator") (eq (include "quench-common.tls.enabled" $) "true") }}
      {{- if $tls }}
      initContainers:
        # Trino reads one PEM file holding the key and the chain; the image has no shell
        - name: tls-pem
          image: "{{ $.Values.busybox.repository }}@{{ $.Values.busybox.digest }}"
          imagePullPolicy: {{ $.Values.busybox.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          command: ["/bin/sh", "-c", "cat /tls/tls.key /tls/tls.crt > /tls-pem/server.pem"]
          volumeMounts:
            {{- include "quench-common.tls.volumeMount" $ | nindent 12 }}
            - name: tls-pem
              mountPath: /tls-pem
        {{- with $.Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- include "quench-common.initContainers" $ | nindent 6 }}
      {{- end }}
      containers:
        - name: trino
          image: {{ include "quench-common.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          {{- with $.Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if $tls }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" $ "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" $ "name" "readiness" "default" $readiness) | nindent 10 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            # One projected volume: a catalog ConfigMap mounted inside the config
            # ConfigMap's read-only volume cannot get its mount point created.
            - name: config
              mountPath: /etc/trino
              readOnly: true
            - name: data
              mountPath: /data/trino
            - name: tmp
              mountPath: /tmp
            {{- if $tls }}
            - name: tls-pem
              mountPath: /tls-pem
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" $ | nindent 12 }}
        {{- include "quench-common.sidecars" $ | nindent 8 }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ $fullname }}-{{ $role }}
              {{- if $.Values.catalogs }}
              - configMap:
                  name: {{ $fullname }}-catalog
                  items:
                    {{- range $name, $_ := $.Values.catalogs }}
                    - key: {{ $name }}.properties
                      path: catalog/{{ $name }}.properties
                    {{- end }}
              {{- end }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        {{- include "quench-common.tls.volume" $ | nindent 8 }}
        - name: tls-pem
          emptyDir: { medium: Memory }
        {{- end }}
        {{- include "quench-common.extraVolumes" $ | nindent 8 }}
{{- end }}
{{- end }}

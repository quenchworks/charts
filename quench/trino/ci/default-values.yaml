# Install gate: one coordinator and one worker, so the gate proves discovery.
# No image override: the install uses the chart's CI-maintained digest.
worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "1", memory: 1536Mi }
coordinator:
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "1", memory: 1536Mi }

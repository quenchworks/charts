apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "quench-common.fullname" . }}
  # the accounts, saved servers and sessions are a SQLite file on one RWO volume
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pgadmin
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if include "quench-common.tls.enabled" . }}
          # appended to the image's gunicorn command: 5050 serves HTTPS only
          args: ["--certfile=/tls/tls.crt", "--keyfile=/tls/tls.key"]
          {{- end }}
          env:
            - { name: PGADMIN_SETUP_EMAIL, value: {{ .Values.admin.email | quote }} }
            - name: PGADMIN_SETUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "quench-common.fullname" .) .Values.admin.existingSecret }}
                  key: admin-password
            {{- range $k, $v := .Values.config }}
            - name: PGADMIN_CONFIG_{{ $k }}
              {{- if kindIs "string" $v }}
              value: {{ printf "%q" $v | quote }}
              {{- else if kindIs "bool" $v }}
              value: {{ ternary "True" "False" $v | quote }}
              {{- else }}
              value: {{ toJson $v | quote }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5050
          {{- $scheme := ternary "HTTPS" "HTTP" (eq (include "quench-common.tls.enabled" .) "true") }}
          # the first start creates the config database and the admin
          startupProbe:
            httpGet: { path: /misc/ping, port: http, scheme: {{ $scheme }} }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /misc/ping, port: http, scheme: {{ $scheme }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /misc/ping, port: http, scheme: {{ $scheme }} }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/pgadmin }
            - { name: tmp, mountPath: /tmp }
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

# Quenchworks pgAdmin 4 on the QuenchWorks pgadmin image (nonroot, 0-CVE, cosign-signed,
# pinned by digest). Server mode: people sign in, and each has their own saved servers.
image:
  repository: ghcr.io/quenchworks/images/pgadmin
  digest: "sha256:38f4fa269c592f60f2abd5a1362c7636c17ee4b322404968d09bc665dc501e0d"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# The first administrator, created when pgAdmin starts on an empty data volume. With no
# password the chart generates one into its Secret (key admin-password).
admin:
  email: admin@example.com
  password: ""
  # a Secret with key admin-password instead
  existingSecret: ""

# Any config.py key, set through PGADMIN_CONFIG_<KEY>. Strings are passed as strings;
# numbers, booleans and lists as Python literals.
#   config:
#     MAX_LOGIN_ATTEMPTS: 5
#     ENHANCED_COOKIE_PROTECTION: false
config: {}

extraEnvVars: []

persistence:
  size: 2Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 5050

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

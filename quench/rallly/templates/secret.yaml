{{- /* SECRET_PASSWORD (Rallly signs sessions with it; 32+ characters), generated once and read back on upgrade, and
       the SMTP password when one is set in values. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $sp := get $old "secret-password" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secret-password: {{ $sp | b64enc | quote }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}

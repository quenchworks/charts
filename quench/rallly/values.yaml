# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rallly
  digest: "sha256:4ec2c453d17ba010d6195fe8cd5f05867789ccd57d526945f837b673e1afb10f"
  pullPolicy: IfNotPresent

nameOverride: ""

# Stateless (sessions and polls live in PostgreSQL): more replicas are fine.
replicaCount: 1
updateStrategy:
  type: RollingUpdate

# Required: the public URL users open (NEXT_PUBLIC_BASE_URL; sign-in checks the request origin against it) and the
# help address shown to users.
baseUrl: ""
supportEmail: ""
noreplyEmail: ""       # the From address of login codes and notifications (defaults to supportEmail)
# Who may register: comma-separated addresses or patterns such as *@example.com. Empty: anyone who can receive mail.
allowedEmails: ""

# Sign-in is by a code sent by email, so Rallly needs SMTP to be usable.
smtp:
  host: ""
  port: 587
  secure: false           # true for implicit TLS (port 465); false uses STARTTLS when the server offers it
  rejectUnauthorized: true
  user: ""
  password: ""            # stored in the Secret <fullname> (smtp-password)
  existingSecret: ""      # or a Secret of your own holding it
  existingSecretKey: smtp-password

# SECRET_PASSWORD: generated into the Secret <fullname> (secret-password) and kept on upgrade.
secret:
  existingSecret: ""      # a Secret with key "secret-password" (32+ characters) instead

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" (the image creates them).
postgresql:
  enabled: true
  auth:
    username: rallly
    password: ""        # generated by the subchart if empty
    database: rallly
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false): a Secret holding the full DATABASE_URL.
externalDatabase:
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# More Rallly settings as environment variables, e.g. OIDC_NAME, OIDC_DISCOVERY_URL, OIDC_CLIENT_ID (+ OIDC_CLIENT_SECRET
# through extraEnvVarsSecret), MODERATION_ENABLED: "true", LOG_LEVEL: info.
settings: {}

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# Rallly has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: polls.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [polls.example.com], secretName: polls-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

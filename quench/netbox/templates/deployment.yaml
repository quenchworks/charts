{{- $tls := eq (include "quench-common.tls.enabled" .) "true" -}}
{{- /* Django refuses Hosts outside ALLOWED_HOSTS, and kubelet probes send the pod IP: probe as localhost. */}}
{{- $probe := dict "httpGet" (dict "path" "/login/" "port" (ternary "https" "http" $tls) "scheme" (ternary "HTTPS" "HTTP" $tls) "httpHeaders" (list (dict "name" "Host" "value" "localhost"))) "periodSeconds" 15 "timeoutSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml (.Values.updateStrategy | default (dict "type" "Recreate")) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "netbox.checksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # migrations, the admin user (created only when missing) and upgrade housekeeping; all idempotent
        - name: init
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              python manage.py migrate --no-input
              python manage.py shell --interface python -c "
              import os
              from users.models import User
              u = os.environ['ADMIN_USER']
              if not User.objects.filter(username=u).exists():
                  User.objects.create_superuser(u, os.environ['ADMIN_EMAIL'], os.environ['ADMIN_PASSWORD'])
                  print('created admin', u)
              "
              python manage.py trace_paths --no-input
              python manage.py remove_stale_contenttypes --no-input
              python manage.py reindex --lazy
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "netbox.env" . | nindent 12 }}
            - { name: ADMIN_USER, value: {{ .Values.admin.user | quote }} }
            - { name: ADMIN_EMAIL, value: {{ .Values.admin.email | quote }} }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "netbox.secretName" . }}, key: admin-password }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "netbox.mounts" . | nindent 12 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: netbox
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "netbox.env" . | nindent 12 }}
            - { name: GUNICORN_WORKERS, value: {{ .Values.gunicorn.workers | quote }} }
            - { name: GUNICORN_THREADS, value: {{ .Values.gunicorn.threads | quote }} }
            {{- if $tls }}
            # gunicorn serves HTTPS itself from the PEM pair at /tls
            - { name: GUNICORN_CMD_ARGS, value: "--certfile /tls/tls.crt --keyfile /tls/tls.key" }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "netbox.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" (merge (dict "failureThreshold" 20) (deepCopy $probe))) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "netbox.mounts" . | nindent 12 }}
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- include "netbox.volumes" . | nindent 8 }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

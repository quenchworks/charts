{{- /* The RQ worker (background jobs, scripts, reports, webhooks), from the app image. It reaches the database,
       Redis and the media volume only, so it gets no Service. */}}
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-worker
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include "netbox.checksum" . }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "rqworker", "high", "default", "low"]
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "netbox.env" . | nindent 12 }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "netbox.mounts" . | nindent 12 }}
      volumes:
        {{- include "netbox.volumes" . | nindent 8 }}
{{- end }}

{{- /* Django's secret key, the API token pepper (v2 tokens are hashed with it; changing it voids every token) and
       the admin password: generated once and read back on upgrade. NetBox wants both keys to be 50+ characters. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $admin := get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) }}
{{- $sk := get $old "secret-key" | b64dec | default (randAlphaNum 64) }}
{{- $pepper := get $old "api-token-pepper" | b64dec | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  secret-key: {{ $sk | b64enc | quote }}
  api-token-pepper: {{ $pepper | b64enc | quote }}
{{- end }}
{{- if .Values.extraConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-extra
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  extra.py: |
    {{- .Values.extraConfig | nindent 4 }}
{{- end }}

# Standalone install gate. The chart has no image and no workload, so the gate
# is an API-surface check: every CRD must become Established, and the apiserver
# must accept a real Server object, which exercises the shipped schema rather
# than just its presence.
#
# keep is left at the shipped default rather than a CI-only false, so the gate
# tests what users get. The kind cluster is destroyed after the run, so the
# survive-uninstall behaviour costs nothing here.
crds:
  keep: true

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# SQLite on an ephemeral emptyDir; a fixed encryption key and a host so n8n boots and
# serves /healthz.
persistence:
  enabled: false

n8n:
  host: "n8n.quenchworks.test"
  encryptionKey: "ci-test-encryption-key-0123456789abcdef"

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "2", memory: 1Gi }

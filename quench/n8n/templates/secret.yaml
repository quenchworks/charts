{{/*
The managed Secret carries:
  - encryption-key : N8N_ENCRYPTION_KEY, which protects stored credentials. Generated
    once (48 chars) and preserved across upgrades via lookup — a changed key makes every
    stored credential undecryptable. Not rendered when n8n.existingSecret is set.
  - db-password : the external PostgreSQL password (only when database.type=postgresdb
    and no externalDatabase.existingSecret is supplied).
  - runner-auth-token : the shared secret between n8n and the task-runner sidecar (only
    when taskRunners.enabled and no runner authToken is supplied inline). Persisted too.
*/}}
{{- $name := include "n8n.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderEnc := not .Values.n8n.existingSecret -}}
{{- $renderDb := and (eq .Values.database.type "postgresdb") (not .Values.database.postgresql.existingSecret) -}}
{{- $renderRunner := .Values.taskRunners.enabled -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderEnc }}
  {{- $enc := .Values.n8n.encryptionKey -}}
  {{- if and (not $enc) $existing (hasKey $existing.data "encryption-key") -}}
  {{- $enc = index $existing.data "encryption-key" | b64dec -}}
  {{- end -}}
  {{- if not $enc -}}{{- $enc = randAlphaNum 48 -}}{{- end }}
  encryption-key: {{ $enc | b64enc | quote }}
  {{- end }}
  {{- if $renderDb }}
  {{- $dbpw := .Values.database.postgresql.password -}}
  {{- if and (not $dbpw) $existing (hasKey $existing.data "db-password") -}}
  {{- $dbpw = index $existing.data "db-password" | b64dec -}}
  {{- end -}}
  {{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
  {{- if $renderRunner }}
  {{- $tok := .Values.taskRunners.authToken -}}
  {{- if and (not $tok) $existing (hasKey $existing.data "runner-auth-token") -}}
  {{- $tok = index $existing.data "runner-auth-token" | b64dec -}}
  {{- end -}}
  {{- if not $tok -}}{{- $tok = randAlphaNum 48 -}}{{- end }}
  runner-auth-token: {{ $tok | b64enc | quote }}
  {{- end }}

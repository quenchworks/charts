{{/* httpGet probes hit /healthz on the HTTP port: it returns 200 once n8n has run its DB
     migrations and is serving. The runtime image ships no shell HTTP client; the kubelet
     does the GET. First boot runs migrations (slow on Postgres), so readiness is generous. */}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 60 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
{{- $encSecret := include "n8n.encryptionSecretName" . -}}
{{- $encKey := include "n8n.encryptionSecretKey" . -}}
{{- $pg := .Values.database.postgresql -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "n8n.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: n8n
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # Public-facing identity used to build editor/webhook/OAuth-callback URLs.
            - name: N8N_HOST
              value: {{ .Values.n8n.host | quote }}
            - name: N8N_PROTOCOL
              value: {{ .Values.n8n.protocol | quote }}
            - name: N8N_PORT
              value: {{ .Values.service.port | quote }}
            - name: N8N_LISTEN_ADDRESS
              value: "0.0.0.0"
            {{- with .Values.n8n.webhookUrl }}
            - name: WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $encSecret }}
                  key: {{ $encKey }}
            # Database. SQLite (default) lives on the persistent volume under ~/.n8n.
            - name: DB_TYPE
              value: {{ .Values.database.type | quote }}
            {{- if eq .Values.database.type "postgresdb" }}
            - name: DB_POSTGRESDB_HOST
              value: {{ required "database.postgresql.host is required when database.type=postgresdb" $pg.host | quote }}
            - name: DB_POSTGRESDB_PORT
              value: {{ $pg.port | quote }}
            - name: DB_POSTGRESDB_DATABASE
              value: {{ $pg.database | quote }}
            - name: DB_POSTGRESDB_USER
              value: {{ $pg.user | quote }}
            - name: DB_POSTGRESDB_SCHEMA
              value: {{ $pg.schema | quote }}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.db.secretName" . }}
                  key: {{ include "n8n.db.secretPasswordKey" . }}
            {{- end }}
            {{- if .Values.taskRunners.enabled }}
            # External task runners: n8n hosts the broker in-process; the sidecar connects
            # over localhost with the shared auth token.
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.secretName" . }}
                  key: runner-auth-token
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read-only rootfs: n8n writes ~/.n8n (encryption key, config, binary data and
            # the SQLite db) and needs a writable /tmp.
            - name: data
              mountPath: /home/node/.n8n
            # n8n compiles static assets into ~/.cache on boot; keep it writable and
            # ephemeral (regenerated each start) so it survives the read-only rootfs.
            - name: cache
              mountPath: /home/node/.cache
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- if .Values.taskRunners.enabled }}
        - name: task-runner
          image: "{{ .Values.taskRunners.image.repository }}@{{ .Values.taskRunners.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://127.0.0.1:{{ .Values.taskRunners.brokerPort }}"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.secretName" . }}
                  key: runner-auth-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.taskRunners.resources | nindent 12 }}
        {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        # /tmp scratch (read-only rootfs). The `data` volume for ~/.n8n comes from the
        # volumeClaimTemplate below unless persistence is disabled or bound to an existing PVC.
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

apiVersion: v2
name: yopass
description: "Yopass: share secrets through one-time links; the browser encrypts with OpenPGP and the server keeps only ciphertext in Memcached (bundled) or Redis until it expires or is read. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "16.1.0"
keywords:
  - yopass
  - secrets
  - one-time
  - password-sharing
  - openpgp
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/jhaals/yopass
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Yopass 16.1.0 on the bundled memcached (or Memcached or Redis of your own), native TLS, read-only root filesystem."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: yopass
      image: ghcr.io/quenchworks/images/yopass@sha256:e4dd149fd8627de2813586e987517a7dfd501f40393c23409fbe5e9a4ee8c9fb
    - name: memcached
      image: ghcr.io/quenchworks/images/memcached@sha256:cca55906d609f555ab24aea1e373e21ba3ef3e38c61939f85e602b7979a92083
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: memcached
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: memcached.enabled

{{- $ns := .Release.Namespace -}}
{{- $full := include "quench-common.fullname" . -}}
{{- range $name, $c := .Values.controllers }}
{{- if $c.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-controller
---
{{- end }}
{{- end }}
# every controller manages its own CRDs' status, events and leases (upstream's
# crd-controller role, copied from Flux's install manifest)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}-crd-controller-{{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - source.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - kustomize.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - helm.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - notification.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - image.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - source.extensions.fluxcd.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - ''
    resources:
    - namespaces
    - secrets
    - configmaps
    - serviceaccounts
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - ''
    resources:
    - configmaps
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - ''
    resources:
    - configmaps/status
    verbs:
    - get
    - update
    - patch
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - ''
    resources:
    - serviceaccounts/token
    verbs:
    - create
  - nonResourceURLs:
    - /livez/ping
    verbs:
    - head
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}-crd-controller-{{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $full }}-crd-controller-{{ $ns }}
subjects:
{{- range $name, $c := .Values.controllers }}
{{- if $c.enabled }}
  - kind: ServiceAccount
    name: {{ $full }}-{{ $name }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}
{{- if .Values.clusterReconciler.enabled }}
---
# kustomize- and helm-controller apply whatever the Git repositories hold, so upstream
# binds them to cluster-admin. Set clusterReconciler.enabled=false and grant narrower
# roles (with serviceAccountName on each Kustomization/HelmRelease) to restrict them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}-cluster-reconciler-{{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
{{- range $name := list "kustomize" "helm" }}
{{- if (index $.Values.controllers $name).enabled }}
  - kind: ServiceAccount
    name: {{ $full }}-{{ $name }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}
{{- end }}
---
# aggregated into the built-in admin/edit/view roles, as upstream ships them
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}-edit-{{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups:
    - notification.toolkit.fluxcd.io
    - source.toolkit.fluxcd.io
    - source.extensions.fluxcd.io
    - helm.toolkit.fluxcd.io
    - image.toolkit.fluxcd.io
    - kustomize.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - create
    - delete
    - deletecollection
    - patch
    - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}-view-{{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups:
    - notification.toolkit.fluxcd.io
    - source.toolkit.fluxcd.io
    - source.extensions.fluxcd.io
    - helm.toolkit.fluxcd.io
    - image.toolkit.fluxcd.io
    - kustomize.toolkit.fluxcd.io
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch

{{- $full := include "quench-common.fullname" . -}}
{{- range $name, $c := .Values.controllers }}
{{- if $c.enabled }}
{{- /* controllers that keep an artifact or database directory, and that serve HTTP */}}
{{- $store := has $name (list "source" "image-reflector" "source-watcher") }}
{{- $http := has $name (list "source" "notification" "source-watcher") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-controller
spec:
  replicas: 1
  {{- if eq $name "source" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}-controller
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}-controller
    spec:
      serviceAccountName: {{ $full }}-{{ $name }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "quench-common.podSecurityContext" $ | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ $c.image.repository }}@{{ $c.image.digest }}"
          imagePullPolicy: IfNotPresent
          args:
            {{- if and (ne $name "notification") $.Values.controllers.notification.enabled }}
            - --events-addr={{ include "flux.notificationAddr" $ }}
            {{- end }}
            - --watch-all-namespaces={{ $.Values.watchAllNamespaces }}
            - --log-level={{ $.Values.logLevel }}
            - --log-encoding=json
            - --enable-leader-election
            {{- if $store }}
            - --storage-path=/data
            {{- end }}
            {{- if eq $name "source" }}
            - --storage-adv-addr={{ include "flux.sourceAddr" $ }}
            {{- end }}
            {{- if eq $name "source-watcher" }}
            - --storage-adv-addr={{ include "flux.sourceWatcherAddr" $ }}
            {{- end }}
            {{- range $c.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: manager
                  resource: limits.memory
            {{- if eq $name "source" }}
            - name: TUF_ROOT
              value: /tmp/.sigstore
            {{- end }}
          ports:
            {{- if $http }}
            - name: http
              containerPort: 9090
            {{- end }}
            {{- if eq $name "notification" }}
            - name: http-webhook
              containerPort: 9292
            {{- end }}
            - name: http-prom
              containerPort: 8080
            - name: healthz
              containerPort: 9440
          readinessProbe:
            {{- if eq $name "source" }}
            httpGet: { path: /, port: http }
            {{- else }}
            httpGet: { path: /readyz, port: healthz }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $store }}
            - name: data
              mountPath: /data
            {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $store }}
        # the artifact store (source, source-watcher) or image metadata database
        # (image-reflector): a cache each controller rebuilds from its sources
        # ponytail: emptyDir, so tags are rescanned after a restart; add a PVC if a registry rate limit bites
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- end }}
{{- end }}

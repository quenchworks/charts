# Quenchworks Flux: the four core GitOps controllers, plus the image-reflector,
# image-automation and source-watcher controllers (off by default), on QuenchWorks
# images (nonroot, 0-CVE, cosign-signed, pinned by digest), versioned as Flux 2.9.5 ships them.
controllers:
  source:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-source-controller
      digest: "sha256:96630bea81d031add3cfa7b36000bfe8e543243a94093b5309a8aba9b4e43502"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  kustomize:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-kustomize-controller
      digest: "sha256:73e4213d7c00a75da3c38d5fb57236a566addf295e2c54fdd62826f6fa2112e2"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  helm:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-helm-controller
      digest: "sha256:c368b424511a16172f6c4bc44fba725964652b065460e288f1542b5da77adbc9"   # 1.6.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  notification:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-notification-controller
      digest: "sha256:1d88e2c7a0033aa280407a5df1b29f97f421131ade76d79ee50d12364cf62160"   # 1.9.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-reflector:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-reflector-controller
      digest: "sha256:f359918c6618a7721e9eb55c1fafe5e0ed610d742096409726212a2c39a82d69"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-automation:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-automation-controller
      digest: "sha256:f5ef77a14606ce104a411c31914036b4c1b040ecd97709db16c8be215da64c2e"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  source-watcher:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-source-watcher
      digest: "sha256:8a1c8dfc67c2f63539ed121ff2daf628eb1355d80c9b64d30b3ae44705621926"   # 2.2.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }

# Reconcile Flux objects in every namespace (false: only the release namespace).
watchAllNamespaces: true
logLevel: info

# kustomize- and helm-controller apply what your repositories hold; upstream binds them
# to cluster-admin. false leaves that to you (serviceAccountName per object).
clusterReconciler:
  enabled: true

webhookReceiver:
  service:
    type: ClusterIP

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector: {}
tolerations: []

podSecurityContext: {}
containerSecurityContext: {}

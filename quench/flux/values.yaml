# Quenchworks Flux: the four core GitOps controllers, plus the image-reflector,
# image-automation and source-watcher controllers (off by default), on QuenchWorks
# images (nonroot, 0-CVE, cosign-signed, pinned by digest), versioned as Flux 2.9.5 ships them.
controllers:
  source:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-source-controller
      digest: "sha256:51ed2b1e3985da30166f4d4123686268d44bd3f1ccb82ddd771174f4a435076b"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  kustomize:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-kustomize-controller
      digest: "sha256:60bd09d7a00233f64dc42993dd87f1a44593c760ed257c746c7e6560dfe65e26"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  helm:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-helm-controller
      digest: "sha256:e4bfa72d9d00fd113ace2f14338d6cb9b3b6720549cdac236fd6efb93644534a"   # 1.6.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  notification:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-notification-controller
      digest: "sha256:38c306062f49f5f6f869f8572a49e091001657a9dd134a64b74cc585b0dd6b4b"   # 1.9.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-reflector:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-reflector-controller
      digest: "sha256:af6f8eeca4ee4e27313d09846cf72cd93367fe99930df9c9c2e10506b4cc9cfb"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-automation:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-automation-controller
      digest: "sha256:de40a47691b257d17fc53b7d166918c1abdffd5f196904b59d89c273d9e5d9cf"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  source-watcher:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-source-watcher
      digest: "sha256:8cab718aba88c7a10dadffaa6156d0a68c0c0066d87e8446df24addd02ecf0fc"   # 2.2.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }

# Reconcile Flux objects in every namespace (false: only the release namespace).
watchAllNamespaces: true
logLevel: info

# kustomize- and helm-controller apply what your repositories hold; upstream binds them
# to cluster-admin. false leaves that to you (serviceAccountName per object).
clusterReconciler:
  enabled: true

webhookReceiver:
  service:
    type: ClusterIP

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector: {}
tolerations: []

podSecurityContext: {}
containerSecurityContext: {}

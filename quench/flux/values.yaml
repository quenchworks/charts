# Quenchworks Flux: the four core GitOps controllers, plus the image-reflector,
# image-automation and source-watcher controllers (off by default), on QuenchWorks
# images (nonroot, 0-CVE, cosign-signed, pinned by digest), versioned as Flux 2.9.5 ships them.
controllers:
  source:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-source-controller
      digest: "sha256:b398cfdf1be28a20f72778e3c305bfda341024346e2ae7f0ef029dced4f8322c"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  kustomize:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-kustomize-controller
      digest: "sha256:b2a5a61fa83a5d088048d3a47c2d90dad91cb40a1acea37c12ee9561781d5be8"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  helm:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-helm-controller
      digest: "sha256:f2f614512356f456ee3831837027cb3906085ca1ff13f3dce9e962b43f49c49b"   # 1.6.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  notification:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-notification-controller
      digest: "sha256:987241855f237bf162712098aceb2976ebda619bda3f8e292bf012aebf106258"   # 1.9.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-reflector:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-reflector-controller
      digest: "sha256:cd79ac3a52903a04273966b9336cc7225d045d57fa5de78032649ce7e30a8dc3"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-automation:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-automation-controller
      digest: "sha256:039699bb8c2bee1fb9431580e6c7fb3dc080599d2390bb567b80d3f428b7061b"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  source-watcher:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-source-watcher
      digest: "sha256:8cab718aba88c7a10dadffaa6156d0a68c0c0066d87e8446df24addd02ecf0fc"   # 2.2.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }

# Reconcile Flux objects in every namespace (false: only the release namespace).
watchAllNamespaces: true
logLevel: info

# kustomize- and helm-controller apply what your repositories hold; upstream binds them
# to cluster-admin. false leaves that to you (serviceAccountName per object).
clusterReconciler:
  enabled: true

webhookReceiver:
  service:
    type: ClusterIP

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector: {}
tolerations: []

podSecurityContext: {}
containerSecurityContext: {}

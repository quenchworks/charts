# Quenchworks Flux: the four core GitOps controllers, plus the image-reflector,
# image-automation and source-watcher controllers (off by default), on QuenchWorks
# images (nonroot, 0-CVE, cosign-signed, pinned by digest), versioned as Flux 2.9.5 ships them.
controllers:
  source:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-source-controller
      digest: "sha256:fc178373d2c1d375274a278dffb5624f7065a76d4185a6689b746df053a30aea"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  kustomize:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-kustomize-controller
      digest: "sha256:94f170cacad0bd51e0ce573cbb71ec72cb7abb31c421b743cadf74aa7e1ba6aa"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  helm:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-helm-controller
      digest: "sha256:b55d720f9903a495575d2e056b011f2f04bafbd7545af24c19a15bd4b69b1181"   # 1.6.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  notification:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-notification-controller
      digest: "sha256:cf142b6dbb1dfdd0d6d491823a082e11fafe237a61b05c9de4c79bc2ceda0008"   # 1.9.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-reflector:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-reflector-controller
      digest: "sha256:76fc6465d4cfc0c74d82c9b31b74e1519be5eba3cbd64d79f2e2edcecc6079fb"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-automation:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-automation-controller
      digest: "sha256:c4eef82f86f5dadcc2e5ab8032cfbe313830905d3eaafe011a4dc579f9fe2223"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  source-watcher:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-source-watcher
      digest: "sha256:1a1fd75c60aa13347527dedc8d842a77d4e85c6835cc1c67c73709fddb187396"   # 2.2.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }

# Reconcile Flux objects in every namespace (false: only the release namespace).
watchAllNamespaces: true
logLevel: info

# kustomize- and helm-controller apply what your repositories hold; upstream binds them
# to cluster-admin. false leaves that to you (serviceAccountName per object).
clusterReconciler:
  enabled: true

webhookReceiver:
  service:
    type: ClusterIP

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector: {}
tolerations: []

podSecurityContext: {}
containerSecurityContext: {}

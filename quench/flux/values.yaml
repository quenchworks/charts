# Quenchworks Flux: the four core GitOps controllers, plus the image-reflector,
# image-automation and source-watcher controllers (off by default), on QuenchWorks
# images (nonroot, 0-CVE, cosign-signed, pinned by digest), versioned as Flux 2.9.5 ships them.
controllers:
  source:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-source-controller
      digest: "sha256:ce262ed0c603be6b1c903e87f3e26d89032fcc77cec690dae5e6a6eb0f114071"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  kustomize:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-kustomize-controller
      digest: "sha256:752f5e8957ab2b400fda15f055260b0695d616ddde2543adbf28451d60e04ecb"   # 1.9.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  helm:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-helm-controller
      digest: "sha256:49579bf6f7a8135b2d9134b06fbbbc55b7fd27ad46f1c1336dff7c0dd8175d29"   # 1.6.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  notification:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/flux-notification-controller
      digest: "sha256:2afc67825bbbeb88493607c34caab56f558da0b6432e414c14a3fc66e5c59be1"   # 1.9.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-reflector:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-reflector-controller
      digest: "sha256:14570e3d57ac244eb94dd2f38aefcb4ecf3ca473b76e56105fcf637e710a36dc"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  image-automation:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-image-automation-controller
      digest: "sha256:530bd2434a6eb962d72a55db88f9bdb2ae807f324cbbe597ecfcb3264e73ca8a"   # 1.2.5
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }
  source-watcher:
    enabled: false
    image:
      repository: ghcr.io/quenchworks/images/flux-source-watcher
      digest: "sha256:8f9b27482eeea9a021cf0824796a7bbb4781a2eaa13afecc32b095488a2d92f2"   # 2.2.4
    extraArgs: []
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: "1", memory: 1Gi }

# Reconcile Flux objects in every namespace (false: only the release namespace).
watchAllNamespaces: true
logLevel: info

# kustomize- and helm-controller apply what your repositories hold; upstream binds them
# to cluster-admin. false leaves that to you (serviceAccountName per object).
clusterReconciler:
  enabled: true

webhookReceiver:
  service:
    type: ClusterIP

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector: {}
tolerations: []

podSecurityContext: {}
containerSecurityContext: {}

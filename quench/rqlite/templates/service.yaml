apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rqlite.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true   # peers must resolve each other before they are ready
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    # headless names resolve to pod IPs, so advertise the container's own TLS port
    - port: 8443
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
    - port: {{ .Values.service.raftPort }}
      targetPort: raft
      name: raft
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

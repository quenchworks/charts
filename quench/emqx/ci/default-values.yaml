# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A small PVC (kind ships a default StorageClass) keeps /opt/emqx/data writable; the
# gate confirms the dashboard /status endpoint goes healthy (the node booted).
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 1536Mi }
dashboardPassword: "ci-test-password"

{{- $liveness := dict "httpGet" (dict "path" "/guacamole/" "port" "http") "initialDelaySeconds" 30 "periodSeconds" 20 "timeoutSeconds" 5 -}}
{{- $readiness := dict "httpGet" (dict "path" "/guacamole/api/languages" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "guacamole.componentLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "guacamole.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "guacamole.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # 1. The schema SQL ships in the guacamole image; hand it to the psql step.
        - name: schema
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-c", "cp /usr/share/guacamole/schema/*.sql /schema/"]
          volumeMounts:
            - name: schema
              mountPath: /schema
        # 2. Wait for PostgreSQL, then create the tables once (skipped when
        #    guacamole_user already exists) and replace upstream's default
        #    guacadmin password with the one from the guacamole-db Secret. The hash
        #    is Guacamole's own: SHA-256 of password || upper-hex(salt).
        - name: db-init
          image: "{{ .Values.dbInit.image.repository }}@{{ .Values.dbInit.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: PGHOST, value: guacamole-postgresql }
            - { name: PGUSER, value: {{ .Values.postgresql.auth.username | quote }} }
            - { name: PGDATABASE, value: {{ .Values.postgresql.auth.database | quote }} }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: guacamole-db, key: postgres-password } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: guacamole-db, key: admin-password } }
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -q; do echo "waiting for postgresql"; sleep 2; done
              if [ "$(psql -tAc "SELECT to_regclass('public.guacamole_user') IS NOT NULL")" = t ]; then
                echo "guacamole schema present"; exit 0
              fi
              psql -v ON_ERROR_STOP=1 -1 -f /schema/001-create-schema.sql -f /schema/002-create-admin-user.sql
              psql -v ON_ERROR_STOP=1 -v pw="$ADMIN_PASSWORD" <<'SQL'
              UPDATE guacamole_user u
                 SET password_salt = s.salt,
                     password_hash = sha256(convert_to(:'pw' || upper(encode(s.salt, 'hex')), 'UTF8')),
                     password_date = now()
                FROM guacamole_entity e,
                     (SELECT sha256(convert_to(gen_random_uuid()::text, 'UTF8')) AS salt) s
               WHERE u.entity_id = e.entity_id AND e.name = 'guacadmin' AND e.type = 'USER';
              SQL
              echo "guacamole schema created"
          volumeMounts:
            - name: schema
              mountPath: /schema
      containers:
        - name: guacamole
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: JAVA_OPTS, value: {{ .Values.javaOpts | quote }} }
            - { name: GUACD_HOSTNAME, value: {{ include "guacamole.guacdName" . | quote }} }
            - { name: GUACD_PORT, value: "4822" }
            - { name: POSTGRESQL_HOSTNAME, value: guacamole-postgresql }
            - { name: POSTGRESQL_PORT, value: "5432" }
            - { name: POSTGRESQL_DATABASE, value: {{ .Values.postgresql.auth.database | quote }} }
            - { name: POSTGRESQL_USERNAME, value: {{ .Values.postgresql.auth.username | quote }} }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: guacamole-db, key: postgres-password } }
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "guacamole.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}

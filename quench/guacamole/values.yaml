# guacamole: the Apache Guacamole web app, the guacd proxy daemon and PostgreSQL.
#
# Names of the database pieces are FIXED (guacamole-postgresql, the guacamole-db
# Secret) because the postgresql subchart takes them as plain values. One install
# per namespace.

# The digests below are the contract with the image factory. They are never tags.
image:
  repository: ghcr.io/quenchworks/images/guacamole
  digest: "sha256:384cb5e65c5a5d5ecd5cfd9f6ba9b5d6afb86ddd2e1540bfe0c25620f6339a7b"
  pullPolicy: IfNotPresent

guacd:
  image:
    repository: ghcr.io/quenchworks/images/guacd
    digest: "sha256:261d891a5c402129c426b19e748bec1e712a3c29b4b068f9b02d80562de4e289"
  # guacd logs at info; debug shows every protocol step
  logLevel: info
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

nameOverride: ""

# The web app. More than one replica works (sessions live in guacd and the DB).
replicaCount: 1
javaOpts: "-XX:MaxRAMPercentage=75"
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

# The guacadmin password. Upstream's schema creates guacadmin/guacadmin; the
# database init replaces that password on first install. Empty generates one,
# kept across upgrades in the guacamole-db Secret (key admin-password).
admin:
  password: ""

service:
  type: ClusterIP
  port: 8080
  # HTTPS Service port (to the container's 8443), only with tls.enabled
  httpsPort: 443

# Native TLS: Guacamole's Tomcat also serves HTTPS on 8443 (Service service.httpsPort) beside
# HTTP on 8080. An init container copies the image's Tomcat conf/ and adds a PEM connector
# reading /tls (type RSA, so the key must be RSA). guacd traffic is unchanged. The certificate
# comes from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Extra environment for the web app. Any Guacamole property works as an
# upper-case variable (enable-environment-properties), e.g.
#   - { name: TOTP_ENABLED, value: "true" }   (needs that extension)
#   - { name: RECORDING_SEARCH_PATH, value: /recordings }
extraEnvVars: []

# ---------------------------------------------------------------------------
# PostgreSQL (subchart). The database init creates Guacamole's tables on first
# install; later upgrades leave existing tables alone.
# ---------------------------------------------------------------------------
postgresql:
  fullnameOverride: guacamole-postgresql
  auth:
    username: guacamole
    database: guacamole_db
    existingSecret: guacamole-db
    existingSecretPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# psql for the database init, the same image the postgresql subchart pins.
dbInit:
  image:
    repository: ghcr.io/quenchworks/images/postgresql
    digest: "sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f"

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# guacd accepts only the web app's pods: it has no authentication of its own and
# opens connections to whatever host a client names.
networkPolicy:
  enabled: true

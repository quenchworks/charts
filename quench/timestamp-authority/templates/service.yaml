apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # RFC 3161 timestamp API.
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

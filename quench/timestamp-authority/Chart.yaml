apiVersion: v2
name: timestamp-authority
description: "The Sigstore Timestamp Authority: an RFC 3161 timestamping server that countersigns artifact hashes, with an in-memory signer for testing and a file signer from a Secret. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "2.1.3"
kubeVersion: ">=1.23.0-0"
keywords:
  - sigstore
  - timestamp
  - rfc3161
  - supply-chain
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Sigstore Timestamp Authority 2.1.3 with memory and file signers."
  artifacthub.io/category: security
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:383b3ced033dc77c5ba806107f80a6fc454466a875864af5cf9d086c9eebef21
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

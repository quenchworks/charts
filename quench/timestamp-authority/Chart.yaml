apiVersion: v2
name: timestamp-authority
description: "The Sigstore Timestamp Authority: an RFC 3161 timestamping server that countersigns artifact hashes, with an in-memory signer for testing and a file signer from a Secret. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.4
appVersion: "2.1.4"
kubeVersion: ">=1.23.0-0"
keywords:
  - sigstore
  - timestamp
  - rfc3161
  - supply-chain
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "2026-10-08 update check"
  artifacthub.io/category: security
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |

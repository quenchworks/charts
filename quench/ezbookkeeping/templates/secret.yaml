{{- /* The key ezBookkeeping signs sessions and tokens with: generated once and read back on upgrade
       (rotating it signs everyone out). */}}
{{- if not .Values.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ get $old "secret-key" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}

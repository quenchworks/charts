{{- /* The admin's web password and API password (Google Reader / Fever clients), generated once
       and read back on upgrade. The init container applies both on every start. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "freshrss.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
{{- $pw := .Values.admin.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $api := .Values.admin.apiPassword | default (get $old "api-password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  api-password: {{ $api | b64enc | quote }}
{{- end }}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and headscale writes
# its SQLite DB + generates its noise key on it under the read-only root fs. A
# concrete serverUrl keeps the rendered config valid and deterministic.
persistence:
  enabled: true
  size: 1Gi

serverUrl: "http://127.0.0.1:8080"

{{- if .Values.rbac.create }}
{{/*
Harbor's components need no Kubernetes API access for the in-cluster filesystem-backed
deployment, so RBAC is OFF by default. This stub exists for callers who set
rbac.create=true to attach cluster-specific roles (e.g. a custom storage operator).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{/*
The single managed Secret carrying every credential Harbor needs. The chart
GENERATES everything (there is no photon "prepare" container) and PERSISTS it across
upgrades via lookup: rotating any of these would corrupt registry passwords + robot
tokens already encrypted in the DB, so once written a value is NEVER regenerated.

Keys:
  secretKey                    16 bytes (AES-128) — encrypts registry/robot creds in DB.
                               Mounted at /etc/core/key (KEY_PATH); shared to jobservice/registryctl.
  secret                       CORE_SECRET — shared core <-> registry(ctl) <-> jobservice.
  JOBSERVICE_SECRET            shared core <-> jobservice <-> registryctl.
  CSRF_KEY                     32 bytes — core XSRF protection.
  HARBOR_ADMIN_PASSWORD        admin bootstrap password (overridable via auth.adminPassword).
  POSTGRESQL_PASSWORD          DB password (deterministic bundled / external).
  REGISTRY_CREDENTIAL_PASSWORD htpasswd basic-auth password core/jobservice use to call the registry.
  REGISTRY_HTTP_SECRET         registry http.secret.
  REGISTRY_HTPASSWD            bcrypt htpasswd line the registry mounts at /etc/registry/passwd.
  REDIS_PASSWORD               cache password (so registry's env-substituted config can read it).
  tls.key / tls.crt            token-service RSA keypair. Core signs registry-auth tokens with
                               tls.key (mounted /etc/core/private_key.pem). This is the docker
                               pull/push trust anchor, SEPARATE from internal-TLS (which is off).
*/}}
{{- $name := include "harbor.secret" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $ed := $existing.data | default dict -}}

{{- /* helper-less inline persistence: prefer existing -> else generate */ -}}
{{- $secretKey := "" -}}
{{- if hasKey $ed "secretKey" -}}{{- $secretKey = index $ed "secretKey" | b64dec -}}{{- else -}}{{- $secretKey = randAlphaNum 16 -}}{{- end -}}

{{- $coreSecret := "" -}}
{{- if hasKey $ed "secret" -}}{{- $coreSecret = index $ed "secret" | b64dec -}}{{- else -}}{{- $coreSecret = randAlphaNum 16 -}}{{- end -}}

{{- $jobSecret := "" -}}
{{- if hasKey $ed "JOBSERVICE_SECRET" -}}{{- $jobSecret = index $ed "JOBSERVICE_SECRET" | b64dec -}}{{- else -}}{{- $jobSecret = randAlphaNum 16 -}}{{- end -}}

{{- $csrf := "" -}}
{{- if hasKey $ed "CSRF_KEY" -}}{{- $csrf = index $ed "CSRF_KEY" | b64dec -}}{{- else -}}{{- $csrf = randAlphaNum 32 -}}{{- end -}}

{{- $adminPw := .Values.auth.adminPassword -}}
{{- if and (not $adminPw) (hasKey $ed "HARBOR_ADMIN_PASSWORD") -}}{{- $adminPw = index $ed "HARBOR_ADMIN_PASSWORD" | b64dec -}}{{- end -}}
{{- if not $adminPw -}}{{- $adminPw = randAlphaNum 16 -}}{{- end -}}

{{- $regUser := "harbor_registry_user" -}}
{{- $regPw := "" -}}
{{- if hasKey $ed "REGISTRY_CREDENTIAL_PASSWORD" -}}{{- $regPw = index $ed "REGISTRY_CREDENTIAL_PASSWORD" | b64dec -}}{{- else -}}{{- $regPw = randAlphaNum 16 -}}{{- end -}}

{{- $regHttp := "" -}}
{{- if hasKey $ed "REGISTRY_HTTP_SECRET" -}}{{- $regHttp = index $ed "REGISTRY_HTTP_SECRET" | b64dec -}}{{- else -}}{{- $regHttp = randAlphaNum 16 -}}{{- end -}}

{{- /* htpasswd bcrypt line: persist verbatim so the bcrypt salt stays stable. */ -}}
{{- $htpasswd := "" -}}
{{- if hasKey $ed "REGISTRY_HTPASSWD" -}}{{- $htpasswd = index $ed "REGISTRY_HTPASSWD" | b64dec -}}{{- else -}}{{- $htpasswd = htpasswd $regUser $regPw -}}{{- end -}}

{{- /* token-service keypair: persist both halves together. */ -}}
{{- $tlsKey := "" -}}
{{- $tlsCrt := "" -}}
{{- if and (hasKey $ed "tls.key") (hasKey $ed "tls.crt") -}}
{{- $tlsKey = index $ed "tls.key" | b64dec -}}
{{- $tlsCrt = index $ed "tls.crt" | b64dec -}}
{{- else -}}
{{- $ca := genCA "harbor-token-ca" 3650 -}}
{{- $tlsKey = $ca.Key -}}
{{- $tlsCrt = $ca.Cert -}}
{{- end -}}

{{- $dbPw := include "harbor.db.password" . -}}
{{- if and (not $dbPw) (hasKey $ed "POSTGRESQL_PASSWORD") -}}{{- $dbPw = index $ed "POSTGRESQL_PASSWORD" | b64dec -}}{{- end -}}
{{- if not $dbPw -}}{{- $dbPw = randAlphaNum 24 -}}{{- end -}}

{{- $redisPw := include "harbor.redis.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secretKey: {{ $secretKey | b64enc | quote }}
  secret: {{ $coreSecret | b64enc | quote }}
  JOBSERVICE_SECRET: {{ $jobSecret | b64enc | quote }}
  CSRF_KEY: {{ $csrf | b64enc | quote }}
  HARBOR_ADMIN_PASSWORD: {{ $adminPw | b64enc | quote }}
  POSTGRESQL_PASSWORD: {{ $dbPw | b64enc | quote }}
  REGISTRY_CREDENTIAL_USERNAME: {{ $regUser | b64enc | quote }}
  REGISTRY_CREDENTIAL_PASSWORD: {{ $regPw | b64enc | quote }}
  REGISTRY_HTTP_SECRET: {{ $regHttp | b64enc | quote }}
  REGISTRY_HTPASSWD: {{ $htpasswd | b64enc | quote }}
  REDIS_PASSWORD: {{ $redisPw | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
  tls.crt: {{ $tlsCrt | b64enc | quote }}

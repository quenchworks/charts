{{- if .Values.persistence.enabled }}
{{/* Registry blob/manifest storage (mounted at /storage). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "harbor.registry" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.trivy.enabled .Values.trivy.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "harbor.trivy" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: trivy
spec:
  accessModes:
    {{- toYaml .Values.trivy.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.trivy.persistence.size | quote }}
  {{- if .Values.trivy.persistence.storageClass }}
  storageClassName: {{ .Values.trivy.persistence.storageClass | quote }}
  {{- end }}
{{- end }}

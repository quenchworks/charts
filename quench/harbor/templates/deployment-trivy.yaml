{{- if .Values.trivy.enabled }}
{{/*
Trivy scan adapter (optional). Core registers it as the default scanner (WITH_TRIVY +
TRIVY_ADAPTER_URL). It downloads the Trivy vuln DB at runtime into the cache dir and
serves the scanner API on 8080 (health /probe/healthy). Runs as user `scanner`
(uid 1001, $HOME=/home/scanner). Read-only rootfs: the cache (/home/scanner/.cache,
holding both .cache/trivy and .cache/reports) is a PVC or emptyDir; /tmp is emptyDir.
Uses the dedicated Valkey DBs: store=trivyStore, jobqueue=trivyJobQueue.
*/}}
{{- $comp := "trivy" -}}
{{- $liveness := dict "httpGet" (dict "path" "/probe/healthy" "port" 8080) "initialDelaySeconds" 20 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/probe/healthy" "port" 8080) "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.trivy" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "harbor.componentLabels" (dict "ctx" . "component" $comp) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "harbor.componentLabels" (dict "ctx" . "component" $comp) | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "harbor.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      containers:
        - name: trivy
          image: {{ include "harbor.image" (dict "ctx" . "component" "trivyAdapter") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: SCANNER_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: SCANNER_TRIVY_CACHE_DIR
              value: "/home/scanner/.cache/trivy"
            - name: SCANNER_TRIVY_REPORTS_DIR
              value: "/home/scanner/.cache/reports"
            - name: SCANNER_TRIVY_DEBUG_MODE
              value: {{ .Values.trivy.debugMode | quote }}
            - name: SCANNER_TRIVY_VULN_TYPE
              value: "os,library"
            - name: SCANNER_TRIVY_TIMEOUT
              value: "5m0s"
            - name: SCANNER_TRIVY_SECURITY_CHECKS
              value: {{ .Values.trivy.securityCheck | quote }}
            - name: SCANNER_TRIVY_SEVERITY
              value: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            - name: SCANNER_TRIVY_IGNORE_UNFIXED
              value: {{ .Values.trivy.ignoreUnfixed | quote }}
            - name: SCANNER_TRIVY_SKIP_UPDATE
              value: {{ .Values.trivy.skipUpdate | quote }}
            - name: SCANNER_TRIVY_SKIP_JAVA_DB_UPDATE
              value: {{ .Values.trivy.skipUpdate | quote }}
            - name: SCANNER_TRIVY_OFFLINE_SCAN
              value: {{ .Values.trivy.offlineScan | quote }}
            - name: SCANNER_TRIVY_INSECURE
              value: {{ .Values.trivy.insecure | quote }}
            - name: SCANNER_TRIVY_DB_REPOSITORY
              value: {{ .Values.trivy.dbRepository | quote }}
            - name: SCANNER_API_SERVER_ADDR
              value: ":8080"
            - name: INTERNAL_TLS_ENABLED
              value: "false"
            - name: SCANNER_REDIS_URL
              value: {{ include "harbor.redis.url" (dict "ctx" . "db" .Values.redisDB.trivyStore) | quote }}
            - name: SCANNER_STORE_REDIS_URL
              value: {{ include "harbor.redis.url" (dict "ctx" . "db" .Values.redisDB.trivyStore) | quote }}
            - name: SCANNER_JOB_QUEUE_REDIS_URL
              value: {{ include "harbor.redis.url" (dict "ctx" . "db" .Values.redisDB.trivyJobQueue) | quote }}
          ports:
            - name: api-server
              containerPort: 8080
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          resources:
            {{- toYaml .Values.trivy.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/scanner/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.trivy.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "harbor.trivy" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}

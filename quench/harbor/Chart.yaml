apiVersion: v2
name: harbor
description: Quenchworks hardened Harbor (cloud-native OCI registry with RBAC, replication, vulnerability scanning and signing). A single umbrella chart wiring seven minimal, nonroot, 0-CVE component images (pinned by digest) — core, jobservice, registry, registryctl, portal, the optional Trivy scan adapter and metrics exporter — over the Quenchworks PostgreSQL and Valkey charts.
type: application
version: 0.0.2
appVersion: "2.14.4"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - Add FILE job logger so GC/scan/replication/retention job logs are retrievable
    - Declare jobservice metrics containerPort
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

apiVersion: v2
name: harbor
description: Quenchworks hardened Harbor (cloud-native OCI registry with RBAC, replication, vulnerability scanning and signing). A single umbrella chart wiring seven minimal, nonroot, 0-CVE component images (pinned by digest) — core, jobservice, registry, registryctl, portal, the optional Trivy scan adapter and metrics exporter — over the Quenchworks PostgreSQL and Valkey charts.
type: application
version: 0.0.3
appVersion: "2.14.4"
keywords:
  - harbor
  - registry
  - oci
  - images
  - security
maintainers:
  - name: QuenchWorks
    email: quenchworks@mkabumattar.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - Add FILE job logger so GC/scan/replication/retention job logs are retrievable
    - Declare jobservice metrics containerPort
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: harbor-core
      image: ghcr.io/quenchworks/images/harbor-core@sha256:c1cbf8ca5853b00ff33f6ebaa184238b1d2e0e7539b5ba09558e3e20ebc8c990
    - name: harbor-jobservice
      image: ghcr.io/quenchworks/images/harbor-jobservice@sha256:8342a264ef6002fd0c81eb541d1643f5fc01ffd78a82e5d2fa798864a6d48f7d
    - name: harbor-registry
      image: ghcr.io/quenchworks/images/harbor-registry@sha256:e9c376c60d0b65e4a5ce4ed651196e9d80126ab24bbd57c692c749626b371a76
    - name: harbor-registryctl
      image: ghcr.io/quenchworks/images/harbor-registryctl@sha256:3a6c1fa2bb38b55c0b8f8faefa948969daae894eb952e91e9f818fa4f1a637e9
    - name: harbor-portal

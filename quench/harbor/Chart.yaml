apiVersion: v2
name: harbor
description: "Cloud-native OCI registry with role-based access control, replication, vulnerability scanning, and image signing. This umbrella chart wires seven QuenchWorks Harbor component images (core, jobservice, registry, registryctl, portal, the optional Trivy scan adapter, and the metrics exporter) over the QuenchWorks PostgreSQL and Valkey charts, each a minimal, nonroot, 0-CVE image pinned by digest."
type: application
version: 0.0.26
appVersion: "2.15.2"
keywords:
  - harbor
  - registry
  - oci
  - images
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "harbor-trivy-adapter rebuilt with containerd 2.3.6 and 1.7.36 (CVE-2026-53493)."

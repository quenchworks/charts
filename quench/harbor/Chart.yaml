apiVersion: v2
name: harbor
description: "Cloud-native OCI registry with role-based access control, replication, vulnerability scanning, and image signing. This umbrella chart wires seven QuenchWorks Harbor component images (core, jobservice, registry, registryctl, portal, the optional Trivy scan adapter, and the metrics exporter) over the QuenchWorks PostgreSQL and Valkey charts, each a minimal, nonroot, CVE-gated image pinned by digest."
type: application
version: 0.0.63
appVersion: "2.15.5"
keywords:
  - harbor
  - registry
  - oci
  - images
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."

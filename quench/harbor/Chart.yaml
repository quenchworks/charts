apiVersion: v2
name: harbor
description: "Cloud-native OCI registry with role-based access control, replication, vulnerability scanning, and image signing. This umbrella chart wires seven QuenchWorks Harbor component images (core, jobservice, registry, registryctl, portal, the optional Trivy scan adapter, and the metrics exporter) over the QuenchWorks PostgreSQL and Valkey charts, each a minimal, nonroot, 0-CVE image pinned by digest."
type: application
version: 0.0.20
appVersion: "2.15.2"
keywords:
  - harbor
  - registry
  - oci
  - images
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bumped the bundled postgresql subchart to 0.0.19, which pins the rebuilt PostgreSQL 18.6 image that ships the uuid-ossp extension."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: harbor-core
      image: ghcr.io/quenchworks/images/harbor-core@sha256:0043d56a449e036fd0ecf10a1272c7ee53e873278953f758ae4c720bd779374d

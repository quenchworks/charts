{{- $name := printf "%s-agent" (include "quench-common.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.agentPassword -}}
{{- if and (not $pw) $existing (index $existing.data "password") -}}
{{- $pw = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 32 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.agentUsername | quote }}
  password: {{ $pw | quote }}

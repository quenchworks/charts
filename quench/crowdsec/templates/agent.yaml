{{- if .Values.agent.enabled }}
{{- $fn := include "quench-common.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-acquis
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  k8s.yaml: |
    {{- range $i, $a := .Values.agent.acquisition }}
    {{- if $i }}
    ---
    {{- end }}
    {{- toYaml $a | nindent 4 }}
    {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fn }}-agent
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        checksum/acquis: {{ toYaml .Values.agent.acquisition | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # the LAPI registers the agent login at start; wait for it so the agent does not crash-loop on a 403
        - name: wait-lapi
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: [/bin/bash, -c, 'until exec 3<>/dev/tcp/{{ $fn }}-lapi/{{ .Values.service.port }}; do echo waiting for the LAPI; sleep 3; done']
      containers:
        - name: agent
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: DISABLE_LOCAL_API, value: "true" }
            - { name: DISABLE_ONLINE_API, value: "true" }
            - { name: LOCAL_API_URL, value: {{ printf "http://%s-lapi:%v" $fn .Values.service.port | quote }} }
            - { name: COLLECTIONS, value: {{ .Values.agent.collections | quote }} }
            - { name: PARSERS, value: {{ .Values.agent.parsers | quote }} }
            - { name: CUSTOM_HOSTNAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            {{- include "crowdsec.env" (dict "ctx" . "part" .Values.agent) | nindent 12 }}
          {{- with .Values.agent.envSecret }}
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          ports:
            - { name: metrics, containerPort: 6060, protocol: TCP }
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /etc/crowdsec }
            - { name: acquis, mountPath: /etc/crowdsec/acquis.d }
            - { name: data, mountPath: /var/lib/crowdsec/data }
            - { name: varlog, mountPath: /var/log, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: config, emptyDir: {} }
        - { name: data, emptyDir: {} }
        - { name: acquis, configMap: { name: {{ $fn }}-acquis } }
        - { name: varlog, hostPath: { path: /var/log } }
{{- end }}

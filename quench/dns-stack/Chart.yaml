apiVersion: v2
name: dns-stack
description: "Self-hosted DNS for Kubernetes: PowerDNS Authoritative serves the zones and external-dns writes records into it from annotated Services and Ingresses, through the PowerDNS API with a key the stack generates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.3
appVersion: "1.0.0"
keywords:
  - powerdns
  - external-dns
  - dns
  - authoritative-dns
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PowerDNS/pdns
  - https://github.com/kubernetes-sigs/external-dns
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "rebuilt with module floors instead of downgrading pins"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: powerdns
      image: ghcr.io/quenchworks/images/powerdns@sha256:a9a0c1b66f1513e309a60eda1dfbca732fc07c8f374f0d549fcb316da000fa34
    - name: external-dns
      image: ghcr.io/quenchworks/images/external-dns@sha256:14f9278bfae70142de8c149409f78b29ed34e7ddcdd22742d7ceb2bcf0162d79
    - name: busybox
      image: ghcr.io/quenchworks/images/busybox@sha256:b851333cd0a8a05a4b7569f4f1007f4e237b34295f84033e6ab6aa428fb33eef
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

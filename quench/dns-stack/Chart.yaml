apiVersion: v2
name: dns-stack
description: "Self-hosted DNS for Kubernetes: PowerDNS Authoritative serves the zones and external-dns writes records into it from annotated Services and Ingresses, through the PowerDNS API with a key the stack generates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.7
appVersion: "1.0.0"
keywords:
  - powerdns
  - external-dns
  - dns
  - authoritative-dns
  - stack

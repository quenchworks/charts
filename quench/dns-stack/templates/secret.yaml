{{- /* One API key for both sides: powerdns reads it as api.existingSecret and
       external-dns as EXTERNAL_DNS_PDNS_API_KEY. Generated once, kept on upgrade. */ -}}
{{- $name := "dns-stack-pdns-api" -}}
{{- $key := "" -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $key = index .data "api-key" | b64dec -}}
{{- end -}}
{{- if not $key -}}{{- $key = randAlphaNum 32 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}

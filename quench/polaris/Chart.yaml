apiVersion: v2
name: polaris
description: "Fairwinds Polaris, the Kubernetes configuration validator: a dashboard that audits running workloads against best-practice checks for security contexts, probes, resources and image tags. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "10.2.6"
keywords:
  - polaris
  - kubernetes
  - best-practices
  - security
  - audit
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/FairwindsOps/polaris
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: polaris
      image: ghcr.io/quenchworks/images/polaris@sha256:2feca73da79ec2faf76b1b28c6d9dfbd206b33b005974dc329b643d7b83d23db
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

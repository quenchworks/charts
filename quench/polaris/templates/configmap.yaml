{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polaris.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /config/config.yaml and passed to `polaris dashboard` via --config.
  config.yaml: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}

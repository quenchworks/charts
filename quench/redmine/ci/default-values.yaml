# Install gate on kind: the bundled PostgreSQL and the attachments without PVCs, and the
# REST API on so the gate can log in as the admin.
restApi: true
postgresql:
  primary:
    persistence:
      enabled: false
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

apiVersion: v2
name: redmine
description: "Redmine, the Ruby on Rails project management and issue tracker (issues, wikis, time tracking, Gantt, REST API), with the bundled PostgreSQL, attachments on a PVC, the schema migrated and default data loaded on first start, and a generated admin password. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.10
appVersion: "7.0.2"
keywords:
  - redmine
  - issue-tracker
  - project-management
  - rails
maintainers:

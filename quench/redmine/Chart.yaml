apiVersion: v2
name: redmine
description: "Redmine, the Ruby on Rails project management and issue tracker (issues, wikis, time tracking, Gantt, REST API), with the bundled PostgreSQL, attachments on a PVC, the schema migrated and default data loaded on first start, and a generated admin password. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.21
appVersion: "7.0.3"
keywords:
  - redmine
  - issue-tracker
  - project-management
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/redmine/redmine
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: redmine
      image: ghcr.io/quenchworks/images/redmine@sha256:955646dde3f4f0da11e345566da5727462e828d3a42c4329331d0865d733419b
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:9c4478f8925ca6e4098ef00966036e933f93c54185b38281f74f5ab02208aa0b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

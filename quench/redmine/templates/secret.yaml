{{- $name := include "quench-common.fullname" . -}}
{{- $needAdmin := not .Values.adminPassword.existingSecret -}}
{{- $needKey := not .Values.secretKeyBase.existingSecret -}}
{{- $needDb := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $needAdmin $needKey $needDb }}
{{- $pw := .Values.adminPassword.value -}}
{{- $key := .Values.secretKeyBase.value -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- if and $needAdmin (not $pw) -}}{{- $pw = index .data "admin-password" | default "" | b64dec -}}{{- end -}}
{{- if and $needKey (not $key) -}}{{- $key = index .data "secret-key-base" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- if and $needAdmin (not $pw) -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- if and $needKey (not $key) -}}{{- $key = randAlphaNum 64 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needAdmin }}
  # The "admin" user's login password, set by the init container on first install.
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $needKey }}
  # Signs sessions and cookies; kept across upgrades so users stay logged in.
  secret-key-base: {{ $key | b64enc | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

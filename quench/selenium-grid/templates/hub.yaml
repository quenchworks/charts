apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selenium-grid.hubName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.podTemplateLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      automountServiceAccountToken: false
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if include "quench-common.tls.enabled" . }}
      initContainers:
        {{- include "quench-common.tls.pkcs8InitContainer" (dict "ctx" . "image" (printf "%s@%s" .Values.openssl.repository .Values.openssl.digest)) | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - hub
            - --session-request-timeout
            - {{ .Values.hub.sessionRequestTimeout | quote }}
            {{- if include "quench-common.tls.enabled" . }}
            # 4444 serves HTTPS only; Selenium wants a PKCS#8 key
            - --https-certificate
            - /tls-pkcs8/tls.crt
            - --https-private-key
            - /tls-pkcs8/tls.key
            - --registration-secret
            - $(SE_REGISTRATION_SECRET)
            {{- end }}
            {{- range .Values.hub.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.hub.extraEnvVars (include "quench-common.tls.enabled" .) }}
          env:
            {{- if include "quench-common.tls.enabled" . }}
            - name: SE_REGISTRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quench-common.fullname" . }}-registration
                  key: secret
            {{- end }}
            {{- with .Values.hub.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: 4444, protocol: TCP }
            - { name: publish, containerPort: 4442, protocol: TCP }
            - { name: subscribe, containerPort: 4443, protocol: TCP }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /status, port: http{{ if include "quench-common.tls.enabled" . }}, scheme: HTTPS{{ end }} }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/nonroot }
            {{- include "quench-common.tls.pkcs8VolumeMount" . | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.tls.pkcs8Volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selenium-grid.hubName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
    - { name: publish, port: 4442, targetPort: publish, protocol: TCP }
    - { name: subscribe, port: 4443, targetPort: subscribe, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hub

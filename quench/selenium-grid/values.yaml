# Quenchworks Selenium Grid: one hub and N headless Firefox nodes. Both images are
# QuenchWorks builds of the upstream selenium-server jar (0-CVE, cosign-signed), pinned
# by digest, never a tag.

# The hub image (selenium-server; the role is picked by its first argument).
image:
  repository: ghcr.io/quenchworks/images/selenium-server
  digest: "sha256:4ba87942868a65688dbfa3105fc8df325735f8828a1d60fb618e161731ff6c9c"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

hub:
  # How long a new-session request waits in the queue for a free slot, in seconds.
  sessionRequestTimeout: 300
  # Extra hub flags, e.g. ["--log-level", "FINE"]. JVM flags go in extraEnvVars as
  # JAVA_TOOL_OPTIONS.
  extraArgs: []
  extraEnvVars: []
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# The hub Service: 4444 is the WebDriver endpoint and the Grid UI; 4442/4443 are the
# event bus the nodes publish to and subscribe from.
service:
  type: ClusterIP
  port: 4444

# Native TLS: the hub's 4444 (WebDriver + Grid UI) serves HTTPS only, from the certificate
# below with the key converted to PKCS#8; nodes register over https:// and trust the chart CA
# through a PKCS12 truststore. The event bus (4442/4443) and the hub-to-node calls on 5555
# stay plain inside the release. The certificate also names the hub Service. It comes from
# the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:914fbcf857be13a249ebb27c4266f30ced006e80ffc5b63a8c00298bd211e519"
  pullPolicy: IfNotPresent

firefox:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/selenium-node-firefox
    digest: "sha256:7ec277f2cde02b3a2380909549500eef77ecad8f0aec5ef5344ddcb613d61c67"
  # Each node pod offers one Firefox slot; scale with replicas.
  replicas: 1
  # /dev/shm for Firefox (a memory-backed emptyDir)
  shmSize: 512Mi
  # Extra node flags, e.g. ["--session-timeout", "600"].
  extraArgs: []
  extraEnvVars: []
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }

# --- Common production knobs, wired through quench-common (all optional) ---
commonLabels: {}
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}

# Optional Ingress to the hub (HTTP only). Disabled by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: grid.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  tls: []

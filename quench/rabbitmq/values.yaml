# The digest below is the contract with the image factory. CI rewrites it on the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rabbitmq
  digest: "sha256:35d8f3067e5df6227af03ff074b8a644b36241833f84f3c8f78e0eeb20d817aa"
  pullPolicy: IfNotPresent

nameOverride: ""

# Authentication. RabbitMQ seeds a default user on first boot from these env vars
# (the stock guest account is dropped). A password and Erlang cookie are generated
# into a Secret if you do not set them. The cookie pins the node identity so the
# broker survives restarts and can later form a cluster.
auth:
  enabled: true
  username: "user"
  password: ""
  erlangCookie: ""
  existingSecret: ""
  existingSecretPasswordKey: "rabbitmq-password"
  existingSecretErlangCookieKey: "rabbitmq-erlang-cookie"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 5672

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 120
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

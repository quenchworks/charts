# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Brings up the default 3-node HA cluster with per-pod PVCs (kind's default
# storageClass) so a killed node rejoins from its own mnesia.
auth:
  enabled: true
primary:
  persistence:
    enabled: true
    size: 1Gi

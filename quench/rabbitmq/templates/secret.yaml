{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "rabbitmq-password" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- $cookie := .Values.auth.erlangCookie -}}
{{- if and (not $cookie) $existing -}}{{- $cookie = index $existing.data "rabbitmq-erlang-cookie" | b64dec -}}{{- end -}}
{{- if not $cookie -}}{{- $cookie = randAlphaNum 32 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  rabbitmq-password: {{ $pw | b64enc | quote }}
  rabbitmq-erlang-cookie: {{ $cookie | b64enc | quote }}
{{- end }}

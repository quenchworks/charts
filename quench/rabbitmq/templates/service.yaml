apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: amqp
      name: amqp
    {{- if .Values.management.enabled }}
    - port: {{ .Values.service.managementPort }}
      targetPort: management
      name: management
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: amqp
      name: amqp
    - port: 4369
      targetPort: epmd
      name: epmd
    - port: 25672
      targetPort: dist
      name: dist
    {{- if .Values.management.enabled }}
    - port: {{ .Values.service.managementPort }}
      targetPort: management
      name: management
    {{- end }}
  # publishNotReadyAddresses so a booting node can resolve its peers' DNS before
  # any of them is Ready — required for cluster formation on a cold start.
  publishNotReadyAddresses: true
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary

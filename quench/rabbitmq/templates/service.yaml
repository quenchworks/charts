apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: amqp
      name: amqp
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: amqp
      name: amqp
    - port: 4369
      targetPort: epmd
      name: epmd
    - port: 25672
      targetPort: dist
      name: dist
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary

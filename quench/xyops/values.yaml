# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/xyops
  digest: "sha256:f9928d942d95e11c6e3ef0c11c78beaa445270c84ca732f0324dc9ecec8cfff4"
  pullPolicy: IfNotPresent

nameOverride: ""

# xyOps keeps all of its state (an embedded better-sqlite3 database, logs and
# temp files) on local disk under /opt/xyops, so this is a stateful, single-
# instance workload: the chart runs a single-replica StatefulSet behind a
# ClusterIP Service, with a persistent /opt/xyops/data volume from a
# volumeClaimTemplate. The sqlite store does NOT support horizontal scaling --
# do not raise the replica count.

# xyOps requires a non-empty secret_key to boot (it signs sessions and API
# tokens with it). It is delivered to the container via the XYOPS_secret_key env
# var from a Secret. Point existingSecret at your own Secret, or set secretKey to
# a fixed value; if both are empty the chart generates a random key on first
# install and preserves it across upgrades. Nothing secret is baked into the image.
auth:
  secretKey: ""
  existingSecret: ""
  existingSecretKey: "secret-key"

# Resources. A monitoring/scheduler control plane is modest at rest; the defaults
# below schedule anywhere and pass the single-pod CI gate. Raise to fit the number
# of monitored hosts, events and concurrent jobs.
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

# Persistent storage for /opt/xyops/data (the embedded sqlite store). State must
# survive restarts. Provisioned per-pod via a volumeClaimTemplate unless you point
# persistence.existingClaim at a pre-created PVC. Set persistence.enabled=false to
# back the data dir with an emptyDir (ephemeral; all state is lost on restart).
persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""          # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""           # bind an existing PVC instead of provisioning one

service:
  type: ClusterIP
  # The web UI + API listen on 5522; the Service maps the same port.
  port: 5522

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
# The image bakes its base config; every setting is overridable at runtime with an
# XYOPS_<key> env var (pixl-config env override). e.g. set the admin base URL:
#   extraEnvVars:
#     - name: XYOPS_base_app_url
#       value: "https://xyops.example.com"
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

# The web UI is commonly reached from an Ingress or from across the cluster, so
# allow external ingress by default. Set allowExternal=false to restrict ingress
# to the namespace.
networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A tiny PVC (kind ships a default StorageClass) keeps /opt/xyops/data writable. No
# auth override: the chart generates a random secret_key, which is all a boot needs;
# the gate only checks the server answers on /api/app/ping.
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

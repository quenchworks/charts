{{- if not .Values.auth.existingSecret }}
{{- /* Resolve the secret_key: explicit value wins; else reuse the one already stored
       on a prior install; else generate a fresh random key. This keeps it stable
       across upgrades so sessions and signed tokens are not invalidated. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .) -}}
{{- $key := "" -}}
{{- if .Values.auth.secretKey -}}
{{- $key = .Values.auth.secretKey -}}
{{- else if and $existing $existing.data (index $existing.data "secret-key") -}}
{{- $key = index $existing.data "secret-key" | b64dec -}}
{{- else -}}
{{- $key = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ $key | b64enc | quote }}
{{- end }}

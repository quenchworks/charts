{{/* xyOps serves its web UI + JSON API on 5522. GET /api/app/ping returns 200 once
     pixl-server has started its web listener and opened the sqlite store. The native
     better-sqlite3 module + storage init make the first boot a little slow, so a
     startup probe guards the slow start and the liveness/readiness probes get generous
     timing so a slow node or large image pull does not flap. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $port := ternary "https" "http" (eq $tls "true") -}}
{{- $scheme := ternary "HTTPS" "HTTP" (eq $tls "true") -}}
{{- $startup := dict "httpGet" (dict "path" "/api/app/ping" "port" $port "scheme" $scheme) "initialDelaySeconds" 10 "periodSeconds" 5 "timeoutSeconds" 5 "failureThreshold" 30 -}}
{{- $liveness := dict "httpGet" (dict "path" "/api/app/ping" "port" $port "scheme" $scheme) "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/app/ping" "port" $port "scheme" $scheme) "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 6 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "xyops.headlessName" . }}
  replicas: 1
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "xyops.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: xyops
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # Required to boot: xyOps signs sessions/API tokens with secret_key.
            # Supplied from a Secret (chart-managed or user-provided existingSecret).
            - name: XYOPS_secret_key
              valueFrom:
                secretKeyRef:
                  name: {{ include "xyops.secretName" . }}
                  key: {{ include "xyops.secretKeyName" . }}
            {{- if $tls }}
            # Native TLS: xyOps' own HTTPS listener (pixl-server-web, WebServer.https*),
            # on 8443 because nonroot cannot bind 443; the Service maps it to 443.
            - name: XYOPS_WebServer__https
              value: "true"
            - name: XYOPS_WebServer__https_port
              value: "8443"
            - name: XYOPS_WebServer__https_cert_file
              value: /tls/tls.crt
            - name: XYOPS_WebServer__https_key_file
              value: /tls/tls.key
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: {{ $port }}
              containerPort: {{ ternary 8443 5522 (eq $tls "true") }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Persistent embedded sqlite store; the server only starts if it can write here.
            - name: data
              mountPath: /opt/xyops/data
            # read-only rootfs: xyOps also writes logs and temp files under /opt/xyops
            - name: logs
              mountPath: /opt/xyops/logs
            - name: temp
              mountPath: /opt/xyops/temp
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

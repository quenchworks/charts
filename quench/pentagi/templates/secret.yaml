{{- /* The admin password the bootstrap Job sets in place of upstream's seeded "admin", and the cookie signing salt
       (sessions are signed cookies: a new salt signs everyone out). Generated once and read back on upgrade. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $admin := get $old "admin-password" | b64dec | default (.Values.adminPassword | default (randAlphaNum 24)) }}
{{- $salt := get $old "cookie-signing-salt" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  cookie-signing-salt: {{ $salt | b64enc | quote }}
{{- end }}

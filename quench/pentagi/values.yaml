# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/pentagi
  digest: "sha256:174fb49b82c641404e4d2c52b0f632b2ea6c6c8cd2a5acc25a9dacae983b26d4"
  pullPolicy: IfNotPresent

nameOverride: ""

# The URL users reach PentAGI at (scheme and host, no trailing slash). Restricts CORS_ORIGINS to it; empty keeps
# upstream's "*".
publicURL: ""

# The password of admin@pentagi.com: generated into the Secret <fullname> (key admin-password) unless set here.
# The bootstrap Job puts it in place of upstream's seeded "admin" on first install.
adminPassword: ""

# admin-password plus the cookie signing salt: generated and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with keys admin-password and cookie-signing-salt instead

# The Docker API PentAGI's agents start their tool containers through. Every flow runs containers there (Kali,
# Debian, ...), so it is the most privileged part of the install.
docker:
  # A Podman sidecar serving the Docker API on the pod's loopback. It runs PRIVILEGED as root: put the release in
  # a namespace whose Pod Security admission allows that, and only where running untrusted tool containers is
  # acceptable.
  sidecar:
    enabled: true
    image:
      repository: ghcr.io/quenchworks/images/podman
      digest: "sha256:69f670ace51adc702765ba0e9266ba1abd4e33d5a2aa2946a64bf0abf75e678d"
      pullPolicy: IfNotPresent
    # images and containers live on an emptyDir; cap it so pulled tool images cannot fill the node
    storageSizeLimit: 20Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 4, memory: 8Gi }
  # With sidecar.enabled=false: your own Docker API, e.g. tcp://docker.example:2376 (TLS settings via settings).
  host: ""
  # A Docker network for the tool containers (DOCKER_NETWORK); created if missing.
  network: ""

# One server with DATA_DIR on one volume: one replica, replaced with Recreate (the default when this is empty).
replicaCount: 1
updateStrategy: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 4Gi
  annotations: {}

# The bundled QuenchWorks PostgreSQL (it ships pgvector, which the migrations enable). auth.username is the
# server's initdb superuser: the migrations create the vector extension and the bootstrap Job pgcrypto.
# username and database must differ from "postgres" and from each other.
postgresql:
  enabled: true
  auth:
    username: pentagi
    password: ""        # generated by the subchart if empty
    database: pentagi_db
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL with pgvector instead (postgresql.enabled=false), with a Secret holding the password. The
# role must be allowed to create the vector and pgcrypto extensions. The password must be URL-safe.
externalDatabase:
  host: ""
  port: 5432
  database: pentagi
  username: pentagi
  existingSecret: ""
  existingSecretPasswordKey: password
  sslmode: disable

# Helper image for the bootstrap Job (psql). Pinned by digest.
bootstrap:
  image:
    repository: ghcr.io/quenchworks/images/postgresql
    digest: "sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7"
    pullPolicy: IfNotPresent

# More PentAGI settings as environment variables (see .env.example upstream), e.g. OPEN_AI_KEY, ANTHROPIC_API_KEY,
# LLM_SERVER_URL, OLLAMA_SERVER_URL, DOCKER_DEFAULT_IMAGE_FOR_PENTEST. Keys belong in extraEnvVarsSecret.
settings: {}

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 2, memory: 2Gi }

service:
  type: ClusterIP
  port: 8443
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: PentAGI serves HTTPS instead of HTTP on 8443 from the PEM pair at /tls. The certificate comes from
# the first source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: pentagi.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [pentagi.example.com], secretName: pentagi-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

apiVersion: v2
name: leantime
description: "Leantime: project management for non-project-managers, with tasks, kanban, timesheets, goals and ideas, on the bundled PostgreSQL. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "3.15.3"
keywords:
  - leantime
  - project-management
  - kanban
  - timesheets
  - self-hosted
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Leantime/leantime
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned leantime to a rebuilt image digest (no application version change)."
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: leantime
      image: ghcr.io/quenchworks/images/leantime@sha256:e1b6932de2fc2539e00dcda9141335a121a99ee7fc11b5dc9e5d17ed642f77ee
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

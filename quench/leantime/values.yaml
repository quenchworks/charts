# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/leantime
  digest: "sha256:0b9851ef8a806cf259ec2c64edc3e1bf749477980abd1664ee6984d022c70dbf"
  pullPolicy: IfNotPresent

nameOverride: ""

# The public URL Leantime is served at (scheme, host and port, no trailing slash): links in mail and the
# request-origin check use it. Required.
appUrl: ""

# The first admin, created by the image's init on the first install (bin/leantime db:migrate). The password is
# generated into the Secret <fullname> (key admin-password) unless set here; later installs leave the user alone.
admin:
  email: ""
  password: ""

# Uploads, avatars, caches and sessions live on one volume: one replica, replaced with Recreate (the default when
# this is empty).
replicaCount: 1
updateStrategy: {}

# LEAN_SESSION_PASSWORD and the admin password: generated into the Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with keys "session-password" and "admin-password" instead

# /var/lib/leantime: storage/ (cache, sessions, logs), bootstrap/cache and the uploaded files.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 5Gi
  annotations: {}

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" (the image creates them).
postgresql:
  enabled: true
  auth:
    username: leantime
    password: ""        # generated by the subchart if empty
    database: leantime_db
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own database instead (postgresql.enabled=false): connection pgsql or mysql, and a Secret with the password.
externalDatabase:
  connection: pgsql
  host: ""
  port: 5432
  database: leantime
  username: leantime
  existingSecret: ""
  existingSecretPasswordKey: password

# More Leantime settings as environment variables (LEAN_*, see config/sample.env upstream), e.g. LEAN_SITENAME,
# LEAN_DEFAULT_TIMEZONE, LEAN_EMAIL_*.
settings: {}

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# Leantime has no TLS listener: terminate TLS here (and set appUrl to the https URL).
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: pm.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [pm.example.com], secretName: pm-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

{{- if .Values.cdi.create }}
{{- /* Delete this resource before uninstalling the chart: the operator removes CDI and its
finalizer; with the operator gone first the resource stays behind. */}}
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
  labels:
    app.kubernetes.io/name: cdi-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  {{- toYaml .Values.cdi.spec | nindent 2 }}
{{- end }}

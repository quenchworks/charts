apiVersion: v2
name: cdi-operator
description: "KubeVirt Containerized Data Importer (CDI) through its operator: DataVolumes import disk images from HTTP(S), S3 or a registry into PVCs, take uploads and clone volumes. The operator deploys the CDI controller, API server and upload proxy from a CDI resource. All seven component images are QuenchWorks-built from source, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.66.1"
kubeVersion: ">=1.29.0-0"

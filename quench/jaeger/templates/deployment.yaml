{{/* Jaeger v2's healthcheckv2 extension serves /status on :13133, returning 200
     once the collector pipeline and query extension are up. Used for readiness +
     liveness; a startup probe covers the initial boot. */}}
{{- $liveness := dict "httpGet" (dict "path" "/status" "port" "health") "initialDelaySeconds" 10 "periodSeconds" 15 "timeoutSeconds" 3 "failureThreshold" 3 -}}
{{- $readiness := dict "httpGet" (dict "path" "/status" "port" "health") "initialDelaySeconds" 5 "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 3 -}}
{{- $startup := dict "httpGet" (dict "path" "/status" "port" "health") "initialDelaySeconds" 5 "periodSeconds" 5 "failureThreshold" 30 -}}
{{- $hasConfig := include "jaeger.hasConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # In-memory storage is not shared across replicas; keep this a single replica
  # unless a real storage backend is configured via config.yaml.
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "jaeger.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: jaeger
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/jaeger"]
          {{- if or $hasConfig .Values.extraArgs }}
          args:
            {{- if $hasConfig }}
            - "--config"
            - "/etc/jaeger/config.yaml"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: query-http
              containerPort: 16686
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- if .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml .Values.customStartupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            {{- toYaml $startup | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $hasConfig }}
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        # Scratch space for the read-only root filesystem.
        - name: tmp
          emptyDir: {}
        {{- if $hasConfig }}
        - name: config
          configMap:
            name: {{ include "jaeger.mountedConfigMap" . }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

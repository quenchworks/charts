{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jaeger.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /etc/jaeger/config.yaml and passed to jaeger via --config.
  config.yaml: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}

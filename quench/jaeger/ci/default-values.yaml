# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# No config override: the gate boots the baked-in default All-in-One config with
# in-memory storage, which is what a default install ships, and proves the query
# UI, OTLP receivers, and healthcheck extension come up.
replicaCount: 1
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

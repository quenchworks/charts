# Quenchworks Apache Kvrocks on the QuenchWorks kvrocks image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). Kvrocks speaks the Redis protocol on 6666 and keeps
# its data in RocksDB on the PVC.
image:
  repository: ghcr.io/quenchworks/images/kvrocks
  digest: "sha256:f157c0d356460f51d42f10381c20fc3f984492c26d0a2b636873b4cc56041c78"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

auth:
  # Existing Secret with a `password` key. Empty generates one, kept across upgrades.
  existingSecret: ""

# Extra kvrocks flags, e.g. ["--workers", "4", "--rocksdb.block_cache_size", "4096"].
extraArgs: []

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 2000m, memory: 2Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 6666

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

# Quenchworks Apache Kvrocks on the QuenchWorks kvrocks image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). Kvrocks speaks the Redis protocol on 6666 and keeps
# its data in RocksDB on the PVC.
image:
  repository: ghcr.io/quenchworks/images/kvrocks
  digest: "sha256:410d8d249aecab6b524abed4689e4f9411fab1be0f84ca3f751d601b188c897a"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

auth:
  # Existing Secret with a `password` key. Empty generates one, kept across upgrades.
  existingSecret: ""

# Extra kvrocks flags, e.g. ["--workers", "4", "--rocksdb.block_cache_size", "4096"].
extraArgs: []

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 2000m, memory: 2Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 6666
  # Redis protocol over TLS, only with tls.enabled
  tlsPort: 6667

# Native TLS: a TLS listener on service.tlsPort beside plain 6666 (no client certificates).
# The certificate comes from the first source set: existingSecret, then a cert-manager
# Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

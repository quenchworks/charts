apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: redis
    {{- if include "quench-common.tls.enabled" . }}
    - name: redis-tls
      port: {{ .Values.service.tlsPort }}
      targetPort: redis-tls
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-headless
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6666
      targetPort: redis
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

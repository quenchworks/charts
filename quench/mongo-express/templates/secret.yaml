{{/*
The managed Secret holds the session and cookie secrets (always), the basic-auth password
(unless basicAuth.existingSecret supplies it) and the MongoDB URL (unless
mongodb.existingSecret supplies it). Generated values are read back from the live Secret,
so they stay stable across upgrades.
*/}}
{{- if not (or .Values.mongodb.url .Values.mongodb.existingSecret) }}
{{- fail "set mongodb.url (or mongodb.existingSecret): the MongoDB or FerretDB server to manage" }}
{{- end }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ .Values.sessionSecret | b64enc | default (get $existing "session-secret") | default (randAlphaNum 48 | b64enc) | quote }}
  cookie-secret: {{ .Values.cookieSecret | b64enc | default (get $existing "cookie-secret") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- if and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret) }}
  basic-auth-password: {{ .Values.basicAuth.password | b64enc | default (get $existing "basic-auth-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if not .Values.mongodb.existingSecret }}
  mongodb-url: {{ .Values.mongodb.url | b64enc | quote }}
  {{- end }}

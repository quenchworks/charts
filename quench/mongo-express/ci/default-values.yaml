# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest. The release workflow installs postgres-documentdb + FerretDB first and passes
# mongodb.url on the command line; basic auth, session and cookie secrets are generated.
# This file only has to render on its own for lint and template.
mongodb:
  url: mongodb://gate:gate@fdb-ferretdb:27017/

{{- /* The API key: ZAP refuses API calls without it (upstream generates a random one per start). Generated once and
       read back on upgrade. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $key := get $old "api-key" | b64dec | default (.Values.api.key | default (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}
{{- end }}

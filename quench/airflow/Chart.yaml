      description: "Initial clean-room Apache Airflow 3 chart: api-server + scheduler + dag-processor + triggerer workloads (LocalExecutor default) with an opt-in CeleryExecutor worker, a db-migrate Job, bundled-or-external PostgreSQL, bundled-or-external Redis/valkey broker, and generated-or-existing Fernet key + JWT secret."
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

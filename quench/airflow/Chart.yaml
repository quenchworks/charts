apiVersion: v2
name: airflow
description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a 0-CVE image
type: application
version: 0.1.10
appVersion: "3.3.1"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Updated airflow to 3.3.1 and re-pinned the image to its new 0-CVE digest (multi-arch, cosign-signed, SBOM + SLSA attested)."
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: airflow
      image: ghcr.io/quenchworks/images/airflow@sha256:3f8281e237049382092330d564faf289427c068b7e72070b998f3d03d2a6948e
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac4c4674d703666282dbbae9e4365114039160a982a9a72b7ea7241bfb23c829
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:c9ceca7878908b8446397cf83d78c6eeab0e64db18b54111ff704184ee995cae
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:cda19af7491d05b63de6cad2fcdc3f7b9dc7bb4a15fdc1a387b5e6c0dade2259
# Apache Airflow 3 has ONE HARD runtime dependency: a PostgreSQL metadata database. It
# refuses to boot without it. quench-common is the only always-on chart dependency; the
# metadata DB is choosable as BUNDLED (the QuenchWorks postgresql subchart) or EXTERNAL.
#
#   EXECUTOR:  LocalExecutor (default, no broker) | CeleryExecutor (adds a Redis/valkey
#              broker + a worker workload).
#   DATABASE:  bundled postgresql | external (externalDatabase.*)  — REQUIRED, exactly one.
#   BROKER (CeleryExecutor only): bundled valkey | bundled redis | external (externalRedis.*).
#              valkey is the 0-CVE BSD store; redis is the AGPL alternative. Enable AT
#              MOST ONE of valkey/redis. LocalExecutor needs no broker.
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

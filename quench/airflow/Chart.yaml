apiVersion: v2
name: airflow
description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a 0-CVE image
type: application
version: 0.1.16
appVersion: "3.3.2"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: postgresql 0.0.24, valkey 0.0.22, redis 0.0.22."
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: airflow
      image: ghcr.io/quenchworks/images/airflow@sha256:90e2deb3f998cdf5585f70968e111b48d77910dac2185403ebfdc2ffadd10fb1
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:9203d82de95544c95f9cde104f2a23b699423cfed9cc27251f09b51d45f93762
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:9a525827b9e4ed199538bd1b31d41faf903377c2fa5f24a149eb6ae365070e55
# Apache Airflow 3 has ONE HARD runtime dependency: a PostgreSQL metadata database. It
# refuses to boot without it. quench-common is the only always-on chart dependency; the
# metadata DB is choosable as BUNDLED (the QuenchWorks postgresql subchart) or EXTERNAL.
#
#   EXECUTOR:  LocalExecutor (default, no broker) | CeleryExecutor (adds a Redis/valkey
#              broker + a worker workload).
#   DATABASE:  bundled postgresql | external (externalDatabase.*)  — REQUIRED, exactly one.
#   BROKER (CeleryExecutor only): bundled valkey | bundled redis | external (externalRedis.*).
#              valkey is the 0-CVE BSD store; redis is the AGPL alternative. Enable AT
#              MOST ONE of valkey/redis. LocalExecutor needs no broker.
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

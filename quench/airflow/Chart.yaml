apiVersion: v2
name: airflow
description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a CVE-gated image
type: application
version: 0.1.56
appVersion: "3.3.2"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned airflow to a rebuilt image digest (no application version change). Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: airflow
      image: ghcr.io/quenchworks/images/airflow@sha256:fe3945a794c5e881f823739fd8b4ad97a0c73372e306934d036082cb92178472
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:66f9687d30e03a25298418dfbd8da5778df946cd40e38fe7a135a161327ca168
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:908b51c85087f89df471b259dcf117f85eadcf4288ece23704b1aa7b3a2f9528
# Apache Airflow 3 has ONE HARD runtime dependency: a PostgreSQL metadata database. It
# refuses to boot without it. quench-common is the only always-on chart dependency; the
# metadata DB is choosable as BUNDLED (the QuenchWorks postgresql subchart) or EXTERNAL.
#
#   EXECUTOR:  LocalExecutor (default, no broker) | CeleryExecutor (adds a Redis/valkey
#              broker + a worker workload).
#   DATABASE:  bundled postgresql | external (externalDatabase.*) , REQUIRED, exactly one.
#   BROKER (CeleryExecutor only): bundled valkey | bundled redis | external (externalRedis.*).
#              valkey is the CVE-gated BSD store; redis is the AGPL alternative. Enable AT
#              MOST ONE of valkey/redis. LocalExecutor needs no broker.
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.41
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

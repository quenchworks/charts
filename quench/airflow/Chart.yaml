apiVersion: v2
name: airflow
description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a 0-CVE image
type: application
version: 0.1.43
appVersion: "3.3.2"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore: re-pin bundled postgresql/mysql/mongodb/openbao images to the TLS-capable builds"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: airflow
      image: ghcr.io/quenchworks/images/airflow@sha256:f6d7236ff6c8b5ac831e7c387ab2fb2e59ef263663d75a301ebb1706de6b3cf4
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:beda4af6174e30ad6ed2d9ca9a8962e2d2cb59af2ffd98a9b846b1edc41a0636
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:51cd07f2bbe088c14296eb8e209f6462423655f6145049e7171e97a892d4ffd0
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:65a327efd3e0f4e26153604ed32810f19d25983bf2439f9d142b2eaac23b50c1
# Apache Airflow 3 has ONE HARD runtime dependency: a PostgreSQL metadata database. It
# refuses to boot without it. quench-common is the only always-on chart dependency; the
# metadata DB is choosable as BUNDLED (the QuenchWorks postgresql subchart) or EXTERNAL.
#
#   EXECUTOR:  LocalExecutor (default, no broker) | CeleryExecutor (adds a Redis/valkey
#              broker + a worker workload).
#   DATABASE:  bundled postgresql | external (externalDatabase.*)  — REQUIRED, exactly one.
#   BROKER (CeleryExecutor only): bundled valkey | bundled redis | external (externalRedis.*).
#              valkey is the 0-CVE BSD store; redis is the AGPL alternative. Enable AT
#              MOST ONE of valkey/redis. LocalExecutor needs no broker.
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

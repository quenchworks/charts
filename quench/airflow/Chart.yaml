apiVersion: v2
name: airflow
description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a 0-CVE image
type: application
version: 0.1.35
appVersion: "3.3.2"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Rust extensions rebuilt with cargo auditable (crate-visible to the gate)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: airflow
      image: ghcr.io/quenchworks/images/airflow@sha256:999bc4a314e8d0440df75578832bf8313b209f0bcc232c28f5c4348942d5ff5f
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:e3b4a823a4eb9f6863a0f87b2cd6b2d710f0f5977372b4161873d1861c180655
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:da2b2d24bdd369959b480a23d289d7fcb209968199e8c621700d8b7d3e8420a5
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:828627d61c06df6c81666b10eec89c140dc718c8e8897611f688fca974a35611
# Apache Airflow 3 has ONE HARD runtime dependency: a PostgreSQL metadata database. It
# refuses to boot without it. quench-common is the only always-on chart dependency; the
# metadata DB is choosable as BUNDLED (the QuenchWorks postgresql subchart) or EXTERNAL.
#
#   EXECUTOR:  LocalExecutor (default, no broker) | CeleryExecutor (adds a Redis/valkey
#              broker + a worker workload).
#   DATABASE:  bundled postgresql | external (externalDatabase.*)  — REQUIRED, exactly one.
#   BROKER (CeleryExecutor only): bundled valkey | bundled redis | external (externalRedis.*).
#              valkey is the 0-CVE BSD store; redis is the AGPL alternative. Enable AT
#              MOST ONE of valkey/redis. LocalExecutor needs no broker.
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

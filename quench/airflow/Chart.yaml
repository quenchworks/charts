description: Hardened Apache Airflow 3 workflow orchestration (api-server + scheduler + dag-processor + triggerer, optional Celery workers) on a 0-CVE image
type: application
version: 0.1.2
appVersion: "3.2.2"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/apache/airflow
keywords:
  - airflow
  - apache-airflow
  - workflow
  - orchestration
  - scheduler
  - dags
  - data-pipeline
  - etl
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |

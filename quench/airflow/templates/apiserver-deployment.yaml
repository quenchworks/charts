{{/*
API SERVER: runs `airflow api-server`, serving the web UI, the public REST API and the
Task Execution API on HTTP 8080 (binds 0.0.0.0:8080 by default). Health endpoint:
/api/v2/monitor/health (HTTP 200 once the server is up). The runtime image ships no HTTP
client, so the kubelet performs the GET.
*/}}
{{- $liveness := dict "httpGet" (dict "path" "/api/v2/monitor/health" "port" "http") "initialDelaySeconds" 20 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 10 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/v2/monitor/health" "port" "http") "initialDelaySeconds" 20 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airflow.componentFullname" (dict "ctx" . "component" "api-server") }}
  labels:
    {{- include "airflow.componentLabels" (dict "ctx" . "component" "api-server") | nindent 4 }}
spec:
  replicas: {{ .Values.apiServer.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "airflow.componentSelectorLabels" (dict "ctx" . "component" "api-server") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "airflow.componentSelectorLabels" (dict "ctx" . "component" "api-server") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "airflow.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        {{- include "airflow.waitForMigrations" . | nindent 8 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: api-server
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - api-server
            {{- with .Values.apiServer.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "airflow.backendEnv" . | nindent 12 }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "airflow.configMapName" . }}
            {{- with .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
          volumeMounts:
            {{- include "airflow.writableVolumeMounts" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- include "airflow.writableVolumes" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

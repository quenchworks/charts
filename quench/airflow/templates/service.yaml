apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    # Only the api-server serves HTTP (UI/REST API + the Task Execution API); the other
    # roles have no listener.
    {{- include "airflow.componentSelectorLabels" (dict "ctx" . "component" "api-server") | nindent 4 }}

{{/*
The chart-managed Secret carries up to FOUR keys:

  fernet-key   -> AIRFLOW__CORE__FERNET_KEY. Airflow needs a valid Fernet key (url-safe
                  base64 of 32 bytes) to encrypt connections/variables at rest. An empty
                  value is generated once and preserved across upgrades via a lookup.
  jwt-secret   -> AIRFLOW__API_AUTH__JWT_SECRET. MUST be identical across every component
                  (they authenticate to the api-server's Task Execution API with it). An
                  empty value is generated once (50 chars) and preserved across upgrades.

  TWO OPTIONAL backend passwords for the EXTERNAL-inline case only. Bundled backends read
  the subchart's OWN Secret, so nothing is rendered here; external-with-existingSecret
  reads that Secret; only external-without-existingSecret puts the password here:
    db-password     -> from externalDatabase.password
    redis-password  -> from externalRedis.password (CeleryExecutor only)
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderSecrets := not .Values.secrets.existingSecret -}}
{{- $renderPg := and (not .Values.postgresql.enabled) .Values.externalDatabase.host (not .Values.externalDatabase.existingSecret) -}}
{{- $renderRedis := and (eq (include "airflow.isCelery" .) "true") (not .Values.valkey.enabled) (not .Values.redis.enabled) (eq (include "airflow.redis.hasPassword" .) "true") (not .Values.externalRedis.existingSecret) -}}

{{- if or $renderSecrets $renderPg $renderRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderSecrets }}
  {{- /* Fernet key: keep the existing one if present; otherwise use the provided value or
         generate a valid url-safe base64 key from 32 random bytes. */ -}}
  {{- $fernet := .Values.secrets.fernetKey -}}
  {{- if and (not $fernet) $existing -}}{{- $fernet = index $existing.data "fernet-key" | b64dec -}}{{- end -}}
  {{- if not $fernet -}}{{- $fernet = randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" -}}{{- end }}
  fernet-key: {{ $fernet | b64enc | quote }}
  {{- $jwt := .Values.secrets.jwtSecret -}}
  {{- if and (not $jwt) $existing -}}{{- $jwt = index $existing.data "jwt-secret" | b64dec -}}{{- end -}}
  {{- if not $jwt -}}{{- $jwt = randAlphaNum 50 -}}{{- end }}
  jwt-secret: {{ $jwt | b64enc | quote }}
  {{- end }}
  {{- if $renderPg }}
  {{- $dbpw := .Values.externalDatabase.password -}}
  {{- if and (not $dbpw) $existing -}}{{- $dbpw = index $existing.data "db-password" | b64dec -}}{{- end -}}
  {{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
  {{- if $renderRedis }}
  {{- $rpw := .Values.externalRedis.password -}}
  {{- if and (not $rpw) $existing -}}{{- $rpw = index $existing.data "redis-password" | b64dec -}}{{- end -}}
  {{- if not $rpw -}}{{- $rpw = randAlphaNum 24 -}}{{- end }}
  redis-password: {{ $rpw | b64enc | quote }}
  {{- end }}
{{- end }}

{{- $base := dict
  "storm.zookeeper.servers" (include "storm.zookeeperServers" . | fromJsonArray)
  "storm.zookeeper.port" (ternary 2181 .Values.externalZookeeper.port .Values.zookeeper.enabled)
  "storm.zookeeper.root" (printf "/storm/%s" .Release.Name)
  "nimbus.seeds" (list (include "storm.nimbusHost" .))
  "nimbus.thrift.port" 6627
  "ui.port" 8080
  "storm.local.dir" "/data"
  "storm.log.dir" "/tmp/storm/logs"
  "supervisor.slots.ports" .Values.supervisor.slotPorts
-}}
{{- if include "quench-common.tls.enabled" . }}
{{- /* only the UI pod reads these; it mounts the PKCS12 the init container builds */ -}}
{{- $_ := set $base "ui.https.port" 8443 }}
{{- $_ := set $base "ui.https.keystore.path" "/tls-pkcs12/keystore.p12" }}
{{- $_ := set $base "ui.https.keystore.type" "PKCS12" }}
{{- $_ := set $base "ui.https.keystore.password" "changeit" }}
{{- $_ := set $base "ui.https.key.password" "changeit" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  storm.yaml: |
    {{- mergeOverwrite $base .Values.extraConfig | toYaml | nindent 4 }}

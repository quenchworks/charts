# Pinned by digest; the catalog lock moves it after every green image build. Never a tag.
image:
  repository: ghcr.io/quenchworks/images/storm
  digest: "sha256:fece31bd9f8df026d63b2904d3b8b655b194cb4d6dff5a360a38705065abfd42"
  pullPolicy: IfNotPresent

nameOverride: ""

# One image, three workloads. Nimbus keeps uploaded topology jars in storm.local.dir,
# so it runs as a StatefulSet with a PVC; supervisors and the UI are stateless.
nimbus:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

supervisor:
  replicaCount: 1
  # worker slots: one port per worker JVM the supervisor may launch
  slotPorts: [6700, 6701, 6702, 6703]
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: "2", memory: 4Gi }

ui:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    # HTTPS (to the UI's 8443), only with tls.enabled; replaces port
    httpsPort: 8443
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }

# Native TLS: the Storm UI serves HTTPS only on 8443 (ui.service.httpsPort; with ui.https.port
# set it closes HTTP 8080), from storm.yaml ui.https.* and a PKCS12 an init container on the openssl image builds. Nimbus,
# supervisors and ZooKeeper are unchanged. The certificate comes from the first source set:
# existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

# Extra storm.yaml keys, merged over the chart's (ZooKeeper, Nimbus seeds, ports, dirs).
extraConfig: {}

# The bundled ZooKeeper. Set enabled: false and externalZookeeper.servers to use your own.
zookeeper:
  enabled: true
externalZookeeper:
  servers: []
  port: 2181

podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

description: "Linkerd CNI plugin: a DaemonSet that chains the linkerd-cni plugin into each node's CNI configuration so meshed pods get their traffic redirected to the Linkerd proxy without the privileged linkerd-init container. Pairs with the QuenchWorks linkerd chart (cniEnabled). Hardened by QuenchWorks: built from source on Wolfi, 0-CVE, cosign-signed and pinned by digest."

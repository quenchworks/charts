# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/etherpad
  digest: "sha256:a56015480728007fde4e0de2c53f31f6d78703efd8f3d1fdfcbe1a230f7181b8"
  pullPolicy: IfNotPresent

nameOverride: ""

title: Etherpad

# The URL users reach Etherpad at (scheme and host, no trailing slash). Sets PUBLIC_URL and the built-in SSO issuer
# and redirect URIs; leave empty for local use.
publicURL: ""

# How the HTTP API authenticates: "sso" (upstream default, OAuth2 from Etherpad's own OIDC provider) or "apikey"
# (APIKEY.txt on the volume).
authenticationMethod: sso

# Behind an Ingress or proxy that sets X-Forwarded-*: true.
trustProxy: false

# The /admin password (user "admin"): generated into the Secret <fullname> (key admin-password) unless set here.
adminPassword: ""

# admin-password plus the two SSO client secrets (sso-admin-secret, sso-user-secret): generated and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with keys admin-password, sso-admin-secret and sso-user-secret instead

# The minified cache and the API/session key files live on one volume (pads are in PostgreSQL): one replica,
# replaced with Recreate (the default when this is empty).
replicaCount: 1
updateStrategy: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  annotations: {}

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" and from each other
# (the image skips creating a database named like its user).
postgresql:
  enabled: true
  auth:
    username: etherpad
    password: ""        # generated by the subchart if empty
    database: etherpad_db
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false), with a Secret holding the password.
externalDatabase:
  host: ""
  port: 5432
  database: etherpad
  username: etherpad
  existingSecret: ""
  existingSecretPasswordKey: password

# More Etherpad settings as environment variables (see settings.json.docker upstream), e.g. DEFAULT_PAD_TEXT,
# SKIN_NAME, REQUIRE_AUTHENTICATION, LOGLEVEL.
settings: {}

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 9001
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: Etherpad serves HTTPS instead of HTTP on 9001 from the PEM pair at /tls. The certificate comes from
# the first source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: pad.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [pad.example.com], secretName: pad-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

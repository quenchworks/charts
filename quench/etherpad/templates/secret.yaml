{{- /* The /admin password and the two built-in SSO client secrets (upstream defaults them to "admin" / "user"):
       generated once and read back on upgrade. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $admin := get $old "admin-password" | b64dec | default (.Values.adminPassword | default (randAlphaNum 24)) }}
{{- $sa := get $old "sso-admin-secret" | b64dec | default (randAlphaNum 40) }}
{{- $su := get $old "sso-user-secret" | b64dec | default (randAlphaNum 40) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  sso-admin-secret: {{ $sa | b64enc | quote }}
  sso-user-secret: {{ $su | b64enc | quote }}
{{- end }}

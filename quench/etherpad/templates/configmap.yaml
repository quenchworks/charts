{{- if eq (include "quench-common.tls.enabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-tls-settings
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  credentials.json: |
    {"ssl": {"key": "/tls/tls.key", "cert": "/tls/tls.crt"}}
{{- end }}

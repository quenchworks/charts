{{- /* Readiness waits for /api/status, which answers 503 until the cluster is reachable;
liveness only checks the port, so an OpenSearch outage does not restart the UI. */ -}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 60 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" (printf "%s/api/status" (trimSuffix "/" (get .Values.extraConfig "server.basePath" | default ""))) "port" "http") "initialDelaySeconds" 20 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $fullname := include "quench-common.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # the config is mounted with subPath, which never updates in place; a change rolls the pods
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opensearch-dashboards.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opensearch-dashboards
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            # holds the instance uuid; saved objects live in OpenSearch
            - name: data
              mountPath: /usr/share/opensearch-dashboards/data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

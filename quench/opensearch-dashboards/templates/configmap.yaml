apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  opensearch_dashboards.yml: |
    {{- $cfg := dict "server.host" "0.0.0.0" "opensearch.hosts" .Values.opensearch.hosts }}
    {{- toYaml (merge (deepCopy .Values.extraConfig) $cfg) | nindent 4 }}

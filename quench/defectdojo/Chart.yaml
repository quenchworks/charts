apiVersion: v2
name: defectdojo
description: "DefectDojo: vulnerability management and ASPM. Imports findings from 200+ scanners, dedupes and tracks them, with Celery worker and beat on the bundled PostgreSQL and Valkey. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "3.5.300"
keywords:
  - defectdojo
  - vulnerability-management
  - aspm
  - security
  - devsecops
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/DefectDojo/django-DefectDojo
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Updated defectdojo to 3.5.300 and re-pinned the image to its new rebuilt digest. Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: defectdojo
      image: ghcr.io/quenchworks/images/defectdojo@sha256:873e1fa22cee165ba3a9ddb0a34f9d0cb46854f458c79f1b38d5d64a9dc70d1b
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:66f9687d30e03a25298418dfbd8da5778df946cd40e38fe7a135a161327ca168
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.41
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

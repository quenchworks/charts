{{- /* The first admin's password, generated once and read back on upgrade. Beszel creates the
       superuser and an admin user from USER_EMAIL / USER_PASSWORD on its first start only. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "beszel.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.admin.password | default (get (($old | default dict).data | default dict) "password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}

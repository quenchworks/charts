# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and vikunja writes
# its SQLite DB to it. A fixed JWTSecret makes the boot deterministic (no random
# per-boot secret); rotate it (and use a Secret) in a real deployment.
persistence:
  enabled: true
  size: 1Gi

extraEnvVars:
  - name: VIKUNJA_SERVICE_JWTSECRET
    value: quench-ci-fixed-jwt-secret-change-me

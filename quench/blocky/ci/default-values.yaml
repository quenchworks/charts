# Install gate. No image override: the install uses the chart's real, CI-maintained digest.
config:
  customDNS:
    mapping:
      smoke.quench.test: 192.0.2.10
  blocking:
    denylists:
      gate:
        - |
          blocked.quench.test
    clientGroupsBlock:
      default:
        - gate
tls:
  enabled: true

{{- if not .Values.tls.enabled }}
{{- fail "kanidmd always serves TLS: keep tls.enabled true (existingSecret, cert-manager or the Helm-made CA)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  server.toml: |
    version = "2"
    bindaddress = "0.0.0.0:8443"
    {{- if .Values.ldap.enabled }}
    ldapbindaddress = "0.0.0.0:3636"
    {{- end }}
    db_path = "/data/kanidm.db"
    tls_chain = "/tls/tls.crt"
    tls_key = "/tls/tls.key"
    domain = {{ required "domain is required" .Values.domain | quote }}
    origin = {{ include "kanidm.origin" . | quote }}
    {{- with .Values.backup }}
    {{- if .enabled }}
    [online_backup]
    path = "/data/backups/"
    schedule = {{ .schedule | quote }}
    versions = {{ int .versions }}
    {{- end }}
    {{- end }}

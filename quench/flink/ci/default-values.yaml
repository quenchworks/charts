# Install gate on kind: smaller processes so both fit, and two taskmanagers so the gate
# proves registration across pods (not just one co-located process).
jobmanager:
  memoryProcessSize: 1024m
  resources:
    requests: { cpu: 100m, memory: 1024Mi }
    limits: { cpu: 1000m, memory: 1280Mi }
taskmanager:
  replicas: 2
  numberOfTaskSlots: 2
  memoryProcessSize: 1024m
  resources:
    requests: { cpu: 100m, memory: 1024Mi }
    limits: { cpu: 1000m, memory: 1280Mi }

# Quenchworks Apache Flink: a session cluster (one jobmanager, N taskmanagers) on the
# QuenchWorks image (official binary dist, log4j fixed, nonroot, 0-CVE, pinned by digest).
image:
  repository: ghcr.io/quenchworks/images/flink
  digest: "sha256:a34b20a605b2eb8337b17425b7e889799717851ffc10fe9e571d8cbcfd9d6d24"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

jobmanager:
  # jobmanager.memory.process.size; keep it under the container memory limit
  memoryProcessSize: 1600m
  resources:
    requests: { cpu: 250m, memory: 1600Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  nodeSelector: {}
  affinity: {}
  tolerations: []

taskmanager:
  replicas: 1
  numberOfTaskSlots: 2
  # taskmanager.memory.process.size; keep it under the container memory limit
  memoryProcessSize: 1728m
  resources:
    requests: { cpu: 500m, memory: 1728Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Extra Flink configuration, applied to both roles as FLINK_PROPERTIES (key: value), e.g.
#   state.backend.type: rocksdb
#   execution.checkpointing.interval: 30s
flinkProperties: {}

extraEnvVars: []

# Native TLS: the JobManager REST endpoint (UI and API, service.port) serves HTTPS, and plain
# HTTP there gets a redirect. Flink reads a keystore, so an init container on the openssl image
# builds a PKCS12. RPC between JobManager and TaskManagers is unchanged. The certificate comes
# from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:914fbcf857be13a249ebb27c4266f30ced006e80ffc5b63a8c00298bd211e519"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # REST API and web UI
  port: 8081

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

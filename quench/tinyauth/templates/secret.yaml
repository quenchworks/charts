{{- /* The admin's password and its bcrypt line (Helm's htpasswd) for TINYAUTH_AUTH_USERS. Both are
       generated once and read back on upgrade, so the hash and the password stay a matching pair. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $oldPw := get $old "password" | b64dec }}
{{- $pw := .Values.admin.password | default $oldPw | default (randAlphaNum 24) }}
{{- $admin := get $old "admin" | b64dec }}
{{- if or (not $admin) (ne $pw $oldPw) (not (hasPrefix (printf "%s:" .Values.admin.username) $admin)) }}
{{- $admin = htpasswd .Values.admin.username $pw }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  admin: {{ $admin | b64enc | quote }}
  users: {{ prepend .Values.extraUsers $admin | join "," | b64enc | quote }}
{{- end }}

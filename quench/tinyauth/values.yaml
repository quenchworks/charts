# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/tinyauth
  digest: "sha256:dff9fbbf1e95d580ff1cb0e26e32bcd18808ba22980703ed5fd1bea32c204f6c"
  pullPolicy: IfNotPresent

nameOverride: ""

# Tinyauth keeps sessions in SQLite under /data: run one replica (Recreate with the volume).
replicaCount: 1
updateStrategy:
  type: Recreate

# The address people open for the login page. It must be a dotted host (auth.example.com): Tinyauth
# sets its session cookie on the parent domain (example.com), so protected apps live beside it. An
# https URL also turns on secure cookies.
appUrl: http://auth.example.com

# The admin user. Empty password: generated into the Secret <fullname> (password), with its bcrypt
# line in TINYAUTH_AUTH_USERS. existingSecret: a Secret whose key "users" holds the whole
# TINYAUTH_AUTH_USERS value (user:bcrypt-hash, comma-separated) instead.
admin:
  username: admin
  password: ""
  existingSecret: ""

# More local users as "name:bcrypt-hash" (htpasswd -nbB name pass | cut -d: -f1,2).
extraUsers: []

# More Tinyauth settings as TINYAUTH_* environment variables (https://tinyauth.app/docs), e.g.
# OAuth providers or TINYAUTH_AUTH_TRUSTEDPROXIES. Secrets go through extraEnvVars/extraEnvVarsSecret.
# The label provider (ACLs from Docker or Kubernetes labels) is off: its kubernetes mode needs RBAC
# this chart does not grant. Analytics (an anonymous version ping upstream) is off.
settings:
  TINYAUTH_LABELPROVIDER: none
  TINYAUTH_ANALYTICS_ENABLED: "false"

# The data volume: the SQLite session database. Without it a restart logs everyone out.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

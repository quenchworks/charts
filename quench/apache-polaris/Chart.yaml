apiVersion: v2
name: apache-polaris
description: "Apache Polaris, the open REST catalog for Apache Iceberg: Iceberg REST and management APIs, catalog RBAC and storage credential vending. In-memory metastore for a quick start, PostgreSQL (bundled or external) for production. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.8.0"
keywords:
  - polaris
  - iceberg
  - lakehouse
  - catalog
  - rest-catalog
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/polaris
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "first release: Apache Polaris 1.8.0, in-memory or PostgreSQL metastore"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: apache-polaris
      image: ghcr.io/quenchworks/images/apache-polaris@sha256:04919057ae9f76940e92d1abed6add99491525559bf1c89ff35396c1d7d901cc
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

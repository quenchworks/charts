# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-apache-polaris, OCI URL oci://ghcr.io/quenchworks/charts/apache-polaris.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # apache-polaris (oci://ghcr.io/quenchworks/charts/apache-polaris)

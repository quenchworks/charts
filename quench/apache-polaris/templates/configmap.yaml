{{- if .Values.properties }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  application.properties: |
    {{- range $k, $v := .Values.properties }}
    {{ $k }}={{ $v }}
    {{- end }}
{{- end }}

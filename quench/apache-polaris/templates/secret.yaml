{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := .Values.auth.clientSecret -}}
{{- if and (not $secret) $existing -}}
{{- $secret = index $existing.data "client-secret" | b64dec -}}
{{- end -}}
{{- if not $secret -}}
{{- $secret = randAlphaNum 32 -}}
{{- end -}}
{{- $key := "" -}}
{{- if and $existing (index $existing.data "token-key") -}}
{{- $key = index $existing.data "token-key" | b64dec -}}
{{- else -}}
{{- $key = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ .Values.auth.clientId | b64enc | quote }}
  client-secret: {{ $secret | b64enc | quote }}
  # signs the access tokens; shared by every replica
  token-key: {{ $key | b64enc | quote }}
{{- end }}

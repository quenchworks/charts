# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# The admin password is CI-only; the gate logs in with it and lists the file source.
auth:
  adminPassword: quench-ci-admin-pass
persistence:
  enabled: true
  size: 256Mi
files:
  enabled: true
  size: 256Mi
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

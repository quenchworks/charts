apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    http:
      port: 8080
      baseURL: {{ .Values.baseURL | quote }}
    server:
      cacheDir: /tmp/filebrowser
      sources:
        - path: /srv
          {{- with .Values.sourceName }}
          name: {{ . | quote }}
          {{- end }}
    auth:
      adminUsername: admin
      methods:
        password:
          enabled: true
          minLength: {{ .Values.auth.passwordMinLength }}
          signup: {{ .Values.auth.signup }}
    {{- with .Values.extraConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

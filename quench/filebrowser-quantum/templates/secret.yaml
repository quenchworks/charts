{{- if not .Values.auth.existingSecret }}
{{- /* Keep generated values across upgrades: a new JWT secret would sign every user out,
       and the admin password only applies on first start anyway. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .) }}
{{- $oldData := ($old | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.auth.adminPassword | default "" | b64enc | default (get $oldData "admin-password") | default (randAlphaNum 24 | b64enc) | quote }}
  jwt-secret: {{ get $oldData "jwt-secret" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}

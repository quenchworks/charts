{{- if not .Values.auth.existingSecret }}
{{- /* Generated keys are read back from the live Secret on upgrade, so they stay stable. */ -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .)).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.existingSecretAccessKeyKey }}: {{ .Values.auth.accessKey | b64enc | default (get $old .Values.auth.existingSecretAccessKeyKey) | default (randAlphaNum 20 | b64enc) | quote }}
  {{ .Values.auth.existingSecretSecretKeyKey }}: {{ .Values.auth.secretKey | b64enc | default (get $old .Values.auth.existingSecretSecretKeyKey) | default (randAlphaNum 40 | b64enc) | quote }}
{{- end }}

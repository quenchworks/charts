{{/* The host check covers every path, /api/healthcheck included, and the
     kubelet would send the pod IP as Host. So the probes send
     localhost:<port>, which Homepage always allows. */}}
{{- $hc := dict "httpGet" (dict "path" "/api/healthcheck" "port" "http" "httpHeaders" (list (dict "name" "Host" "value" "localhost:3000"))) -}}
{{- $liveness := merge (dict "initialDelaySeconds" 15 "periodSeconds" 20) (deepCopy $hc) -}}
{{- $readiness := merge (dict "initialDelaySeconds" 5 "periodSeconds" 10) (deepCopy $hc) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "homepage.files" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "homepage.serviceAccountName" . }}
      {{- if .Values.rbac.create }}
      # config.kubernetes.mode: cluster reads the API with this token.
      automountServiceAccountToken: true
      {{- end }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: homepage
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PORT
              value: "3000"
            {{- with .Values.allowedHosts }}
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # A writable dir with each config file mounted into it by subPath:
            # Homepage creates any file it does not find (from its defaults).
            - name: config-dir
              mountPath: /app/config
            {{- range $name, $_ := (include "homepage.files" . | fromYaml) }}
            - name: config
              mountPath: /app/config/{{ $name }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quench-common.fullname" . }}
        - name: config-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

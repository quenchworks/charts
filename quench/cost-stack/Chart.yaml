apiVersion: v2
name: cost-stack
description: "Hardened Kubernetes cost monitoring stack: OpenCost (the CNCF cost model) reading cluster metrics from a bundled Prometheus, plus Grafana with that Prometheus provisioned as a datasource. Prometheus scrapes container usage from the kubelet (cAdvisor) and OpenCost's own pricing and allocation metrics; OpenCost serves cost allocation on <release>-opencost:9003. No operator, no CRDs. Every image is QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.4
appVersion: "1.121.3"
keywords:
  - cost
  - finops
  - opencost
  - prometheus
  - grafana
  - kubernetes
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/opencost/opencost
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles grafana=0.0.18,opencost=0.0.6,prometheus=0.0.22 (2026-10-22 CVE rebuild)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: opencost
      image: ghcr.io/quenchworks/images/opencost@sha256:1086665a1133a4b12c4077fa5d3344a3e9312b4269615b05a6e7462304b65c62
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:6263c43a967820cd827f462f021b70b084d78084de82d2b735b8d30709ae53c5
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:55e1905467f2b38d95705ef32eb46d30cc6fbce8c4a4249c457cf27c487e8ddd
  artifacthub.io/operator: "false"

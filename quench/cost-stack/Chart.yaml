      image: ghcr.io/quenchworks/images/opencost@sha256:c43675627ecbca939068c299d618b92a255c662d3a70e10d5723d463bc98c653
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:3aea47c759774709cc343b5ef17a58664475ad62cfe7374acd96d6f472fe8c93
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:75c32316603e6b4442f2bda16b25e123d2f073582d7ce2f47d4ce748bfcc17d9
  artifacthub.io/operator: "false"

      image: ghcr.io/quenchworks/images/opencost@sha256:c52421b1b1eb49b584124903949ab88b0b28000090f4cd242a41aaa0a53230c7
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:8e9254d8deac559c2520e0c295da15d86e099c444b762bfc11682278cc7bca7b
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:5fad18f2054178ba8e6ecbc39b4a1127318060a69b2edf2ed4d2b6b312d62c88
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

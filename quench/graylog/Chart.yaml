apiVersion: v2
name: graylog
description: Hardened Graylog log management server on a 0-CVE nonroot image, with bundled MongoDB (config/metadata) and OpenSearch (log storage) backends. NOTE the SSPL-1.0 license (source-available, not OSI-approved).
type: application
version: 0.0.9
appVersion: "7.1.8"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Graylog2/graylog2-server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - graylog
  - logging
  - log-management
  - siem
  - observability
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned to 7.1.8 rebuilt 0-CVE, replacing the broken 7.1.7 build. Ships httpclient5 5.6.4 paired with opensearch-java 3.6.0's transport, which is the pairing that avoids the double-inflate ZipException."
  # Graylog is a log management / SIEM server: monitoring-logging is the honest fit
  # from the ArtifactHub category enum.
  category: monitoring-logging
  # Graylog Server is licensed SSPL-1.0 — SOURCE-AVAILABLE, NOT OSI-approved open
  # source. Surfaced loudly here and in the README so the license status is never
  # implied to be OSI-open.
  licenses: SSPL-1.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: SSPL-1.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/Graylog2/graylog2-server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: graylog
      image: ghcr.io/quenchworks/images/graylog@sha256:364d589f0d75ff9f83cdf4b58b32233648997445b3ce16c75b7dfcbc6661ee68
    - name: mongodb
      image: ghcr.io/quenchworks/images/mongodb@sha256:e540b335ce42f3cf4c4421f273702aa13c6a3336c1d61eb90f6a13c2a2f6a3b6
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:45c60f2fc239ae611ce1c9a829c639e3a1dab7ee21ca4186fff457907076395f
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mongodb
    alias: mongodb
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: mongodb.enabled
  - name: opensearch
    alias: opensearch
    version: 0.1.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: opensearch.enabled

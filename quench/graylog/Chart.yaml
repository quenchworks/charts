apiVersion: v2
name: graylog
description: Hardened Graylog log management server on a 0-CVE nonroot image, with bundled MongoDB (config/metadata) and OpenSearch (log storage) backends. NOTE the SSPL-1.0 license (source-available, not OSI-approved).
type: application
version: 0.0.12
appVersion: "7.1.9"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Graylog2/graylog2-server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - graylog
  - logging
  - log-management
  - siem
  - observability
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: mongodb 0.0.17, opensearch 0.1.7."
  # Graylog is a log management / SIEM server: monitoring-logging is the honest fit
  # from the ArtifactHub category enum.
  category: monitoring-logging
  # Graylog Server is licensed SSPL-1.0 — SOURCE-AVAILABLE, NOT OSI-approved open
  # source. Surfaced loudly here and in the README so the license status is never
  # implied to be OSI-open.
  licenses: SSPL-1.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: SSPL-1.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/Graylog2/graylog2-server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: graylog
      image: ghcr.io/quenchworks/images/graylog@sha256:81efe536f8a7fad40bc5d8c04a5ad10bf0ef7a2db442919680f2050443779fe9
    - name: mongodb
      image: ghcr.io/quenchworks/images/mongodb@sha256:74e36c296781b85bd27a0a0c4a59a565c999bb630b6f93e087374f46be10b72c
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:57328bd33b6f622622fa273c2c50611deea19f44ef5f0acc0a997782c9e4aa5e
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mongodb
    alias: mongodb
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: mongodb.enabled
  - name: opensearch
    alias: opensearch
    version: 0.1.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: opensearch.enabled

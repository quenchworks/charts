apiVersion: v2
name: graylog
description: Hardened Graylog log management server on a 0-CVE nonroot image, with bundled MongoDB (config/metadata) and OpenSearch (log storage) backends. NOTE the SSPL-1.0 license (source-available, not OSI-approved).
type: application
version: 0.0.7
appVersion: "7.1.7"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Graylog2/graylog2-server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - graylog
  - logging
  - log-management
  - siem
  - observability
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Updated graylog to 7.1.7 and re-pinned the image to its new 0-CVE digest (multi-arch, cosign-signed, SBOM + SLSA attested)."
  # Graylog is a log management / SIEM server: monitoring-logging is the honest fit
  # from the ArtifactHub category enum.
  category: monitoring-logging
  # Graylog Server is licensed SSPL-1.0 — SOURCE-AVAILABLE, NOT OSI-approved open
  # source. Surfaced loudly here and in the README so the license status is never
  # implied to be OSI-open.
  licenses: SSPL-1.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: SSPL-1.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/Graylog2/graylog2-server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: graylog
      image: ghcr.io/quenchworks/images/graylog@sha256:95f844acb81b61113217d968ef34f69afa7388aec05b39bc429a1a6b57b994b5
    - name: mongodb
      image: ghcr.io/quenchworks/images/mongodb@sha256:04f1aa4d1229531ec267e8ca59253500079d04e79933755f725ad7ae65bc2e83
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:35048e73302f817d1bed340a317b41ec8a7d709a3cd55c75b90d8a61faf75d3b
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mongodb
    alias: mongodb
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: mongodb.enabled
  - name: opensearch
    alias: opensearch
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: opensearch.enabled

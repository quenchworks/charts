{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Web UI + REST API (and any declared message-input ports). Default restricts ingress to
    # the release namespace (allowExternal: false). Set it true (and front Graylog with an
    # ingress/TLS proxy) to reach it from outside the namespace.
    - ports:
        - port: http
          protocol: TCP
        {{- range .Values.service.inputs }}
        - port: {{ .name }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Backends: MongoDB (config/metadata) and OpenSearch (log storage). Open cluster-wide so
    # both the bundled subchart pods and external backends are reachable.
    - ports:
        - port: 27017
          protocol: TCP
        - port: 9200
          protocol: TCP
    # General egress (GeoIP/marketplace fetches, outbound notifications/SMTP, etc.).
    - {}
{{- end }}

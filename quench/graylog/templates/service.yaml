apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Graylog web UI + REST API (single port, HTTPS on httpsPort with tls.enabled).
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
      protocol: TCP
    {{- else }}
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
    {{- end }}
    {{- range .Values.service.inputs }}
    # Message input (created at runtime in the Graylog UI).
    - port: {{ .port }}
      targetPort: {{ .name }}
      name: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{/*
The managed Secret carries the three sensitive Graylog server settings, injected into the
pod via secretKeyRef so they never appear in the pod's argv / process list:

  password-secret     GRAYLOG_PASSWORD_SECRET     — server secret for stored-credential
                      encryption (>= 16 chars). Resolved: explicit graylog.passwordSecret ->
                      this Secret's prior value (lookup, so it is stable across upgrades) ->
                      a fresh random 96-char value.
  root-password-sha2  GRAYLOG_ROOT_PASSWORD_SHA2  — sha256 of graylog.adminPassword. The
                      plaintext admin password is never stored, only its hash.
  mongodb-uri         GRAYLOG_MONGODB_URI         — full mongodb:// connection URI (only when
                      this chart manages it; see below).

MongoDB URI. With the bundled MongoDB the password must match the one the MongoDB subchart
provisions for its root user. To keep them in sync the value is resolved in this order:
explicit mongodb.auth.rootPassword -> the subchart's already-rendered Secret
(<release>-mongodb / mongodb-root-password) via lookup -> this Secret's prior value ->
a fresh 24-char random. Set mongodb.auth.rootPassword for a deterministic install. When an
EXTERNAL MongoDB is used WITH externalMongodb.existingSecret, no mongodb-uri is rendered
here — the referenced Secret must supply it under externalMongodb.existingSecretUriKey.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- password-secret ---- */}}
{{- $ps := .Values.graylog.passwordSecret -}}
{{- if and (not $ps) $existing -}}{{- $ps = index $existing.data "password-secret" | default "" | b64dec -}}{{- end -}}
{{- if not $ps -}}{{- $ps = randAlphaNum 96 -}}{{- end -}}

{{/* ---- root-password-sha2 ---- */}}
{{- $adminPw := required "graylog.adminPassword is required (the admin account password; only its sha256 is stored)" .Values.graylog.adminPassword -}}
{{- $sha := sha256sum $adminPw -}}

{{/* ---- mongodb-uri ---- */}}
{{- $mongoUri := "" -}}
{{- if include "graylog.manageMongoUri" . -}}
{{- if .Values.mongodb.enabled -}}
{{- $pw := .Values.mongodb.auth.rootPassword -}}
{{- if not $pw -}}
{{- $mdbSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mongodb" .Release.Name) -}}
{{- if $mdbSecret -}}{{- $pw = index $mdbSecret.data "mongodb-root-password" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- if and (not $pw) $existing -}}
{{- $prior := index $existing.data "mongodb-uri" | default "" | b64dec -}}
{{- if $prior -}}{{- $mongoUri = $prior -}}{{- end -}}
{{- end -}}
{{- if not $mongoUri -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- $mongoUri = printf "mongodb://%s:%s@%s-mongodb:27017/%s?authSource=admin" .Values.mongodb.auth.rootUsername $pw .Release.Name .Values.graylog.mongodbDatabase -}}
{{- end -}}
{{- else -}}
{{- $mongoUri = required "externalMongodb.uri is required when mongodb.enabled=false and no externalMongodb.existingSecret is set" .Values.externalMongodb.uri -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password-secret: {{ $ps | b64enc | quote }}
  root-password-sha2: {{ $sha | b64enc | quote }}
  {{- if include "graylog.manageMongoUri" . }}
  mongodb-uri: {{ $mongoUri | b64enc | quote }}
  {{- end }}

{{/* Liveness hits the API root; readiness hits the load-balancer status endpoint, which
     reports ALIVE (200) only once Graylog has connected to MongoDB + OpenSearch and is
     serving — so --wait on readiness is the real integration test. The startup probe
     (customStartupProbe) gates these during the slow JVM first boot. The kubelet performs
     the GET; the image ships no shell HTTP client. */}}
{{- $liveness := dict "httpGet" (dict "path" "/api" "port" "http") "initialDelaySeconds" 60 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/system/lbstatus" "port" "http") "initialDelaySeconds" 30 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The data PVC is ReadWriteOnce and Graylog holds it (and its node-id) exclusively;
  # Recreate avoids two pods contending for the volume during a rollout.
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the managed Secret (password-secret / mongo URI) changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "graylog.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: graylog
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # Every Graylog config key is overridable via a GRAYLOG_<KEY> env var; the image's
            # entrypoint renders these into server.conf and launches the server.
            # Public URI the web UI / API clients reach Graylog at. REQUIRED.
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: {{ required "graylog.externalUri is required" .Values.graylog.externalUri | quote }}
            - name: GRAYLOG_HTTP_BIND_ADDRESS
              value: {{ .Values.graylog.bindAddress | quote }}
            - name: GRAYLOG_ROOT_USERNAME
              value: {{ .Values.graylog.adminUsername | quote }}
            {{- with .Values.graylog.serverJavaOpts }}
            - name: GRAYLOG_SERVER_JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            # Log storage (OpenSearch / Elasticsearch hosts).
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: {{ include "graylog.opensearch.hosts" . | quote }}
            # Sensitive settings sourced from the managed Secret, never inlined into the pod env.
            - name: GRAYLOG_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretName" . }}
                  key: password-secret
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretName" . }}
                  key: root-password-sha2
            - name: GRAYLOG_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.mongo.secretName" . }}
                  key: {{ include "graylog.mongo.uriKey" . }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- range .Values.service.inputs }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable state: rendered server.conf, node-id, message journal.
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # Writable scratch for the JVM (java.io.tmpdir) with a read-only rootfs.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
        {{- if not .Values.persistence.enabled }}
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "quench-common.fullname" . }}-data
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

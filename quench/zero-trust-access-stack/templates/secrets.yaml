{{- /* Generated once and kept (lookup) across upgrades; kept on uninstall. Fixed name: the
subcharts read it from plain values. */ -}}
{{- $name := "zt-secrets" -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  oidc-client-secret: {{ index $old "oidc-client-secret" | default (randAlphaNum 48 | b64enc) }}
  bootstrap-password: {{ index $old "bootstrap-password" | default (randAlphaNum 32 | b64enc) }}
  bootstrap-token: {{ index $old "bootstrap-token" | default (randAlphaNum 48 | b64enc) }}

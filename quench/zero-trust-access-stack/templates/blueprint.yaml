{{- /* Authentik blueprint (applied by the worker from /blueprints/custom): the OAuth2 provider and
application "headscale". The redirect URI follows headscale.serverUrl. */ -}}
{{- $hs := .Values.headscale -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zt-blueprint
  labels:
    {{- include "zt.labels" . | nindent 4 }}
data:
  zt-headscale.yaml: |
    version: 1
    metadata:
      name: zero-trust-access-stack headscale
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: headscale-provider
        identifiers:
          name: headscale
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Authentik 2026.x rejects a grant type a provider does not list
          grant_types: [authorization_code, refresh_token]
          client_id: headscale
          client_secret: !Env ZT_HEADSCALE_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: {{ printf "%s/oidc/callback" (tpl $hs.serverUrl . | trimSuffix "/") | quote }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        identifiers:
          slug: headscale
        attrs:
          name: Headscale
          provider: !KeyOf headscale-provider

# zero-trust-access-stack: Headscale + Authentik (OIDC).
#
#   tailscale up --login-server=<headscale.serverUrl>  --> Headscale zt-headscale:8080
#   Headscale /register --> Authentik zt-authentik:80, application "headscale" (OIDC) --> back to Headscale
#
# The stack generates the OIDC client secret and Authentik's bootstrap admin password and API
# token once, into the Secret zt-secrets, and keeps them across upgrades. An Authentik blueprint
# creates the OAuth2 provider and application "headscale" with that secret. Headscale and
# Authentik have fixed names (fullnameOverride): one stack per namespace.
#
# For real devices both must be reachable from them: set headscale.serverUrl and
# headscale.oidcIssuer to public URLs (behind your ingress), and authentik's ingress to match.

# Headscale (subchart). config is the headscale chart's config.yaml with an oidc block added.
headscale:
  fullnameOverride: zt-headscale
  serverUrl: "http://zt-headscale.{{ .Release.Namespace }}.svc:8080"
  # Authentik's issuer for the application "headscale" (the URL browsers are sent to)
  oidcIssuer: "http://zt-authentik.{{ .Release.Namespace }}.svc/application/o/headscale/"
  extraVolumes:
    - name: oidc
      secret:
        secretName: zt-secrets
        items: [{ key: oidc-client-secret, path: client-secret }]
  extraVolumeMounts:
    - { name: oidc, mountPath: /oidc, readOnly: true }
  # Headscale reads the issuer once at startup and, if it does not answer, falls back to
  # CLI-only registration for the life of the pod. Wait until Authentik serves the "headscale"
  # application (the blueprint has run). Uses the authentik image's Python; keep the digest equal
  # to the authentik subchart's image.
  initContainers:
    - name: wait-for-authentik
      image: ghcr.io/quenchworks/images/authentik@sha256:5c5e36ff38b88e82fc5ee5d5e88486b76702f7056ebfbb5f21314ceaa548691c
      command:
        - /usr/bin/python3
        - -c
        - |
          import time, urllib.request
          url = "http://zt-authentik/application/o/headscale/.well-known/openid-configuration"
          while True:
              try:
                  urllib.request.urlopen(url, timeout=5)
                  break
              except Exception as e:
                  print("waiting for Authentik:", e, flush=True)
                  time.sleep(5)
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }
  config: |
    server_url: {{ tpl .Values.serverUrl . }}
    listen_addr: 0.0.0.0:{{ .Values.containerPort }}
    metrics_listen_addr: 0.0.0.0:{{ .Values.metricsPort }}
    # gRPC (remote CLI) stays on loopback unless you deliberately expose it.
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false

    # Generated on first boot into the PVC (root fs is read-only).
    noise:
      private_key_path: {{ .Values.persistence.dataDir }}/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 24h

    disable_check_updates: false

    node:
      ephemeral:
        inactivity_timeout: 30m

    database:
      type: sqlite
      sqlite:
        path: {{ .Values.persistence.dataDir }}/db.sqlite
        write_ahead_log: true

    # Keep the control socket on the writable PVC (default /var/run is read-only here).
    unix_socket: {{ .Values.persistence.dataDir }}/headscale.sock
    unix_socket_permission: "0770"

    log:
      level: info
      format: text

    dns:
      magic_dns: true
      base_domain: headscale.internal
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1

    policy:
      mode: file
      path: ""

    # Sign-in through the stack's Authentik. The client is created by the stack's blueprint; the
    # secret is read from a file. Headscale starts even while Authentik is still booting.
    oidc:
      only_start_if_oidc_is_available: false
      issuer: {{ tpl .Values.oidcIssuer . }}
      client_id: headscale
      client_secret_path: /oidc/client-secret
      scope: ["openid", "profile", "email"]
      pkce:
        enabled: true
        method: S256

# Authentik (subchart), with its bundled PostgreSQL and Valkey.
authentik:
  fullnameOverride: zt-authentik
  extraEnvVars:
    # first-start admin (akadmin) password and an API token, generated by the stack
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom: { secretKeyRef: { name: zt-secrets, key: bootstrap-password } }
    - name: AUTHENTIK_BOOTSTRAP_TOKEN
      valueFrom: { secretKeyRef: { name: zt-secrets, key: bootstrap-token } }
    # read by the blueprint (!Env)
    - name: ZT_HEADSCALE_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: zt-secrets, key: oidc-client-secret } }
  extraVolumes:
    - name: zt-blueprint
      configMap: { name: zt-blueprint }
  extraVolumeMounts:
    - { name: zt-blueprint, mountPath: /blueprints/custom/zt-headscale.yaml, subPath: zt-headscale.yaml, readOnly: true }

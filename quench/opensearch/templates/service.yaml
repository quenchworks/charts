{{- $tls := include "quench-common.tls.enabled" . -}}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if $tls }}
    # OpenSearch listens on loopback only; the nginx sidecar terminates TLS on 8443
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
{{- end }}
{{- /* HA discovery needs the headless names, so only single mode may drop it. */}}
{{- if or .Values.service.enabled (ne .Values.mode "single") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensearch.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true   # nodes must resolve each other before they are ready
  ports:
    {{- if $tls }}
    # headless names resolve to pod IPs, so advertise the sidecar's own port
    - port: 8443
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
    - port: {{ .Values.service.transportPort }}
      targetPort: transport
      name: transport
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
{{- end }}

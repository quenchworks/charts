apiVersion: v2
name: opensearch
description: "Search and analytics suite with a Kibana-style dashboards UI. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.1.16
appVersion: "3.8.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
keywords:
  - opensearch
  - search
  - database
  - analytics
  - fulltext
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/opensearch-project/OpenSearch
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "tls.enabled serves the REST API over HTTPS on Service port 443 through an nginx sidecar, OpenSearch HTTP bound to loopback (existingSecret, cert-manager or self-signed)"
    - kind: added
      description: "service.enabled: false drops the client Service (and the headless one in single mode), for pods fronted by your own Service or proxy"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:7a07c11e843c677f75fb452ddb52667e634c898ec6d22acf7d066097c4be3e16
    - name: nginx
      image: ghcr.io/quenchworks/images/nginx@sha256:b104b20bcc1d2a7e0ee26086c3db8f51c2262cdd4d36fab9991602209ac6a7ce
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts

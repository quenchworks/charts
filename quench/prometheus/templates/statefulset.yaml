{{/* Prometheus exposes lifecycle probe endpoints on the web port: /-/healthy
     (process up) and /-/ready (ready to serve queries). */}}
{{- $liveness := dict "httpGet" (dict "path" "/-/healthy" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/-/ready" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "prometheus.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when prometheus.yml changes (a live POST /-/reload is also
        # available since --web.enable-lifecycle is on).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prometheus.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: prometheus
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{/* Flags pass through the entrypoint's "$@" to the server. The entrypoint
               already sets --config.file, --storage.tsdb.path, --web.listen-address
               and --web.enable-lifecycle. */}}
          args:
            {{- with .Values.config.retentionTime }}
            - --storage.tsdb.retention.time={{ . }}
            {{- end }}
            {{- range .Values.config.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # read-only rootfs: the entrypoint pins the TSDB to PROM_TSDB_PATH (the
            # writable PVC), the listener to PROM_WEB_LISTEN, and the config to
            # PROM_CONFIG_FILE (the ConfigMap mounted below).
            - name: PROM_TSDB_PATH
              value: /prometheus
            - name: PROM_WEB_LISTEN
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: PROM_CONFIG_FILE
              value: /etc/prometheus/prometheus.yml
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /prometheus
            # mount the single config file over the image's default, leaving the
            # rest of /etc/prometheus (read-only rootfs) intact.
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            # writable scratch for the read-only rootfs.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: storage
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

{{/* Atlantis serves its web UI, the /events webhook endpoint, and /healthz on a
     single port. /healthz is a static 200 once the server binds, so it backs
     both probes; the server boots quickly so the initial delay is modest. */}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 15 "timeoutSeconds" 3 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 6 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "atlantis.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.repoConfig }}
        # Roll the pod when the server-side repos.yaml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        # Roll the pod when the VCS credentials change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "atlantis.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: atlantis
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{/* Entrypoint is `/usr/bin/atlantis server`; these are server flags.
               Credentials (gh user/token, webhook secret) come from env
               (ATLANTIS_*), so they are not on the command line. */}}
          args:
            - --port={{ .Values.service.port }}
            - --data-dir=/atlantis-data
            - --default-tf-distribution={{ .Values.defaultTFDistribution }}
            - --repo-allowlist
            - {{ required "repoAllowlist is required (Atlantis refuses to start without it)" .Values.repoAllowlist | quote }}
            {{- with .Values.atlantisUrl }}
            - --atlantis-url
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.repoConfig }}
            - --repo-config=/etc/atlantis/repos.yaml
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Atlantis reads every server flag from an ATLANTIS_-prefixed env var.
            {{- with .Values.vcs.username }}
            - name: ATLANTIS_GH_USER
              value: {{ . | quote }}
            {{- end }}
            - name: ATLANTIS_GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlantis.secretName" . }}
                  key: {{ .Values.vcs.secretKeys.token }}
            - name: ATLANTIS_GH_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlantis.secretName" . }}
                  key: {{ .Values.vcs.secretKeys.webhookSecret }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # /atlantis-data: cloned repos + plan files (the --data-dir). Also the
            # HOME for git/ssh/tofo (the image sets HOME here). The only writable
            # persistent state Atlantis keeps.
            - name: data
              mountPath: /atlantis-data
            # writable scratch for the read-only rootfs.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.repoConfig }}
            - name: config
              mountPath: /etc/atlantis/repos.yaml
              subPath: repos.yaml
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.repoConfig }}
        - name: config
          configMap:
            name: {{ include "atlantis.configMapName" . }}
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

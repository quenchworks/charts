{{/*
The managed Secret carries the VCS credentials Atlantis needs:
  - gh-token          : the VCS API token / personal access token (vcs.githubToken).
  - gh-webhook-secret : the shared secret Atlantis validates inbound webhooks with
                        (vcs.webhookSecret).
It is rendered only when the user has NOT supplied vcs.existingSecret. The token
is preserved across upgrades via a lookup so an unset value does not wipe it; the
webhook secret is generated once if left empty.
*/}}
{{- if not .Values.vcs.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.vcs.githubToken -}}
{{- if and (not $token) $existing -}}
{{- $token = index $existing.data .Values.vcs.secretKeys.token | b64dec -}}
{{- end -}}
{{- $webhook := .Values.vcs.webhookSecret -}}
{{- if and (not $webhook) $existing -}}
{{- $webhook = index $existing.data .Values.vcs.secretKeys.webhookSecret | b64dec -}}
{{- end -}}
{{- if not $webhook -}}
{{- $webhook = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.vcs.secretKeys.token }}: {{ $token | b64enc | quote }}
  {{ .Values.vcs.secretKeys.webhookSecret }}: {{ $webhook | b64enc | quote }}
{{- end }}

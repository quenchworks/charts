{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # http carries the web UI, the /events webhook endpoint, and /healthz.
    # Atlantis authenticates webhooks with the shared secret and the VCS token,
    # but the webhook source is typically external -- allowExternal defaults true.
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

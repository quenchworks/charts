{{- if .Values.repoConfig }}
{{/* Optional server-side repos.yaml (Atlantis --repo-config). Rendered into a
     ConfigMap and mounted read-only at /etc/atlantis/repos.yaml. The value is
     templated so Helm values may be used inside it. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atlantis.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  repos.yaml: |
    {{- tpl .Values.repoConfig . | nindent 4 }}
{{- end }}

# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest. Dummy VCS creds + webhook secret + a wildcard allowlist are enough for
# the Atlantis server to boot and serve /healthz; persistence off (emptyDir).
vcs:
  username: x
  githubToken: x
  webhookSecret: x
repoAllowlist: "*"
atlantisUrl: "http://localhost:4141"
persistence:
  enabled: false        # emptyDir at /atlantis-data for the gate
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

apiVersion: v2
name: atlantis
description: Quenchworks hardened Atlantis (Terraform/OpenTofu pull-request automation). Minimal, nonroot, 0-CVE image pinned by digest; bundles OpenTofu (MPL-2.0, default execution engine) instead of Terraform. StatefulSet with a persistent data dir for cloned repos and plans; server + webhook + UI on 4141.
type: application
version: 0.0.1
appVersion: "0.44.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/runatlantis/atlantis
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts

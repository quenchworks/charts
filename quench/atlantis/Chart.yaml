apiVersion: v2
name: atlantis
description: "Terraform pull-request automation that runs plan on PRs and apply from PR comments, enforcing reviewed, Git-driven infrastructure changes with state locking. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.27
appVersion: "0.48.2"
keywords:
  - atlantis
  - terraform
  - gitops
  - ci-cd
  - integration-delivery
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/runatlantis/atlantis
annotations:

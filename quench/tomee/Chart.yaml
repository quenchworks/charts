apiVersion: v2
name: tomee
description: "Apache TomEE, Tomcat plus the Jakarta EE Web Profile stack (OpenEJB, OpenWebBeans, MyFaces, CXF), for running Jakarta EE applications and WARs. Hardened by QuenchWorks as a minimal, nonroot, read-only-rootfs, CVE-gated image built from source on Wolfi (openjdk-21-jre), cosign-signed and pinned by digest."

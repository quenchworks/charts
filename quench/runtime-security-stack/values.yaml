# runtime-security-stack: Falco + Tetragon, both one pod per node.
#
#   Falco    --(modern eBPF, syscall rules)--> JSON alerts on stdout, with container.name
#   Tetragon --(eBPF kprobes, TracingPolicy)--> process/file/network events (tetra getevents)
#
# They overlap on purpose: Falco ships a curated ruleset that alerts out of the box;
# Tetragon records every exec with pod context and enforces custom TracingPolicies.
# Install one per cluster: Tetragon's CRDs and ClusterRoles are cluster-wide.

# Falco (subchart). Values pass straight through to the falco chart, e.g.
# falco.customRules, falco.config.
falco:
  enabled: true

# Tetragon (subchart). Values pass straight through to the tetragon chart, e.g.
# tetragon.agent.clusterName, tetragon.operator.enabled.
tetragon:
  enabled: true

apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:4528ff0aec06184ffeb1c750ab7b527fd8053f04b7e813326ddda9eaac7768db
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:054b9ba11054b738f4f3cd77cf233f60e5f1522e160806a8ed84779eb03b6d1e
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:cbc70ba87d7a4407ddf1f094db4ca824190eea4ca1c2682aa9a5e9426f7c04ac
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: falco
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: falco.enabled
  - name: tetragon
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: tetragon.enabled

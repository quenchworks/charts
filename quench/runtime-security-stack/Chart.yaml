apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.3
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:ba1703331ff42709e9d7f7f7a9e4cb2be089b0a9a3c174748b3faeb5d24a78f3
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:c5a3416ce84c9c5f461271cd0c12d1b7a938a3dcb00eb486d2c4ec8471af23be
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:50bf3a653f365d4466913c13cf1716ac4b9fdde181bd080e8942b51bd83f6e4e
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: falco
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
    condition: falco.enabled
  - name: tetragon
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: tetragon.enabled

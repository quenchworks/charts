apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.5
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-01 wave lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:04589373dec747aed4f999ede8958c8d92273f6abd867a10ad6dc78d846568fc
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:721e893debe591ad95c1b2923be2a1a1c73efabc54c1f0e5cd70ffe899e660e0
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:cbc70ba87d7a4407ddf1f094db4ca824190eea4ca1c2682aa9a5e9426f7c04ac
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: falco
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: falco.enabled
  - name: tetragon
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: tetragon.enabled

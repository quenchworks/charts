apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Falco 0.45.1 + Tetragon 1.7.1"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:811af68b4d2c62ece82e437d701dbdb565130cbff0aa3b027a57bdeab435294b
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:9ba7c89024556c92ae2fcffff9bd36847bd2bea11013b8c255fc6fbfe2b50518
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:24170c27932b2f987aa7b02c597fccd33385731ef17b4d930f757eaa1dbc3c8b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: falco
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
    condition: falco.enabled
  - name: tetragon
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: tetragon.enabled

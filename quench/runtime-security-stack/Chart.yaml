apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.20
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the falco subchart 0.0.9 -> 0.0.10."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:82df49ba967045d1ad87e309c6707c43c399160b552e6ab4715b2d643551f037
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:fb6307365a953b3a86be9bc1e265739c924ed033c651a2122edbdb85fc46b938
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:52b0a017e2388e8af5f3dd9b5405fdf8fcbfe19df84411156ad11eb6f3b5882f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: runtime-security-stack
description: "Hardened runtime security in one install: Falco (syscall rules with the modern eBPF probe, JSON alerts naming the container) + Tetragon (kernel-level process, file and network events with TracingPolicy hooks and enforcement). Every image is QuenchWorks-hardened, built from source, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.13
appVersion: "1.0.0"
keywords:
  - runtime-security
  - falco
  - tetragon
  - ebpf
  - threat-detection
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/falcosecurity/falco
  - https://github.com/cilium/tetragon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt with OpenTelemetry 1.47 (CVE-2026-128085) and current Wolfi packages."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: falco
      image: ghcr.io/quenchworks/images/falco@sha256:7b9cc55610f66e54c0799a71543535cec9e1c3ecfc9dc34a7e907e5ea52d0e8a
    - name: tetragon
      image: ghcr.io/quenchworks/images/tetragon@sha256:fb6307365a953b3a86be9bc1e265739c924ed033c651a2122edbdb85fc46b938
    - name: tetragon-operator
      image: ghcr.io/quenchworks/images/tetragon-operator@sha256:cbc70ba87d7a4407ddf1f094db4ca824190eea4ca1c2682aa9a5e9426f7c04ac
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: falco
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: falco.enabled
  - name: tetragon
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: tetragon.enabled

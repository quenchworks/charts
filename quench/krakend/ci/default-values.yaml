# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# No config override either. The gate's whole point is to prove the SHIPPED
# default krakend.json boots and routes, so the sample endpoint from values.yaml
# is exactly what gets probed.
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

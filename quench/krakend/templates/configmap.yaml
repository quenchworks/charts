{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krakend.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted read-only at /etc/krakend/krakend.json and loaded by the image
  # entrypoint (`krakend run -c /etc/krakend/krakend.json`).
  krakend.json: |
    {{- include "krakend.config" . | nindent 4 }}
{{- end }}

{{/*
lura's gin router serves GET /__health -> 200 {"status":"ok"} unless the config
sets disable_health, so it gates both probes for any routed config. If you set
disable_health, supply a customLiveness/ReadinessProbe pointing at one of your
own endpoints.
*/}}
{{- $liveness := dict "httpGet" (dict "path" "/__health" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 15 "timeoutSeconds" 3 "failureThreshold" 3 -}}
{{- $readiness := dict "httpGet" (dict "path" "/__health" "port" "http") "initialDelaySeconds" 2 "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 3 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      {{- if not .Values.existingConfigMap }}
      annotations:
        # KrakenD reads its config once at boot, so a config change must roll the pods.
        checksum/config: {{ include "krakend.config" . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "krakend.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: krakend
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # krakend.json, read-only. KrakenD writes nothing at runtime, so a
            # read-only root filesystem needs no scratch volume here.
            - name: config
              mountPath: /etc/krakend
              readOnly: true
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "krakend.mountedConfigMap" . }}
            # Project the key as krakend.json whatever it is named upstream, so
            # the image entrypoint's -c path always resolves.
            items:
              - key: {{ include "krakend.mountedConfigKey" . }}
                path: krakend.json
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

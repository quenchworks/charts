# The digests below are the contract with the image factory. They are never tags.
image:
  repository: ghcr.io/quenchworks/images/jupyterhub
  digest: "sha256:a4a9065a1fb75a73781e97dfcdaad18128c5cc2545e027254b5f9c8d0c9c7ea7"
  pullPolicy: IfNotPresent

proxy:
  image:
    repository: ghcr.io/quenchworks/images/configurable-http-proxy
    digest: "sha256:68efb3a9632a100b7842a0141e725d9e2548db1e46f1c5d39c49e4279dec2a9e"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # The Service users reach JupyterHub through.
  service:
    type: ClusterIP
    port: 80

nameOverride: ""

hub:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # The hub's SQLite database (users, servers, tokens).
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# Shared-password login: any username with `password` (8+ characters); the
# adminUsers sign in with `adminPassword` (32+ characters, different from
# password). Empty generates them, kept in the <release>-jupyterhub-secrets Secret
# (keys password and admin-password). For SSO, set extraConfig to an
# OAuthenticator (GitHub, GitLab, Google, generic OIDC).
auth:
  password: ""
  adminPassword: ""
  adminUsers: [admin]

# Each user's notebook server, run by KubeSpawner as a pod in this namespace.
# The default is Jupyter's own base-notebook image at the hub's version (it is
# not a QuenchWorks image); its jupyterhub version should match the hub's.
singleuser:
  image: quay.io/jupyter/base-notebook:hub-6.0.1@sha256:6d0358f11292d59dbf621ea5f3a68b7432f6873a03ed92513799939ab372a5f7
  cpuLimit: 1
  memoryLimit: 2G
  startTimeout: 300
  storage:
    enabled: true
    size: 5Gi
    mountPath: /home/jovyan

# Extra Python appended to jupyterhub_config.py, e.g. an authenticator:
#   c.JupyterHub.authenticator_class = "github"
#   c.GitHubOAuthenticator.oauth_callback_url = "https://hub.example.com/hub/oauth_callback"
extraConfig: ""

# Native TLS: the proxy's public port serves HTTPS only (the proxy probes follow), with the
# certificate mounted at /tls; the proxy API and the hub stay plain in-cluster. The
# certificate also names the proxy-public Service and comes from the first source set:
# existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

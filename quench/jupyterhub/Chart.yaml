apiVersion: v2
name: jupyterhub
description: "JupyterHub, multi-user Jupyter notebooks on Kubernetes: the hub, configurable-http-proxy and KubeSpawner, with notebook servers as pods. Hardened by QuenchWorks as minimal, nonroot, 0-CVE images, cosign-signed and pinned by digest."
type: application
version: 0.0.4
appVersion: "6.0.1"
keywords:
  - jupyterhub
  - jupyter
  - notebooks
  - kubespawner
  - data-science
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/jupyterhub/jupyterhub
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt with cryptography from Wolfi; the wheel linked OpenSSL statically, where the scan cannot see it. The bundled PostgreSQL moves to 0.0.26."
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: jupyterhub
      image: ghcr.io/quenchworks/images/jupyterhub@sha256:0f3223ae012bb9dee01f79a4e7ddf1adb4a2124445f42ffe71f7ddaf0cd55b3b
    - name: configurable-http-proxy

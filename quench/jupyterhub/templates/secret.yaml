{{/* The proxy API token (hub and proxy share it), the hub cookie secret, the
     gate/admin service token and the login password. Read back from the live
     Secret so upgrades keep sessions and logins. */}}
{{- $name := include "jh.secretName" . -}}
{{- $prior := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}{{ $prior = .data | default dict }}{{ end -}}
{{- $get := dict -}}
{{- range $k := list "proxy-token" "cookie-secret" "api-token" "password" -}}
{{- $v := index $prior $k | default "" | b64dec -}}
{{- /* the cookie secret must be hex: sha256sum of random input is 64 hex chars */ -}}
{{- if not $v }}{{- $v = ternary (randAlphaNum 32 | sha256sum) (randAlphaNum 32) (eq $k "cookie-secret") }}{{- end -}}
{{- $_ := set $get $k $v -}}
{{- end -}}
{{- if .Values.auth.password }}{{- $_ := set $get "password" .Values.auth.password }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $get }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}

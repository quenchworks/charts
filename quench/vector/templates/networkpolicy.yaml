{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Vector's API has no built-in auth: this policy is the trust boundary.
    # Allow the API/health port (8686). If your config adds receiving sources
    # (http_server, syslog, socket, opentelemetry, vector), add their ports here
    # or open ingress via allowExternal.
    - ports:
        - port: api
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

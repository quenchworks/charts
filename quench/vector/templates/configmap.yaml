apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/vector/vector.yaml and passed as --config to Vector. The image
  # ships a minimal default; this value replaces it wholesale. Edit `vectorConfig` in
  # your values and `helm upgrade`; the pod checksum annotation rolls the Deployment.
  vector.yaml: |-
    {{- toYaml .Values.vectorConfig | nindent 4 }}

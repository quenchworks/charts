# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest. Keeps the default config (demo_logs source + console sink + api on :8686)
# so the gate is self-contained -- it forwards nowhere and needs no backend.
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
service:
  # the gate probes :8686/health over a port-forward to the container; expose it
  # anyway to match the documented production posture.
  exposeApi: true

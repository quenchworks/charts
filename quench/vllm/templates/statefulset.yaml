{{/* The image entrypoint is `/usr/bin/vllm`; the chart supplies `serve <model> ...`,
     which starts the OpenAI-compatible server and exposes GET /health (200 once the
     model is loaded and the engine is ready) on the serve port. Model load is slow, so
     the startupProbe carries a generous failureThreshold (60 x 10s = up to 10 min) and
     liveness/readiness only begin once it first succeeds. */}}
{{- $liveness := dict "httpGet" (dict "path" "/health" "port" "http") "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/health" "port" "http") "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $startup := dict "httpGet" (dict "path" "/health" "port" "http") "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "vllm.headlessName" . }}
  replicas: 1
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vllm.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: vllm
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- else }}
          # Image entrypoint is `/usr/bin/vllm`; these args launch the OpenAI server.
          args:
            - serve
            - {{ .Values.model | quote }}
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            # Caches (HF_HOME, XDG_CACHE_HOME) already point under /opt/vllm/.cache in
            # the image. With a read-only rootfs, HOME must resolve to a writable path;
            # park it on the persistent cache volume so any stray dotfile writes (HF
            # token, torch/triton caches) also land on the volume and stay stable.
            - name: HOME
              value: /opt/vllm/.cache
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable Hugging Face cache (downloaded model weights); on a read-only
            # rootfs the server can only write model data here.
            - name: cache
              mountPath: /opt/vllm/.cache
            # read-only rootfs needs a writable scratch dir
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: cache
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

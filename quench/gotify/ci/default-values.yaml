# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and gotify writes its
# SQLite DB to it. A fixed default admin password makes the install deterministic;
# change it after first login in a real deployment.
persistence:
  enabled: true
  size: 1Gi

extraEnvVars:
  - name: GOTIFY_DEFAULTUSER_NAME
    value: admin
  - name: GOTIFY_DEFAULTUSER_PASS
    value: quench-admin

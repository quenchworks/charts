# The digest below is the contract with the image factory. CI rewrites it from
# manifests/gotify.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/gotify
  digest: "sha256:fd65290051c41146b45c87edb699355476478c48729a0b8e73d2b17197148448"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-node push-notification server. Gotify persists to a SQLite DB plus
# uploaded images/plugins under a data dir, so it is not horizontally scalable;
# keep this at 1.
replicaCount: 1

# The hardened image runs nonroot (uid 1001) and binds this port. Gotify's own
# GOTIFY_SERVER_PORT is wired to it so the container and probes stay in sync.
containerPort: 8080

persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 80

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
# Set the default admin login here (or via a Secret with extraEnvVarsSecret).
# Gotify creates the admin user on first boot from GOTIFY_DEFAULTUSER_*; change
# the password after first login. Left empty, the image defaults to admin/admin.
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  # Gotify is often reached from outside the cluster (browser/apps). Set true to
  # allow ingress from any source; default restricts client traffic to the namespace.
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

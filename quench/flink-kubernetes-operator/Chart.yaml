apiVersion: v2
name: flink-kubernetes-operator
description: "Apache Flink Kubernetes Operator: runs Flink applications and session clusters from FlinkDeployment and FlinkSessionJob resources, with savepoint-based upgrades and the job autoscaler. Upstream's chart on the QuenchWorks image: built from the Apache source release, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.16.1"
kubeVersion: ">=1.25.0-0"
keywords:
  - flink
  - streaming
  - stream-processing
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/flink-kubernetes-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Flink Kubernetes Operator 1.16.1 with its CRDs, on upstream's chart"
  artifacthub.io/category: streaming-messaging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: flink-kubernetes-operator
      image: ghcr.io/quenchworks/images/flink-kubernetes-operator@sha256:762f47f9f18d0b8e5de49fa9814913dbde911c96de1da9ec05feddb1c10c47cd
  artifacthub.io/crds: |
    - kind: FlinkBlueGreenDeployment

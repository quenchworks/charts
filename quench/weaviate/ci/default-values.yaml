# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# kind ships a default StorageClass (rancher.io/local-path), so the PVC binds.
replicaCount: 1
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
persistence:
  enabled: true
  size: 1Gi

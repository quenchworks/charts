apiVersion: v2
name: istiod
description: "Istio's control plane (istiod): xDS discovery server, certificate authority and namespace-scoped mesh configuration, packaged from a from-source, nonroot, 0-CVE QuenchWorks image pinned by digest. This chart ships the CONTROL PLANE ONLY: the Istio data-plane proxy (proxyv2) is built from Istio's own Bazel/clang Envoy fork and is not part of the QuenchWorks catalog yet, so pair this istiod with upstream proxy images or wait for the QuenchWorks data plane."
type: application
version: 0.0.1
appVersion: "1.30.4"
keywords:
  - istio
  - istiod
  - service-mesh
  - xds
  - envoy
  - networking

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
#
# Pinned 2026-09-01 to the multi-arch index (linux/amd64 + linux/arm64) from the
# first green build-istiod.yml run, which published 1.28.10 / 1.29.7 / 1.30.4. The
# same digest is repeated in Chart.yaml's artifacthub.io/images annotation, which is
# what ArtifactHub's security report actually scans -- update both together.
image:
  repository: ghcr.io/quenchworks/images/istiod
  digest: "sha256:3784524c93750307f2d7564c69dca6d65481d03b0a592c93778560f5774596bd"
  pullPolicy: IfNotPresent

nameOverride: ""

# istiod is stateless and reads the whole mesh from the Kubernetes API; one
# replica is the upstream-style default and HA is a scale-out of identical
# readers (no leader election, no quarrels).
replicaCount: 1

# The image's baked entrypoint runs against an UNREACHABLE kubeconfig -- that is
# the shape of the image smoke test, not of a real deployment. The chart drops
# --kubeconfig so pilot-discovery uses in-cluster auth (its ServiceAccount), and
# pins the two addresses the smoke test proved live: :8080 (debug/health, /ready)
# and :15014 (monitoring: /metrics, /version). The xDS listeners keep the binary's
# own defaults: :15010 plaintext and :15012 TLS.
command: ["/usr/bin/pilot-discovery"]
args:
  - discovery
  - --httpAddr=:8080
  - --monitoringAddr=:15014

service:
  type: ClusterIP
  # Service ports, named for what dials them. Sidecars/gateways dial xdsSecure;
  # Prometheus scrapes monitoring; http is the debug/ready surface.
  xdsPort: 15010
  xdsSecurePort: 15012
  httpPort: 8080
  monitoringPort: 15014

serviceAccount:
  create: true
  name: ""
  # REQUIRED true for istiod, and not merely a hardening exception: watching the API
  # server IS istiod's job. quench-common defaults this to false because most
  # workloads never call the API server, but with no token mounted client-go cannot
  # build an in-cluster config and falls back to its legacy default host,
  # http://localhost:8080 -- which inside this pod is istiod's OWN pilot HTTP port.
  # istiod then queries itself, its own server answers 404 for /api/v1/... , and the
  # log fills with "failed to list *v1.ConfigMap: the server could not find the
  # requested resource (get configmaps)" while config sync never completes, /ready
  # stays 503 and the liveness probe restarts the pod forever. Measured in a kind
  # cluster; the 404 is NOT an RBAC denial (that would be 403) and NOT a missing
  # istio ConfigMap (creating one changes nothing).
  automountServiceAccountToken: true

rbac:
  create: true

networkPolicy:
  enabled: true
  # xDS is unauthenticated on :15010 and certificate-verified on :15012; keep
  # :15010 reachable only from inside the cluster either way.
  allowExternal: false

resources: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# With replicaCount=1 a minAvailable=1 PDB blocks every voluntary eviction; enable
# it when you scale past one replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

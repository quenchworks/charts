apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: xds
      port: {{ .Values.service.xdsPort }}
      targetPort: xds
      protocol: TCP
    - name: xds-secure
      port: {{ .Values.service.xdsSecurePort }}
      targetPort: xds-secure
      protocol: TCP
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: monitoring
      port: {{ .Values.service.monitoringPort }}
      targetPort: monitoring
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

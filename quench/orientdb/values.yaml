# The digest below is the contract with the image factory. CI rewrites it after
# every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/orientdb
  digest: "sha256:fb8e670b627e214fb98231edf590905c49a0483102b973415223f1bd6b6f6934"
  pullPolicy: IfNotPresent

nameOverride: ""

# Standalone only: the image has no distributed (Hazelcast) mode, so one replica.
replicaCount: 1

# Server root user. OrientDB reads ORIENTDB_ROOT_PASSWORD on start and stores the
# root user in its config (an emptyDir here, so the Secret stays the source of truth).
auth:
  password: ""                 # generated (24 chars) if empty; kept across upgrades
  existingSecret: ""           # use this Secret instead of the managed one
  existingSecretPasswordKey: "root-password"

# JVM memory flags (ORIENTDB_OPTS_MEMORY) and extra -D server settings
# (ORIENTDB_SETTINGS), e.g. "-Dstorage.diskCache.bufferSize=512".
javaOpts:
  memory: "-Xms512m -Xmx512m"
  settings: ""

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  binaryPort: 2424             # binary protocol (drivers, console.sh)
  httpPort: 2480               # HTTP API and Studio

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress for the HTTP API and Studio. Disabled by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: 2480           # the HTTP API and Studio port
  hosts: []
  tls: []

# Native TLS: the HTTP listener on 2480 serves HTTPS only and the binary listener on 2424
# takes TLS only (the image's own "https" and "ssl" sockets), with a PKCS12 keystore built
# from the certificate below. The certificate comes from the first source set:
# existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

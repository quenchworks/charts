{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $pw := .Values.auth.password -}}
{{/* Keep a generated password stable across upgrades: reuse the stored one. */}}
{{- if not $pw -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (index ($existing.data | default dict) "root-password") -}}
{{- $pw = index $existing.data "root-password" | b64dec -}}
{{- else -}}
{{- $pw = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ $pw | b64enc | quote }}
{{- end }}

# Install gate. No image override: the gate pulls the chart's real, CI-maintained
# digest. Persistence stays on so the restart check proves the PVC keeps data.
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1536Mi }
auth:
  password: "ci-test-password"

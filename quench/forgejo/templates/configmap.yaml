{{- $mp := .Values.persistence.mountPath -}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $rootUrl := .Values.config.rootUrl | default (ternary "https://localhost:8443/" (printf "http://localhost:%v/" (.Values.containerPort | toString)) (eq $tls "true")) -}}
{{- $disableSsh := ternary "false" "true" .Values.config.ssh.enabled -}}
{{- $startSsh := ternary "true" "false" .Values.config.ssh.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forgejo.configName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Seeds an install-locked app.ini onto the data PVC on first boot only. The
  # hardened image has no environment-to-ini step, so FORGEJO__* env vars are NOT
  # honored; the config file is the supported headless-boot mechanism. Secrets are
  # produced by the forgejo binary (real signed values) and persist on the PVC, so
  # nothing is generated into the read-only rootfs and nothing rotates on restart.
  # Only bash + the forgejo binary are used (the image ships no coreutils).
  seed.sh: |
    set -eu
    CONF="{{ $mp }}/app.ini"
    # Native TLS: the chart owns PROTOCOL/HTTP_PORT/CERT_FILE/KEY_FILE in [server]
    # while tls.enabled is on (HTTPS on 8443, the certificate mounted at /tls), and
    # puts http on the container port back once it is off again. Run on every boot,
    # so an existing app.ini follows the toggle; a config the chart never made
    # https is left alone. Pure bash: the image ships no coreutils.
    reconcile_tls() {
      local want=() lines=() out=() sec="" l mine=""
      {{- if $tls }}
      want=('PROTOCOL = https' 'HTTP_PORT = 8443' 'CERT_FILE = /tls/tls.crt' 'KEY_FILE = /tls/tls.key')
      {{- else }}
      want=('PROTOCOL = http' 'HTTP_PORT = {{ .Values.containerPort }}')
      {{- end }}
      mapfile -t lines < "$CONF"
      for l in "${lines[@]}"; do [[ $l =~ ^CERT_FILE[[:space:]]*=[[:space:]]*/tls/tls\.crt ]] && mine=1; done
      {{- if not $tls }}
      [ -n "$mine" ] || return 0
      {{- end }}
      for l in "${lines[@]}"; do
        if [[ $l =~ ^\[(.*)\] ]]; then
          sec="${BASH_REMATCH[1]}"; out+=("$l")
          [ "$sec" = server ] && out+=("${want[@]}")
          continue
        fi
        [ "$sec" = server ] && [[ $l =~ ^[[:space:]]*(PROTOCOL|HTTP_PORT|CERT_FILE|KEY_FILE)[[:space:]]*= ]] && continue
        out+=("$l")
      done
      printf '%s\n' "${out[@]}" > "$CONF"
      echo "forgejo: [server] ${want[*]}"
    }
    # The first administrator: on every boot until it exists (a database that was not ready on
    # the first boot still gets it), then a marker on the data volume skips it.
    ensure_admin() {
      {{- if .Values.admin.username }}
      [ -f "{{ $mp }}/.admin-created" ] && return 0
      /usr/bin/forgejo migrate -c "$CONF"
      out="$(/usr/bin/forgejo admin user create -c "$CONF" --admin --username {{ .Values.admin.username | quote }} \
        --email {{ required "admin.email is required with admin.username" .Values.admin.email | quote }} \
        --password "${ADMIN_PASSWORD:?admin.existingSecret is required with admin.username}" --must-change-password=false 2>&1)" \
        || [[ $out == *"already exists"* ]] || { echo "$out"; return 1; }
      : > "{{ $mp }}/.admin-created"
      echo "forgejo: administrator {{ .Values.admin.username }} ready"
      {{- else }}
      return 0
      {{- end }}
    }
    if [ -f "$CONF" ]; then
      echo "forgejo: keeping existing ${CONF}"
      reconcile_tls
      ensure_admin
      exit 0
    fi
    echo "forgejo: seeding install-locked ${CONF} with fresh secrets"
    SECRET_KEY="$(/usr/bin/forgejo generate secret SECRET_KEY)"
    INTERNAL_TOKEN="$(/usr/bin/forgejo generate secret INTERNAL_TOKEN)"
    JWT_SECRET="$(/usr/bin/forgejo generate secret JWT_SECRET)"
    printf '%s\n' \
      'APP_NAME = {{ .Values.config.appName }}' \
      'RUN_USER = forgejo' \
      'RUN_MODE = prod' \
      'WORK_PATH = {{ $mp }}' \
      '' \
      '[server]' \
      'HTTP_ADDR = 0.0.0.0' \
      {{- if $tls }}
      'PROTOCOL = https' \
      'HTTP_PORT = 8443' \
      'CERT_FILE = /tls/tls.crt' \
      'KEY_FILE = /tls/tls.key' \
      {{- else }}
      'HTTP_PORT = {{ .Values.containerPort }}' \
      {{- end }}
      'ROOT_URL = {{ $rootUrl }}' \
      'APP_DATA_PATH = {{ $mp }}' \
      'DISABLE_SSH = {{ $disableSsh }}' \
      'START_SSH_SERVER = {{ $startSsh }}' \
      'SSH_PORT = {{ .Values.config.ssh.port }}' \
      'LFS_START_SERVER = false' \
      '' \
      '[database]' \
      {{- if eq .Values.database.type "postgres" }}
      'DB_TYPE = postgres' \
      'HOST = {{ required "database.postgres.host is required for database.type=postgres" .Values.database.postgres.host }}' \
      'NAME = {{ .Values.database.postgres.name }}' \
      'USER = {{ .Values.database.postgres.user }}' \
      "PASSWD = \`${DB_PASSWORD:-}\`" \
      'SSL_MODE = {{ .Values.database.postgres.sslMode }}' \
      {{- else }}
      'DB_TYPE = sqlite3' \
      'PATH = {{ $mp }}/forgejo.db' \
      {{- end }}
      '' \
      {{- if .Values.redis.enabled }}
      {{- $r := printf "redis://%s:%s@%s/%v?pool_size=100&idle_timeout=180s" "" "${REDIS_PASSWORD:-}" (required "redis.host is required with redis.enabled" .Values.redis.host) .Values.redis.db }}
      '[cache]' \
      'ADAPTER = redis' \
      "HOST = {{ $r }}" \
      '' \
      '[session]' \
      'PROVIDER = redis' \
      "PROVIDER_CONFIG = {{ $r }}" \
      '' \
      '[queue]' \
      'TYPE = redis' \
      "CONN_STR = {{ $r }}" \
      '' \
      {{- end }}
      '[repository]' \
      'ROOT = {{ $mp }}/git/repositories' \
      '' \
      '[security]' \
      'INSTALL_LOCK = true' \
      "SECRET_KEY = ${SECRET_KEY}" \
      "INTERNAL_TOKEN = ${INTERNAL_TOKEN}" \
      '' \
      '[oauth2]' \
      "JWT_SECRET = ${JWT_SECRET}" \
      '' \
      '[log]' \
      'MODE = console' \
      'LEVEL = {{ .Values.config.logLevel }}' \
      > "$CONF"
    echo "forgejo: wrote ${CONF}"
    ensure_admin

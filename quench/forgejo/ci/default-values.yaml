# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds, the init container
# seeds an install-locked app.ini onto it, and Forgejo boots headless (no web
# installer) with its SQLite DB on the PVC. A small size keeps the gate fast.
persistence:
  enabled: true
  size: 1Gi

{{/*
Managed Secret carrying db-password — the password Temporal and the schema-setup
Job use to reach PostgreSQL. Bundled PG: the deterministic postgresql.auth.password
(the same value the subchart initialises its superuser with). External DB without an
existingSecret: externalDatabase.password. Rendered unless an externalDatabase
.existingSecret is supplied (then the caller's Secret is used directly).
*/}}
{{- $renderDb := or .Values.postgresql.enabled (not .Values.externalDatabase.existingSecret) -}}
{{- if $renderDb }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $dbpw := include "temporal.db.password" . -}}
{{- if and (not $dbpw) $existing -}}
{{- $dbpw = index $existing.data "db-password" | b64dec -}}
{{- end -}}
{{- if not $dbpw -}}
{{- $dbpw = randAlphaNum 24 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $dbpw | b64enc | quote }}
{{- end }}

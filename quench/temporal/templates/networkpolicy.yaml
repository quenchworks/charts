{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Frontend gRPC (client/worker port) + frontend HTTP API. Temporal's frontend is
    # a backend service (not a browser endpoint) and has no built-in auth in this
    # config, so ingress is restricted to the release namespace by default. Set
    # networkPolicy.allowExternal=true to allow clients from outside the namespace.
    - ports:
        - port: grpc
          protocol: TCP
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    # Metrics: restricted to pods in this namespace (kubelet probes use the node IP
    # and are not subject to NetworkPolicy).
    - ports:
        - port: metrics
          protocol: TCP
      from:
        - podSelector: {}
    # Intra-cluster membership / inter-role RPC (ringpop 6933-6939 + history/matching/
    # worker gRPC). All-in-one runs these within one pod, but allow same-namespace
    # peers so a future scale-out (one Deployment per role) keeps working.
    - ports:
        - port: history
          protocol: TCP
        - port: matching
          protocol: TCP
        - port: worker
          protocol: TCP
        - port: 6933
          protocol: TCP
        - port: 6934
          protocol: TCP
        - port: 6935
          protocol: TCP
        - port: 6939
          protocol: TCP
      from:
        - podSelector: {}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (the bundled subchart or an external DB).
    - ports:
        - port: {{ include "temporal.db.port" . }}
          protocol: TCP
    # Intra-cluster membership / inter-role RPC to same-namespace peers.
    - to:
        - podSelector: {}
{{- end }}

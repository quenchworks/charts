apiVersion: v2
name: temporal
description: Quenchworks hardened Temporal (durable workflow execution engine / orchestration server). Minimal, nonroot, 0-CVE image pinned by digest; runs the single-binary all-in-one server (frontend + history + matching + worker) against PostgreSQL.
type: application
version: 0.0.1
appVersion: "1.29.7"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/temporalio/temporal
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

  artifacthub.io/images: |
    - name: temporal
      image: ghcr.io/quenchworks/images/temporal@sha256:2b46cb598b0f2bcfc4f3b0d9ffc50a053bedff7e7b7ffbf9994857c606c2d359
    - name: postgresql

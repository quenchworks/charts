apiVersion: v2
name: temporal
description: "Durable workflow orchestration engine that persists execution state so long-running, multi-step processes survive crashes and resume exactly where they left off. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.18
appVersion: "1.31.2"
keywords:
  - temporal
  - workflow
  - orchestration
  - durable-execution
  - integration-delivery
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/temporalio/temporal
annotations:

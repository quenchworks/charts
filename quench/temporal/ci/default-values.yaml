# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
# Bundles the Quenchworks PostgreSQL subchart with persistence off; deterministic
# shared DB credentials; few history shards + small resources for a quick boot.
postgresql:
  enabled: true
  auth:
    username: temporal_user
    password: temporal
    database: temporal
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

# Few shards => faster schema setup + boot on the runner. (Fixed at first setup.)
numHistoryShards: 4

schemaSetup:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1536Mi }

# Install gate. No image override: the install uses the chart's real, CI-maintained digest.
config:
  endpoints:
    - name: up-backend
      url: http://gate-backend:8000/
      interval: 5s
      conditions: ["[STATUS] == 200", "[BODY] == quench-backend"]
    - name: down-backend
      url: http://gate-backend:9999/
      interval: 5s
      client: { timeout: 2s }
      conditions: ["[STATUS] == 200"]

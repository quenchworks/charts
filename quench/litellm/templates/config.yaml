apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- if not .Values.masterKey.existingSecret }}
---
{{/* A generated master key, kept across upgrades: reuse the live Secret if it exists. */}}
{{- $name := include "litellm.masterKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "master-key") }}
{{- $key = index $existing.data "master-key" | b64dec }}
{{- else if .Values.masterKey.value }}
{{- $key = .Values.masterKey.value }}
{{- else }}
{{- $key = printf "sk-%s" (randAlphaNum 40) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  master-key: {{ $key | b64enc | quote }}
{{- end }}

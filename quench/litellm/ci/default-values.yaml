# Standalone install gate: no database, no provider keys. The gate proves the proxy
# boots on the real digest, authenticates with its generated master key, and serves the
# OpenAI-compatible model list for a configured (unreachable, never called) model.
config:
  model_list:
    - model_name: ci-model
      litellm_params:
        model: openai/ci-model
        api_base: http://127.0.0.1:9/v1
        api_key: ci-not-a-real-key

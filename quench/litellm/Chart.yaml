apiVersion: v2
name: litellm
description: "LiteLLM proxy: one OpenAI-compatible API to call, route, budget and log 100+ LLM providers. Hardened by QuenchWorks as an MIT-only build (no proprietary enterprise package), nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "1.103.0"
keywords:
  - litellm
  - llm
  - ai-gateway
  - openai
  - proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/BerriAI/litellm
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt with numpy, cryptography and hf-xet from Wolfi; the previous image carried a static OpenSSL and BoringSSL inside wheels, where the scan cannot see them. polars and pyroscope-io are left out, so the FOCUS, CloudZero and Vantage cost exports are unavailable."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: litellm
      image: ghcr.io/quenchworks/images/litellm@sha256:6474d631bf847113487e94eb047c8cd218a2bc12e32533c1ae336f87d404781f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: argo-workflows
description: "Argo Workflows: the container-native workflow engine for Kubernetes. Runs DAG and step-based pipelines as Kubernetes pods via the Workflow/CronWorkflow/WorkflowTemplate CRDs, with the argo-server providing the REST/gRPC API and the embedded web UI. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. One image ships the controller, the server and the argoexec executor; the controller is told to inject that same pinned digest as the workflow-pod executor, so no upstream registry is ever pulled from."
type: application
version: 0.0.1
appVersion: "3.7.15"
keywords:
  - argo
  - argo-workflows
  - workflow
  - pipeline
  - dag
  - ci-cd
  - batch
  - orchestration
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/argoproj/argo-workflows
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release of the QuenchWorks Argo Workflows chart: workflow-controller and argo-server Deployments, the eight argoproj.io CRDs, and per-component RBAC."
    - kind: security
      description: "The workflow-pod executor (argoexec) is pinned to the same signed QuenchWorks digest as the controller via --executor-image, so workflow pods never pull an upstream registry image."
  artifacthub.io/images: |
    - name: argo-workflows
      image: ghcr.io/quenchworks/images/argo-workflows@sha256:8510261ae7b90ae586bd744e419483e9faf5aee71a1cc61c7168d89ffd27d343
  artifacthub.io/crds: |
    - kind: Workflow
      version: v1alpha1
      name: workflows.argoproj.io
      displayName: Workflow
      description: A single execution of a DAG or step sequence, run as Kubernetes pods.
    - kind: WorkflowTemplate
      version: v1alpha1
      name: workflowtemplates.argoproj.io
      displayName: WorkflowTemplate
      description: A namespaced, reusable workflow definition that Workflows and CronWorkflows can reference.
    - kind: ClusterWorkflowTemplate
      version: v1alpha1
      name: clusterworkflowtemplates.argoproj.io
      displayName: ClusterWorkflowTemplate
      description: A cluster-scoped reusable workflow definition, usable from any namespace.
    - kind: CronWorkflow
      version: v1alpha1
      name: cronworkflows.argoproj.io
      displayName: CronWorkflow
      description: A Workflow submitted on a cron schedule.
    - kind: WorkflowEventBinding
      version: v1alpha1
      name: workfloweventbindings.argoproj.io
      displayName: WorkflowEventBinding
      description: Maps an event posted to the argo-server event endpoint onto a workflow submission.
    - kind: WorkflowTaskSet
      version: v1alpha1
      name: workflowtasksets.argoproj.io
      displayName: WorkflowTaskSet
      description: The set of agent-executed tasks (HTTP and plugin templates) for a running Workflow.
    - kind: WorkflowTaskResult
      version: v1alpha1
      name: workflowtaskresults.argoproj.io
      displayName: WorkflowTaskResult
      description: The result a workflow pod's executor reports back to the controller.
    - kind: WorkflowArtifactGCTask
      version: v1alpha1
      name: workflowartifactgctasks.argoproj.io
      displayName: WorkflowArtifactGCTask
      description: A pending artifact garbage-collection task for a completed Workflow.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

{{- if .Values.server.enabled }}
{{/*
argo-server: the REST/gRPC API and the embedded web UI, on 2746. It is the same
image as the controller -- `argo` is the multi-call binary, `argo server` is the
API mode -- so the entrypoint is overridden here.

Read server.authModes in values.yaml before exposing this outside the cluster:
the default `server` mode serves every request with the argo-server's own
ServiceAccount, i.e. unauthenticated callers get its permissions.

The server writes its session/temp files under /tmp, so the read-only rootfs is
kept and /tmp is an emptyDir.
*/}}
{{- $scheme := ternary "HTTPS" "HTTP" .Values.server.secure -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argo-workflows.serverName" . }}
  labels:
    {{- include "argo-workflows.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "argo-workflows.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "argo-workflows.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "argo-workflows.serverServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: argo-server
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/argo"]
          args:
            - "server"
            - "--configmap={{ include "argo-workflows.configMapName" . }}"
            - "--port=2746"
            - "--secure={{ .Values.server.secure }}"
            - "--base-href={{ .Values.server.baseHref }}"
            - "--loglevel={{ .Values.controller.logLevel }}"
            {{- range .Values.server.authModes }}
            - "--auth-mode={{ . }}"
            {{- end }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: web
              containerPort: 2746
              protocol: TCP
          {{- /* "/" is the UI index and is served in every auth mode; an API path
                 would 401 under auth-mode=client and fail the probe. */}}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" (dict "httpGet" (dict "path" "/" "port" "web" "scheme" $scheme) "initialDelaySeconds" 10 "periodSeconds" 20)) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" (dict "httpGet" (dict "path" "/" "port" "web" "scheme" $scheme) "initialDelaySeconds" 30 "periodSeconds" 30 "failureThreshold" 6)) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
{{- end }}

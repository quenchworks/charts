{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argo-workflows.serverName" . }}
  labels:
    {{- include "argo-workflows.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: web
      port: {{ .Values.server.service.port }}
      targetPort: web
      protocol: TCP
  selector:
    {{- include "argo-workflows.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
{{- end }}

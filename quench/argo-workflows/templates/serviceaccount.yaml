{{- if .Values.serviceAccount.create }}
{{/* Both components talk to the API server, so unlike most quench charts their
     tokens are deliberately mounted (see automountServiceAccountToken in the
     Deployments). One ServiceAccount each keeps their RBAC separable. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argo-workflows.controllerServiceAccountName" . }}
  labels:
    {{- include "argo-workflows.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.server.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argo-workflows.serverServiceAccountName" . }}
  labels:
    {{- include "argo-workflows.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

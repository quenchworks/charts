# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image
# -- including for the executor, which is what the gate's workflow submit proves.
controller:
  replicaCount: 1
  logLevel: info
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1, memory: 512Mi }
server:
  enabled: true
  replicaCount: 1
  secure: false
  authModes:
    - server
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
executor:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 256Mi }

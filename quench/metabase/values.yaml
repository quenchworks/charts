# The digest below is the contract with the image factory. CI rewrites it from the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/metabase
  digest: "sha256:4d8cd08b391395c57a3d13000c096c8c65562f8b5122867a6039b104be4de6d0"
  pullPolicy: IfNotPresent

nameOverride: ""

# One replica: Metabase runs its database migrations at startup, and upstream
# documents a single instance per application database unless you run the
# Enterprise clustering setup.
replicaCount: 1

# Metabase encrypts the connection details of every database you add with this
# key. Losing it makes all saved connections unreadable. Empty: generated once
# and kept across upgrades in the Secret <fullname> (encryption-key). Or set it,
# or bring a Secret.
encryptionKey:
  value: ""
  existingSecret: ""
  existingSecretKey: encryption-key

# Public URL, used in emails and embeds (MB_SITE_URL).
siteUrl: ""

# --- DATABASE, mode 1 (default): the bundled PostgreSQL subchart. ---
postgresql:
  enabled: true
  auth:
    # username and database MUST differ: the bundled PostgreSQL only creates the
    # application database when its name differs from the superuser's.
    username: metabasedb
    password: ""              # generated if empty; in the Secret <release>-postgresql
    database: metabase
  primary:
    persistence:
      enabled: true
      size: 8Gi

# --- DATABASE, mode 2: external PostgreSQL (postgresql.enabled=false). ---
externalDatabase:
  host: ""
  port: 5432
  database: metabase
  username: metabase
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password

# Waits for the database before Metabase starts, so the first boot does not burn
# its startup attempts on a PostgreSQL that is still initialising. Uses our
# postgresql image for pg_isready (a parent chart cannot read a subchart's pin).
waitForDatabase:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/postgresql
    digest: "sha256:beda4af6174e30ad6ed2d9ca9a8962e2d2cb59af2ffd98a9b846b1edc41a0636"

# JVM heap as a percentage of the container memory limit.
javaMaxRamPercentage: 75

resources:
  requests: { cpu: 250m, memory: 1536Mi }
  limits: { cpu: "2", memory: 3Gi }

service:
  type: ClusterIP
  port: 3000
  # HTTPS Service port (to the container's 8443), only with tls.enabled
  httpsPort: 443

# Native TLS: Metabase's Jetty also serves HTTPS on 8443 (Service service.httpsPort) beside
# HTTP on 3000, which the probes keep. Jetty reads only a keystore, so an init container on
# the openssl image builds a PKCS12. The certificate comes from the first source set:
# existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
# Point siteUrl at the https address.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  hosts: []
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy:
  type: Recreate
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

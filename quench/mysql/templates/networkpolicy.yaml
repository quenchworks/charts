{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: mysql
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: metrics
          protocol: TCP
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    {{- if eq .Values.architecture "group-replication" }}
    # Group Replication intra-group traffic: 33061 is the XCom group-communication
    # port. Recovery reuses 3306 (mysql, already open). Always restricted to
    # same-namespace pods regardless of allowExternal.
    - ports:
        - port: gr
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: primary
    {{- end }}
{{- end }}

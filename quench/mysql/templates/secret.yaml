{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $root := .Values.auth.rootPassword -}}
{{- if and (not $root) $existing -}}{{- $root = index $existing.data "mysql-root-password" | b64dec -}}{{- end -}}
{{- if not $root -}}{{- $root = randAlphaNum 24 -}}{{- end -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = (index $existing.data "mysql-password" | default ("" | b64enc)) | b64dec -}}{{- end -}}
{{- if and (not $pw) .Values.auth.username -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ $root | b64enc | quote }}
  {{- if .Values.auth.username }}
  mysql-password: {{ $pw | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mysql.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq .Values.architecture "group-replication" }}
# HA mode: the pod self-labels its GR role (primary/secondary) via the Kubernetes API.
automountServiceAccountToken: true
{{- else }}
# the standalone database pod does not call the Kubernetes API
automountServiceAccountToken: false
{{- end }}
{{- end }}

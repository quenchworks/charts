# The digest below is the contract with the image factory. CI rewrites it on the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mysql
  digest: "sha256:5b9fa4ac752adb65490b5a8360aa5f4bb2179e583a90c715cdb2922dd63102b6"
  pullPolicy: IfNotPresent

nameOverride: ""

# Authentication. MySQL requires a root password to initialize. A random one is
# generated if you do not set it. Optionally create an application user + database.
auth:
  enabled: true
  rootPassword: ""
  database: ""
  username: ""
  password: ""
  existingSecret: ""
  existingSecretRootPasswordKey: "mysql-root-password"
  existingSecretPasswordKey: "mysql-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 3306

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The digest below is the contract with the image factory. CI rewrites it on the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mysql
  digest: "sha256:65ea66e8db48959d5657df21732e86aafdd11960b0a58ce68c749e896f976bb5"
  pullPolicy: IfNotPresent

nameOverride: ""

# Topology.
#   standalone       — a single primary (the backward-compatible default; unchanged).
#   group-replication — a self-managed HA cluster using MySQL Group Replication in
#                       single-primary mode: one PRIMARY (read/write) + N-1 SECONDARY
#                       (read-only), with automatic primary election on failure via
#                       the built-in group_replication plugin. Needs ha.replicaCount
#                       nodes (odd, >=3) so a surviving majority keeps quorum.
architecture: standalone

# Group Replication settings — only used when architecture: group-replication.
ha:
  # Node count. Keep it ODD (3, 5, ...) so the group has an unambiguous majority.
  # 3 tolerates the loss of 1 node while staying writable.
  replicaCount: 3
  # Fixed group UUID shared by every member (must be a valid UUID and must not
  # collide with any server_uuid — random server_uuids make that effectively
  # impossible). Change it only to run two independent groups off one image.
  groupName: "6ea2c9b8-1b2c-4f3d-8e5a-000000000001"
  # Distributed-recovery user GR creates on every node to catch a joiner up from a
  # donor. Its password is generated into the auth Secret (key mysql-replication-password).
  replicationUsername: replicator

# Authentication. MySQL requires a root password to initialize. A random one is
# generated if you do not set it. Optionally create an application user + database.
auth:
  enabled: true
  rootPassword: ""
  database: ""
  username: ""
  password: ""
  existingSecret: ""
  existingSecretRootPasswordKey: "mysql-root-password"
  existingSecretPasswordKey: "mysql-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 3306

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 120
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiVersion: v2
name: kserve
description: "KServe: serve ML models on Kubernetes from InferenceService resources, with autoscaling and canary rollouts. Runs in Standard mode (plain Deployments), so it needs neither Knative nor Istio nor cert-manager; the CRDs ship with the chart. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.21.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - kserve
  - model-serving
  - inference
  - machine-learning
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kserve/kserve
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "ArtifactHub verified-publisher metadata. First release (0.0.1): the KServe 0.21.0 controller in Standard mode, with its CRDs and a Helm-generated webhook certificate."
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: kserve-controller
      image: ghcr.io/quenchworks/images/kserve-controller@sha256:62478dbc9d9e74e5f1987be51c3df11383408d8745a77a28639c2b3a14f2a77d
  artifacthub.io/crds: |
    - kind: InferenceService
      version: v1beta1
      name: inferenceservices.serving.kserve.io
      displayName: InferenceService
      description: A model served over HTTP or gRPC.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

{{/*
The webhook serving certificate, signed by a CA Helm generates, so the chart
needs no cert-manager. Kept across upgrades: the live Secret is reused.
*/}}
{{- $name := printf "%s-webhook" (include "quench-common.fullname" .) -}}
{{- $secret := printf "%s-webhook-cert" (include "quench-common.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret -}}
{{- $ca := "" -}}{{- $crt := "" -}}{{- $key := "" -}}
{{- if $existing -}}
{{- $ca = index $existing.data "ca.crt" -}}{{- $crt = index $existing.data "tls.crt" -}}{{- $key = index $existing.data "tls.key" -}}
{{- else -}}
{{- $cn := printf "%s.%s.svc" $name .Release.Namespace -}}
{{- $caObj := genCA (printf "%s-ca" $name) 3650 -}}
{{- $cert := genSignedCert $cn nil (list $cn (printf "%s.%s" $name .Release.Namespace) $name) 3650 $caObj -}}
{{- $ca = $caObj.Cert | b64enc -}}{{- $crt = $cert.Cert | b64enc -}}{{- $key = $cert.Key | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: webhook
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: inferenceservice.serving.kserve.io
webhooks:
  - clientConfig:
      caBundle: {{ $ca }}
      service:
        name: {{ include "quench-common.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-serving-kserve-io-v1beta1-inferenceservice
    failurePolicy: Fail
    name: inferenceservice.kserve-webhook-server.defaulter
    sideEffects: None
    admissionReviewVersions: ["v1beta1"]
    rules:
      - apiGroups:
          - serving.kserve.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - inferenceservices
  - clientConfig:
      caBundle: {{ $ca }}
      service:
        name: {{ include "quench-common.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-pods
    failurePolicy: Fail
    name: inferenceservice.kserve-webhook-server.pod-mutator
    sideEffects: None
    reinvocationPolicy: IfNeeded
    admissionReviewVersions: ["v1beta1"]
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: DoesNotExist
    objectSelector:
      matchExpressions:
        - key: serving.kserve.io/inferenceservice
          operator: Exists
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:

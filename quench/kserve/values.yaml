# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kserve-controller
  digest: "sha256:9e32d987f07b66a5782288ff2cfa1a6ab361fcd352237be1c2a8fcc0f736b013"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# More than one replica turns on leader election.
replicaCount: 1

# Standard runs each InferenceService as a plain Deployment and Service.
# Knative needs Knative Serving and Istio installed separately.
deploymentMode: Standard

extraArgs: []
extraEnvVars: []

resources:
  requests: { cpu: 100m, memory: 200Mi }
  limits: { cpu: "1", memory: 1Gi }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

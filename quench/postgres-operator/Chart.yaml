apiVersion: v2
name: postgres-operator
description: "Zalando Postgres Operator: highly available PostgreSQL clusters on Patroni from postgresql custom resources, with rolling updates, failover, connection pooling and clones. The clusters run on the QuenchWorks Spilo image (PostgreSQL 18 + Patroni + WAL-G). Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "2.0.3"
keywords:
  - postgresql
  - postgres
  - operator
  - patroni
  - spilo
  - high-availability

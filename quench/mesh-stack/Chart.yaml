apiVersion: v2
name: mesh-stack
description: "Istio ambient mesh in one install: istiod (control plane and certificate authority), the istio-cni node agent and ztunnel, wired for ambient so every pod in a labelled namespace talks mutual TLS with a SPIFFE identity, with no sidecars. All QuenchWorks images are CVE-gated, pinned by digest and cosign-signed."

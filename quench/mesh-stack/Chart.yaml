apiVersion: v2
name: mesh-stack
description: "Istio ambient mesh in one install: istiod (control plane and certificate authority), the istio-cni node agent and ztunnel, wired for ambient so every pod in a labelled namespace talks mutual TLS with a SPIFFE identity, with no sidecars. All QuenchWorks images are CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.16
appVersion: "1.30.8"
keywords:
  - istio
  - ambient
  - service-mesh
  - mtls
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/istio/istio
  - https://github.com/istio/ztunnel
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned istio-cni to rebuilt image digests."
  artifacthub.io/category: networking
  artifacthub.io/images: |

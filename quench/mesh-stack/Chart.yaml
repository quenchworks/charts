      image: ghcr.io/quenchworks/images/istiod@sha256:482c8b19129a4db101d92df46f7e9b8fca187431b20f6b1bb03c259ef615d585
    - name: istio-cni
      image: ghcr.io/quenchworks/images/istio-cni@sha256:a46f1e82011d318e6fa352d9ec3c8f2d5bd03a479ca66388ec37d27fdf17dbed
    - name: ztunnel

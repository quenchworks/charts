apiVersion: v2
name: argo-events
description: "Argo Events, event-driven automation for Kubernetes: EventSources (webhooks, queues, schedules, cloud events), Sensors that trigger workflows, resources and HTTP calls, and the JetStream EventBus between them. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.18
appVersion: "1.9.11"
keywords:
  - argo
  - argo-events
  - event-driven
  - automation
  - webhooks
maintainers:

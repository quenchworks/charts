apiVersion: v2
name: argo-events
description: "Argo Events, event-driven automation for Kubernetes: EventSources (webhooks, queues, schedules, cloud events), Sensors that trigger workflows, resources and HTTP calls, and the JetStream EventBus between them. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.13
appVersion: "1.9.11"
keywords:
  - argo
  - argo-events
  - event-driven
  - automation
  - webhooks
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/argoproj/argo-events
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-02 CVE fixes"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: argo-events
      image: ghcr.io/quenchworks/images/argo-events@sha256:d92b836b919ed734e76a96afd98d53c69ddf9525b6a253d4714e73bed4496af3
    - name: nats-server-config-reloader
      image: ghcr.io/quenchworks/images/nats-server-config-reloader@sha256:687b45d272df5121e6947992c0ef136bce48d573e36eda5352b7bd93bb06933b
    - name: prometheus-nats-exporter
      image: ghcr.io/quenchworks/images/prometheus-nats-exporter@sha256:0d99174894253cee8babcced09bf95025fa123ef678046e2eba9ae4f995b7f11
    - name: nats
      image: ghcr.io/quenchworks/images/nats@sha256:f93ef4bb593ba793dc7713133365af45b32580cedbece4aff2153b60dc28f64d
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: EventBus
      version: v1alpha1
      name: eventbus.argoproj.io
      displayName: EventBus
      description: The transport between EventSources and Sensors (JetStream, NATS or Kafka).
    - kind: EventSource
      version: v1alpha1
      name: eventsources.argoproj.io
      displayName: EventSource
      description: Receives or polls events (webhooks, queues, schedules, cloud events).
    - kind: Sensor
      version: v1alpha1
      name: sensors.argoproj.io
      displayName: Sensor
      description: Waits on event dependencies and runs triggers.
  artifacthub.io/links: |

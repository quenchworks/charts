apiVersion: v2
name: argo-events
description: "Argo Events, event-driven automation for Kubernetes: EventSources (webhooks, queues, schedules, cloud events), Sensors that trigger workflows, resources and HTTP calls, and the JetStream EventBus between them. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "1.9.11"
keywords:
  - argo
  - argo-events
  - event-driven
  - automation
  - webhooks
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/argoproj/argo-events
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "The JetStream EventBus now runs the QuenchWorks config reloader and Prometheus NATS exporter images instead of upstream's."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: argo-events
      image: ghcr.io/quenchworks/images/argo-events@sha256:401e4bbadaf9cc26eec92c2bd70b24f0e2d2e660e250d0efe990718a8f18af07
    - name: nats-server-config-reloader
      image: ghcr.io/quenchworks/images/nats-server-config-reloader@sha256:9f03a8bb3549cf5ebc5b8cda5e8d2d67ce4d2e4dbcba8507ed6b6e244b77aaff
    - name: prometheus-nats-exporter
      image: ghcr.io/quenchworks/images/prometheus-nats-exporter@sha256:fa786a70abda58e681254d229dd322e9517b2e8339e0789c43363134b647b012
    - name: nats
      image: ghcr.io/quenchworks/images/nats@sha256:2cd50c9efb5742e2806ee71fc71a4bff42776bf97d8313a93e7ae55bbb009c46
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: EventBus
      version: v1alpha1
      name: eventbus.argoproj.io
      displayName: EventBus
      description: The transport between EventSources and Sensors (JetStream, NATS or Kafka).
    - kind: EventSource
      version: v1alpha1
      name: eventsources.argoproj.io
      displayName: EventSource
      description: Receives or polls events (webhooks, queues, schedules, cloud events).
    - kind: Sensor
      version: v1alpha1
      name: sensors.argoproj.io
      displayName: Sensor
      description: Waits on event dependencies and runs triggers.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

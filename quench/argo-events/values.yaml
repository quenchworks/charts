# Quenchworks Argo Events on the QuenchWorks argo-events image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). The controller starts EventSource and Sensor pods from
# the same image, and EventBus pods from the images in eventBus below.
image:
  repository: ghcr.io/quenchworks/images/argo-events
  digest: "sha256:7646cc078a756114ecbfe87c1962162b4af64c35ab7c0f2bcd535fbccf9e03e4"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Two replicas elect a leader; only the leader reconciles.
replicas: 1

# Watch only the release namespace (a Role instead of a ClusterRole).
namespaced: false

# The images the controller runs a JetStream EventBus with: the QuenchWorks nats, config
# reloader and metrics exporter images, all nonroot uid 1001, so give the EventBus
# spec.jetstream.securityContext.fsGroup: 1001.
eventBus:
  jetstream:
    version: "2.15.0"
    natsImage: ghcr.io/quenchworks/images/nats@sha256:2a782c554c12b9991cd3d3d5e5694c62bb17324c11492c70b414b80beac1bb37
    startCommand: /usr/bin/nats-server
    configReloaderImage: ghcr.io/quenchworks/images/nats-server-config-reloader@sha256:687b45d272df5121e6947992c0ef136bce48d573e36eda5352b7bd93bb06933b
    metricsExporterImage: ghcr.io/quenchworks/images/prometheus-nats-exporter@sha256:0d99174894253cee8babcced09bf95025fa123ef678046e2eba9ae4f995b7f11
    # nats server settings (max_memory_store, max_file_store) and stream defaults
    settings: |
      max_memory_store: -1
      max_file_store: 1TB
    streamConfig: |
      maxMsgs: 50000
      maxAge: 168h
      maxBytes: -1
      replicas: 3
      duplicates: 300s
      retention: 0
      discard: 0

extraArgs: []
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1000m, memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true
  # aggregate read and write access to the Argo Events kinds into the admin, edit and
  # view roles
  aggregateToDefaultRoles: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

# Quenchworks Argo Events on the QuenchWorks argo-events image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). The controller starts EventSource and Sensor pods from
# the same image, and EventBus pods from the images in eventBus below.
image:
  repository: ghcr.io/quenchworks/images/argo-events
  digest: "sha256:fdc1663facbbc5cb6ea767cd5578ed7188c198bf5de38f39b9341605e5cad5ae"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Two replicas elect a leader; only the leader reconciles.
replicas: 1

# Watch only the release namespace (a Role instead of a ClusterRole).
namespaced: false

# The images the controller runs a JetStream EventBus with: the QuenchWorks nats, config
# reloader and metrics exporter images, all nonroot uid 1001, so give the EventBus
# spec.jetstream.securityContext.fsGroup: 1001.
eventBus:
  jetstream:
    version: "2.15.0"
    natsImage: ghcr.io/quenchworks/images/nats@sha256:09224a35ee74c965832c3de600aa3103b918bf2534844acedd0f72eb0e42bbd7
    startCommand: /usr/bin/nats-server
    configReloaderImage: ghcr.io/quenchworks/images/nats-server-config-reloader@sha256:480e5a8fcb09aee0b0f6e195cb35161d4a76de7f60ff69f2395e61b1eb79ad26
    metricsExporterImage: ghcr.io/quenchworks/images/prometheus-nats-exporter@sha256:eeaadb8b4dc184c7a67bb5e4f2716279c4a490d97c450c209143200a425675d6
    # nats server settings (max_memory_store, max_file_store) and stream defaults
    settings: |
      max_memory_store: -1
      max_file_store: 1TB
    streamConfig: |
      maxMsgs: 50000
      maxAge: 168h
      maxBytes: -1
      replicas: 3
      duplicates: 300s
      retention: 0
      discard: 0

extraArgs: []
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1000m, memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true
  # aggregate read and write access to the Argo Events kinds into the admin, edit and
  # view roles
  aggregateToDefaultRoles: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

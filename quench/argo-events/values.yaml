# Quenchworks Argo Events on the QuenchWorks argo-events image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). The controller starts EventSource and Sensor pods from
# the same image, and EventBus pods from the images in eventBus below.
image:
  repository: ghcr.io/quenchworks/images/argo-events
  digest: "sha256:63a9bb4521a680bd0e03ea3edf6529cdf9f58fb55d80b4ae1b65bf89e494c6ed"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Two replicas elect a leader; only the leader reconciles.
replicas: 1

# Watch only the release namespace (a Role instead of a ClusterRole).
namespaced: false

# The images the controller runs a JetStream EventBus with: the QuenchWorks nats, config
# reloader and metrics exporter images, all nonroot uid 1001, so give the EventBus
# spec.jetstream.securityContext.fsGroup: 1001.
eventBus:
  jetstream:
    version: "2.15.0"
    natsImage: ghcr.io/quenchworks/images/nats@sha256:5c429605b61f1a3d56d8b84cc4b4bb6655d04d7271e5fa482c7ac6e6953d8977
    startCommand: /usr/bin/nats-server
    configReloaderImage: ghcr.io/quenchworks/images/nats-server-config-reloader@sha256:599610b80e604bc3256d119fc4dfbc7d244d545d94998da62ecc5074c312a9e4
    metricsExporterImage: ghcr.io/quenchworks/images/prometheus-nats-exporter@sha256:729249ed081bca2e23919ef359ea345106fe9c4f2bf50533a71af319d0c2c383
    # nats server settings (max_memory_store, max_file_store) and stream defaults
    settings: |
      max_memory_store: -1
      max_file_store: 1TB
    streamConfig: |
      maxMsgs: 50000
      maxAge: 168h
      maxBytes: -1
      replicas: 3
      duplicates: 300s
      retention: 0
      discard: 0

extraArgs: []
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1000m, memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true
  # aggregate read and write access to the Argo Events kinds into the admin, edit and
  # view roles
  aggregateToDefaultRoles: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

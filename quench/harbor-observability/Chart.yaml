apiVersion: v2
name: harbor-observability
description: "Monitoring stack for a QuenchWorks Harbor registry. This meta-chart deploys the QuenchWorks Prometheus and Grafana charts preconfigured for Harbor, with Prometheus scraping the harbor-exporter and the core, registry, and jobservice metrics endpoints, and Grafana provisioned with a Prometheus datasource and a Harbor dashboard covering request rate, component health, garbage collection, quota, and the task queue. All images are nonroot, 0-CVE, and pinned by digest through the sub-charts."
type: application
version: 0.0.6
appVersion: "2.14.4"
keywords:
  - harbor
  - monitoring
  - observability
  - prometheus
  - grafana
  - metrics
  - dashboards
  - registry
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Maintenance re-release: re-validated against the chart's current pinned, cosign-signed 0-CVE images."
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:d5708594a12a4178014daaee6110348b6186f8812abd9241f6691d62e3663214
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:ae5dfc810d218c92a6e3e5ae2401317c86ab76206e5f53c3388c74ef7961f995
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: prometheus
    alias: prometheus
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    alias: grafana
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

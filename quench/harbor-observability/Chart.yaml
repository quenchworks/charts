apiVersion: v2
name: harbor-observability
description: "Monitoring stack for a QuenchWorks Harbor registry. This meta-chart deploys the QuenchWorks Prometheus and Grafana charts preconfigured for Harbor, with Prometheus scraping the harbor-exporter and the core, registry, and jobservice metrics endpoints, and Grafana provisioned with a Prometheus datasource and a Harbor dashboard covering request rate, component health, garbage collection, quota, and the task queue. All images are nonroot, CVE-gated, and pinned by digest through the sub-charts."
type: application
version: 0.0.30
appVersion: "2.14.4"
keywords:
  - harbor
  - monitoring
  - observability
  - prometheus
  - grafana
  - metrics
  - dashboards
  - registry
maintainers:

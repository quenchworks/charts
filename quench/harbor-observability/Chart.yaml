apiVersion: v2
name: harbor-observability
description: Quenchworks Harbor observability stack — a Harbor-style monitoring meta-chart that deploys the Quenchworks Prometheus and Grafana charts preconfigured to monitor a Harbor instance. Prometheus scrapes the harbor-exporter (plus core/registry/jobservice /metrics); Grafana boots with a Prometheus datasource and a provisioned Harbor dashboard (request rate, registry/core health, GC, quota, task queue). Nonroot, 0-CVE images pinned by digest via the sub-charts.
type: application
version: 0.0.1
appVersion: "2.14.4"
keywords:
  - harbor
  - monitoring
  - observability
  - prometheus
  - grafana
  - metrics
  - dashboards
  - registry
maintainers:
  - name: QuenchWorks
    email: quenchworks@mkabumattar.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/goharbor/harbor
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:7e1f790c459d0decab10951cc0c9c00e5ceeed22e23b4b7f60bfb088d40aeb50
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:378c7a7beeffa74c627a146124b6cf4377c273da31b28272702df50f4f088288
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: prometheus
    alias: prometheus
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    alias: grafana
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

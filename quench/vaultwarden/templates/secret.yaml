{{- /* The admin panel token (/admin), only when the panel is enabled and no Secret is given.
       Generated once and read back on upgrade. */}}
{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- $name := include "vaultwarden.adminSecretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
{{- $tok := .Values.admin.token | default (get $old "admin-token" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ $tok | b64enc | quote }}
{{- end }}

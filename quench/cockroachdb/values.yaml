# SECURITY POSTURE — INSECURE BY DEFAULT
# This chart runs a single-node CockroachDB in INSECURE mode (no TLS, no auth).
# There are NO credentials. The NetworkPolicy is the only access boundary. Secure
# mode (TLS/certs) and multi-node clustering are documented follow-ups.
# ============================================================================

# The digest below is the contract with the image factory. CI rewrites it from
# manifests/cockroachdb.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/cockroachdb
  digest: "sha256:999d37602d17ed56d48d4146b0f36dd140ce3b99dbf9c2022addbe17437e0719"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single node. The default deployment is a single-node insecure cluster and needs
# no coordination. Multi-node clustering is opt-in via extraEnvVars
# (COCKROACH_JOIN + a one-time `cockroach init`) and is a documented follow-up.
replicaCount: 1

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""           # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""            # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 4Gi }

service:
  type: ClusterIP
  # SQL / Postgres wire protocol (client port) and the HTTP admin UI / health port.
  sqlPort: 26257
  httpPort: 8080

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

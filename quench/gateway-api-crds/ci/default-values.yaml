# Standalone install gate. The chart has no image and no workload, so the gate is
# an API-surface check: the CRDs must become Established and carry the channel and
# bundle-version this chart claims, the safe-upgrades policy must exist and must
# actually deny a channel crossover, and real Gateway API objects must be accepted
# by the apiserver (which exercises the CRD schemas and their CEL rules).
#
# Defaults are used as-is. The kind cluster is thrown away after the run, so
# keep=true costs nothing here and keeps the gate testing the shipped default
# rather than a CI-only variant -- the workflow asserts the keep behaviour by
# uninstalling and checking the CRDs survived.
crds:
  keep: true
safeUpgradePolicy:
  enabled: true

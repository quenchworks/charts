{{/*
First boot runs initdb + CREATE EXTENSION documentdb CASCADE + creates the Mongo
admin user before the gateway binds 10260 (~20-40s). The image has no shell mongo
client, so probes are tcpSocket on the gateway port with generous timing.
*/}}
{{- $liveness := dict "tcpSocket" (dict "port" "mongodb") "initialDelaySeconds" 30 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "tcpSocket" (dict "port" "mongodb") "initialDelaySeconds" 20 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  serviceName: {{ include "documentdb.headlessName" . }}
  replicas: 1
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: primary
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "documentdb.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: documentdb
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # PGDATA is a subdir of the mounted volume so initdb owns a clean
            # directory it can chmod 0700 (the mount-point root cannot be chmod'd
            # on a read-only-rootfs nonroot container).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Mongo admin user created on first boot via documentdb_api.create_user.
            - name: DOCUMENTDB_USER
              value: {{ .Values.auth.username | quote }}
            {{- if .Values.auth.enabled }}
            - name: DOCUMENTDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "documentdb.secretName" . }}
                  key: {{ include "documentdb.secretPasswordKey" . }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            # MongoDB wire protocol (pg_documentdb_gw gateway). PostgreSQL stays internal.
            - name: mongodb
              containerPort: 10260
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.primary.resources | nindent 12 }}
          volumeMounts:
            # PGDATA — the persistent data directory (image default path).
            - name: data
              mountPath: /var/lib/postgresql/data
            # PostgreSQL Unix socket dir.
            - name: run
              mountPath: /var/run/postgresql
            # Gateway runtime dir — pg_documentdb_gw writes its auto-generated
            # cert.pem / pkey.pem here on first start (read-only rootfs).
            - name: gateway
              mountPath: /var/lib/documentdb/gateway
            - name: tmp
              mountPath: /tmp
            {{- if .Values.primary.shmVolume.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: gateway
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.primary.shmVolume.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if and .Values.primary.persistence.enabled .Values.primary.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.primary.persistence.existingClaim }}
        {{- else if not .Values.primary.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.primary.persistence.enabled (not .Values.primary.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.primary.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.primary.persistence.accessModes }}
        {{- with .Values.primary.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.primary.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.primary.persistence.size }}
  {{- end }}

# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest from values.yaml. Bundles MySQL on a small PVC with small resources for the
# runner. Passwords are left empty on purpose: the gate then also proves the generated
# MySQL password reaches Backdrop. --wait passes only once the init container has run
# the CLI installer against MySQL and the front page renders.
mysql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
persistence:
  size: 1Gi

{{/*
The managed Secret carries the hash salt, the installer's admin password (unless
backdrop.admin.existingSecret supplies it) and, for an external database without an
existingSecret, the DB password. Values are read back from the existing Secret so they
stay stable across upgrades. The bundled MySQL's password lives in its own Secret,
which the pod reads directly.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $admin := not .Values.backdrop.admin.existingSecret -}}
{{- $db := and (not .Values.mysql.enabled) (not .Values.externalDatabase.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $salt := .Values.backdrop.hashSalt }}
  {{- if and (not $salt) $existing }}{{- $salt = index $existing.data "hash-salt" | default "" | b64dec }}{{- end }}
  {{- if not $salt }}{{- $salt = randAlphaNum 64 }}{{- end }}
  hash-salt: {{ $salt | b64enc | quote }}
  {{- if $admin }}
  {{- $pw := .Values.backdrop.admin.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "admin-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $db }}
  {{- $pw := .Values.externalDatabase.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  db-password: {{ $pw | b64enc | quote }}
  {{- end }}

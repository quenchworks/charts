apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Run by the init container. Values pass as separate arguments ("--opt value"):
  # install.sh splits "--opt=value" on every "=", which would cut a password.
  install.sh: |
    set -eu
    if [ -s /var/www/html/files/config/active/system.core.json ]; then
      echo "active config exists, Backdrop is installed"
      exit 0
    fi
    # The installer fails on an unreachable database, and a half-run install leaves
    # tables behind, so wait for the port first. busybox here has no nc; PHP does it.
    echo "waiting for $BACKDROP_DB_HOST:$BACKDROP_DB_PORT"
    php -r '$t = time() + (int) getenv("BACKDROP_DB_WAIT");
      while (!($s = @fsockopen(getenv("BACKDROP_DB_HOST"), (int) getenv("BACKDROP_DB_PORT"), $e, $m, 3))) {
        if (time() > $t) { fwrite(STDERR, "database not reachable: $m\n"); exit(1); }
        sleep(2);
      }'
    cd /var/www/html
    # settings.php already holds the connection (from env), so the installer skips its
    # database step; --db-url is required by the script and names the same database.
    url="$(php -r 'echo "mysql://", rawurlencode(getenv("BACKDROP_DB_USER")), ":", rawurlencode(getenv("BACKDROP_DB_PASSWORD")), "@", getenv("BACKDROP_DB_HOST"), ":", getenv("BACKDROP_DB_PORT"), "/", rawurlencode(getenv("BACKDROP_DB_NAME"));')"
    php core/scripts/install.sh \
      --db-url "$url" \
      --site-name "$BACKDROP_SITE_NAME" \
      --site-mail "$BACKDROP_ADMIN_EMAIL" \
      --account-name "$BACKDROP_ADMIN_USERNAME" \
      --account-mail "$BACKDROP_ADMIN_EMAIL" \
      --account-pass "$(cat /etc/backdrop/secrets/admin-password)"
    test -s files/config/active/system.core.json

{{- /* Simple auth: users.yml with a bcrypt hash (Helm's htpasswd), plus the plain password for
       the admin to read. Both are generated once and read back on upgrade, so the hash and the
       password stay a matching pair. */}}
{{- if .Values.auth.enabled }}
{{- $name := include "dozzle.secretName" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $users := get $old "users.yml" | b64dec }}
{{- if or (not $users) (ne $pw (get $old "password" | b64dec)) }}
{{- $hash := index (splitList ":" (htpasswd .Values.auth.username $pw)) 1 }}
{{- $users = printf "users:\n  %s:\n    name: %s\n    email: %s\n    password: %s\n" .Values.auth.username (.Values.auth.username | quote) (.Values.auth.email | quote) ($hash | quote) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  users.yml: {{ $users | b64enc | quote }}
{{- end }}

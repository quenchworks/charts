{{/* The edge API answers its version endpoint unauthenticated, over TLS. */}}
{{- $health := dict "httpGet" (dict "path" "/edge/client/v1/version" "port" "edge-api" "scheme" "HTTPS") -}}
{{- $liveness := merge (dict "initialDelaySeconds" 30 "periodSeconds" 15) (deepCopy $health) -}}
{{- $readiness := merge (dict "initialDelaySeconds" 5 "periodSeconds" 10) (deepCopy $health) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "quench-common.fullname" . }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openziti.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: openziti
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          # Controller + integrated edge router. On a volume that already holds a network it
          # reuses the PKI, database and router identity (the root CA does not change).
          args:
            - edge
            - quickstart
            - --home=/persistent/quickstart
            - --ctrl-address={{ include "openziti.advertisedHost" . }}
            - --ctrl-port={{ .Values.controller.port }}
            - --router-address={{ include "openziti.advertisedHost" . }}
            - --router-port={{ .Values.router.port }}
            - --password=$(ZITI_ADMIN_PASSWORD)
          env:
            - name: HOME
              value: /persistent
            - name: ZITI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openziti.adminSecret" . }}
                  key: password
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: edge-api
              containerPort: {{ .Values.controller.port }}
              protocol: TCP
            - name: edge-router
              containerPort: {{ .Values.router.port }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /persistent
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toJson .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

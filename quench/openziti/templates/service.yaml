apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: edge-api
      port: {{ .Values.controller.port }}
      targetPort: edge-api
      protocol: TCP
    - name: edge-router
      port: {{ .Values.router.port }}
      targetPort: edge-router
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

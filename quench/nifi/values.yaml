# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/nifi
  digest: "sha256:dac22e40e9860161be1ab5cafd091516a0486b053011ce451b05118e69f0cc1a"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-user login (NiFi's default mode). The password needs 12+ characters;
# empty generates one, kept across upgrades. Or point existingSecret at a Secret
# with username and password keys.
auth:
  username: admin
  password: ""
  existingSecret: ""

# JVM heap (-Xms and -Xmx in bootstrap.conf). Keep it well under the memory limit:
# NiFi also uses off-heap memory for content and native libraries.
heap: 1g

resources:
  requests: { cpu: 500m, memory: 2Gi }
  limits: { cpu: "2", memory: 3Gi }

# conf/, the flowfile, content, provenance and database repositories, and local
# state, on one volume. Off: an emptyDir, so the flow is lost on restart.
persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

# The UI is HTTPS on 8443 with a certificate NiFi generates on first start, unless
# tls.enabled supplies one.
service:
  type: ClusterIP

# Native TLS with a real certificate: NiFi's HTTPS on 8443 serves the chart certificate
# instead of the one it generates. NiFi reads only keystores, so an init container on the
# openssl image builds PKCS12 files, and the configure step points nifi.properties at them
# (the generated lines are restored when TLS is turned off). The certificate comes from the
# first source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA +
# certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

# Extra Host header values NiFi accepts (nifi.web.proxy.host), e.g. the name you
# expose it under: [nifi.example.com, nifi.example.com:443]. The Service names and
# localhost:8443 are always included.
proxyHosts: []

extraEnvVars: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

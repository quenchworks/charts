{{- if not .Values.auth.existingSecret }}
{{/* Single-user login. NiFi requires a password of at least 12 characters. Read
     back from the live Secret so upgrades keep the same login. */}}
{{- $name := include "nifi.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing }}{{- $pw = index $existing.data "password" | default "" | b64dec }}{{- end -}}
{{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.auth.username | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
{{- end }}

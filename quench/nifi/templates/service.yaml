apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{/* OpenFGA's HTTP server exposes GET /healthz on the HTTP port; it returns 200
     {"status":"SERVING"} once the server is up. Used for liveness + readiness. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $port := ternary "https" "http" (eq $tls "true") -}}
{{- $scheme := ternary "HTTPS" "HTTP" (eq $tls "true") -}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" $port "scheme" $scheme) "initialDelaySeconds" 5 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" $port "scheme" $scheme) "initialDelaySeconds" 2 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openfga.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: openfga
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/openfga"]
          args:
            - "run"
            - "--datastore-engine={{ .Values.datastore.engine }}"
            {{- if .Values.datastore.uri }}
            - "--datastore-uri={{ .Values.datastore.uri }}"
            {{- end }}
            - "--playground-enabled={{ .Values.playground.enabled }}"
            {{- if $tls }}
            # Native TLS on the HTTP API: nonroot cannot bind 443, so OpenFGA serves HTTPS
            # on 8443 and the Service maps it to 443. The gRPC API is unchanged.
            - "--http-addr=0.0.0.0:8443"
            - "--http-tls-enabled=true"
            - "--http-tls-cert=/tls/tls.crt"
            - "--http-tls-key=/tls/tls.key"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: {{ $port }}
              containerPort: {{ ternary 8443 8080 (eq $tls "true") }}
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.extraVolumeMounts $tls }}
          volumeMounts:
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
          {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- if or .Values.extraVolumes $tls }}
      volumes:
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
      {{- end }}

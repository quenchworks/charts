{{- /* The admin password and the upload password: generated once and read back on upgrade. */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $admin := .Values.auth.adminPassword | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
{{- $up := .Values.auth.uploadPasswordValue | default (get $old "upload-password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  upload-password: {{ $up | b64enc | quote }}
{{- end }}

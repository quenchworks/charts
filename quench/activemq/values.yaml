# Quenchworks Apache ActiveMQ Classic on the QuenchWorks activemq image (nonroot,
# 0-CVE, cosign-signed, pinned by digest). One broker with KahaDB on a PVC.
image:
  repository: ghcr.io/quenchworks/images/activemq
  digest: "sha256:6cd463ba16c7f8009e99305954fb1602b489772df12edd2a17ea00452df3cd8a"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

auth:
  # Broker (simpleAuthenticationPlugin) and web console (JAAS) share one admin user.
  # Empty password generates one, kept across upgrades. false leaves the broker open,
  # as upstream ships it.
  enabled: true
  username: admin
  password: ""
  # An existing Secret with keys credentials.properties and users.properties, in the
  # formats this chart writes (see templates/secret.yaml).
  existingSecret: ""

# OpenWire is always on (61616). The others are optional.
connectors:
  amqp: false     # 5672
  stomp: false    # 61613
  mqtt: false     # 1883

# KahaDB limits; keep store + temp under persistence.size.
storeLimit: 6 gb
tempLimit: 1 gb

# Native TLS: every enabled connector (OpenWire 61616 and the AMQP/STOMP/MQTT ports) switches to
# its +ssl scheme on the same port, so none stays plain. Clients use ssl://host:61616 and trust
# ca.crt from the TLS Secret. ActiveMQ reads a keystore, so an init container on the openssl image
# builds a PKCS12. The web console (loopback 8161) is unchanged. The certificate comes from the
# first source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA +
# certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

# Heap: the image defaults to -Xms64m -XX:MaxRAMPercentage=75 of the memory limit.
extraEnv: []

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing (index $existing.data "password") -}}
{{- $pw = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ $pw | quote }}
  # read by activemq.xml's PropertyPlaceholderConfigurer (broker auth)
  credentials.properties: |
    activemq.username={{ .Values.auth.username }}
    activemq.password={{ $pw }}
  # read by the JAAS realm the web console logs in through
  users.properties: |
    {{ .Values.auth.username }}={{ $pw }}
  groups.properties: |
    admins={{ .Values.auth.username }}
{{- end }}

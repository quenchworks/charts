apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "quench-common.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "activemq.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: activemq
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: openwire
              containerPort: 61616
            {{- if .Values.connectors.amqp }}
            - name: amqp
              containerPort: 5672
            {{- end }}
            {{- if .Values.connectors.stomp }}
            - name: stomp
              containerPort: 61613
            {{- end }}
            {{- if .Values.connectors.mqtt }}
            - name: mqtt
              containerPort: 1883
            {{- end }}
          startupProbe:
            tcpSocket: { port: openwire }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: openwire }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: openwire }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          # only the files this chart owns are mounted; the rest of conf/ is upstream's
          volumeMounts:
            - name: config
              mountPath: /opt/activemq/conf/activemq.xml
              subPath: activemq.xml
              readOnly: true
            {{- if .Values.auth.enabled }}
            {{- range list "credentials.properties" "users.properties" "groups.properties" }}
            - name: auth
              mountPath: /opt/activemq/conf/{{ . }}
              subPath: {{ . }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quench-common.fullname" . }}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: {{ include "activemq.secretName" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

apiVersion: v2
name: opa-gatekeeper
description: "OPA Gatekeeper, the Kubernetes admission controller for Rego policies: ConstraintTemplates and Constraints, validating and mutating webhooks, audit of existing resources, and external data. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "3.23.1"
keywords:
  - gatekeeper
  - opa
  - policy
  - admission-controller
  - rego
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/open-policy-agent/gatekeeper
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-01 wave lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: opa-gatekeeper
      image: ghcr.io/quenchworks/images/opa-gatekeeper@sha256:76b66ab5560082b2d719b19cc6665de60d59491e0ed445769e27b429bbc78d8a
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: ConstraintTemplate
      version: v1
      name: constrainttemplates.templates.gatekeeper.sh
      displayName: ConstraintTemplate
      description: A Rego policy and the Constraint kind it defines.
    - kind: Config
      version: v1alpha1
      name: configs.config.gatekeeper.sh
      displayName: Config
      description: What Gatekeeper syncs into its cache and which namespaces it skips.
    - kind: Assign
      version: v1
      name: assign.mutations.gatekeeper.sh
      displayName: Assign
      description: A mutation that sets a field.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

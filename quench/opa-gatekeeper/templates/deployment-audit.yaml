apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-audit
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit
  template:
    {{- include "gatekeeper.pod" (dict "root" . "component" "audit") | nindent 4 }}

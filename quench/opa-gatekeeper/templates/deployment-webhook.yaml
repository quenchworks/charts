apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-webhook
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook
  template:
    {{- include "gatekeeper.pod" (dict "root" . "component" "webhook") | nindent 4 }}

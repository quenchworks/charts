# The manager fills in the CA bundles when it rotates its certificate.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "gatekeeper.vwh" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    gatekeeper.sh/system: "yes"
webhooks:
  - admissionReviewVersions:
    - v1
    - v1beta1
    clientConfig:
      service:
        name: {{ include "quench-common.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /v1/admit
    failurePolicy: {{ .Values.validatingWebhook.failurePolicy }}
    matchPolicy: Exact
    name: validation.gatekeeper.sh
    namespaceSelector:
      matchExpressions:
      - key: admission.gatekeeper.sh/ignore
        operator: DoesNotExist
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        {{- range (prepend .Values.exemptNamespaces .Release.Namespace) }}
        - {{ . }}
        {{- end }}
    rules:
    - apiGroups:
      - '*'
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - '*'
      - pods/ephemeralcontainers
      - pods/exec
      - pods/log
      - pods/eviction
      - pods/portforward
      - pods/proxy
      - pods/attach
      - pods/binding
      - pods/resize
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
      - replicationcontrollers/scale
      - services/proxy
      - nodes/proxy
      - services/status
    sideEffects: None
    timeoutSeconds: {{ .Values.validatingWebhook.timeoutSeconds }}
  - admissionReviewVersions:
    - v1
    - v1beta1
    clientConfig:
      service:
        name: {{ include "quench-common.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /v1/admitlabel
    failurePolicy: Fail
    matchPolicy: Exact
    name: check-ignore-label.gatekeeper.sh
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        {{- range (prepend .Values.exemptNamespaces .Release.Namespace) }}
        - {{ . }}
        {{- end }}
    rules:
    - apiGroups:
      - ''
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
    sideEffects: None
    timeoutSeconds: 3
{{- if .Values.mutatingWebhook.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "gatekeeper.mwh" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    gatekeeper.sh/system: "yes"
webhooks:
  - admissionReviewVersions:
    - v1
    - v1beta1
    clientConfig:
      service:
        name: {{ include "quench-common.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /v1/mutate
    failurePolicy: {{ .Values.mutatingWebhook.failurePolicy }}
    matchPolicy: Exact
    name: mutation.gatekeeper.sh
    namespaceSelector:
      matchExpressions:
      - key: admission.gatekeeper.sh/ignore
        operator: DoesNotExist
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        {{- range (prepend .Values.exemptNamespaces .Release.Namespace) }}
        - {{ . }}
        {{- end }}
    rules:
    - apiGroups:
      - '*'
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - '*'
    sideEffects: None
    timeoutSeconds: {{ .Values.mutatingWebhook.timeoutSeconds }}
{{- end }}

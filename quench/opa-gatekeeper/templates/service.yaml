apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-webhook
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  ports:
    - name: https-webhook-server
      port: 443
      targetPort: webhook-server
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook

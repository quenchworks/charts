# The manager writes its webhook certificate here and rotates it; the name is fixed in
# Gatekeeper. Helm keeps the Secret's data across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: gatekeeper-webhook-server-cert
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep

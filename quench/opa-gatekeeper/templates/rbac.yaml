# The manager's permissions, as upstream grants them: read everything (to audit and sync),
# manage its own CRDs and kinds, and patch its two webhook configurations' CA bundles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - '*'
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - admissionregistration.k8s.io
    resourceNames:
    - {{ include "gatekeeper.mwh" . }}
    resources:
    - mutatingwebhookconfigurations
    verbs:
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - admissionregistration.k8s.io
    resources:
    - validatingadmissionpolicies
    - validatingadmissionpolicybindings
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - admissionregistration.k8s.io
    resources:
    - validatingwebhookconfigurations
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apiextensions.k8s.io
    resources:
    - customresourcedefinitions
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - config.gatekeeper.sh
    resources:
    - '*'
    - configs
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - config.gatekeeper.sh
    resources:
    - configs/status
    verbs:
    - get
    - patch
    - update
  - apiGroups:
    - connection.gatekeeper.sh
    - constraints.gatekeeper.sh
    - expansion.gatekeeper.sh
    - mutations.gatekeeper.sh
    - status.gatekeeper.sh
    resources:
    - '*'
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - externaldata.gatekeeper.sh
    resources:
    - providers
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - externaldata.gatekeeper.sh
    resources:
    - providers/status
    verbs:
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - templates.gatekeeper.sh
    resources:
    - constrainttemplates
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - templates.gatekeeper.sh
    resources:
    - constrainttemplates/finalizers
    verbs:
    - update
  - apiGroups:
    - templates.gatekeeper.sh
    resources:
    - constrainttemplates/status
    verbs:
    - get
    - patch
    - update
  - apiGroups:
    - admissionregistration.k8s.io
    resourceNames:
    - {{ include "gatekeeper.vwh" . }}
    resources:
    - validatingwebhookconfigurations
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "quench-common.fullname" . }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "quench-common.serviceAccountName" . }}, namespace: {{ .Release.Namespace }} }
---
# the webhook certificate Secret it rotates, in its own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "quench-common.fullname" . }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "quench-common.serviceAccountName" . }}, namespace: {{ .Release.Namespace }} }

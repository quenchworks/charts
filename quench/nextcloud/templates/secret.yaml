{{/*
The managed Secret carries two credentials:
  * admin-password — the Nextcloud admin account created by `occ maintenance:install`.
    ALWAYS rendered (it is Nextcloud's own credential, independent of the DB).
  * db-password    — the DB password Nextcloud connects with. Rendered unless an EXTERNAL
    database supplies it through externalDatabase.existingSecret.

Both are injected into the install initContainer via secretKeyRef so they never appear in
the pod's argv / process list.

When the bundled MariaDB is enabled the DB password must be IDENTICAL to the one the
MariaDB subchart provisions for its application user. To keep them in sync it is resolved
in this order: explicit mariadb.auth.password -> the subchart's already-rendered Secret
(<release>-mariadb / mariadb-password) via lookup -> this Secret's prior value -> a fresh
24-char random. Set mariadb.auth.password for a deterministic install. Each credential is
generated once and preserved across upgrades via a lookup of this Secret's prior value.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- admin password ---- */}}
{{- $adminpw := .Values.nextcloud.admin.password -}}
{{- if and (not $adminpw) $existing -}}{{- $adminpw = index $existing.data "admin-password" | default "" | b64dec -}}{{- end -}}
{{- if not $adminpw -}}{{- $adminpw = randAlphaNum 24 -}}{{- end -}}

{{/* ---- DB password ---- */}}
{{- $manageDb := include "nextcloud.manageDbSecret" . -}}
{{- $dbpw := "" -}}
{{- if $manageDb -}}
{{- if .Values.mariadb.enabled -}}
{{- $dbpw = .Values.mariadb.auth.password -}}
{{- if not $dbpw -}}
{{- $mdbSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mariadb" .Release.Name) -}}
{{- if $mdbSecret -}}{{- $dbpw = index $mdbSecret.data "mariadb-password" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- else -}}
{{- $dbpw = .Values.externalDatabase.password -}}
{{- end -}}
{{- if and (not $dbpw) $existing -}}{{- $dbpw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $adminpw | b64enc | quote }}
  {{- if $manageDb }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}

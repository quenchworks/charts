{{/*
The managed Secret carries two credentials:
  * admin-password — the Nextcloud admin account created by `occ maintenance:install`.
    ALWAYS rendered (it is Nextcloud's own credential, independent of the DB).
  * db-password    - the DB password Nextcloud connects with, for an external database
    without an existingSecret only.

Both are injected into the install initContainer via secretKeyRef so they never appear in
the pod's argv / process list.

With the bundled MariaDB the pod reads the DB password from the MariaDB subchart's own
Secret, so it is not copied here. Each credential is
generated once and preserved across upgrades via a lookup of this Secret's prior value.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- admin password ---- */}}
{{- $adminpw := .Values.nextcloud.admin.password -}}
{{- if and (not $adminpw) $existing -}}{{- $adminpw = index $existing.data "admin-password" | default "" | b64dec -}}{{- end -}}
{{- if not $adminpw -}}{{- $adminpw = randAlphaNum 24 -}}{{- end -}}

{{/* ---- DB password ---- */}}
{{- $manageDb := include "nextcloud.manageDbSecret" . -}}
{{- $dbpw := "" -}}
{{- if $manageDb -}}
{{- $dbpw = .Values.externalDatabase.password -}}
{{- if and (not $dbpw) $existing -}}{{- $dbpw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $adminpw | b64enc | quote }}
  {{- if $manageDb }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}

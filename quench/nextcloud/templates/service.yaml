apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Nextcloud web UI + WebDAV/sync + CalDAV/CardDAV (single HTTP port; image nginx :8080).
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
      protocol: TCP
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

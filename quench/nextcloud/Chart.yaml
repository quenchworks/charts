apiVersion: v2
name: nextcloud
description: Hardened Nextcloud (self-hosted content collaboration / file-sync platform) on a 0-CVE nonroot php-fpm + nginx image, with a bundled MariaDB backend.
type: application
version: 0.0.12
appVersion: "34.0.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nextcloud/server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - nextcloud
  - files
  - file-sync
  - collaboration
  - storage
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned nextcloud to the 34.0.3 image rebuilt against current Wolfi, clearing the accumulated fixable CVEs (nightly scan remediation, 2026-08-26)."
  # Nextcloud is a self-hosted content-collaboration / file-sync web application. The
  # ArtifactHub category enum (ai-machine-learning, database, integration-delivery,
  # monitoring-logging, networking, security, skip-prediction, storage, streaming-messaging)
  # has no collaboration/web-app bucket. "skip-prediction" is AH's explicit "no category
  # fits" value — the honest choice here (mirrors quench/ghost, the nearest web-app analog).
  category: skip-prediction
  # Nextcloud Server is GNU AGPL v3 (strong copyleft; network use counts as distribution).
  licenses: AGPL-3.0-only
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/nextcloud/server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: nextcloud
      image: ghcr.io/quenchworks/images/nextcloud@sha256:a113d014a8243b0cc5a1e5423f999e8d54703e0679953c8a9ade8ce5018aa2f0
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:7f506d403668a0eb1504c924d3f862667a9c63fc80213ee2bb3926ce0b347483
dependencies:

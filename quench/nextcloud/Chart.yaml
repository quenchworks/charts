apiVersion: v2
name: nextcloud
description: Hardened Nextcloud (self-hosted content collaboration / file-sync platform) on a 0-CVE nonroot php-fpm + nginx image, with a bundled MariaDB backend.
type: application
version: 0.0.3
appVersion: "34.0.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nextcloud/server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - nextcloud
  - files
  - file-sync
  - collaboration
  - storage
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Maintenance re-release: re-validated against the chart's current pinned, cosign-signed 0-CVE images."
  # Nextcloud is a self-hosted content-collaboration / file-sync web application. The
  # ArtifactHub category enum (ai-machine-learning, database, integration-delivery,
  # monitoring-logging, networking, security, skip-prediction, storage, streaming-messaging)
  # has no collaboration/web-app bucket. "skip-prediction" is AH's explicit "no category
  # fits" value — the honest choice here (mirrors quench/ghost, the nearest web-app analog).
  category: skip-prediction
  # Nextcloud Server is GNU AGPL v3 (strong copyleft; network use counts as distribution).
  licenses: AGPL-3.0-only
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/nextcloud/server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: nextcloud
      image: ghcr.io/quenchworks/images/nextcloud@sha256:8cadef12db1e637f8108f918f0ef9e48c40fa243dfd5cda72d5c7a808ec82f4c
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:abf1c0823dcc7f2c1b77252defaa0202a386907d131e3ea62feb0bb07304a0f5
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

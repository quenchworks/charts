apiVersion: v2
name: nextcloud
description: Hardened Nextcloud (self-hosted content collaboration / file-sync platform) on a 0-CVE nonroot php-fpm + nginx image, with a bundled MariaDB backend.
type: application
version: 0.0.19
appVersion: "34.0.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nextcloud/server
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - nextcloud
  - files
  - file-sync
  - collaboration
  - storage
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "A default install without passwords no longer fails to log in to the bundled MariaDB: Nextcloud reads the password from the MariaDB chart's Secret instead of generating its own."
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/nextcloud/server
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: nextcloud
      image: ghcr.io/quenchworks/images/nextcloud@sha256:4ae8a704633482427a6750efbd5993a43bf86a602e9ac797ae420462a13688b1
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:147848cf3b18956a3ba15b3db79fa81ab3bc6013048379cad06c476c0eb8eed5
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.19
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

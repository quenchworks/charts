apiVersion: v2
name: backup-stack
description: "Hardened Kubernetes backup: Velero with its AWS plugin, backing up to SeaweedFS over S3 in the same install, with generated keys, a bucket created at install and the backup location already configured. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "1.0.0"
keywords:
  - velero
  - backup
  - restore
  - seaweedfs
  - disaster-recovery
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware-tanzu/velero
  - https://github.com/vmware-tanzu/velero-plugin-for-aws
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-11 update batch"
  artifacthub.io/category: storage
  artifacthub.io/images: |
    - name: velero
      image: ghcr.io/quenchworks/images/velero@sha256:97ab1ab254f070c9a45436a0ee6f3732fa1734cd984609476d98ee6aa4b2e60f
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:a2297733f7d4bb68694df328145117282d782b14ebde508fd8fcbcd2d0e3ab87
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:3a79024b8c6a14c8ec5c0447d0d0e96c73faa616936d85c45fcdcf0fa7652434
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:d9e4ce58535799979cc9c1de85652f0b8c2da4053e17850c1f559f4a4473c728
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: velero
    version: 0.1.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: velero.enabled
  - name: seaweedfs
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

apiVersion: v2
name: backup-stack
description: "Hardened Kubernetes backup: Velero with its AWS plugin, backing up to SeaweedFS over S3 in the same install, with generated keys, a bucket created at install and the backup location already configured. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.17
appVersion: "1.0.0"
keywords:
  - velero
  - backup
  - restore
  - seaweedfs
  - disaster-recovery
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware-tanzu/velero
  - https://github.com/vmware-tanzu/velero-plugin-for-aws
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: storage
  artifacthub.io/images: |
    - name: velero
      image: ghcr.io/quenchworks/images/velero@sha256:77322689488b722e1ce077d7d99b59321703a0d04295ab91b9859df60e61a762
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:5f2524186d74382f52d6e569ef99b1511399f5a60dc557430e04ee1139752076
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:4b14ba40c44b28fcaee5051ecefdbe01342001b958e0d66864bf943190fa0f4d
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:0f5c2677ac73aff8657c5f2947daf4cb82f0fc3ac82c78ec0c5067fc4ea60574
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

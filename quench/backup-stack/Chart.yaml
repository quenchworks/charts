      image: ghcr.io/quenchworks/images/velero@sha256:84d0f5b7e0b0d7043d1150a24f88c4dfb59a303b4fbe91cd1d5a9b0630bebdbe
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:1f5ad24c95e960be5868f4d2e47474748d753ed46fc357fe1a16a769f2266196
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:be19f91d040bd277669f764927e7ad2728a1f6b3cd241a08c1bb0af2048c54c0
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:283c1e9a365c3ab48f92713469e9cc9a61c1377b81b2908c69bae19c3843e105
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images

apiVersion: v2
name: backup-stack
description: "Hardened Kubernetes backup: Velero with its AWS plugin, backing up to SeaweedFS over S3 in the same install, with generated keys, a bucket created at install and the backup location already configured. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.23
appVersion: "1.0.0"
keywords:
  - velero
  - backup
  - restore
  - seaweedfs
  - disaster-recovery
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware-tanzu/velero
  - https://github.com/vmware-tanzu/velero-plugin-for-aws
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: storage
  artifacthub.io/images: |
    - name: velero
      image: ghcr.io/quenchworks/images/velero@sha256:0621d9086252d22d2c170fbe3fe109aa41b09657a284c3e343e0b66c4930c894
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:8690b5f26317304ca6671d0f96386634d1b1bd8e35a0c5f777b6842957fb2597
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:8d225b663b6429b66946e56dc1151c8fd3ca2d39c65673cafb15a159d31dc63d
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:a18f0c39bb2f4556140fb1130cbb652a0fbc890e171a0c07bb6fb4651d61ab67
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

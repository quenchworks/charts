    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: velero
    version: 0.1.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: velero.enabled
  - name: seaweedfs
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

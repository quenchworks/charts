apiVersion: v2
name: backup-stack
description: "Hardened Kubernetes backup: Velero with its AWS plugin, backing up to SeaweedFS over S3 in the same install, with generated keys, a bucket created at install and the backup location already configured. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.11
appVersion: "1.0.0"
keywords:
  - velero
  - backup
  - restore
  - seaweedfs
  - disaster-recovery
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware-tanzu/velero
  - https://github.com/vmware-tanzu/velero-plugin-for-aws
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: storage
  artifacthub.io/images: |
    - name: velero
      image: ghcr.io/quenchworks/images/velero@sha256:fd0edfdaf7a7fcda89bee5cfee2a839f04a496e7fe011d90b61457b77aecfccc
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:67aab725043792593f62b5e9d646eabcf77b93ee95cad91e680b9bc144959f12
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:95aadbede6557ec64cf9d897ef2120abbe11d1514ea290df8424b014b1600eaf
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:75fc6485a919121625263dd61bf49ed8ebb221265db54027f532f7fd19f78ab5
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: velero
    version: 0.1.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: velero.enabled
  - name: seaweedfs
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

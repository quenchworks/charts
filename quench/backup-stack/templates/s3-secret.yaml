{{- $existing := lookup "v1" "Secret" .Release.Namespace "backup-s3" -}}
{{- $ak := randAlphaNum 20 | upper -}}
{{- $sk := randAlphaNum 40 -}}
{{- if $existing }}
{{- $ak = index $existing.data "AWS_ACCESS_KEY_ID" | b64dec -}}
{{- $sk = index $existing.data "AWS_SECRET_ACCESS_KEY" | b64dec -}}
{{- end }}
# The S3 keys SeaweedFS accepts, and the same keys as the credentials file
# Velero's AWS plugin reads (key "cloud"). Generated once, kept across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ $ak | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $sk | b64enc | quote }}
  cloud: {{ printf "[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n" $ak $sk | b64enc | quote }}

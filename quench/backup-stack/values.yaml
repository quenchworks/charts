# backup-stack: Velero + SeaweedFS (S3) for cluster backups.
#
# Names are FIXED (backup-seaweedfs, and the velero Deployment, which Velero
# requires) because the backup location below reaches SeaweedFS by a plain
# address. One stack per namespace; create Backup and Restore resources in it.
#
#   S3  http://backup-seaweedfs:8333   keys in Secret backup-s3, bucket "velero"

velero:
  enabled: true
  fullnameOverride: backup-velero
  # The AWS plugin talks to any S3-compatible store; it is copied into the
  # plugins volume before Velero starts.
  initContainers:
    - name: velero-plugin-for-aws
      image: ghcr.io/quenchworks/images/velero-plugin-for-aws@sha256:5f2524186d74382f52d6e569ef99b1511399f5a60dc557430e04ee1139752076
      volumeMounts:
        - name: plugins
          mountPath: /target
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
  backupStorageLocation:
    create: true
    name: default
    default: true
    provider: aws
    bucket: velero
    config:
      region: us-east-1
      s3ForcePathStyle: "true"
      s3Url: http://backup-seaweedfs:8333
  credentials:
    existingSecret: backup-s3
    secretKey: cloud

seaweedfs:
  enabled: true
  fullnameOverride: backup-seaweedfs
  auth:
    enabled: true
    existingSecret: backup-s3
    existingSecretAccessKeyKey: AWS_ACCESS_KEY_ID
    existingSecretSecretKeyKey: AWS_SECRET_ACCESS_KEY
  persistence:
    size: 50Gi

# Creates the "velero" bucket with rclone (the backup location names it). Its
# image is pinned here because a parent chart cannot read a subchart's defaults.
bucketJob:
  enabled: true
  backoffLimit: 20
  image:
    repository: ghcr.io/quenchworks/images/rclone
    digest: "sha256:0f5c2677ac73aff8657c5f2947daf4cb82f0fc3ac82c78ec0c5067fc4ea60574"

# Pull secrets for the stack's own Job above. Each subchart takes its own
# (e.g. seaweedfs.imagePullSecrets).
imagePullSecrets: []

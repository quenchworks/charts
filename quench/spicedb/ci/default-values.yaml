# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# SpiceDB refuses to serve without a gRPC preshared key, so pin a fixed test key
# here to boot deterministically. This is a CI-only value; production deployments
# must rotate it (grpcPresharedKey.value) or source it from a managed Secret
# (grpcPresharedKey.existingSecret).
replicaCount: 1
datastore:
  engine: memory
grpcPresharedKey:
  value: "quenchworks-ci-preshared-key"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

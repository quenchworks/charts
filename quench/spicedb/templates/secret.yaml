{{- if not .Values.grpcPresharedKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  # gRPC preshared key. Generated on first install and preserved across upgrades;
  # rotate deliberately (set grpcPresharedKey.value) or manage it externally
  # (grpcPresharedKey.existingSecret). This key is the root credential to the API.
  preshared-key: {{ include "spicedb.presharedKey" . | b64enc | quote }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    {{- if .Values.httpGateway.enabled }}
    - name: gateway
      port: {{ .Values.service.gatewayPort }}
      targetPort: gateway
      protocol: TCP
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

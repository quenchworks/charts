apiVersion: v2
name: emissary
description: "Emissary-ingress, the CNCF Kubernetes API gateway built on Envoy: Listener, Host and Mapping resources for routing, TLS, auth and rate limiting. Ships its v3alpha1 CRDs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "4.1.0"
keywords:
  - emissary
  - emissary-ingress
  - ambassador
  - api-gateway
  - envoy
  - ingress
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/emissary-ingress/emissary
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "ArtifactHub verified-publisher metadata (repository id)"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: emissary
      image: ghcr.io/quenchworks/images/emissary@sha256:654dd0e237e8a6965784a3411e50ff46395221fb6be0fcfcf83731bb88ca3c2f
  artifacthub.io/crds: |
    - kind: Mapping
      version: v3alpha1

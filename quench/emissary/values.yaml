# The digest below is the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/emissary
  digest: "sha256:654dd0e237e8a6965784a3411e50ff46395221fb6be0fcfcf83731bb88ca3c2f"
  pullPolicy: IfNotPresent

nameOverride: ""

# Install the 14 getambassador.io CRDs (v3alpha1 only, like upstream's 4.x default) with the
# chart. They carry
# helm.sh/resource-policy: keep, so an uninstall leaves them (and every Mapping and Host).
# Set false when another release already owns them; only one release per cluster can.
crds:
  enabled: true

# Gateways share the CRDs; replicas only add capacity and availability.
replicaCount: 1

# Watch only the release namespace instead of the whole cluster.
singleNamespace: false
# Run several Emissary installs side by side: each one serves only the resources whose
# spec.ambassador_id lists this value.
ambassadorId: ""

# 8080/8443 are the container ports by convention; Listener resources decide what actually
# listens (the chart creates none, so the CRDs exist before the first Listener is applied).
service:
  type: LoadBalancer
  httpPort: 80
  httpsPort: 443
  annotations: {}

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
# Both images run as uid 8888 in group root, like upstream's (the group-writable dirs
# also let an arbitrary-UID platform run them).
podSecurityContext:
  runAsUser: 8888
  runAsGroup: 0
  fsGroup: 8888
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The gateway is an API-server client (it watches its CRDs, Services and Secrets), so it
  # needs a projected token; quench-common defaults this off.
  automountServiceAccountToken: true

# What the gateway reads and writes: its own CRDs, the Services, Endpoints and Secrets it
# routes to and terminates TLS with, Ingresses (it is also an Ingress controller), and status.
rbac:
  create: true
  clusterScoped: true
  clusterRules:
    - apiGroups: [apiextensions.k8s.io]
      resources: [customresourcedefinitions]
      verbs: [get, list, watch, delete]
    - apiGroups: [""]
      resources: [namespaces, services, secrets, configmaps, endpoints]
      verbs: [get, list, watch]
    - apiGroups: [getambassador.io, gateway.getambassador.io]
      resources: ["*"]
      verbs: [get, list, watch, update, patch, create, delete]
    - apiGroups: [getambassador.io]
      resources: [mappings/status]
      verbs: [update]
    - apiGroups: [networking.k8s.io]
      resources: [ingresses, ingressclasses]
      verbs: [get, list, watch]
    - apiGroups: [networking.k8s.io]
      resources: [ingresses/status]
      verbs: [update]
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get]

# A gateway takes traffic from anywhere; leave networkPolicy off unless you restrict it.
networkPolicy:
  enabled: false
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

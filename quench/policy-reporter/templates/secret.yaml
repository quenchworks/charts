# Policy Reporter's config file (targets, filters, ...). A Secret: target configs carry
# webhook URLs and credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}

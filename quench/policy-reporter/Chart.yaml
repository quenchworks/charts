apiVersion: v2
name: policy-reporter
description: "Policy Reporter, Kyverno's PolicyReport aggregator: reads PolicyReport results from Kyverno and other engines, serves them over a REST API and Prometheus metrics, and pushes new violations to Slack, Loki, Elasticsearch, webhooks and more. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."

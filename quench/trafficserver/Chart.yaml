apiVersion: v2
name: trafficserver
description: "Apache Traffic Server, a caching HTTP/1.1, HTTP/2 and TLS reverse proxy. Remap rules from values map hosts or paths to origins, and responses are cached on disk. Hardened by QuenchWorks as a minimal, shell-free, nonroot, CVE-gated image built from source, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "10.2.1"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
keywords:
  - trafficserver
  - ats
  - reverse-proxy
  - cache
  - cdn
  - http-proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/trafficserver
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "NetworkPolicy now admits the TLS port when tls.enabled (it allowed only the plaintext port, so enforcing clusters dropped TLS clients)"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: trafficserver
      image: ghcr.io/quenchworks/images/trafficserver@sha256:6bd562ec9ef5393e31c7d4a75e7ec786bf0d043a83e1621305b7bcaf43911a72
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml. The release workflow fetches the kind API server's
# /livez over HTTPS through the proxy, verifying mitmproxy's forged certificate against the
# CA it generated (the API server's own cert is signed by the cluster CA, hence ssl_insecure
# for the upstream hop), then logs in to the mitmweb UI.
replicaCount: 1
options:
  ssl_insecure: "true"

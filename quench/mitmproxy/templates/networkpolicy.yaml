{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range $i, $m := .Values.modes }}
        - port: {{ ternary "proxy" (printf "proxy-%d" $i) (eq $i 0) }}
          protocol: {{ ternary "UDP" "TCP" (or (hasPrefix "wireguard" $m) (hasPrefix "dns" $m)) }}
        {{- end }}
        {{- if .Values.ui.enabled }}
        - port: web
          protocol: TCP
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

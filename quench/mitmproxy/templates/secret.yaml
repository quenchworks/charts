{{- if and .Values.ui.enabled (not .Values.ui.existingSecret) }}
{{- $name := include "mitmproxy.webSecret" . }}
{{- $password := .Values.ui.password }}
{{- if not $password }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = index .data "password" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ default (randAlphaNum 24) $password | b64enc | quote }}
{{- end }}

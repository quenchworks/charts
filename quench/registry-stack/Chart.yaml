apiVersion: v2
name: registry-stack
description: "One self-hosted artifact registry in one install: Harbor (container images and OCI Helm charts, with Trivy scanning) + Terralist (a private Terraform/OpenTofu module and provider registry). Every image is QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.34
appVersion: "1.0.0"
keywords:
  - registry
  - harbor
  - terralist
  - oci
  - terraform
  - opentofu
  - stack
maintainers:

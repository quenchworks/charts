# registry-stack: Harbor + Terralist.
#
#   docker / helm / oras --(OCI)--> Harbor  <release>-harbor:80  (proxy front door)
#   terraform / tofu --(module + provider registry protocol)--> Terralist <release>-terralist:5758
#
# The two are independent services sharing one install. Each needs its public address:
# harbor.externalURL and terralist.url, the URLs clients use (tokens and download links
# are minted for them). Terralist also needs an OAuth provider for logins
# (terralist.oauth, see the terralist chart).

# Harbor (subchart). Values pass straight through to the harbor chart. Its own Ingress
# (harbor.ingress, Traefik class, on by default) is the front door; Terralist has
# terralist.ingress.
harbor: {}

# Terralist (subchart). Values pass straight through to the terralist chart.
terralist:
  enabled: true

# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest. Keeps the default config (OTLP receivers + debug exporter + health_check)
# so the gate is self-contained -- it forwards nowhere and needs no backend.
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
service:
  # the gate scrapes :8888 over a port-forward to the container, not the Service,
  # but expose it anyway to match the documented production posture.
  exposeMetrics: true

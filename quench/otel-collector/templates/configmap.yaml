apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/otelcol/config.yaml and passed as --config to the collector.
  # The image ships no default config, so this is the entire configuration. Edit
  # `config` in your values and `helm upgrade`; the pod checksum annotation rolls
  # the Deployment.
  {{- $cfg := deepCopy .Values.config }}
  {{- if include "quench-common.tls.enabled" . }}
  {{- /* tls.enabled: the OTLP receivers (gRPC and HTTP) serve TLS with the chart certificate */}}
  {{- $otlp := dig "receivers" "otlp" "protocols" dict $cfg }}
  {{- range $p := list "grpc" "http" }}
  {{- if hasKey $otlp $p }}
  {{- $_ := set (index $otlp $p | default dict) "tls" (dict "cert_file" "/tls/tls.crt" "key_file" "/tls/tls.key") }}
  {{- end }}
  {{- end }}
  {{- end }}
  config.yaml: |-
    {{- toYaml $cfg | nindent 4 }}

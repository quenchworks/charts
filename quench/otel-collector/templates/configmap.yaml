apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/otelcol/config.yaml and passed as --config to the collector.
  # The image ships no default config, so this is the entire configuration. Edit
  # `config` in your values and `helm upgrade`; the pod checksum annotation rolls
  # the Deployment.
  config.yaml: |-
    {{- toYaml .Values.config | nindent 4 }}

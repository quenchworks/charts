apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # OTLP ingest ports: send telemetry here.
    - port: {{ .Values.service.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: {{ .Values.service.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    {{- if .Values.service.exposeMetrics }}
    # the collector's own Prometheus metrics (scrape target).
    - port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
    {{- if .Values.service.exposeHealth }}
    - port: {{ .Values.service.ports.health }}
      targetPort: health
      protocol: TCP
      name: health
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

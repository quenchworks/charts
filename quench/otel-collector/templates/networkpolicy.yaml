{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The collector has no built-in auth: this policy is the trust boundary.
    # Ingest (4317/4318), the collector's own metrics (8888) and health (13133).
    - ports:
        - port: otlp-grpc
          protocol: TCP
        - port: otlp-http
          protocol: TCP
        - port: metrics
          protocol: TCP
        - port: health
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

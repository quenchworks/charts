# Install gate: the built-in HTTP proxy with a fixed password, plus a SOCKS5 service from
# extraServices to prove extra services and ports wire through.
proxy:
  auth:
    password: quench-ci-proxy-pass
extraServices:
  - name: socks
    addr: ":1080"
    handler: { type: socks5 }
    listener: { type: tcp }
extraPorts:
  - { name: socks, port: 1080, protocol: TCP }

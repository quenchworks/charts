{{- /* The whole gost.yaml lives here: it carries the proxy password. A generated password is
       read back on upgrade so clients keep working. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $oldData := ($old | default dict).data | default dict }}
{{- $pw := .Values.proxy.auth.password | default (get $oldData "password" | b64dec) | default (randAlphaNum 24) }}
{{- $services := list }}
{{- if .Values.proxy.enabled }}
{{- $listener := dict "type" "tcp" }}
{{- if include "quench-common.tls.enabled" . }}
{{- $listener = dict "type" "tls" "tls" (dict "certFile" "/tls/tls.crt" "keyFile" "/tls/tls.key") }}
{{- end }}
{{- $services = append $services (dict "name" "proxy" "addr" (printf ":%d" (int .Values.proxy.port)) "handler" (dict "type" .Values.proxy.type "auther" "proxy-auth") "listener" $listener) }}
{{- end }}
{{- $services = concat $services .Values.extraServices }}
{{- $cfg := dict "services" $services "metrics" (dict "addr" (printf ":%d" (int .Values.metrics.port)) "path" "/metrics") }}
{{- if .Values.proxy.enabled }}
{{- $_ := set $cfg "authers" (list (dict "name" "proxy-auth" "auths" (list (dict "username" .Values.proxy.auth.username "password" $pw)))) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  gost.yaml: {{ toYaml $cfg | b64enc | quote }}

apiVersion: v2
name: privatebin
description: "PrivateBin: a minimalist pastebin where the server has zero knowledge of the data; pastes are encrypted in the browser, with expiry, burn-after-reading and discussions. Hardened by QuenchWorks: nonroot php-fpm behind a from-source nginx, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "2.1.1"
keywords:
  - privatebin
  - pastebin
  - encryption
  - zero-knowledge
  - self-hosted

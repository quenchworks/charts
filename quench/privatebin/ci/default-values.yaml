# Install gate. No image override: the install uses the chart's real, CI-maintained digest.
# A config override proves the ConfigMap path: a custom page name and a 1 MiB size limit.
config: |
  [main]
  name = "Quench PrivateBin"
  sizelimit = 1048576
  [model]
  class = Filesystem
  [model_options]
  dir = "/srv/data"

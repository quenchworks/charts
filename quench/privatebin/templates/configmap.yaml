{{- /* Your conf.php (PrivateBin's INI-style config), mounted over the image's /srv/cfg/conf.php. Keep
       [model_options] dir = "/srv/data" so pastes stay on the volume. */}}
{{- with .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" $ }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
data:
  conf.php: |
    {{- . | nindent 4 }}
{{- end }}

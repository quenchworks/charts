{{- /* The relay password, generated once and read back on upgrade. Senders and receivers pass it
       as CROC_PASS (or --pass); without it the relay refuses them. */}}
{{- if not .Values.relay.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.relay.password | b64enc | default (get $old "password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}

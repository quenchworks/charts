{{/*
The managed Secret always carries WordPress's 8 authentication keys/salts (auth-key,
secure-auth-salt, …) and, for an external database without an existingSecret, the DB
password under db-password. All are injected into the pod as WORDPRESS_* env and read by
wp-config.php, so no secret ever appears in the pod's argv / process list.

Salts and the DB password are RESOLVED from the existing Secret first (via lookup) so they
stay STABLE across upgrades — regenerating salts would invalidate every session/cookie, and
regenerating the DB password would break the connection to an already-initialized database.

With the bundled MySQL enabled the pod reads the DB password from the MySQL subchart's
own Secret, so it is not copied here. Otherwise it is resolved as explicit
externalDatabase.password, then this Secret's prior value, then a fresh 24-char random.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* ---- auth keys/salts (always managed, stable across upgrades) ---- */}}
  {{- range $n := splitList " " (include "wordpress.saltNames" .) }}
  {{- $key := $n | lower | replace "_" "-" }}
  {{- $val := "" }}
  {{- if $existing }}{{- $val = index $existing.data $key | default "" | b64dec }}{{- end }}
  {{- if not $val }}{{- $val = randAlphaNum 64 }}{{- end }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- /* ---- DB password (external database without an existingSecret only) ---- */}}
  {{- if include "wordpress.manageDbPassword" . }}
  {{- $pw := .Values.externalDatabase.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  db-password: {{ $pw | b64enc | quote }}
  {{- end }}

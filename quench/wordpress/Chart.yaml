apiVersion: v2
name: wordpress
description: Hardened WordPress CMS (PHP-FPM + nginx) on a CVE-gated nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.38
appVersion: "7.1.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/WordPress/WordPress
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - wordpress
  - cms
  - blog
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/WordPress/WordPress
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: wordpress
      image: ghcr.io/quenchworks/images/wordpress@sha256:05277d3c73b433554be563cb9169df9048a09fa87cee57d04532e54df8bda976
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:4d248d668cbe8c00c6188b2bbb823168a9a3cd61d4f0d9a5c0ce32249cc5e6da
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

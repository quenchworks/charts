apiVersion: v2
name: wordpress
description: Hardened WordPress CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.25
appVersion: "7.1.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/WordPress/WordPress
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - wordpress
  - cms
  - blog
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:

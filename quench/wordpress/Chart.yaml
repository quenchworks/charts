apiVersion: v2
name: wordpress
description: Hardened WordPress CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.20
appVersion: "7.1.2"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/WordPress/WordPress
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - wordpress
  - cms
  - blog
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: mysql 0.0.16."
  # WordPress is a content-publishing web application; the ArtifactHub category enum
  # (ai-machine-learning, database, integration-delivery, monitoring-logging, networking,
  # security, skip-prediction, storage, streaming-messaging) has no CMS/web-app bucket.
  # "skip-prediction" is AH's explicit "no category fits" value — the honest choice for a
  # CMS (mirrors quench/ghost, the nearest CMS analog in this catalog).
  category: skip-prediction
  licenses: GPL-2.0-or-later
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/WordPress/WordPress
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: wordpress
      image: ghcr.io/quenchworks/images/wordpress@sha256:f7f58dbed3ed4bbe83332b2ecd13b7ef531bb7bfeed0d3fff0cc8c2e107d5b4e
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:e5659a7b362f25bd804a0c03c81e5cb2e02144153358bde008a8ef91c774a8c3
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.16
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

  artifacthub.io/images: |
    - name: wordpress
      image: ghcr.io/quenchworks/images/wordpress@sha256:549c2299ac7e383f6648f21dbe62000b3791680406c17bfe0b079ec2dd6fbe43
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:e5659a7b362f25bd804a0c03c81e5cb2e02144153358bde008a8ef91c774a8c3
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

apiVersion: v2
name: wordpress
description: Hardened WordPress CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.10
appVersion: "7.0.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/WordPress/WordPress
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - wordpress
  - cms
  - blog
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Updated wordpress to 7.0.4 and re-pinned the image to its new 0-CVE digest (multi-arch, cosign-signed, SBOM + SLSA attested)."
  # WordPress is a content-publishing web application; the ArtifactHub category enum
  # (ai-machine-learning, database, integration-delivery, monitoring-logging, networking,
  # security, skip-prediction, storage, streaming-messaging) has no CMS/web-app bucket.
  # "skip-prediction" is AH's explicit "no category fits" value — the honest choice for a
  # CMS (mirrors quench/ghost, the nearest CMS analog in this catalog).
  category: skip-prediction
  licenses: GPL-2.0-or-later
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/WordPress/WordPress
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: wordpress
      image: ghcr.io/quenchworks/images/wordpress@sha256:20f012c02336bf4883dcf181235730f21575d03c3208e8804975ad52408091c3
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:e345a54ed4d42b030515ec9e5b6bf359e3d303f4fbc7deea83800e28e5cc1cee
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

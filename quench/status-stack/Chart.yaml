apiVersion: v2
name: status-stack
description: "Gatus (status page and endpoint checks) with ntfy (push notifications) and Uptime Kuma (uptime monitors with a UI): Gatus alerts through ntfy and watches ntfy and Uptime Kuma from the first install. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.2
appVersion: "5.38.0"
keywords:
  - status-page
  - monitoring
  - uptime
  - alerting
  - gatus
  - ntfy
  - uptime-kuma
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/TwiN/gatus
  - https://github.com/binwiederhier/ntfy
  - https://github.com/louislam/uptime-kuma
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: gatus
      image: ghcr.io/quenchworks/images/gatus@sha256:3f403da7170d8b02f83aec15a336700f60c8e6337d33dbaa4dad41c99dd44586
    - name: ntfy
      image: ghcr.io/quenchworks/images/ntfy@sha256:644e255557bdcba601f61028d948140dab0c39f88b0616c38618b2529a046fda
    - name: uptime-kuma
      image: ghcr.io/quenchworks/images/uptime-kuma@sha256:76bb9db001b076cfa4a015150ade642dfb7bc05f2d49a810abe9897bbc203a87
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: gatus
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
  - name: ntfy
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
  - name: uptime-kuma
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: uptime-kuma.enabled

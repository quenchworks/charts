apiVersion: v2
name: kgateway
description: "kgateway, the CNCF Gateway API control plane that succeeded Gloo Edge. Watches Gateway, HTTPRoute, GRPCRoute and its own gateway.kgateway.dev policy CRDs, programs Envoy over xDS and provisions the proxy fleet into each Gateway's own namespace. Hardened by QuenchWorks as minimal, nonroot, 0-CVE images, cosign-signed and pinned by digest -- both the controller and the Envoy data plane. Ships only kgateway's own CRDs; the Gateway API CRDs are owned by the separate quench gateway-api-crds chart and must be installed first."
type: application
version: 0.0.2
appVersion: "2.4.3"
kubeVersion: ">=1.29.0-0"
keywords:
  - kgateway
  - gloo
  - envoy
  - gateway-api
  - ingress
  - api-gateway
  - control-plane
  - networking
  - proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kgateway-dev/kgateway
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: kgateway republished to a new 0-CVE digest."
  artifacthub.io/images: |
    - name: kgateway
      image: ghcr.io/quenchworks/images/kgateway@sha256:471d53e051c4a0302ce6ad7964d1e75400c5ffaf49f0b047a39afbfdfbcda4f5
    - name: kgateway-envoy
      image: ghcr.io/quenchworks/images/kgateway-envoy@sha256:86fbf44c30ca252e413468d1b7de420265208aaaa81aa74d44abe8f9e4054c72
  artifacthub.io/crds: |
    - kind: GatewayParameters
      version: v1alpha1
      name: gatewayparameters.gateway.kgateway.dev
      displayName: GatewayParameters
      description: Infrastructure for the Envoy fleet a GatewayClass or Gateway provisions -- images, resources, service type, autoscaling, security context, Istio integration.
    - kind: TrafficPolicy
      version: v1alpha1
      name: trafficpolicies.gateway.kgateway.dev
      displayName: TrafficPolicy
      description: Per-route or per-gateway request behaviour -- ext-auth, ext-proc, rate limiting, CORS, CSRF, retries, timeouts, header and body transformation, AI prompt handling.
    - kind: BackendConfigPolicy
      version: v1alpha1
      name: backendconfigpolicies.gateway.kgateway.dev
      displayName: BackendConfigPolicy
      description: Upstream connection behaviour for a Service or Backend -- TLS, HTTP/2, connection pools, circuit breaking, outlier detection, health checks, load balancing.
    - kind: Backend
      version: v1alpha1
      name: backends.gateway.kgateway.dev
      displayName: Backend
      description: A routing destination that is not a Kubernetes Service -- static hosts, AWS Lambda, S3, DynamoDB, an AI provider, or an MCP server -- usable as a route backendRef.
    - kind: HTTPListenerPolicy
      version: v1alpha1
      name: httplistenerpolicies.gateway.kgateway.dev
      displayName: HTTPListenerPolicy
      description: HTTP connection manager settings for a Gateway's listeners -- access logging, tracing, upgrades, header handling, buffer and stream limits.
    - kind: ListenerPolicy
      version: v1alpha1
      name: listenerpolicies.gateway.kgateway.dev
      displayName: ListenerPolicy
      description: Listener-level settings for a Gateway -- per-connection buffer limits, proxy protocol, TCP keep-alives.
    - kind: DirectResponse
      version: v1alpha1
      name: directresponses.gateway.kgateway.dev
      displayName: DirectResponse
      description: A fixed status and body returned by the proxy itself, referenced from an HTTPRoute filter, with no backend involved.
    - kind: GatewayExtension
      version: v1alpha1
      name: gatewayextensions.gateway.kgateway.dev
      displayName: GatewayExtension
      description: Declares an external gRPC service -- ext-auth, ext-proc or rate limit -- that TrafficPolicy rules can then reference.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
    - name: upstream
      url: https://github.com/kgateway-dev/kgateway
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

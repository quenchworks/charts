# The digest below is the contract with the image factory. CI rewrites it from
# manifests/victoriametrics.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/victoriametrics
  digest: "sha256:685f1c66ce38d03d5631c08ad46d5a7d58cbd4b4638da593726d6e5f1d8d0471"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single node for now. The clustered topology (vminsert / vmselect / vmstorage)
# is a tracked follow-up; this chart ships the self-contained single-node server.
replicaCount: 1

# VictoriaMetrics configuration. The image is flag-driven: the entrypoint pins
# -storageDataPath to VM_STORAGE (/storage, mounted as the PVC) and -httpListenAddr
# to VM_HTTP_LISTEN (:8428). Everything else passes through as container args.
config:
  # Retention for stored samples, rendered as -retentionPeriod=<value>.
  # Accepts VictoriaMetrics duration shorthand: 1 (month), 12, 1d, 1w, 1y, etc.
  retentionPeriod: "1"
  # Extra raw flags appended verbatim to the server, e.g. ["-dedup.minScrapeInterval=30s"].
  extraArgs: []

persistence:
  enabled: true
  size: 16Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 8428

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

{{- /*
GitLab's Rails secrets, the workhorse, gitlab-shell and gitaly shared tokens, and the rendered config/secrets.yml,
generated once and kept across upgrades: a value the live Secret already holds is reused, never regenerated
(db_key_base encrypts data at rest). secrets.yml is built from the same values, so the two never disagree.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}{{- $old = .data -}}{{- end -}}
{{- $v := dict -}}
{{- range $key, $len := dict "secret-key-base" 128 "otp-key-base" 128 "db-key-base" 128 "ar-primary-key" 32 "ar-deterministic-key" 32 "ar-key-derivation-salt" 32 "gitaly-token" 64 "shell-secret" 64 "root-password" 24 }}
{{- $_ := set $v $key (index $old $key | default (randAlphaNum $len | b64enc) | b64dec) }}
{{- end }}
{{- /* workhorse reads a base64-encoded 32-byte key */}}
{{- $_ := set $v "workhorse-secret" (index $old "workhorse-secret" | default (randAlphaNum 32 | b64enc | b64enc) | b64dec) }}
{{- /* gitlab-shell SSH host keys: kept, or every upgrade would change the server's SSH fingerprint */}}
{{- $_ := set $v "ssh-host-rsa-key" (index $old "ssh-host-rsa-key" | default (genPrivateKey "rsa" | b64enc) | b64dec) }}
{{- $_ := set $v "ssh-host-ed25519-key" (index $old "ssh-host-ed25519-key" | default (genPrivateKey "ed25519" | b64enc) | b64dec) }}
{{- $_ := set $v "openid-connect-signing-key" (index $old "openid-connect-signing-key" | default (genPrivateKey "rsa" | b64enc) | b64dec) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := $v }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  secrets.yml: {{ dict "production" (dict
      "secret_key_base" (get $v "secret-key-base")
      "otp_key_base" (get $v "otp-key-base")
      "db_key_base" (get $v "db-key-base")
      "openid_connect_signing_key" (get $v "openid-connect-signing-key")
      "active_record_encryption_primary_key" (list (get $v "ar-primary-key"))
      "active_record_encryption_deterministic_key" (list (get $v "ar-deterministic-key"))
      "active_record_encryption_key_derivation_salt" (get $v "ar-key-derivation-salt")) | toYaml | b64enc | quote }}
  {{- /* gitaly needs bin_dir, an existing exec runtime_dir and a [gitlab] url + secret to boot (gitaly 19); the
  token sits in the file, so the whole config lives here. */}}
  gitaly-config.toml: {{ printf `listen_addr = "0.0.0.0:%v"
bin_dir = "/usr/bin"
runtime_dir = "/home/git/run"

[[storage]]
name = "default"
path = "/home/git/repositories"

[auth]
token = %q

[gitlab]
url = "http://%s-webservice:%v"
secret_file = "/etc/gitlab/secrets/shell-secret"

[logging]
format = "json"
` .Values.gitaly.port (get $v "gitaly-token") $name .Values.workhorse.port | b64enc | quote }}
{{- end }}

# Values for the kind install gate: one replica of everything, small volumes, no resource requests, so a 2-CPU
# runner fits GitLab, its PostgreSQL and Valkey. The gate signs in as root over HTTP and pushes over SSH.
gitlab:
  host: gitlab.local
  port: 80
  https: false
webservice:
  replicaCount: 1
  livenessInitialDelaySeconds: 300
  puma:
    workers: 1
    maxThreads: 4
sidekiq:
  replicaCount: 1
gitaly:
  persistence:
    size: 2Gi
gitlabShell:
  replicaCount: 1

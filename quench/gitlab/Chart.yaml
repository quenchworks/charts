apiVersion: v2
name: gitlab
description: "GitLab CE: the Git forge, CI/CD and container registry front end, as webservice (Puma + Workhorse), Sidekiq, Gitaly and gitlab-shell on QuenchWorks images built from the MIT gitlab-foss source, with the bundled PostgreSQL and Valkey. Hardened by QuenchWorks: CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "19.6.1"
keywords:
  - gitlab
  - git
  - devops
  - ci-cd
  - code-review
  - self-hosted
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://gitlab.com/gitlab-org/gitlab-foss
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the postgresql subchart 0.0.38 -> 0.0.39."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: gitlab-rails
      image: ghcr.io/quenchworks/images/gitlab-rails@sha256:f34803c721225351cd6a27c48a9ceebe13dde3a49a0a635376db6fd9b3577ce7
    - name: gitlab-workhorse
      image: ghcr.io/quenchworks/images/gitlab-workhorse@sha256:7c7fd420b680ae9f1a948dddbe555b2e3d156349ebe7afd339299b7f1090c787
    - name: gitaly
      image: ghcr.io/quenchworks/images/gitaly@sha256:65f4b329b70b3d5541b7fb5e42a69a4b925230fa46755a38ec84a2707ea586f6
    - name: gitlab-shell
      image: ghcr.io/quenchworks/images/gitlab-shell@sha256:9557d31d6a698e5664f66e427cb06d50e5f1fb80e7b499b42354cc15869dd02a
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:66f9687d30e03a25298418dfbd8da5778df946cd40e38fe7a135a161327ca168
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.41
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

image:
  repository: ghcr.io/quenchworks/images/vault
  digest: "sha256:bdb973c03a641431e90a728234502217ec25682bdc5d6e47bf5f7156d3316d4b"
  pullPolicy: IfNotPresent

nameOverride: ""

# Replica count for the NON-HA (single node, `file` storage) mode. File storage is
# not an HA backend, so raising this without ha.enabled gives you N independent
# Vaults on N PVCs, not a cluster -- which is why ha.enabled owns its own count.
replicaCount: 1

# --- High availability (raft integrated storage) --------------------------------
# ha.enabled=true switches storage from `file` to Vault's own raft, forms a cluster
# over the headless service on the cluster port, and ignores server.config in favour
# of a generated raft configuration (add to it with server.extraConfig).
#
# What still has to be done BY HAND after install, exactly as with any real Vault:
# initialise ONE pod (`vault operator init`), unseal it, then unseal each remaining
# pod. Peers find the leader through retry_join, so they join on their own once
# unsealed -- there is no init container doing it for you, because a chart that
# auto-initialises Vault has to put the unseal keys somewhere, and every option is
# worse than you holding them.
#
# The headless Service sets publishNotReadyAddresses so raft peers can resolve each
# other DURING STARTUP. The readiness probe passes while sealed (it asks health for
# sealedcode=200&uninitcode=200), so a sealed pod is Ready -- but retry_join fires as
# soon as Vault starts, before the first probe has succeeded, and a NotReady pod has
# no DNS record. Without this the initial join attempts fail on name resolution.
ha:
  enabled: false
  # Raft wants an odd number so a quorum survives losing one node.
  replicas: 3
  # Extra HCL appended to the generated raft config -- a `seal` stanza for
  # auto-unseal, a second listener, telemetry, and so on.
  extraConfig: ""
  # Disruption budget for the cluster. minAvailable 2 of 3 keeps quorum during a
  # drain; podDisruptionBudget.enabled must also be true.
  #
  # NOTE: raft data lives on each pod's PVC. Scaling DOWN does not remove a peer
  # from the raft configuration -- run `vault operator raft remove-peer <node_id>`
  # BEFORE scaling in, or the cluster keeps counting a node that will never come
  # back and can lose quorum. This chart deliberately does not automate that: peer
  # removal needs a privileged token, and getting it wrong destroys quorum.

# --- Autoscaling (HorizontalPodAutoscaler) --------------------------------------
# OFF, and for most installs it should STAY off. Vault does not scale horizontally the
# way a stateless web app does, so this is only usable in ONE topology:
#
#   a SHARED, EXTERNAL storage backend -- consul, dynamodb, gcs, ... -- set through
#   server.config, where every node reaches the same data and any node can serve.
#
# The chart REFUSES the other two combinations at template time, because both look fine
# at deploy and fail later:
#
#   ha.enabled (raft)   A raft cluster's voter count must be fixed. An HPA scale-in does
#                       not run `vault operator raft remove-peer`, so raft keeps counting
#                       removed nodes as voters and the cluster LOSES QUORUM; a scale-out
#                       adds nodes that boot SEALED and serve nothing; and the size would
#                       have two owners that nothing reconciles -- the HPA's bounds and
#                       ha.replicas, which is what the retry_join list is built from.
#                       Size raft with ha.replicas instead.
#
#   `file` storage      Per-pod, not shared. Replicas would be separate, separately
#                       sealed, separately initialized Vaults behind one Service,
#                       answering 501/503 at random.
#
# Two things to know even in the supported case. A new node still boots SEALED and serves
# nothing until unsealed, so configure auto-unseal (a `seal` stanza in server.config)
# or autoscaling buys no capacity. And `replicaCount` is IGNORED while this is on: the
# StatefulSet omits `replicas` so the HPA owns the count (Kubernetes starts it at 1 and
# the HPA scales up to minReplicas).
autoscaling:
  enabled: false
  # StatefulSet, not Deployment: this chart's workload is a StatefulSet, and the
  # shared helper defaults to Deployment.
  targetKind: StatefulSet
  # Defaults to the release fullname, which is this chart's StatefulSet. Override only
  # to point the HPA at something else.
  targetName: ""
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # Set to also scale on memory; leave unset for CPU only.
  targetMemoryUtilizationPercentage: null
  # A full autoscaling/v2 `metrics` list (external / pods / object metrics). When set,
  # it REPLACES the CPU and memory targets above rather than adding to them.
  metrics: []
  # autoscaling/v2 scaling `behavior` -- stabilization windows and scale-up/down
  # policies. Worth setting a long scaleDown stabilizationWindowSeconds here.
  behavior: {}
  annotations: {}
  extraLabels: {}

# --- Server mode ---------------------------------------------------------------
# DEFAULT: a real (non-dev) single node with `file` storage on the PVC. It boots
# SEALED and UNINITIALIZED — that is EXPECTED. Run `vault operator init` then
# unseal before it serves secrets (see NOTES / README).
#
# DEV MODE (dev.enabled=true): an auto-unsealed, IN-MEMORY server with a fixed
# root token. For quick start / smoke tests ONLY — never for production: data is
# not persisted and the root token is readable from a Secret.
dev:
  enabled: false
  # Root token for dev mode. Empty => a random token is generated into a Secret.
  rootToken: ""

server:
  # The Vault HCL config, rendered into a ConfigMap and mounted at
  # /vault/config/vault.hcl. Replace it wholesale to switch storage backend
  # (e.g. raft/consul/postgres), add a `seal` block for auto-unseal, or enable a
  # TLS listener — no chart change needed.
  #
  # disable_mlock = true is deliberate and REQUIRED here: mlock() needs
  # CAP_IPC_LOCK, and this pod runs nonroot with all capabilities dropped. Run
  # Vault on swap-disabled nodes (the Kubernetes default) to keep the same
  # "master key never hits disk" guarantee.
  #
  # ui = true: the image now ships the browser console (built from upstream's own
  # Ember pipeline in the melange sandbox), so it is served on the API port. Set
  # false to serve the API only.
  config: |
    disable_mlock = true
    ui            = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

service:
  type: ClusterIP
  # HTTP API / CLI port.
  apiPort: 8200
  # Vault's cluster (server-to-server) port; used by the headless service. Idle
  # with the default `file` storage, which is not an HA backend.
  clusterPort: 8201

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
startupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

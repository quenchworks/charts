{{/*
Probes. The DEFAULT (real) server boots SEALED + UNINITIALIZED, and Vault's
/v1/sys/health returns 503 (sealed) / 501 (uninitialized) — gating readiness on a
plain 200 would leave the pod NotReady forever. Vault's health endpoint accepts query
params to remap those statuses, so we ask it to return 200 for standby/sealed/uninit:
the pod is "up and reachable" even before init/unseal, which is exactly when you need
to exec into it. In dev mode the node auto-unseals and the same endpoint returns 200
anyway. Liveness is a cheap tcpSocket on the API port.
*/}}
{{- $healthPath := "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" -}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" $healthPath "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
{{- $startup := dict "httpGet" (dict "path" $healthPath "port" "http") "initialDelaySeconds" 5 "periodSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "vault.headlessName" . }}
  {{/* HA owns its own count: `file` storage is not an HA backend, so raising
       replicaCount without ha.enabled would give N independent Vaults, not a cluster.

       Omitted entirely under autoscaling: if the manifest carried a replica count, every
       `helm upgrade` would reset the StatefulSet to it and the HPA would immediately
       scale back, so the two would fight forever. Leaving the field out hands ownership
       of the count to the HPA. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ if .Values.ha.enabled }}{{ .Values.ha.replicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: vault
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{/*
          The image is SHELL-FREE: entrypoint is /usr/bin/vault and these args replace
          its default Cmd. Non-dev points Vault at the ConfigMap-mounted HCL; dev mode
          takes no config file (-dev-no-store-token keeps the CLI token helper from
          writing to the read-only rootfs; the root token comes from
          VAULT_DEV_ROOT_TOKEN_ID below). .Values.args overrides both.
          */}}
          {{- if .Values.args }}
          {{- include "quench-common.args" . | nindent 10 }}
          {{- else if .Values.dev.enabled }}
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:{{ .Values.service.apiPort }}
            - -dev-no-store-token
          {{- else }}
          args:
            - server
            - -config=/vault/config/vault.hcl
          {{- end }}
          env:
            # There is no shell in the image, so `kubectl exec <pod> -- vault status`
            # relies on the container env for its address (and, in dev mode, its token).
            - name: VAULT_ADDR
              value: "http://127.0.0.1:{{ .Values.service.apiPort }}"
            # The CLI token helper writes $HOME/.vault-token; the rootfs is read-only.
            - name: HOME
              value: /tmp
            # Advertised addresses over the headless service — the basis for a future
            # multi-node HA topology (Vault reads both from the environment).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_API_ADDR
              value: "http://$(POD_NAME).{{ include "vault.headlessName" . }}:{{ .Values.service.apiPort }}"
            - name: VAULT_CLUSTER_ADDR
              value: "https://$(POD_NAME).{{ include "vault.headlessName" . }}:{{ .Values.service.clusterPort }}"
            {{- if .Values.ha.enabled }}
            {{/* Raft node identity. It MUST come from the environment, not the config:
                 the HCL lives in one ConfigMap shared by every pod, so a node_id written
                 there would hand all peers the same identity and raft would refuse to
                 form a cluster. The pod name is stable across restarts for a
                 StatefulSet, which is exactly what raft needs. */}}
            - name: VAULT_RAFT_NODE_ID
              value: "$(POD_NAME)"
            {{- end }}
            {{- if .Values.dev.enabled }}
            # DEV MODE: auto-unsealed, in-memory. NOT for production.
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault.devSecretName" . }}
                  key: dev-root-token
            # Same value as VAULT_TOKEN so a shell-free `kubectl exec <pod> -- vault kv
            # put ...` is already authenticated (kubectl exec cannot set env vars).
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault.devSecretName" . }}
                  key: dev-root-token
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.apiPort }}
            - name: cluster
              containerPort: {{ .Values.service.clusterPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # `file` storage backend state (PVC on a read-only rootfs).
            - name: data
              mountPath: /vault/data
            {{- if not .Values.dev.enabled }}
            # the ConfigMap-rendered vault.hcl.
            - name: config
              mountPath: /vault/config
              readOnly: true
            {{- end }}
            # writable scratch: HOME for the CLI token helper.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- if not .Values.dev.enabled }}
        - name: config
          configMap:
            name: {{ include "vault.configMapName" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

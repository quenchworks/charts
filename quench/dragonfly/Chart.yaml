apiVersion: v2
name: dragonfly
# LICENSE WARNING: Dragonfly is BSL-1.1 (Business Source License) — NOT OSI-approved
# open source; each release converts to Apache-2.0 only years later. Do NOT treat it
# as open source. CLEAN ALTERNATIVE: Valkey (BSD-3-Clause, already shipped) covers the
# same Redis-compatible cache slot with a true open-source license — prefer it.
description: "Multi-threaded, Redis- and Memcached-compatible in-memory datastore built to scale vertically on one node. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "1.39.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/dragonflydb/dragonfly
keywords:
  - dragonfly
  - redis
  - cache
  - key-value
  - in-memory
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "High-availability mode: architecture=replication with a Redis-protocol Sentinel quorum (valkey-sentinel) driving automatic failover of the Dragonfly primary. Topology 1 primary + 2 replicas + 3 Sentinels; a promoted replica keeps its role and a restarted old primary rejoins as a replica. Standalone remains the default. Validated on kind."
    - kind: added
      description: "architecture=replication without Sentinel: 1 primary + N read replicas via Dragonfly REPLICAOF (operator/manual failover)."
    - kind: changed
      description: "Refactored node config under primary.* / replica.* (mirrors the valkey/redis charts). No image change."
  artifacthub.io/license: BUSL-1.1
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: dragonfly
      image: ghcr.io/quenchworks/images/dragonfly@sha256:9950a9aae3bd7292ceac904508f7ce9002c0cd76e959711b8364ab23e9751c74
    - name: valkey-sentinel
      image: ghcr.io/quenchworks/images/valkey@sha256:f03ad3203cfaba0224cde68d152ed0839deca6db72aeef7111ad91c5b7a101a0
    - name: busybox
      image: ghcr.io/quenchworks/images/busybox@sha256:379b162cd4794ee14c63fec0cc501b855b804f33f824c4e46ced6183f644adfe
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

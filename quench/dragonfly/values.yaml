#
# The digest below is the contract with the image factory. CI rewrites it from
# manifests/dragonfly.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/dragonfly
  digest: "sha256:9950a9aae3bd7292ceac904508f7ce9002c0cd76e959711b8364ab23e9751c74"
  pullPolicy: IfNotPresent

nameOverride: ""

# Hardened busybox helper image, used ONLY by init containers in Sentinel HA mode
# (to seed Sentinel's writable config and run boot-time master discovery). This
# keeps the dragonfly image itself unchanged. Pinned by digest, never a tag.
busybox:
  repository: ghcr.io/quenchworks/images/busybox
  digest: "sha256:379b162cd4794ee14c63fec0cc501b855b804f33f824c4e46ced6183f644adfe"
  pullPolicy: IfNotPresent

# standalone: one server (default). replication: one primary plus N read replicas
# (Dragonfly REPLICAOF). Turn on sentinel below for automatic failover.
architecture: standalone

# HA / automatic failover via a Redis-protocol Sentinel quorum. Requires
# architecture: replication. Dragonfly ships NO sentinel binary of its own, so the
# Sentinels run `valkey-sentinel` from the QuenchWorks Valkey image (same RESP +
# Sentinel API; verified to drive Dragonfly failover on kind). 3 Sentinels monitor
# the Dragonfly primary and auto-promote a replica on primary loss (SLAVEOF NO ONE);
# clients discover the current master with
#   SENTINEL get-master-addr-by-name <masterSet>
# against the sentinel Service. Config seeding + boot-time master discovery run in
# busybox init containers writing into an emptyDir, so the dragonfly image is untouched.
sentinel:
  enabled: false
  replicaCount: 3
  masterSet: mymaster
  # Sentinels agreeing the primary is down before failover. Keep a strict
  # majority of replicaCount (2 of 3).
  quorum: 2
  port: 26379
  downAfterMilliseconds: 5000
  failoverTimeout: 180000
  parallelSyncs: 1
  # Sentinel binary source: the QuenchWorks Valkey image (ships valkey-sentinel).
  # Dragonfly has no sentinel of its own. Pinned by digest; bump manually when the
  # valkey image is re-released (CI only rewrites the dragonfly digest above).
  image:
    repository: ghcr.io/quenchworks/images/valkey
    digest: "sha256:8ee902be36ca7d49a25607ee77629433f225e89f905e15fdde67dd29a15686f2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Authentication. Off by default (matching the image) — open on the wire, so the
# NetworkPolicy is the security boundary. Enable to set --requirepass via a Secret.
# In replication mode the same password is used for --masterauth (replica -> primary).
auth:
  enabled: false
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "dragonfly-password"

# Dragonfly server tuning. IMPORTANT consistency rule, enforced by Dragonfly's
# pre-flight check: maxmemory MUST be >= threads * 256MiB or Dragonfly refuses to
# start. If you raise threads, raise maxmemory (and the pod memory limit) together.
# Defaults: 2 threads -> needs >= 512MiB; 512mb cap fits a ~1Gi limit.
config:
  threads: 2
  maxmemory: 512mb
  # io_uring is often restricted under nonroot/kind/seccomp; keep epoll on by
  # default. Set to false to let Dragonfly attempt io_uring.
  forceEpoll: true
# Extra dragonfly flags. Applied in replication mode (e.g. ["--cache_mode=true"]).
# NOTE: in standalone mode the image's env-based entrypoint does not forward extra
# container args, so extraFlags take effect only when architecture: replication.
extraFlags: []

primary:
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 6379

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

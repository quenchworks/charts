# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest from values.yaml, so the gate pulls the actual signed image.
# Keep threads/maxmemory self-consistent: maxmemory (512mb) >= threads(2) * 256MiB.
persistence:
  enabled: false
config:
  threads: 2
  maxmemory: 512mb
  forceEpoll: true
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 1Gi }

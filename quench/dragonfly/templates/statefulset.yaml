{{/*
Dragonfly is BSL-1.1 (NOT open source) — prefer Valkey (BSD), the clean alternative.
Primary (or, in standalone, the sole node) StatefulSet. Standalone keeps the base
name and the image's env-based entrypoint; replication runs the binary directly with
tuning flags (see dragonfly.serverContainer). The component:primary label is added to
the selector only in replication mode, so upgrades of a standalone release stay stable
(the StatefulSet selector is immutable).
*/}}
{{- $replication := eq .Values.architecture "replication" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dragonfly.primary.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  serviceName: {{ printf "%s-headless" (include "dragonfly.primary.fullname" .) }}
  replicas: {{ .Values.primary.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      {{- if $replication }}
      app.kubernetes.io/component: primary
      {{- end }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: primary
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dragonfly.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if and $replication (not .Values.affinity) }}
      affinity:
        {{- include "dragonfly.defaultAntiAffinity" (dict "root" . "component" "primary") | nindent 8 }}
      {{- end }}
      {{- if and $replication .Values.sentinel.enabled }}
      initContainers:
        {{- include "dragonfly.discoverInitContainer" (dict "root" . "isPrimary" true) | nindent 8 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      {{- end }}
      containers:
        {{- include "dragonfly.serverContainer" (dict "root" . "replicaof" "" "isPrimary" true "resources" .Values.primary.resources) | nindent 8 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- include "dragonfly.podVolumes" (dict "root" . "persistence" .Values.primary.persistence) | nindent 8 }}
  {{- if and .Values.primary.persistence.enabled (not .Values.primary.persistence.existingClaim) }}
  volumeClaimTemplates:
    {{- include "dragonfly.volumeClaimTemplate" (dict "root" . "persistence" .Values.primary.persistence) | nindent 4 }}
  {{- end }}

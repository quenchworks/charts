# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-kong, OCI URL oci://ghcr.io/quenchworks/charts/kong.
#
# NOTE: take this ID from `ah.py list` (the org repositories listing), NOT from
# `ah.py id <slug>`. The latter goes through AH's /repositories/search endpoint, which
# returned a DIFFERENT id for quench-kong than the org listing does -- a wrong id here
# would silently fail ownership verification.
repositoryID: c5498261-9776-458e-a178-c914f7756878   # kong (oci://ghcr.io/quenchworks/charts/kong)
owners:

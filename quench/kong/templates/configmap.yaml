{{- if not (include "kong.dbMode" .) }}
{{/*
Declarative configuration, DB-less mode only.

Kong EXITS at startup on a missing or invalid declarative file, which surfaces in
Kubernetes as a crashloop with the real reason buried in the container log. So the
default in values.yaml is an empty-but-valid document rather than no document.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kong.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  kong.yml: |
    {{- .Values.declarativeConfig | nindent 4 }}
{{- end }}

{{/*
HPA is genuinely safe for Kong, unlike the stateful apps in this catalog: in DB-less mode
every pod holds its own in-memory copy of the declarative config and shares nothing, so
adding or removing replicas cannot diverge or corrupt state. In database mode the pods are
still interchangeable readers of Postgres.

replicas is omitted from the Deployment whenever this is enabled, so the HPA owns the
count instead of being reset on every helm upgrade.
*/}}

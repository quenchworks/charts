# =============================================================================
# Kong Gateway OSS. Apache-2.0.
#
# The digest below is the contract with the image factory. It is NEVER a tag.
# =============================================================================
image:
  repository: ghcr.io/quenchworks/images/kong
  digest: "sha256:dcf9af271e724e8063894813a65bdae23559f04528f839a8b8b2affebf92fa6e"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# --- Database mode ------------------------------------------------------------
# DB-LESS (default): Kong loads its whole configuration from a declarative YAML
# document and holds it in memory. No Postgres, no migrations, no shared state --
# every pod is independent, which is why replicaCount can be raised freely and
# why the HPA below is actually safe here (unlike a stateful app).
#
# The trade-off: the Admin API becomes READ-ONLY. You cannot POST a service or
# route; you replace the whole config (`POST /config`, which is what the chart's
# release gate exercises) or you edit declarativeConfig and upgrade.
#
# DATABASE MODE (database: postgres): the classic control plane. Config lives in
# Postgres, the Admin API accepts writes, and `kong migrations` must run before
# the first boot and after upgrades -- this chart does NOT run migrations for
# you, because doing it automatically on every pod start races N replicas
# against one schema. Run it as a Job or manually, then set database: postgres.
database: "off"                 # "off" (DB-less) | "postgres"

# --- Hybrid mode (control plane / data plane) ---------------------------------
# role selects Kong's deployment topology:
#
#   traditional     (default) one deployment that both stores config and proxies.
#   control_plane   holds the config in Postgres, serves the Admin API, and pushes
#                   config to data planes over the cluster port. Does NOT proxy.
#   data_plane      proxies only. Pulls config from a control plane, keeps it in
#                   memory, and needs database "off".
#
# Hybrid mode requires mTLS between CP and DP: both sides present the SAME
# certificate pair (cluster.mtls "shared"), which you create yourself -- the chart
# will not mint cluster certs, because a gateway trust anchor generated by a Helm
# template is a trust anchor nobody audited.
#
#   kubectl create secret tls kong-cluster-cert --cert=tls.crt --key=tls.key
#
# Deploy CP and DP as two releases of this chart with different roles, exactly as
# you would with two release names.
role: traditional

cluster:
  # Cluster (config push) and telemetry listeners. Only used when role is
  # control_plane or data_plane.
  enabled: false
  port: 8005
  telemetryPort: 8006
  # mTLS mode. "shared" means CP and DP present the same cert pair; "pki" means a
  # real CA signs both sides. Only "shared" is wired here -- pki needs a CA bundle
  # and cluster_ca_cert, which you can supply through extraConfig.
  mtls: shared
  # Secret holding tls.crt and tls.key, mounted at /etc/secrets/<name>. REQUIRED
  # in hybrid mode; the chart fails to render without it rather than starting a
  # cluster with no mutual authentication.
  certSecret: ""
  # DATA PLANE ONLY: where to reach the control plane. Defaults are the Services
  # this chart creates for a CP release named <cpRelease>.
  controlPlaneHost: ""          # e.g. kong-cp-cluster.kong.svc.cluster.local
  telemetryHost: ""             # e.g. kong-cp-clustertelemetry.kong.svc.cluster.local
  # TLS server name the DP expects from the CP certificate.
  serverName: kong_clustering
  # Service type/annotations for the cluster + telemetry Services (CP side).
  service:
    type: ClusterIP
    annotations: {}

# --- Migrations ---------------------------------------------------------------
# Database mode needs `kong migrations` run before the first boot and after every
# upgrade. This is NOT done inside the pod start: N replicas racing one schema is
# how a control plane corrupts itself.
#
# Enabled here, migrations run as Helm hook Jobs -- bootstrap on install,
# `migrations up` pre-upgrade and `migrations finish` post-upgrade, which is the
# order Kong documents for zero-downtime upgrades.
migrations:
  enabled: false
  preUpgrade: true
  postUpgrade: true
  backoffLimit: 3
  annotations: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Declarative configuration, used only when database is "off". Rendered into a
# ConfigMap and pointed at by KONG_DECLARATIVE_CONFIG.
#
# The default is deliberately an EMPTY but VALID document: Kong boots, serves the
# Admin API and the status endpoint, and proxies nothing until you add services.
# An invalid or absent document makes Kong exit at startup, which in Kubernetes
# looks like a crashloop with no obvious cause.
declarativeConfig: |
  _format_version: "3.0"
  services: []

# Postgres connection, used only when database is "postgres". No subchart is
# bundled: pair this with quench/postgresql, or point it at a managed instance.
postgres:
  host: ""
  port: 5432
  database: kong
  user: kong
  # Prefer existingSecret over `password` -- a password in values ends up in the
  # release manifest and in `helm get values` output.
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  ssl: false
  # Verifying the server chain needs the CA in Kong's trust list. "system" alone
  # does NOT contain a private CA, and leaving it out turns verification into a
  # startup failure rather than a silent downgrade to unverified TLS -- so set
  # lua_ssl_trusted_certificate below whenever sslVerify is on.
  sslVerify: false
  # Comma-separated list for KONG_LUA_SSL_TRUSTED_CERTIFICATE, e.g.
  #   "system,/etc/kong/pg-ca/ca.crt"
  # Mount the CA with extraVolumes/extraVolumeMounts. Project ONLY ca.crt from a
  # CA secret -- mounting a whole CNPG-style `-ca` secret also exposes ca.key,
  # the authority's private key.
  luaSslTrustedCertificate: ""

# --- Ports --------------------------------------------------------------------
# All above 1024 so the nonroot (uid 1001) container binds them without any
# capability. These are also Kong's own documented defaults, so nothing here
# contradicts upstream docs.
service:
  type: ClusterIP
  proxyPort: 8000          # data plane, HTTP
  proxyTlsPort: 8443       # data plane, HTTPS
  adminPort: 8001          # Admin API -- NOT exposed publicly, see networkPolicy
  statusPort: 8100         # /status and /metrics, used by the probes
  annotations: {}
  # Expose the Admin API on the Service. Off by default: the Admin API is a
  # full control plane with no authentication of its own, so publishing it is a
  # privilege-escalation path. Turn it on only behind a NetworkPolicy you trust.
  exposeAdmin: false

# --- Kong configuration -------------------------------------------------------
# Every Kong setting is an env var (KONG_<UPPER_SNAKE>), so anything not modelled
# above can be set here without a chart change. These are merged after the
# chart's own values, so they win -- deliberately, so you are never blocked by
# a knob this chart did not think to add.
extraConfig: {}
  # trusted_ips: "0.0.0.0/0,::/0"
  # real_ip_header: X-Forwarded-For
  # log_level: notice
  # plugins: "bundled,my-custom-plugin"

# Log destinations. /dev/stdout and /dev/stderr keep logs in the container
# streams rather than files inside the read-only rootfs.
logs:
  proxyAccess: /dev/stdout
  proxyError: /dev/stderr
  adminAccess: /dev/stdout
  adminError: /dev/stderr

# --- Autoscaling --------------------------------------------------------------
# Genuinely safe in DB-less mode: every pod holds its own copy of the config and
# shares nothing, so adding or removing replicas cannot corrupt state. In
# database mode it is still safe for the data plane, but new pods depend on
# Postgres being reachable and migrated.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}
  annotations: {}
  extraLabels: {}

persistence:
  # Kong needs NO persistent volume: DB-less keeps config in memory and database
  # mode keeps it in Postgres. The prefix is an emptyDir because Kong regenerates
  # it (nginx.conf and lmdb state) on every start.
  enabled: false

# Kong is memory-hungry per WORKER: each nginx worker is a LuaJIT VM that loads every
# bundled plugin. With KONG_NGINX_WORKER_PROCESSES=auto, "auto" means one worker per CPU
# the node reports -- NOT per the CPU limit -- so on a 16-core node Kong starts 16 workers
# and gets OOMKilled (exit 137) under a 1Gi limit even though it started cleanly.
#
# So: pin the worker count rather than trusting "auto", and size memory for it. Raise both
# together -- more workers with the same limit just moves the OOM.
workerProcesses: 2

resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: 2, memory: 2Gi }

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

rbac:
  create: false
  rules: []

networkPolicy:
  enabled: true
  # Proxy ports are reachable from anywhere by default -- a gateway that only
  # accepts same-namespace traffic is not a gateway. The ADMIN port is the
  # opposite: it is restricted to the release namespace, because it is an
  # unauthenticated control plane.
  allowExternal: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the proxy port. Point it at adminPort only if you have secured
  # the Admin API yourself.
  servicePort: null
  hosts: []
  tls: []

# --- Shared quench-common knobs ----------------------------------------------
partOf: ""
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
selectorLabels: {}
imagePullSecrets: []
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
livenessProbe: {}
readinessProbe: {}
startupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

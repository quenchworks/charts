apiVersion: v2
name: kong
description: "Kong Gateway OSS -- API gateway and reverse proxy on a patched OpenResty, with routing, auth, rate limiting, and the bundled plugin set. DB-less by default (declarative config, no database), or Postgres-backed. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image built from source against current OpenSSL, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "3.9.3"
kubeVersion: ">=1.23.0-0"
keywords:
  - kong
  - api-gateway
  - gateway
  - proxy
  - openresty
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Kong/kong
maintainers:
  - name: mkabumattar
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Kong Gateway OSS 3.9.3 on a hardened, nonroot, 0-CVE image built from source (patched OpenResty, current OpenSSL, no vendored crypto), pinned by digest."
    - kind: added
      description: "DB-less mode by default (declarative config in a ConfigMap, no database) with optional Postgres-backed mode."
    - kind: added
      description: "Opt-in Ingress, opt-in HPA, PodDisruptionBudget, and a NetworkPolicy that leaves the proxy ports open but restricts the unauthenticated Admin API to the release namespace."
  artifacthub.io/category: networking
  artifacthub.io/images: |

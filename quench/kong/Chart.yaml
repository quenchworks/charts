apiVersion: v2
name: kong
description: "Kong Gateway OSS -- API gateway and reverse proxy on a patched OpenResty, with routing, auth, rate limiting, and the bundled plugin set. DB-less by default (declarative config, no database), or Postgres-backed. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image built from source against current OpenSSL, cosign-signed and pinned by digest."

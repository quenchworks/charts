# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/cloudnative-pg
  digest: "sha256:3c06368c19b1a6e2d0c3c24d90e95c4b45b2f811d0cf086d938adc1f52aa5592"
  pullPolicy: IfNotPresent

nameOverride: ""

# More than one replica is fine: the operator elects a leader.
replicaCount: 1
maxConcurrentReconciles: 10

# The default PostgreSQL image for Clusters that do not set spec.imageName: the
# QuenchWorks postgresql image. It runs as uid 1001, so Clusters set
#   spec.postgresUID: 1001
#   spec.postgresGID: 1001
# (CloudNativePG's default is 26, which this image has no user for).
postgresImage:
  repository: ghcr.io/quenchworks/images/postgresql
  tag: "18.6"
  digest: "sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f"

# Operator settings (the ConfigMap the operator reads at start), e.g.
#   INHERITED_LABELS: "team,environment"
#   WATCH_NAMESPACE: "db"
config: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

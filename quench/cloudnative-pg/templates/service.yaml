apiVersion: v1
kind: Service
metadata:
  # upstream's fixed name; the operator's webhook certificate is issued for it
  name: cnpg-webhook-service
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: webhook-server
      port: 443
      targetPort: webhook-server
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

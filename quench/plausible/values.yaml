# The public host Plausible is served on (BASE_URL is <publicScheme>://<domain>). Required.
domain: ""
publicScheme: https

# Digest is the contract with the image factory; CI rewrites it after each green image build.
image: { repository: ghcr.io/quenchworks/images/plausible, digest: "sha256:4786431be60f2fe769b38debe9a581e44cadb667217cf1c6345852764ed90e31" }

# DISABLE_REGISTRATION: "false" (anyone can register), "invite_only" or "true". Empty keeps upstream's default
# (registration open until the first user exists, then invite only).
disableRegistration: ""
# Extra Plausible settings (MAILER_EMAIL, SMTP_HOST_ADDR, GOOGLE_CLIENT_ID, ...), as name: value.
env: {}

# also the init containers' limit: the release loads the whole app for `eval`, and 1Gi OOM-killed createdb in kind
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 2Gi }

# SECRET_KEY_BASE (64 characters; the TOTP vault key derives from it): generated into the Secret <fullname> and
# kept on upgrade.
secret:
  existingSecret: ""   # key secret-key-base

# The bundled QuenchWorks PostgreSQL (accounts, sites, settings).
postgresql:
  enabled: true
  auth:
    username: plausible
    password: ""             # generated by the subchart if empty
    database: plausible_db   # must differ from the username: the image only creates a database with another name
  primary:
    persistence:
      enabled: true
      size: 8Gi

# The bundled QuenchWorks ClickHouse (events). Its password is generated into the subchart's own Secret.
clickhouse:
  enabled: true
  auth:
    username: default
  persistence:
    enabled: true
    size: 20Gi

# Your own databases instead (postgresql.enabled=false / clickhouse.enabled=false): full URLs in a Secret.
externalDatabase:
  existingSecret: ""        # keys database-url (postgres://...) and clickhouse-database-url (http://...)

ingress:
  enabled: false
  className: ""
  annotations: {}
  # e.g. [{hosts: [plausible.example.com], secretName: plausible-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # Creates both databases if missing, then runs the PostgreSQL and ClickHouse migrations (a no-op when
        # current). Fails until both stores answer; the kubelet re-runs it with backoff.
        {{- range $fn := list "createdb" "interweave_migrate" }}
        - name: {{ $fn | replace "_" "-" }}
          image: {{ printf "%s@%s" $.Values.image.repository $.Values.image.digest }}
          imagePullPolicy: IfNotPresent
          command: ["/opt/plausible/bin/plausible", "eval", "Plausible.Release.{{ $fn }}"]
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          env:
            {{- include "plausible.env" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        {{- end }}
      containers:
        - name: plausible
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "plausible.env" . | nindent 12 }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000, protocol: TCP }
          readinessProbe:
            httpGet: { path: /api/system/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/system/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /var/lib/plausible }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8000, targetPort: http, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

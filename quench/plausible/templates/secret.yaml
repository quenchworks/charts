{{- /* SECRET_KEY_BASE, generated once and read back on upgrade: sessions and the TOTP vault key derive from it. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key-base: {{ get $old "secret-key-base" | b64dec | default (randAlphaNum 64) | b64enc | quote }}
{{- end }}

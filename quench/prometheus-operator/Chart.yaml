apiVersion: v2
name: prometheus-operator
description: "Prometheus Operator: run Prometheus, Alertmanager and their scrape configuration from Kubernetes custom resources (Prometheus, ServiceMonitor, PodMonitor, PrometheusRule, ...). The ten CRDs ship with the chart and the config-reloader sidecar defaults to the QuenchWorks image. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.95.2"
kubeVersion: ">=1.26.0-0"
keywords:
  - prometheus
  - prometheus-operator
  - servicemonitor
  - monitoring
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus-operator/prometheus-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: prometheus-operator
      image: ghcr.io/quenchworks/images/prometheus-operator@sha256:b950e5a438c81b578be5ca03013fb8f293101a71aaccfcae413c6155a55e4d51
    - name: prometheus-config-reloader
      image: ghcr.io/quenchworks/images/prometheus-config-reloader@sha256:315429e2e5184ae007027a68525b0141c868c2d36ec46e89c7d4603ddaab4bc1
  artifacthub.io/crds: |
    - kind: Prometheus
      version: v1
      name: prometheuses.monitoring.coreos.com
      displayName: Prometheus
      description: A Prometheus server run as a StatefulSet.
    - kind: PrometheusAgent
      version: v1alpha1
      name: prometheusagents.monitoring.coreos.com
      displayName: Prometheus Agent
      description: Prometheus in agent mode, scraping and remote-writing only.
    - kind: Alertmanager
      version: v1
      name: alertmanagers.monitoring.coreos.com
      displayName: Alertmanager
      description: An Alertmanager cluster run as a StatefulSet.
    - kind: AlertmanagerConfig
      version: v1alpha1
      name: alertmanagerconfigs.monitoring.coreos.com
      displayName: Alertmanager Config
      description: Namespaced Alertmanager routes and receivers.
    - kind: ServiceMonitor
      version: v1
      name: servicemonitors.monitoring.coreos.com
      displayName: Service Monitor
      description: Scrape targets selected through a Service.
    - kind: PodMonitor
      version: v1
      name: podmonitors.monitoring.coreos.com
      displayName: Pod Monitor
      description: Scrape targets selected directly from pods.
    - kind: Probe
      version: v1
      name: probes.monitoring.coreos.com
      displayName: Probe
      description: Blackbox probes of static targets or ingresses.
    - kind: ScrapeConfig
      version: v1alpha1
      name: scrapeconfigs.monitoring.coreos.com
      displayName: Scrape Config
      description: Raw scrape configuration, including service discovery outside Kubernetes.
    - kind: PrometheusRule
      version: v1
      name: prometheusrules.monitoring.coreos.com
      displayName: Prometheus Rule
      description: Recording and alerting rules.
    - kind: ThanosRuler
      version: v1
      name: thanosrulers.monitoring.coreos.com
      displayName: Thanos Ruler
      description: Thanos rule evaluation against a query endpoint.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

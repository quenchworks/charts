# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
replicaCount: 1
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }
# a custom config.yml, so the gate proves the ConfigMap mount replaces the image default
config: |
  title: "Quench Gate"
  services:
    - name: Links
      items:
        - name: QuenchWorks
          url: https://quench-works.com

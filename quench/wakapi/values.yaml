# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/wakapi
  digest: "sha256:1641e8d0f98c8ef2616a1f38d3c5cbbbd3b35c64231afd2f269f1cf86205e94c"
  pullPolicy: IfNotPresent

nameOverride: ""

# Wakapi keeps its SQLite database in /data: run one replica (Recreate with the volume).
replicaCount: 1
updateStrategy:
  type: Recreate

# WAKAPI_PUBLIC_URL: the address people open (links in mails, the client setup snippet). An https
# URL also turns on secure cookies.
publicUrl: http://localhost:3000

# The admin, signed up by a setup Job while the instance has no users (Wakapi makes the first
# account the admin). Empty password: generated into the Secret <fullname> (password).
admin:
  create: true
  username: admin
  email: admin@example.com
  password: ""
  existingSecret: ""   # a Secret with key "password" instead
  setupImage: ghcr.io/quenchworks/images/busybox@sha256:041302c8da3a2e182ecc2eac3c56c4f47a13c03cc284d255489c0be741893b64

# More Wakapi settings as WAKAPI_* environment variables
# (https://github.com/muety/wakapi#-configuration), e.g. WAKAPI_ALLOW_SIGNUP: "false" after setup,
# or WAKAPI_DB_TYPE/WAKAPI_DB_HOST/... for PostgreSQL or MySQL (password through extraEnvVars).
settings: {}

# The data volume: the SQLite database.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

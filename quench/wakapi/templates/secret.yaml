{{- /* Generated once and read back on upgrade: the admin's password (the setup Job signs the
       admin up with it) and the password salt (changing it invalidates every stored password). */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.admin.existingSecret }}
  password: {{ .Values.admin.password | b64enc | default (get $old "password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  password-salt: {{ get $old "password-salt" | default (randAlphaNum 32 | b64enc) | quote }}

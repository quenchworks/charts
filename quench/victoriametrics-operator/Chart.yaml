apiVersion: v2
name: victoriametrics-operator
description: "VictoriaMetrics Operator: run VMSingle, VMCluster, VMAgent, VMAlert, VMAuth, Alertmanager and VictoriaLogs from Kubernetes custom resources, and scrape targets described by VMServiceScrape or by Prometheus Operator ServiceMonitor objects. The 26 CRDs ship with the chart; the config-reloader sidecar and VMSingle default to QuenchWorks images. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.75.2"
kubeVersion: ">=1.26.0-0"
keywords:
  - victoriametrics
  - victoriametrics-operator
  - monitoring
  - prometheus
  - operator

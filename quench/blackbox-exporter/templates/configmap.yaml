{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blackbox-exporter.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /config/blackbox.yml and passed via --config.file.
  blackbox.yml: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}

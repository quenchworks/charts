{{- include "quench-common.tls.resources" . }}
{{- if include "quench-common.tls.enabled" . }}
---
# exporter-toolkit web config: HTTPS with the mounted certificate (re-read on each
# handshake, so a renewed certificate needs no restart)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-tls-web
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  web.yml: |-
    tls_server_config:
      cert_file: /tls/tls.crt
      key_file: /tls/tls.key
{{- end }}

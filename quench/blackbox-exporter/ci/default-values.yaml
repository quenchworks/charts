# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# No config override either -- the gate deliberately exercises the chart's
# out-of-the-box path, where the image's built-in http_2xx module is what answers.
replicaCount: 1
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }

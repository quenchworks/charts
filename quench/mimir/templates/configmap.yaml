apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mimir.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/mimir/mimir.yaml (the chart's -config.file arg). mimirConfig
  # is templated so values like service ports flow in; edit it and `helm upgrade`
  # (the pod checksum annotation rolls the StatefulSet).
  mimir.yaml: |-
    {{- tpl .Values.mimirConfig . | nindent 4 }}

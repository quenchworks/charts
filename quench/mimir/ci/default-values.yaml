# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves the PVC binds and Mimir writes its TSDB +
# filesystem object store to it. Resources trimmed for the single kind node.
persistence:
  enabled: true
  size: 2Gi
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

{{/*
GRIST_SESSION_SECRET, generated once and kept across upgrades through a lookup.
Rendered only when sessionSecret.existingSecret is not set.
*/}}
{{- if not .Values.sessionSecret.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing (hasKey $existing.data "session-secret") -}}
{{- $secret = index $existing.data "session-secret" | b64dec -}}
{{- end -}}
{{- if not $secret -}}
{{- $secret = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ $secret | b64enc | quote }}
{{- end }}

# Standalone install gate. No image override: the install uses the chart's pinned
# digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves the PVC binds and survives a pod restart.
# The boot key lets the gate drive the REST API as the install admin (adminEmail);
# it is a CI-only value.
persistence:
  enabled: true
  size: 1Gi
adminEmail: admin@example.com
extraEnvVars:
  - name: GRIST_BOOT_KEY
    value: quench-ci-boot-key-0123456789

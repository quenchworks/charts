apiVersion: v2
name: mariadb-operator
description: "MariaDB Operator: run MariaDB and Galera clusters on Kubernetes from CRDs (MariaDB, Database, User, Grant, Backup, Restore). The CRDs ship with the chart; the operator's MariaDB pods default to the QuenchWorks mariadb image. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.12
appVersion: "26.10.2"
kubeVersion: ">=1.26.0-0"
keywords:
  - mariadb
  - mysql
  - galera
  - operator
  - database
maintainers:

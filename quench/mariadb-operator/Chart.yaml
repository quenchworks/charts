apiVersion: v2
name: mariadb-operator
description: "MariaDB Operator: run MariaDB and Galera clusters on Kubernetes from CRDs (MariaDB, Database, User, Grant, Backup, Restore). The CRDs ship with the chart; the operator's MariaDB pods default to the QuenchWorks mariadb image. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.8
appVersion: "26.10.2"
kubeVersion: ">=1.26.0-0"
keywords:
  - mariadb
  - mysql
  - galera
  - operator
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mariadb-operator/mariadb-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-01 wave lock"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: mariadb-operator
      image: ghcr.io/quenchworks/images/mariadb-operator@sha256:113d43c33f0c709273b03017e974d85a59f3764ca16b5c2d7a6964b383897244
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:cbbc5155a64005079f7ad67701244989f70229feb96830424bd36228af628227
    - name: mysqld-exporter
      image: ghcr.io/quenchworks/images/mysqld-exporter@sha256:aa7b08dd0e44b3106466452e73e3fc2249d6c161577b2f85a66101c7fc0564d2

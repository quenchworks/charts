apiVersion: v2
name: mariadb-operator
description: "MariaDB Operator: run MariaDB and Galera clusters on Kubernetes from CRDs (MariaDB, Database, User, Grant, Backup, Restore). The CRDs ship with the chart; the operator's MariaDB pods default to the QuenchWorks mariadb image. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "26.10.1"
kubeVersion: ">=1.26.0-0"
keywords:
  - mariadb
  - mysql
  - galera
  - operator
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mariadb-operator/mariadb-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: mariadb-operator
      image: ghcr.io/quenchworks/images/mariadb-operator@sha256:9df39c66ab07d37a961771bc5c763a5303998ab513535252bd410bce8d3ca6ae
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:cbbc5155a64005079f7ad67701244989f70229feb96830424bd36228af628227
    - name: mysqld-exporter
      image: ghcr.io/quenchworks/images/mysqld-exporter@sha256:f78c527551e8d0de7671be18974cab3c40b799fbf12563e92b47b3de0fbe4e72
  artifacthub.io/crds: |
    - kind: MariaDB
      version: v1alpha1
      name: mariadbs.k8s.mariadb.com
      displayName: MariaDB
      description: A MariaDB server or Galera cluster.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

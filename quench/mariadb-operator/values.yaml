# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mariadb-operator
  digest: "sha256:358f27b2403d266e351e48aaf3d82e5f8d14fd76c393b5013b284a3e10b95a68"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# More than one replica turns on leader election.
replicaCount: 1

logLevel: INFO
clusterName: cluster.local
# Watch only the release namespace instead of the whole cluster.
currentNamespaceOnly: false
extraArgs: []
extraEnvVars: []

# Images the operator uses in the pods it creates. Both defaults are
# QuenchWorks images pinned by digest.
config:
  mariadbImage:
    repository: ghcr.io/quenchworks/images/mariadb
    digest: "sha256:7f436d3b5f96c9b81892d5aa7ddc1a937297411fcf53b13c8877f3a3e440032b"
  mariadbImageName: ghcr.io/quenchworks/images/mariadb
  # Used when an image tag carries no MariaDB version.
  mariadbDefaultVersion: "12.3"
  galeraLibPath: /usr/lib/galera/libgalera_smm.so
  exporterImage:
    repository: ghcr.io/quenchworks/images/mysqld-exporter
    digest: "sha256:1f739328f0cd0937085fd5b6fba765ab3ecd1f21911e0c0f193d5b3471d111eb"
  # MaxScale is BSL-licensed and has no QuenchWorks image; these upstream images
  # are only pulled if you create a MaxScale resource.
  maxscaleImage: mariadb/maxscale:23.08.13-2
  exporterMaxscaleImage: mariadb/maxscale-prometheus-exporter-ubi:v0.0.1

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

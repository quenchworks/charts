{{/* The images the operator puts in the pods it creates. MARIADB_OPERATOR_IMAGE
     runs the init, agent and backup containers, so it is this chart's image. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-env
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  MARIADB_OPERATOR_IMAGE: {{ include "quench-common.image" . | quote }}
  MARIADB_GALERA_LIB_PATH: {{ .Values.config.galeraLibPath | quote }}
  MARIADB_DEFAULT_VERSION: {{ .Values.config.mariadbDefaultVersion | quote }}
  RELATED_IMAGE_MARIADB: {{ include "mariadb-operator.ref" .Values.config.mariadbImage | quote }}
  RELATED_IMAGE_MARIADB_NAME: {{ .Values.config.mariadbImageName | quote }}
  RELATED_IMAGE_MAXSCALE: {{ .Values.config.maxscaleImage | quote }}
  RELATED_IMAGE_EXPORTER: {{ include "mariadb-operator.ref" .Values.config.exporterImage | quote }}
  RELATED_IMAGE_EXPORTER_MAXSCALE: {{ .Values.config.exporterMaxscaleImage | quote }}

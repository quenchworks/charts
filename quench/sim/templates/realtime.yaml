{{- if .Values.realtime.enabled }}
{{- $rt := .Values.realtime }}
{{- $name := printf "%s-realtime" (include "quench-common.fullname" .) }}
{{- $probe := dict "httpGet" (dict "path" "/health" "port" "socket") "periodSeconds" 10 }}
# The socket.io server for the workflow editor, with its own name label so the app Service never selects it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  replicas: {{ $rt.replicaCount }}
  selector:
    matchLabels:
      {{- include "sim.realtimeSelector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "sim.env" . | sha256sum }}
      labels:
        {{- include "sim.realtimeSelector" . | nindent 8 }}
        app.kubernetes.io/component: realtime
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: realtime
          image: {{ include "sim.siblingImage" (dict "ctx" . "image" $rt.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "sim.env" . | nindent 12 }}
            - { name: PORT, value: {{ $rt.port | quote }} }
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - { name: socket, containerPort: {{ $rt.port }}, protocol: TCP }
          startupProbe:
            httpGet: { path: /health, port: socket }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe: {{ toJson $probe }}
          readinessProbe: {{ toJson $probe }}
          resources:
            {{- toYaml $rt.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime
spec:
  type: ClusterIP
  ports:
    - { name: socket, port: {{ $rt.port }}, targetPort: socket, protocol: TCP }
  selector:
    {{- include "sim.realtimeSelector" . | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sim.realtimeSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: socket, protocol: TCP }]
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}
{{- end }}

{{- /* The four Sim secrets, each generated once and read back on upgrade. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := list "better-auth-secret" "encryption-key" "internal-api-secret" "cron-secret" }}
  {{ $k }}: {{ get $old $k | b64dec | default (randAlphaNum 64) | b64enc | quote }}
  {{- end }}
{{- end }}

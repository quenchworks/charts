{{- $probe := dict "httpGet" (dict "path" "/api/health" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Sim reads its settings at start: a change rolls the pods
        checksum/config: {{ include "sim.env" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # the schema for this release, before the app starts (the migrator holds an advisory lock)
        - name: migrations
          image: {{ include "sim.siblingImage" (dict "ctx" . "image" .Values.migrations.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "sim.dbEnv" . | nindent 12 }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "sim.secretName" . }}, key: encryption-key }
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: sim
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "sim.env" . | nindent 12 }}
            {{- if .Values.realtime.enabled }}
            - { name: SOCKET_SERVER_URL, value: "http://{{ include "quench-common.fullname" . }}-realtime:{{ .Values.realtime.port }}" }
            {{- end }}
            {{- with .Values.socketUrl }}
            - { name: NEXT_PUBLIC_SOCKET_URL, value: {{ . | quote }} }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "sim.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          startupProbe:
            {{- with .Values.customStartupProbe }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next.js writes its image, fetch and ISR caches here
            - { name: cache, mountPath: /app/apps/sim/.next/cache }
            - { name: route-cache, mountPath: /app/apps/sim/.next/server/route-cache }
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: route-cache, emptyDir: {} }
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

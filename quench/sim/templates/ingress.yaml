{{- if .Values.ingress.enabled }}
{{- $full := include "quench-common.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.realtime.enabled }}
          - path: /socket.io
            pathType: Prefix
            backend:
              service: { name: {{ $full }}-realtime, port: { name: socket } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $full }}, port: { name: http } }
    {{- end }}
{{- end }}

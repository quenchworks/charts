# The digests below are the contract with the image factory. CI rewrites image.digest from the image-published
# dispatch after every green build; realtime and migrations move with it. Never a tag.
image:
  repository: ghcr.io/quenchworks/images/sim
  digest: "sha256:988a4a5105f01a3bfcdb8735c6f58ca09d3960071cae8064a08639097b161801"
  pullPolicy: IfNotPresent

nameOverride: ""

# Required: the public URL users open (NEXT_PUBLIC_APP_URL and BETTER_AUTH_URL; sign-in checks the request origin
# against it). The browser reaches the realtime server on the same origin under /socket.io (the ingress below routes
# it), unless socketUrl names another one, e.g. wss://socket.example.com.
baseUrl: ""
socketUrl: ""

# Sessions and workflows live in PostgreSQL: more app replicas are fine. Set REDIS_URL (settings) before running more
# than one realtime replica, so rooms are shared.
replicaCount: 1
updateStrategy:
  type: RollingUpdate

# BETTER_AUTH_SECRET, ENCRYPTION_KEY, INTERNAL_API_SECRET and CRON_SECRET, generated into the Secret <fullname> and kept
# on upgrade. ENCRYPTION_KEY encrypts stored credentials: losing it loses them, so back the Secret up.
secret:
  existingSecret: ""      # a Secret with those four keys (each 32+ characters) instead

# Database migrations run as an init container of the app pod (sim-migrations of the same release), before the app
# starts. Concurrent runs are safe: the migrator takes an advisory lock.
migrations:
  image:
    repository: ghcr.io/quenchworks/images/sim-migrations
    digest: "sha256:feb009430a4a6a57cd2d7f88559c1115623878189f44ccc02028d2cd36ceb87e"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# The socket.io collaboration server for the workflow editor.
realtime:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/sim-realtime
    digest: "sha256:277d1753c5846db433b48d3c847a0e875d8ccabd5ef0e38c9a84176918f8754a"
  replicaCount: 1
  port: 3002
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Scheduled work (schedules, webhook polling, cleanups): one CronJob per schedule, each calling its paths on the app
# with CRON_SECRET, the same list as upstream's docker/crontab.
cronjobs:
  enabled: true
  jobs:
    every-minute:
      schedule: "*/1 * * * *"
      paths: [/api/schedules/execute, /api/resume/poll, /api/webhooks/outbox/process, /api/cron/fold-table-row-changes,
        /api/cron/knowledge-projection, /api/cron/workspace-file-search-dispatch, /api/webhooks/poll/gmail,
        /api/webhooks/poll/outlook, /api/webhooks/poll/imap, /api/webhooks/poll/rss, /api/webhooks/poll/google-sheets,
        /api/webhooks/poll/google-drive, /api/webhooks/poll/google-calendar, /api/webhooks/poll/hubspot]
    every-5-minutes:
      schedule: "*/5 * * * *"
      paths: [/api/knowledge/connectors/sync, /api/knowledge/connectors/member-sync,
        /api/knowledge/connectors/directory-sync, /api/cron/people-directory-sync, /api/cron/cleanup-session-sandboxes]
    every-15-minutes:
      schedule: "*/15 * * * *"
      paths: [/api/workspace-events/poll, /api/cron/cleanup-table-row-ttl]
    every-30-minutes:
      schedule: "*/30 * * * *"
      paths: [/api/cron/cleanup-stale-executions]
    hourly:
      schedule: "0 * * * *"
      paths: [/api/cron/cleanup-oauth-tokens, /api/cron/run-data-drains, /api/cron/reconcile-billing-seats]
    hourly-17:
      schedule: "17 * * * *"
      paths: [/api/cron/scim-reconcile]
    every-6-hours:
      schedule: "0 */6 * * *"
      paths: [/api/cron/billing-cycle-close]
    every-12-hours:
      schedule: "0 */12 * * *"
      paths: [/api/cron/renew-subscriptions]
    daily-3:
      schedule: "0 3 * * *"
      paths: [/api/cron/reconcile-inbox-entitlement]
    daily-4-30:
      schedule: "30 4 * * *"
      paths: [/api/cron/cleanup-sandbox-images]
    daily-5:
      schedule: "0 5 * * *"
      paths: [/api/webhooks/cleanup/idempotency]
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# The bundled QuenchWorks PostgreSQL (it ships pgvector). auth.username is the server's initdb superuser, which the
# migrations need for CREATE EXTENSION vector; username and database must differ from each other.
postgresql:
  enabled: true
  auth:
    username: sim
    password: ""        # generated by the subchart if empty
    database: simstudio
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL with pgvector instead (postgresql.enabled=false): a Secret holding the full DATABASE_URL. The
# migrations need a role that may create the vector extension.
externalDatabase:
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# More Sim settings as environment variables on the app and realtime pods, e.g. REDIS_URL, OPENAI_API_KEY (better
# through extraEnvVarsSecret), OLLAMA_URL, EMAIL_VERIFICATION_ENABLED, DISABLE_REGISTRATION.
settings: {}

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: 2, memory: 4Gi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# Sim has no TLS listener: terminate TLS here. Each host routes /socket.io to the realtime server and the rest to the
# app.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # e.g. [{host: sim.example.com}]
  hosts: []
  # e.g. [{hosts: [sim.example.com], secretName: sim-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

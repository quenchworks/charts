# Fixed name: istiod trusts this account (CA_TRUSTED_NODE_ACCOUNTS=<namespace>/ztunnel) to
# request certificates for the pods on its node. ztunnel itself never calls the Kubernetes API;
# it authenticates to istiod with the projected istio-ca token below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztunnel
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
automountServiceAccountToken: false

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztunnel
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app: ztunnel
        # never meshed itself
        istio.io/dataplane-mode: none
        sidecar.istio.io/inject: "false"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ztunnel
      automountServiceAccountToken: false
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      containers:
        # Root with NET_ADMIN/SYS_ADMIN: ztunnel opens its listeners inside each ambient pod's
        # network namespace (handed over by istio-cni), as upstream runs it.
        - name: istio-proxy
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [proxy, ztunnel]
          env:
            - { name: CA_ADDRESS, value: {{ .Values.caAddress | quote }} }
            - { name: XDS_ADDRESS, value: {{ .Values.xdsAddress | quote }} }
            - { name: ISTIO_META_CLUSTER_ID, value: {{ .Values.clusterId | quote }} }
            - { name: RUST_LOG, value: {{ .Values.logLevel | quote }} }
            - { name: RUST_BACKTRACE, value: "1" }
            - { name: INPOD_ENABLED, value: "true" }
            - { name: TERMINATION_GRACE_PERIOD_SECONDS, value: {{ .Values.terminationGracePeriodSeconds | quote }} }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: INSTANCE_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: ztunnel-stats, containerPort: 15020, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: 15021 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 1337
            runAsNonRoot: false
            privileged: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
          volumeMounts:
            - { name: istiod-ca-cert, mountPath: /var/run/secrets/istio }
            - { name: istio-token, mountPath: /var/run/secrets/tokens }
            - { name: ztunnel-sock-dir, mountPath: /var/run/ztunnel }
            - { name: tmp, mountPath: /tmp }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # a token for istiod's CA only (audience istio-ca), not a Kubernetes API token
        - name: istio-token
          projected:
            sources:
              - serviceAccountToken: { audience: istio-ca, expirationSeconds: 43200, path: istio-token }
        # istiod publishes its root certificate into every namespace under this name
        - name: istiod-ca-cert
          configMap: { name: istio-ca-root-cert }
        # shared with istio-cni, which hands ztunnel each ambient pod's network namespace
        - { name: ztunnel-sock-dir, hostPath: { path: /var/run/ztunnel, type: DirectoryOrCreate } }
        - { name: tmp, emptyDir: {} }

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vc-{{ .Release.Name }}
  labels:
    {{- include "vcluster.labels" . | nindent 4 }}
# The syncer talks to the host API server with this token.
automountServiceAccountToken: true
---
# Synced workload pods run under this account on the host.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vc-workload-{{ .Release.Name }}
  labels:
    {{- include "vcluster.labels" . | nindent 4 }}

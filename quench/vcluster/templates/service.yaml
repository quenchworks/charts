apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "vcluster.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    # The kubelet endpoint the virtual nodes advertise is served by the syncer too.
    - name: kubelet
      port: 10250
      targetPort: 8443
      protocol: TCP
  selector:
    {{- include "vcluster.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  labels:
    {{- include "vcluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    {{- include "vcluster.selectorLabels" . | nindent 4 }}

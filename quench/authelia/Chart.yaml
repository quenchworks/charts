apiVersion: v2
name: authelia
description: Hardened Authelia authentication and authorization server on a 0-CVE image
type: application
version: 0.0.2
appVersion: "4.39.20"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/authelia/authelia
keywords:
  - authelia
  - authentication
  - authorization
  - sso
  - 2fa
  - forward-auth
  - security
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Add an ArtifactHub changelog; maintenance re-release re-validated against the chart's pinned, signed image."
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: authelia
      image: ghcr.io/quenchworks/images/authelia@sha256:9d8a4377b29c18986aa226de5e60370ea48463b253dfa0c1d1ae239d19860a9c
      whitelisted: false
# quench-common is the only hard dependency. The chart boots standalone on SQLite +
# the file auth backend with NO external services. PostgreSQL and Redis are OPTIONAL
# backends wired by pointing the configuration block at an externally-managed
# instance (see values.yaml storage.postgres / session.redis); they are intentionally
# NOT bundled subcharts, so a default install pulls in nothing extra.
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts

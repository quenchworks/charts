# quench-common is the only HARD dependency. The chart boots standalone on SQLite +
# the file auth backend with NO external services. SQL storage and the session store
# are each OPTIONAL and independently choosable; mix-and-match freely.
#   STORAGE modes:  bundled postgresql | external (externalDatabase.*) | off (SQLite)
#   SESSION modes:  bundled valkey | bundled redis | external (externalRedis.*) | off
#                   (in-memory). valkey is the recommended 0-CVE BSD store; redis is
#                   the AGPL alternative. Enable AT MOST ONE of valkey/redis.
# Each subchart only renders when its condition is true, so a default install (all
# off) pulls in nothing extra and behaves exactly as the standalone SQLite default.
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

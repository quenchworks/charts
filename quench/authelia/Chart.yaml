apiVersion: v2
name: authelia
description: Hardened Authelia authentication and authorization server on a 0-CVE image
type: application
version: 0.0.16
appVersion: "4.39.20"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/authelia/authelia
keywords:
  - authelia
  - authentication
  - authorization
  - sso
  - 2fa
  - forward-auth
  - security
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bumped the bundled postgresql subchart to 0.0.19, which pins the rebuilt PostgreSQL 18.6 image that ships the uuid-ossp extension."
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: authelia
      image: ghcr.io/quenchworks/images/authelia@sha256:8ea0f903ed50c92611367db73286861291116f43f33c7b902a87f03796cf0b8f
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:c9ceca7878908b8446397cf83d78c6eeab0e64db18b54111ff704184ee995cae
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:cda19af7491d05b63de6cad2fcdc3f7b9dc7bb4a15fdc1a387b5e6c0dade2259
# quench-common is the only HARD dependency. The chart boots standalone on SQLite +
# the file auth backend with NO external services. SQL storage and the session store
# are each OPTIONAL and independently choosable; mix-and-match freely.
#   STORAGE modes:  bundled postgresql | external (externalDatabase.*) | off (SQLite)
#   SESSION modes:  bundled valkey | bundled redis | external (externalRedis.*) | off
#                   (in-memory). valkey is the recommended 0-CVE BSD store; redis is
#                   the AGPL alternative. Enable AT MOST ONE of valkey/redis.
# Each subchart only renders when its condition is true, so a default install (all
# off) pulls in nothing extra and behaves exactly as the standalone SQLite default.
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.19
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

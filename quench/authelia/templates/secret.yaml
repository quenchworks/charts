{{/*
The managed Secret carries up to FIVE keys, each consumed by Authelia as a file via
a *_FILE env var:

  THREE MANDATORY secrets (rendered unless secrets.existingSecret is set):
    - jwt-secret             -> identity_validation.reset_password.jwt_secret
    - session-secret         -> session.secret
    - storage-encryption-key -> storage.encryption_key
  Authelia refuses to boot unless each is >= 20 chars. Empty values are generated
  once (32 chars) and preserved across upgrades via a lookup of the existing Secret.

  TWO OPTIONAL backend passwords for the EXTERNAL-inline case only (independent of
  the mandatory block). When a backend is BUNDLED, Authelia reads the subchart's OWN
  Secret directly (postgresql/valkey/redis), so nothing is rendered here. When a
  backend is EXTERNAL with an existingSecret, Authelia reads that Secret. Only the
  EXTERNAL-without-existingSecret case puts the password here:
    - storage-postgres-password -> AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
        (from externalDatabase.password)
    - session-redis-password    -> AUTHELIA_SESSION_REDIS_PASSWORD_FILE
        (from externalRedis.password)
Each generated password is preserved across upgrades via the lookup.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderMandatory := not .Values.secrets.existingSecret -}}
{{- $renderPg := and (include "authelia.postgresUsed" .) (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- $renderRedis := and (include "authelia.redisUsed" .) (include "authelia.redis.hasPassword" .) (not .Values.valkey.enabled) (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) -}}

{{- if or $renderMandatory $renderPg $renderRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderMandatory }}
  {{- $jwt := .Values.secrets.jwtSecret -}}
  {{- if and (not $jwt) $existing -}}{{- $jwt = index $existing.data "jwt-secret" | b64dec -}}{{- end -}}
  {{- if not $jwt -}}{{- $jwt = randAlphaNum 32 -}}{{- end }}
  {{- $session := .Values.secrets.sessionSecret -}}
  {{- if and (not $session) $existing -}}{{- $session = index $existing.data "session-secret" | b64dec -}}{{- end -}}
  {{- if not $session -}}{{- $session = randAlphaNum 32 -}}{{- end }}
  {{- $enc := .Values.secrets.storageEncryptionKey -}}
  {{- if and (not $enc) $existing -}}{{- $enc = index $existing.data "storage-encryption-key" | b64dec -}}{{- end -}}
  {{- if not $enc -}}{{- $enc = randAlphaNum 32 -}}{{- end }}
  jwt-secret: {{ $jwt | b64enc | quote }}
  session-secret: {{ $session | b64enc | quote }}
  storage-encryption-key: {{ $enc | b64enc | quote }}
  {{- end }}
  {{- if $renderPg }}
  {{- $dbpw := .Values.externalDatabase.password -}}
  {{- if and (not $dbpw) $existing -}}{{- $dbpw = index $existing.data "storage-postgres-password" | b64dec -}}{{- end -}}
  {{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end }}
  storage-postgres-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
  {{- if $renderRedis }}
  {{- $rpw := .Values.externalRedis.password -}}
  {{- if and (not $rpw) $existing -}}{{- $rpw = index $existing.data "session-redis-password" | b64dec -}}{{- end -}}
  {{- if not $rpw -}}{{- $rpw = randAlphaNum 24 -}}{{- end }}
  session-redis-password: {{ $rpw | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.auth.apiKey (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qdrant.secretName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
{{- end }}

# Install gate values. Fits a single kind node: ephemeral storage (kind ships a
# default StorageClass but we keep PVCs small and short-lived), modest resources.
# Components use their charts' real CI-maintained image digests.
prometheus:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

grafana:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

alertmanager:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

kubeStateMetrics:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 200m, memory: 128Mi }

# node-exporter is ON for this stack (cluster observability needs node metrics);
# it takes host access by design. Container metrics come from the kubelet's
# /metrics/cadvisor scrape, so the standalone cAdvisor DaemonSet stays OFF.
nodeExporter:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 24Mi }
    limits: { cpu: 200m, memory: 96Mi }

cadvisor:
  enabled: false

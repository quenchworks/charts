apiVersion: v2
name: observability-stack
description: "Hardened, operator-free observability stack: Prometheus + Grafana + Alertmanager + kube-state-metrics + node-exporter + cAdvisor, wired together for metrics, alerting, and populated Kubernetes dashboards. No Prometheus Operator, no CRDs. All components are QuenchWorks-hardened, nonroot, CVE-gated images pinned by digest and cosign-signed. node-exporter and cAdvisor take host access by design (the stack's purpose is node + container observability); both are toggleable."
type: application
version: 0.0.44
appVersion: "2.20.0"
keywords:
  - observability
  - monitoring
  - prometheus
  - grafana
  - alertmanager
  - dashboards
  - kube-state-metrics
  - node-exporter
  - cadvisor
  - metrics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/prometheus/alertmanager
  - https://github.com/kubernetes/kube-state-metrics
  - https://github.com/prometheus/node_exporter
  - https://github.com/google/cadvisor
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:8e9254d8deac559c2520e0c295da15d86e099c444b762bfc11682278cc7bca7b
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:3ee747f05eb40b2f39074f3a8563153a63d09958d7c5c66824a7c19a41d7741e
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:0a201bdf1f3d3e56b8ffb7509b0d7630017d06ac106231ef15d695716a384e0f
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:dc5ec6e1d624fe7cfff7da4e333b78734099c02e6268c2f78fa3a9e4c58d2218
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:9a0ca4efa2171dc7793c6ccd98ddbe67c77588a5b70a04c221cd4ef7361db6f9
    - name: cadvisor
      image: ghcr.io/quenchworks/images/cadvisor@sha256:d9fba43dd1acd1382b8b9a3370ae0b5ea1792b32eb5a6bc8c85dd7d427a7ebc2
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: prometheus
    version: 0.0.28
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
  - name: alertmanager
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: alertmanager.enabled

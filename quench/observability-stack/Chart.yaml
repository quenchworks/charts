      image: ghcr.io/quenchworks/images/prometheus@sha256:3aea47c759774709cc343b5ef17a58664475ad62cfe7374acd96d6f472fe8c93
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:75c32316603e6b4442f2bda16b25e123d2f073582d7ce2f47d4ce748bfcc17d9
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:1b4d4e824e2061a935a5f00c1aa5fc86ed421c95e080392fa42a9ce8dbdd2c27
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:f2dc970e50fd2144ea8a41d3c11092d7bdb1885a3c6fbed51a3afb18bf8adaa2
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:55222f2c7dcab5b9253e09ff54ee5f46c2a34170ecb1d58ef3c4f8ec21e7f555

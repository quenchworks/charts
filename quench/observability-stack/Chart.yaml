apiVersion: v2
name: observability-stack
description: "Hardened, operator-free observability stack: Prometheus + Grafana + Alertmanager + kube-state-metrics + node-exporter + cAdvisor, wired together for metrics, alerting, and populated Kubernetes dashboards. No Prometheus Operator, no CRDs. All components are QuenchWorks-hardened, nonroot, 0-CVE images pinned by digest and cosign-signed. node-exporter and cAdvisor take host access by design (the stack's purpose is node + container observability); both are toggleable."
type: application
version: 0.0.13
appVersion: "1.0.0"
keywords:
  - observability
  - monitoring
  - prometheus
  - grafana
  - alertmanager
  - dashboards
  - kube-state-metrics
  - node-exporter
  - cadvisor
  - metrics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/prometheus/alertmanager
  - https://github.com/kubernetes/kube-state-metrics
  - https://github.com/prometheus/node_exporter
  - https://github.com/google/cadvisor
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned cadvisor to rebuilt 0-CVE image digests."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:e9037c190bc1b3876592464fe582483b9e8dfdc027dc2b365c9c774ff32c43ee
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:3ccc56791c8a7ffc7a54a69084012900aa68bf3ef39a25095241e0867f416492
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:7131b1e72afc8bb2a807248bebf4086e60c27b938e3bf72e5e137028d3bd521f
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:9cf36d15744d017b8e80d9b419af5b3c3ae7aae0f2f120ead8994ea9f1dce4d0
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:240a103df490ad8ebf85e37b1c37252e761bc46dc2f61ae3b562a7ae63ccd928
    - name: cadvisor
      image: ghcr.io/quenchworks/images/cadvisor@sha256:50906bd68aa48b3680d06f7b40152349396b28086e0fdc0eac6d3c6d0b74665d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: prometheus
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
  - name: alertmanager
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: alertmanager.enabled

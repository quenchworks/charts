apiVersion: v2
name: observability-stack
description: "Hardened, operator-free observability stack: Prometheus + Grafana + Alertmanager + kube-state-metrics + node-exporter + cAdvisor, wired together for metrics, alerting, and populated Kubernetes dashboards. No Prometheus Operator, no CRDs. All components are QuenchWorks-hardened, nonroot, CVE-gated images pinned by digest and cosign-signed. node-exporter and cAdvisor take host access by design (the stack's purpose is node + container observability); both are toggleable."
type: application
version: 0.0.50
appVersion: "2.20.0"
keywords:
  - observability
  - monitoring
  - prometheus
  - grafana
  - alertmanager
  - dashboards
  - kube-state-metrics
  - node-exporter
  - cadvisor
  - metrics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/prometheus/alertmanager
  - https://github.com/kubernetes/kube-state-metrics
  - https://github.com/prometheus/node_exporter
  - https://github.com/google/cadvisor
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned alertmanager to rebuilt image digests."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:04a726bcdaf7f8484d360674236a9e90c4b924e82d4d99b4516c5218013fcb45
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:3ee747f05eb40b2f39074f3a8563153a63d09958d7c5c66824a7c19a41d7741e
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:6d8670ce75975097e29af15da4d95f6a69b62223a7418d16b6bf2df5884056cd
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:dc5ec6e1d624fe7cfff7da4e333b78734099c02e6268c2f78fa3a9e4c58d2218
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:8737fb40448c821c7bbaad418c978233712462ea2486e9eaf662eac3c5f4251c
    - name: cadvisor
      image: ghcr.io/quenchworks/images/cadvisor@sha256:294c302a293b6a14bd67759f572b31720d3395549cd2e471683401225883d96d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: prometheus
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
  - name: alertmanager
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: alertmanager.enabled

      image: ghcr.io/quenchworks/images/prometheus@sha256:d57cf70aab4c571222c6f5b8cf3912298483b853eda1e39348a170d74aa6c157
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:4b7e7a1342831602a31232c1dce40d8ea6a14bb44d6acb3aa095c029e1520d55
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:d1e7285865d87bf4cb56ff578ec765e8a7de91be203e53fac12106e238a1b285
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:af2f310ad2100d8bff278e0ddc9a34ca0d94313cf6cecc82b903b02640317b55
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:806566229a7a32192e2cc78ab94d752ad9e64e030e12bb102f160e163f370651
    - name: cadvisor
      image: ghcr.io/quenchworks/images/cadvisor@sha256:3cb30f4364a091a3725b961bc6b9634b787388c72261779e37667c87bd851183
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

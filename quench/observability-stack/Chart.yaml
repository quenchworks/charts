      image: ghcr.io/quenchworks/images/prometheus@sha256:afd50563a9d30118afb3cf856738ec548b82042ada4f289699f467ee8683f5b8
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:55e1905467f2b38d95705ef32eb46d30cc6fbce8c4a4249c457cf27c487e8ddd
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:f655e6ec17c3a8b6d86c7784e527a9938ea9e64262cbcd88824492d13e17cfb0
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:6a9e9477be8a715b3731d8d648b132db09b55b598d76244b8cd6b618060be6bd
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:0e9c38456c24b09c3305bf85f593e987a5ceda7def5618e74a869195ec678e3a
    - name: cadvisor

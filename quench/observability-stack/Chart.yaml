apiVersion: v2
name: observability-stack
description: "Hardened, operator-free observability stack: Prometheus + Grafana + Alertmanager + kube-state-metrics + node-exporter + cAdvisor, wired together for metrics, alerting, and populated Kubernetes dashboards. No Prometheus Operator, no CRDs. All components are QuenchWorks-hardened, nonroot, CVE-gated images pinned by digest and cosign-signed. node-exporter and cAdvisor take host access by design (the stack's purpose is node + container observability); both are toggleable."
type: application
version: 0.0.39
appVersion: "2.20.0"
keywords:
  - observability
  - monitoring
  - prometheus
  - grafana
  - alertmanager
  - dashboards
  - kube-state-metrics
  - node-exporter
  - cadvisor
  - metrics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/prometheus/prometheus
  - https://github.com/grafana/grafana
  - https://github.com/prometheus/alertmanager
  - https://github.com/kubernetes/kube-state-metrics
  - https://github.com/prometheus/node_exporter
  - https://github.com/google/cadvisor
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:8e9254d8deac559c2520e0c295da15d86e099c444b762bfc11682278cc7bca7b
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:5fad18f2054178ba8e6ecbc39b4a1127318060a69b2edf2ed4d2b6b312d62c88
    - name: alertmanager
      image: ghcr.io/quenchworks/images/alertmanager@sha256:0a201bdf1f3d3e56b8ffb7509b0d7630017d06ac106231ef15d695716a384e0f
    - name: kube-state-metrics
      image: ghcr.io/quenchworks/images/kube-state-metrics@sha256:17bc044cc9b424b4e6788a4cc50a325c2de8213f310a0dbc04fe9bb586f05fe8
    - name: node-exporter
      image: ghcr.io/quenchworks/images/node-exporter@sha256:9a0ca4efa2171dc7793c6ccd98ddbe67c77588a5b70a04c221cd4ef7361db6f9
    - name: cadvisor
      image: ghcr.io/quenchworks/images/cadvisor@sha256:34aae8eb9de08cfbe362e08c5723779a8b0d1faee562576172b5fa7c937837b2
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: prometheus
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
  - name: alertmanager
    version: 0.0.23
    repository: oci://ghcr.io/quenchworks/charts
    condition: alertmanager.enabled

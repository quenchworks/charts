apiVersion: v2
name: unleash
description: "Unleash, the feature-flag and gradual-rollout server: flags, activation strategies, segments, environments, the admin UI and the client and frontend APIs, on PostgreSQL (bundled or external). Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "8.2.0"
keywords:
  - unleash
  - feature-flags
  - feature-toggles
  - progressive-delivery
  - experimentation
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Unleash/unleash
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "unleash image rebuilt with rebuilt for the npm CVE wave (ip-address, undici, nodemailer, fast-uri)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: unleash
      image: ghcr.io/quenchworks/images/unleash@sha256:3dde8e6ab8021f73f01400f3a9f9a92a7e3f1fd096e9d063558dcc335fd494cc
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

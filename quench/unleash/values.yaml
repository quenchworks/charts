# Quenchworks Unleash on the QuenchWorks unleash image (nonroot, 0-CVE, cosign-signed,
# pinned by digest). Unleash keeps everything in PostgreSQL, so the pods are stateless.
image:
  repository: ghcr.io/quenchworks/images/unleash
  digest: "sha256:6e29295759795ba6c7ed9cbfc70cd3a7ade042833b3d98c355f3ffdac910cd90"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

replicas: 1

# The public URL, used in links, e-mails and the OIDC/SAML callbacks.
url: http://unleash.local

# The first administrator, created when Unleash first migrates an empty database. With
# no password the chart generates one into its Secret (key admin-password).
admin:
  username: admin
  password: ""
  # a Secret with key admin-password instead
  existingSecret: ""

# Upstream's version check and anonymous usage telemetry. Off: the pods call no one.
telemetry:
  enabled: false

# The bundled QuenchWorks PostgreSQL chart. Its generated superuser password is in the
# Secret <release>-postgresql (key postgres-password).
postgresql:
  enabled: true
  auth:
    database: unleash
  primary:
    persistence:
      enabled: true
      size: 8Gi

# An external PostgreSQL, used when postgresql.enabled=false.
externalDatabase:
  host: ""
  port: 5432
  database: unleash
  user: unleash
  existingSecret: ""
  passwordKey: password
  ssl: false

extraEnvVars: []

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 768Mi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 4242

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

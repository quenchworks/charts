{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.admin.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "admin-password" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}

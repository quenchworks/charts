# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A tiny PVC (kind ships a default StorageClass) keeps /models writable without
# pulling any model -- the gate only checks the server is up via /api/version.
persistence:
  enabled: true
  size: 2Gi
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

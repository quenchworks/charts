apiVersion: v2
name: ollama
description: "Ollama, the local large-language-model runtime that pulls and serves open models (Llama, Mistral, Gemma, Qwen, ...) over a simple REST API. Hardened by QuenchWorks as a minimal, nonroot, read-only-rootfs, CVE-gated image, cosign-signed and pinned by digest. CPU-only; runs as a StatefulSet with a persistent /models volume."

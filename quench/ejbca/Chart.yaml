apiVersion: v2
name: ejbca
description: "EJBCA Community Edition: open-source PKI with certificate authorities, registration, CRL and OCSP, on WildFly with the bundled PostgreSQL. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "9.6.3"
keywords:
  - ejbca
  - pki
  - certificate-authority
  - x509
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Keyfactor/ejbca-ce
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: EJBCA CE 9.6.3 on WildFly 42 with the bundled PostgreSQL, administered through the in-pod ejbca CLI."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ejbca
      image: ghcr.io/quenchworks/images/ejbca@sha256:feeb51dbb099268c866d4ff2d5fc7b971819532677f624d6349ea438e81f5f41
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: LGPL-2.1-or-later
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.pgPort }}
      targetPort: pg
      name: pg
    - port: {{ .Values.service.ilpPort }}
      targetPort: ilp
      name: ilp
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "questdb.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.pgPort }}
      targetPort: pg
      name: pg
    - port: {{ .Values.service.ilpPort }}
      targetPort: ilp
      name: ilp
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

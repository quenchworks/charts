{{- if eq (include "tyk.createsSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.gateway.existingSecret }}
  api-secret: {{ include "tyk.apiSecret" . | b64enc | quote }}
  node-secret: {{ include "tyk.nodeSecret" . | b64enc | quote }}
  {{- end }}
  {{- if eq (include "tyk.ownsRedisPassword" .) "true" }}
  redis-password: {{ include "tyk.redisPasswordValue" . | b64enc | quote }}
  {{- end }}
{{- end }}

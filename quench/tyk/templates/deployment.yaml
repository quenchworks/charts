{{/* Tyk Gateway serves GET /hello -> 200 (JSON status) once the server is up. */}}
{{- $liveness := dict "httpGet" (dict "path" "/hello" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 3 -}}
{{- $readiness := dict "httpGet" (dict "path" "/hello" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 3 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the rendered config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tyk.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: tyk
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          args:
            - "--conf=/etc/tyk/tyk.conf"
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Gateway control-API secret and node secret (override tyk.conf).
            - name: TYK_GW_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tyk.apiSecretName" . }}
                  key: {{ include "tyk.apiSecretKey" . }}
            - name: TYK_GW_NODESECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tyk.nodeSecretName" . }}
                  key: {{ include "tyk.nodeSecretKey" . }}
            # Redis password (override tyk.conf storage.password); may be empty
            # when Redis auth is disabled.
            - name: TYK_GW_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tyk.redisPasswordSecretName" . }}
                  key: {{ include "tyk.redisPasswordKey" . }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # tyk.conf rendered from the ConfigMap, mounted read-only.
            - name: config
              mountPath: /etc/tyk
              readOnly: true
            # Read-only rootfs: Tyk needs a writable /tmp for scratch files and a
            # writable app_path it scans on boot (empty by default).
            - name: tmp
              mountPath: /tmp
            - name: apps
              mountPath: /opt/tyk-gateway/apps
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quench-common.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: apps
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

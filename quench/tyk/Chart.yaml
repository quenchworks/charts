    - kind: security
      description: "Rebuilt on current Wolfi; refreshes the pinned digest"
  artifacthub.io/license: MPL-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: tyk
      image: ghcr.io/quenchworks/images/tyk@sha256:3ba5a0a44e3a2b56ff7432e79886c5480d94eed06c91393e5324b0aeb5632fb1
    - name: redis

apiVersion: v2
name: tyk
description: "Tyk Gateway (open-source), a fast, Go-based API gateway backed by Redis. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Ships a bundled Redis by default for a self-contained install."
type: application
version: 0.0.5
appVersion: "5.13.1"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/TykTechnologies/tyk
keywords:
  - tyk
  - api-gateway
  - gateway
  - api-management
  - reverse-proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pin to rebuilt 0-CVE image digest(s) (nightly CVE remediation)."
  artifacthub.io/license: MPL-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: tyk
      image: ghcr.io/quenchworks/images/tyk@sha256:4b3268e38006cda8d5d796b0eaa6c033982bb24c23086d0b08dd7a225927d2f5
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
  - name: redis
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

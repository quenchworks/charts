    - kind: security
      description: "Automated re-pin: tyk republished to a new 0-CVE digest."
  artifacthub.io/license: MPL-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: tyk
      image: ghcr.io/quenchworks/images/tyk@sha256:ac5a3776474551651ade44d53a518dc7845b79c2524eaa8053453b5c345dc323
    - name: redis

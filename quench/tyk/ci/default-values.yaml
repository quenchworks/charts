# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# The bundled Redis subchart stays ON so the gate proves the self-contained path
# end-to-end: Redis comes up, the gateway connects to it and serves /hello.
# Fixed, deterministic credentials make the install reproducible; rotate them
# (or use externalRedis) in a real deployment.
gateway:
  secret: quench-ci-tyk-secret
  nodeSecret: quench-ci-tyk-node

redis:
  enabled: true
  auth:
    enabled: true
    password: quench-ci-redis
  primary:
    persistence:
      enabled: true
      size: 1Gi

{{- $probe := dict "tcpSocket" (dict "port" "ssh") "periodSeconds" 15 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # one replica: repositories and the sqlite database live on one volume
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (list .Values.initialAdminKeys .Values.anonAccess .Values.allowKeyless .Values.publicUrl) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: soft-serve
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: SOFT_SERVE_NAME, value: {{ .Values.name | quote }} }
            - { name: SOFT_SERVE_INITIAL_ADMIN_KEYS, value: {{ join "\n" .Values.initialAdminKeys | quote }} }
            - { name: SOFT_SERVE_ANON_ACCESS, value: {{ .Values.anonAccess | quote }} }
            - { name: SOFT_SERVE_ALLOW_KEYLESS, value: {{ .Values.allowKeyless | quote }} }
            - { name: SOFT_SERVE_SSH_PUBLIC_URL, value: {{ .Values.publicUrl.ssh | default (printf "ssh://%s:%d" (include "quench-common.fullname" .) (int .Values.service.ports.ssh)) | quote }} }
            - { name: SOFT_SERVE_HTTP_PUBLIC_URL, value: {{ .Values.publicUrl.http | default (printf "http://%s:%d" (include "quench-common.fullname" .) (int .Values.service.ports.http)) | quote }} }
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "soft-serve.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /soft-serve }
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ .Values.persistence.existingClaim | default (include "quench-common.fullname" .) }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

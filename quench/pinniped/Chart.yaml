apiVersion: v2
name: pinniped
description: "Pinniped Concierge: federated login for a Kubernetes cluster. Users authenticate against an OIDC, LDAP or webhook identity provider through the pinniped CLI and get short-lived cluster credentials, on any cluster without API server flags. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.47.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - pinniped
  - authentication
  - oidc
  - ldap
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware/pinniped
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: the Pinniped 0.47.0 Concierge (aggregated login and identity APIs, kube cert agent, impersonation proxy) with its CRDs."
  artifacthub.io/category: security
  artifacthub.io/crds: |
    - kind: JWTAuthenticator
      version: v1alpha1
      name: jwtauthenticators.authentication.concierge.pinniped.dev
      displayName: JWTAuthenticator
      description: Trusts JWTs from an OIDC issuer for cluster login
    - kind: WebhookAuthenticator
      version: v1alpha1
      name: webhookauthenticators.authentication.concierge.pinniped.dev
      displayName: WebhookAuthenticator
      description: Trusts a TokenReview webhook for cluster login
    - kind: CredentialIssuer
      version: v1alpha1
      name: credentialissuers.config.concierge.pinniped.dev
      displayName: CredentialIssuer
      description: How the Concierge issues cluster credentials, and its status
  artifacthub.io/images: |
    - name: pinniped
      image: ghcr.io/quenchworks/images/pinniped@sha256:0e7b9819ba1212d018319e6aeea57a0b00ddc6f8f6478d3eaa3cdf4a493218cb
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

# Install gate. No image override: the install uses the chart's real, CI-maintained
# digests from values.yaml. Brings up the gateway, the management API, the console and
# the bundled MongoDB with small resources and a fixed admin password; the gate then
# logs in, creates a v4 proxy API to an in-cluster echo backend, publishes a keyless
# plan, starts and deploys the API, and calls it through the gateway.
admin:
  password: ci-admin-Passw0rd

gateway:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "2", memory: 768Mi }
api:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

mongodb:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

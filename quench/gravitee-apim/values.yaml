# Gravitee API Management (APIM) community edition: the gateway, the management API
# and the console, on the QuenchWorks images (community plugins only; the Enterprise
# plugins are removed from the images at build time).
#
# The digests below are the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. They are never tags.

image:
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Native TLS: the gateway (8082) serves HTTPS only, from the PEM pair at /tls. The management
# API and console stay HTTP inside the release (the console proxies /management to the API).
# The certificate comes from the first source set: existingSecret, then a cert-manager
# Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Gateway: serves the APIs you deploy (HTTP and TCP proxy) ---
gateway:
  image:
    repository: ghcr.io/quenchworks/images/gravitee-gateway
    digest: "sha256:ac3f3bdd7736067c580a834b6fff72cee90486580fffd38dcd2183bfc9cf1adf"
  replicaCount: 1
  # JVM flags (JAVA_TOOL_OPTIONS). The image sizes the heap at 70% of the container limit.
  javaOpts: ""
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }
  extraEnv: []

# --- Management API: the REST API behind the console (/management) and portal (/portal) ---
api:
  image:
    repository: ghcr.io/quenchworks/images/gravitee-management-api
    digest: "sha256:b779d2df62a88d85abbaf5a4dda3e9a287dff1dc6d2136cf6a9b7213422362d0"
  replicaCount: 1
  javaOpts: ""
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }
  extraEnv: []

# --- Console: the admin UI. Its nginx proxies /management and /portal to the API, so
# one address (port-forward or ingress) serves the UI and the API it calls. ---
console:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/gravitee-console
    digest: "sha256:de604dedef01e3285836f37a47295c4bf0d4b4d73298f34f4a9d191366acaa2c"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# The console and management API administrator (in-memory identity provider, user
# "admin"). Empty generates a random password into the chart Secret (key
# admin-password), kept across upgrades. existingSecret supplies it instead.
admin:
  password: ""
  existingSecret: ""
  existingSecretKey: admin-password

# Basic-auth password of the node API (user "admin"; health, configuration and logging
# endpoints on 18082/18083, never exposed by a Service). Empty generates one.
nodeApi:
  password: ""

# Signs console and portal session tokens. Empty generates a 64-character secret.
jwtSecret: ""
# Encrypts API properties marked as encrypted; the gateway and the API share it.
# Exactly 32 characters. Empty generates one.
encryptionSecret: ""

# Name of the MongoDB database APIM uses.
database: gravitee

# --- Bundled MongoDB (default) ---
# The QuenchWorks MongoDB subchart; its Service is "<release>-mongodb". The root password
# is generated into that chart's Secret and both APIM components read it from there.
mongodb:
  enabled: true
  # Shared with the subchart (same key): also runs the gateway and API wait-for-mongodb
  # init containers, which ping the database with mongosh before the JVM starts.
  image:
    repository: ghcr.io/quenchworks/images/mongodb
    digest: "sha256:ccd312688b554a3306b8e232c33e068432647776f11f1b1bf6e3da67f29d829b"
  auth:
    enabled: true
    rootUsername: root
    rootPassword: ""
    existingSecret: ""
    existingSecretPasswordKey: mongodb-root-password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# --- External MongoDB (mongodb.enabled=false) ---
# A full connection string, or an existing Secret holding one.
externalMongodb:
  uri: ""
  existingSecret: ""
  existingSecretUriKey: mongodb-uri

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Console and management API (/, /management, /portal on one host)
  consoleHost: apim.local
  # Gateway (the APIs you deploy)
  gatewayHost: gateway.local
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
containerSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []

{{- $s := include "gravitee.secrets" . | fromYaml -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gravitee.secretName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.admin.existingSecret }}
  admin-password: {{ index $s "admin-password" | b64enc | quote }}
  {{- end }}
  node-password: {{ index $s "node-password" | b64enc | quote }}
  jwt-secret: {{ index $s "jwt-secret" | b64enc | quote }}
  encryption-secret: {{ index $s "encryption-secret" | b64enc | quote }}
  {{- if and (not .Values.mongodb.enabled) (not .Values.externalMongodb.existingSecret) }}
  mongodb-uri: {{ required "externalMongodb.uri or externalMongodb.existingSecret is required when mongodb.enabled=false" .Values.externalMongodb.uri | b64enc | quote }}
  {{- end }}

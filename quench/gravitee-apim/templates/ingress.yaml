{{- if .Values.ingress.enabled }}
{{- $name := include "quench-common.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.consoleHost | quote }}
      http:
        paths:
          - path: /management
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-api, port: { name: http } }
          - path: /portal
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-api, port: { name: http } }
          {{- if .Values.console.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-console, port: { name: http } }
          {{- end }}
    - host: {{ .Values.ingress.gatewayHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-gateway, port: { name: http } }
{{- end }}

{{- $name := include "quench-common.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-gateway
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - { name: http, port: {{ .Values.gateway.service.port }}, targetPort: http, protocol: TCP }
  selector:
    {{- include "gravitee.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP }
  selector:
    {{- include "gravitee.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
{{- if .Values.console.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-console
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - { name: http, port: {{ .Values.console.service.port }}, targetPort: http, protocol: TCP }
  selector:
    {{- include "gravitee.selectorLabels" (dict "ctx" . "component" "console") | nindent 4 }}
{{- end }}

{{- $s := .Values.server -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-server
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ $s.replicas }}
  selector:
    matchLabels:
      {{- include "prefect.selectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prefect.selectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prefect.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server migrates the schema at start and fails if PostgreSQL is not up yet.
      initContainers:
        {{- include "prefect.waitFor" (dict "ctx" . "name" "postgres" "host" (include "prefect.pg.host" .) "port" (include "prefect.pg.port" .)) | nindent 8 }}
      containers:
        - name: server
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/prefect/venv/bin/prefect"]
          args: ["server", "start", "--host", "0.0.0.0", "--port", "4200"]
          env:
            {{- include "prefect.server.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 4200
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "prefect.mounts" . | nindent 12 }}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "prefect.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-server
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "prefect.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}

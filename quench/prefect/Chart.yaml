dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

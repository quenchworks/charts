apiVersion: v2
name: prefect
description: "Prefect, the Python-native workflow orchestration server: API, UI and background services with PostgreSQL storage, plus an optional process worker. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "3.8.7"
keywords:
  - prefect
  - orchestration
  - workflow
  - data-pipelines
  - etl
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PrefectHQ/prefect
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt with cryptography from Wolfi; the wheel linked OpenSSL statically, where the scan cannot see it. The bundled PostgreSQL moves to 0.0.26."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: prefect
      image: ghcr.io/quenchworks/images/prefect@sha256:4cda7787da530d58caac15655043ba0f6b2b0b67fcfbaecba09c696ffee19f28
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:086dc72597074662dfb828f7f58a0093f98123405cf4bc109a1bd859bc576f21
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: prefect
      image: ghcr.io/quenchworks/images/prefect@sha256:dd3c8ef81a481063d0a310abe178f9b990f26026c68203051a5d2371f9b6a1d5
    - name: postgresql

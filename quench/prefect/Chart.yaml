apiVersion: v2
name: prefect
description: "Prefect, the Python-native workflow orchestration server: API, UI and background services with PostgreSQL storage, plus an optional process worker. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.18
appVersion: "3.8.8"
keywords:
  - prefect
  - orchestration
  - workflow
  - data-pipelines
  - etl
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PrefectHQ/prefect
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore: re-pin bundled postgresql/mysql/mongodb/openbao images to the TLS-capable builds"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: prefect
      image: ghcr.io/quenchworks/images/prefect@sha256:ad285095047d045c69630f71babcdd224b6d09f69266c34a2c276addb35724b2
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:beda4af6174e30ad6ed2d9ca9a8962e2d2cb59af2ffd98a9b846b1edc41a0636
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

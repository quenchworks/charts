apiVersion: v2
name: prefect
description: "Prefect, the Python-native workflow orchestration server: API, UI and background services with PostgreSQL storage, plus an optional process worker. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.30
appVersion: "3.8.8"
keywords:
  - prefect
  - orchestration
  - workflow
  - data-pipelines
  - etl
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PrefectHQ/prefect
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: prefect
      image: ghcr.io/quenchworks/images/prefect@sha256:2c55d8c6d3fa40016fc4eb9d5f7e9def0467425f3256d5f82f96585cbf1d16b7
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

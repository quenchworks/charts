    - kind: changed
      description: "Re-pinned prefect to a rebuilt image digest (no application version change)."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: prefect
      image: ghcr.io/quenchworks/images/prefect@sha256:99b3d52989c1537654490888964337547b96f365537fd47de9f25e6ae597e9ca
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

{{- $tls := include "quench-common.tls.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: {{ ternary "https" "http" (eq $tls "true") }}
      port: {{ ternary .Values.service.httpsPort .Values.service.port (eq $tls "true") }}
      targetPort: proxy
      protocol: TCP
    - name: metrics
      port: 9911
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{- if .Values.kubernetes.enabled }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.kubernetes.ingressClass }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- if .Values.kubernetes.defaultClass }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: zalando.org/skipper
{{- end }}

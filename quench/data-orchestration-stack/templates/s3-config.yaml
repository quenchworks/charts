{{- /* Where the stack's S3 bucket is, for code locations: envFrom this ConfigMap and the
Secret data-garage (access-key, secret-key). */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-s3
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: data-orchestration-stack
data:
  AWS_ENDPOINT_URL: "http://data-garage:{{ .Values.garage.service.port | default 3900 }}"
  AWS_REGION: garage
  DAGSTER_S3_BUCKET: {{ .Values.garage.config.defaultBucket | quote }}

{{- /* The first admin's password: generated once and kept on upgrade. Setup runs only on an empty
       volume, so changing it later in the UI sticks. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}

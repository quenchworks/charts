{{- include "apisix.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apisix.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /usr/local/apisix/conf/config.yaml. The image ships conf/ empty
  # and re-seeds it from the read-only conf.default/ with `cp -rn`, so this file
  # wins and everything else (mime.types, the cert templates, ...) is filled in.
  config.yaml: |-
    {{- include "apisix.configYaml" . | nindent 4 }}
  {{- if and (eq .Values.role "standalone") (eq .Values.standalone.mode "file") }}
  # Mounted over conf/apisix.yaml: the whole route table of a file-driven standalone gateway.
  apisix.yaml: |-
    {{- include "apisix.standaloneYaml" . | nindent 4 }}
  {{- end }}

{{/* A gateway's ports vary with what is switched on, so the default set is built
     from the same flags the Service uses. */}}
{{- $ports := list (dict "port" "http" "protocol" "TCP") -}}
{{- if .Values.tls.enabled }}{{- $ports = append $ports (dict "port" "https" "protocol" "TCP") -}}{{- end -}}
{{- if .Values.admin.enabled }}{{- $ports = append $ports (dict "port" "admin" "protocol" "TCP") -}}{{- end -}}
{{- if .Values.metrics.enabled }}{{- $ports = append $ports (dict "port" "metrics" "protocol" "TCP") -}}{{- end -}}
{{- include "quench-common.networkPolicy" (dict "ctx" . "defaultPorts" $ports) }}

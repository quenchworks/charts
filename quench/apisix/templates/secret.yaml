{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- $name := printf "%s-admin" (include "quench-common.fullname" .) -}}
{{/* Re-read the key we generated on a previous install, so `helm upgrade` never
     rotates it behind the operator's back and invalidates every client. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := .Values.admin.key -}}
{{- if and (not $key) $existing (index $existing.data "admin-key") -}}
{{- $key = index $existing.data "admin-key" | b64dec -}}
{{- end -}}
{{- if not $key -}}
{{- $key = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-key: {{ $key | b64enc | quote }}
{{- end }}

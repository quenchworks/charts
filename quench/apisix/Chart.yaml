apiVersion: v2
name: apisix
description: "Apache APISIX, the cloud-native API gateway built on OpenResty/LuaJIT: dynamic routing, load balancing, authentication and observability driven by an etcd-backed control plane and a REST Admin API. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.17
appVersion: "3.19.0"
keywords:
  - apisix
  - api-gateway
  - gateway
  - openresty
  - proxy
  - ingress
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/apisix
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: apisix
      image: ghcr.io/quenchworks/images/apisix@sha256:ffcad0370365828a819c7f6ec2c0460cda0588dcd6f63f1237f534518d9ceca1
    - name: etcd
      image: ghcr.io/quenchworks/images/etcd@sha256:5f78daa706e8ccf088ec59551dd1b4c192ab309575829aeda35bce95766a7c88
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  # APISIX's control plane is etcd. We depend on the catalogue's own hardened etcd
  # chart rather than vendoring a second StatefulSet: same CVE-gated image, same digest
  # pinning, same Raft/HA path. Point externalEtcd.hosts at your own cluster and set
  # etcd.enabled=false to run against an existing store.
  - name: etcd
    alias: etcd
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: etcd.enabled

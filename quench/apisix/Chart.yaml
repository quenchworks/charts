apiVersion: v2
name: apisix
description: "Apache APISIX, the cloud-native API gateway built on OpenResty/LuaJIT: dynamic routing, load balancing, authentication and observability driven by an etcd-backed control plane and a REST Admin API. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.4
appVersion: "3.18.0"
keywords:
  - apisix
  - api-gateway
  - gateway
  - openresty
  - proxy
  - ingress
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/apisix
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned to the current 0-CVE rebuild of apisix 3.18.0 (no application version change)"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: apisix
      image: ghcr.io/quenchworks/images/apisix@sha256:7dc62c07235b69192d1e7fb9b84361dfd9de0a597c714bb7f934ebb468807949
    - name: etcd
      image: ghcr.io/quenchworks/images/etcd@sha256:3c16aa8f710a1c085fcf92e3fa57338cc8d823049c9e97e993bb05280ce15319
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  # APISIX's control plane is etcd. We depend on the catalogue's own hardened etcd
  # chart rather than vendoring a second StatefulSet: same 0-CVE image, same digest
  # pinning, same Raft/HA path. Point externalEtcd.hosts at your own cluster and set
  # etcd.enabled=false to run against an existing store.
  - name: etcd
    alias: etcd
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: etcd.enabled

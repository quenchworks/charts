apiVersion: v2
name: apisix
description: "Apache APISIX, the cloud-native API gateway built on OpenResty/LuaJIT: dynamic routing, load balancing, authentication and observability driven by an etcd-backed control plane and a REST Admin API. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.28
appVersion: "3.20.0"
keywords:
  - apisix
  - api-gateway
  - gateway
  - openresty
  - proxy
  - ingress
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/apisix
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: apisix republished to a new 0-CVE digest."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: apisix
      image: ghcr.io/quenchworks/images/apisix@sha256:4d9faf752a69cdc1ccbd8b522c32c0336a49c965c6c39d0e300c01423b1d50fe
    - name: etcd
      image: ghcr.io/quenchworks/images/etcd@sha256:b6d1de2856387de2324beffdbb061e1f3ae972e2ddb22e8b65830d76d31aa7d9
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  # APISIX's control plane is etcd. We depend on the catalogue's own hardened etcd
  # chart rather than vendoring a second StatefulSet: same CVE-gated image, same digest
  # pinning, same Raft/HA path. Point externalEtcd.hosts at your own cluster and set
  # etcd.enabled=false to run against an existing store.
  - name: etcd
    alias: etcd
    version: 0.0.31
    repository: oci://ghcr.io/quenchworks/charts
    condition: etcd.enabled

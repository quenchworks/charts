apiVersion: v2
name: apisix
description: "Apache APISIX, the cloud-native API gateway built on OpenResty/LuaJIT: dynamic routing, load balancing, authentication and observability driven by an etcd-backed control plane and a REST Admin API. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "3.18.0"
keywords:
  - apisix
  - api-gateway
  - gateway
  - openresty
  - proxy
  - ingress
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/apisix
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: Apache APISIX 3.18.0 as an etcd-backed gateway (Deployment + Admin API + control API probes), with the hardened quench/etcd chart bundled as the control-plane store."
    - kind: added
      description: "Admin API key kept in a Secret and injected into config.yaml through APISIX's ${{ENV}} interpolation; a random 32-character key is generated at install when none is supplied and preserved across upgrades."
    - kind: removed
      description: "The optional APISIX Ingress Controller component is gone; it moved to its own chart, quench/apisix-ingress-controller. It was disabled by default and could never have worked: the controller hands every sync to an adc sidecar that this chart did not run, so it would have reported Ready and synced nothing. It also owns twelve cluster-scoped apisix.apache.org CRDs and an IngressClass, which a data-plane chart must not claim if two APISIX releases are ever to coexist in one cluster. Install the new chart alongside this one and point dataPlane.endpoints at this release's Admin API Service."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: apisix
      image: ghcr.io/quenchworks/images/apisix@sha256:2b242df1ab22aa04f193a55d28cdb949421d8b8c8ce42012a85ca43a9b790ab8
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  # APISIX's control plane is etcd. We depend on the catalogue's own hardened etcd
  # chart rather than vendoring a second StatefulSet: same 0-CVE image, same digest
  # pinning, same Raft/HA path. Point externalEtcd.hosts at your own cluster and set
  # etcd.enabled=false to run against an existing store.
  - name: etcd
    alias: etcd
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: etcd.enabled

apiVersion: v2
name: apisix
description: "Apache APISIX, the cloud-native API gateway built on OpenResty/LuaJIT: dynamic routing, load balancing, authentication and observability driven by an etcd-backed control plane and a REST Admin API. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.22
appVersion: "3.19.0"
keywords:
  - apisix
  - api-gateway
  - gateway
  - openresty
  - proxy
  - ingress
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/apisix
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles etcd=0.0.29 (quench-common 0.0.14 rollout)"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: apisix
      image: ghcr.io/quenchworks/images/apisix@sha256:f978d032d1b1e66383a4046b022b89d286857537709a7efe7d3a32998d86e36c
    - name: etcd
      image: ghcr.io/quenchworks/images/etcd@sha256:afc41bfbaa3d8970b21b3259e131b11fa9467f963ffed874213e04163835ebce
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  # APISIX's control plane is etcd. We depend on the catalogue's own hardened etcd
  # chart rather than vendoring a second StatefulSet: same CVE-gated image, same digest
  # pinning, same Raft/HA path. Point externalEtcd.hosts at your own cluster and set
  # etcd.enabled=false to run against an existing store.
  - name: etcd
    alias: etcd
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: etcd.enabled

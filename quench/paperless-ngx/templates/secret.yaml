{{- /* PAPERLESS_SECRET_KEY and the first admin's password: generated once and read back on upgrade (a new secret key
       logs everyone out). */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $key := get $old "secret-key" | b64dec | default (randAlphaNum 64) }}
{{- $pw := get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ $key | b64enc | quote }}
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/paperless-ngx
  digest: "sha256:238655fa4f26e775c9170f514e5a1a49010e25b88f51948d2efb0dcab2631e2f"
  pullPolicy: IfNotPresent

nameOverride: ""

# PAPERLESS_SECRET_KEY and the admin password: generated into the Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with keys "secret-key" and "admin-password" instead

# The first administrator, created by the superuser init step when no superuser exists yet.
admin:
  username: admin
  email: root@localhost
  password: ""         # generated (24 characters) if empty; read it from the Secret

# One volume holds data (database-free state: the search index, the classifier), media (the originals, archived
# PDFs and thumbnails) and the consume folder. Size it for your documents.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi
  storageClass: ""
  annotations: {}

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" (the image creates them).
postgresql:
  enabled: true
  auth:
    username: paperless
    password: ""        # generated by the subchart if empty
    database: documents
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false).
externalDatabase:
  host: ""
  port: 5432
  username: paperless
  database: paperless
  existingSecret: ""
  existingSecretKey: password

# The bundled QuenchWorks Valkey (the Celery broker), with a generated password.
valkey:
  enabled: true
  auth:
    password: ""        # generated by the subchart if empty

# Your own Redis or Valkey instead (valkey.enabled=false): a Secret holding the full redis:// URL.
externalRedis:
  existingSecret: ""
  existingSecretKey: redis-url

# More Paperless settings as environment variables, e.g. PAPERLESS_URL (required behind an Ingress),
# PAPERLESS_OCR_LANGUAGE (the image ships eng; others need their tesseract data), PAPERLESS_TIME_ZONE.
settings: {}

# The web server.
resources:
  requests: { cpu: 50m, memory: 384Mi }
  limits: { cpu: 2, memory: 1536Mi }

# The Celery worker (OCR and parsing: the heavy one) and the init steps.
worker:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 2, memory: 2Gi }

scheduler:
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Watches the consume folder; files posted through the web UI or API do not need it.
consumer:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

service:
  type: ClusterIP
  port: 8000
  annotations: {}
  externalTrafficPolicy: ""

# Paperless has no TLS listener: terminate TLS here (and set settings.PAPERLESS_URL).
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: docs.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [docs.example.com], secretName: docs-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

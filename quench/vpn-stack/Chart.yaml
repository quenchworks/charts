apiVersion: v2
name: vpn-stack
description: "A self-hosted VPN and bastion: NetBird (WireGuard mesh with single sign-on, access policies and routing peers) on a highly available PostgreSQL (a 3-member Patroni cluster that fails over on its own), plus the Warpgate bastion for SSH, HTTPS and database access with session recording. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "0.83.1"

{{- /* APP_KEY encrypts sessions and stored secrets: generated once and kept across upgrades. The
       external database password lives here too when no existingSecret is given. */}}
{{- $needKey := not .Values.appKey.existingSecret -}}
{{- $needDb := and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $needKey $needDb }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKey }}
  {{- $key := .Values.appKey.value | default (get $old "app-key" | b64dec) | default (printf "base64:%s" (randAlphaNum 32 | b64enc)) }}
  app-key: {{ $key | b64enc | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

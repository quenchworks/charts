{{- $probe := dict "httpGet" (dict "path" "/status" "port" "http") "periodSeconds" 10 "timeoutSeconds" 5 -}}
{{- $tls := include "quench-common.tls.enabled" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # One BookStack per volume: uploads and caches live there; the content is in MariaDB.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # settings are read at start: a change rolls the pod
        checksum/settings: {{ toJson (list .Values.settings .Values.appUrl) | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if $tls }}
        checksum/proxy: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # Lays out storage/ and uploads/ on the volume (subPath mounts would be root-owned) and
        # waits for the database, so the entrypoint's migration runs against a live server.
        - name: prepare
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              for d in storage/app storage/backups storage/clockwork storage/fonts/dompdf/cache storage/framework/cache \
                       storage/framework/sessions storage/framework/views storage/logs storage/uploads/files \
                       storage/uploads/images uploads; do mkdir -p "/data/$d"; done
              until php -r 'new PDO("mysql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));' 2>/dev/null; do
                echo "waiting for $DB_HOST:$DB_PORT"; sleep 3
              done
          env:
            {{- include "bookstack.dbEnv" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: bookstack
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: APP_URL, value: {{ .Values.appUrl | quote }} }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: {{ include "bookstack.keySecretName" . }}, key: {{ .Values.appKey.existingSecretKey }} } }
            {{- include "bookstack.dbEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.settings }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          # the entrypoint migrates the schema before nginx listens
          startupProbe:
            {{- if .Values.customStartupProbe }}
            {{- toYaml .Values.customStartupProbe | nindent 12 }}
            {{- else }}
            httpGet: { path: /status, port: http }
            periodSeconds: 5
            failureThreshold: 60
            {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/www/bookstack/storage, subPath: storage }
            - { name: data, mountPath: /var/www/bookstack/public/uploads, subPath: uploads }
            - { name: tmp, mountPath: /tmp }
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- if $tls }}
        - name: tls-proxy
          image: "{{ .Values.proxy.image.repository }}@{{ .Values.proxy.image.digest }}"
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - { name: XDG_CONFIG_HOME, value: /tmp }
            - { name: XDG_DATA_HOME, value: /tmp }
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: https, containerPort: 8443, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - { name: proxy-config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true }
            - { name: proxy-tmp, mountPath: /tmp }
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
        {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bookstack.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $tls }}
        - name: proxy-config
          configMap:
            name: {{ include "quench-common.fullname" . }}-proxy
        - name: proxy-tmp
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

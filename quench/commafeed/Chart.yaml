apiVersion: v2
name: commafeed
description: "CommaFeed: a self-hosted RSS reader inspired by Google Reader, with the bundled PostgreSQL. Hardened by QuenchWorks: CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "7.5.3"
keywords:
  - commafeed
  - rss
  - feed-reader
  - atom
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Athou/commafeed
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned commafeed to a rebuilt image digest (no application version change). Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: commafeed
      image: ghcr.io/quenchworks/images/commafeed@sha256:8daf8a22fdcdf29d95c1bdafb01e414b636e4539c76c87ced470021a58949725
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

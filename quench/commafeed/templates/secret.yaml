{{- /* The Quarkus session encryption key (form-login cookies), generated once and kept on upgrade so sessions survive
       restarts. The first admin account is created in the web UI (or POST /rest/user/initialSetup) on first visit. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $key := get $old "session-key" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ $key | b64enc | quote }}
{{- end }}

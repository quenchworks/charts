{{/*
The userlist.txt Secret PgBouncer reads as its auth_file. Each line is:
    "username" "password-or-scram-verifier"
With auth_type=scram-sha-256 a plaintext password works: PgBouncer uses it to verify the
client over SCRAM AND to authenticate to the backend PostgreSQL. We generate an entry for
the backend user from the deterministic credentials, plus any userlist.extraUsers. When
userlist.existingSecret is set, the user owns the file and we render nothing.
*/}}
{{- if not .Values.userlist.existingSecret }}
{{- $user := include "pgbouncer.db.user" . -}}
{{- $pw := include "pgbouncer.db.password" . -}}
{{- $lines := list (printf "\"%s\" \"%s\"" $user $pw) -}}
{{- range $u, $p := .Values.userlist.extraUsers -}}
{{- $lines = append $lines (printf "\"%s\" \"%s\"" $u $p) -}}
{{- end -}}
{{- $userlist := printf "%s\n" (join "\n" $lines) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-userlist" (include "quench-common.fullname" .) }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  userlist.txt: {{ $userlist | b64enc | quote }}
{{- end }}

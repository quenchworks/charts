{{/*
The pgbouncer.ini the runtime actually reads. The image's entrypoint runs
`/usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini`, so this ConfigMap is mounted at that
exact path. Changing it rolls the Deployment via the checksum annotation.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgbouncer.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  pgbouncer.ini: |
    {{- include "pgbouncer.ini" . | nindent 4 }}

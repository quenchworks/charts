apiVersion: v2
name: pgbouncer
description: Quenchworks hardened PgBouncer — lightweight connection pooler for PostgreSQL. Minimal, nonroot, 0-CVE image pinned by digest; pools client connections in front of a bundled or external PostgreSQL backend.
type: application
version: 0.0.1
appVersion: "1.25.2"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/pgbouncer/pgbouncer
annotations:
  artifacthub.io/license: ISC
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

      image: ghcr.io/quenchworks/images/pgbouncer@sha256:d066975c823555e37d2cf7d51a0c9ec8b0d68f4654dbe51481ce47ed03c9481f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:086dc72597074662dfb828f7f58a0093f98123405cf4bc109a1bd859bc576f21
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

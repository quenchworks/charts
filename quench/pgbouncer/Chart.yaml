      image: ghcr.io/quenchworks/images/pgbouncer@sha256:1fca5abb0ff99769aeb22963b5c0f4e8188cb7dacd1272cef5611c67db96d57d
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b

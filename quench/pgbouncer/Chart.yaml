apiVersion: v2
name: pgbouncer
description: "Lightweight connection pooler for PostgreSQL that fronts thousands of client connections with a small backend pool, cutting per-connection overhead. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.21
appVersion: "1.25.2"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
keywords:
  - pgbouncer
  - postgresql
  - connection-pooler
  - database
  - pooler
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/pgbouncer/pgbouncer
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled PostgreSQL moves to 0.0.26 (18.6 rebuilt: Patroni psycopg no longer carries its own OpenSSL 3.5.8)."
  artifacthub.io/license: ISC
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: database
  artifacthub.io/images: |

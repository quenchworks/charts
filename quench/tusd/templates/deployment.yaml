{{- $scheme := ternary "HTTPS" "HTTP" (and .Values.tls.enabled true) -}}
{{- $probe := dict "httpGet" (dict "path" "/metrics" "port" "http" "scheme" $scheme) "initialDelaySeconds" 3 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (list .Values.tls .Values.s3 .Values.basePath .Values.behindProxy) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: tusd
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -port=8080
            - -base-path={{ .Values.basePath }}
            {{- if .Values.s3.bucket }}
            - -s3-bucket={{ .Values.s3.bucket }}
            {{- with .Values.s3.endpoint }}
            - -s3-endpoint={{ . }}
            {{- end }}
            {{- with .Values.s3.objectPrefix }}
            - -s3-object-prefix={{ . }}
            {{- end }}
            {{- else }}
            - -upload-dir=/data
            {{- end }}
            {{- if .Values.behindProxy }}
            - -behind-proxy
            {{- end }}
            {{- if .Values.tls.enabled }}
            - -tls-certificate=/tls/tls.crt
            - -tls-key=/tls/tls.key
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.s3.bucket }}
          envFrom:
            - secretRef:
                name: {{ required "s3.existingSecret: a Secret with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION" .Values.s3.existingSecret }}
          {{- end }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "tusd.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if and .Values.persistence.enabled (not .Values.s3.bucket) }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- if and .Values.persistence.enabled (not .Values.s3.bucket) }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "tusd.pvcName" . }}
        {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

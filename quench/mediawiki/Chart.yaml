apiVersion: v2
name: mediawiki
description: Hardened MediaWiki (PHP-FPM + nginx) on a 0-CVE nonroot image. Installs its schema on first start, into SQLite by default or an external MySQL or PostgreSQL.
type: application
version: 0.0.1
appVersion: "1.46.0"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/wikimedia/mediawiki
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - mediawiki
  - wiki
  - knowledge-base
  - documentation
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: MediaWiki 1.46 with first-start schema install and update, SQLite or external MySQL/PostgreSQL."
  # A wiki is a web application; ArtifactHub's category enum has no bucket for it,
  # so this uses the explicit "no category fits" value, like wordpress and ghost.
  category: skip-prediction
  licenses: GPL-2.0-or-later
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://www.mediawiki.org
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: mediawiki
      image: ghcr.io/quenchworks/images/mediawiki@sha256:2b933c82fc82cf39cd64a704c3b6d82972cba71f340b5fb7b6a05fe457c24efb
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

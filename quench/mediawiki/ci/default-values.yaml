# Install gate, SQLite path. No image override: the gate pulls the chart's real,
# CI-maintained digest. $wgServer matches the gate's port-forward so redirects
# and absolute links resolve; the admin password is fixed so the gate can log in.
mediawiki:
  server: "http://127.0.0.1:8080"
  admin:
    username: Admin
    password: ci-Quench-wiki-2026
database:
  type: sqlite
  sqlite:
    persistence:
      size: 1Gi
persistence:
  size: 1Gi

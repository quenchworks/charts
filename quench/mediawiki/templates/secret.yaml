{{/*
The managed Secret always carries the wiki's secret-key ($wgSecretKey, 64 hex) and
upgrade-key ($wgUpgradeKey), plus the admin password and the DB password unless an
existingSecret supplies them. Every value is read back from the live Secret first,
so it stays stable across upgrades: a new secret key logs every user out, and a
new DB password would no longer match the database.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $sk := index $prior "secret-key" | default "" | b64dec }}
  {{- if not $sk }}{{- $sk = randAlphaNum 64 | sha256sum }}{{- end }}
  secret-key: {{ $sk | b64enc | quote }}
  {{- $uk := index $prior "upgrade-key" | default "" | b64dec }}
  {{- if not $uk }}{{- $uk = randAlphaNum 32 | sha256sum | trunc 16 }}{{- end }}
  upgrade-key: {{ $uk | b64enc | quote }}
  {{- if not .Values.mediawiki.admin.existingSecret }}
  {{- $ap := .Values.mediawiki.admin.password }}
  {{- if not $ap }}{{- $ap = index $prior "admin-password" | default "" | b64dec }}{{- end }}
  {{- if not $ap }}{{- $ap = randAlphaNum 24 }}{{- end }}
  admin-password: {{ $ap | b64enc | quote }}
  {{- end }}
  {{- if and (include "mediawiki.db.external" .) (not .Values.database.existingSecret) }}
  {{- $dp := .Values.database.password }}
  {{- if not $dp }}{{- $dp = index $prior "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $dp }}{{- $dp = randAlphaNum 24 }}{{- end }}
  db-password: {{ $dp | b64enc | quote }}
  {{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Readers and editors. Limited to the release namespace unless allowExternal
    # (front the wiki with an ingress/TLS proxy when you open it).
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if include "mediawiki.db.external" . }}
    - ports:
        - port: {{ include "mediawiki.db.port" . }}
          protocol: TCP
    {{- end }}
    # General egress: mail, InstantCommons, extensions that call out.
    - {}
{{- end }}

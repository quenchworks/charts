{{/* Both probes GET the VCL's health path, which Varnish answers from vcl_synth --
     a real HTTP round trip through varnishd, but independent of the backend, so a
     sick origin does not restart the cache. A tcpSocket probe would stay green on a
     varnishd whose child had died. */}}
{{- $health := dict "httpGet" (dict "path" .Values.vcl.healthPath "port" "http") -}}
{{- $liveness := merge (dict "initialDelaySeconds" 10 "periodSeconds" 15) (deepCopy $health) -}}
{{- $readiness := merge (dict "initialDelaySeconds" 3 "periodSeconds" 10) (deepCopy $health) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # varnishd parses the VCL only at startup, so a ConfigMap edit alone would
        # leave every pod serving the old policy. This rolls them.
        checksum/vcl: {{ include "varnish.vcl" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "varnish.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: varnish
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/varnishd"]
          args:
            # -F keeps the manager in the foreground as PID 1.
            - "-F"
            - "-f"
            - "/etc/varnish/default.vcl"
            - "-a"
            - "0.0.0.0:8080"
            # The varnishadm CLI is bound to loopback ON PURPOSE: it is a full admin
            # channel (vcl.load, ban, param.set). Reach it with
            # `kubectl exec ... -- varnishadm -n /var/lib/varnish <cmd>`, which finds
            # the address and the shared secret in the working directory.
            - "-T"
            - "127.0.0.1:6082"
            - "-n"
            - "/var/lib/varnish"
            - "-s"
            - "malloc,{{ .Values.cacheSize }}"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # subPath so the mount lands as a FILE over the image's baked default.
            - name: vcl
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
              readOnly: true
            # varnishd's working directory (-n): the shared-memory log, the CLI
            # secret and the VCL it compiles into a shared object all live here, so
            # it must be writable AND executable (emptyDir is both; a noexec mount
            # makes varnishd refuse to start).
            - name: workdir
              mountPath: /var/lib/varnish
            # varnishd has no VCL interpreter -- it shells out to gcc at every start
            # and gcc needs scratch space on a read-only rootfs.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: vcl
          configMap:
            name: {{ include "varnish.mountedConfigMap" . }}
        - name: workdir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # service.port is what clients use (80 by default); the container listens on
    # 8080, because nonroot cannot bind a privileged port.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

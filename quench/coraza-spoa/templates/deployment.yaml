apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      containers:
        - name: coraza-spoa
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          ports:
            - { name: spop, containerPort: 9000, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: spop }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: spop }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/coraza-spoa, readOnly: true }
            # Coraza buffers request bodies here and checks it is writable at start
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: config
          configMap: { name: {{ include "quench-common.fullname" . }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: spop, port: {{ .Values.service.port }}, targetPort: spop, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

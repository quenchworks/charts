{{- $fn := include "quench-common.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # installs or updates the controller's CRDs from the definitions embedded in this image, then exits
        - name: crds
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          command: [/haproxy-ingress-controller, --job-check-crd]
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: controller
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          args:
            - --configmap={{ .Release.Namespace }}/{{ $fn }}
            - --ingress.class={{ .Values.ingressClass.name }}
            - --publish-service={{ .Release.Namespace }}/{{ $fn }}
            {{- with .Values.extraArgs }}{{- toYaml . | nindent 12 }}{{- end }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: stats, containerPort: 1024, protocol: TCP }
            - { name: healthz, containerPort: 1042, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: healthz }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /healthz, port: healthz }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: etc-haproxy, mountPath: /etc/haproxy }
            - { name: run, mountPath: /run }
            - { name: state, mountPath: /var/state/haproxy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: etc-haproxy, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: state, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.httpPort }}, targetPort: http, protocol: TCP }
    - { name: https, port: {{ .Values.service.httpsPort }}, targetPort: https, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

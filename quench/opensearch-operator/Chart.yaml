apiVersion: v2
name: opensearch-operator
description: "OpenSearch Operator: run OpenSearch clusters and OpenSearch Dashboards from OpenSearchCluster custom resources, with rolling upgrades, scaling, security configuration and TLS. The CRDs ship with the chart. Hardened by QuenchWorks: the operator is built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "3.0.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - opensearch
  - opensearch-operator
  - search
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/opensearch-project/opensearch-k8s-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: OpenSearch Operator 3.0.0 with its opensearch.org CRDs"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: opensearch-operator
      image: ghcr.io/quenchworks/images/opensearch-operator@sha256:f8ab0294f71b84b0c0a3c36e899b661a8a3683cc9c3f77be0dff05fc7bc07171
  artifacthub.io/crds: |
    - kind: OpensearchActionGroup
      version: v1
      name: opensearchactiongroups.opensearch.org
      displayName: Action Group
      description: A security action group.
    - kind: OpenSearchCluster
      version: v1
      name: opensearchclusters.opensearch.org
      displayName: OpenSearch Cluster
      description: An OpenSearch cluster, its node pools and optional Dashboards.
    - kind: OpensearchComponentTemplate
      version: v1
      name: opensearchcomponenttemplates.opensearch.org
      displayName: Component Template
      description: A component template.
    - kind: OpensearchIndexTemplate
      version: v1
      name: opensearchindextemplates.opensearch.org
      displayName: Index Template
      description: An index template.
    - kind: OpenSearchISMPolicy
      version: v1
      name: opensearchismpolicies.opensearch.org
      displayName: ISM Policy
      description: An Index State Management policy.
    - kind: OpensearchRole
      version: v1
      name: opensearchroles.opensearch.org
      displayName: Role
      description: A security role.
    - kind: OpensearchSnapshotPolicy
      version: v1
      name: opensearchsnapshotpolicies.opensearch.org
      displayName: Snapshot Policy
      description: A snapshot management policy.
    - kind: OpensearchTenant
      version: v1
      name: opensearchtenants.opensearch.org
      displayName: Tenant
      description: A Dashboards tenant.
    - kind: OpensearchUserRoleBinding
      version: v1
      name: opensearchuserrolebindings.opensearch.org
      displayName: User Role Binding
      description: Binds users and backend roles to security roles.
    - kind: OpensearchUser
      version: v1
      name: opensearchusers.opensearch.org
      displayName: User
      description: A user in the security plugin.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts

    rules:
      - { apiGroups: [opensearch.org], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [opensearchusers] }
  - name: vopensearchuserrolebinding.opensearch.org
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      caBundle: {{ $ca }}
      service: { name: {{ $svc }}, namespace: {{ $ns }}, path: /validate-opensearch-org-v1-opensearchuserrolebinding }
    rules:
      - { apiGroups: [opensearch.org], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [opensearchuserrolebindings] }
{{- end }}

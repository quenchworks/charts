  - name: vopensearchsnapshotpolicy.opensearch.org
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      caBundle: {{ $ca }}
      service: { name: {{ $svc }}, namespace: {{ $ns }}, path: /validate-opensearch-org-v1-opensearchsnapshotpolicy }
    rules:

    rules:
      - { apiGroups: [opensearch.org], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [opensearchindextemplates] }
  - name: vopensearchismpolicy.opensearch.org
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      caBundle: {{ $ca }}
      service: { name: {{ $svc }}, namespace: {{ $ns }}, path: /validate-opensearch-org-v1-opensearchismpolicy }
    rules:
      - { apiGroups: [opensearch.org], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [opensearchismpolicies] }
  - name: vopensearchrole.opensearch.org
    admissionReviewVersions: [v1]
    sideEffects: None

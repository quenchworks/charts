apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: metrics, port: {{ .Values.service.port }}, targetPort: metrics, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

# The digests below are the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. Never a tag.
image:
  repository: ghcr.io/quenchworks/images/opensearch-operator
  digest: "sha256:237abeaf85528b2b6ed1a9e4a91b582e7b63e04f18b8e32a7c9fd0f1d01e030e"
  pullPolicy: IfNotPresent

# Validating webhooks for OpenSearchCluster and the other opensearch.org resources. The chart
# generates the CA and serving certificate once (no cert-manager needed).
webhook:
  enabled: true
  failurePolicy: Fail   # Fail or Ignore

nameOverride: ""

# Namespaces to watch (--watch-namespace). Empty: every namespace.
watchNamespaces: []

logLevel: info      # --loglevel: debug, info, warn, error
# More operator flags, e.g. ["--max-concurrent-reconciles=2"]
extraArgs: []

# Leader election is always on; extra replicas are warm standbys.
replicaCount: 1

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 512Mi }

service:
  type: ClusterIP
  port: 8443
  annotations: {}

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

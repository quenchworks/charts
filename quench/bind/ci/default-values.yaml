# Install gate: an authoritative test zone next to the default resolver config.
replicaCount: 1
config: |
  options {
      directory "/tmp";
      pid-file none;
      listen-on port 5353 { any; };
      recursion no;
      allow-query { any; };
  };
  zone "quench.test" { type primary; file "/etc/named/zones/quench.test.zone"; };
zones:
  quench.test.zone: |
    $TTL 60
    @   IN SOA ns.quench.test. admin.quench.test. 1 60 60 600 60
    @   IN NS  ns.quench.test.
    ns  IN A   192.0.2.1
    www IN A   192.0.2.80

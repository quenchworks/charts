# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/baikal
  digest: "sha256:46acb117567e82334d43db918bd464f93a815a04eded09657514719f6440f736"
  pullPolicy: IfNotPresent

nameOverride: ""

# Baikal keeps config/ and Specific/ (the SQLite database) on the data volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The admin page (/admin, user admin), written into baikal.yaml on the first start in place of the install
# wizard. Empty password: generated into the Secret <fullname> (admin-password). Change it later in /admin.
adminPassword: ""

# An optional first DAV user (its principal, default calendar and address book are created on the first
# start). Empty username: no user; add users in /admin. Empty password: generated (dav-password).
davUser:
  username: ""
  email: ""
  password: ""

# HTTP auth for CalDAV/CardDAV clients: Digest (Baikal's default) or Basic (use it with TLS).
davAuthType: Digest
timezone: UTC

# The data volume: config/ and Specific/ (/var/lib/baikal).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { cpu: 1, memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: nginx serves HTTPS instead of HTTP on its one port from the PEM pair at /tls. The
# certificate comes from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

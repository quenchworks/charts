{{- /* The admin and DAV user passwords: generated once and read back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.adminPassword | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}
  dav-password: {{ .Values.davUser.password | default (get $old "dav-password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}

{{- if not .Values.backend.existingSecret }}
{{- if not .Values.backend.url }}
{{- fail "ferretdb: set backend.url (a postgres:// URL to the DocumentDB-extended PostgreSQL) or backend.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backend" (include "quench-common.fullname" .) }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-url: {{ .Values.backend.url | b64enc | quote }}
{{- end }}

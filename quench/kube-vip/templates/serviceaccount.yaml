{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-vip.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# kube-vip authenticates to the API server with this token, so it must be mounted.
automountServiceAccountToken: true
{{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/ghostfolio
  digest: "sha256:2102e09e1c8d19d44930918a695f77b6e1b01bfc7a217a77b2d597c555a2a217"
  pullPolicy: IfNotPresent

nameOverride: ""

# Stateless (data in PostgreSQL, cache and queues in Valkey): more replicas are fine.
replicaCount: 1
updateStrategy:
  type: RollingUpdate

# ACCESS_TOKEN_SALT and JWT_SECRET_KEY: generated into the Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with keys "access-token-salt" and "jwt-secret-key" instead

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" (the image creates them).
postgresql:
  enabled: true
  auth:
    username: ghostfolio
    password: ""        # generated by the subchart if empty
    database: portfolio
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false): a Secret holding the full DATABASE_URL.
externalDatabase:
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# The bundled QuenchWorks Valkey (Ghostfolio's cache and job queues), with a generated password.
valkey:
  enabled: true
  auth:
    password: ""        # generated by the subchart if empty

# Your own Redis or Valkey instead (valkey.enabled=false).
externalRedis:
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretKey: redis-password

# More Ghostfolio settings as environment variables. After creating your own account, close sign-up in the admin
# control panel (Settings > User Signup). Data providers take keys here too, e.g. API_KEY_COINGECKO_DEMO.
settings: {}

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 3333
  annotations: {}
  externalTrafficPolicy: ""

# Ghostfolio has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: money.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [money.example.com], secretName: money-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

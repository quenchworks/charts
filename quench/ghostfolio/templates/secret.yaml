{{- /* ACCESS_TOKEN_SALT and JWT_SECRET_KEY: generated once and read back on upgrade (changing the salt invalidates
       every access token). */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $salt := get $old "access-token-salt" | b64dec | default (randAlphaNum 48) }}
{{- $jwt := get $old "jwt-secret-key" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  access-token-salt: {{ $salt | b64enc | quote }}
  jwt-secret-key: {{ $jwt | b64enc | quote }}
{{- end }}

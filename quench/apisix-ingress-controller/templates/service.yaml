{{/*
Metrics only. The controller serves no traffic: it is a client of the API server
and of the data plane's Admin API. /healthz and /readyz stay pod-local, the way
upstream's own metrics_service.yaml has it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{/*
The chart-managed Secret carries the Typesense API key. It is rendered UNLESS the
user points auth.existingSecret at their own Secret. Key resolution:
  - auth.apiKey set               -> use that literal value
  - unset, prior Secret exists    -> preserve the previously generated key (lookup)
  - unset, no prior Secret        -> generate a strong 40-char random key once
This makes `helm upgrade` idempotent: the generated key survives upgrades, and
Typesense (which refuses to start without --api-key) always has a key to satisfy.
*/}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "typesense.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := .Values.auth.apiKey -}}
{{- if and (not $key) $existing -}}
{{- $key = index $existing.data "api-key" | b64dec -}}
{{- end -}}
{{- if not $key -}}
{{- $key = randAlphaNum 40 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}
{{- end }}

# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false        # emptyDir at /data for the gate
auth:
  # Fixed test API key so the gate can assert auth deterministically (with/without).
  apiKey: "citest-api-key-0123456789abcdef"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

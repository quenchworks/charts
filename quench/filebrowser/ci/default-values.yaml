# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and File Browser
# writes its SQLite DB to it. File Browser generates a random admin password on
# first boot (printed to the pod logs); the gate only checks that /health is 200.
persistence:
  enabled: true
  size: 1Gi

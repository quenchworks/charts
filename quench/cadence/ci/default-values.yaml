# Standalone install gate. No image override: uses the chart's real CI-maintained
# digest. Bundles the QuenchWorks Cassandra subchart with persistence off and a small
# heap for a quick boot; few history shards; small cadence resources.
cassandra:
  enabled: true
  auth:
    enabled: false
  persistence:
    enabled: false
  config:
    clusterName: "Cadence CI"
    maxHeapSize: 512M
    heapNewSize: 128M
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }

# Few shards => faster schema setup + boot on the runner. (Fixed at first setup.)
numHistoryShards: 4

schemaSetup:
  replicationFactor: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1536Mi }

    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial QuenchWorks release: hardened, digest-pinned, cosign-signed Cadence all-in-one server (frontend + history + matching + worker) with a bundled Cassandra subchart (self-contained), shell-free schema bootstrap of both keyspaces via cadence-cassandra-tool init containers, and an external-Cassandra option."

      image: ghcr.io/quenchworks/images/cadence@sha256:1c713ffef674d91632f2836cb88586de87171c78f95258792bf8ea79c7a1d996
    - name: cassandra
      image: ghcr.io/quenchworks/images/cassandra@sha256:688f215f101f830eabe46ed83bd7a62fc0d092007a516c00ee5bfb26b7268e1b

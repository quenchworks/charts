{{/*
Managed Secret carrying cassandra-password — the password the schema-bootstrap init
containers use to reach Cassandra. Rendered only when a password is in play (bundled
Cassandra with auth enabled, or an external Cassandra whose password is supplied
inline) AND no externalCassandra.existingSecret is provided (then the caller's Secret
is used directly). With the default (auth disabled) no Secret is created.
*/}}
{{- $pw := include "cadence.cassandra.password" . -}}
{{- $useOwnSecret := not (and (not .Values.cassandra.enabled) .Values.externalCassandra.existingSecret) -}}
{{- if and $pw $useOwnSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  cassandra-password: {{ $pw | b64enc | quote }}
{{- end }}

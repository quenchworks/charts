apiVersion: v2
name: opentelemetry-operator
description: "The OpenTelemetry Operator: OpenTelemetryCollector resources run as deployments, daemonsets, statefulsets or sidecars, the target allocator, and auto-instrumentation injection through the Instrumentation resource. Webhook certificates issued by the chart, no cert-manager. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.13
appVersion: "0.159.0"
keywords:
  - opentelemetry
  - otel
  - operator
  - collector
  - auto-instrumentation
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/open-telemetry/opentelemetry-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: opentelemetry-operator
      image: ghcr.io/quenchworks/images/opentelemetry-operator@sha256:7fce446b805f5e753f75ae8025c9b599b0693bdc14293b602ab79ba1d9ff006e
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:c47ea76447d7c83289e07ae418107d4f581e9a16534691e8bd1c6916040f7c38
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: OpenTelemetryCollector
      version: v1beta1
      name: opentelemetrycollectors.opentelemetry.io
      displayName: OpenTelemetryCollector
      description: A collector the operator deploys and configures.
    - kind: Instrumentation
      version: v1alpha1
      name: instrumentations.opentelemetry.io
      displayName: Instrumentation
      description: Auto-instrumentation settings injected into annotated pods.
    - kind: TargetAllocator
      version: v1alpha1
      name: targetallocators.opentelemetry.io
      displayName: TargetAllocator
      description: Distributes Prometheus scrape targets across collectors.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

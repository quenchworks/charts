apiVersion: v2
name: opentelemetry-operator
description: "The OpenTelemetry Operator: OpenTelemetryCollector resources run as deployments, daemonsets, statefulsets or sidecars, the target allocator, and auto-instrumentation injection through the Instrumentation resource. Webhook certificates issued by the chart, no cert-manager. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.159.0"
keywords:
  - opentelemetry
  - otel
  - operator
  - collector
  - auto-instrumentation
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/open-telemetry/opentelemetry-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: the OpenTelemetry Operator 0.159.0 with its CRDs, chart-issued webhook certificates and the QuenchWorks collector as the default collector image."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: opentelemetry-operator
      image: ghcr.io/quenchworks/images/opentelemetry-operator@sha256:3c9a6c23f189e36c8ed274459a71d8e47caa1805a38f4244f52138c8e6590ee4
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:19e461bc40f0e4e16cd02792d94fc0ce60fa48a0400ce1422044f9f77acd0a17
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: OpenTelemetryCollector
      version: v1beta1
      name: opentelemetrycollectors.opentelemetry.io
      displayName: OpenTelemetryCollector
      description: A collector the operator deploys and configures.
    - kind: Instrumentation
      version: v1alpha1
      name: instrumentations.opentelemetry.io
      displayName: Instrumentation
      description: Auto-instrumentation settings injected into annotated pods.
    - kind: TargetAllocator
      version: v1alpha1
      name: targetallocators.opentelemetry.io
      displayName: TargetAllocator
      description: Distributes Prometheus scrape targets across collectors.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

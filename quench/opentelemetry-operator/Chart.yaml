apiVersion: v2
name: opentelemetry-operator
description: "The OpenTelemetry Operator: OpenTelemetryCollector resources run as deployments, daemonsets, statefulsets or sidecars, the target allocator, and auto-instrumentation injection through the Instrumentation resource. Webhook certificates issued by the chart, no cert-manager. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.8
appVersion: "0.159.0"
keywords:
  - opentelemetry
  - otel
  - operator
  - collector
  - auto-instrumentation
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/open-telemetry/opentelemetry-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 updates"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: opentelemetry-operator
      image: ghcr.io/quenchworks/images/opentelemetry-operator@sha256:2bf73ce496d47add5d0cca252fdf995e9642e7735faf8aad62df87c2243df6cb
    - name: otel-collector
      image: ghcr.io/quenchworks/images/otel-collector@sha256:0ce79becfe3f9e76e6da1a0a2249b519c79973996f6981eda57c7598139dae74
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: OpenTelemetryCollector
      version: v1beta1
      name: opentelemetrycollectors.opentelemetry.io
      displayName: OpenTelemetryCollector
      description: A collector the operator deploys and configures.
    - kind: Instrumentation
      version: v1alpha1
      name: instrumentations.opentelemetry.io
      displayName: Instrumentation
      description: Auto-instrumentation settings injected into annotated pods.
    - kind: TargetAllocator
      version: v1alpha1
      name: targetallocators.opentelemetry.io
      displayName: TargetAllocator
      description: Distributes Prometheus scrape targets across collectors.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

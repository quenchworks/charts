apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-webhook
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  ports:
    - { name: https, port: 443, targetPort: webhook }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

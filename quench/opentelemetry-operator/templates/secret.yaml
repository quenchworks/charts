{{- include "otelop.ensureCerts" . }}
# The webhook serving certificate and its CA, generated by the chart (no cert-manager).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otelop.certSecret" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ index .Values.__otelopCerts "ca" }}
  tls.crt: {{ index .Values.__otelopCerts "crt" }}
  tls.key: {{ index .Values.__otelopCerts "key" }}

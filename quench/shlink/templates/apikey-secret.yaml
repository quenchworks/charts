{{- if not .Values.apiKey.existingSecret }}
{{- $name := include "shlink.apiKeySecret" . -}}
{{/* Generated once, then re-read on every upgrade: Shlink only creates INITIAL_API_KEY on its
     first start, so a rotated value would leave the Secret naming a key Shlink never made. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing (index $existing.data .Values.apiKey.existingSecretKey) -}}
{{- $key = index $existing.data .Values.apiKey.existingSecretKey | b64dec -}}
{{- else -}}
{{- $key = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.apiKey.existingSecretKey }}: {{ $key | b64enc | quote }}
{{- end }}

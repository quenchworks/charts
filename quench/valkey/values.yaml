# The digest below is the contract with the image factory. CI rewrites it from
# manifests/valkey.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/valkey
  digest: "sha256:763d278fba9d410a22af68d59d230c940facc1da9c9d604363dabaafcbddd774"
  pullPolicy: IfNotPresent

nameOverride: ""

# standalone: one server. replication: one primary plus N read replicas (replicaof).
architecture: standalone

# Authentication. On by default. A random password is generated if you do not set one.
auth:
  enabled: true
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

# Extra redis.conf lines and flags. config is rendered into a ConfigMap; existingConfigmap
# takes precedence when set. extraFlags are appended to the server command.
config: |
  appendonly yes
  save 900 1
  save 300 10
existingConfigmap: ""
extraFlags: []

# In-transit TLS. Provide a secret with tls.crt, tls.key, and ca.crt.
tls:
  enabled: false
  existingSecret: ""
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt
  authClients: true

primary:
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 6379

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# Prometheus metrics via a hardened redis_exporter sidecar, built by our own factory.
# redis_exporter speaks the same RESP protocol, so it scrapes Valkey unchanged.
metrics:
  enabled: false
  image:
    repository: ghcr.io/quenchworks/images/redis-exporter
    digest: "sha256:a09fd57674c285c3a7a8efe8f8fe5d7288182b5e3695a848acd65695c8309b9a"
    pullPolicy: IfNotPresent
  port: 9121
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

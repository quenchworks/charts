apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: gateway
      port: {{ .Values.service.gatewayPort }}
      targetPort: gateway
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-headless
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: api
      port: 5001
      targetPort: api
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
{{- if .Values.swarm.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-swarm
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.swarm.service.type }}
  ports:
    - name: swarm
      port: {{ .Values.swarm.service.port }}
      targetPort: swarm
      protocol: TCP
    - name: swarm-udp
      port: {{ .Values.swarm.service.port }}
      targetPort: swarm-udp
      protocol: UDP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
{{- end }}

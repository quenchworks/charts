apiVersion: v2
name: cert-manager
description: "cert-manager: automated X.509 certificate management for Kubernetes. Issues and renews certificates from ACME (Let's Encrypt), self-signed, CA, Vault and other Issuers via the Certificate/Issuer/ClusterIssuer CRDs. Hardened by QuenchWorks as minimal, nonroot, 0-CVE images, cosign-signed and pinned by digest. Runs the controller, webhook and cainjector as three deployments; the webhook self-bootstraps its serving CA and the cainjector injects that CA bundle into the admission webhooks, so no external cert-manager dependency is required."
type: application
version: 0.0.7
appVersion: "1.21.1"
keywords:
  - cert-manager
  - certificates
  - tls
  - acme
  - lets-encrypt
  - x509
  - pki
  - kubernetes
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: cert-manager-controller republished to a new 0-CVE digest."
  artifacthub.io/images: |
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:93adc307564d529c46d0f49f25afb1c5bb02763a509f7fccc420e7fcd183a668
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:d38af9c80a48ef98cbf42d67782dce4b432ec0a0d2d7e54a9125a08f91bb7272
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:39e728f3a7dfcf03d5ad1c8d4e9c7bfe738ed804ebc8b230c04c0b7fd9fe272a
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:eed02d36d3755c979aeb50720dfff7c0b2b80c5fe44d8e4e106c4679a495701f
  artifacthub.io/crds: |
    - kind: Certificate
      version: v1
      name: certificates.cert-manager.io
      displayName: Certificate
      description: A signed X.509 certificate stored in a Kubernetes Secret, kept renewed by cert-manager.
    - kind: Issuer
      version: v1
      name: issuers.cert-manager.io
      displayName: Issuer
      description: Namespaced certificate authority configuration (ACME, CA, SelfSigned, Vault, Venafi).
    - kind: ClusterIssuer
      version: v1
      name: clusterissuers.cert-manager.io
      displayName: ClusterIssuer
      description: Cluster-scoped certificate authority configuration usable from any namespace.
    - kind: CertificateRequest
      version: v1
      name: certificaterequests.cert-manager.io
      displayName: CertificateRequest
      description: A one-shot request to an Issuer for a signed certificate.
    - kind: Order
      version: v1
      name: orders.acme.cert-manager.io
      displayName: Order
      description: An in-progress ACME order created by the controller for an ACME Certificate.
    - kind: Challenge
      version: v1
      name: challenges.acme.cert-manager.io
      displayName: Challenge
      description: An individual ACME challenge (http-01/dns-01) the controller solves to fulfil an Order.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: cert-manager
description: "cert-manager: automated X.509 certificate management for Kubernetes. Issues and renews certificates from ACME (Let's Encrypt), self-signed, CA, Vault and other Issuers via the Certificate/Issuer/ClusterIssuer CRDs. Hardened by QuenchWorks as minimal, nonroot, CVE-gated images, cosign-signed and pinned by digest. Runs the controller, webhook and cainjector as three deployments; the webhook self-bootstraps its serving CA and the cainjector injects that CA bundle into the admission webhooks, so no external cert-manager dependency is required."
type: application
version: 0.0.18
appVersion: "1.21.2"
keywords:
  - cert-manager
  - certificates
  - tls
  - acme
  - lets-encrypt
  - x509
  - pki
  - kubernetes
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/images: |
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:1a6416e70ae53643d2b4328c74db000a9c61205afdc1c04d57479244588b9aa4
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:c03c1938b5575525acd96b442eaafb801fade7d59f737842b9ea51d5c5a49d07
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:3b5cccafb7e256aa415b7688b7d6834501b1fc946d1972bce86ada503a30f2e9
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:c528e174576e39d012e7ffbff815619ff1ed2eab174c9538953c7adcbc49a76d
  artifacthub.io/crds: |
    - kind: Certificate
      version: v1
      name: certificates.cert-manager.io
      displayName: Certificate
      description: A signed X.509 certificate stored in a Kubernetes Secret, kept renewed by cert-manager.
    - kind: Issuer
      version: v1
      name: issuers.cert-manager.io
      displayName: Issuer
      description: Namespaced certificate authority configuration (ACME, CA, SelfSigned, Vault, Venafi).
    - kind: ClusterIssuer
      version: v1
      name: clusterissuers.cert-manager.io
      displayName: ClusterIssuer
      description: Cluster-scoped certificate authority configuration usable from any namespace.
    - kind: CertificateRequest
      version: v1
      name: certificaterequests.cert-manager.io
      displayName: CertificateRequest
      description: A one-shot request to an Issuer for a signed certificate.
    - kind: Order
      version: v1
      name: orders.acme.cert-manager.io
      displayName: Order
      description: An in-progress ACME order created by the controller for an ACME Certificate.
    - kind: Challenge
      version: v1
      name: challenges.acme.cert-manager.io
      displayName: Challenge
      description: An individual ACME challenge (http-01/dns-01) the controller solves to fulfil an Order.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

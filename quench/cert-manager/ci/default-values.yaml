# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digests from values.yaml, so the gate pulls the actual signed
# images. All three deployments must reach Ready; the webhook becomes Ready only
# after the cainjector injects its CA into the webhook configs.
controller:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
webhook:
  replicaCount: 1
cainjector:
  replicaCount: 1

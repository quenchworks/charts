{{- if .Values.serviceAccount.create }}
{{- /*
One ServiceAccount per component. Splitting them keeps each component's RBAC
minimal and auditable: the controller's broad cert-management grants never leak
to the webhook (which only authenticates admission reviews) or the cainjector
(which only patches webhook configs). The token is mounted per-pod via
automountServiceAccountToken in each Deployment.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager.controllerServiceAccountName" . }}
  labels:
    {{- include "cert-manager.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager.webhookServiceAccountName" . }}
  labels:
    {{- include "cert-manager.componentLabels" (dict "ctx" . "component" "webhook") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager.cainjectorServiceAccountName" . }}
  labels:
    {{- include "cert-manager.componentLabels" (dict "ctx" . "component" "cainjector") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

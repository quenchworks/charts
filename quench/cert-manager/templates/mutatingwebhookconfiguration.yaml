{{/*
Mutating-admission webhook for the cert-manager API types (defaulting). Same CA
injection contract as the validating webhook: the caBundle is filled by the
cainjector from the webhook CA Secret referenced in the inject annotation.
*/}}
{{- $svcNs := .Release.Namespace -}}
{{- $svcName := include "cert-manager.webhookName" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "cert-manager.webhookName" . }}
  labels:
    {{- include "cert-manager.componentLabels" (dict "ctx" . "component" "webhook") | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from-secret: "{{ $svcNs }}/{{ include "cert-manager.webhookCASecretName" . }}"
webhooks:
  - name: webhook.cert-manager.io
    rules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["certificaterequests"]
    admissionReviewVersions: ["v1"]
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 30
    reinvocationPolicy: Never
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ $svcNs }}
        name: {{ $svcName }}
        path: /mutate
        port: 443

{{- /* The superuser's password and the key Langflow encrypts stored credentials (API keys in flows) with: both
       generated once and kept on upgrade. Losing secret-key makes the stored credentials unreadable. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) | b64enc | quote }}
  secret-key: {{ get $old "secret-key" | b64dec | default (randAlphaNum 48) | b64enc | quote }}
{{- end }}

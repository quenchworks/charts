{{- $probe := dict "httpGet" (dict "path" "/health_check" "port" "http") "periodSeconds" 15 "timeoutSeconds" 10 -}}
{{- $secret := include "langflow.secretName" . -}}
{{- $db := .Values.postgresql.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # one replica: the config dir and uploaded files live on one RWO volume, so the old pod stops first (maxSurge 0;
  # RollingUpdate either way, switching the type in place is refused under server-side apply)
  replicas: 1
  strategy:
    {{- toYaml (.Values.updateStrategy | default (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 0 "maxUnavailable" 1))) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (list .Values.admin.username .Values.env .Values.externalDatabase) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: langflow
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                {{- if $db }}
                secretKeyRef: { name: {{ printf "%s-postgresql" .Release.Name }}, key: postgres-password }
                {{- else }}
                secretKeyRef: { name: {{ required "externalDatabase.existingSecret is required when postgresql.enabled=false" .Values.externalDatabase.existingSecret }}, key: {{ .Values.externalDatabase.existingSecretPasswordKey }} }
                {{- end }}
            # $(DB_PASSWORD) expands from the variable above (Kubernetes dependent env vars)
            - name: LANGFLOW_DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%d/%s" (ternary .Values.postgresql.auth.username .Values.externalDatabase.username $db) (ternary (printf "%s-postgresql" .Release.Name) .Values.externalDatabase.host $db) (ternary 5432 (int .Values.externalDatabase.port) $db) (ternary .Values.postgresql.auth.database .Values.externalDatabase.database $db) | quote }}
            - { name: LANGFLOW_AUTO_LOGIN, value: "false" }
            - { name: LANGFLOW_SUPERUSER, value: {{ .Values.admin.username | quote }} }
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: admin-password }
            - name: LANGFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: secret-key }
            - { name: LANGFLOW_NEW_USER_IS_ACTIVE, value: "false" }
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "langflow.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          # migrations and the component index load on first start: the startup probe allows 5 minutes
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" (merge (dict "failureThreshold" 20) (deepCopy $probe))) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /home/langflow }
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ .Values.persistence.existingClaim | default (include "quench-common.fullname" .) }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

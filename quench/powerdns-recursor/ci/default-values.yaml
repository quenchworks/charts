# Install gate. One replica, and a local zone through authZones so the smoke
# check has a deterministic answer that needs no internet.
replicaCount: 1
authZones:
  quench.test: |
    $ORIGIN quench.test.
    $TTL 300
    @   IN SOA ns1 hostmaster 1 3600 600 86400 300
    @   IN NS  ns1
    ns1 IN A   192.0.2.1
    www IN A   192.0.2.10

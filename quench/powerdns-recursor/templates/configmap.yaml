apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  recursor.yml: |-
    {{- include "powerdns-recursor.conf" . | nindent 4 }}
{{- if .Values.authZones }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-zones
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $zone, $content := .Values.authZones }}
  {{ $zone }}.zone: |-
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}

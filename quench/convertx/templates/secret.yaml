{{- /* The first account's password and JWT_SECRET (signs sessions): generated once and read back on upgrade. */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $jwt := get $old "jwt-secret" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  jwt-secret: {{ $jwt | b64enc | quote }}
{{- end }}

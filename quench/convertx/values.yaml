# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/convertx
  digest: "sha256:7d2dc1eb04c902da25d7a091a104e678d73c16cd321d8fc1fa456c61c5aafe03"
  pullPolicy: IfNotPresent

nameOverride: ""

# SQLite on a ReadWriteOnce volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The first account, claimed by a post-install/upgrade Job (upstream lets the first visitor register it). Empty
# password: generated into the Secret <fullname> (password) and kept on upgrade.
auth:
  email: admin@example.com
  password: ""
  existingSecret: ""   # a Secret with keys "password" and "jwt-secret" instead

# More accounts may register only when true (ACCOUNT_REGISTRATION).
accountRegistration: false
# Session cookies are Secure unless this is true (HTTP_ALLOWED): keep it false behind an HTTPS Ingress.
httpAllowed: false
# Delete finished conversions after this many hours (AUTO_DELETE_EVERY_N_HOURS; 0 keeps them).
autoDeleteEveryNHours: 24

# More ConvertX settings, e.g. MAX_CONVERT_PROCESS: "2", HIDE_HISTORY: "true", FFMPEG_ARGS: "-hwaccel auto", LANGUAGE: de.
settings: {}

# Helper image for the account Job (wget and nc). Pinned by digest.
busybox:
  repository: ghcr.io/quenchworks/images/busybox
  digest: "sha256:041302c8da3a2e182ecc2eac3c56c4f47a13c03cc284d255489c0be741893b64"
  pullPolicy: IfNotPresent

# /app/data: the SQLite database, uploads and converted files.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 4, memory: 4Gi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# convertx has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: convert.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [convert.example.com], secretName: convert-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

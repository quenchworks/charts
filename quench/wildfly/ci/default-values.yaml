# Install gate. No image override: the gate pulls the chart's real digest. The
# release workflow creates the wildfly-gate-war ConfigMap (a one-JSP WAR) before
# installing; it is mounted into deployments/ the way users mount their own.
replicaCount: 1
extraVolumes:
  - name: gate-war
    configMap:
      name: wildfly-gate-war
extraVolumeMounts:
  - name: gate-war
    mountPath: /opt/wildfly/standalone/deployments/quench.war
    subPath: quench.war
    readOnly: true

{{/* WildFly's /health lives on the management interface, which stays on loopback,
     so the kubelet probes HTTP on 8080: the undertow listener answers only once the
     server has booted. / is WildFly's welcome page in the stock configs; point the
     probes elsewhere (customReadinessProbe) if your config drops it. The startup
     probe covers JVM and server boot plus the first deployments. */}}
{{- $liveness := dict "httpGet" (dict "path" .Values.probePath "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 3 -}}
{{- $readiness := dict "httpGet" (dict "path" .Values.probePath "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 3 -}}
{{- $startup := dict "httpGet" (dict "path" .Values.probePath "port" "http") "initialDelaySeconds" 10 "periodSeconds" 5 "timeoutSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "wildfly.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if or .Values.initContainers (include "quench-common.tls.enabled" .) }}
      initContainers:
        {{- if include "quench-common.tls.enabled" . }}
        # standalone.xml's https listener (8443) reads application.keystore from the config dir
        # with password "password" and only self-signs when the file is missing. This writes the
        # chart certificate there as PKCS12 (the JDK JKS loader reads it); the entrypoint's copy
        # of the image config into /tmp/wildfly leaves the extra file in place.
        - name: tls-keystore
          image: "{{ .Values.openssl.repository }}@{{ .Values.openssl.digest }}"
          imagePullPolicy: {{ .Values.openssl.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              mkdir -p /tmp/wildfly/configuration
              openssl pkcs12 -export -inkey /tls/tls.key -in /tls/tls.crt -name server \
                -passout pass:password -out /tmp/wildfly/configuration/application.keystore
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: wildfly
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - -c
            - {{ .Values.serverConfig | quote }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.javaOpts .Values.extraEnvVars }}
          env:
            {{- with .Values.javaOpts }}
            # Replaces standalone.conf's default heap flags when set.
            - name: JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if include "quench-common.tls.enabled" . }}
            - name: https
              containerPort: 8443
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # read-only rootfs: the entrypoint makes /tmp/wildfly the server base
            # (configuration copy, data, log, tmp, deployments).
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

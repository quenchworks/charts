apiVersion: v2
name: kueue
description: "Kueue: job queueing and quota management for batch and AI workloads on Kubernetes. ClusterQueues, LocalQueues and ResourceFlavors decide when a Job, JobSet, RayJob or Kubeflow job may start and where. Upstream's release manifest with the eleven CRDs, on the QuenchWorks image: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.20.6"
kubeVersion: ">=1.29.0-0"
keywords:
  - kueue
  - batch
  - job-queueing
  - quota
  - operator

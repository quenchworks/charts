{{- /* The web admin password, generated once and read back on upgrade; the init container stores its bcrypt hash. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := get $old "admin-password" | b64dec | default (.Values.admin.password | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  mox.conf: |
    {{- include "mox.static" . | nindent 4 }}
  domains.conf: |
    {{- include "mox.domains" . | nindent 4 }}

{{- $probe := dict "tcpSocket" (dict "port" "smtp") "periodSeconds" 15 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # one replica: the data (bbolt databases, the queue) lives on one volume
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (list (include "mox.static" .) (include "mox.domains" .) .Values.tls) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # mox.conf is chart-managed (rewritten each start); domains.conf is written once, then the admin UI owns it.
        - name: config
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /mox/config /mox/data
              cp /chart/mox.conf /mox/config/mox.conf
              [ -f /mox/config/domains.conf ] || cp /chart/domains.conf /mox/config/domains.conf
              printf '%s\n' "$ADMIN_PASSWORD" | mox setadminpassword
              mox config test
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "mox.secretName" . }}, key: admin-password }
          volumeMounts:
            - { name: data, mountPath: /mox }
            - { name: chart, mountPath: /chart, readOnly: true }
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: mox
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "mox.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
            - { name: metrics, containerPort: 8010, protocol: TCP }
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" (merge (dict "failureThreshold" 20) (deepCopy $probe))) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /mox }
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ .Values.persistence.existingClaim | default (include "quench-common.fullname" .) }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: chart
          configMap: { name: {{ include "quench-common.fullname" . }} }
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

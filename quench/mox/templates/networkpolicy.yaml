{{- $ports := list }}
{{- range (include "mox.ports" . | fromJsonArray) }}{{ $ports = append $ports (dict "port" .name "protocol" .protocol) }}{{ end }}
{{- /* the Prometheus metrics listener (8010) is scraped from outside the pod */}}
{{- $ports = append $ports (dict "port" "metrics" "protocol" "TCP") }}
{{- include "quench-common.networkPolicy" (dict "ctx" . "defaultPorts" $ports) }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if include "quench-common.tls.enabled" . }}
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
    {{- end }}
    - name: management
      port: 9000
      targetPort: management
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

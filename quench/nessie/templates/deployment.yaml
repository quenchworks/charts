{{- include "nessie.validate" . }}
{{- $store := .Values.versionStore.type }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ if eq $store "ROCKSDB" }}1{{ else }}{{ .Values.replicas }}{{ end }}
  {{- if eq $store "ROCKSDB" }}
  # RocksDB takes a file lock: the old pod must stop before the new one opens it
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nessie.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nessie
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
            - name: NESSIE_VERSION_STORE_TYPE
              value: {{ $store | quote }}
            {{- if eq $store "ROCKSDB" }}
            - name: NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH
              value: /data/rocksdb
            {{- end }}
            {{- if eq $store "JDBC2" }}
            {{- $ds := .Values.jdbc.datasource | upper }}
            - name: NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE
              value: {{ .Values.jdbc.datasource | quote }}
            - name: QUARKUS_DATASOURCE_{{ $ds }}_ACTIVE
              value: "true"
            - name: QUARKUS_DATASOURCE_{{ $ds }}_JDBC_URL
              value: {{ .Values.jdbc.url | quote }}
            - name: QUARKUS_DATASOURCE_{{ $ds }}_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jdbc.existingSecret }}
                  key: {{ .Values.jdbc.usernameKey }}
            - name: QUARKUS_DATASOURCE_{{ $ds }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jdbc.existingSecret }}
                  key: {{ .Values.jdbc.passwordKey }}
            {{- end }}
            {{- if include "quench-common.tls.enabled" . }}
            # native TLS: Quarkus adds an https listener beside plain http
            - name: QUARKUS_HTTP_SSL_PORT
              value: {{ .Values.service.httpsPort | quote }}
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /tls/tls.key
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 19120
            - name: management
              containerPort: 9000
            {{- if include "quench-common.tls.enabled" . }}
            - name: https
              containerPort: {{ .Values.service.httpsPort }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- if eq $store "ROCKSDB" }}
            - name: data
              mountPath: /data
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # Quarkus and the RocksDB JNI loader unpack into /tmp on a read-only root
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- if eq $store "ROCKSDB" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nessie.claimName" . }}
        {{- end }}

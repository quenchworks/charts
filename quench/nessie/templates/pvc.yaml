{{- if and (eq .Values.versionStore.type "ROCKSDB") (not .Values.rocksdb.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nessie.claimName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    # the commit history lives here; uninstalling the chart keeps it
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.rocksdb.persistence.accessModes | nindent 4 }}
  {{- with .Values.rocksdb.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rocksdb.persistence.size }}
{{- end }}

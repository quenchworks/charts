apiVersion: v2
name: nessie
description: "Project Nessie, the transactional catalog for data lakehouse tables: Git-like branches, tags and commits over Iceberg metadata, plus the Iceberg REST catalog API. In-memory, RocksDB on a PVC, or JDBC version store. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."

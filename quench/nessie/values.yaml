# Quenchworks Nessie: the lakehouse table catalog on the QuenchWorks nessie image
# (nonroot, 0-CVE, cosign-signed, pinned by digest). API and Iceberg REST on 19120,
# health and metrics on 9000.
image:
  repository: ghcr.io/quenchworks/images/nessie
  digest: "sha256:9f0ab7581fb020caff51b8b4e149e3aefcdaffa196751afd664265f911d76d3f"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Where Nessie keeps its commits:
#   IN_MEMORY  lost on every restart (upstream's default; for trying it out)
#   ROCKSDB    a RocksDB on a PVC; one replica, the pod is recreated on upgrade
#   JDBC2      a PostgreSQL or MariaDB database (jdbc below); scales out
versionStore:
  type: IN_MEMORY

rocksdb:
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
    # an existing PVC instead of one the chart creates
    existingClaim: ""

jdbc:
  # postgresql, mariadb or mysql
  datasource: postgresql
  url: ""                       # e.g. jdbc:postgresql://pg.data.svc:5432/nessie
  # a Secret holding the database username and password
  existingSecret: ""
  usernameKey: username
  passwordKey: password

# Ignored for ROCKSDB, which needs a single writer.
replicas: 1

javaOpts: "-XX:MaxRAMPercentage=75"
extraEnvVars: []

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: 1000m, memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 19120
  # Quarkus https listener, only with tls.enabled
  httpsPort: 8443

# Native TLS: an https listener on service.httpsPort beside plain http (Quarkus PEM files from
# /tls). The certificate comes from the first source set: existingSecret, then a cert-manager
# Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/inbucket
  digest: "sha256:b466cd158a80fafd8ab00703a437b8f080cf989fea7741a6a4c92a3661c41619"
  pullPolicy: IfNotPresent

nameOverride: ""

# Inbucket keeps mail as files in /storage: run one replica (Recreate with the volume).
replicaCount: 1
updateStrategy:
  type: Recreate

# How long mail is kept, and how many messages a mailbox holds before the oldest go.
retention: 72h
mailboxMessageCap: 300

# POP3 (port 1100) for mail clients; off binds it to the pod's loopback only.
pop3:
  enabled: true

# More Inbucket settings as INBUCKET_* environment variables
# (https://github.com/inbucket/inbucket/blob/main/doc/config.md), e.g. INBUCKET_SMTP_REJECTDOMAINS.
settings: {}

# The data volume: the stored mail (/storage).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 9000
  smtpPort: 2500
  pop3Port: 1100
  annotations: {}
  externalTrafficPolicy: ""


# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

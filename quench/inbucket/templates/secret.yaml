{{- /* The web session cookie key, generated once and read back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-auth-key: {{ get $old "cookie-auth-key" | default (randAlphaNum 32 | b64enc) | quote }}

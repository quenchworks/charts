apiVersion: v2
name: identity-stack
description: "Hardened, operator-free self-hosted SSO/identity stack: Keycloak (OIDC/SAML identity provider) + PostgreSQL (Keycloak's database) + oauth2-proxy (an auth proxy you place in front of any upstream app to authenticate users against Keycloak), wired together so you get single sign-on in front of your apps out of the box. No operator, no CRDs. All components are QuenchWorks-hardened, nonroot, CVE-gated images pinned by digest and cosign-signed."
type: application
version: 0.0.45
appVersion: "1.0.0"
keywords:
  - identity
  - sso
  - oidc
  - keycloak
  - oauth2
  - oauth2-proxy
  - postgresql
  - iam
  - authentication
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/keycloak/keycloak
  - https://github.com/oauth2-proxy/oauth2-proxy
  - https://github.com/postgres/postgres
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles keycloak=0.0.54 (quench-common 0.0.14 rollout, round 2)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:a9f561edf556dd56683bf7a871bb0488a1eedff8d8f002393169f294e116615f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
    - name: oauth2-proxy
      image: ghcr.io/quenchworks/images/oauth2-proxy@sha256:23fa48971e779626057d8e5178457658d1e0db258fc1436f3f601ccdb68668e1
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  # PostgreSQL is NOT a direct dependency: the keycloak chart already bundles
  # quench/postgresql (alias "postgresql", default enabled) and wires Keycloak to
  # it automatically (keycloak.db.host resolves to <release>-postgresql). It still
  # ships in this stack (inside keycloak), so it stays in artifacthub.io/images
  # and the keywords above.
  - name: keycloak
    version: 0.0.54
    repository: oci://ghcr.io/quenchworks/charts
    condition: keycloak.enabled
  - name: oauth2-proxy
    alias: oauth2Proxy
    version: 0.0.21
    repository: oci://ghcr.io/quenchworks/charts
    condition: oauth2Proxy.enabled

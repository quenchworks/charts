{{- if and .Values.auth.existingSecret .Values.database.password (not .Values.database.existingSecret) }}{{ fail "database.password is stored in the chart Secret, which auth.existingSecret replaces: use database.existingSecret" }}{{- end }}
{{- if not .Values.auth.existingSecret }}
{{- /* Keep generated values across upgrades: a new API secret would invalidate every issued
       JWT, and a new SQL password would lock out connected BI tools. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .) }}
{{- $oldData := ($old | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-secret: {{ .Values.auth.apiSecret | default "" | b64enc | default (get $oldData "api-secret") | default (randAlphaNum 48 | b64enc) | quote }}
  sql-password: {{ .Values.sqlApi.password | default "" | b64enc | default (get $oldData "sql-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- if and .Values.database.password (not .Values.database.existingSecret) }}
  db-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
{{- end }}

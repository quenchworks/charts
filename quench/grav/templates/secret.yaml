{{- /* The admin password: generated once (Grav's policy: a digit, a lower and an upper case letter) and read
       back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.admin.password | default (get $old "admin-password" | b64dec) | default (printf "Qw7a%s" (randAlphaNum 20)) | b64enc | quote }}

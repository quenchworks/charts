apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: soketi
      port: {{ .Values.service.soketiPort }}
      targetPort: soketi
      protocol: TCP
    - name: terminal
      port: {{ .Values.service.terminalPort }}
      targetPort: terminal
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Dummy soketi credentials exercise the SOKETI_DEFAULT_APP_* env wiring; the boot
# path (soketi + terminal) is identical with or without them.
replicaCount: 1
soketi:
  appId: "ci-app-id"
  appKey: "ci-app-key"
  appSecret: "ci-app-secret"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

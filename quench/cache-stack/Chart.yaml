apiVersion: v2
name: cache-stack
description: "Hardened cache stack with metrics: Valkey (Redis-compatible) with a redis_exporter sidecar, Prometheus discovering it in the release namespace, and Grafana with the Prometheus datasource and the redis_exporter dashboard provisioned. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.36
appVersion: "1.0.0"
keywords:
  - cache
  - valkey
  - redis
  - redis-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/valkey-io/valkey
  - https://github.com/oliver006/redis_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the valkey subchart 0.0.41 -> 0.0.42."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:66f9687d30e03a25298418dfbd8da5778df946cd40e38fe7a135a161327ca168
    - name: redis-exporter
      image: ghcr.io/quenchworks/images/redis-exporter@sha256:60389a004604e871de6c08536c3c96ecbb3fe4c9d873bf4dd74766034729bc94
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:04a726bcdaf7f8484d360674236a9e90c4b924e82d4d99b4516c5218013fcb45
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:3ee747f05eb40b2f39074f3a8563153a63d09958d7c5c66824a7c19a41d7741e
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: valkey
    version: 0.0.42
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: prometheus
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

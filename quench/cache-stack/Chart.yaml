apiVersion: v2
name: cache-stack
description: "Hardened cache stack with metrics: Valkey (Redis-compatible) with a redis_exporter sidecar, Prometheus discovering it in the release namespace, and Grafana with the Prometheus datasource and the redis_exporter dashboard provisioned. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.21
appVersion: "1.0.0"
keywords:
  - cache
  - valkey
  - redis
  - redis-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/valkey-io/valkey
  - https://github.com/oliver006/redis_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles valkey=0.0.35 (the 2026-11-02 CVE re-pin)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:51cd07f2bbe088c14296eb8e209f6462423655f6145049e7171e97a892d4ffd0
    - name: redis-exporter
      image: ghcr.io/quenchworks/images/redis-exporter@sha256:694b315ef07addcd947d8468cd2d39f2b6a148c24e4b86e1c50952abe5d5e187
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:80dfa5cae0143d74c7936e576f875ba303d10882ec9abcb4c216cf8dae36ff85
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:ae745b72a3bdc64caf10472593bfc7c5ce134d78a60631f39c289e23c5fdce7c
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: valkey
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: prometheus
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

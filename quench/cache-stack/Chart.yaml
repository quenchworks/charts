apiVersion: v2
name: cache-stack
description: "Hardened cache stack with metrics: Valkey (Redis-compatible) with a redis_exporter sidecar, Prometheus discovering it in the release namespace, and Grafana with the Prometheus datasource and the redis_exporter dashboard provisioned. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.13
appVersion: "1.0.0"
keywords:
  - cache
  - valkey
  - redis
  - redis-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/valkey-io/valkey
  - https://github.com/oliver006/redis_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Update batch 2026-10-19"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:da2b2d24bdd369959b480a23d289d7fcb209968199e8c621700d8b7d3e8420a5
    - name: redis-exporter
      image: ghcr.io/quenchworks/images/redis-exporter@sha256:ab1ece13c2ea81517b162a7ea96b6e7b1e67aaeff92248ae61aaae00b31916f5
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:d57cf70aab4c571222c6f5b8cf3912298483b853eda1e39348a170d74aa6c157
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:b7bda86e876db1390621e2a6d1d13034242ca5f490a19bd4bd31294e2e8aecb0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: valkey
    version: 0.0.31
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: prometheus
    version: 0.0.21
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

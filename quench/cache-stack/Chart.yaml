apiVersion: v2
name: cache-stack
description: "Hardened cache stack with metrics: Valkey (Redis-compatible) with a redis_exporter sidecar, Prometheus discovering it in the release namespace, and Grafana with the Prometheus datasource and the redis_exporter dashboard provisioned. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.25
appVersion: "1.0.0"
keywords:
  - cache
  - valkey
  - redis
  - redis-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/valkey-io/valkey
  - https://github.com/oliver006/redis_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:5ff5a0ea89c59eb1e731d2741642349d2009579863a9bc28ade66706af95f6a0
    - name: redis-exporter
      image: ghcr.io/quenchworks/images/redis-exporter@sha256:fc275a5b1791937af97dffd182ecf88656be9783928bc26cda67f31560d5aa7d
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:8e9254d8deac559c2520e0c295da15d86e099c444b762bfc11682278cc7bca7b
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:5fad18f2054178ba8e6ecbc39b4a1127318060a69b2edf2ed4d2b6b312d62c88
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: valkey
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: prometheus
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: cache-stack
description: "Hardened cache stack with metrics: Valkey (Redis-compatible) with a redis_exporter sidecar, Prometheus discovering it in the release namespace, and Grafana with the Prometheus datasource and the redis_exporter dashboard provisioned. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.0.0"
keywords:
  - cache
  - valkey
  - redis
  - redis-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/valkey-io/valkey
  - https://github.com/oliver006/redis_exporter
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: valkey 0.0.22 with metrics, prometheus 0.0.18, grafana 0.0.13 and the redis_exporter dashboard."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:9203d82de95544c95f9cde104f2a23b699423cfed9cc27251f09b51d45f93762
    - name: redis-exporter
      image: ghcr.io/quenchworks/images/redis-exporter@sha256:b71e8375f58003e5679e4a708ed5663417c73cce7122bb12be54792b27939931
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:88d05fd90073aef3d50f120a4485b4f4f08861ee15492d74d02bcf190bb82681
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:4b7e7a1342831602a31232c1dce40d8ea6a14bb44d6acb3aa095c029e1520d55
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: valkey
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: prometheus
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

# Install gate. Components use their charts' real CI-maintained digests. Small
# PVCs and resources for one kind node; a fixed Grafana password so the gate can
# query the datasource proxy.
valkey:
  primary:
    persistence:
      size: 1Gi
prometheus:
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
grafana:
  auth:
    adminPassword: ci-cache-stack-2026
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves the PVC binds and the pre-install Job
# writes the PKI to it, then the server reads it. The passwords below are FIXED,
# throwaway test values that make the bootstrap deterministic — they are NOT
# secrets. In a real deployment set auth.existingSecret (or auth.password /
# auth.provisionerPassword) and rotate after first boot.
persistence:
  enabled: true
  size: 1Gi

auth:
  password: quench-ca-key-password
  provisionerPassword: quench-provisioner-password

ca:
  name: "QuenchWorks Test CA"
  provisioner: "ci@quench-works.com"

{{- if not .Values.auth.existingSecret }}
{{/*
CA passwords, consumed at first-boot init (encrypt the CA keys + first
provisioner) and at every server start (decrypt the intermediate key). Rendered
as a pre-install hook so it exists before the bootstrap Job runs, and kept for
the life of the release so the server can mount it on every boot. Supply real
values via auth.password / auth.provisionerPassword (better: auth.existingSecret)
and rotate after bootstrap.
*/}}
{{- $pw := required "auth.password is required (or set auth.existingSecret)" .Values.auth.password -}}
{{- $ppw := required "auth.provisionerPassword is required (or set auth.existingSecret)" .Values.auth.provisionerPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "step-ca.secretName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  password: {{ $pw | quote }}
  provisioner-password: {{ $ppw | quote }}
{{- end }}

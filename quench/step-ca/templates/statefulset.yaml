{{/*
step-ca serves HTTPS on :9000 and answers GET /health with 200 {"status":"ok"}
once the server and its db are up. The probes speak HTTPS; the CA presents its own
self-signed leaf, which the kubelet does not verify for httpGet probes.
*/}}
{{- $liveness := dict "httpGet" (dict "path" "/health" "port" "https" "scheme" "HTTPS") "initialDelaySeconds" 10 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/health" "port" "https" "scheme" "HTTPS") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
{{/* Generous startup budget: first install runs the PKI bootstrap Job, then the
     server opens its badger db before /health goes green. */}}
{{- $startup := dict "httpGet" (dict "path" "/health" "port" "https" "scheme" "HTTPS") "initialDelaySeconds" 5 "periodSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "step-ca.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "step-ca.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        # The PKI (root+intermediate CA, first provisioner, ca.json) is generated
        # once at install time by the step-ca-init hook Job (see bootstrap-job.yaml),
        # NOT here: the runtime image is shell-free and `step ca init` refuses to
        # clobber an existing CA, so a per-pod init container would fail on every
        # reschedule. The Job runs exactly once (pre-install), writes the PKI onto
        # the shared PVC, and this server just reads it — so the CA identity is
        # stable across pod restarts, reschedules and upgrades.
        - name: step-ca
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- if .Values.command }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- else }}
          command:
            - /usr/bin/step-ca
            - /home/step/config/ca.json
            - --password-file=/pw/password
          {{- end }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: STEPPATH
              value: /home/step
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: https
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- if .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml .Values.customStartupProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            {{- toYaml $startup | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/step
            - name: pki-password
              mountPath: /pw
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: pki-password
          secret:
            secretName: {{ include "step-ca.secretName" . }}
            items:
              - key: password
                path: password
              - key: provisioner-password
                path: provisioner-password
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "step-ca.pvcName" . }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

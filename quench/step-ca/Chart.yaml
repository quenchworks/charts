apiVersion: v2
name: step-ca
description: "Smallstep step-ca online certificate authority (ACME/step CA over HTTPS). Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest; the bundled step CLI bootstraps the PKI on first boot."
type: application
version: 0.0.17
appVersion: "0.30.2"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/smallstep/certificates
keywords:
  - step-ca
  - smallstep
  - certificate-authority
  - pki
  - acme
  - x509
  - tls
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: step-ca
      image: ghcr.io/quenchworks/images/step-ca@sha256:0278e8a9ac6c9fc529b600fa7cdf3a9238ed230cecb2d3bd9fc9dae9859c251d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

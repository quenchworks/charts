apiVersion: v2
name: redis-operator
description: "Redis Operator (OT-CONTAINER-KIT): run Redis standalone, replication, Sentinel and Redis Cluster from Kubernetes resources. The CRDs ship with the chart. Hardened by QuenchWorks: the operator is built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.27.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - redis
  - redis-operator
  - cache
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/OT-CONTAINER-KIT/redis-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: redis-operator
      image: ghcr.io/quenchworks/images/redis-operator@sha256:e51e0c9c89f0edb7d53bda96fa6e3d2b0566e65ece3a32ebd19ea97b4958a1cc
  artifacthub.io/crds: |
    - kind: Redis
      version: v1beta2
      name: redis.redis.redis.opstreelabs.in
      displayName: Redis
      description: A standalone Redis server.
    - kind: RedisReplication
      version: v1beta2
      name: redisreplications.redis.redis.opstreelabs.in
      displayName: Redis Replication
      description: A Redis primary with replicas.
    - kind: RedisSentinel
      version: v1beta2
      name: redissentinels.redis.redis.opstreelabs.in
      displayName: Redis Sentinel
      description: Sentinels that watch a RedisReplication and fail over its primary.
    - kind: RedisCluster
      version: v1beta2
      name: redisclusters.redis.redis.opstreelabs.in
      displayName: Redis Cluster
      description: A sharded Redis Cluster with leaders and followers.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

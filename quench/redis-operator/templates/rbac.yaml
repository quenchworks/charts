{{- if .Values.rbac.create }}
{{- $fn := include "quench-common.fullname" . }}
{{- $sa := include "redis-operator.serviceAccountName" . }}
# Upstream's manager ClusterRole at the release tag (config/rbac/role.yaml), rules verbatim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ['*']
    verbs: [get]
  - apiGroups: ['']
    resources: [configmaps, events, namespaces, persistentvolumeclaims, pods, pods/exec, secrets, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: [redis, rediscluster, redisclusters, redisreplication, redisreplications, rediss, redissentinel, redissentinels]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: [redis/finalizers, rediscluster/finalizers, redisclusters/finalizers, redisreplication/finalizers, redisreplications/finalizers, redissentinel/finalizers, redissentinels/finalizers]
    verbs: [update]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: [redis/status, rediscluster/status, redisclusters/status, redisreplication/status, redisreplications/status, redissentinel/status, redissentinels/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $fn }} }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
---
# Upstream config/rbac/leader_election_role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-leader-election
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ['', coordination.k8s.io]
    resources: [configmaps, leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-leader-election
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fn }}-leader-election }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-operator.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

apiVersion: v2
name: hasura
description: Hardened Hasura GraphQL Engine (Community Edition) on a 0-CVE nonroot image, with a bundled PostgreSQL metadata database.
type: application
version: 0.0.6
appVersion: "2.50.3"
kubeVersion: ">=1.23.0-0"
home: https://github.com/quenchworks/charts
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/hasura/graphql-engine
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - hasura
  - graphql
  - postgresql
  - api
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "A default install without a DB password no longer fails to connect to the bundled PostgreSQL: Hasura reads the generated password from the PostgreSQL chart's Secret."
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/hasura/graphql-engine
  artifacthub.io/images: |
    - name: hasura
      image: ghcr.io/quenchworks/images/hasura@sha256:2f4d008c54b0da96bc4372b8379e6e5515f431ed02a6a8dcb1a4f66ba9811168
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:086dc72597074662dfb828f7f58a0093f98123405cf4bc109a1bd859bc576f21
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

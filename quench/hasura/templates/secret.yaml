{{/*
The managed Secret: the admin secret, the database password and the full
database URL Hasura connects with (so the password never appears in the pod
spec). Each value is resolved as explicit value, then the prior value in the
live Secret (the bundled subchart's Secret for the DB password), then random,
so upgrades keep them.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $admin := .Values.adminSecret -}}
{{- if not $admin }}{{- $admin = index $prior "admin-secret" | default "" | b64dec }}{{- end -}}
{{- if not $admin }}{{- $admin = randAlphaNum 32 }}{{- end -}}
{{- $db := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $db = .Values.postgresql.auth.password -}}
{{- if not $db -}}
{{- $pg := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name) -}}
{{- if $pg }}{{- $db = index $pg.data "postgres-password" | default "" | b64dec }}{{- end -}}
{{- end -}}
{{- else -}}
{{- $db = .Values.externalDatabase.password -}}
{{- end -}}
{{- if not $db }}{{- $db = index $prior "db-password" | default "" | b64dec }}{{- end -}}
{{- if not $db }}{{- $db = randAlphaNum 24 }}{{- end -}}
{{- $url := printf "postgres://%s:%s@%s:%s/%s?sslmode=%s"
    (include "hasura.db.user" .) (urlquery $db) (include "hasura.db.host" .)
    (include "hasura.db.port" .) (include "hasura.db.name" .) (include "hasura.db.sslMode" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-secret: {{ $admin | b64enc | quote }}
  db-password: {{ $db | b64enc | quote }}
  database-url: {{ $url | b64enc | quote }}

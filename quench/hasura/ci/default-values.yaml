# Install gate: bundled PostgreSQL with a small volume and no DB password set (a default
# install must connect with the generated one).
adminSecret: ci-admin-secret
postgresql:
  enabled: true
  auth:
    username: hasura
    database: hasura_metadata
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

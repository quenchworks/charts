# Install gate: bundled PostgreSQL with fixed credentials and a small volume.
adminSecret: ci-admin-secret
postgresql:
  enabled: true
  auth:
    username: hasura
    password: ci-test-password
    database: hasura_metadata
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

{{- if .Values.serviceAccount.create }}
{{/*
  One ServiceAccount per component, never a shared one. Their privilege levels are
  nowhere near each other: the application controller effectively holds
  cluster-admin (it applies whatever manifests an Application renders), the API
  server holds a read/delete/patch subset plus pod logs, and the repo server holds
  NOTHING -- it never talks to the API server at all, which is why its token is not
  even mounted. Collapsing them onto one account would hand the internet-facing
  component the controller's rights.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd.server.fullname" . }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd.repoServer.fullname" . }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: repo-server
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd.controller.fullname" . }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: application-controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.applicationSet.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd.appset.fullname" . }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: applicationset-controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.notifications.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd.notifications.fullname" . }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications-controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

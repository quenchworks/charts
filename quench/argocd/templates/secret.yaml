{{/*
  argocd-secret (fixed name, see templates/_helpers.tpl) is not optional: the API
  server refuses to start without it, and it is where Argo CD KEEPS STATE -- it
  writes `server.secretkey` (the session-signing key) into this Secret itself on
  first start, and stores repository credentials, webhook secrets and SSO client
  secrets alongside.

  That is why the chart only ever declares the keys the operator actually set. Helm
  patches Secrets rather than replacing them, so keys that exist only on the live
  object -- server.secretkey above all -- survive `helm upgrade` untouched. Adding
  an empty `server.secretkey: ""` here would invalidate every session on every
  upgrade, which is exactly the trap this shape avoids.

  The initial admin password is NOT set here by default: on first start Argo CD
  generates one into a separate Secret, argocd-initial-admin-secret, which you read
  once and then delete. Set configs.secret.argocdServerAdminPassword to a BCRYPT
  hash (`argocd account bcrypt --password ...`) to pin it instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
  {{- /* Never let `helm uninstall` take the session key and the repo credentials
         with it -- a reinstall would log everyone out and lose every cred. */}}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- $sd := dict -}}
{{- with .Values.configs.secret.argocdServerAdminPassword }}
{{- $_ := set $sd "admin.password" . -}}
{{- /* Argo CD invalidates every token issued before admin.passwordMtime, so this
       timestamp must NOT move on an unrelated `helm upgrade`. Reuse the live value
       whenever the hash has not changed; only a real password change bumps it. */}}
{{- $live := lookup "v1" "Secret" $.Release.Namespace "argocd-secret" -}}
{{- $mtime := now | date "2006-01-02T15:04:05Z" -}}
{{- if $live }}
{{- $ld := $live.data | default dict -}}
{{- if and (hasKey $ld "admin.password") (hasKey $ld "admin.passwordMtime") -}}
{{- if eq (index $ld "admin.password" | b64dec) . -}}
{{- $mtime = index $ld "admin.passwordMtime" | b64dec -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $_ := set $sd "admin.passwordMtime" $mtime -}}
{{- end }}
{{- range $k, $v := .Values.configs.secret.extra }}
{{- $_ := set $sd $k ($v | toString) -}}
{{- end }}
{{- if $sd }}
stringData:
  {{- toYaml $sd | nindent 2 }}
{{- end }}
{{- if .Values.notifications.enabled }}
---
{{/* Notification service credentials (slack token, smtp password, ...), referenced
     from argocd-notifications-cm as $key. Fixed name, same reasoning. */}}
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications-controller
type: Opaque
stringData:
  {{- range $k, $v := .Values.notifications.secret }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.externalRedis.host .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
---
{{/* Password for a BYO Redis given inline. With redis.enabled the bundled
     quench/redis subchart owns its own Secret and this is not rendered. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-external-redis" (include "quench-common.fullname" .) }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  redis-password: {{ .Values.externalRedis.password | quote }}
{{- end }}

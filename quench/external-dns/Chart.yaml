apiVersion: v2
name: external-dns
description: "ExternalDNS, the Kubernetes SIG controller that synchronizes exposed Services, Ingresses and Gateway API routes with an external DNS provider. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "0.23.0"
keywords:
  - external-dns
  - dns
  - kubernetes
  - ingress
  - service-discovery
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes-sigs/external-dns
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "The docs and NOTES named the external-dns.alpha.kubernetes.io/ annotation prefix, which ExternalDNS 0.23 ignores unless --enable-legacy-annotation-prefix is set. They now use external-dns.kubernetes.io/."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: external-dns
      image: ghcr.io/quenchworks/images/external-dns@sha256:39be2f335319778c8fed903d4ad32fb77a653bfe6c55780aa9e07cbcae300a4d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

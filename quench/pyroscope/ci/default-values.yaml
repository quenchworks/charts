# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and Pyroscope writes
# its profiling DB + metastore raft state to it. A small size keeps the kind gate
# quick; production defaults to a larger PVC.
persistence:
  enabled: true
  size: 1Gi

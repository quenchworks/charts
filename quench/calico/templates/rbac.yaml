---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # The operator binds this role by its fixed name (render.TigeraOperatorSecrets)
  # in every namespace it renders secrets into, so it cannot carry the release name.
  name: tigera-operator-secrets
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "quench-common.fullname" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "quench-common.fullname" . }}, namespace: {{ .Release.Namespace }}}
---
# The secrets role applies in the operator's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}-secrets
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tigera-operator-secrets}
subjects:
  - {kind: ServiceAccount, name: {{ include "quench-common.fullname" . }}, namespace: {{ .Release.Namespace }}}

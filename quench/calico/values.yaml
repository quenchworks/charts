# Tigera operator, pinned by digest. It installs and manages Calico from the
# Installation below; it must run before the cluster has a CNI, so it uses hostNetwork.
image:
  repository: ghcr.io/quenchworks/images/tigera-operator
  digest: "sha256:287129eb047506f8f74fd9410f2f5fe6de5cd6deef9a891ebe122ca93ecbe5d4"
  pullPolicy: IfNotPresent

nameOverride: ""

# The operator release the image is built from (its init-image version).
operatorVersion: "1.42.2"

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# The Calico images the operator deploys, pinned by digest through an ImageSet named
# calico-v<appVersion>. Keys are the operator's image names.
calicoImages:
  calico/node: "sha256:aa8a060d3e90f70d0e2adb0e24fe131436236e8fc601bf132991e74ba1ab1c81"
  calico/cni: "sha256:e847def50314c142ba4292a27a7b355b444b72e7cd180d1a0e660bd667323967"
  calico/kube-controllers: "sha256:7cb7fad8d7dab35d292f969c08c8f118d4c0013db4200226c43e42c11930c048"
  calico/typha: "sha256:1d723b13264fa765141bb387f6c8c6cf74b12a09ca8d673a68f69b2f031aa889"
  calico/key-cert-provisioner: "sha256:0a4aea15ffb0cfb43b3fe78b14c4c3f2ceedd798a4d7b035f71ff22903071bfa"
  calico/csi: "sha256:52ff3de55a24eb6965b4a4919f24a5f077f088c878828880f35c58a3b52ae700"
  calico/pod2daemon-flexvol: "sha256:386a7713533bb3c3ce53fd9266d992914bb63ca07b58fdb705f420d75f208411"
  calico/node-driver-registrar: "sha256:c79862096786f8f53c48fa591fb798dd5e1a2bb2f962bfb89ebb7708b4a80a23"

# The Installation the operator reconciles. registry/imagePath/imagePrefix map the
# operator's calico/<name> to ghcr.io/quenchworks/images/calico-<name>. Anything in
# installation.spec is merged over these defaults.
installation:
  enabled: true
  podCIDR: 192.168.0.0/16
  encapsulation: VXLANCrossSubnet
  spec: {}

# The hook Job that applies the ImageSet and Installation once the operator has
# installed its CRDs. It runs on the host network: there is no CNI yet.
wiring:
  image:
    repository: ghcr.io/quenchworks/images/kubectl
    digest: "sha256:579dddb5e9d550f273c067959215b3360fbd055313a7e9f74e449acf95f0c637"

imagePullSecrets: []
podAnnotations: {}
podLabels: {}
nodeSelector:
  kubernetes.io/os: linux
affinity: {}
# The operator must schedule on not-ready nodes: it is what makes them ready.
tolerations:
  - {effect: NoExecute, operator: Exists}
  - {effect: NoSchedule, operator: Exists}
priorityClassName: ""

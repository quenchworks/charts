# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves the PVC binds and teleport writes its SQLite
# backend and host CA under the read-only root fs. The release workflow's smoke check calls
# the proxy's /webapi/ping through the Service.
persistence:
  enabled: true
  size: 1Gi

clusterName: quench.test

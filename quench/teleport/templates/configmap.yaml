apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teleport.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted read-only at /etc/teleport/teleport.yaml (teleport's default config
  # path). Rendered through `tpl` so values (cluster name, ports, data dir) resolve;
  # edit .Values.config and `helm upgrade` (the pod checksum annotation rolls the
  # StatefulSet).
  teleport.yaml: |-
    {{- tpl .Values.config . | nindent 4 }}

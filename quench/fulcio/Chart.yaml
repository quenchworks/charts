apiVersion: v2
name: fulcio
description: "Fulcio, the Sigstore certificate authority: short-lived code-signing certificates bound to OIDC identities, for keyless signing with cosign. An ephemeral CA for testing, a file CA from a Secret, or KMS, Tink and Google CA. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "1.8.8"
kubeVersion: ">=1.23.0-0"
keywords:
  - sigstore
  - fulcio
  - certificate-authority
  - keyless-signing
  - supply-chain

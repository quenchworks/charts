apiVersion: v2
name: fulcio
description: "Fulcio, the Sigstore certificate authority: short-lived code-signing certificates bound to OIDC identities, for keyless signing with cosign. An ephemeral CA for testing, a file CA from a Secret, or KMS, Tink and Google CA. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "1.8.8"
kubeVersion: ">=1.23.0-0"
keywords:
  - sigstore
  - fulcio
  - certificate-authority
  - keyless-signing
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: security
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: fulcio
      image: ghcr.io/quenchworks/images/fulcio@sha256:7f8ec630c072078cffb16bb11edca18c6ca996dd87a70d864c7923c5913b53f8
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

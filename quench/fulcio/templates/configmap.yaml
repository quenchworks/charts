{{/* Fulcio's issuer configuration: which OIDC providers it trusts and how it
     maps their tokens to certificate identities. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}

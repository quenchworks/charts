apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # HTTP API (v1 and v2).
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      name: grpc
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
# The BEAM commits >1Gi at startup; an undersized limit OOM-kills the container
# before CouchDB logs anything. 3Gi is the smallest limit that reliably starts.
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "2", memory: 3Gi }
auth:
  username: admin
  password: "ci-test-password"
  erlangCookie: "ci-test-erlang-cookie-0123456789"
  secret: "ci-test-couch-secret-0123456789"
systemDatabases:
  create: true

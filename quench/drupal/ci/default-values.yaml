# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Bundles the Quenchworks MySQL subchart with a small PVC; deterministic shared DB
# credentials; small resources for the runner. The gate confirms Drupal connects to MySQL
# through the chart-supplied settings.php, the files PVC binds, and GET / returns 200/30x
# (i.e. nginx + php-fpm are serving and the DB is reachable).
mysql:
  enabled: true
  auth:
    rootPassword: ci-test-root-password
    username: drupal
    password: ci-test-password
    database: drupal
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

persistence:
  enabled: true
  size: 1Gi

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "2", memory: 1Gi }

# Generous startup window so the DB init + first Drupal boot pass the kind gate.
customStartupProbe:
  httpGet:
    path: /core/install.php
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public site + /admin + installer. Default restricts ingress to the release namespace
    # (allowExternal: false). Set it true (and front Drupal with an ingress/TLS proxy) to
    # serve readers from outside the namespace.
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Database (MySQL/MariaDB). Open to the DB port cluster-wide so both the bundled subchart
    # pod and an external DB are reachable.
    - ports:
        - port: {{ include "drupal.db.port" . }}
          protocol: TCP
    # General egress (update checks, project info, outbound mail/SMTP, etc.).
    - {}
{{- end }}

{{/*
The managed Secret always carries Drupal's hash salt (hash-salt) and — unless an external
existingSecret supplies it — the DB password under db-password. Both are injected into the
pod as DRUPAL_* env and read by settings.php, so no secret ever appears in the pod's argv /
process list.

The hash salt and the DB password are RESOLVED from the existing Secret first (via lookup)
so they stay STABLE across upgrades — regenerating the hash salt would invalidate every
session/one-time-login link, and regenerating the DB password would break the connection to
an already-initialized database.

When the bundled MySQL is enabled the DB password must be IDENTICAL to the one the MySQL
subchart provisions for its application user. Resolution order: explicit mysql.auth.password
-> the subchart's already-rendered Secret (<release>-mysql / mysql-password) via lookup ->
this Secret's prior value -> a fresh 24-char random. Set mysql.auth.password for a
deterministic install.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* ---- hash salt (always managed, stable across upgrades) ---- */}}
  {{- $salt := "" }}
  {{- if $existing }}{{- $salt = index $existing.data "hash-salt" | default "" | b64dec }}{{- end }}
  {{- if not $salt }}{{- $salt = randAlphaNum 64 }}{{- end }}
  hash-salt: {{ $salt | b64enc | quote }}
  {{- /* ---- DB password (managed unless an external existingSecret supplies it) ---- */}}
  {{- if include "drupal.manageDbPassword" . }}
  {{- $pw := "" }}
  {{- if .Values.mysql.enabled }}
  {{- $pw = .Values.mysql.auth.password }}
  {{- if not $pw }}
  {{- $mysqlSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mysql" .Release.Name) }}
  {{- if $mysqlSecret }}{{- $pw = index $mysqlSecret.data "mysql-password" | default "" | b64dec }}{{- end }}
  {{- end }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  {{- else }}
  {{- $pw = .Values.externalDatabase.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  {{- end }}
  db-password: {{ $pw | b64enc | quote }}
  {{- end }}

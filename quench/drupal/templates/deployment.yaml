{{/* Liveness and readiness both hit / on the HTTP port. nginx answers 2xx, or a 30x
     redirect to the installer/login flow, only once php-fpm is up AND Drupal can reach MySQL
     (a down DB makes Drupal error) — so --wait on readiness is the real integration test. The
     startup probe (customStartupProbe) gates these during the DB init window. The kubelet
     performs the GET; the image ships no HTTP client on PATH. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $port := ternary "https" "http" (eq $tls "true") -}}
{{- $scheme := ternary "HTTPS" "HTTP" (eq $tls "true") -}}
{{- $liveness := dict "httpGet" (dict "path" "/" "port" $port "scheme" $scheme) "initialDelaySeconds" 20 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/" "port" $port "scheme" $scheme) "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 60 -}}
{{- $startup := dict "httpGet" (dict "path" "/core/install.php" "port" $port "scheme" $scheme) "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The files PVC is ReadWriteOnce and held exclusively; Recreate avoids two pods contending
  # for the volume during a rollout.
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the managed Secret (DB password + hash salt) or settings.php changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "drupal.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if or .Values.initContainers $tls }}
      initContainers:
        {{- if $tls }}
        # Native TLS in the app's own nginx: derive the image's /etc/nginx/conf.d/drupal.conf with an
        # extra `listen 8443 ssl` (and the certificate) beside its 8080 listen, so the
        # site config itself is never copied into the chart. nginx sets $https, which
        # fastcgi_params passes to PHP as HTTPS=on.
        - name: tls-nginx-conf
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              awk '/listen 8080 default_server;/ && !done {
                     print "    listen 8443 ssl;"
                     print "    ssl_certificate /tls/tls.crt;"
                     print "    ssl_certificate_key /tls/tls.key;"
                     done = 1 } { print }' /etc/nginx/conf.d/drupal.conf > /tls-nginx/drupal.conf
              grep -q 'listen 8443 ssl;' /tls-nginx/drupal.conf
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: tls-nginx
              mountPath: /tls-nginx
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: drupal
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # settings.php (mounted from the ConfigMap) reads all of these at request time.
            - name: DRUPAL_DB_HOST
              value: {{ include "drupal.db.host" . | quote }}
            - name: DRUPAL_DB_PORT
              value: {{ include "drupal.db.port" . | quote }}
            - name: DRUPAL_DB_NAME
              value: {{ include "drupal.db.name" . | quote }}
            - name: DRUPAL_DB_USER
              value: {{ include "drupal.db.user" . | quote }}
            # Password is sourced from a Secret, never inlined into the pod env / argv.
            - name: DRUPAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.secretName" . }}
                  key: {{ include "drupal.secretPasswordKey" . }}
            {{- with .Values.drupal.tablePrefix }}
            - name: DRUPAL_DB_PREFIX
              value: {{ . | quote }}
            {{- end }}
            # Hash salt from the managed Secret (stable across upgrades).
            - name: DRUPAL_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "quench-common.fullname" . }}
                  key: hash-salt
            {{- with .Values.drupal.trustedHostPatterns }}
            - name: DRUPAL_TRUSTED_HOST_PATTERNS
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: {{ $port }}
              containerPort: {{ ternary 8443 .Values.service.port (eq $tls "true") }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The chart-supplied settings.php (subPath so it doesn't shadow the docroot).
            - name: settings
              mountPath: /opt/drupal/sites/default/settings.php
              subPath: settings.php
              readOnly: true
            # Public files (uploads, aggregated css/js) — the one writable app path.
            - name: files
              mountPath: {{ .Values.persistence.mountPath }}
            # Writable scratch: nginx pid/temp, php sessions/uploads, Drupal temp (see the image).
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- if $tls }}
            - name: tls-nginx
              mountPath: /etc/nginx/conf.d/drupal.conf
              subPath: drupal.conf
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: settings
          configMap:
            name: {{ include "quench-common.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: files
        {{- if not .Values.persistence.enabled }}
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "quench-common.fullname" . }}-files
        {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- if $tls }}
        # the derived nginx config, in memory
        - name: tls-nginx
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

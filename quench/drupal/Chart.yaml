apiVersion: v2
name: drupal
description: Hardened Drupal CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.9
appVersion: "11.4.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/drupal/drupal
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - drupal
  - cms
  - publishing
  - content-management
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pin to rebuilt 0-CVE image(s); update to the current app version."
  # Drupal is a content-management web application; the ArtifactHub category enum
  # (ai-machine-learning, database, integration-delivery, monitoring-logging, networking,
  # security, skip-prediction, storage, streaming-messaging) has no CMS/web-app bucket.
  # "skip-prediction" is AH's explicit "no category fits" value — the honest choice for a
  # CMS (mirrors quench/ghost and quench/wordpress, the nearest CMS analogs in this catalog).
  category: skip-prediction
  licenses: GPL-2.0-or-later
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/drupal/drupal
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: drupal
      image: ghcr.io/quenchworks/images/drupal@sha256:23aa2bdb493cedda7c0d64d0f3f423d463f65e55abbed1bbfd45066ec8976eb0
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:e345a54ed4d42b030515ec9e5b6bf359e3d303f4fbc7deea83800e28e5cc1cee
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

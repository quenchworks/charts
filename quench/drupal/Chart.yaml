apiVersion: v2
name: drupal
description: Hardened Drupal CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, with a bundled MySQL backend.
type: application
version: 0.0.35
appVersion: "11.4.11"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/drupal/drupal
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - drupal
  - cms
  - publishing
  - content-management
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:

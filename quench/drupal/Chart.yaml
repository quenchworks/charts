dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    alias: mysql
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled

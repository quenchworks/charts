{{- /* The JWT signing secret: generated once (48 characters; donetick refuses fewer than 32) and read back on
       upgrade, so sessions survive restarts and upgrades. */}}
{{- if not .Values.jwt.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $s := .Values.jwt.secret | default (get $old "jwt-secret" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $s | b64enc | quote }}
{{- end }}

# Quenchworks Unbound: a validating, recursive, caching DNS resolver on the QuenchWorks
# unbound image (nonroot, 0-CVE, cosign-signed, pinned by digest). The image listens on
# 5053; the Service serves DNS on 53 over UDP and TCP.
image:
  repository: ghcr.io/quenchworks/images/unbound
  digest: "sha256:241af0530f6316bcc2329c22e25fdc042d0801bd02d9f96ed1bba4f04c511f4f"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

replicas: 2

# Extra unbound.conf content, mounted as /etc/unbound/conf.d/chart.conf and read by the
# image's include-toplevel. Each clause names itself (server:, forward-zone:, ...).
# The image's built-in config already sets the listener, DNSSEC and access control for
# 127/8, 10/8, 172.16/12 and 192.168/16. Example:
#   config: |
#     server:
#       local-data: "db.internal. A 10.0.0.5"
#     forward-zone:
#       name: "corp.example."
#       forward-addr: 10.0.0.53
config: ""

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 53
  # a fixed address, e.g. to point a node's or a pod's dnsConfig at it
  clusterIP: ""
  # DNS over TLS (the pod's 8853), only with tls.enabled
  tlsPort: 853

# Native TLS: DNS over TLS on 8853 (published as service.tlsPort) beside plain DNS, with the
# certificate mounted at /tls. It comes from the first source set: existingSecret, then a
# cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

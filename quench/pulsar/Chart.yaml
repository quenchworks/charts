apiVersion: v2
name: pulsar
description: Quenchworks hardened Apache Pulsar. Minimal, nonroot, 0-CVE image pinned by digest. Single-node standalone (broker + in-process BookKeeper + embedded RocksDB metadata in one JVM); multi-node cluster is a follow-up.
type: application
version: 0.0.1
appVersion: "4.0.11"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/pulsar
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts

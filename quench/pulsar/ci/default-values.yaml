# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
config:
  # Modest heap for the smoke; standalone still needs real off-heap direct memory.
  mem: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
# Pulsar standalone is memory-hungry. Give it room to actually start in kind; raise the
# limit if the pod is OOMKilled (like CouchDB needed).
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 3Gi }

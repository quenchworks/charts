{{- if .Values.networkPolicy.enabled }}
{{/*
  Pulsar ships no auth by default, so this NetworkPolicy is the trust boundary for both
  the binary protocol on 6650 and the HTTP admin/REST API on 8080. allowExternal=false
  restricts ingress to in-cluster pods.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: pulsar
          protocol: TCP
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

{{/*
  Pulsar standalone is slow to boot (broker + in-process BookKeeper bookie + embedded
  RocksDB metadata in one JVM, ~40-90s). Use a generous startup window before probing
  the unauthenticated brokers/health endpoint.
*/}}
{{- $liveness := dict "httpGet" (dict "path" "/admin/v2/brokers/health" "port" "http") "initialDelaySeconds" 60 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 10 -}}
{{- $readiness := dict "httpGet" (dict "path" "/admin/v2/brokers/health" "port" "http") "initialDelaySeconds" 40 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- if $tls }}
{{- $_ := set $liveness "httpGet" (dict "path" "/admin/v2/brokers/health" "port" "https" "scheme" "HTTPS") }}
{{- $_ := set $readiness "httpGet" (dict "path" "/admin/v2/brokers/health" "port" "https" "scheme" "HTTPS") }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pulsar.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pulsar.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if $tls }}
      initContainers:
        {{- include "quench-common.tls.pkcs8InitContainer" (dict "ctx" . "image" (printf "%s@%s" .Values.busybox.repository .Values.busybox.digest)) | nindent 8 }}
        # a TLS copy of standalone.conf in an emptyDir (PULSAR_STANDALONE_CONF), so the
        # conf on the data volume stays as it was and turning TLS off leaves nothing behind.
        # Plain ports are blanked: Java Properties keep the last value of a key.
        - name: tls-config
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/bash
            - -ec
            - |
              src=/pulsar/conf/standalone.conf
              [ -f "$src" ] || src=/opt/pulsar/conf/standalone.conf
              { cat "$src"; cat <<'EOF'
              # --- QuenchWorks chart: tls.enabled ---
              brokerServicePort=
              webServicePort=
              brokerServicePortTls={{ .Values.service.pulsarTlsPort }}
              webServicePortTls={{ .Values.service.httpsPort }}
              tlsCertificateFilePath=/tls-pkcs8/tls.crt
              tlsKeyFilePath=/tls-pkcs8/tls.key
              tlsTrustCertsFilePath=/tls-pkcs8/ca.crt
              brokerClientTlsEnabled=true
              brokerClientTrustCertsFilePath=/tls-pkcs8/ca.crt
              EOF
              } > /pulsar-tls-conf/standalone.conf
          volumeMounts:
            - name: data
              mountPath: /pulsar
              readOnly: true
            - name: tls-conf
              mountPath: /pulsar-tls-conf
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      {{- end }}
      containers:
        - name: pulsar
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            # Read-only rootfs: the entrypoint relocates ALL writable state (BookKeeper
            # journal+ledgers, embedded RocksDB metadata, logs, conf seed, JVM tmpdir)
            # under the single writable /pulsar mount. These are the dist defaults; set
            # explicitly for clarity. The /pulsar mount MUST allow exec (RocksDB/bookie
            # mmap a native .so from PULSAR_TMP_DIR).
            - name: PULSAR_DATA_DIR
              value: /pulsar/data
            - name: PULSAR_LOG_DIR
              value: /pulsar/logs
            - name: PULSAR_CONF_DIR
              value: /pulsar/conf
            - name: PULSAR_TMP_DIR
              value: /pulsar/tmp
            - name: PULSAR_MEM
              value: {{ .Values.config.mem | quote }}
            {{- with .Values.config.advertisedAddress }}
            - name: PULSAR_ADVERTISED_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            - name: PULSAR_FUNCTIONS_WORKER
              value: {{ ternary "1" "0" .Values.config.functionsWorker | quote }}
            - name: PULSAR_STREAM_STORAGE
              value: {{ ternary "1" "0" .Values.config.streamStorage | quote }}
            {{- if $tls }}
            - name: PULSAR_STANDALONE_CONF
              value: /pulsar-tls-conf/standalone.conf
            {{- end }}
            {{- with .Values.config.extraOpts }}
            - name: PULSAR_EXTRA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- if $tls }}
            - name: pulsar-tls
              containerPort: {{ .Values.service.pulsarTlsPort }}
            - name: https
              containerPort: {{ .Values.service.httpsPort }}
            {{- else }}
            - name: pulsar
              containerPort: {{ .Values.service.pulsarPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # one writable mount covers data + logs + conf + tmp (uid 1001); exec-capable
            - name: data
              mountPath: /pulsar
            {{- if $tls }}
            - name: tls-conf
              mountPath: /pulsar-tls-conf
              readOnly: true
            {{- include "quench-common.tls.pkcs8VolumeMount" . | nindent 12 }}
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- if or (and .Values.persistence.enabled .Values.persistence.existingClaim) (not .Values.persistence.enabled) .Values.extraVolumes $tls }}
      volumes:
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $tls }}
        - name: tls-conf
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.tls.pkcs8Volume" . | nindent 8 }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

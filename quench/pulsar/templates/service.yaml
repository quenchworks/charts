apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.pulsarTlsPort }}
      targetPort: pulsar-tls
      name: pulsar-tls
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.pulsarPort }}
      targetPort: pulsar
      name: pulsar
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsar.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.pulsarTlsPort }}
      targetPort: pulsar-tls
      name: pulsar-tls
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.pulsarPort }}
      targetPort: pulsar
      name: pulsar
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

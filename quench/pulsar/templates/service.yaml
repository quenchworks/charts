apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.pulsarPort }}
      targetPort: pulsar
      name: pulsar
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsar.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.pulsarPort }}
      targetPort: pulsar
      name: pulsar
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

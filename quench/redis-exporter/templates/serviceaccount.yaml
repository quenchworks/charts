{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-exporter.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The exporter never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

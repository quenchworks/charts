{{- /* Without clientCA.existingSecret the chart makes a client CA and one client certificate
       signed by it (CN <fullname>-client, allowed by default). Both are read back on upgrade,
       so clients that mounted this Secret keep connecting. */}}
{{- if not .Values.clientCA.existingSecret }}
{{- $name := include "ghostunnel.clientCASecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $d := ($old | default dict).data | default dict }}
{{- $ca := get $d "ca.crt" }}{{- $crt := get $d "tls.crt" }}{{- $key := get $d "tls.key" }}
{{- if not (and $ca $crt $key) }}
{{- $days := int .Values.clientCA.validityDays }}
{{- $c := genCA (printf "%s-client-ca" (include "quench-common.fullname" .)) $days }}
{{- $cert := genSignedCert (include "ghostunnel.clientCN" .) nil nil $days $c }}
{{- $ca = $c.Cert | b64enc }}{{- $crt = $cert.Cert | b64enc }}{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}

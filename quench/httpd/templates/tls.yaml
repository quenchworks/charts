{{- include "quench-common.tls.resources" . }}
{{- if include "quench-common.tls.enabled" . }}
---
# A TLS virtual host on 8443 over the default doc root, mounted at /etc/httpd/conf.d (which the
# image's httpd.conf includes). mod_ssl and shmcb are already loaded by the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-tls
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  tls-quench.conf: |
    Listen 8443
    SSLSessionCache "shmcb:/tmp/ssl_scache(512000)"
    <VirtualHost *:8443>
        SSLEngine on
        SSLCertificateFile    /tls/tls.crt
        SSLCertificateKeyFile /tls/tls.key
    </VirtualHost>
{{- end }}

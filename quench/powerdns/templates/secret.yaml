{{- if and .Values.api.enabled (not .Values.api.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $key := .Values.api.key -}}
{{- if not $key -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $key = index .data "api-key" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $key -}}{{- $key = randAlphaNum 32 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}
{{- end }}

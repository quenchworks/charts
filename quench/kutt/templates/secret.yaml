{{- /* The JWT signing secret and the admin password: generated once and read back on upgrade. */}}
{{- if not .Values.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $jwt := .Values.jwtSecret | default (get $old "jwt-secret" | b64dec) | default (randAlphaNum 48) }}
{{- $pw := .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwt | b64enc | quote }}
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}

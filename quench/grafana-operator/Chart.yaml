apiVersion: v2
name: grafana-operator
description: "Grafana Operator: run Grafana instances and manage their dashboards, datasources, folders, alert rules, contact points and notification policies from Kubernetes custom resources, also against a Grafana it does not run. The thirteen CRDs ship with the chart and new Grafana instances default to the QuenchWorks Grafana image. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "5.25.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - grafana
  - grafana-operator
  - dashboards
  - monitoring
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/grafana-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: grafana-operator
      image: ghcr.io/quenchworks/images/grafana-operator@sha256:4b5bd3d08fac151197270c8f42d5b51ac8697b3761208195739071c0fdac7986
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:b57a376c691e019e391fcb472247c14a8c825879bcf9a5d760590b0d887bbd72
  artifacthub.io/crds: |
    - kind: GrafanaAlertRuleGroup
      version: v1beta1
      name: grafanaalertrulegroups.grafana.integreatly.org
      displayName: Grafana Alert Rule Group
      description: Grafana Alert Rule Group managed by the Grafana Operator.
    - kind: GrafanaContactPoint
      version: v1beta1
      name: grafanacontactpoints.grafana.integreatly.org
      displayName: Grafana Contact Point
      description: Grafana Contact Point managed by the Grafana Operator.
    - kind: GrafanaDashboard
      version: v1beta1
      name: grafanadashboards.grafana.integreatly.org
      displayName: Grafana Dashboard
      description: Grafana Dashboard managed by the Grafana Operator.
    - kind: GrafanaDatasource
      version: v1beta1
      name: grafanadatasources.grafana.integreatly.org
      displayName: Grafana Datasource
      description: Grafana Datasource managed by the Grafana Operator.
    - kind: GrafanaFolder
      version: v1beta1
      name: grafanafolders.grafana.integreatly.org
      displayName: Grafana Folder
      description: Grafana Folder managed by the Grafana Operator.
    - kind: GrafanaLibraryPanel
      version: v1beta1
      name: grafanalibrarypanels.grafana.integreatly.org
      displayName: Grafana Library Panel
      description: Grafana Library Panel managed by the Grafana Operator.
    - kind: GrafanaManifest
      version: v1beta1
      name: grafanamanifests.grafana.integreatly.org
      displayName: Grafana Manifest
      description: Grafana Manifest managed by the Grafana Operator.
    - kind: GrafanaMuteTiming
      version: v1beta1
      name: grafanamutetimings.grafana.integreatly.org
      displayName: Grafana Mute Timing
      description: Grafana Mute Timing managed by the Grafana Operator.
    - kind: GrafanaNotificationPolicy
      version: v1beta1
      name: grafananotificationpolicies.grafana.integreatly.org
      displayName: Grafana Notification Policy
      description: Grafana Notification Policy managed by the Grafana Operator.
    - kind: GrafanaNotificationPolicyRoute
      version: v1beta1
      name: grafananotificationpolicyroutes.grafana.integreatly.org
      displayName: Grafana Notification Policy Route
      description: Grafana Notification Policy Route managed by the Grafana Operator.
    - kind: GrafanaNotificationTemplate
      version: v1beta1
      name: grafananotificationtemplates.grafana.integreatly.org
      displayName: Grafana Notification Template
      description: Grafana Notification Template managed by the Grafana Operator.
    - kind: GrafanaServiceAccount
      version: v1beta1
      name: grafanaserviceaccounts.grafana.integreatly.org
      displayName: Grafana Service Account
      description: Grafana Service Account managed by the Grafana Operator.
    - kind: Grafana
      version: v1beta1
      name: grafanas.grafana.integreatly.org
      displayName: Grafana
      description: Grafana managed by the Grafana Operator.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

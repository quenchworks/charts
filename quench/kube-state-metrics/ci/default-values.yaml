# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Defaults are already installable -- the exporter needs nothing but its own RBAC --
# so this only trims the request floor for a single-node kind runner.
replicaCount: 1
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 500m, memory: 512Mi }

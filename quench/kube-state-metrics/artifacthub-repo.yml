# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-kube-state-metrics, OCI URL oci://ghcr.io/quenchworks/charts/kube-state-metrics.
# Placeholder until the AH repo exists: register it with `ah/ah.py sync --apply`
# AFTER the first chart push, so ArtifactHub does not log a DENIED tracking error
# against an OCI path that has never been published.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # kube-state-metrics (oci://ghcr.io/quenchworks/charts/kube-state-metrics)
owners:
  - name: mkabumattar
    email: info@quench-works.com

{{/* Both listeners are in the default policy: the metrics port Prometheus scrapes
     and the telemetry port that answers health. allowExternal defaults to false, so
     only same-namespace pods reach either one. */}}
{{- $ports := list (dict "port" "http-metrics" "protocol" "TCP") (dict "port" "telemetry" "protocol" "TCP") -}}
{{- include "quench-common.networkPolicy" (dict "ctx" . "defaultPorts" $ports) }}

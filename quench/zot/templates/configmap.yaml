{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zot.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /etc/zot/config.json (the image runs `zot serve /etc/zot/config.json`).
  config.json: |-
    {{- .Values.config.configJson | nindent 4 }}
{{- end }}

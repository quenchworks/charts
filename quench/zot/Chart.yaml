apiVersion: v2
name: zot
description: "A production-ready, vendor-neutral OCI-native container image registry for storing and distributing OCI artifacts. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.10
appVersion: "2.1.18"
keywords:
  - zot
  - registry
  - oci
  - containers
  - distribution
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/project-zot/zot
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt on current Wolfi; refreshes the pinned digest"
  artifacthub.io/images: |
    - name: zot
      image: ghcr.io/quenchworks/images/zot@sha256:0a6c6792306b12ff3667332f6f5066868ff0c5c5b4a9b594071b69e3d0a0b1b0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

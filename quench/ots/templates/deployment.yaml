{{- $tls := eq (include "quench-common.tls.enabled" .) "true" -}}
{{- $probe := dict "httpGet" (dict "path" "/" "port" (ternary "https" "http" $tls) "scheme" (ternary "HTTPS" "HTTP" $tls)) "periodSeconds" 15 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # in-memory storage keeps secrets in one process: one replica unless Valkey (or external Redis) holds them
  replicas: {{ ternary .Values.replicaCount 1 (or .Values.valkey.enabled (not (empty .Values.externalRedis.existingSecret))) }}
  strategy:
    {{- toYaml (.Values.updateStrategy | default (dict "type" "RollingUpdate")) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (list .Values.secretExpiry .Values.tls .Values.valkey.enabled .Values.externalRedis) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ots
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: LISTEN, value: ":3000" }
            - { name: SECRET_EXPIRY, value: {{ .Values.secretExpiry | quote }} }
            {{- if .Values.valkey.enabled }}
            - { name: STORAGE_TYPE, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ printf "%s-valkey" .Release.Name }}, key: valkey-password }
            - { name: REDIS_URL, value: {{ printf "redis://:$(REDIS_PASSWORD)@%s-valkey:6379/0" .Release.Name | quote }} }
            {{- else if .Values.externalRedis.existingSecret }}
            - { name: STORAGE_TYPE, value: redis }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.externalRedis.existingSecret }}, key: {{ .Values.externalRedis.existingSecretUrlKey }} }
            {{- else }}
            - { name: STORAGE_TYPE, value: mem }
            {{- end }}
            {{- if $tls }}
            # OTS serves HTTPS itself from the PEM pair at /tls
            - { name: ENABLE_TLS, value: "true" }
            - { name: CERT_FILE, value: /tls/tls.crt }
            - { name: KEY_FILE, value: /tls/tls.key }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "ots.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

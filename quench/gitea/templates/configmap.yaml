{{/*
The app.ini template. Non-secret config only — the DB password, SECRET_KEY and
INTERNAL_TOKEN are injected at runtime from the Secret via GITEA__<section>__<KEY>
environment variables (Gitea overlays env over app.ini), so no secrets land in this
ConfigMap. INSTALL_LOCK=true disables the web installer (we configure everything
here + via env). The init flow copies this into the writable /etc/gitea so Gitea
can rewrite it (e.g. to record the generated OAuth JWT secret) on a read-only rootfs.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitea.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  app.ini: |
    APP_NAME = Quenchworks Gitea
    RUN_MODE = prod
    RUN_USER = gitea
    WORK_PATH = /data

    [server]
    PROTOCOL = http
    HTTP_ADDR = 0.0.0.0
    HTTP_PORT = {{ .Values.service.port }}
    {{- if .Values.server.rootUrl }}
    ROOT_URL = {{ .Values.server.rootUrl }}
    {{- end }}
    {{- if .Values.server.domain }}
    DOMAIN = {{ .Values.server.domain }}
    {{- end }}
    DISABLE_SSH = false
    START_SSH_SERVER = true
    SSH_LISTEN_HOST = 0.0.0.0
    SSH_PORT = {{ .Values.service.sshPort }}
    SSH_LISTEN_PORT = {{ .Values.service.sshPort }}
    {{- if or .Values.server.sshDomain .Values.server.domain }}
    SSH_DOMAIN = {{ .Values.server.sshDomain | default .Values.server.domain }}
    {{- end }}
    APP_DATA_PATH = /data
    LFS_START_SERVER = true

    [database]
    DB_TYPE = postgres
    HOST = {{ include "gitea.db.host" . }}:{{ include "gitea.db.port" . }}
    NAME = {{ include "gitea.db.name" . }}
    USER = {{ include "gitea.db.user" . }}
    SSL_MODE = disable
    PASSWD = __DB_PASSWD__

    [repository]
    ROOT = /data/git/repositories

    [security]
    INSTALL_LOCK = true
    SECRET_KEY = __SECRET_KEY__
    INTERNAL_TOKEN = __INTERNAL_TOKEN__

    [service]
    DISABLE_REGISTRATION = {{ .Values.server.disableRegistration }}
    REQUIRE_SIGNIN_VIEW = false

    [session]
    PROVIDER = file

    [log]
    MODE = console
    LEVEL = info
    ROOT_PATH = /data/log

    [oauth2]
    {{- /* JWT_SECRET is generated by gitea on first boot and written back into the
           writable /etc/gitea/app.ini */}}

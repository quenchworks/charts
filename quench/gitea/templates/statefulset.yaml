{{/* httpGet probes hit /api/healthz on the HTTP port: it returns 200 once Gitea has
     connected to Postgres and is serving. The runtime image ships no shell HTTP
     client; the kubelet does the GET. First boot runs migrations against Postgres,
     so the readiness window is generous. */}}
{{- $liveness := dict "httpGet" (dict "path" "/api/healthz" "port" "http") "initialDelaySeconds" 30 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/healthz" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
{{- $secretName := include "gitea.secretName" . -}}
{{- $dbSecretName := include "gitea.db.secretName" . -}}
{{- $dbSecretKey := include "gitea.db.secretPasswordKey" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gitea.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # roll the pod when the app.ini config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gitea.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        {{- include "quench-common.initContainers" . | nindent 8 }}
        # Bootstrap: seed the writable app.ini from the ConfigMap, run DB migrations,
        # then idempotently create the admin user so the API/UI can authenticate it.
        # Runs the same hardened image; the secrets arrive via env (GITEA__* + the
        # admin user/password) so nothing is written to disk in plaintext beyond the
        # writable /etc/gitea (emptyDir, gone with the pod).
        - name: bootstrap
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # seed the writable app.ini from the mounted ConfigMap, then fill in the
              # secret placeholders in place (under their proper INI sections). Gitea's
              # GITEA__<section>__<KEY> env overlay only runs for `gitea web` (via
              # environment-to-ini), NOT for `gitea migrate` / `gitea admin`, so the DB
              # password + security tokens must live in app.ini for those subcommands.
              # /etc/gitea is a shared writable emptyDir, so the rendered app.ini is in
              # place for the main `gitea web` container too. Secret values are
              # alphanumeric (randAlphaNum), safe to splice with sed. Pass them via
              # env-substituted temp files to keep them off the process args / logs.
              cp /tmp/cfg/app.ini /etc/gitea/app.ini
              chmod 0640 /etc/gitea/app.ini
              sed -i \
                -e "s|__DB_PASSWD__|${DB_PASSWD}|" \
                -e "s|__SECRET_KEY__|${GITEA_SECRET_KEY}|" \
                -e "s|__INTERNAL_TOKEN__|${GITEA_INTERNAL_TOKEN}|" \
                /etc/gitea/app.ini
              # run schema migrations (idempotent; safe to re-run on every boot)
              gitea migrate --config /etc/gitea/app.ini
              # create the admin user if it does not already exist (idempotent)
              if gitea admin user list --config /etc/gitea/app.ini --admin \
                   | awk '{print $2}' | grep -qx "${GITEA_ADMIN_USERNAME}"; then
                echo "admin user '${GITEA_ADMIN_USERNAME}' already exists, skipping create"
              else
                echo "creating admin user '${GITEA_ADMIN_USERNAME}'"
                gitea admin user create --config /etc/gitea/app.ini \
                  --admin \
                  --username "${GITEA_ADMIN_USERNAME}" \
                  --password "${GITEA_ADMIN_PASSWORD}" \
                  --email "{{ .Values.auth.adminEmail }}" \
                  --must-change-password=false
              fi
          env:
            - name: GITEA_WORK_DIR
              value: /data
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecretName }}
                  key: {{ $dbSecretKey }}
            - name: GITEA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: secret-key
            - name: GITEA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: internal-token
            - name: GITEA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.secretName" . }}
                  key: {{ include "gitea.secretUserKey" . }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.secretName" . }}
                  key: {{ include "gitea.secretPasswordKey" . }}
          volumeMounts:
            - name: config
              mountPath: /tmp/cfg
              readOnly: true
            - name: gitea-conf
              mountPath: /etc/gitea
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: gitea
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: GITEA_WORK_DIR
              value: /data
            - name: GITEA_APP_INI
              value: /etc/gitea/app.ini
            # The DB password + security tokens are already written into the shared
            # /etc/gitea/app.ini by the bootstrap initContainer (Gitea's env overlay
            # does not cover the migrate/admin subcommands, so app.ini is the single
            # source of truth), so no GITEA__* secret env is needed here.
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: ssh
              containerPort: {{ .Values.service.sshPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read-only rootfs: Gitea writes to /data (repos, lfs, the host ssh key),
            # the writable /etc/gitea (app.ini, rewritten for the generated OAuth JWT
            # secret) and /tmp.
            - name: gitea-conf
              mountPath: /etc/gitea
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gitea.configMapName" . }}
        - name: gitea-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

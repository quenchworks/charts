{{/*
The managed Secret carries:
  - admin-user / admin-password : the Gitea bootstrap admin (the initContainer runs
    `gitea admin user create --admin`). The password is generated once (24 chars)
    and preserved across upgrades via lookup.
  - db-password : the database password Gitea uses. When the bundled PostgreSQL is
    enabled this is the deterministic postgresql.auth.password (the same value the
    subchart initializes its superuser with). When external WITHOUT an existingSecret,
    it is externalDatabase.password.
  - secret-key / internal-token : Gitea's security tokens (security.SECRET_KEY,
    security.INTERNAL_TOKEN). Generated once and preserved across upgrades — changing
    them would invalidate existing sessions / 2FA secrets, so lookup-persistence is
    essential.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderAdmin := not .Values.auth.existingSecret -}}
{{- $renderDb := or .Values.postgresql.enabled (not .Values.externalDatabase.existingSecret) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderAdmin }}
  {{- $pw := .Values.auth.adminPassword -}}
  {{- if and (not $pw) $existing -}}
  {{- $pw = index $existing.data "admin-password" | b64dec -}}
  {{- end -}}
  {{- if not $pw -}}
  {{- $pw = randAlphaNum 24 -}}
  {{- end }}
  admin-user: {{ .Values.auth.adminUser | b64enc | quote }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $renderDb }}
  {{- $dbpw := "" -}}
  {{- if .Values.postgresql.enabled -}}
  {{- $dbpw = .Values.postgresql.auth.password -}}
  {{- else -}}
  {{- $dbpw = .Values.externalDatabase.password -}}
  {{- end -}}
  {{- if and (not $dbpw) $existing -}}
  {{- $dbpw = index $existing.data "db-password" | b64dec -}}
  {{- end -}}
  {{- if not $dbpw -}}
  {{- $dbpw = randAlphaNum 24 -}}
  {{- end }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
  {{- /* security tokens: reuse the persisted values if present, else generate */ -}}
  {{- $secretKey := "" -}}
  {{- $internalToken := "" -}}
  {{- if $existing -}}
  {{- if hasKey $existing.data "secret-key" -}}{{- $secretKey = index $existing.data "secret-key" | b64dec -}}{{- end -}}
  {{- if hasKey $existing.data "internal-token" -}}{{- $internalToken = index $existing.data "internal-token" | b64dec -}}{{- end -}}
  {{- end -}}
  {{- if not $secretKey -}}{{- $secretKey = randAlphaNum 64 -}}{{- end -}}
  {{- if not $internalToken -}}{{- $internalToken = randAlphaNum 64 -}}{{- end }}
  secret-key: {{ $secretKey | b64enc | quote }}
  internal-token: {{ $internalToken | b64enc | quote }}

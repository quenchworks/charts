# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
# Bundles the Quenchworks PostgreSQL subchart with persistence off; deterministic
# shared DB credentials; a fixed test admin password (so the gate can assert API auth);
# Gitea's own persistence off; small resources for the runner.
postgresql:
  enabled: true
  auth:
    username: gitea
    password: gitea
    database: giteadb
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

persistence:
  enabled: false

auth:
  adminUser: gitea_admin
  adminPassword: "ci-test-password"
  adminEmail: "admin@quenchworks.test"

resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { cpu: "2", memory: 1Gi }

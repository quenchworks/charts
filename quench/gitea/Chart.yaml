apiVersion: v2
name: gitea
description: "Lightweight self-hosted Git service with repositories, issues, pull requests, and built-in CI/CD (Actions). Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.58
appVersion: "1.27.3"
keywords:
  - gitea
  - git
  - scm
  - ci-cd
  - integration-delivery
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/go-gitea/gitea
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned gitea to a rebuilt image digest (no application version change)."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: gitea
      image: ghcr.io/quenchworks/images/gitea@sha256:017d1eee78410bbcd3774c06ef62acf8a7bd0352fa12629f1ca3b0a974b89e0a
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

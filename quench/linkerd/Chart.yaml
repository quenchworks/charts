apiVersion: v2
name: linkerd
description: "Linkerd service mesh, control plane and data plane (edge release line): destination with the policy server, identity (the mesh CA) and the proxy injector, each running its own proxy, so annotated workloads get mutual TLS. Uses the QuenchWorks linkerd-cni chart instead of linkerd-init. Hardened by QuenchWorks: built from source, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.1.0
appVersion: "26.8.4"
keywords:
  - linkerd
  - service-mesh
  - edge
  - rust
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/linkerd/linkerd2
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Data plane: proxy injector and linkerd-proxy 2.366.0 (the proxy edge-26.8.4 pairs with), the control plane's own pods meshed, CNI mode with the linkerd-cni chart."
    - kind: changed
      description: "BREAKING: upstream's fixed object names (linkerd-destination, linkerd-dst, linkerd-identity, linkerd-proxy-injector, ...), the policy server in the destination pod, identity required. 0.0.x cannot be upgraded in place: uninstall, then install."
    - kind: removed
      description: "heartbeat and the NetworkPolicy."
  artifacthub.io/category: networking
  artifacthub.io/images: |

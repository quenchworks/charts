apiVersion: v2
name: linkerd
description: "Linkerd's control plane, from-source on QuenchWorks 0-CVE images pinned by digest: the destination service-profile/xDS controller and (optionally) the identity certificate authority and the Rust policy controller. Tracks Linkerd EDGE releases, since upstream has not cut a stable release since stable-2.14.10 (Feb 2024) and gates stable commercially. Sidecar injection (proxy-injector/sp-validator) and the linkerd-proxy data plane land in a later chart."
type: application
version: 0.0.7
appVersion: "26.8.4"
keywords:
  - linkerd
  - service-mesh
  - edge
  - rust
  - networking
maintainers:

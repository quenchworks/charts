apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-destination
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: destination
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: destination
  ports:
    - name: h2
      port: {{ .Values.service.destinationPort }}
      targetPort: h2
      protocol: TCP
    - name: admin
      port: {{ .Values.service.destinationAdminPort }}
      targetPort: admin
      protocol: TCP
---
{{- if .Values.identity.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-identity
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  ports:
    - name: h2
      port: {{ .Values.service.identityPort }}
      targetPort: h2
      protocol: TCP
    # The admin port carries /ready and /metrics. The Deployment has declared this
    # containerPort since the chart was written and the Service never exposed it,
    # so nothing outside the pod could probe identity or scrape it (charts run
    # 35243536390 failed exactly there). destination exposes both; these two did not.
    - name: admin
      port: {{ .Values.service.identityAdminPort }}
      targetPort: admin
      protocol: TCP
---
{{- end }}
{{- if .Values.policyController.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-policy
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-controller
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: policy-controller
  ports:
    - name: grpc
      port: {{ .Values.service.policyPort }}
      targetPort: grpc
      protocol: TCP
    # 9443 is the admission webhook endpoint a ValidatingWebhookConfiguration
    # targets, and admin carries /ready and /metrics. Both were declared on the
    # container and unreachable through the Service.
    - name: server
      port: 9443
      targetPort: server
      protocol: TCP
    - name: admin
      port: {{ .Values.service.policyAdminPort }}
      targetPort: admin
      protocol: TCP
{{- end }}

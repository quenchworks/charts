# One ServiceAccount per component, named as upstream: each name IS that component's mesh
# identity (linkerd-destination.<ns>.serviceaccount.identity.<ns>.<trust domain>), which every
# injected proxy verifies when it dials the control plane.
{{- range $c := list "destination" "identity" "proxy-injector" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkerd-{{ $c }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
    linkerd.io/control-plane-component: {{ $c }}
automountServiceAccountToken: false
{{- end }}
---
# destination: endpoints, service profiles and external workloads for discovery; EndpointSlice
# writes for external workloads; the policy server's leader lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-linkerd-destination
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [list, get, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, get, watch]
  - apiGroups: ['']
    resources: [pods, endpoints, services, nodes]
    verbs: [list, get, watch]
  - apiGroups: [linkerd.io]
    resources: [serviceprofiles]
    verbs: [list, get, watch]
  - apiGroups: [workload.linkerd.io]
    resources: [externalworkloads]
    verbs: [list, get, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, get, watch, create, update, patch, delete]
  # the policy server (same pod, same account)
  - apiGroups: [policy.linkerd.io]
    resources: [authorizationpolicies, httplocalratelimitpolicies, httproutes, meshtlsauthentications, networkauthentications, servers, serverauthorizations, egressnetworks]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes, tlsroutes, tcproutes]
    verbs: [get, list, watch]
  - apiGroups: [policy.linkerd.io]
    resources: [httproutes/status, httplocalratelimitpolicies/status, egressnetworks/status]
    verbs: [patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes/status, grpcroutes/status, tlsroutes/status, tcproutes/status]
    verbs: [patch]
---
# identity: authenticates each proxy's ServiceAccount token before signing its certificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-linkerd-identity
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
# proxy-injector: reads a pod's owners and namespace for their inject annotations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-linkerd-proxy-injector
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ['']
    resources: [namespaces, replicationcontrollers]
    verbs: [list, get, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [list, get, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, get, watch]
{{- range $c := list "destination" "identity" "proxy-injector" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Namespace }}-linkerd-{{ $c }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $.Release.Namespace }}-linkerd-{{ $c }} }
subjects:
  - { kind: ServiceAccount, name: linkerd-{{ $c }}, namespace: {{ $.Release.Namespace }} }
{{- end }}
---
# destination reads multicluster link Secrets in its own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linkerd-destination-secrets
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linkerd-destination-secrets
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: linkerd-destination-secrets }
subjects:
  - { kind: ServiceAccount, name: linkerd-destination, namespace: {{ .Release.Namespace }} }

{{- /* Audiobookshelf has no root account until someone posts the setup form, and until then anyone who reaches the
       server can claim it. This hook claims it right after install with the password from the Secret: it waits
       for /status, posts /init only while "isInit" is false (so upgrades and existing installs are left alone),
       then signs in to prove the password works. */}}
{{- $fullname := include "quench-common.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-bootstrap
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        # not the Deployment's selector labels: the Service must not route to this pod
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ printf "%s@%s" .Values.busybox.repository .Values.busybox.digest }}
          imagePullPolicy: {{ .Values.busybox.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: HOST, value: {{ printf "%s.%s.svc" $fullname .Release.Namespace | quote }} }
            - { name: PORT, value: {{ .Values.service.port | quote }} }
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "audiobookshelf.secretName" . }}
                  key: root-password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              U="http://$HOST:$PORT"
              for i in $(seq 1 60); do st=$(wget -q -O - "$U/status" 2>/dev/null) && break; sleep 5; done
              [ -n "$st" ] || { echo "Audiobookshelf did not answer /status"; exit 1; }
              pw=$(printf '%s' "$ROOT_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')
              if echo "$st" | grep -q '"isInit":false'; then
                wget -q -O /dev/null --header 'Content-Type: application/json' \
                  --post-data "{\"newRoot\":{\"username\":\"root\",\"password\":\"$pw\"}}" "$U/init"
                echo "root account created"
              else
                echo "root account already exists"
              fi
              wget -q -O - --header 'Content-Type: application/json' --header 'x-return-tokens: true' \
                --post-data "{\"username\":\"root\",\"password\":\"$pw\"}" "$U/login" | grep -q '"accessToken"' \
                || { echo "root cannot sign in with the password in the Secret"; exit 1; }
              echo "root signs in"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }

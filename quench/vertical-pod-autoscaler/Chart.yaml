apiVersion: v2
name: vertical-pod-autoscaler
description: "Vertical Pod Autoscaler: sizes pod CPU and memory requests from observed usage, with a recommender, an updater and a mutating admission webhook. Hardened by QuenchWorks as one minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "1.8.1"
kubeVersion: ">=1.28.0-0"
keywords:
  - vpa
  - autoscaling
  - resources
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 security-queue rebuilds"
  artifacthub.io/category: integration-delivery
  artifacthub.io/crds: |
    - kind: VerticalPodAutoscaler
      version: v1
      name: verticalpodautoscalers.autoscaling.k8s.io
      displayName: VerticalPodAutoscaler
      description: Target, policy and recommendation for one workload's resource requests.
    - kind: VerticalPodAutoscalerCheckpoint
      version: v1
      name: verticalpodautoscalercheckpoints.autoscaling.k8s.io
      displayName: VerticalPodAutoscalerCheckpoint
      description: The recommender's saved usage histograms.
  artifacthub.io/images: |
    - name: vertical-pod-autoscaler
      image: ghcr.io/quenchworks/images/vertical-pod-autoscaler@sha256:8086c9ca5380d2ebd0191420406bece07c06c7f6338126a62995dbdc75d31e9b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

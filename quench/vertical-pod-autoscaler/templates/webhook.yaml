{{- if .Values.admissionController.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}-tls
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "vpa.tls" . | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-webhook
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admission-controller
{{- end }}

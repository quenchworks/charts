{{- $comps := list (dict "name" "recommender" "v" .Values.recommender "port" 8942) (dict "name" "updater" "v" .Values.updater "port" 8943) (dict "name" "admission-controller" "v" .Values.admissionController "port" 8944) }}
{{- range $c := $comps }}
{{- if $c.v.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" $ }}-{{ $c.name }}
  labels:
    {{- include "quench-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  # Leader election is off upstream by default, so each component runs one replica.
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $c.name }}
  template:
    metadata:
      {{- if eq $c.name "admission-controller" }}
      annotations:
        # restart the webhook when its certificate is regenerated
        checksum/tls: {{ include "vpa.tls" $ | sha256sum }}
      {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $c.name }}
        {{- include "quench-common.podLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.fullname" $ }}-{{ $c.name }}
      securityContext:
        {{- include "quench-common.podSecurityContext" $ | nindent 8 }}
      {{- include "quench-common.podSpecFields" $ | nindent 6 }}
      containers:
        - name: {{ $c.name }}
          image: {{ include "quench-common.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          command: ["/usr/bin/vpa-{{ $c.name }}"]
          args:
            {{- if eq $c.name "admission-controller" }}
            - --webhook-service={{ include "quench-common.fullname" $ }}-webhook
            - --client-ca-file=/etc/tls-certs/caCert.pem
            - --tls-cert-file=/etc/tls-certs/serverCert.pem
            - --tls-private-key=/etc/tls-certs/serverKey.pem
            - --reload-cert
            {{- end }}
            {{- range $c.v.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # the namespace holding the webhook Service and the status lease
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ $c.port }}
              protocol: TCP
            {{- if eq $c.name "admission-controller" }}
            - name: webhook
              containerPort: 8000
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet: { path: /health-check, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health-check, port: metrics }
            periodSeconds: 10
          resources:
            {{- toYaml $c.v.resources | nindent 12 }}
          {{- if eq $c.name "admission-controller" }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
          {{- end }}
      {{- if eq $c.name "admission-controller" }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ include "quench-common.fullname" $ }}-tls
      {{- end }}
{{- end }}
{{- end }}

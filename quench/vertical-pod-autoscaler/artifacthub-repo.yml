# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-vertical-pod-autoscaler, OCI URL oci://ghcr.io/quenchworks/charts/vertical-pod-autoscaler.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # vertical-pod-autoscaler (oci://ghcr.io/quenchworks/charts/vertical-pod-autoscaler)

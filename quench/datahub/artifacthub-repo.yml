# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-datahub,
# OCI URL oci://ghcr.io/quenchworks/charts/datahub.
#
# The release workflow's metadata step skips the push (with a warning) while this
# still reads REPLACE_WITH_REPOSITORY_ID, so a placeholder never publishes a bad
# ID. Record the ID below in _plan-artifacts/artifacthub-repos.md as well.

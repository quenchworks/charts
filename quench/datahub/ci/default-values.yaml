# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digests from values.yaml, so the gate pulls the actual signed images.
# No passwords are set: a default install must work with the generated ones. Small
# volumes and heaps for the runner; everything else is the chart default (one Kafka
# broker, single-node Elasticsearch, standalone MySQL).
mysql:
  primary:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

kafka:
  kraft:
    heapOpts: "-Xmx512m -Xms512m"
  primary:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 640Mi }
      limits: { cpu: "1", memory: 1Gi }

elasticsearch:
  persistence:
    enabled: false
  config:
    heapSize: 512m
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "2", memory: 1536Mi }

gms:
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
frontend:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
setup:
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }

{{/*
The managed Secret: the UI admin password (and the user.props file the frontend's JAAS
login reads), the GMS system client secret, the token signing key and salt, the frontend
session secret and, for an external database without an existingSecret, its password.
Each is an explicit value, else this Secret's prior value (lookup, so upgrades keep it),
else generated. All of them live in this one chart, so no subchart has to agree on a
generated value. The bundled MySQL password stays in the MySQL subchart's own Secret.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $vals := dict "admin-password" (list .Values.auth.adminPassword 24) "system-client-secret" (list .Values.auth.systemClientSecret 32) "token-signing-key" (list .Values.auth.tokenSigningKey 48) "token-salt" (list .Values.auth.tokenSalt 32) "frontend-secret" (list .Values.auth.frontendSecret 64) -}}
{{- if and (not .Values.mysql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- $_ := set $vals "db-password" (list .Values.externalDatabase.password 24) -}}
{{- end -}}
{{- $out := dict -}}
{{- range $key, $spec := $vals -}}
{{- $v := index $spec 0 -}}
{{- if and (not $v) $existing -}}{{- $v = index $existing.data $key | default "" | b64dec -}}{{- end -}}
{{- if not $v -}}{{- $v = randAlphaNum (index $spec 1) -}}{{- end -}}
{{- $_ := set $out $key $v -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $v := $out }}
  {{ $key }}: {{ $v | b64enc | quote }}
  {{- end }}
  {{- /* the frontend's JAAS PropertyFileLoginModule file: one "user:password" line */}}
  user.props: {{ printf "datahub:%s\n" (get $out "admin-password") | b64enc | quote }}

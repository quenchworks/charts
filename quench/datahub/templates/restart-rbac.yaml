{{/* The GMS restart hook may patch exactly one Deployment. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quench-common.fullname" . }}-gms-restart
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}-gms-restart
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "datahub.gmsName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}-gms-restart
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}-gms-restart
subjects:
  - kind: ServiceAccount
    name: {{ include "quench-common.fullname" . }}-gms-restart
    namespace: {{ .Release.Namespace }}

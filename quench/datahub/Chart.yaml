      image: ghcr.io/quenchworks/images/datahub-upgrade@sha256:a483faff9e9a8dbffbc541732e492fe2fcf322d0c560f360086e8c7555c51c8d
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:30c4f69897c47d04af0e1c4cba69ff2b0f5814e40a694fbd12dad6ab4d18223b

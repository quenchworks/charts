apiVersion: v2
name: datahub
description: Hardened DataHub metadata platform (GMS, React frontend and the SystemUpdate setup job) on 0-CVE nonroot images, with bundled MySQL, Kafka and Elasticsearch.
type: application
version: 0.0.12
appVersion: "1.7.0.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/datahub-project/datahub
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - datahub
  - data-catalog
  - metadata
  - data-discovery
  - lineage
  - governance
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore: re-pin bundled postgresql/mysql/mongodb/openbao images to the TLS-capable builds"
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/datahub-project/datahub
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: datahub-gms
      image: ghcr.io/quenchworks/images/datahub-gms@sha256:76115f67806712870eda8be3e8088eb8a35f5a7f179549c12fa88d65db6ddd15
    - name: datahub-frontend
      image: ghcr.io/quenchworks/images/datahub-frontend@sha256:125612d6e48ebf6447a83be548096c9437161c0816cfce21caa2e158305dab76
    - name: datahub-upgrade
      image: ghcr.io/quenchworks/images/datahub-upgrade@sha256:a483faff9e9a8dbffbc541732e492fe2fcf322d0c560f360086e8c7555c51c8d
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:30c4f69897c47d04af0e1c4cba69ff2b0f5814e40a694fbd12dad6ab4d18223b
    - name: mysql

apiVersion: v2
name: datahub
description: Hardened DataHub metadata platform (GMS, React frontend and the SystemUpdate setup job) on CVE-gated nonroot images, with bundled MySQL, Kafka and Elasticsearch.
type: application
version: 0.0.37
appVersion: "1.9.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/datahub-project/datahub
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - datahub
  - data-catalog
  - metadata
  - data-discovery
  - lineage
  - governance
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned kafka 4.3.2, mysql 9.7.4 to the rebuilt digests."
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/datahub-project/datahub
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: datahub-gms
      image: ghcr.io/quenchworks/images/datahub-gms@sha256:e702243537bbf6e9733d45290f0ebc4f33176cf60cf6793cccf340b1add987bd
    - name: datahub-frontend
      image: ghcr.io/quenchworks/images/datahub-frontend@sha256:ef7934505fd3b8199de756c4fab25aa2f16db8d7ca38470dd38b5be0a3204cfd
    - name: datahub-upgrade
      image: ghcr.io/quenchworks/images/datahub-upgrade@sha256:b715cbaad173d00b7a0ed9ab172f83d6f8737d08a8826bed81baaa9bed558d0d
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:cbc9b528fabf339854fa6ba419ec45c3378da2638b037101a67794af1b0c7f8f
    - name: mysql
      image: ghcr.io/quenchworks/images/mysql@sha256:4669a5c60adb766cbbaa01683365cc190b69a69e864736b1659db061e4834e90
    - name: kafka
      image: ghcr.io/quenchworks/images/kafka@sha256:f0dd17ea1f1f4cabe928627f3cd38c0acfac3b2dd2dfc33dd86b4e4d7bb4ccee
    - name: elasticsearch
      image: ghcr.io/quenchworks/images/elasticsearch@sha256:102b1f24222b8c41e0a8b1adb4949312b54b4c49feb77dd9f0a6e6faf9f079d4
dependencies:

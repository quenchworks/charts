    - name: datahub-upgrade
      image: ghcr.io/quenchworks/images/datahub-upgrade@sha256:3f29b1d7ecad186717d09da26bcabec746f76472a9b6b6a9c48f11b8c521b07c
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:cbc9b528fabf339854fa6ba419ec45c3378da2638b037101a67794af1b0c7f8f

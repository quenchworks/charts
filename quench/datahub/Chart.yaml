apiVersion: v2
name: datahub
description: Hardened DataHub metadata platform (GMS, React frontend and the SystemUpdate setup job) on 0-CVE nonroot images, with bundled MySQL, Kafka and Elasticsearch.
type: application
version: 0.0.10
appVersion: "1.7.0.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/datahub-project/datahub
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - datahub
  - data-catalog
  - metadata
  - data-discovery
  - lineage
  - governance
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-02 CVE fixes"
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/datahub-project/datahub
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: datahub-gms
      image: ghcr.io/quenchworks/images/datahub-gms@sha256:1ea278e64971ad079ef61512968045efc231c7ed1f76be0e1bee7d26fde36a25

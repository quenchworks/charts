    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled
  - name: kafka
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: kafka.enabled
  - name: elasticsearch
    version: 0.0.28

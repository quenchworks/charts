apiVersion: v2
name: datahub
description: Hardened DataHub metadata platform (GMS, React frontend and the SystemUpdate setup job) on 0-CVE nonroot images, with bundled MySQL, Kafka and Elasticsearch.
type: application
version: 0.0.16
appVersion: "1.7.0.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/datahub-project/datahub
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - datahub
  - data-catalog
  - metadata
  - data-discovery
  - lineage
  - governance
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: datahub-gms republished to a new 0-CVE digest."
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/datahub-project/datahub
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: datahub-gms
      image: ghcr.io/quenchworks/images/datahub-gms@sha256:32d03278ff54063317ca1fed58f490f3ffb3354bc087b14b2d85fe1996596543
    - name: datahub-frontend
      image: ghcr.io/quenchworks/images/datahub-frontend@sha256:125612d6e48ebf6447a83be548096c9437161c0816cfce21caa2e158305dab76

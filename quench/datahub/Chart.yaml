    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: mysql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: mysql.enabled
  - name: kafka
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: kafka.enabled
  - name: elasticsearch
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: elasticsearch.enabled

{{- if .Values.metrics.serviceMonitor.enabled }}
# etcd serves Prometheus metrics natively at /metrics on the client port,
# so no exporter sidecar is needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: client
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}

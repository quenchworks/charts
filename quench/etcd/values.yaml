# The digest below is the contract with the image factory. CI rewrites it from
# manifests/etcd.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/etcd
  digest: "sha256:05765ee83074c7d86b361a33f6a5cb6846e2985a2b6894851c0fa3efd6a2bba7"
  pullPolicy: IfNotPresent

nameOverride: ""

# HA Raft cluster. Use an ODD count so a quorum majority exists (3 tolerates 1
# loss, 5 tolerates 2). 1 is single-node (no fault tolerance). Peers discover
# each other statically over the headless Service DNS; leader election and
# failover are native to etcd (Raft) — no sidecar. Scaling this value up after
# the initial bootstrap does NOT auto-add members (etcd forbids that for
# split-brain safety) — see README "Growing / re-adding members".
replicaCount: 3

# initialClusterState is only honored on a member's FIRST boot with an empty
# data dir. On restart etcd reads its WAL and rejoins regardless, so pod/node
# loss with the PVC intact self-heals with this left at "new". Set "existing"
# only when manually re-adding a member whose data was wiped (after
# `etcdctl member add`).
initialClusterState: new

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  clientPort: 2379
  peerPort: 2380

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# etcd exposes Prometheus metrics natively on the client port at /metrics,
# so no exporter sidecar is needed; this just wires a ServiceMonitor.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

# Quorum of a 3-node cluster: a voluntary drain can never take more than one
# member at a time. Raise to match (N/2)+1 if you run a larger cluster.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

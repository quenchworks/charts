# The digest below is the contract with the image factory. CI rewrites it from
# manifests/etcd.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/etcd
  digest: "sha256:83c4e1144900714746dbc79739ff2fe139b87a98756abbc25d3b6d9577f0cb5c"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-node coordination store for now. A multi-node clustered topology is a
# later addition (it needs static peer discovery over the headless service).
replicaCount: 1

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  clientPort: 2379
  peerPort: 2380

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# etcd exposes Prometheus metrics natively on the client port at /metrics,
# so no exporter sidecar is needed; this just wires a ServiceMonitor.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiVersion: v2
name: mattermost
description: "Open-source, self-hosted team collaboration and messaging platform (Team Edition) — channels, direct messages, and file sharing. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.24
appVersion: "11.11.1"
keywords:
  - mattermost
  - chat
  - messaging
  - collaboration
  - team
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mattermost/mattermost
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: postgresql 0.0.24."
  # ArtifactHub has no chat/collaboration category in its enum
  # (ai-machine-learning, database, integration-delivery, monitoring-logging,
  # networking, security, skip-prediction, storage, streaming-messaging); none fits
  # a team-messaging server, so we use the honest catch-all.
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mattermost
      image: ghcr.io/quenchworks/images/mattermost@sha256:692315481e2e83594c707e31d4d78dabad64e04141ad76e1eba4e4ff28537e05
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

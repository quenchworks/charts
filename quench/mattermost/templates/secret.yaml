{{/*
The managed Secret carries:
  - db-password : the database password (the deterministic postgresql.auth.password
    when the bundled PG is enabled, else externalDatabase.password). Generated once
    (24 chars) and preserved across upgrades via lookup when left empty.
  - datasource  : the full PostgreSQL DSN Mattermost reads as MM_SQLSETTINGS_DATASOURCE,
    assembled from host/port/db/user + the password above. Keeping the whole DSN in
    the Secret avoids a plaintext password in the pod spec.

When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart
renders nothing — the referenced Secret must supply both `db-password` and a
`datasource` key (the StatefulSet reads MM_SQLSETTINGS_DATASOURCE from it).
*/}}
{{- if or .Values.postgresql.enabled (not .Values.externalDatabase.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $dbpw := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbpw = .Values.postgresql.auth.password -}}
{{- else -}}
{{- $dbpw = .Values.externalDatabase.password -}}
{{- end -}}
{{- if and (not $dbpw) $existing -}}
{{- $dbpw = index $existing.data "db-password" | b64dec -}}
{{- end -}}
{{- if not $dbpw -}}
{{- $dbpw = randAlphaNum 24 -}}
{{- end -}}
{{- $host := include "mattermost.db.host" . -}}
{{- $port := include "mattermost.db.port" . -}}
{{- $db := include "mattermost.db.name" . -}}
{{- $user := include "mattermost.db.user" . -}}
{{- $dsn := printf "postgres://%s:%s@%s:%s/%s?sslmode=disable&connect_timeout=10" $user $dbpw $host $port $db -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $dbpw | b64enc | quote }}
  datasource: {{ $dsn | b64enc | quote }}
{{- end }}

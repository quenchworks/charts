{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP (web UI + REST API + WebSocket). Mattermost has its own auth, so external
    # ingress is allowed by default (allowExternal: true); set it false to restrict to
    # the release namespace.
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Database (PostgreSQL). Open to the DB port cluster-wide so both the bundled
    # subchart pod and an external DB are reachable.
    - ports:
        - port: {{ include "mattermost.db.port" . }}
          protocol: TCP
    # General egress (outbound webhooks, push-proxy, email/SMTP, plugin downloads).
    - {}
{{- end }}

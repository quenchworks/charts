{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := randAlphaNum 40 -}}
{{- $pw := .Values.admin.password | default (randAlphaNum 24) -}}
{{- if $existing }}
{{- $key = index $existing.data "secret-key" | b64dec -}}
{{- if and (not .Values.admin.password) (hasKey $existing.data "admin-password") }}{{- $pw = index $existing.data "admin-password" | b64dec -}}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  # signs cookies and CSRF tokens; kept across upgrades
  secret-key: {{ $key | b64enc | quote }}
  {{- if not .Values.admin.existingSecret }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}

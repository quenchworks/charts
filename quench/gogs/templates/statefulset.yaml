{{- include "gogs.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "quench-common.fullname" . }}-headless
  # repositories and SQLite live on one RWO volume: a single writer
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gogs
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [web, --config, /etc/gogs/app.ini]
          env:
            - name: GOGS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quench-common.fullname" . }}
                  key: secret-key
            {{- if ne .Values.database.type "sqlite3" }}
            - name: GOGS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            {{- end }}
            - name: GOGS_ADMIN_USER
              value: {{ .Values.admin.username | quote }}
            - name: GOGS_ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: GOGS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gogs.adminSecretName" . }}
                  key: admin-password
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Only `gogs web` creates the tables, so the admin is created once it answers.
          # An existing admin is fine; any other error fails the container, loudly.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    i=0
                    until wget -q -O /dev/null http://127.0.0.1:3000/healthcheck; do
                      i=$((i+1)); [ "$i" -gt 90 ] && exit 1; sleep 2
                    done
                    out="$(gogs admin create-user --name "$GOGS_ADMIN_USER" --password "$GOGS_ADMIN_PASSWORD" \
                      --email "$GOGS_ADMIN_EMAIL" --admin --config /etc/gogs/app.ini 2>&1)" && exit 0
                    echo "$out" | grep -q 'user already exists' && exit 0
                    echo "$out" >&2; exit 1
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: 2222
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gogs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quench-common.fullname" . }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

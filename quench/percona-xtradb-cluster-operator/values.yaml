# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/percona-xtradb-cluster-operator
  digest: "sha256:b3dcc4a3951811358df786ed5d2a5945bc181a74e4dc40866dd73e2fb232349a"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Replicas share work through leader election.
replicaCount: 1

logLevel: INFO
logStructured: false
# Upstream's usage telemetry to Percona. Off unless you turn it on.
telemetry: false
maxConcurrentReconciles: 1
# PXCO_FEATURE_GATES, e.g. "BackupSidecar=true".
featureGates: ""
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 512Mi }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

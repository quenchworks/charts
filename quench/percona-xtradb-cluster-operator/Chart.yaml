apiVersion: v2
name: percona-xtradb-cluster-operator
description: "The Percona Operator for MySQL based on Percona XtraDB Cluster: synchronous multi-primary Galera clusters with HAProxy or ProxySQL, backups and point-in-time recovery, from CRDs. The CRDs ship with the chart; the operator is namespace-scoped and deploys Percona's database images. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "1.20.0"
keywords:
  - percona
  - xtradb
  - mysql
  - galera
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/percona/percona-xtradb-cluster-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Rebuilt images (2026-10-11 CVE wave)"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: percona-xtradb-cluster-operator
      image: ghcr.io/quenchworks/images/percona-xtradb-cluster-operator@sha256:c5a0297204f4fd3d29c9026444e5449a3cf64d791fb5f0a17a63d7efd30b58b8
  artifacthub.io/crds: |
    - kind: PerconaXtraDBCluster
      version: v1
      name: perconaxtradbclusters.pxc.percona.com
      displayName: Percona XtraDB Cluster
      description: A Galera cluster of Percona XtraDB Cluster nodes with HAProxy or ProxySQL.
    - kind: PerconaXtraDBClusterBackup
      version: v1
      name: perconaxtradbclusterbackups.pxc.percona.com
      displayName: Backup
      description: An on-demand backup of a cluster.
    - kind: PerconaXtraDBClusterRestore
      version: v1
      name: perconaxtradbclusterrestores.pxc.percona.com
      displayName: Restore
      description: A restore of a backup into a cluster.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

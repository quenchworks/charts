apiVersion: v2
name: percona-xtradb-cluster-operator
description: "The Percona Operator for MySQL based on Percona XtraDB Cluster: synchronous multi-primary Galera clusters with HAProxy or ProxySQL, backups and point-in-time recovery, from CRDs. The CRDs ship with the chart; the operator is namespace-scoped and deploys Percona's database images. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.20.0"
keywords:
  - percona
  - xtradb
  - mysql
  - galera
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/percona/percona-xtradb-cluster-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Percona XtraDB Cluster Operator 1.20.0 with its CRDs and upstream's namespaced RBAC. Telemetry off by default."
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: percona-xtradb-cluster-operator
      image: ghcr.io/quenchworks/images/percona-xtradb-cluster-operator@sha256:8f718c83e130163ab12198c4ece6c5e30eaa4c84fd9265710890f342358fcd4c
  artifacthub.io/crds: |
    - kind: PerconaXtraDBCluster
      version: v1
      name: perconaxtradbclusters.pxc.percona.com
      displayName: Percona XtraDB Cluster
      description: A Galera cluster of Percona XtraDB Cluster nodes with HAProxy or ProxySQL.
    - kind: PerconaXtraDBClusterBackup
      version: v1
      name: perconaxtradbclusterbackups.pxc.percona.com
      displayName: Backup
      description: An on-demand backup of a cluster.
    - kind: PerconaXtraDBClusterRestore
      version: v1
      name: perconaxtradbclusterrestores.pxc.percona.com
      displayName: Restore
      description: A restore of a backup into a cluster.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the data PVC binds and navidrome
# writes its SQLite DB to it. The music library is left as the default ephemeral
# emptyDir (empty library) so the server boots and /ping returns 200 without any
# external volume.
persistence:
  enabled: true
  size: 1Gi

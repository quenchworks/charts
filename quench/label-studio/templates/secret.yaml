{{/*
The managed Secret: the admin password and, with PostgreSQL, the database
password. Each value is resolved as explicit value, then the prior value in the
live Secret, then random, so upgrades keep them. With the bundled PostgreSQL and no
explicit postgresql.auth.password the pod reads the PostgreSQL chart's Secret instead,
so no DB password is rendered here.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $admin := .Values.admin.password -}}
{{- if not $admin }}{{- $admin = index $prior "admin-password" | default "" | b64dec }}{{- end -}}
{{- if not $admin }}{{- $admin = randAlphaNum 24 }}{{- end -}}
{{- $fromSub := include "label-studio.db.fromSubchart" . -}}
{{- $db := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $db = .Values.postgresql.auth.password -}}
{{- else -}}
{{- $db = .Values.externalDatabase.password -}}
{{- if not $db }}{{- $db = index $prior "db-password" | default "" | b64dec }}{{- end -}}
{{- if not $db }}{{- $db = randAlphaNum 24 }}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  {{- if not $fromSub }}
  db-password: {{ $db | b64enc | quote }}
  {{- end }}

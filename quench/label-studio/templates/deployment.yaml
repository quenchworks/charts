{{- $probe := dict "httpGet" (dict "path" "/health" "port" "http") "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 6 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  # One pod: the data PVC is ReadWriteOnce and holds the generated SECRET_KEY.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "label-studio.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: label-studio
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          # The image entrypoint is "label-studio start --no-browser --host 0.0.0.0 --port 8080".
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: HOME
              value: /tmp
            - name: LABEL_STUDIO_BASE_DATA_DIR
              value: /label-studio/data
            - name: LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK
              value: {{ .Values.disableSignup | quote }}
            # The admin user is created (or its password reset) on every start.
            - name: LABEL_STUDIO_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: LABEL_STUDIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quench-common.fullname" . }}
                  key: admin-password
            {{- with .Values.host }}
            - name: LABEL_STUDIO_HOST
              value: {{ . | quote }}
            - name: CSRF_TRUSTED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- if include "label-studio.db.postgres" . }}
            - name: DJANGO_DB
              value: default
            - name: POSTGRE_HOST
              value: {{ include "label-studio.db.host" . | quote }}
            - name: POSTGRE_PORT
              value: {{ include "label-studio.db.port" . | quote }}
            - name: POSTGRE_NAME
              value: {{ include "label-studio.db.name" . | quote }}
            - name: POSTGRE_USER
              value: {{ include "label-studio.db.user" . | quote }}
            - name: POSTGRE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if include "label-studio.db.fromSubchart" . }}
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" .Release.Name) }}
                  key: {{ ternary (.Values.postgresql.auth.existingSecretPasswordKey | default "postgres-password") "postgres-password" (not (empty .Values.postgresql.auth.existingSecret)) }}
                  {{- else if and (not .Values.postgresql.enabled) .Values.externalDatabase.existingSecret }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretPasswordKey }}
                  {{- else }}
                  name: {{ include "quench-common.fullname" . }}
                  key: db-password
                  {{- end }}
            {{- else }}
            - name: DJANGO_DB
              value: sqlite
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          # First start runs the Django migrations; allow up to 10 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /label-studio/data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
        {{- if not .Values.persistence.enabled }}
          emptyDir: {}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "quench-common.fullname" .)) }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

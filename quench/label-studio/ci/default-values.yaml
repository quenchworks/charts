# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml. Bundles the PostgreSQL subchart, so the
# gate proves Label Studio reaches PostgreSQL through Wolfi's libpq, runs its
# migrations, and serves /health.
admin:
  username: admin@example.com
  password: ci-admin-password
postgresql:
  enabled: true
  auth:
    username: labelstudio
    password: ci-test-password
    database: label_studio
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
persistence:
  enabled: true
  size: 1Gi

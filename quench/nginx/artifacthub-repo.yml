# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
#
# The ID is not yet assigned (AH identifier convention: quench-nginx, OCI URL
# oci://ghcr.io/quenchworks/charts/nginx). The release workflow's AH-metadata step
# greps for REPLACE_WITH and skips the push while this placeholder is present, so
# the release still goes green. Backfill the real ID once the repo is registered.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # nginx (oci://ghcr.io/quenchworks/charts/nginx)
owners:
  - name: mkabumattar
    email: quenchworks@mkabumattar.com

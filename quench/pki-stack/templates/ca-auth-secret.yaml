{{- $name := index .Values "step-ca" "auth" "existingSecret" -}}
{{- if eq $name "pki-stack-ca-auth" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
# Generated once, before step-ca's bootstrap Job (weight 0) and its own Secret (-10).
# A hook with no delete policy outlives the release's upgrades; the CA keys on the PVC
# are encrypted with these passwords, so they must never change.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pki-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-20"
type: Opaque
data:
  password: {{ get $existing "password" | default (randAlphaNum 32 | b64enc) | quote }}
  provisioner-password: {{ get $existing "provisioner-password" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}

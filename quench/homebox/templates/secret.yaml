{{- /* HBOX_AUTH_API_KEY_PEPPER signs API keys (>= 32 bytes); generated once and read back on
       upgrade, since rotating it invalidates every issued key. */}}
{{- if not .Values.apiKeyPepper.existingSecret }}
{{- $name := include "homebox.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
{{- $pepper := .Values.apiKeyPepper.value | default (get $old "api-key-pepper" | b64dec) | default (randAlphaNum 48) }}
{{- if lt (len $pepper) 32 }}{{ fail "apiKeyPepper.value must be at least 32 bytes" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  api-key-pepper: {{ $pepper | b64enc | quote }}
{{- end }}

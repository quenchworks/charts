{{- /* APP_KEY: generated once (32 characters) and read back on upgrade, so stored data stays readable. */}}
{{- if not .Values.appKey.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $key := .Values.appKey.value | default (get $old "app-key" | b64dec) | default (randAlphaNum 32) }}
{{- if ne (len $key) 32 }}{{ fail "appKey.value must be exactly 32 characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  app-key: {{ $key | b64enc | quote }}
{{- end }}

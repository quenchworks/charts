{{- /* With TLS: the image's server block (/etc/nginx/conf.d/firefly-iii.conf) listening with ssl on 8080. */}}
{{- if include "quench-common.tls.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-nginx
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  firefly-iii.conf: |
    server {
        listen 8080 ssl default_server;
        listen [::]:8080 ssl default_server;
        server_name _;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        root /var/www/firefly-iii/public;
        index index.php;
        charset utf-8;
        client_max_body_size 50M;
        access_log off;
        location ~ /\. { return 403; }
        location / { try_files $uri /index.php$is_args$args; }
        location ~ \.php$ {
            try_files $uri =404;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  HTTPS on;
            fastcgi_pass   127.0.0.1:9000;
        }
        location ~* \.(js|css|png|jpg|svg|ico|woff2?|ttf|eot|map)$ { expires 30d; access_log off; }
    }
{{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # peer traffic between etcd members is always allowed
    - ports:
        - port: peer
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
    # client traffic
    - ports:
        - port: client
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

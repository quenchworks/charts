apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.clientPort }}
      targetPort: client
      name: client
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zookeeper.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true   # peers must resolve each other before they are ready
  ports:
    - port: {{ .Values.service.clientPort }}
      targetPort: client
      name: client
    - port: {{ .Values.service.peerPort }}
      targetPort: peer
      name: peer
    - port: {{ .Values.service.electionPort }}
      targetPort: election
      name: election
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

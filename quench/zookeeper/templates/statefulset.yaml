{{- $liveness := dict "tcpSocket" (dict "port" "client") "initialDelaySeconds" 15 "periodSeconds" 15 -}}
{{/* The image drops the Jetty-backed AdminServer (its entrypoint forces
     admin.enableServer=false), so readiness sends the `ruok` four-letter word over
     the client port with bash builtins (/dev/tcp) — no HTTP endpoint, no JVM spawn
     per probe. The server answers `imok` when it is serving. */}}
{{- $ruok := printf "exec 3<>/dev/tcp/127.0.0.1/%d && printf ruok >&3 && IFS= read -r -t 3 -n 4 resp <&3 && [ \"$resp\" = imok ]" (int .Values.service.clientPort) -}}
{{- $readiness := dict "exec" (dict "command" (list "/bin/bash" "-ec" $ruok)) "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zookeeper.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "zookeeper.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: etcd
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZOO_DATA_DIR
              value: /data
            # the root fs is read-only, so keep the generated zoo.cfg and logs on the
            # writable data volume (the image defaults point them at read-only paths)
            - name: ZOOCFGDIR
              value: /data/conf
            - name: ZOO_LOG_DIR
              value: /data/log
            - name: ZOO_CLIENT_PORT
              value: {{ .Values.service.clientPort | quote }}
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "srvr,mntr,ruok,conf,stat,isro"
            - name: ZOO_TICK_TIME
              value: {{ .Values.config.tickTime | quote }}
            - name: ZOO_INIT_LIMIT
              value: {{ .Values.config.initLimit | quote }}
            - name: ZOO_SYNC_LIMIT
              value: {{ .Values.config.syncLimit | quote }}
            - name: ZOO_MAX_CLIENT_CNXNS
              value: {{ .Values.config.maxClientCnxns | quote }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: peer
              containerPort: {{ .Values.service.peerPort }}
            - name: election
              containerPort: {{ .Values.service.electionPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- if or (and .Values.persistence.enabled .Values.persistence.existingClaim) (not .Values.persistence.enabled) .Values.extraVolumes }}
      volumes:
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

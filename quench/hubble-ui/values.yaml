# Quenchworks Hubble UI on the QuenchWorks hubble-ui and hubble-ui-backend images
# (nonroot, 0-CVE, cosign-signed, pinned by digest). The frontend (nginx, :8081) proxies
# /api/ to the backend in the same pod, which reads Hubble Relay.
image:
  repository: ghcr.io/quenchworks/images/hubble-ui
  digest: "sha256:54047d36ebd39df505e5ffb07ec9afdb020795d0846836b8dddeeef82a790f2f"
  pullPolicy: IfNotPresent
backend:
  image:
    repository: ghcr.io/quenchworks/images/hubble-ui-backend
    digest: "sha256:edda09416592556114a7d816d95aba96f5244c5ef6ad08f0b7c5f92a40913a2d"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  extraEnvVars: []

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

replicas: 1

# Hubble Relay's gRPC address (the hubble-relay chart's Service, port 80 in plaintext).
relay:
  address: hubble-relay.kube-system.svc.cluster.local:80
  # TLS to the relay (its server TLS on): a Secret with ca.crt, tls.crt and tls.key
  tls:
    enabled: false
    existingSecret: ""

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 500m, memory: 128Mi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 80

# The backend lists namespaces, pods, services and nodes for the service map.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

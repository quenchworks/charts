{{- if and .Values.relay.tls.enabled (not .Values.relay.tls.existingSecret) }}
{{- fail "relay.tls.enabled needs relay.tls.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        - name: backend
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - { name: EVENTS_SERVER_PORT, value: "8090" }
            - { name: FLOWS_API_ADDR, value: {{ .Values.relay.address | quote }} }
            {{- if .Values.relay.tls.enabled }}
            - { name: TLS_TO_RELAY_ENABLED, value: "true" }
            - { name: TLS_RELAY_SERVER_NAME, value: "ui.hubble-relay.cilium.io" }
            - { name: TLS_RELAY_CA_CERT_FILES, value: /var/lib/hubble-ui/certs/ca.crt }
            - { name: TLS_RELAY_CLIENT_CERT_FILE, value: /var/lib/hubble-ui/certs/tls.crt }
            - { name: TLS_RELAY_CLIENT_KEY_FILE, value: /var/lib/hubble-ui/certs/tls.key }
            {{- end }}
            {{- with .Values.backend.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 8090
          readinessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.relay.tls.enabled }}
            - { name: relay-tls, mountPath: /var/lib/hubble-ui/certs, readOnly: true }
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.relay.tls.enabled }}
        - name: relay-tls
          secret: { secretName: {{ .Values.relay.tls.existingSecret }}, defaultMode: 0400 }
        {{- end }}

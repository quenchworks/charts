apiVersion: v2
name: contour
description: "Project Contour, the CNCF Kubernetes ingress controller that programs an Envoy data plane over xDS. Serves the networking.k8s.io Ingress API plus Contour's own HTTPProxy CRD (delegation, rate limiting, per-route TLS). Hardened by QuenchWorks as minimal, nonroot, CVE-gated images, cosign-signed and pinned by digest. Runs the Contour control plane as a Deployment and the Envoy data plane as a DaemonSet, with the xDS mTLS keypairs minted in-cluster by a `contour certgen` hook Job."
type: application
version: 0.0.15
appVersion: "1.33.8"
keywords:
  - contour
  - ingress
  - ingress-controller
  - envoy
  - xds
  - httpproxy
  - proxy
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/projectcontour/contour
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned the Envoy 1.40.2 data plane to its rebuilt digest."
  artifacthub.io/images: |
    - name: contour
      image: ghcr.io/quenchworks/images/contour@sha256:68cf28a21fd237d716f5d76531c10031b4651e33614c06d6db0356db017f0f2a
    - name: envoy
      image: ghcr.io/quenchworks/images/envoy@sha256:ec71c22ab4c46c7bbde1a82c4ec45d5e85c249763e1feb8d35c83dbbd22f9c2a
  artifacthub.io/crds: |
    - kind: HTTPProxy
      version: v1
      name: httpproxies.projectcontour.io
      displayName: HTTPProxy
      description: "Contour's routing API: virtual hosts, route delegation across namespaces, per-route TLS, load balancing and traffic policy."
    - kind: ContourConfiguration
      version: v1alpha1
      name: contourconfigurations.projectcontour.io
      displayName: ContourConfiguration
      description: "The Contour control plane's own runtime configuration, as a CRD instead of a mounted config file."
    - kind: ExtensionService
      version: v1alpha1
      name: extensionservices.projectcontour.io
      displayName: ExtensionService
      description: "Registers an external gRPC service (external authorization, global rate limiting) that Envoy can call out to."
    - kind: TLSCertificateDelegation
      version: v1
      name: tlscertificatedelegations.projectcontour.io
      displayName: TLSCertificateDelegation
      description: "Delegates the use of a TLS Secret in one namespace to HTTPProxies in other namespaces."
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

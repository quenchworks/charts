{{- if not .Values.contour.existingConfigMap }}
{{/* Contour's base configuration file. `contour serve --config-path` requires the file
     to exist; an empty document is valid and means "all defaults". */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "contour.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with (include "quench-common.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  contour.yaml: |
    {{- toYaml (.Values.contour.config | default dict) | nindent 4 }}
{{- end }}

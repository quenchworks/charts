{{- if .Values.rbac.create }}
{{/*
Contour's permissions, written from the controller's own API needs (upstream's
kubebuilder RBAC markers are the authority for the exact verb set).

Cluster-scoped read, because an ingress controller resolves backends and TLS Secrets
anywhere in the cluster. Writes are confined to /status subresources -- Contour never
mutates a user's spec -- plus events and its leader-election Lease in its own namespace.

The gateway.networking.k8s.io rules are harmless when the Gateway API CRDs are absent
(RBAC is granted on group/resource strings, not on existing types); Contour only starts
those informers when a `gateway` block is configured.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" (include "quench-common.fullname" .) .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  # backend resolution (Services + EndpointSlices), TLS material (Secrets),
  # namespace labels for delegation, and ConfigMaps for the base configuration.
  - apiGroups: [""]
    resources: ["configmaps", "namespaces", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # the networking.k8s.io Ingress API
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["create", "get", "update"]
  # Contour's own API
  - apiGroups: ["projectcontour.io"]
    resources: ["contourconfigurations", "extensionservices", "httpproxies", "tlscertificatedelegations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["projectcontour.io"]
    resources: ["contourconfigurations/status", "extensionservices/status", "httpproxies/status"]
    verbs: ["create", "get", "update"]
  # Gateway API, when the cluster has it
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - "backendtlspolicies"
      - "gatewayclasses"
      - "gateways"
      - "grpcroutes"
      - "httproutes"
      - "referencegrants"
      - "tcproutes"
      - "tlsroutes"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - "backendtlspolicies/status"
      - "gatewayclasses/status"
      - "gateways/status"
      - "grpcroutes/status"
      - "httproutes/status"
      - "tcproutes/status"
      - "tlsroutes/status"
    verbs: ["update"]
---
{{/* Cluster-scoped names are GLOBAL, so both the role and the binding carry the
     namespace: two releases in different namespaces would otherwise fight over one
     object and the second install would steal the first one's permissions. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" (include "quench-common.fullname" .) .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" (include "quench-common.fullname" .) .Release.Namespace | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "contour.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  # leader election: one replica at a time writes object status
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "contour.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

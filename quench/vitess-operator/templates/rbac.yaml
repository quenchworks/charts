{{- if .Values.rbac.create }}
{{- $fn := include "quench-common.fullname" . }}
{{- $sa := include "vitess-operator.serviceAccountName" . }}
# Upstream deploy/role.yaml at the release tag: the ClusterRole, rules verbatim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints, persistentvolumeclaims, events, configmaps, secrets]
    verbs: ['*']
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: ['*']
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: ['*']
  - apiGroups: [apps]
    resourceNames: [vitess-operator]
    resources: [deployments/finalizers]
    verbs: [update]
  - apiGroups: [planetscale.com]
    resources: [vitessclusters, vitessclusters/status, vitessclusters/finalizers, vitesscells, vitesscells/status, vitesscells/finalizers, vitesskeyspaces, vitesskeyspaces/status, vitesskeyspaces/finalizers,
      vitessshards, vitessshards/status, vitessshards/finalizers, etcdlockservers, etcdlockservers/status, etcdlockservers/finalizers, vitessbackups, vitessbackups/status, vitessbackups/finalizers, vitessbackupstorages,
      vitessbackupstorages/status, vitessbackupstorages/finalizers, vitessbackupschedules, vitessbackupschedules/status, vitessbackupschedules/finalizers]
    verbs: ['*']
  - apiGroups: [batch]
    resources: [jobs]
    verbs: ['*']
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fn }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $fn }} }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
---
# Upstream's backup-storage Role: the VitessBackupStorage subcontroller pods copy the operator's
# pod spec, ServiceAccount included, and run in the cluster's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-backup-storage
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [planetscale.com]
    resources: [vitessshards, vitessshards/status, vitessshards/finalizers, vitessbackups, vitessbackups/status, vitessbackups/finalizers, vitessbackupstorages, vitessbackupstorages/status, vitessbackupstorages/finalizers]
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-backup-storage
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fn }}-backup-storage }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vitess-operator.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

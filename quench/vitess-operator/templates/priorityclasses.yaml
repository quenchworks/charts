{{- if .Values.priorityClasses.create }}
# Upstream deploy/priority.yaml. Cluster-wide names: VitessCluster components default to
# priorityClassName "vitess", so the names are fixed, one set per cluster.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vitess-operator-control-plane
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
value: 5000
globalDefault: false
description: "The vitess-operator control plane."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vitess
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
value: 1000
globalDefault: false
description: "Vitess components (vttablet, vtgate, vtctld, etcd)"
{{- end }}

apiVersion: v2
name: vitess-operator
description: "Vitess Operator: run Vitess (horizontally sharded MySQL) from VitessCluster resources, with vtgate, vttablet, vtctld, an etcd topology server, resharding and backups. The CRDs ship with the chart. Hardened by QuenchWorks: the operator is built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "2.17.1"
kubeVersion: ">=1.26.0-0"
keywords:
  - vitess
  - vitess-operator
  - mysql
  - sharding
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/planetscale/vitess-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Vitess Operator 2.17.1 with its eight CRDs"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: vitess-operator
      image: ghcr.io/quenchworks/images/vitess-operator@sha256:0219cee83d46669a5d29486f64e3771f63aa6231d8dd16d56e84deadd336eb56
  artifacthub.io/crds: |
    - kind: VitessCluster
      version: v2
      name: vitessclusters.planetscale.com
      displayName: Vitess Cluster
      description: A Vitess cluster with its cells, keyspaces, shards, vtgate, vtctld and topology lockserver.
    - kind: VitessCell
      version: v2
      name: vitesscells.planetscale.com
      displayName: Vitess Cell
      description: One cell (failure domain) of a cluster and its vtgate.
    - kind: VitessKeyspace
      version: v2
      name: vitesskeyspaces.planetscale.com
      displayName: Vitess Keyspace
      description: A logical database, possibly sharded.
    - kind: VitessShard
      version: v2
      name: vitessshards.planetscale.com
      displayName: Vitess Shard
      description: One shard of a keyspace and its tablets.
    - kind: EtcdLockserver
      version: v2
      name: etcdlockservers.planetscale.com
      displayName: Etcd Lockserver
      description: An etcd cluster the operator runs as the Vitess topology server.
    - kind: VitessBackup
      version: v2
      name: vitessbackups.planetscale.com
      displayName: Vitess Backup
      description: One backup found in a backup storage location.
    - kind: VitessBackupStorage
      version: v2
      name: vitessbackupstorages.planetscale.com
      displayName: Vitess Backup Storage
      description: A backup storage location the operator inventories.
    - kind: VitessBackupSchedule
      version: v2
      name: vitessbackupschedules.planetscale.com
      displayName: Vitess Backup Schedule
      description: Scheduled backups for a cluster.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts

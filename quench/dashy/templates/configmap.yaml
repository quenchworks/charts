{{- /* The first conf.yml: copied onto the volume only when it has none, so edits made in the UI are kept. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-seed
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  conf.yml: |
    {{- .Values.config | nindent 4 }}

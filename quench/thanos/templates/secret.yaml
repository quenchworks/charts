{{- if eq (include "thanos.renderObjstoreSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thanos.objstoreSecretName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed by store/compact/rule (and receive when receive.objstore.enabled)
  # via --objstore.config-file=/etc/thanos/objstore/objstore.yml.
  objstore.yml: |
    {{- .Values.objstoreConfig.yaml | nindent 4 }}
{{- end }}

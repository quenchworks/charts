{{- if .Values.store.enabled }}
{{/*
Thanos Store Gateway. Exposes the Store API over historical blocks in OBJECT
STORAGE, so it REQUIRES an objstore config (objstoreConfig.yaml or an external
Secret). query auto-discovers it via the store headless Service SRV record.
A StatefulSet for a stable local index/chunk cache PVC at /var/thanos/store.
*/}}
{{- if not (include "thanos.hasObjstore" .) }}
{{- fail "store.enabled=true requires objstoreConfig.yaml or objstoreConfig.existingSecret to be set (the Store Gateway reads historical blocks from object storage)." }}
{{- end }}
{{- $liveness := dict "httpGet" (dict "path" "/-/healthy" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/-/ready" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "thanos.componentFullname" (dict "ctx" . "component" "store") }}
  labels:
    {{- include "thanos.componentLabels" (dict "ctx" . "component" "store") | nindent 4 }}
spec:
  serviceName: {{ include "thanos.componentHeadlessName" (dict "ctx" . "component" "store") }}
  replicas: {{ .Values.store.replicaCount }}
  selector:
    matchLabels:
      {{- include "thanos.componentSelectorLabels" (dict "ctx" . "component" "store") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "thanos.componentSelectorLabels" (dict "ctx" . "component" "store") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "thanos.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: store
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - store
            - --log.level=info
            - --data-dir=/var/thanos/store
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
            {{- with .Values.store.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 10902
              protocol: TCP
            - name: grpc
              containerPort: 10901
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.store.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/thanos/store
            - name: objstore
              mountPath: /etc/thanos/objstore
              readOnly: true
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: objstore
          secret:
            secretName: {{ include "thanos.objstoreSecret" . }}
        {{- if not .Values.store.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if .Values.store.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "thanos.componentSelectorLabels" (dict "ctx" . "component" "store") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.store.persistence.accessModes | nindent 10 }}
        {{- if .Values.store.persistence.storageClass }}
        storageClassName: {{ .Values.store.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.store.persistence.size }}
  {{- end }}
{{- end }}

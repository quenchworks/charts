{{- if and .Values.rule.enabled .Values.rule.ruleFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thanos.componentFullname" (dict "ctx" . "component" "rule") }}-rules
  labels:
    {{- include "thanos.componentLabels" (dict "ctx" . "component" "rule") | nindent 4 }}
data:
  {{- range $name, $content := .Values.rule.ruleFiles }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}

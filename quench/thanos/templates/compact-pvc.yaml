{{- if and .Values.compact.enabled .Values.compact.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "thanos.componentFullname" (dict "ctx" . "component" "compact") }}
  labels:
    {{- include "thanos.componentLabels" (dict "ctx" . "component" "compact") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.compact.persistence.accessModes | nindent 4 }}
  {{- if .Values.compact.persistence.storageClass }}
  storageClassName: {{ .Values.compact.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.compact.persistence.size }}
{{- end }}

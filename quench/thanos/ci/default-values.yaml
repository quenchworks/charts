# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Default on-by-default topology (query + receive), shrunk for a quick kind boot.
# query goes Ready only after it connects to receive's Store API — the integration
# test. The other components stay off (they need object storage).
query:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
receive:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    size: 1Gi

    - kind: changed
      description: "Updated kestra to 2.0.12 and re-pinned the image to its new rebuilt digest. Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: kestra
      image: ghcr.io/quenchworks/images/kestra@sha256:0dffa348c2f7a9b89e3a3edcf75703c863a6192d8a64245fc5111036186207cd
    - name: postgresql

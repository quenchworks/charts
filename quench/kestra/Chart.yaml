apiVersion: v2
name: kestra
description: "Kestra: a declarative event-driven orchestration platform (YAML flows, plugins, a web UI and an API), with the bundled PostgreSQL. Hardened by QuenchWorks: CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "2.0.12"
keywords:
  - kestra
  - orchestration
  - workflow
  - scheduler
  - data-pipelines
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kestra-io/kestra
annotations:

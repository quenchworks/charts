image:
  repository: ghcr.io/quenchworks/images/kestra
  digest: "sha256:571d281cd3dc2da5537907d3eadc7c54af61db20c9d4838ffe48f9329c1eb0b6"
  pullPolicy: IfNotPresent

nameOverride: ""

admin:
  username: admin@kestra.local   # Kestra wants an email address
  password: ""                   # generated into the Secret <fullname> (key admin-password) unless set here

secret:
  existingSecret: ""    # a Secret with key admin-password instead

# Kestra's URL as users reach it (https://kestra.example.com/), used in links and notifications.
publicUrl: ""

# JVM options (JAVA_OPTS), e.g. -XX:MaxRAMPercentage=75.
javaOpts: ""

updateStrategy: {}

postgresql:
  enabled: true
  auth:
    username: kestra
    password: ""
    database: kestra_db   # differs from the user: the catalog postgresql creates POSTGRES_DB only then
  primary:
    persistence:
      enabled: true
      size: 5Gi

externalDatabase:
  host: ""
  port: 5432
  database: kestra
  username: kestra
  existingSecret: ""
  existingSecretPasswordKey: password

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { cpu: 2, memory: 3Gi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# Flow storage (inputs, outputs, files) on one volume.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  hosts: []
  tls: []

podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
startupProbe: {}
livenessProbe: {}
readinessProbe: {}
customStartupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

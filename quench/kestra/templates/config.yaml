{{- /* The admin's password, generated once and kept on upgrade. Kestra wants 8+ characters with an upper-case letter,
       a lower-case letter and a digit, hence the suffix. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := get $old "admin-password" | b64dec | default (.Values.admin.password | default (printf "%sAa1" (randAlphaNum 24))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  application.yml: |
    {{- include "kestra.config" . | nindent 4 }}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Adminer needs no database to reach Ready -- the login page is served before any
# connection is attempted -- so the defaults are already installable.
replicaCount: 1
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

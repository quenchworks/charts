{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opa.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /config/config.yaml and passed to `opa run` via -c.
  config.yaml: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}

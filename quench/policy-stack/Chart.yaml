apiVersion: v2
name: policy-stack
description: "Hardened Kubernetes policy in one install: Kyverno (admission policies and background scans that write PolicyReports) + Policy Reporter (those results over a REST API, Prometheus metrics and notification targets) + Polaris (a dashboard that audits workloads against configuration best practices). Every image is QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.0.0"
keywords:
  - policy
  - kyverno
  - policy-reporter
  - polaris
  - admission-control
  - compliance
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/kyverno/policy-reporter
  - https://github.com/FairwindsOps/polaris
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "first release: Kyverno, Policy Reporter and Polaris"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:fe359fcd4ff701dd2d3a49e1e2ca2fdaf70879016d8ecd27ad685d42ecfc7006
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:4033ac5e5f359739cf017a256188a8da7592edae86e452c6327dc4865a66a580
    - name: policy-reporter
      image: ghcr.io/quenchworks/images/policy-reporter@sha256:0de9d06f2e2027c56c9b6bc563b0c7b4364890292505b3bc6d34839d1d001590
    - name: polaris
      image: ghcr.io/quenchworks/images/polaris@sha256:ef8df1b24d5060da5ef79d07d8ee1a96bfe4b8403e627ec22b8d780df333e7d9
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

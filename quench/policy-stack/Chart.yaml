apiVersion: v2
name: policy-stack
description: "Hardened Kubernetes policy in one install: Kyverno (admission policies and background scans that write PolicyReports) + Policy Reporter (those results over a REST API, Prometheus metrics and notification targets) + Polaris (a dashboard that audits workloads against configuration best practices). Every image is QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.24
appVersion: "1.0.0"
keywords:
  - policy
  - kyverno
  - policy-reporter
  - polaris
  - admission-control
  - compliance
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/kyverno/policy-reporter
  - https://github.com/FairwindsOps/polaris
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 security-queue rebuilds"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:b2e120fd503f8ac5d94377a03d671e0bf940a8b994d668d60ed88d7ca0c9869f
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:c16ff69d4e03e73ccbdf972fcb5fc8acf7174a63e619f007235119e5dd0eec45
    - name: policy-reporter
      image: ghcr.io/quenchworks/images/policy-reporter@sha256:20edf415322d7e79a4246ab02aa2f6f2cf30b616133ad93d38d5020a5029a2b8
    - name: polaris
      image: ghcr.io/quenchworks/images/polaris@sha256:2feca73da79ec2faf76b1b28c6d9dfbd206b33b005974dc329b643d7b83d23db
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
  - name: policy-reporter
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: policy-reporter.enabled
  - name: polaris
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: polaris.enabled

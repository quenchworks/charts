# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Bundles the Quenchworks PostgreSQL subchart with a small PVC; deterministic shared
# DB credentials; small resources for the runner. The gate confirms ZITADEL connects
# to PostgreSQL, runs start-from-init (schema create + first-instance seed), and
# /debug/ready returns 200 (i.e. it is actually serving).
postgresql:
  enabled: true
  auth:
    username: zitadeluser
    password: ci-test-password
    database: zitadel
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

# Exactly 32 characters (ZITADEL_MASTERKEY requirement).
masterkey: "MasterkeyNeedsToHave32Character!"

externalDomain: "localhost"
externalPort: 8080
externalSecure: false

firstInstance:
  orgName: "QuenchWorks"
  admin:
    username: "zitadel-admin"
    password: "Password1!"

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1Gi }

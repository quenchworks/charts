apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # h2c: gRPC + REST/console multiplexed over HTTP/2 cleartext on one port.
    - port: {{ .Values.service.port }}
      targetPort: http2
      name: http2
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

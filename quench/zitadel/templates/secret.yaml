{{/*
The managed Secret carries:
  - masterkey         : ZITADEL_MASTERKEY, exactly 32 chars (encrypts data at rest).
                        Generated once (32 chars) and preserved across upgrades via
                        lookup when masterkey is left empty.
  - admin-password    : ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD for the seeded admin.
  - db-user-password  : password for ZITADEL's runtime DB role.
  - db-admin-password : password for the schema-creating (admin) DB role.

When the bundled PostgreSQL is enabled, both DB passwords are the bundled superuser's
password (postgresql.auth.username is created by the image as the superuser). With an
explicit postgresql.auth.password it is used here. With none, the PostgreSQL chart generates
it and the pod reads that chart's Secret (zitadel.db.fromSubchart), so no DB-password keys
are rendered here: a copy generated here would never match, since lookup finds nothing on a
first install.
When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart
renders no DB-password keys here — the referenced Secret must supply
db-user-password and db-admin-password (see externalDatabase.existingSecret*Key).
*/}}
{{- if include "zitadel.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- masterkey (exactly 32 chars) ---- */}}
{{- $mk := .Values.masterkey -}}
{{- if and (not $mk) $existing -}}
{{- $mk = index $existing.data "masterkey" | default "" | b64dec -}}
{{- end -}}
{{- if not $mk -}}
{{- $mk = randAlphaNum 32 -}}
{{- end -}}
{{- if ne (len $mk) 32 -}}
{{- fail (printf "masterkey must be exactly 32 characters (got %d)" (len $mk)) -}}
{{- end -}}

{{/* ---- first-admin password ---- */}}
{{- $adminPw := .Values.firstInstance.admin.password -}}
{{- if and (not $adminPw) $existing -}}
{{- $adminPw = index $existing.data "admin-password" | default "" | b64dec -}}
{{- end -}}
{{- if not $adminPw -}}
{{- $adminPw = randAlphaNum 20 -}}
{{- end -}}

{{/* ---- DB passwords (runtime user + schema-creating admin) ---- */}}
{{- $userPw := "" -}}
{{- $adminDbPw := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $userPw = .Values.postgresql.auth.password -}}
{{- if and (not $userPw) $existing -}}
{{- $userPw = index $existing.data "db-user-password" | default "" | b64dec -}}
{{- end -}}
{{- if not $userPw -}}{{- $userPw = randAlphaNum 24 -}}{{- end -}}
{{/* bundled superuser serves both runtime and admin connections */}}
{{- $adminDbPw = $userPw -}}
{{- else -}}
{{- $userPw = .Values.externalDatabase.password -}}
{{- $adminDbPw = .Values.externalDatabase.adminPassword -}}
{{- if and (not $userPw) $existing -}}{{- $userPw = index $existing.data "db-user-password" | default "" | b64dec -}}{{- end -}}
{{- if and (not $adminDbPw) $existing -}}{{- $adminDbPw = index $existing.data "db-admin-password" | default "" | b64dec -}}{{- end -}}
{{- if not $userPw -}}{{- $userPw = randAlphaNum 24 -}}{{- end -}}
{{- if not $adminDbPw -}}{{- $adminDbPw = $userPw -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  masterkey: {{ $mk | b64enc | quote }}
  admin-password: {{ $adminPw | b64enc | quote }}
  {{- if not (include "zitadel.db.fromSubchart" .) }}
  db-user-password: {{ $userPw | b64enc | quote }}
  db-admin-password: {{ $adminDbPw | b64enc | quote }}
  {{- end }}
{{- end }}

apiVersion: v2
name: zitadel
description: "Open-source identity infrastructure, a cloud-native OIDC/OAuth2/SAML identity and access management server with multi-tenancy, self-service, and a built-in management API/console. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.53
appVersion: "4.19.5"
keywords:
  - zitadel
  - identity
  - oidc
  - oauth2
  - saml
  - iam
  - sso
  - authentication
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/zitadel/zitadel
annotations:

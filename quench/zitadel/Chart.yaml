apiVersion: v2
name: zitadel
description: "Open-source identity infrastructure — a cloud-native OIDC/OAuth2/SAML identity and access management server with multi-tenancy, self-service, and a built-in management API/console. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.17
appVersion: "4.17.3"
keywords:
  - zitadel
  - identity
  - oidc
  - oauth2
  - saml
  - iam
  - sso
  - authentication
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/zitadel/zitadel
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Rebuilt on current Wolfi; refreshes the pinned digest"
  # ArtifactHub category enum: ai-machine-learning, database, integration-delivery,
  # monitoring-logging, networking, security, skip-prediction, storage,
  # streaming-messaging. An identity/IAM server fits "security".
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: zitadel
      image: ghcr.io/quenchworks/images/zitadel@sha256:01b2e1d1f3ef31da41d11864ec6dc524ca82e0a9b1c7a2f8636c102fb275a2e1
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:601897da3768720a98ee45b80303da7d4be2eb5b48a64c214dd4b290e04edc9d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

apiVersion: v2
name: phpmyadmin
description: Hardened phpMyAdmin (PHP-FPM + nginx) on a 0-CVE nonroot image — a web UI for the MySQL/MariaDB servers you already run, with an optional bundled MariaDB.
type: application
version: 0.0.1
appVersion: "5.2.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/phpmyadmin/phpmyadmin
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - phpmyadmin
  - mysql
  - mariadb
  - database
  - administration
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: phpMyAdmin 5.2.3 as a stateless Deployment, config.inc.php from a ConfigMap, blowfish_secret persisted in a managed Secret."
  # phpMyAdmin administers relational databases, so ArtifactHub's "database" category is
  # the honest fit (unlike the CMS charts, which have to use skip-prediction).
  category: database
  licenses: GPL-2.0-only
  artifacthub.io/category: database
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/phpmyadmin/phpmyadmin
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: phpmyadmin
      image: ghcr.io/quenchworks/images/phpmyadmin@sha256:b03f0ef4aa41ded6aa0f0e333a886cb4bf3134c66d240791bbdc71cc59ed64c8
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:de7f6d2143a534b7882d292a494f359bf4c7003b8f12598a97a424a1d5da354d
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

apiVersion: v2
name: phpmyadmin
description: Hardened phpMyAdmin (PHP-FPM + nginx) on a CVE-gated nonroot image — a web UI for the MySQL/MariaDB servers you already run, with an optional bundled MariaDB.
type: application
version: 0.0.28
appVersion: "5.2.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/phpmyadmin/phpmyadmin
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - phpmyadmin
  - mysql
  - mariadb
  - database
  - administration
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: database
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/phpmyadmin/phpmyadmin
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: phpmyadmin
      image: ghcr.io/quenchworks/images/phpmyadmin@sha256:1bfb7819c1e8d414cd9a6de79d32efad4c2c24652393812e664c06324f5fb0fd
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:394b66879fa725ea4ab27d7b3beb6e556fcf0ee853241800d6eebf4ff7e7958d
dependencies:
  - name: quench-common
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

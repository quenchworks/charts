apiVersion: v2
name: phpmyadmin
description: Hardened phpMyAdmin (PHP-FPM + nginx) on a 0-CVE nonroot image — a web UI for the MySQL/MariaDB servers you already run, with an optional bundled MariaDB.
type: application
version: 0.0.7
appVersion: "5.2.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/phpmyadmin/phpmyadmin
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - phpmyadmin
  - mysql
  - mariadb
  - database
  - administration
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: phpmyadmin republished to a new 0-CVE digest."
  # phpMyAdmin administers relational databases, so ArtifactHub's "database" category is
  # the honest fit (unlike the CMS charts, which have to use skip-prediction).
  category: database
  licenses: GPL-2.0-only
  artifacthub.io/category: database
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/phpmyadmin/phpmyadmin
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: phpmyadmin
      image: ghcr.io/quenchworks/images/phpmyadmin@sha256:5982819ef0ea58582c68cd996c91d0b43dfd232d6fdb0ec0c11045ba3b945398
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:7f506d403668a0eb1504c924d3f862667a9c63fc80213ee2bb3926ce0b347483
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

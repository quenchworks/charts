apiVersion: v2
name: phpmyadmin
description: Hardened phpMyAdmin (PHP-FPM + nginx) on a 0-CVE nonroot image — a web UI for the MySQL/MariaDB servers you already run, with an optional bundled MariaDB.
type: application
version: 0.0.15
appVersion: "5.2.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/phpmyadmin/phpmyadmin
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - phpmyadmin
  - mysql
  - mariadb
  - database
  - administration
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles mariadb=0.0.20 (module-floor rebuilds)"
  artifacthub.io/category: database
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/phpmyadmin/phpmyadmin
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: phpmyadmin
      image: ghcr.io/quenchworks/images/phpmyadmin@sha256:f4c89a4c0642624ef7e89381ef5d4532463f9eabf746f38fa069a602c6db9dd8
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:7f436d3b5f96c9b81892d5aa7ddc1a937297411fcf53b13c8877f3a3e440032b
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

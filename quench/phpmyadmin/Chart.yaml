apiVersion: v2
name: phpmyadmin
description: Hardened phpMyAdmin (PHP-FPM + nginx) on a 0-CVE nonroot image — a web UI for the MySQL/MariaDB servers you already run, with an optional bundled MariaDB.
type: application
version: 0.0.9
appVersion: "5.2.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/phpmyadmin/phpmyadmin
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - phpmyadmin
  - mysql
  - mariadb
  - database
  - administration
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: mariadb 0.0.17."
  # phpMyAdmin administers relational databases, so ArtifactHub's "database" category is
  # the honest fit (unlike the CMS charts, which have to use skip-prediction).
  category: database
  licenses: GPL-2.0-only
  artifacthub.io/category: database
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/phpmyadmin/phpmyadmin
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: phpmyadmin
      image: ghcr.io/quenchworks/images/phpmyadmin@sha256:ddfec2af306abef1616ce1b0827c5dd999aebd1c87a1f9e554f8892f5f191737
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:3c37e899fb35ce9fa782363fda52d664ec1eaed22592a2fcba3ca907f1b7944a
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

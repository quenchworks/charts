{{/*
The managed Secret carries ONE value: phpMyAdmin's blowfish_secret, the 32-character key
that signs and AES-encrypts the cookie holding the user's database credentials.

It is RESOLVED FROM THE EXISTING SECRET FIRST (via lookup), so it stays STABLE across
upgrades: re-rendering a fresh key would silently invalidate every logged-in session (and
with several replicas, mismatched keys would log users out at random). Order:
explicit phpmyadmin.blowfishSecret -> the value already stored here -> a fresh random 32.

Nothing else lives here. With cookie auth (the default) phpMyAdmin asks the user for
database credentials at login, so this chart never stores a database password.
*/}}
{{- if not .Values.phpmyadmin.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := .Values.phpmyadmin.blowfishSecret -}}
{{- if and (not $secret) $existing -}}
{{- $secret = index $existing.data "blowfish-secret" | default "" | b64dec -}}
{{- end -}}
{{- if not $secret -}}
{{- $secret = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  blowfish-secret: {{ $secret | b64enc | quote }}
{{- end }}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digests from values.yaml, so the gate pulls the actual signed
# images -- including the helper image the controller injects into run pods,
# which is the whole point of the TaskRun smoke check.
controller:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 100Mi }
    limits: { cpu: 1000m, memory: 1Gi }
webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 100Mi }
    limits: { cpu: 500m, memory: 500Mi }

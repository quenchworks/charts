{{- if .Values.serviceAccount.create }}
{{- /*
One ServiceAccount per component so each one's RBAC stays scoped to what it
actually does: the controller reconciles runs and creates pods, the webhook only
maintains its own admission plumbing.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tekton.controllerServiceAccountName" . }}
  labels:
    {{- include "tekton.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tekton.webhookServiceAccountName" . }}
  labels:
    {{- include "tekton.componentLabels" (dict "ctx" . "component" "webhook") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{/*
Tekton Pipelines admission webhook. Runs /usr/bin/webhook and serves three
admission controllers plus CRD conversion:

  <name>              mutating   - applies defaults to tekton.dev objects
  validation.<name>   validating - schema-validates them
  config.<name>       validating - checks the config-* ConfigMaps

It bootstraps its own TLS: on start it generates a CA + serving cert, stores them
in the certs Secret (WEBHOOK_SECRET_NAME), then patches the caBundle AND the
intercept rules into the three webhook configurations and into each CRD's
conversion stanza. Nothing external issues the certificate.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tekton.webhookName" . }}
  labels:
    {{- include "tekton.componentLabels" (dict "ctx" . "component" "webhook") | nindent 4 }}
spec:
  replicas: {{ .Values.webhook.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tekton.componentSelectorLabels" (dict "ctx" . "component" "webhook") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "tekton.componentSelectorLabels" (dict "ctx" . "component" "webhook") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tekton.webhookServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: webhook
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/webhook"]
          env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
            - name: CONFIG_LEADERELECTION_NAME
              value: config-leader-election-webhook
            - name: CONFIG_FEATURE_FLAGS_NAME
              value: feature-flags
            - name: PROBES_PORT
              value: "8080"
            - name: WEBHOOK_PORT
              value: "8443"
            # Drives the names of all three webhook configurations; they must
            # match templates/webhooks.yaml or the caBundle is never injected.
            - name: WEBHOOK_ADMISSION_CONTROLLER_NAME
              value: {{ .Values.webhook.admissionControllerName | quote }}
            # Must equal the Service name below: it is the SAN the webhook puts
            # in its self-issued certificate and the endpoint it advertises.
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "tekton.webhookName" . }}
            - name: WEBHOOK_SECRET_NAME
              value: {{ include "tekton.webhookCertsSecretName" . }}
            - name: METRICS_DOMAIN
              value: tekton.dev/pipeline
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: profiling
              containerPort: 8008
              protocol: TCP
            - name: https-webhook
              containerPort: 8443
              protocol: TCP
            - name: probes
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: probes
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: probes
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- include "quench-common.extraVolumeMounts" $ | nindent 12 }}
          {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- include "quench-common.extraVolumes" $ | nindent 8 }}
      {{- end }}

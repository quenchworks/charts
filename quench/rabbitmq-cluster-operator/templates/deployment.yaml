apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rabbitmq-cluster-operator.serviceAccountName" . }}
      # The operator talks to the API server; quench-common leaves the token off.
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.logLevel }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OPERATOR_SCOPE_NAMESPACE, value: {{ join "," .Values.watchNamespaces | quote }} }
            {{- with .Values.rabbitmqImage }}
            - { name: DEFAULT_RABBITMQ_IMAGE, value: {{ . | quote }} }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - { name: metrics, containerPort: 8080, protocol: TCP }
            - { name: probe, containerPort: 8081, protocol: TCP }
            - { name: webhook, containerPort: 9443, protocol: TCP }
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" (dict "httpGet" (dict "path" "/healthz" "port" "probe") "periodSeconds" 10)) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" (dict "httpGet" (dict "path" "/readyz" "port" "probe") "periodSeconds" 10)) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # controller-runtime's default CertDir
            - { name: webhook-tls, mountPath: /tmp/k8s-webhook-server/serving-certs, readOnly: true }
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: webhook-tls
          secret: { secretName: {{ include "quench-common.fullname" . }}-webhook-tls }
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

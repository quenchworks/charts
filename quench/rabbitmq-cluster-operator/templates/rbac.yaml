{{- if .Values.rbac.create }}
# Upstream's manager ClusterRole at the release tag (config/rbac/role.yaml), verbatim rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters/finalizers]
    verbs: [update]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters/status]
    verbs: [get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-cluster-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election (config/rbac/leader_election_role.yaml), in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}-leader-election
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}-leader-election
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-cluster-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

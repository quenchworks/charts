# Standalone install gate. No image override: the install uses the chart's pinned
# digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves the PVC binds and the site in Data.fs
# survives a pod restart. The admin password is a CI-only value.
persistence:
  enabled: true
  size: 1Gi
admin:
  existingSecret: plone-ci-admin

{{/*
The Zope admin password, generated once and kept across upgrades through a lookup.
Rendered only when admin.existingSecret is not set.
*/}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing (hasKey $existing.data "admin-password") -}}
{{- $secret = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $secret -}}
{{- $secret = randAlphaNum 24 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $secret | b64enc | quote }}
{{- end }}

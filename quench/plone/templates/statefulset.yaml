{{/* waitress listens only after the first boot has created the admin user and the site,
     so the startup probe carries the slow first start and liveness stays tight. */}}
{{- $startup := dict "tcpSocket" (dict "port" "http") "periodSeconds" 5 "failureThreshold" 120 -}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "periodSeconds" 20 "timeoutSeconds" 5 -}}
{{- $readiness := dict "httpGet" (dict "path" "/" "port" "http") "periodSeconds" 10 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "plone.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plone.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: plone
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: PLONE_LISTEN
              value: {{ printf "*:%v" .Values.containerPort | quote }}
            - name: PLONE_THREADS
              value: {{ .Values.threads | quote }}
            - name: PLONE_CACHE_SIZE
              value: {{ .Values.cacheSize | quote }}
            - name: PLONE_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: PLONE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (include "quench-common.fullname" .) }}
                  key: {{ .Values.admin.existingSecretKey | default "admin-password" }}
            - name: PLONE_SITE_ID
              value: {{ .Values.site.id | quote }}
            - name: PLONE_SITE_TITLE
              value: {{ .Values.site.title | quote }}
            - name: PLONE_DISTRIBUTION
              value: {{ .Values.site.distribution | quote }}
            - name: PLONE_LANGUAGE
              value: {{ .Values.site.language | quote }}
            - name: PLONE_TIMEZONE
              value: {{ .Values.site.timezone | quote }}
            - name: PLONE_SETUP_CONTENT
              value: {{ .Values.site.exampleContent | quote }}
            {{- with .Values.relstorage.existingSecret }}
            - name: PLONE_RELSTORAGE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.relstorage.existingSecretKey | default "dsn" }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # filestorage/Data.fs and blobstorage/ (or the RelStorage blob cache)
            - name: data
              mountPath: /data
            # the rendered zope.conf/zope.ini and upload spool; the root is read-only
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

# The digest below is the contract with the image factory. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/uptime-kuma
  digest: "sha256:76bb9db001b076cfa4a015150ade642dfb7bc05f2d49a810abe9897bbc203a87"
  pullPolicy: IfNotPresent

nameOverride: ""

# Uptime Kuma keeps its monitors, history and settings in a SQLite database under
# the data dir and runs every check from one process, so it does not scale out;
# keep this at 1.
replicaCount: 1

# The hardened image runs nonroot (uid 1001) and binds this port; UPTIME_KUMA_PORT is
# wired to it so the container and probes stay in sync.
containerPort: 3001

persistence:
  enabled: true
  size: 2Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 3001
  # With tls.enabled the Service publishes the TLS listener (container 8443) here.
  httpsPort: 443

# Native TLS on Uptime Kuma's own listener (8443). Off by default. The first source set
# wins: existingSecret, then certManager, else a Helm-generated self-signed CA +
# certificate (kept across upgrades). The Secret is mounted at /tls.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
# Uptime Kuma creates its admin account in the UI on first visit. Extra env such as
# UPTIME_KUMA_DB_TYPE=mariadb with UPTIME_KUMA_DB_HOSTNAME/PORT/NAME/USERNAME/PASSWORD
# moves storage to an external MariaDB.
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  # Uptime Kuma is usually reached from outside the namespace (browsers, an ingress
  # controller). Set true to allow ingress from any source; the default restricts
  # client traffic to the namespace.
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

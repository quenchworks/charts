# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-uptime-kuma, OCI URL oci://ghcr.io/quenchworks/charts/uptime-kuma.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # uptime-kuma (oci://ghcr.io/quenchworks/charts/uptime-kuma)

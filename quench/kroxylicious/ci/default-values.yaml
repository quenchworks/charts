# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml. The release workflow first installs the quench kafka
# chart as release "kafka" (service kafka-kafka, one KRaft broker, node id 0), then runs the broker's own CLI with
# only the proxy as bootstrap: create a topic, produce, consume.
replicaCount: 1
targetCluster:
  bootstrapServers: kafka-kafka.default.svc.cluster.local:9092

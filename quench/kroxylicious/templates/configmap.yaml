apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Read once at startup; the Deployment's checksum annotation rolls the pods on a change.
  config.yaml: |-
    {{- include "kroxylicious.config" . | nindent 4 }}

{{/*
The single managed Secret carrying every credential the Coolify control plane needs,
plus the fully-rendered Laravel .env. The chart GENERATES every secret and PERSISTS it
across upgrades via lookup: APP_KEY encrypts rows already written to the DB, so once a
value is written it is NEVER regenerated.

Keys:
  app-key                Laravel APP_KEY (base64:<32 bytes>). Encrypts DB-stored secrets.
  app-id                 Stable instance id (APP_ID).
  root-user-password     Initial admin password (seeded by artisan app:init).
  db-password            PostgreSQL password (deterministic bundled / external).
  redis-password         Redis password.
  pusher-app-id          Shared Pusher/soketi app id (PUSHER_APP_ID / SOKETI_DEFAULT_APP_ID).
  pusher-app-key         Shared Pusher/soketi app key.
  pusher-app-secret      Shared Pusher/soketi app secret.
  .env                   The complete Laravel env file. Mounted read-only at
                         /var/www/html/.env (it replaces the image's symlink to
                         /tmp/coolify.env — a real .env mounted over that path wins).
*/}}
{{- $name := include "coolify.secret" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $ed := $existing.data | default dict -}}

{{- /* helper-less inline persistence: prefer the value set in values -> existing Secret -> generate */ -}}
{{- $appKey := .Values.app.appKey -}}
{{- if and (not $appKey) (hasKey $ed "app-key") -}}{{- $appKey = index $ed "app-key" | b64dec -}}{{- end -}}
{{- if not $appKey -}}{{- $appKey = printf "base64:%s" (randAlphaNum 32 | b64enc) -}}{{- end -}}

{{- $appId := .Values.app.appId -}}
{{- if and (not $appId) (hasKey $ed "app-id") -}}{{- $appId = index $ed "app-id" | b64dec -}}{{- end -}}
{{- if not $appId -}}{{- $appId = randAlphaNum 32 | lower -}}{{- end -}}

{{- $rootPw := .Values.app.rootUser.password -}}
{{- if and (not $rootPw) (hasKey $ed "root-user-password") -}}{{- $rootPw = index $ed "root-user-password" | b64dec -}}{{- end -}}
{{- if not $rootPw -}}{{- $rootPw = randAlphaNum 24 -}}{{- end -}}

{{- $dbPw := include "coolify.db.password" . -}}
{{- if and (not $dbPw) (hasKey $ed "db-password") -}}{{- $dbPw = index $ed "db-password" | b64dec -}}{{- end -}}
{{- if not $dbPw -}}{{- $dbPw = randAlphaNum 24 -}}{{- end -}}

{{- $redisPw := include "coolify.redis.password" . -}}
{{- if and (not $redisPw) (hasKey $ed "redis-password") -}}{{- $redisPw = index $ed "redis-password" | b64dec -}}{{- end -}}

{{- $pusherId := .Values.pusher.appId -}}
{{- if and (not $pusherId) (hasKey $ed "pusher-app-id") -}}{{- $pusherId = index $ed "pusher-app-id" | b64dec -}}{{- end -}}
{{- if not $pusherId -}}{{- $pusherId = randAlphaNum 20 | lower -}}{{- end -}}

{{- $pusherKey := .Values.pusher.appKey -}}
{{- if and (not $pusherKey) (hasKey $ed "pusher-app-key") -}}{{- $pusherKey = index $ed "pusher-app-key" | b64dec -}}{{- end -}}
{{- if not $pusherKey -}}{{- $pusherKey = randAlphaNum 20 | lower -}}{{- end -}}

{{- $pusherSecret := .Values.pusher.appSecret -}}
{{- if and (not $pusherSecret) (hasKey $ed "pusher-app-secret") -}}{{- $pusherSecret = index $ed "pusher-app-secret" | b64dec -}}{{- end -}}
{{- if not $pusherSecret -}}{{- $pusherSecret = randAlphaNum 20 | lower -}}{{- end -}}

{{- $dbHost := include "coolify.db.host" . -}}
{{- $dbPort := include "coolify.db.port" . -}}
{{- $dbName := include "coolify.db.name" . -}}
{{- $dbUser := include "coolify.db.user" . -}}
{{- $redisHost := include "coolify.redis.host" . -}}
{{- $redisPort := include "coolify.redis.port" . -}}
{{- $appUrl := include "coolify.externalURL" . -}}

{{/*
The full Coolify configuration as an ORDERED list of KEY=VALUE pairs. These are injected
into the app as REAL container environment variables (envFrom the "<fullname>-env" Secret
below) — the reliable K8s path: Laravel's env() reads the process environment, and config
is NOT cached in this image. We ALSO render the same set as a .env file (mounted at
/var/www/html/.env) because the worker wrappers grep that file for the *_ENABLED flags.
Pusher host/port point the UI at the realtime Service.
*/}}
{{- $realtimeSvc := include "coolify.realtime" . -}}
{{- $env := list -}}
{{- $env = append $env (list "APP_ID" $appId) -}}
{{- $env = append $env (list "APP_NAME" "Coolify") -}}
{{- $env = append $env (list "APP_ENV" "production") -}}
{{- $env = append $env (list "APP_KEY" $appKey) -}}
{{- $env = append $env (list "APP_DEBUG" "false") -}}
{{- $env = append $env (list "APP_URL" $appUrl) -}}
{{- $env = append $env (list "HORIZON_ENABLED" (printf "%t" .Values.app.horizonEnabled)) -}}
{{- $env = append $env (list "SCHEDULER_ENABLED" (printf "%t" .Values.app.schedulerEnabled)) -}}
{{- $env = append $env (list "NIGHTWATCH_ENABLED" "false") -}}
{{- $env = append $env (list "DB_CONNECTION" "pgsql") -}}
{{- $env = append $env (list "DB_HOST" $dbHost) -}}
{{- $env = append $env (list "DB_PORT" $dbPort) -}}
{{- $env = append $env (list "DB_DATABASE" $dbName) -}}
{{- $env = append $env (list "DB_USERNAME" $dbUser) -}}
{{- $env = append $env (list "DB_PASSWORD" $dbPw) -}}
{{- $env = append $env (list "REDIS_CLIENT" "phpredis") -}}
{{- $env = append $env (list "REDIS_HOST" $redisHost) -}}
{{- $env = append $env (list "REDIS_PORT" $redisPort) -}}
{{- $env = append $env (list "REDIS_PASSWORD" $redisPw) -}}
{{- $env = append $env (list "QUEUE_CONNECTION" "redis") -}}
{{- $env = append $env (list "CACHE_STORE" "redis") -}}
{{- $env = append $env (list "SESSION_DRIVER" "redis") -}}
{{- $env = append $env (list "BROADCAST_DRIVER" "pusher") -}}
{{- $env = append $env (list "PUSHER_HOST" $realtimeSvc) -}}
{{- $env = append $env (list "PUSHER_PORT" (printf "%v" .Values.realtime.service.soketiPort)) -}}
{{- $env = append $env (list "PUSHER_SCHEME" "http") -}}
{{- $env = append $env (list "PUSHER_APP_ID" $pusherId) -}}
{{- $env = append $env (list "PUSHER_APP_KEY" $pusherKey) -}}
{{- $env = append $env (list "PUSHER_APP_SECRET" $pusherSecret) -}}
{{- $env = append $env (list "ROOT_USERNAME" .Values.app.rootUser.email) -}}
{{- $env = append $env (list "ROOT_USER_EMAIL" .Values.app.rootUser.email) -}}
{{- $env = append $env (list "ROOT_USER_PASSWORD" $rootPw) -}}
{{- $env = append $env (list "REGISTRY_URL" "ghcr.io") -}}
{{- $env = append $env (list "SELF_HOSTED" "true") -}}
{{- $env = append $env (list "PHP_PM_CONTROL" "dynamic") -}}
{{- $lines := list -}}
{{- range $pair := $env -}}{{- $lines = append $lines (printf "%s=%s" (index $pair 0) (index $pair 1)) -}}{{- end -}}
{{- $envFile := $lines | join "\n" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  app-key: {{ $appKey | b64enc | quote }}
  app-id: {{ $appId | b64enc | quote }}
  root-user-password: {{ $rootPw | b64enc | quote }}
  db-password: {{ $dbPw | b64enc | quote }}
  redis-password: {{ $redisPw | b64enc | quote }}
  pusher-app-id: {{ $pusherId | b64enc | quote }}
  pusher-app-key: {{ $pusherKey | b64enc | quote }}
  pusher-app-secret: {{ $pusherSecret | b64enc | quote }}
  .env: {{ $envFile | b64enc | quote }}
---
{{/* The Coolify config as discrete env keys, consumed by the app via envFrom. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-env
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $pair := $env }}
  {{ index $pair 0 }}: {{ index $pair 1 | quote }}
  {{- end }}

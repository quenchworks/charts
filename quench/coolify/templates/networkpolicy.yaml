{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Coolify UI/API (:8080) + realtime (soketi :6001, terminal :6002). The app has its
    # own auth and the UI/WebSocket are reached from browsers, so external ingress is
    # allowed by default (allowExternal: true); set it false to restrict to the namespace.
    - ports:
        - port: http
          protocol: TCP
        - port: soketi
          protocol: TCP
        - port: terminal
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL + Redis (bundled or external).
    - ports:
        - port: {{ include "coolify.db.port" . }}
          protocol: TCP
        - port: {{ include "coolify.redis.port" . }}
          protocol: TCP
    # General egress: Coolify connects OUT to the Docker hosts it manages over SSH (:22),
    # pulls images, talks to git remotes, etc. Left open so the control plane can reach
    # the external hosts and registries it orchestrates.
    - {}
{{- end }}

apiVersion: v2
name: coolify
description: Quenchworks hardened Coolify (self-hostable PaaS / Heroku & Netlify alternative). A single umbrella chart wiring the minimal, nonroot, 0-CVE Coolify control-plane images (pinned by digest) — the PHP/Laravel app (php-fpm + nginx + Horizon + scheduler under supervisord) and the realtime tier (soketi + terminal bridge) — over bundled Quenchworks PostgreSQL 15 and Redis. Coolify manages EXTERNAL Docker hosts over SSH; the privileged helper/proxy build tier runs on those managed hosts, NOT in this cluster.
type: application
version: 0.0.1
appVersion: "4.1.2"
keywords:
  - coolify
  - paas
  - deployment
  - self-hosted
  - docker
  - ci-cd
maintainers:
  - name: QuenchWorks
    email: quenchworks@mkabumattar.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/coollabsio/coolify
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: coolify-app
      image: ghcr.io/quenchworks/images/coolify-app@sha256:60eeb0ba9a288708742238dd615322c4563d2c623279beb5daf9b46e0c03152e
    - name: coolify-realtime
      image: ghcr.io/quenchworks/images/coolify-realtime@sha256:c7d842f893116b6f674e259b2bb129930fde0fd5172a8b3a28e647a2dc5c7326
    # The build engine Coolify runs ON the EXTERNAL Docker hosts it manages (pulled and
    # run over SSH). It is PRIVILEGED by design and is NOT deployed by this chart; it is
    # listed here only so the artifact is discoverable and scanned alongside the others.
    - name: coolify-helper
      image: ghcr.io/quenchworks/images/coolify-helper@sha256:64a47ae99419f7cf057f39edd941d5f118497d66be02c70257b2438a9c8f99fd
    - name: postgresql-15
      image: ghcr.io/quenchworks/images/postgresql-15@sha256:b799f1c9c400500265eeabc8e2fcbb3fdb1e8afbe6a39587a96fd49d51025582
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:45ce09b13abd27c92277142cf34a874c43776a2ffcf85820c79c68abf02c019c
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: redis
    alias: redis
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

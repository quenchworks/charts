apiVersion: v2
name: coolify
description: "Self-hostable platform-as-a-service and open alternative to Heroku and Netlify. This umbrella chart wires the QuenchWorks Coolify control-plane images (the PHP/Laravel app running php-fpm, nginx, Horizon, and the scheduler under supervisord, plus the realtime tier of soketi and a terminal bridge) over bundled QuenchWorks PostgreSQL 15 and Redis, each a minimal, nonroot, CVE-gated image pinned by digest. Coolify manages external Docker hosts over SSH, so the privileged helper and proxy build tier runs on those managed hosts, not in this cluster."
type: application
version: 0.0.72
appVersion: "4.3.4"
keywords:
  - coolify
  - paas
  - deployment
  - self-hosted
  - docker
  - ci-cd
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/coollabsio/coolify
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the redis subchart 0.0.39 -> 0.0.40."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: coolify-app
      image: ghcr.io/quenchworks/images/coolify-app@sha256:3483050cc30b6dd8abd7372ef9c2da62ae060d1cd89055cafe7976f40239fe23
    - name: coolify-realtime
      image: ghcr.io/quenchworks/images/coolify-realtime@sha256:5bd9d48a310d1ff4cca707589796b1ab70be4c34851b3c12f6a6d5bc9c319329
    # The build engine Coolify runs ON the EXTERNAL Docker hosts it manages (pulled and
    # run over SSH). It is PRIVILEGED by design and is NOT deployed by this chart; it is
    # listed here only so the artifact is discoverable and scanned alongside the others.
    - name: coolify-helper
      image: ghcr.io/quenchworks/images/coolify-helper@sha256:16d170bc5ac348df3c165010ee5de64f577f181b27c1d8f64eb5963cab234122
    - name: postgresql-15
      image: ghcr.io/quenchworks/images/postgresql-15@sha256:80a595a1817a229a40a7168576331f3c0c0ce72d33823140517dfe994fd41f2c
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:5bd8e281d4f830afb7f63f46312cc73c145ad8cb6c0b90e13d8f71cf028573f5
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: redis
    alias: redis
    version: 0.0.40
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

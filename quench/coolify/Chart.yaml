apiVersion: v2
name: coolify
description: "Self-hostable platform-as-a-service and open alternative to Heroku and Netlify. This umbrella chart wires the QuenchWorks Coolify control-plane images (the PHP/Laravel app running php-fpm, nginx, Horizon, and the scheduler under supervisord, plus the realtime tier of soketi and a terminal bridge) over bundled QuenchWorks PostgreSQL 15 and Redis, each a minimal, nonroot, CVE-gated image pinned by digest. Coolify manages external Docker hosts over SSH, so the privileged helper and proxy build tier runs on those managed hosts, not in this cluster."
type: application
version: 0.0.56
appVersion: "4.3.4"
keywords:
  - coolify
  - paas
  - deployment
  - self-hosted
  - docker
  - ci-cd
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/coollabsio/coolify
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-10 CVE-fix lock"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: coolify-app
      image: ghcr.io/quenchworks/images/coolify-app@sha256:692c4a583fa24372e8c6b2340bcf8c53533312b94c49dda02ba35bd815fc8dc5
    - name: coolify-realtime
      image: ghcr.io/quenchworks/images/coolify-realtime@sha256:16eaee24178fd52f97b781933358ad385abe08cfc7d8c1453bcee05c8d0a139c
    # The build engine Coolify runs ON the EXTERNAL Docker hosts it manages (pulled and
    # run over SSH). It is PRIVILEGED by design and is NOT deployed by this chart; it is
    # listed here only so the artifact is discoverable and scanned alongside the others.
    - name: coolify-helper
      image: ghcr.io/quenchworks/images/coolify-helper@sha256:5d29af9755ea6b89cc147dab93d879f01510831b1aaeaa094edc1a261aead7f5
    - name: postgresql-15
      image: ghcr.io/quenchworks/images/postgresql-15@sha256:39c3dd6850c43061e537aa327d106f148fa9fec1251d44d98585107909448d62
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:65a327efd3e0f4e26153604ed32810f19d25983bf2439f9d142b2eaac23b50c1
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: redis
    alias: redis
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

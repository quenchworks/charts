apiVersion: v2
name: coolify
description: "Self-hostable platform-as-a-service and open alternative to Heroku and Netlify. This umbrella chart wires the QuenchWorks Coolify control-plane images (the PHP/Laravel app running php-fpm, nginx, Horizon, and the scheduler under supervisord, plus the realtime tier of soketi and a terminal bridge) over bundled QuenchWorks PostgreSQL 15 and Redis, each a minimal, nonroot, CVE-gated image pinned by digest. Coolify manages external Docker hosts over SSH, so the privileged helper and proxy build tier runs on those managed hosts, not in this cluster."
type: application
version: 0.0.64
appVersion: "4.3.4"
keywords:
  - coolify
  - paas
  - deployment
  - self-hosted
  - docker
  - ci-cd
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/coollabsio/coolify
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: coolify-app
      image: ghcr.io/quenchworks/images/coolify-app@sha256:1d063b004d968581e56b46a9e0f54bfd8665bf4b1b4f7e7933f41a80f0ef3b82
    - name: coolify-realtime
      image: ghcr.io/quenchworks/images/coolify-realtime@sha256:5bd9d48a310d1ff4cca707589796b1ab70be4c34851b3c12f6a6d5bc9c319329
    # The build engine Coolify runs ON the EXTERNAL Docker hosts it manages (pulled and
    # run over SSH). It is PRIVILEGED by design and is NOT deployed by this chart; it is
    # listed here only so the artifact is discoverable and scanned alongside the others.
    - name: coolify-helper
      image: ghcr.io/quenchworks/images/coolify-helper@sha256:447bb8b0971c5197a868b82df99ca43c57518fd6e96891e9b39c498b298504a3
    - name: postgresql-15
      image: ghcr.io/quenchworks/images/postgresql-15@sha256:80a595a1817a229a40a7168576331f3c0c0ce72d33823140517dfe994fd41f2c
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:908b51c85087f89df471b259dcf117f85eadcf4288ece23704b1aa7b3a2f9528
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: redis
    alias: redis
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

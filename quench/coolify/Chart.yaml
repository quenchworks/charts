apiVersion: v2
name: coolify
description: "Self-hostable platform-as-a-service and open alternative to Heroku and Netlify. This umbrella chart wires the QuenchWorks Coolify control-plane images (the PHP/Laravel app running php-fpm, nginx, Horizon, and the scheduler under supervisord, plus the realtime tier of soketi and a terminal bridge) over bundled QuenchWorks PostgreSQL 15 and Redis, each a minimal, nonroot, 0-CVE image pinned by digest. Coolify manages external Docker hosts over SSH, so the privileged helper and proxy build tier runs on those managed hosts, not in this cluster."
type: application
version: 0.0.4
appVersion: "4.1.2"
keywords:
  - coolify
  - paas
  - deployment
  - self-hosted
  - docker
  - ci-cd
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/coollabsio/coolify
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Add an ArtifactHub changelog; maintenance re-release re-validated against the chart's pinned, signed image."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: coolify-app
      image: ghcr.io/quenchworks/images/coolify-app@sha256:60eeb0ba9a288708742238dd615322c4563d2c623279beb5daf9b46e0c03152e
    - name: coolify-realtime
      image: ghcr.io/quenchworks/images/coolify-realtime@sha256:a8b07376a2b5ad79f649d660cfcfac408219f6ebc48f745f376717878be982a3
    # The build engine Coolify runs ON the EXTERNAL Docker hosts it manages (pulled and
    # run over SSH). It is PRIVILEGED by design and is NOT deployed by this chart; it is
    # listed here only so the artifact is discoverable and scanned alongside the others.
    - name: coolify-helper
      image: ghcr.io/quenchworks/images/coolify-helper@sha256:fd897b2dd0e103ac3b1edb56f34145c8f844ed17b045771516441b49995d9eaa
    - name: postgresql-15
      image: ghcr.io/quenchworks/images/postgresql-15@sha256:5529b416dfbafc531bb7b11fe243c180396cf9372a4966d0c82fcda84433b05e
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:f027d0109a0bdd1779bfac85a10744336f4af80518e9bc2c290984e206b3bf14
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: redis
    alias: redis
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

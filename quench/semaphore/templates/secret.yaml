{{- /* The admin password and the cookie and access-key encryption keys: generated once, read back on upgrade.
       Rotating access-key-encryption makes stored keys unreadable, so it is never regenerated. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  {{- range $k := list "cookie-hash" "cookie-encryption" "access-key-encryption" }}
  {{ $k }}: {{ get $old $k | default (randAscii 32 | b64enc | b64enc) | quote }}
  {{- end }}
{{- end }}

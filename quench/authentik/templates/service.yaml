apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
  selector:
    # Only the SERVER workload serves HTTP/HTTPS; the worker has no listener.
    {{- include "authentik.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}

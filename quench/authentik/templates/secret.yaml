{{/*
The chart-managed Secret carries up to THREE keys:

  authentik-secret-key   -> AUTHENTIK_SECRET_KEY (rendered unless secrets.existingSecret
                            is set). Authentik needs >= 50 chars; an empty value is
                            generated once (50 chars) and preserved across upgrades via
                            a lookup of the existing Secret.

  TWO OPTIONAL backend passwords for the EXTERNAL-inline case only. When a backend is
  BUNDLED, Authentik reads the subchart's OWN Secret (postgresql/valkey/redis), so
  nothing is rendered here. When a backend is EXTERNAL with an existingSecret,
  Authentik reads that Secret. Only the EXTERNAL-without-existingSecret case puts the
  password here:
    db-password     -> AUTHENTIK_POSTGRESQL__PASSWORD (from externalDatabase.password)
    redis-password  -> AUTHENTIK_REDIS__PASSWORD      (from externalRedis.password)
  Each generated password is preserved across upgrades via the lookup.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderKey := not .Values.secrets.existingSecret -}}
{{- $renderPg := and (not .Values.postgresql.enabled) .Values.externalDatabase.host (not .Values.externalDatabase.existingSecret) -}}
{{- $renderRedis := and (not .Values.valkey.enabled) (not .Values.redis.enabled) (include "authentik.redis.hasPassword" .) (not .Values.externalRedis.existingSecret) -}}

{{- if or $renderKey $renderPg $renderRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderKey }}
  {{- $key := .Values.secrets.secretKey -}}
  {{- if and (not $key) $existing -}}{{- $key = index $existing.data "authentik-secret-key" | b64dec -}}{{- end -}}
  {{- if not $key -}}{{- $key = randAlphaNum 50 -}}{{- end }}
  authentik-secret-key: {{ $key | b64enc | quote }}
  {{- end }}
  {{- if $renderPg }}
  {{- $dbpw := .Values.externalDatabase.password -}}
  {{- if and (not $dbpw) $existing -}}{{- $dbpw = index $existing.data "db-password" | b64dec -}}{{- end -}}
  {{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
  {{- if $renderRedis }}
  {{- $rpw := .Values.externalRedis.password -}}
  {{- if and (not $rpw) $existing -}}{{- $rpw = index $existing.data "redis-password" | b64dec -}}{{- end -}}
  {{- if not $rpw -}}{{- $rpw = randAlphaNum 24 -}}{{- end }}
  redis-password: {{ $rpw | b64enc | quote }}
  {{- end }}
{{- end }}

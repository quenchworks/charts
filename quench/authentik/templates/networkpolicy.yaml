{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}-server
  labels:
    {{- include "authentik.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  # Only the server has listeners; the worker takes no ingress.
  podSelector:
    matchLabels:
      {{- include "authentik.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
        - port: https
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

apiVersion: v2
name: authentik
description: Hardened Authentik identity provider (OIDC/SAML/LDAP/SCIM) on a 0-CVE image
type: application
version: 0.1.19
appVersion: "2026.5.7"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/goauthentik/authentik
keywords:
  - authentik
  - identity-provider
  - sso
  - oidc
  - saml
  - ldap
  - scim
  - authentication
  - security
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: authentik republished to a new 0-CVE digest."
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: authentik
      image: ghcr.io/quenchworks/images/authentik@sha256:165fd3fcc86e9b110d60bb11726aa1cde32af2decbb44396ef0fbb6ec350ebbd
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:9203d82de95544c95f9cde104f2a23b699423cfed9cc27251f09b51d45f93762
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:9a525827b9e4ed199538bd1b31d41faf903377c2fa5f24a149eb6ae365070e55
# Authentik has TWO HARD runtime dependencies: PostgreSQL and Redis. It refuses to
# boot without both. quench-common is the only always-on chart dependency; the DB and
# session store are each choosable as BUNDLED (the QuenchWorks subchart) or EXTERNAL
# (point at your own), mirroring the quench/authelia layout:
#   DATABASE modes:  bundled postgresql | external (externalDatabase.*)
#   REDIS modes:     bundled valkey | bundled redis | external (externalRedis.*)
#                    valkey is the recommended 0-CVE BSD store; redis is the AGPL
#                    alternative. Enable AT MOST ONE of valkey/redis.
# Unlike authelia (which can run standalone on SQLite), Authentik requires that
# EXACTLY ONE database mode and EXACTLY ONE redis mode resolve — the templates fail
# rendering with a clear message if a required backend is missing.
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

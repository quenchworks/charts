# Authentik has TWO HARD runtime dependencies: PostgreSQL and Redis. It refuses to
# boot without both. quench-common is the only always-on chart dependency; the DB and
# session store are each choosable as BUNDLED (the QuenchWorks subchart) or EXTERNAL
# (point at your own), mirroring the quench/authelia layout:
#   DATABASE modes:  bundled postgresql | external (externalDatabase.*)
#   REDIS modes:     bundled valkey | bundled redis | external (externalRedis.*)
#                    valkey is the recommended 0-CVE BSD store; redis is the AGPL
#                    alternative. Enable AT MOST ONE of valkey/redis.
# Unlike authelia (which can run standalone on SQLite), Authentik requires that
# EXACTLY ONE database mode and EXACTLY ONE redis mode resolve — the templates fail
# rendering with a clear message if a required backend is missing.
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

apiVersion: v2
name: authentik
description: Hardened Authentik identity provider (OIDC/SAML/LDAP/SCIM) on a 0-CVE image
type: application
version: 0.1.56
appVersion: "2026.8.5"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/goauthentik/authentik
keywords:
  - authentik
  - identity-provider
  - sso
  - oidc
  - saml
  - ldap
  - scim
  - authentication
  - security
maintainers:

apiVersion: v2
name: authentik
description: Hardened Authentik identity provider (OIDC/SAML/LDAP/SCIM) on a 0-CVE image
type: application
version: 0.1.54
appVersion: "2026.8.5"
home: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/quenchworks/images
  - https://github.com/goauthentik/authentik
keywords:
  - authentik
  - identity-provider
  - sso
  - oidc
  - saml
  - ldap
  - scim
  - authentication
  - security
maintainers:
  - name: mkabumattar
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: authentik republished to a new 0-CVE digest."
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/quenchworks/charts
    - name: Image Source
      url: https://github.com/quenchworks/images
    - name: Security Policy
      url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: authentik
      image: ghcr.io/quenchworks/images/authentik@sha256:87dfb486306682e1edaf3ed9b9b8ca7449ea55921d1d074cb5b116d095265b93
      whitelisted: false
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:beda4af6174e30ad6ed2d9ca9a8962e2d2cb59af2ffd98a9b846b1edc41a0636
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:51cd07f2bbe088c14296eb8e209f6462423655f6145049e7171e97a892d4ffd0
    - name: redis
      image: ghcr.io/quenchworks/images/redis@sha256:65a327efd3e0f4e26153604ed32810f19d25983bf2439f9d142b2eaac23b50c1
# Authentik has TWO HARD runtime dependencies: PostgreSQL and Redis. It refuses to
# boot without both. quench-common is the only always-on chart dependency; the DB and
# session store are each choosable as BUNDLED (the QuenchWorks subchart) or EXTERNAL
# (point at your own), mirroring the quench/authelia layout:
#   DATABASE modes:  bundled postgresql | external (externalDatabase.*)
#   REDIS modes:     bundled valkey | bundled redis | external (externalRedis.*)
#                    valkey is the recommended 0-CVE BSD store; redis is the AGPL
#                    alternative. Enable AT MOST ONE of valkey/redis.
# Unlike authelia (which can run standalone on SQLite), Authentik requires that
# EXACTLY ONE database mode and EXACTLY ONE redis mode resolve — the templates fail
# rendering with a clear message if a required backend is missing.
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled
  - name: redis
    alias: redis
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: redis.enabled

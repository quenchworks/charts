apiVersion: v2
name: secrets-stack
description: "OpenBao behind Keycloak sign-in: OpenBao auto-unseals and configures itself on first start (KV v2, OIDC for people, JWT for workloads, a break-glass admin), trusting a Keycloak realm the stack imports. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.22
appVersion: "1.0.0"
keywords:
  - secrets
  - openbao
  - vault
  - keycloak
  - sso
  - oidc
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/openbao/openbao
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: openbao
      image: ghcr.io/quenchworks/images/openbao@sha256:a37e1085f16849904bb4f69a160db5699fbf7af9c6c25de22ef503bc247bb700
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:4e94cbd09e544efefd20db7c9612b2693981eb42e9b5499f33efe578cb3f8a3f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: openbao
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
  - name: keycloak
    version: 0.0.46
    repository: oci://ghcr.io/quenchworks/charts
    condition: keycloak.enabled

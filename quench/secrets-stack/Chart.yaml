apiVersion: v2
name: secrets-stack
description: "OpenBao behind Keycloak sign-in: OpenBao auto-unseals and configures itself on first start (KV v2, OIDC for people, JWT for workloads, a break-glass admin), trusting a Keycloak realm the stack imports. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.41
appVersion: "1.0.0"
keywords:
  - secrets
  - openbao
  - vault
  - keycloak
  - sso
  - oidc
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/openbao/openbao
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: openbao
      image: ghcr.io/quenchworks/images/openbao@sha256:e9ebc5a7d9eaeb84a781f2339af5915669cc010d2a87088b6a65f3f17891124e
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:d40ea3ce1ed2d139303c11b4afb98d7c3f00af449b72406651531df7d39b144d
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac303563d1da4869033100b3b23bd7884b1a81a83e0beb07a3f238dd64e6b654
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: openbao
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
  - name: keycloak
    version: 0.0.57
    repository: oci://ghcr.io/quenchworks/charts
    condition: keycloak.enabled

apiVersion: v2
name: secrets-stack
description: "OpenBao behind Keycloak sign-in: OpenBao auto-unseals and configures itself on first start (KV v2, OIDC for people, JWT for workloads, a break-glass admin), trusting a Keycloak realm the stack imports. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.28
appVersion: "1.0.0"
keywords:
  - secrets
  - openbao
  - vault
  - keycloak
  - sso
  - oidc
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/openbao/openbao
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the 2026-11-13 update round's rebuilt images."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: openbao
      image: ghcr.io/quenchworks/images/openbao@sha256:3ac31ccca43016c01fdc54b4fcaf4d638b8e9826cf6d4ed237e8ce30bdceafe2
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:a9f561edf556dd56683bf7a871bb0488a1eedff8d8f002393169f294e116615f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: openbao
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
  - name: keycloak
    version: 0.0.50
    repository: oci://ghcr.io/quenchworks/charts
    condition: keycloak.enabled

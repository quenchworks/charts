apiVersion: v2
name: secrets-stack
description: "OpenBao behind Keycloak sign-in: OpenBao auto-unseals and configures itself on first start (KV v2, OIDC for people, JWT for workloads, a break-glass admin), trusting a Keycloak realm the stack imports. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.16
appVersion: "1.0.0"
keywords:
  - secrets
  - openbao
  - vault
  - keycloak
  - sso
  - oidc
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/openbao/openbao
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles keycloak=0.0.41,openbao=0.0.22 (2026-10-22 CVE rebuild)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: openbao
      image: ghcr.io/quenchworks/images/openbao@sha256:6f72ee444f368ca04717467aeba952fb28e0bf0cac24fda42116ad3811a61192
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:62cd32c071d5349b5149d7b49c912700611667d93253aa50c445067c300145c7
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:42316ed44fa7722f611c35af6edb37882ceaac8c83f48a59735d329d5c12d977
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: openbao
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
  - name: keycloak
    version: 0.0.41
    repository: oci://ghcr.io/quenchworks/charts
    condition: keycloak.enabled

# secrets-stack: OpenBao behind Keycloak sign-in.
#
# OpenBao auto-unseals with a static seal key (a Secret this chart generates and
# keeps across upgrades) and configures itself on first start (declarative
# self-initialization): a KV v2 mount at secret/, OIDC auth for people (role
# "user", sign in through Keycloak), JWT auth for workloads (role "machine",
# Keycloak client-credentials tokens), and a break-glass userpass "admin".
# Keycloak imports a "secrets" realm with the confidential "openbao" client.
#
# Names are FIXED (secrets-keycloak, secrets-stack-*): the subcharts take their
# peers as plain values, not templates. One stack per namespace.

# The Keycloak realm OpenBao trusts ("secrets", fixed: the wait-for-realm init
# container below names it), and its "openbao" client.
realm:
  # Where people are sent back after signing in: the bao CLI's local callback
  # and, if you expose OpenBao, its UI callback (<openbao url>/ui/vault/auth/oidc/oidc/callback).
  redirectUris:
    - http://localhost:8250/oidc/callback
  # Optional realm users, e.g. for a demo or a gate: [{username, password}].
  # Real deployments manage users in Keycloak (or federate an IdP) instead.
  users: []

# ---------------------------------------------------------------------------
# Keycloak (subchart). production.hostname is the ISSUER: tokens carry it, and
# OpenBao fetches the realm's discovery document from it. The default is the
# in-cluster Service; for browser sign-in set it to the public URL (reachable
# from both browsers and the OpenBao pod) and set proxyHeaders behind an ingress.
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  fullnameOverride: secrets-keycloak
  production:
    hostname: http://secrets-keycloak:8080
  args: ["--import-realm"]
  extraVolumes:
    - name: realm
      secret:
        secretName: secrets-stack-realm
  extraVolumeMounts:
    - name: realm
      mountPath: /opt/keycloak/data/import
      readOnly: true

# ---------------------------------------------------------------------------
# OpenBao (subchart). The stack's config (static seal + self-init) is a
# ConfigMap mounted at BAO_CONFIG_EXTRA_DIR; secrets come in as env.
# ---------------------------------------------------------------------------
openbao:
  extraEnvVars:
    - name: BAO_CONFIG_EXTRA_DIR
      value: /openbao/extra
    - name: STACK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef: { name: secrets-stack-openbao, key: admin-password }
    - name: STACK_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef: { name: secrets-stack-openbao, key: client-secret }
  extraVolumes:
    - name: stack-config
      configMap:
        name: secrets-stack-openbao-config
    - name: stack-seal
      secret:
        secretName: secrets-stack-openbao
        items:
          - { key: seal-key, path: seal.key }
  extraVolumeMounts:
    - name: stack-config
      mountPath: /openbao/extra
      readOnly: true
    - name: stack-seal
      mountPath: /openbao/seal
      readOnly: true
  # Self-init configures OIDC once, on first start, and writing auth/oidc/config
  # fetches the realm's discovery document. So OpenBao waits for it. The openbao
  # image's busybox has no nc or wget, so the wait runs in the keycloak image,
  # whose bash can open /dev/tcp. Keep this digest equal to keycloak's image.digest.
  initContainers:
    - name: wait-for-realm
      image: ghcr.io/quenchworks/images/keycloak@sha256:ff8d99f4b5f0c570651bdf343c3e6de940712fe6a4b2de7195542376f33f3f2f
      command: ["/bin/bash", "-c"]
      args:
        - |
          until status="$( (exec 3<>/dev/tcp/secrets-keycloak/8080 \
                   && printf 'GET /realms/secrets/.well-known/openid-configuration HTTP/1.0\r\nHost: secrets-keycloak\r\n\r\n' >&3 \
                   && head -1 <&3) 2>&1)"; [[ "$status" == *" 200 "* ]]; do
            echo "waiting for the Keycloak realm: ${status:-no answer}"; sleep 5
          done
          echo "realm is up: $status"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: { drop: [ALL] }

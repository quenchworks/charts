{{/*
secrets-stack-openbao: the static seal key (32 bytes; OpenBao unseals with it on
every start), the break-glass admin password, and the "openbao" client secret.
secrets-stack-realm: the Keycloak realm import, which carries the same client
secret. Both are rendered in one pass and read back from the live Secret first:
a new seal key would make the existing data unreadable.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "secrets-stack-openbao" -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $seal := index $prior "seal-key" | default "" | b64dec -}}
{{- if not $seal }}{{- $seal = randAlphaNum 32 }}{{- end -}}
{{- $admin := index $prior "admin-password" | default "" | b64dec -}}
{{- if not $admin }}{{- $admin = randAlphaNum 24 }}{{- end -}}
{{- $client := index $prior "client-secret" | default "" | b64dec -}}
{{- if not $client }}{{- $client = randAlphaNum 32 }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: secrets-stack-openbao
  labels:
    {{- include "secrets-stack.labels" . | nindent 4 }}
  annotations:
    # Losing this Secret loses the seal key, and with it every stored secret.
    helm.sh/resource-policy: keep
type: Opaque
data:
  seal-key: {{ $seal | b64enc | quote }}
  admin-password: {{ $admin | b64enc | quote }}
  client-secret: {{ $client | b64enc | quote }}
{{- $users := list -}}
{{- range .Values.realm.users -}}
{{- $users = append $users (dict "username" .username "enabled" true "emailVerified" true
      "credentials" (list (dict "type" "password" "value" .password "temporary" false))) -}}
{{- end -}}
{{- $realm := dict
    "realm" "secrets"
    "enabled" true
    "users" $users
    "clients" (list (dict
        "clientId" "openbao"
        "name" "OpenBao"
        "enabled" true
        "publicClient" false
        "clientAuthenticatorType" "client-secret"
        "secret" $client
        "standardFlowEnabled" true
        "directAccessGrantsEnabled" false
        "serviceAccountsEnabled" true
        "redirectUris" .Values.realm.redirectUris
        "protocolMappers" (list (dict
            "name" "audience-openbao"
            "protocol" "openid-connect"
            "protocolMapper" "oidc-audience-mapper"
            "config" (dict "included.client.audience" "openbao" "access.token.claim" "true" "id.token.claim" "true"))))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secrets-stack-realm
  labels:
    {{- include "secrets-stack.labels" . | nindent 4 }}
type: Opaque
data:
  secrets-realm.json: {{ $realm | toJson | b64enc | quote }}

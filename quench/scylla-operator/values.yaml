# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/scylla-operator
  digest: "sha256:5d0ca839db27bf238cd9d0c85f12688ae5b529f56d450291e68428004a067c58"
  pullPolicy: IfNotPresent

nameOverride: ""

# Verbosity of the operator and the webhook server (0-10).
logLevel: 2

operator:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 1, memory: 512Mi }

webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 256Mi }

# --- Common knobs, wired through quench-common (all optional) ---
podSecurityContext: {}
containerSecurityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []
priorityClassName: ""
extraEnvVars: []

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/artex
  digest: "sha256:8f54e53abd23fa6dc409332da4ac8b6864b8697202134359dfec20eb66de55ff"
  pullPolicy: IfNotPresent

nameOverride: ""

# ARTEX runs recon and scanning tools against the targets you give it. Use it only on systems you are authorized
# to test. The admin password is set once in the web UI with a one-time setup token that the server prints to its
# log while no password exists (see NOTES after install).

# The data dir, the JWT and secret keys, and the agent's working files live on one volume: one replica, replaced
# with Recreate (the default when this is empty).
replicaCount: 1
updateStrategy: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 5Gi
  annotations: {}

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" and from each other
# (the image skips creating a database named like its user).
postgresql:
  enabled: true
  auth:
    username: artex
    password: ""        # generated by the subchart if empty
    database: artex_db
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false), with a Secret holding the password (URL-safe characters:
# it goes into the DSN as is).
externalDatabase:
  host: ""
  port: 5432
  database: artex
  username: artex
  sslmode: require
  existingSecret: ""
  existingSecretPasswordKey: password

# LLM provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...) belong in a Secret: name it in extraEnvVarsSecret.
# Other ARTEX settings as environment variables, e.g. ARTEX_LLM_PROVIDER, ARTEX_LLM_MODEL, ARTEX_TRUSTED_PROXIES.
settings: {}

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 8787
  annotations: {}
  externalTrafficPolicy: ""

# ARTEX has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: artex.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [artex.example.com], secretName: artex-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Ingress to the console only. Egress stays open: scanning targets is the job.
networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

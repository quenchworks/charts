image:
  repository: ghcr.io/quenchworks/images/pairdrop
  digest: "sha256:acc7126a61d531818bbac23838ac9de2d55d966e6a67d865bbb4833004445cbc"
  pullPolicy: IfNotPresent

nameOverride: ""

# The WebRTC configuration sent to browsers (STUN/TURN servers). Empty uses PairDrop's built-in public STUN. Peers
# behind symmetric NAT need a TURN server, e.g.:
#   iceServers:
#     - urls: "turn:turn.example.com:3478"
#       username: pairdrop
#       credential: secret
rtcConfig: {}
#  sdpSemantics: unified-plan
#  iceServers:
#    - urls: "stun:stun.l.google.com:19302"

# Limit connections per client IP (behind an Ingress, set it to the number of proxy hops).
rateLimit: false

# Relay transfers through the server (WebSocket) when WebRTC cannot connect.
wsFallback: false

# Other PairDrop settings as environment variables: the *_BUTTON_ACTIVE / _LINK / _TITLE footer links, DEBUG_MODE.
settings: {}

updateStrategy: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 1, memory: 256Mi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  hosts: []
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

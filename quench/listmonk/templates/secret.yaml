{{- $name := include "quench-common.fullname" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $needAdmin := not .Values.admin.existingSecret -}}
{{- $needDb := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $needAdmin $needDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needAdmin }}
  # the first admin's password, used by `listmonk --install` on the first start only
  admin-password: {{ .Values.admin.password | b64enc | default (index $old "admin-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

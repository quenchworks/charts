# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/wikijs
  digest: "sha256:6f0082b1d2eb8fdf726d9a6cf28efcdc7e09b04cb20110242d0855b429eff036"
  pullPolicy: IfNotPresent

nameOverride: ""

# Wiki.js keeps a cache and Git-sync clones in /wiki/data: one replica on a ReadWriteOnce volume (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The first administrator, created on the first start (upstream would create admin@example.com / 12345678).
# Empty password: generated into the Secret <fullname> (password) and kept on upgrade.
auth:
  email: admin@example.com
  password: ""
  existingSecret: ""   # a Secret with key "password" instead

# /wiki/data: cache, uploads in transit and Git-sync clones (page content lives in PostgreSQL).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

# The bundled QuenchWorks PostgreSQL. username and database must differ from "postgres" and from each other (the image
# skips createdb when the database name equals the user).
postgresql:
  enabled: true
  auth:
    username: wikijs
    password: ""        # generated by the subchart if empty
    database: wiki
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Your own PostgreSQL instead (postgresql.enabled=false).
externalDatabase:
  host: ""
  port: 5432
  user: wiki
  database: wiki
  ssl: false
  existingSecret: ""
  existingSecretKey: password

# More Wiki.js settings as environment variables (config.yml reads them), e.g. LOG_LEVEL: debug, OFFLINE: "true",
# DB_SCHEMA: wiki.
settings: {}

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 2, memory: 1Gi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# Wiki.js has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: wiki.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [wiki.example.com], secretName: wiki-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

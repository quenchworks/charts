apiVersion: v2
name: wikijs
description: "Wiki.js: a wiki with Markdown and visual editors, Git sync and many auth providers, on the bundled PostgreSQL, with the first administrator from a generated Secret. Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "3.4.0"
keywords:
  - wikijs
  - wiki
  - documentation
  - knowledge-base
  - markdown
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/requarks/wiki
annotations:

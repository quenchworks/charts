# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rethinkdb
  digest: "sha256:5c0cd2502180a0fd58118ff8e32ff9c7f297d4f297a24e3841fe142372f4f9ef"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# The admin user's password, set when the data directory is first created.
# Empty generates one into a Secret, kept across upgrades. With existingSecret,
# that Secret must hold the password under the "password" key.
auth:
  existingSecret: ""

# Extra rethinkdb flags, e.g. ["--cache-size", "1024"].
extraArgs: []

# Native TLS: the driver port (28015) and the web UI (8080) serve TLS only, with the certificate
# mounted at /tls; drivers connect with ssl={"ca_certs": ...}. It comes from the first source
# set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 2000m, memory: 2Gi }

nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 28015
  # The web admin UI has no login; keep it off the Service unless you front it
  # with an authenticating proxy.
  exposeAdmin: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := randAlphaNum 32 -}}
{{- if $existing }}{{- $pw = index $existing.data "password" | b64dec -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}

{{- /* settings.toml, in a Secret: it carries the stats password. Telemetry stores each test result in a sqlite file
       on the volume and enables the stats page behind a generated password (kept on upgrade). */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := get $old "stats-password" | b64dec | default (.Values.telemetry.statsPassword | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  stats-password: {{ $pw | b64enc | quote }}
  settings.toml: {{ (include "librespeed.settings" (dict "ctx" . "pw" $pw)) | b64enc | quote }}

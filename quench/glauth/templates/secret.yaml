{{- /* glauth.cfg (it holds password hashes, so a Secret) and the admin's password, generated once
       and read back on upgrade. The admin is a search-capable service account in the "admins"
       group: cn=<username>,ou=admins,<baseDN>. Helm cannot hex-encode bcrypt, so its hash is
       passsha256 over a random 24-character password; your own users can use passbcrypt. */}}
{{- $name := include "glauth.secretName" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
{{- $cfg := printf `debug = false
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"
[ldaps]
  enabled = false
[backend]
  datastore = "config"
  baseDN = %q
[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = true
  NumberOfFailedBinds = 3
  PeriodOfFailedBinds = 10
  BlockFailedBindsFor = 60
  PruneSourceTableEvery = 600
  PruneSourcesOlderThan = 600
[[users]]
  name = %q
  uidnumber = 5000
  primarygroup = 5000
  passsha256 = %q
  [[users.capabilities]]
    action = "search"
    object = "*"
[[groups]]
  name = "admins"
  gidnumber = 5000
%s
` .Values.baseDN .Values.admin.username (sha256sum $pw) .Values.extraConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  glauth.cfg: {{ $cfg | b64enc | quote }}

# Install gate on kind: etcd without PVCs, small requests, no PDBs (a single node).
etcd:
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podDisruptionBudget:
    enabled: false
controlPlane:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  podDisruptionBudget:
    enabled: false
dataPlane:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  podDisruptionBudget:
    enabled: false

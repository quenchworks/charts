apiVersion: v2
name: apisix-hybrid-stack
description: "Apache APISIX in decoupled (hybrid) mode: a control plane that owns the Admin API, data planes that only proxy, a 3-member etcd they share over mutual TLS, and the APISIX Ingress Controller writing routes through the control plane. The stack generates the etcd CA, server and client certificates and keeps them across upgrades. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.3
appVersion: "3.19.0"
keywords:
  - apisix
  - api-gateway
  - etcd
  - hybrid
  - ingress
  - stack

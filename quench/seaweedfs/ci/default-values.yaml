# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
auth:
  enabled: true
  accessKey: "ci-test-access-key"
  secretKey: "ci-test-secret-key-0123456789"

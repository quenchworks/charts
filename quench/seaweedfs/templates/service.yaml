apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: s3
      name: s3
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.s3HttpsPort }}
      targetPort: s3-https
      name: s3-https
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seaweedfs.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: s3
      name: s3
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.s3HttpsPort }}
      targetPort: s3-https
      name: s3-https
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

apiVersion: v2
name: excalidraw
description: "Open-source virtual whiteboard for sketching hand-drawn-style diagrams, served as a static SPA. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.8
appVersion: "0.18.1"
keywords:
  - excalidraw
  - whiteboard
  - diagrams
  - drawing
  - collaboration
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/excalidraw/excalidraw
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "Corrected the ArtifactHub category annotation. The previous value was not one of ArtifactHub's accepted categories, so every version of this chart failed tracking with 'invalid category name' and the chart did not appear on ArtifactHub at all."
    - kind: changed
      description: "Maintenance re-release: re-validated against the chart's current pinned, cosign-signed 0-CVE images."
  artifacthub.io/images: |
    - name: excalidraw
      image: ghcr.io/quenchworks/images/excalidraw@sha256:85ccb1fd7b34146ffecc67c3ded9cf814200a01863bab9922213988e6bb2ff51
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

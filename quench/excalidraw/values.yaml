# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/excalidraw
  digest: "sha256:85ccb1fd7b34146ffecc67c3ded9cf814200a01863bab9922213988e6bb2ff51"
  pullPolicy: IfNotPresent

nameOverride: ""

# Excalidraw is a static SPA served by nginx: this chart runs a stateless
# Deployment behind a ClusterIP Service and scales horizontally. No persistence.
replicaCount: 1

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }

service:
  type: ClusterIP
  # The container serves on 8080 (nonroot); the Service exposes standard HTTP 80.
  port: 80

# Optional horizontal autoscaling on CPU.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

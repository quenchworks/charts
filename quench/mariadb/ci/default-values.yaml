# HA install gate: brings up the full 3-node synchronous Galera cluster on kind.
# No image override -- the gate pulls the chart's real, CI-maintained digest from
# values.yaml. Ephemeral per-pod storage for a fast teardown; resources shrunk so
# all three nodes fit a single kind node.
architecture: galera
auth:
  enabled: true
  database: qwapp
galera:
  replicaCount: 3
primary:
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# Gate the metrics sidecar too: 0-CVE is not proof it starts and serves /metrics.
metrics:
  enabled: true

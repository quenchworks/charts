{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: mariadb
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: metrics
          protocol: TCP
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    {{- if eq .Values.architecture "galera" }}
    # Galera intra-cluster traffic: 4567 gcomm replication, 4568 IST, 4444 SST.
    # Always restricted to same-namespace pods regardless of allowExternal.
    - ports:
        - port: galera
          protocol: TCP
        - port: ist
          protocol: TCP
        - port: sst
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: primary
    {{- end }}
{{- end }}

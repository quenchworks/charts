# The digest below is the contract with the image factory. CI rewrites it from
# manifests/mariadb.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mariadb
  digest: "sha256:7f506d403668a0eb1504c924d3f862667a9c63fc80213ee2bb3926ce0b347483"
  pullPolicy: IfNotPresent

nameOverride: ""

# Topology.
#   standalone (default) — a single primary. Backward compatible; unchanged.
#   galera               — a synchronous multi-primary Galera cluster. Every node
#                          accepts writes; a write is committed only once a quorum
#                          of nodes has certified it, so there is no failover gap
#                          and no primary election. Needs galera.replicaCount nodes
#                          (odd, >=3) so a surviving majority keeps quorum.
architecture: standalone

galera:
  # Node count. Keep it ODD (3, 5, ...) so quorum is unambiguous. 3 tolerates the
  # loss of 1 node while staying writable.
  replicaCount: 3
  clusterName: quench-galera
  # SST (state snapshot transfer) seeds a joining node from a live donor. mariabackup
  # is the hot, non-blocking method (the donor keeps serving during the copy). It
  # authenticates to the donor as root, using the root password from the auth Secret.
  sstMethod: mariabackup

# Authentication. MariaDB requires a root password to initialize. A random one is
# generated if you do not set it. Optionally create an application user + database.
auth:
  enabled: true
  rootPassword: ""
  database: ""
  username: ""
  password: ""
  existingSecret: ""
  existingSecretRootPasswordKey: "mariadb-root-password"
  existingSecretPasswordKey: "mariadb-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 3306

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 120
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# Prometheus metrics via a mysqld_exporter sidecar (our hardened, digest-pinned
# image) in every server pod -- standalone and every Galera node. It authenticates
# over the pod's loopback as root with the password from the auth Secret; for a
# least-privilege scrape user, disable this and add your own exporter through
# `sidecars:` instead.
metrics:
  enabled: false
  image:
    repository: ghcr.io/quenchworks/images/mysqld-exporter
    digest: "sha256:691fa202c7f8499b68ebc328fdd64ff68c10d68625b01f2175092b4974330d65"
    pullPolicy: IfNotPresent
  port: 9104
  # Extra mysqld_exporter flags, e.g. ["--collect.info_schema.processlist"].
  extraArgs: []
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

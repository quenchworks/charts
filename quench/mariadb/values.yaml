# The digest below is the contract with the image factory. CI rewrites it from
# manifests/mariadb.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mariadb
  digest: "sha256:899fe9dc5315ed8496fd709ff0456a37cb131f5d73c2e4f7566d9d34679f8191"
  pullPolicy: IfNotPresent

nameOverride: ""

# Authentication. MariaDB requires a root password to initialize. A random one is
# generated if you do not set it. Optionally create an application user + database.
auth:
  enabled: true
  rootPassword: ""
  database: ""
  username: ""
  password: ""
  existingSecret: ""
  existingSecretRootPasswordKey: "mariadb-root-password"
  existingSecretPasswordKey: "mariadb-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 3306

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 120
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

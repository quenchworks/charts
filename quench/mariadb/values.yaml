# The digest below is the contract with the image factory. CI rewrites it from
# manifests/mariadb.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/mariadb
  digest: "sha256:274b2bb0b6c3ce347a7f418d8b942ac61707403561850c9420b815b8b741f5f8"
  pullPolicy: IfNotPresent

nameOverride: ""

# Authentication. MariaDB requires a root password to initialize. A random one is
# generated if you do not set it. Optionally create an application user + database.
auth:
  enabled: true
  rootPassword: ""
  database: ""
  username: ""
  password: ""
  existingSecret: ""
  existingSecretRootPasswordKey: "mariadb-root-password"
  existingSecretPasswordKey: "mariadb-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 3306

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

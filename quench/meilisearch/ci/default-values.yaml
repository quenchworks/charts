# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false        # emptyDir at /meili_data for the gate
auth:
  # Fixed test master key so the gate can assert auth deterministically (with/without).
  masterKey: "citest-master-key-0123456789abcdef"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

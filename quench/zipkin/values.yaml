# Quenchworks Zipkin: the distributed tracing server on the QuenchWorks zipkin image
# (nonroot, 0-CVE, cosign-signed, pinned by digest). Spans arrive over HTTP
# (/api/v2/spans) or gRPC on 9411; the Lens UI is at /zipkin/.
image:
  repository: ghcr.io/quenchworks/images/zipkin
  digest: "sha256:dab2b7cf270a7910c2023e40eb8ea5f91eb4b351f707705ac793bea249a78b04"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# In-memory storage keeps spans in one pod; run one replica with it. With a real
# backend Zipkin is stateless and scales out.
replicas: 1

storage:
  # mem | elasticsearch | cassandra3 | mysql
  type: mem
  elasticsearch:
    hosts: ""                 # e.g. http://opensearch:9200
  cassandra:
    contactPoints: ""         # e.g. cassandra:9042
    keyspace: zipkin2
  mysql:
    host: ""
    port: 3306
    database: zipkin
    user: zipkin
  # Secret holding the backend password (ES_PASSWORD, CASSANDRA_PASSWORD or MYSQL_PASS)
  existingSecret: ""
  existingSecretPasswordKey: password

# Heap and other JVM flags
javaOpts: "-XX:MaxRAMPercentage=75"

# Any other Zipkin setting as environment variables, e.g. COLLECTOR_SAMPLE_RATE: "0.1",
# KAFKA_BOOTSTRAP_SERVERS: kafka:9092, RABBIT_ADDRESSES: rabbitmq:5672.
env: {}

extraEnvVars: []

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: 1000m, memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 9411
  # HTTPS Service port (to the container's 8443), only with tls.enabled
  httpsPort: 443

# Native TLS: a second Armeria port serves the UI, API and collector over HTTPS on 8443
# (Service service.httpsPort) beside HTTP on 9411. Zipkin reads only a keystore, so an init
# container on the openssl image builds a PKCS12. The certificate comes from the first source
# set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

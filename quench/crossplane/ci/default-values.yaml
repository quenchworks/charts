# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Nothing else is needed to boot -- Crossplane installs its own CRDs from the image and
# mints its own webhook certificates, so there is no external dependency to stub out.
# Resources are trimmed to fit a single-node kind cluster running BOTH Deployments.
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 1000m, memory: 1Gi }
rbacManager:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

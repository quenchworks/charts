apiVersion: v2
name: crossplane
description: "Crossplane, the CNCF control-plane framework that turns Kubernetes into a universal API for infrastructure. Installs Providers, Functions and Configurations as packages, and lets platform teams publish their own composite APIs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "2.4.1"
kubeVersion: ">=1.28.0-0"
keywords:
  - crossplane
  - control-plane
  - platform-engineering
  - infrastructure-as-code
  - composition
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/crossplane/crossplane
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Move to Crossplane 2.4.1. Fresh installs are unaffected. On UPGRADE, package revision names now derive from the digest and metadata.generation, so every installed Provider and Function gets a new PackageRevision on first reconcile and its Pod restarts; package runtime objects also move to server-side apply, so a field removed from a DeploymentRuntimeConfig is now actually removed. The core CRDs travel in the image and are applied by core init, so no CRD work is needed here."
  artifacthub.io/category: integration-delivery
  # The core CRDs are NOT shipped in the chart's crds/ directory. They travel inside the
  # image at /crds and the `core init` container applies them, which is how Crossplane
  # keeps CRDs and controller at the same revision (and how it migrates storage versions
  # on upgrade -- something Helm's crds/ directory deliberately never does).
  artifacthub.io/crds: |
    - kind: Provider
      version: v1
      name: providers.pkg.crossplane.io
      displayName: Provider
      description: A Crossplane package that adds support for an external service's APIs.
    - kind: Function
      version: v1
      name: functions.pkg.crossplane.io
      displayName: Composition Function
      description: A Crossplane package that runs as part of a Composition pipeline.
    - kind: Configuration
      version: v1
      name: configurations.pkg.crossplane.io
      displayName: Configuration
      description: A Crossplane package bundling CompositeResourceDefinitions and Compositions.
    - kind: CompositeResourceDefinition
      version: v1
      name: compositeresourcedefinitions.apiextensions.crossplane.io
      displayName: Composite Resource Definition
      description: Defines a new composite (XR) API served by the control plane.
    - kind: Composition
      version: v1
      name: compositions.apiextensions.crossplane.io
      displayName: Composition
      description: Declares how a composite resource is composed of other resources.
  artifacthub.io/images: |
    - name: crossplane
      image: ghcr.io/quenchworks/images/crossplane@sha256:69a727135d8c67b342957ed4302469bc8f28aafddb8652868240370b3731da82
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

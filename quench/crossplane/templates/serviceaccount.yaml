{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crossplane.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbacManager.enabled }}
---
{{/* Separate identity for the RBAC manager: it holds `escalate` and `bind` on
     ClusterRoles, which the core control plane deliberately does not. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crossplane.rbacManagerName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{/*
Created EMPTY on purpose, and filled in by the `core init` container at first start: it
generates a self-signed CA into the first Secret and issues the server and client
certificates from it into the other two. No cert-manager dependency.

Two reasons the CHART must create them rather than letting the initializer do it:
  * a Pod's secret volumes are mounted before ANY container runs, init containers
    included, so a Secret that does not exist yet leaves the Pod stuck in
    ContainerCreating -- the init container that would create it never gets to run;
  * Helm then owns their lifecycle, so `helm uninstall` takes the certificates with it
    instead of leaving stale CA material behind for the next install to trip over.

All three exist even with webhooks disabled: the CA and the CLIENT certificate are
unconditional (Crossplane presents the client cert when it calls composition Functions
over gRPC); only the SERVER certificate is webhook-specific, and an unused empty Secret
costs nothing next to a conditional that has to stay in sync with the Deployment.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crossplane.tlsCASecret" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crossplane.tlsServerSecret" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crossplane.tlsClientSecret" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque

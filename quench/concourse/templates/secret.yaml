{{/*
The admin (local user) password and, for an external database without an existingSecret,
the DB password. Each is read back from the live Secret so upgrades keep it.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $admin := not .Values.web.admin.existingSecret -}}
{{- $db := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $admin $db }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $admin }}
  {{- $pw := .Values.web.admin.password | default (index $prior "admin-password" | default "" | b64dec) | default (randAlphaNum 24) }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $db }}
  {{- $pw := .Values.externalDatabase.password | default (index $prior "db-password" | default "" | b64dec) | default (randAlphaNum 24) }}
  db-password: {{ $pw | b64enc | quote }}
  {{- end }}
{{- end }}

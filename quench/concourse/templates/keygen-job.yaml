{{/*
Generates the three keys Concourse needs and stores them in <release>-concourse-keys:
session_signing_key (RSA, signs web sessions), tsa_host_key(.pub) (the TSA's SSH host key,
which workers pin) and worker_key(.pub) (the key workers log in with, which the TSA
authorizes). The public halves must be in authorized_keys format, which Helm's
genPrivateKey cannot produce, so `concourse generate-key` makes them.

It runs before install and upgrade and creates the Secret only when it is missing, so
the keys never rotate under running workers. The Secret is not a Helm object and
survives `helm uninstall`; delete it by hand to rotate the keys.
*/}}
{{- $name := printf "%s-keygen" (include "quench-common.fullname" .) -}}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hook) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hook) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "0") $hook) | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keygen
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        {{- range $k := list (list "session_signing_key" "rsa") (list "tsa_host_key" "ssh") (list "worker_key" "ssh") }}
        - name: {{ index $k 0 | replace "_" "-" }}
          image: {{ include "quench-common.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["generate-key", "-t", {{ index $k 1 | quote }}, "-f", {{ printf "/keys/%s" (index $k 0) | quote }}]
          securityContext:
            {{- include "quench-common.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.keygen.resources | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /keys
        {{- end }}
      containers:
        - name: store
          image: {{ printf "%s@%s" .Values.keygen.image.repository .Values.keygen.image.digest }}
          imagePullPolicy: {{ .Values.keygen.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if kubectl get secret {{ include "concourse.keysSecret" . }} >/dev/null 2>&1; then
                echo "{{ include "concourse.keysSecret" . }} exists; keeping its keys"
                exit 0
              fi
              kubectl create secret generic {{ include "concourse.keysSecret" . }} --from-file=/keys
              echo "created {{ include "concourse.keysSecret" . }}"
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.keygen.resources | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          emptyDir:
            medium: Memory

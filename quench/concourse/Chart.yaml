apiVersion: v2
name: concourse
description: Hardened Concourse CI (web node and privileged containerd worker) on a 0-CVE image, with a bundled PostgreSQL.
type: application
version: 0.0.16
appVersion: "8.3.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/concourse/concourse
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - concourse
  - ci
  - cd
  - pipelines
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/concourse/concourse
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: concourse
      image: ghcr.io/quenchworks/images/concourse@sha256:0cdc9504e4844dbe5f1eefd30258a221695001ebada32b977d1d56955e825652
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:b72100ac45eed092c7f6611f86ad12b8074dc8b498f3f9bd701fb3c85d03c475
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

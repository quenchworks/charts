apiVersion: v2
name: concourse
description: Hardened Concourse CI (web node and privileged containerd worker) on a 0-CVE image, with a bundled PostgreSQL.
type: application
version: 0.0.3
appVersion: "8.3.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/concourse/concourse
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - concourse
  - ci
  - cd
  - pipelines
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundled subcharts moved to their 2026-10-04 security re-pins"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/concourse/concourse
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: concourse
      image: ghcr.io/quenchworks/images/concourse@sha256:3ccc486400e1a91094a70ae55fefd414ebde67515f9eb272cef1b6d2cc205a44
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:4033ac5e5f359739cf017a256188a8da7592edae86e452c6327dc4865a66a580
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:48aebfed6b703fc2e8582aff8382063ea6c06b62d8b735e1b13da306182d1f50
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

apiVersion: v2
name: concourse
description: Hardened Concourse CI (web node and privileged containerd worker) on a CVE-gated image, with a bundled PostgreSQL.
type: application
version: 0.0.20
appVersion: "8.3.3"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/concourse/concourse
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - concourse
  - ci
  - cd
  - pipelines
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/concourse/concourse
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: concourse
      image: ghcr.io/quenchworks/images/concourse@sha256:c07bd8cbb2e344334fa434849d6e4e4b68ed2933463caedb9d06aa14b161264b
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:579dddb5e9d550f273c067959215b3360fbd055313a7e9f74e449acf95f0c637
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:9c4478f8925ca6e4098ef00966036e933f93c54185b38281f74f5ab02208aa0b
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

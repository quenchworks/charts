apiVersion: v2
name: concourse
description: Hardened Concourse CI (web node and privileged containerd worker) on a 0-CVE image, with a bundled PostgreSQL.
type: application
version: 0.0.8
appVersion: "8.3.1"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/concourse/concourse
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - concourse
  - ci
  - cd
  - pipelines
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Crate-visible rebuild (Rust artifacts now scanned)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/concourse/concourse
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: concourse
      image: ghcr.io/quenchworks/images/concourse@sha256:755461ea934b4bcc6378bb50a7adf9d1b078bde3dc55bbeb13a478cc597a3148
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:d5c4037b5c931585adcd7d8c997f094c9b8b90e56600ed2ff0f585b1b6b48cee
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:e3b4a823a4eb9f6863a0f87b2cd6b2d710f0f5977372b4161873d1861c180655
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

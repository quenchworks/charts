# Install gate: bundled PostgreSQL with no password set (a default install must connect
# with the generated one), a fixed admin password for the smoke test, small resources.
web:
  admin:
    password: ci-admin-password
postgresql:
  primary:
    persistence:
      size: 1Gi
worker:
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }

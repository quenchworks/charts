apiVersion: v2
name: nautobot
description: "Nautobot: the network source of truth and automation platform (Jobs, GraphQL, Git-backed data), with Celery and the bundled PostgreSQL and Valkey. Hardened by QuenchWorks: built from the release wheel, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "3.2.10"
keywords:
  - nautobot
  - ipam
  - dcim
  - network-automation
  - source-of-truth
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nautobot/nautobot
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Updated nautobot to 3.2.10 and re-pinned the image to its new rebuilt digest. Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: nautobot
      image: ghcr.io/quenchworks/images/nautobot@sha256:e2844d1ba95827d1d7a78731fdc9c5761c4f19171f4576b3564233f371d3dc9e
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:66f9687d30e03a25298418dfbd8da5778df946cd40e38fe7a135a161327ca168
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.41
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

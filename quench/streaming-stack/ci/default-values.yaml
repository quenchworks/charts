# Install gate on kind: a one-node Kafka with replication factors of 1, so the
# whole stack fits a CI runner.
kafka:
  replicaCount: 1
  primary:
    persistence:
      enabled: false
  kraft:
    heapOpts: "-Xmx512m -Xms512m"
    defaultReplicationFactor: 1
    minInsyncReplicas: 1
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
karapace:
  registry:
    replicationFactor: 1

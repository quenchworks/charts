apiVersion: v2
name: streaming-stack
description: "Hardened event-streaming stack: a KRaft Kafka cluster, the Karapace schema registry and REST proxy, and the AKHQ web console, wired together in one install. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.27
appVersion: "1.0.0"
keywords:
  - kafka
  - karapace
  - schema-registry
  - akhq
  - streaming
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/kafka
  - https://github.com/Aiven-Open/karapace
  - https://github.com/tchiotludo/akhq
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: streaming-messaging
  artifacthub.io/images: |
    - name: kafka
      image: ghcr.io/quenchworks/images/kafka@sha256:8d5df34d215d2cba044ff42e6362a92dc860dbd6d495025e9b196caae36e688d
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:5dc9f086aeabe8ee3c7188667b54e16ec75d533196ba9f1d7e24e093e0f238f6
    - name: akhq
      image: ghcr.io/quenchworks/images/akhq@sha256:37d71b40d23c764f535b8fb7dec62db43d3202fceb8c78323d6a4351076921fe
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: kafka
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
  - name: karapace
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
    condition: karapace.enabled
  - name: akhq
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: akhq.enabled

      image: ghcr.io/quenchworks/images/kafka@sha256:dbbab3a5f532f95f523372596a5589c8b6f40a9a1fec76610604ca778f35a0cf
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:6543b516ebae778a627e0d2d6e9a8152f90dfca995bfc8babd5ec6d01c30dee2

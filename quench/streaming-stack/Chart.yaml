apiVersion: v2
name: streaming-stack
description: "Hardened event-streaming stack: a KRaft Kafka cluster, the Karapace schema registry and REST proxy, and the AKHQ web console, wired together in one install. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.37
appVersion: "1.0.0"
keywords:
  - kafka
  - karapace
  - schema-registry
  - akhq
  - streaming
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/kafka
  - https://github.com/Aiven-Open/karapace
  - https://github.com/tchiotludo/akhq
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned kafka 4.3.2 to the rebuilt digests."
  artifacthub.io/category: streaming-messaging
  artifacthub.io/images: |
    - name: kafka
      image: ghcr.io/quenchworks/images/kafka@sha256:15109c54017cc8128bdd9553657939ea0f0ed63ac6986c2c72ac31704f433c66
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:97f4d32b0365202bcd383262feae0b4e86c41e375a2f52e9b9c1ba741c1c2fab
    - name: akhq
      image: ghcr.io/quenchworks/images/akhq@sha256:acdc34fe4eb938615c440cefe341358dc74f899b8f306d14478a9cd53f1ad3d7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

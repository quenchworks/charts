      image: ghcr.io/quenchworks/images/kafka@sha256:6b7ea2f5c99d48e4ad40f686464687791b50e55d49b6b74b04985f38573febd2
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:41d4d5e75e11d23055a07bd27271bae2f5ef56a99eeaf23d86085ab0172c2a93
    - name: akhq

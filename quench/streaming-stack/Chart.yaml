      image: ghcr.io/quenchworks/images/kafka@sha256:615fd89c7628764aff757e07936fd2a63a764ac79c397db7a796ab9eaf4eef25
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:a695a48e081fdf28979f4c2e449c1f3a652716bf9f5f3920090ffb0095d15da3
    - name: akhq
      image: ghcr.io/quenchworks/images/akhq@sha256:36159f13935a6ccba46de30be7c39859453412691eb1f166e5aebfcbbe2e6658
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)

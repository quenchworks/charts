apiVersion: v2
name: streaming-stack
description: "Hardened event-streaming stack: a KRaft Kafka cluster, the Karapace schema registry and REST proxy, and the AKHQ web console, wired together in one install. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.5
appVersion: "1.0.0"
keywords:
  - kafka
  - karapace
  - schema-registry
  - akhq
  - streaming
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/kafka
  - https://github.com/Aiven-Open/karapace
  - https://github.com/tchiotludo/akhq
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "akhq image rebuilt with jackson-databind fixed (CVE-2026-68497, CVE-2026-19032, CVE-2026-83557)"
  artifacthub.io/category: streaming-messaging
  artifacthub.io/images: |
    - name: kafka
      image: ghcr.io/quenchworks/images/kafka@sha256:bd6ac0f38612eef7c4ee7f9763e853954d5305efb5a7f94b618459126286c89b
    - name: karapace
      image: ghcr.io/quenchworks/images/karapace@sha256:f0c5c429ddd3a32631e1ec6260437dfe1b8e1a159fbabcbeed8adde1e3c09831
    - name: akhq
      image: ghcr.io/quenchworks/images/akhq@sha256:85dce813deb07b4b7fba74fd79403f28dc6f5931ae637802bfdf788ae8cf9e44
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: kafka
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
  - name: karapace
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: karapace.enabled
  - name: akhq
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: akhq.enabled

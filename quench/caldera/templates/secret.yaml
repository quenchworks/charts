{{- /* Logins and keys, generated once and kept on upgrade. The init container renders conf/local.yml from them. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $v := .Values.auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  red-password: {{ get $old "red-password" | b64dec | default ($v.redPassword | default (randAlphaNum 24)) | b64enc | quote }}
  blue-password: {{ get $old "blue-password" | b64dec | default ($v.bluePassword | default (randAlphaNum 24)) | b64enc | quote }}
  api-key-red: {{ get $old "api-key-red" | b64dec | default ($v.apiKeyRed | default (randAlphaNum 40)) | b64enc | quote }}
  api-key-blue: {{ get $old "api-key-blue" | b64dec | default ($v.apiKeyBlue | default (randAlphaNum 40)) | b64enc | quote }}
  crypt-salt: {{ get $old "crypt-salt" | b64dec | default (randAlphaNum 40) | b64enc | quote }}
  encryption-key: {{ get $old "encryption-key" | b64dec | default (randAlphaNum 40) | b64enc | quote }}
  ftp-password: {{ get $old "ftp-password" | b64dec | default (randAlphaNum 24) | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  overrides.json: {{ .Values.config | toJson | quote }}
  init.py: |
    # Seeds the conf, data and docs volumes from the image and writes conf/local.yml: default.yml, the chart's
    # config overrides, then the logins and keys from the Secret. Existing files on the data volume are kept.
    import json, os, shutil, yaml
    src = "/opt/caldera"
    # fieldmanual rebuilds its docs into sphinx-docs on every start, so that tree lives on a writable volume too
    for d, seed in (("conf", "conf"), ("data", "data"), ("plugins/fieldmanual/sphinx-docs", "docs")):
        for root, dirs, files in os.walk(os.path.join(src, d)):
            dst = os.path.join("/seed", seed, os.path.relpath(root, os.path.join(src, d)))
            os.makedirs(dst, exist_ok=True)
            for f in files:
                if not os.path.exists(os.path.join(dst, f)):
                    shutil.copy(os.path.join(root, f), os.path.join(dst, f))
    with open(os.path.join(src, "conf/default.yml")) as f:
        conf = yaml.safe_load(f)
    with open("/init/overrides.json") as f:
        conf.update(json.load(f) or {})
    env = os.environ
    conf.update({
        "api_key_red": env["API_KEY_RED"], "api_key_blue": env["API_KEY_BLUE"],
        "crypt_salt": env["CRYPT_SALT"], "encryption_key": env["ENCRYPTION_KEY"],
        "app.contact.ftp.pword": env["FTP_PASSWORD"],
        "users": {"red": {"red": env["RED_PASSWORD"]}, "blue": {"blue": env["BLUE_PASSWORD"]}},
    })
    with open("/seed/conf/local.yml", "w") as f:
        yaml.safe_dump(conf, f, default_flow_style=False)
    print("conf/local.yml written; users red, blue; plugins:", ", ".join(conf.get("plugins", [])))

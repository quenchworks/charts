# What the operator reads cluster-wide (workloads, RBAC, network objects to audit), the
# reports it writes, and the scan Jobs it runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, limitranges, nodes, persistentvolumeclaims, persistentvolumes, pods, replicationcontrollers, resourcequotas, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [clustercompliancedetailreports, clustercompliancereports, clusterconfigauditreports, clusterinfraassessmentreports, clusterrbacassessmentreports, clustersbomreports, clustervulnerabilityreports, configauditreports, exposedsecretreports, infraassessmentreports, rbacassessmentreports, sbomreports, vulnerabilityreports]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [clustercompliancereports/status]
    verbs: [get, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
  # image pull secrets of scanned workloads, copied for the scan Jobs
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trivy-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trivy-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Let the built-in view role read the namespaced reports.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quench-common.fullname" . }}-reports-view
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [aquasecurity.github.io]
    resources: [configauditreports, exposedsecretreports, vulnerabilityreports, rbacassessmentreports, sbomreports]
    verbs: [get, list, watch]

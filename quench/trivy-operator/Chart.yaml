apiVersion: v2
name: trivy-operator
description: "Trivy Operator: continuous in-cluster security scanning with Trivy, results stored as Kubernetes CRDs (vulnerabilities, config audits, RBAC assessments, exposed secrets, SBOMs). Scan Jobs run the QuenchWorks trivy-scanner image. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.12
appVersion: "0.35.0"
keywords:
  - trivy
  - trivy-operator
  - security
  - vulnerability-scanning
  - sbom
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: security
  artifacthub.io/operator: "true"
  artifacthub.io/images: |
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:87bc1aed874376d6e22104cd6fce9aacc2aab4c20404f6cfe61794c190aab19e
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:a79a8e44a3898f51a3d8d49f8db07974529895cb29f94f3ea9b293cd4c831b98
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: trivy-operator
description: "Trivy Operator: continuous in-cluster security scanning with Trivy, results stored as Kubernetes CRDs (vulnerabilities, config audits, RBAC assessments, exposed secrets, SBOMs). Scan Jobs run the QuenchWorks trivy-scanner image. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.34.0"
keywords:
  - trivy
  - trivy-operator
  - security
  - vulnerability-scanning
  - sbom
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Trivy Operator 0.34.0 with vulnerability, config audit, RBAC, exposed secret and SBOM scanning; scan Jobs on the QuenchWorks trivy-scanner image."
  artifacthub.io/category: security
  artifacthub.io/operator: "true"
  artifacthub.io/images: |
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:1f4887533cd15878869e7e0edc85d818a61f8b468c7d64c203df1322d05d275f
    - name: trivy-scanner

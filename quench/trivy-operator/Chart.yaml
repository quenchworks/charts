    - kind: changed
      description: "re-pin trivy-scanner 0.75.0 to the 2026-10-22 rebuild"
  artifacthub.io/category: security
  artifacthub.io/operator: "true"
  artifacthub.io/images: |
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:4020b41d9252405572983d79e6aa3eacf854de981e08c049a78f79c0cac2d5d2
    - name: trivy-scanner

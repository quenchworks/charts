apiVersion: v2
name: trivy-operator
description: "Trivy Operator: continuous in-cluster security scanning with Trivy, results stored as Kubernetes CRDs (vulnerabilities, config audits, RBAC assessments, exposed secrets, SBOMs). Scan Jobs run the QuenchWorks trivy-scanner image. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.14
appVersion: "0.35.0"
keywords:
  - trivy
  - trivy-operator
  - security
  - vulnerability-scanning
  - sbom
  - kubernetes

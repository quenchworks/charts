# Quenchworks Trivy Operator on the QuenchWorks trivy-operator image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). The operator watches workloads and launches scan
# Jobs in its own namespace; those Jobs run the scanner image below.
#
# The operator reads its settings from ConfigMaps and Secrets with FIXED names in its
# namespace (trivy-operator, trivy-operator-config, trivy-operator-trivy-config), so
# install one release per namespace.
image:
  repository: ghcr.io/quenchworks/images/trivy-operator
  digest: "sha256:e940e0f7ada04995870cbf650ac06a52b2840faafb7820627c32515cd794f77a"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Namespaces to scan (comma-separated); empty scans all of them.
targetNamespaces: ""
excludeNamespaces: "kube-system"
targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job"

scanners:
  vulnerability: true
  configAudit: true
  rbacAssessment: true
  exposedSecret: true
  sbom: true
  # Infra assessment and cluster compliance need the node collector: a privileged
  # hostPath pod on an image outside this catalog. Off unless you opt in.
  infraAssessment: false
  clusterCompliance: false

scanJob:
  concurrentLimit: 3
  timeout: 5m
  retryAfter: 30s

# The scanner image the scan Jobs run. The operator composes repository:tag and has no
# digest key, so the tag carries the digest ("<version>@sha256:..."). Keep the version
# the operator release pairs with (upstream values trivy.tag): 0.35.0 runs trivy 0.75.0.
# Scan Jobs run `/bin/sh -c "trivy ...; cat|bzip2|base64 ..."`, so this must be an image
# with a shell: trivy-scanner is the QuenchWorks trivy build plus busybox and bzip2.
trivy:
  repository: ghcr.io/quenchworks/images/trivy-scanner
  tag: "0.75.0@sha256:6e2175bd0471799e6e6aee707dedbd3ba9cff5ba3613f1c3688c958146dd5a94"
  severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
  # where scan jobs download the vulnerability DBs from (mirror them for air-gapped clusters)
  dbRepository: mirror.gcr.io/aquasec/trivy-db
  javaDbRepository: mirror.gcr.io/aquasec/trivy-java-db
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Extra operator settings merged into the trivy-operator-config ConfigMap (OPERATOR_* keys).
operatorConfig: {}

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
nodeSelector: {}
tolerations: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # the operator calls the Kubernetes API
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

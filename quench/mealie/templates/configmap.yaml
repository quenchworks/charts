{{- if include "quench-common.tls.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-proxy
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # HTTPS on 8443 in front of Mealie on localhost:9000.
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
    }
    :8443 {
      tls /tls/tls.crt /tls/tls.key
      reverse_proxy 127.0.0.1:9000
    }
{{- end }}

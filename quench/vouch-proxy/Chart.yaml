apiVersion: v2
name: vouch-proxy
description: "Vouch Proxy: SSO for nginx auth_request. Logs users in through OIDC or OAuth (Google, GitHub, Okta, Keycloak, any OIDC issuer) and answers /validate for every request, so apps without a login sit behind SSO. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.50.0"

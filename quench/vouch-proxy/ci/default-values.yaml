# Install gate: a dummy OIDC provider (Vouch never calls it before a login), fixed client secret.
vouch:
  domains: [example.com]
  cookie:
    secure: false
oauth:
  provider: oidc
  clientId: quench-ci-client
  clientSecret: quench-ci-secret
  authUrl: https://idp.example.com/authorize
  tokenUrl: https://idp.example.com/token
  userInfoUrl: https://idp.example.com/userinfo
  callbackUrl: https://vouch.example.com/auth

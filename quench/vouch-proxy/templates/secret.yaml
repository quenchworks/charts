{{- if not .Values.existingSecret }}
{{- /* A new JWT secret would sign every user out: keep the generated one across upgrades. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .) }}
{{- $oldData := ($old | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.oauth.clientSecret | b64enc | quote }}
  jwt-secret: {{ .Values.vouch.jwtSecret | default "" | b64enc | default (get $oldData "jwt-secret") | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}

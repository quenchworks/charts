{{- if include "quench-common.tls.enabled" . }}
{{- /* Vouch reads TLS only from config.yml; everything else comes from the environment. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  config.yml: |
    vouch:
      tls:
        cert: /tls/tls.crt
        key: /tls/tls.key
{{- end }}

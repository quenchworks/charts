apiVersion: v2
name: goalert
description: "GoAlert: on-call scheduling, automated escalations and notifications (SMS, voice, email, Slack, webhooks), with its database on a bundled PostgreSQL and the first administrator created at install. Hardened by QuenchWorks, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.35.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
keywords:
  - goalert
  - on-call
  - alerting
  - escalation
  - incident
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/target/goalert

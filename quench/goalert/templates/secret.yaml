{{- $name := include "quench-common.fullname" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $needKey := not .Values.dataEncryptionKey.existingSecret -}}
{{- $needAdmin := and .Values.admin.create (not .Values.admin.existingSecret) -}}
{{- $needDb := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $needKey $needAdmin $needDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKey }}
  # Kept across upgrades: losing it makes the data GoAlert encrypted unreadable.
  data-encryption-key: {{ .Values.dataEncryptionKey.value | b64enc | default (index $old "data-encryption-key") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if $needAdmin }}
  admin-password: {{ index $old "admin-password" | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

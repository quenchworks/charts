{{/* /health answers once GoAlert serves requests; the first start migrates an empty database,
     which the startup probe allows (5 minutes). */}}
{{- $hc := dict "httpGet" (dict "path" "/health" "port" "http") -}}
{{- $liveness := merge (dict "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 6) (deepCopy $hc) -}}
{{- $readiness := merge (dict "periodSeconds" 10 "timeoutSeconds" 5) (deepCopy $hc) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # restart when the generated keys change
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "goalert.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if or .Values.waitForDatabase.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.waitForDatabase.enabled }}
        - name: wait-for-database
          image: "{{ .Values.waitForDatabase.image.repository }}@{{ .Values.waitForDatabase.image.digest }}"
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -t 3; do echo waiting for $DB_HOST:$DB_PORT; sleep 3; done"]
          env:
            - { name: DB_HOST, value: {{ include "goalert.db.host" . | quote }} }
            - { name: DB_PORT, value: {{ include "goalert.db.port" . | quote }} }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: goalert
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "goalert.dbEnv" . | nindent 12 }}
            - { name: GOALERT_LISTEN, value: "0.0.0.0:8081" }
            - { name: GOALERT_PUBLIC_URL, value: {{ include "goalert.publicUrl" . | quote }} }
            {{- if include "quench-common.tls.enabled" . }}
            - { name: GOALERT_LISTEN_TLS, value: "0.0.0.0:8443" }
            - { name: GOALERT_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: GOALERT_TLS_KEY_FILE, value: /tls/tls.key }
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            {{- if include "quench-common.tls.enabled" . }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          startupProbe:
            {{- if .Values.customStartupProbe }}
            {{- toYaml .Values.customStartupProbe | nindent 12 }}
            {{- else }}
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
            {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

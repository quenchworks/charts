# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# emptyDir data dir keeps the gate from waiting on a PVC bind; coroot boots with a
# local SQLite store and no external Prometheus/ClickHouse, which is enough to
# reach Ready (its /health returns 200 once the server is listening).
persistence:
  enabled: false

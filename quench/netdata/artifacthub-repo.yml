# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-netdata, OCI URL oci://ghcr.io/quenchworks/charts/netdata.
# Placeholder repositoryID until the repo is registered; the release guard skips the
# metadata push while this is a placeholder.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # netdata (oci://ghcr.io/quenchworks/charts/netdata)
owners:
  - name: QuenchWorks
    email: info@quench-works.com

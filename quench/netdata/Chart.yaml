apiVersion: v2
name: netdata
description: "Netdata agent as a DaemonSet: per-second CPU, memory, disk, network, cgroup and process metrics for every node, read from the host's /proc and /sys, served over the Netdata REST API and a Prometheus endpoint. Headless build without the Cloud UI. Hardened by QuenchWorks: built from source on Wolfi, nonroot, 0-CVE, cosign-signed and pinned by digest."

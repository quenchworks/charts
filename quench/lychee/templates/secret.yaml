{{- /* APP_KEY and the admin password: generated once and read back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.appKey.existingSecret }}
  app-key: {{ .Values.appKey.value | default (get $old "app-key" | b64dec) | default (printf "base64:%s" (randAlphaNum 32 | b64enc)) | b64enc | quote }}
  {{- end }}
  admin-password: {{ .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}

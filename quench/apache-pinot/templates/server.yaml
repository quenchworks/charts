{{- $v := .Values.server -}}
{{- include "pinot.component" (dict "ctx" . "component" "server" "values" $v "persist" true "probe" "/health"
      "ports" (list (dict "name" "admin" "port" (int $v.adminPort)) (dict "name" "netty" "port" (int $v.port)))
      "cmd" (list "StartServer" "-clusterName" .Values.clusterName "-zkAddress" (include "pinot.zkAddress" .)
                  "-serverHost" (include "pinot.podHost" (dict "ctx" . "component" "server"))
                  "-serverPort" (toString $v.port) "-serverAdminPort" (toString $v.adminPort)
                  "-dataDir" "/var/pinot/server/index" "-segmentDir" "/var/pinot/server/segments")) }}

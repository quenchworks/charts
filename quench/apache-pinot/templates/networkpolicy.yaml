{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # every Pinot component talks to every other one (Helix, segment fetch, query scatter)
    - from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
    # clients: the broker's query port and the controller's admin API and UI
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

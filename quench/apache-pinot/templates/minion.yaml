{{- if .Values.minion.enabled }}
{{- $v := .Values.minion -}}
{{- include "pinot.component" (dict "ctx" . "component" "minion" "values" $v "persist" false "probe" "/health"
      "ports" (list (dict "name" "http" "port" (int $v.port)))
      "cmd" (list "StartMinion" "-clusterName" .Values.clusterName "-zkAddress" (include "pinot.zkAddress" .)
                  "-minionHost" (include "pinot.podHost" (dict "ctx" . "component" "minion"))
                  "-minionPort" (toString $v.port))) }}
{{- end }}

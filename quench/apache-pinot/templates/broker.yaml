{{- $v := .Values.broker -}}
{{- include "pinot.component" (dict "ctx" . "component" "broker" "values" $v "persist" false "probe" "/health"
      "ports" (list (dict "name" "http" "port" (int $v.port)))
      "cmd" (list "StartBroker" "-clusterName" .Values.clusterName "-zkAddress" (include "pinot.zkAddress" .)
                  "-brokerHost" (include "pinot.podHost" (dict "ctx" . "component" "broker"))
                  "-brokerPort" (toString $v.port))) }}

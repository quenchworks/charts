{{- $v := .Values.controller -}}
{{- include "pinot.component" (dict "ctx" . "component" "controller" "values" $v "persist" true "probe" "/health"
      "ports" (list (dict "name" "http" "port" (int $v.port)))
      "cmd" (list "StartController" "-clusterName" .Values.clusterName "-zkAddress" (include "pinot.zkAddress" .)
                  "-controllerHost" (include "pinot.podHost" (dict "ctx" . "component" "controller"))
                  "-controllerPort" (toString $v.port) "-dataDir" "/var/pinot/controller")) }}

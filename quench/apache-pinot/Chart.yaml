apiVersion: v2
name: apache-pinot
description: "Apache Pinot, the real-time distributed OLAP datastore: controller, broker, server and optional minion on a bundled ZooKeeper. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image built from source, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "1.6.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/pinot
keywords:
  - pinot
  - olap
  - analytics
  - realtime
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned apache-pinot 1.6.0 to the rebuild on the fixed OpenJDK (CVE-2026-114938, Java4Shell)."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: apache-pinot
      image: ghcr.io/quenchworks/images/apache-pinot@sha256:7bb1f7c1185766ac7aa1ce20f6b2f0a870960e66f56912a8ddd519c64b684c31
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: zookeeper
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: zookeeper.enabled

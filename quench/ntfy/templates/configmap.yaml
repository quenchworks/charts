{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntfy.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /etc/ntfy/server.yml and passed to `ntfy serve` via --config.
  server.yml: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}

{{- /* The login password and the API token: generated once and read back on upgrade. */}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $tok := .Values.auth.apiToken | default (get $old "api-token" | b64dec) | default (randAlphaNum 40) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  api-token: {{ $tok | b64enc | quote }}
{{- end }}

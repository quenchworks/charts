# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/silverbullet
  digest: "sha256:673ec7a53bc46d332d436801577388d2aea1fcef2eed1d49126945857f2cd1a7"
  pullPolicy: IfNotPresent

nameOverride: ""

# SQLite on a ReadWriteOnce volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The login (SB_USER) and an API token for scripts and sync clients (SB_AUTH_TOKEN, header Authorization: Bearer).
# Empty values: generated into the Secret <fullname> (password, api-token) and kept on upgrade.
auth:
  enabled: true
  username: admin
  password: ""
  apiToken: ""
  existingSecret: ""   # a Secret with keys "password" and "api-token" instead

# More SB_* settings, e.g. SB_URL_PREFIX: /notes, SB_SPACE_IGNORE: "_private/", SB_REVISIONS: "on",
# SB_HEAD_HTML: ..., SB_OIDC_*. Shell commands stay off (SB_SHELL_BACKEND, the image has no shell).
settings: {}

# The space: your Markdown files (/data).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 1, memory: 512Mi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# SilverBullet has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: notes.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [notes.example.com], secretName: notes-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

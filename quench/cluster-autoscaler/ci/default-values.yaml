# Install gate: the kwok provider creates fake nodes, so kind can prove a real scale-up
# and scale-down. The gate installs the kwok controller and the kwok-provider-config and
# kwok-provider-templates ConfigMaps first. Short timers keep the gate within minutes.
cloudProvider: kwok
extraArgs:
  - --scan-interval=10s
  - --scale-down-delay-after-add=20s
  - --scale-down-unneeded-time=20s
  - --v=2

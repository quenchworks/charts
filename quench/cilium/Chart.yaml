apiVersion: v2
name: cilium
description: "Cilium networking for Kubernetes: the eBPF agent DaemonSet (CNI, IPAM through CiliumNodes, network policy, VXLAN overlay) with the QuenchWorks Cilium Operator as a dependency. Hardened by QuenchWorks: the agent built from source on Wolfi, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.20
appVersion: "1.20.5"
keywords:
  - cilium
  - cni
  - ebpf
  - networking
  - network-policy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/cilium/cilium
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "L7 policy: the cilium-envoy DaemonSet (the quench cilium-envoy image, Envoy 1.39.6 built from cilium/proxy) runs alongside the agent, which turns on enable-l7-proxy and external-envoy-proxy. CiliumNetworkPolicy HTTP rules are now enforced; the release gate checks GET /allowed passes and GET /denied gets a 403 from Envoy."
  artifacthub.io/images: |
    - name: cilium
      image: ghcr.io/quenchworks/images/cilium@sha256:7eac76074b4835d027999799aaaea6b99214d216fa74f694182bf09d41b25bc9
    - name: cilium-envoy
      image: ghcr.io/quenchworks/images/cilium-envoy@sha256:1257e804bf086214ea45a10aa9e1311ca40bd8920e5f96831ad6f6a861b3094e
    - name: cilium-operator
      image: ghcr.io/quenchworks/images/cilium-operator@sha256:b8150f812469d1a88be93f4eb63c956e0da9a61da84577ab4edcb2a67e7183f8
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: cilium-operator
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: cilium-operator.enabled

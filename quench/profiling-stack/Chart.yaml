apiVersion: v2
name: profiling-stack
description: "Hardened continuous profiling stack: Grafana Pyroscope (profile store and query) + Grafana with the Pyroscope datasource provisioned. Apps push CPU and memory profiles to <release>-pyroscope:4040 (Pyroscope SDKs or Grafana Alloy); explore them in Grafana via Explore -> Pyroscope. No operator, no CRDs. Every image is QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.9
appVersion: "1.0.0"
keywords:
  - profiling
  - continuous-profiling
  - pyroscope
  - flamegraph
  - grafana
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/pyroscope
  - https://github.com/grafana/grafana
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "2026-10-12 updates: grafana 13.1.7, meilisearch 1.53.3, odoo 19.0.20261012"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: pyroscope
      image: ghcr.io/quenchworks/images/pyroscope@sha256:08ab8f04e193690d7b0de76c36a190a0b2c4f4fe213e6ec4a477a2f003e08831
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:dc5f670bac19c33670a33db6f724907093e8037a5578086643bb117088db9fd7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: pyroscope
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
    condition: pyroscope.enabled
  - name: grafana
    version: 0.0.16
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

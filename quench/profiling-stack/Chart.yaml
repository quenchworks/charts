apiVersion: v2
name: profiling-stack
description: "Hardened continuous profiling stack: Grafana Pyroscope (profile store and query) + Grafana with the Pyroscope datasource provisioned. Apps push CPU and memory profiles to <release>-pyroscope:4040 (Pyroscope SDKs or Grafana Alloy); explore them in Grafana via Explore -> Pyroscope. No operator, no CRDs. Every image is QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.0.0"
keywords:
  - profiling
  - continuous-profiling
  - pyroscope
  - flamegraph
  - grafana
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/pyroscope
  - https://github.com/grafana/grafana
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "first release: Pyroscope 2.3.1 + Grafana 13.1.6"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: pyroscope
      image: ghcr.io/quenchworks/images/pyroscope@sha256:9fd3dc0ff132dd7e0ca040ecfbd178f42b8571d46b3c56ffec041a5e518696da
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:4b7e7a1342831602a31232c1dce40d8ea6a14bb44d6acb3aa095c029e1520d55
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: pyroscope
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: pyroscope.enabled
  - name: grafana
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

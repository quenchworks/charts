apiVersion: v2
name: profiling-stack
description: "Hardened continuous profiling stack: Grafana Pyroscope (profile store and query) + Grafana with the Pyroscope datasource provisioned. Apps push CPU and memory profiles to <release>-pyroscope:4040 (Pyroscope SDKs or Grafana Alloy); explore them in Grafana via Explore -> Pyroscope. No operator, no CRDs. Every image is QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.20
appVersion: "1.0.0"
keywords:
  - profiling
  - continuous-profiling
  - pyroscope
  - flamegraph
  - grafana
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/pyroscope
  - https://github.com/grafana/grafana
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: pyroscope
      image: ghcr.io/quenchworks/images/pyroscope@sha256:f3fc7ba0e464dfd88a4d4240e8c20cae408cbba65d9a17f3118dd494cf49abcf
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:5fad18f2054178ba8e6ecbc39b4a1127318060a69b2edf2ed4d2b6b312d62c88
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: pyroscope
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: pyroscope.enabled
  - name: grafana
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

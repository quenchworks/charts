# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-tracing-stack,
# OCI URL oci://ghcr.io/quenchworks/charts/tracing-stack.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # profiling-stack (oci://ghcr.io/quenchworks/charts/profiling-stack)

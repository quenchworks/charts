# Install gate: small PVC, no passwords set (Grafana's admin password is generated).
pyroscope:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
grafana:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

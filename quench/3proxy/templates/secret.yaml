apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ include "3proxy.password" . | quote }}
  3proxy.cfg: |
    {{- include "3proxy.config" . | nindent 4 }}

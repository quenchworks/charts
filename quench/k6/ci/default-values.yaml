# Install gate. No image override: uses the chart's real CI-maintained digest.
# The default script makes NO network calls, so the gate proves the k6 runtime executes a
# script and exits 0 -- without generating load against anything.
mode: job
job:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

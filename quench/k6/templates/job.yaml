{{- if eq .Values.mode "job" }}
{{/*
A Job, not a Deployment: k6 runs a script and exits. Under a Deployment it would be
restarted forever, re-running the load test in a loop against the target.

The name carries the revision so `helm upgrade` creates a NEW Job rather than trying to
patch an immutable one (Job.spec.template is immutable, so an in-place upgrade fails).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "quench-common.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- if .Values.job.helmHook }}
  annotations:
    helm.sh/hook: {{ .Values.job.helmHook }}
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "quench-common.podTemplateLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "k6.podSpec" . | nindent 6 }}
{{- end }}

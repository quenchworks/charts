apiVersion: v2
name: k6
description: "k6 -- developer-friendly load and performance testing, scripted in JavaScript. Runs as a Job (once) or CronJob (scheduled), NOT a Deployment: k6 is a CLI that runs a test and exits. Hardened, nonroot, 0-CVE image built from source on Wolfi, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "2.1.0"
kubeVersion: ">=1.23.0-0"
keywords:
  - k6
  - load-testing
  - performance
  - benchmarking
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/k6
maintainers:
  - name: mkabumattar
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: k6 2.1.0 on a hardened, nonroot, 0-CVE image, pinned by digest."
    - kind: added
      description: "Job and CronJob modes with the test script in a ConfigMap. Deliberately not a Deployment -- k6 runs a test and exits, so a Deployment would re-run the load test in a loop against the target."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: k6
      image: ghcr.io/quenchworks/images/k6@sha256:e05cde371e5d8c0a4850455e10545fc2b38ff6daa0e0c7ddfa9a735ccc69b8aa
  artifacthub.io/operator: "false"

{{- /* The password, the session secret key and (for totp) the TOTP key: generated once and read back on upgrade. The
       TOTP key is base32, as authenticator apps expect. */}}
{{- if and (has .Values.auth.type (list "password" "totp")) (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $key := get $old "secret-key" | b64dec | default (randAlphaNum 48) }}
{{- $totp := get $old "totp-key" | b64dec | default (randAlphaNum 32 | upper | replace "0" "A" | replace "1" "B" | replace "8" "C" | replace "9" "D") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  secret-key: {{ $key | b64enc | quote }}
  totp-key: {{ $totp | b64enc | quote }}
{{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/flatnotes
  digest: "sha256:0e5ccd9dc442ea3a2891bab2a5e05b735ce9042b4e592745948b892f654f7951"
  pullPolicy: IfNotPresent

nameOverride: ""

# SQLite on a ReadWriteOnce volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# FLATNOTES_AUTH_TYPE: password (default), totp (password plus a code), read_only (anyone reads, nobody edits) or none.
# Empty password: generated into the Secret <fullname> (password), kept on upgrade with the session secret key
# (secret-key) and, for totp, the TOTP key (totp-key, base32: add it to your authenticator app).
auth:
  type: password
  username: admin
  password: ""
  existingSecret: ""   # a Secret with keys "password", "secret-key" (and "totp-key") instead

# More FLATNOTES_* settings, e.g. FLATNOTES_SESSION_EXPIRY_DAYS: "30", FLATNOTES_QUICK_ACCESS_TERM: "*",
# FLATNOTES_HIDE_RECENTLY_MODIFIED: "true". FLATNOTES_PATH_PREFIX needs a writable /app/client/dist (not supported here).
settings: {}

# The notes: plain Markdown files and the search index (/data).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 1, memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# flatnotes has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: flatnotes.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [flatnotes.example.com], secretName: flatnotes-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

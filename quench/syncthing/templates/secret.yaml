{{- /* The GUI password and the REST API key, generated once and read back on upgrade. */}}
{{- if not .Values.gui.existingSecret }}
{{- $name := include "syncthing.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
{{- $pw := .Values.gui.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $key := .Values.gui.apiKey | default (get $old "api-key" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  api-key: {{ $key | b64enc | quote }}
{{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/chhoto-url
  digest: "sha256:a36f0362a0e7336aa9081d1613f9458733fde01cc30d82105ca6d2d43e20e7dc"
  pullPolicy: IfNotPresent

nameOverride: ""

# SQLite on a ReadWriteOnce volume: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The web UI password (CHHOTO_PASSWORD) and the API key (CHHOTO_API_KEY, header X-API-Key). Empty: generated into the
# Secret <fullname> (password, api-key) and kept on upgrade.
auth:
  password: ""
  apiKey: ""
  existingSecret: ""   # a Secret with keys "password" and "api-key" instead

# The public base URL short links are shown with, e.g. https://s.example.com (CHHOTO_SITE_URL).
siteUrl: ""

# More CHHOTO_* settings, e.g. CHHOTO_SLUG_STYLE: UID, CHHOTO_SLUG_LENGTH: "8", CHHOTO_PUBLIC_MODE: Enable,
# CHHOTO_REDIRECT_METHOD: TEMPORARY, CHHOTO_CUSTOM_SITE_TITLE: "My links", CHHOTO_OIDC_ISSUER_URL: ...
settings: {}

# The database volume (/var/lib/chhoto-url).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 4567
  annotations: {}
  externalTrafficPolicy: ""

# Chhoto URL has no TLS listener: terminate TLS here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: s.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [s.example.com], secretName: s-example-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

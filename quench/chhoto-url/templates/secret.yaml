{{- /* The web UI password and the API key: generated once and read back on upgrade. The API key is 64 random bytes
       as unpadded base64url, the strength Chhoto URL asks for. */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) }}
{{- $key := .Values.auth.apiKey | default (get $old "api-key" | b64dec) | default (randBytes 64 | replace "+" "-" | replace "/" "_" | trimSuffix "=" | trimSuffix "=") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  api-key: {{ $key | b64enc | quote }}
{{- end }}

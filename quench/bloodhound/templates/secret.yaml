{{- /* The default admin's password, generated once and read back on upgrade. BloodHound's password validator checks
       length and counts of lowercase, uppercase, numeric and special characters (utils/validation/
       password_validator.go), so the generated one gets a suffix covering every class. */}}
{{- if not .Values.secret.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $admin := get $old "admin-password" | b64dec | default (.Values.admin.password | default (printf "%sAa1!" (randAlphaNum 24))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
{{- end }}

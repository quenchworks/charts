apiVersion: v2
name: bloodhound
description: "BloodHound Community Edition: attack-path analysis for Active Directory and Entra ID, with the graph on the bundled PostgreSQL (pg graph driver). Hardened by QuenchWorks: built from source, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "9.10.1"
keywords:
  - bloodhound
  - active-directory
  - entra-id
  - attack-paths
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/SpecterOps/BloodHound
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned postgresql 18.7 to the rebuilt digests."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: bloodhound
      image: ghcr.io/quenchworks/images/bloodhound@sha256:c9fbc15af65cf856cbc9ae16597af47a9835b1e1950463da5ef1966369937793
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ed1112d83c0d9a14e1f23556e0c40626e310c1fe291d73065785d4a1952284e7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

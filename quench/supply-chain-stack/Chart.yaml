apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.4
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles trivy-operator=0.0.4 (module-floor rebuilds)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:fe359fcd4ff701dd2d3a49e1e2ca2fdaf70879016d8ecd27ad685d42ecfc7006
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:4033ac5e5f359739cf017a256188a8da7592edae86e452c6327dc4865a66a580
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:0ab28cbdd3d29fd73937fcc9c65aec86d5f19bcf84ab6ce0bdd2054f58ed36fd
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.74.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.4
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.23
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-10 CVE-fix lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:e37db59289d280ffd9f3cbb3bc7a285b8dbed5cac23298269c00fe30b5fafe91
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:db98cf281f8bd80bc29637d226c13d18de2c3c6801d32c9a9784bdbe8426d7c6
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:19ebe2155e363c274e8eb87514fb84564a9c423f5b303fb096b49944bcbae14b
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:7045404091e6599184c1a88f646aa61d9b63ddf75a067700f21c010a5ff0a1d7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.16
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.36
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:d9db026ec6bfd416395d9ce1d5aaa3b272bd657bf14ec81a4ea904d89de13871
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:3e927b57c5edfc14cdfeec6c80d8b30973c732023c203b18b02344e8f310e211
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:87bc1aed874376d6e22104cd6fce9aacc2aab4c20404f6cfe61794c190aab19e
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:a79a8e44a3898f51a3d8d49f8db07974529895cb29f94f3ea9b293cd4c831b98
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.9
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "trivy-operator 0.0.6: operator 0.35.0, scan Jobs on trivy-scanner 0.75.0 pinned by digest (was the unmaintained 0.74.0 tag)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:636a67e0f3a792f4b42be772e8bfc58c35973e4276044306700d481dd49b192b
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:d5c4037b5c931585adcd7d8c997f094c9b8b90e56600ed2ff0f585b1b6b48cee
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:e940e0f7ada04995870cbf650ac06a52b2840faafb7820627c32515cd794f77a
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:6e2175bd0471799e6e6aee707dedbd3ba9cff5ba3613f1c3688c958146dd5a94
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

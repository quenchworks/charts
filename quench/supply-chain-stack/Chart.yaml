apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.12
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 updates"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:ce6bde2252f81d612cac8271198772b083d962b5d4939b4a7a1b5de5c9f81378
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:924a275fd41f0e83a6cfdac29eea1587ebc88fc91d400e9c766bc9601b1f986c
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:4020b41d9252405572983d79e6aa3eacf854de981e08c049a78f79c0cac2d5d2
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:6e2175bd0471799e6e6aee707dedbd3ba9cff5ba3613f1c3688c958146dd5a94
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

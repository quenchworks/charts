apiVersion: v2
name: supply-chain-stack
description: "Admission-time supply-chain control: Kyverno admits only QuenchWorks images signed by the QuenchWorks build workflows (cosign keyless, checked against Sigstore) in the namespaces you label, and trivy-operator scans what runs. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.40
appVersion: "1.0.0"
keywords:
  - kyverno
  - trivy-operator
  - cosign
  - sigstore
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
  - https://github.com/aquasecurity/trivy-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pin kubectl (1.37.2-r5, otel 1.47), ingress-nginx and mastodon (puma 8.0.3) to the rebuilt digests"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:d9db026ec6bfd416395d9ce1d5aaa3b272bd657bf14ec81a4ea904d89de13871
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:a062ea1a6f293ec4633bef38d4a8275dda52952e19beaa661e24ec0a46194a6a
    - name: trivy-operator
      image: ghcr.io/quenchworks/images/trivy-operator@sha256:2e2fd7fefbb93d700bffe4c2e784a13fa4aeee67822205e2bc54017e97abb7b1
    - name: trivy-scanner
      image: ghcr.io/quenchworks/images/trivy-scanner:0.75.0@sha256:b479985eab97b44d6459153f0f32725a986b47588b320a9bc10be6d1b590abc9
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: kyverno
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: kyverno.enabled
  - name: trivy-operator
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
    condition: trivy-operator.enabled

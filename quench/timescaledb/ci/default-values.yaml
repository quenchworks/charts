# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
auth:
  enabled: true
  password: ci-timescaledb-pass
  database: qwapp
primary:
  persistence:
    enabled: true
    size: 1Gi
# exercise the metrics sidecar in the gate (uses the chart's real exporter digest)
metrics:
  enabled: true

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      {{- if ne .Values.architecture "replication" }}
      app.kubernetes.io/component: primary
      {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: timescaledb
          protocol: TCP
        {{- if eq .Values.architecture "replication" }}
        # Patroni REST API — peers exchange health + failover state on 8008.
        - port: patroni
          protocol: TCP
        {{- end }}
        {{- if .Values.metrics.enabled }}
        # The metrics sidecar's scrape port. Without this, enabling metrics while
        # networkPolicy stays on (both are defaults) leaves Prometheus unable to
        # reach the exporter -- the sidecar runs, serves, and is simply unreachable.
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}

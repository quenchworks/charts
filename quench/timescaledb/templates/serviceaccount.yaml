{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "timescaledb.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq .Values.architecture "replication" }}
# Patroni (HA mode) talks to the Kubernetes API for leader election and pod labeling.
automountServiceAccountToken: true
{{- else }}
# the standalone database pod does not call the Kubernetes API
automountServiceAccountToken: false
{{- end }}
{{- end }}

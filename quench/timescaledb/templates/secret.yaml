{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing -}}
{{- $pw = index $existing.data "postgres-password" | b64dec -}}
{{- end -}}
{{- if not $pw -}}
{{- $pw = randAlphaNum 24 -}}
{{- end -}}
{{- $repl := "" -}}
{{- if eq .Values.architecture "replication" -}}
{{- if and $existing (index $existing.data "replication-password") -}}
{{- $repl = index $existing.data "replication-password" | b64dec -}}
{{- else -}}
{{- $repl = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $pw | b64enc | quote }}
  {{- if eq .Values.architecture "replication" }}
  # Streaming-replication user password (Patroni). Persisted so re-renders are stable.
  replication-password: {{ $repl | b64enc | quote }}
  {{- end }}
{{- end }}

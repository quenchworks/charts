# The digest below is the contract with the image factory. CI rewrites it on the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kafka
  digest: "sha256:8d5df34d215d2cba044ff42e6362a92dc860dbd6d495025e9b196caae36e688d"
  pullPolicy: IfNotPresent

nameOverride: ""

# Number of brokers. KRaft runs each pod as a combined controller+broker, so this
# is both the broker count and the controller quorum size. Use an odd number (3 or 5)
# so the controller quorum has a clear majority; 3 is the smallest HA cluster.
replicaCount: 3

# Multi-broker KRaft cluster (combined controller + broker, no Zookeeper). The image
# builds server.properties from these at boot and formats KRaft storage. Each pod
# derives its node.id from its StatefulSet ordinal and advertises its own headless
# DNS name; the controller quorum voters are the full set of pods. The listener is
# PLAINTEXT and reachable only inside the cluster (the NetworkPolicy restricts ingress
# to the namespace) unless tls.enabled; SASL auth is a tracked follow-up.
kraft:
  # combined roles keep 3 nodes simple: every pod is both a controller and a broker
  processRoles: "broker,controller"
  autoCreateTopics: true
  numPartitions: 3
  # HA replication defaults: survive one broker loss without data loss.
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  offsetsTopicReplicationFactor: 3
  transactionStateLogReplicationFactor: 3
  transactionStateLogMinIsr: 2
  # Cluster id shared by all brokers. Left empty, the chart generates one on first
  # install and stores it in a Secret, so upgrades keep the same id (a changed id
  # would refuse to start against already-formatted log dirs). Set a fixed value to
  # pin it.
  clusterId: ""
  heapOpts: "-Xmx1G -Xms1G"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  port: 9092

# Native TLS: the client listener (9092) and the KRaft controller quorum (9093) both speak
# SSL, with no plaintext listener left. Clients set security.protocol=SSL and trust ca.crt
# from the TLS Secret. A busybox init container writes the PKCS#8 key Kafka's PEM keystore
# needs. The certificate comes from the first source set: existingSecret (must carry
# ca.crt), then a cert-manager Certificate, else a Helm-generated CA + certificate.
# Turning TLS on or off in a running cluster: a rolling restart strands the first switched
# broker outside the quorum, so after the upgrade restart every broker at once
# (kubectl delete pod -l app.kubernetes.io/instance=<release>). Data on the PVCs is kept.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
busybox:
  repository: ghcr.io/quenchworks/images/busybox
  digest: "sha256:041302c8da3a2e182ecc2eac3c56c4f47a13c03cc284d255489c0be741893b64"
  pullPolicy: IfNotPresent

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
# Left empty, the chart applies a soft podAntiAffinity so brokers spread across
# nodes when possible (works on a single-node kind cluster too). Set this to a full
# affinity block to override, e.g. a required anti-affinity for a real multi-node cluster.
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

# Keep the controller quorum above majority during a voluntary drain: with 3 brokers
# minAvailable 2 permits one at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

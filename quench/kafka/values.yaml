# The digest below is the contract with the image factory. CI rewrites it on the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kafka
  digest: "sha256:d52b0d2f11d29b40c1bdf22500c1ea769a89ce0c77783170403f4e2b84145661"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-node KRaft broker (combined controller + broker, no Zookeeper). The image
# builds server.properties from these at boot. The listener is PLAINTEXT and reachable
# only inside the cluster (the NetworkPolicy restricts ingress to the namespace);
# SASL/TLS auth and multi-node clustering are tracked follow-ups.
kraft:
  nodeId: 1
  autoCreateTopics: true
  numPartitions: 1
  # single node, so the internal topics replicate once
  offsetsTopicReplicationFactor: 1
  transactionStateLogReplicationFactor: 1
  transactionStateLogMinIsr: 1
  # set a fixed cluster id for reproducibility, or leave empty to generate + persist
  clusterId: ""
  heapOpts: "-Xmx1G -Xms1G"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  port: 9092

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

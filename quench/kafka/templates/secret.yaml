{{- /*
   Shared KRaft cluster id. All brokers must format their log dirs with the SAME id or
   they refuse to join one cluster. Generated once and stored here so upgrades reuse it
   (lookup finds the existing Secret); a user-set kraft.clusterId always wins. A Kafka
   cluster id is a 22-char base64url string (16 bytes) — randAlphaNum stays in that
   alphabet and decodes cleanly.
*/ -}}
{{- $name := printf "%s-cluster-id" (include "quench-common.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $cid := "" -}}
{{- if .Values.kraft.clusterId -}}
{{- $cid = .Values.kraft.clusterId -}}
{{- else if and $existing $existing.data (index $existing.data "cluster-id") -}}
{{- $cid = index $existing.data "cluster-id" | b64dec -}}
{{- else -}}
{{- $cid = randAlphaNum 22 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  cluster-id: {{ $cid | b64enc | quote }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
  ingress:
    # client + inter-broker replication on the client listener (9092)
    - ports:
        - port: kafka
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    # KRaft controller quorum between brokers (9093) — always namespace-internal,
    # restricted to the broker pods. Without this the quorum can't form.
    - ports:
        - port: controller
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "quench-common.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: primary
{{- end }}

# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-code-server, OCI URL oci://ghcr.io/quenchworks/charts/code-server.
# Placeholder repositoryID: the ArtifactHub API is flaky; the main loop backfills
# the real ID and the release guard skips the metadata push while this is a placeholder.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # code-server (oci://ghcr.io/quenchworks/charts/code-server)
owners:

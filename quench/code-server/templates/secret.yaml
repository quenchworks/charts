{{/*
The managed Secret carries the code-server login password under the `password` key.
It is injected into the container as the PASSWORD env via secretKeyRef, so the
password never appears in the pod's argv / process list. Resolution order:
explicit auth.password -> this Secret's prior value (stable across upgrades) ->
a fresh 24-char random. Skipped entirely when auth.existingSecret is set — the
referenced Secret must then supply the password under auth.existingSecretKey.
*/}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}

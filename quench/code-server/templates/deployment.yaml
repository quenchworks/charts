{{/* code-server serves an unauthenticated /healthz that returns 200 once the HTTP
     server is up — used for liveness + readiness. The editor itself is behind the
     PASSWORD login. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $port := ternary "https" "http" (eq $tls "true") -}}
{{- $scheme := ternary "HTTPS" "HTTP" (eq $tls "true") -}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" $port "scheme" $scheme) "initialDelaySeconds" 10 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/healthz" "port" $port "scheme" $scheme) "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: 1
  # RWO PVC + single writer: never run two pods at once, and replace (don't overlap)
  # on rollout so the volume is released before the new pod claims it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "code-server.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: code-server
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- if or .Values.extraArgs $tls }}
          args:
            {{- if $tls }}
            # Native TLS: nonroot cannot bind 443, so code-server serves HTTPS on 8443
            # (overriding the image's --bind-addr) and the Service maps it to 443.
            - --bind-addr
            - 0.0.0.0:8443
            - --cert
            - /tls/tls.crt
            - --cert-key
            - /tls/tls.key
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            # code-server's default --auth password reads the login password from PASSWORD.
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "code-server.secretName" . }}
                  key: {{ .Values.auth.existingSecretKey | default "password" }}
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: {{ $port }}
              containerPort: {{ ternary 8443 8080 (eq $tls "true") }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            # read-only rootfs: VS Code / node write scratch to the OS temp dir
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: data
        {{- if not .Values.persistence.enabled }}
          emptyDir: {}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "code-server.pvcName" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

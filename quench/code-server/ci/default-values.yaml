# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A dummy PASSWORD is set so the login page renders and the pod reaches Ready
# without waiting on a randomly-generated secret being surfaced.
auth:
  password: "ci-smoke-password"
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "2", memory: 2Gi }

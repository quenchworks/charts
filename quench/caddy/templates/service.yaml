apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    # admin API: in-cluster only. Used for probes and runtime config.
    - port: {{ .Values.service.adminPort }}
      targetPort: admin
      name: admin
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

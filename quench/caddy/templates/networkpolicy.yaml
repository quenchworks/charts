{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # http + https are reachable per allowExternal; the admin API (2019) is only
    # ever reachable from within the namespace.
    - ports:
        - port: http
          protocol: TCP
        - port: https
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    - ports:
        - port: admin
          protocol: TCP
      from:
        - podSelector: {}
{{- end }}

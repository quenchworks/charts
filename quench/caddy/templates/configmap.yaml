{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caddy.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted read-only at /etc/caddy/Caddyfile and loaded by the entrypoint
  # (`caddy run --config /etc/caddy/Caddyfile`).
  Caddyfile: |-
    {{- .Values.config.caddyfile | nindent 4 }}
{{- end }}

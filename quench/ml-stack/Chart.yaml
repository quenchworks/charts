apiVersion: v2
name: ml-stack
description: "Hardened machine-learning stack: JupyterHub notebooks, the MLflow tracking server and model registry, and Label Studio for data labeling, wired together in one install. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.38
appVersion: "1.0.0"
keywords:
  - mlflow
  - jupyterhub
  - label-studio
  - mlops
  - machine-learning
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mlflow/mlflow
  - https://github.com/jupyterhub/jupyterhub
  - https://github.com/HumanSignal/label-studio
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: mlflow
      image: ghcr.io/quenchworks/images/mlflow@sha256:36346d94efd4de074893a905e6681cdc7145a4c1c72027861e582deb040e9875
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:9c4478f8925ca6e4098ef00966036e933f93c54185b38281f74f5ab02208aa0b
    - name: jupyterhub
      image: ghcr.io/quenchworks/images/jupyterhub@sha256:a4a9065a1fb75a73781e97dfcdaad18128c5cc2545e027254b5f9c8d0c9c7ea7
    - name: configurable-http-proxy
      image: ghcr.io/quenchworks/images/configurable-http-proxy@sha256:68efb3a9632a100b7842a0141e725d9e2548db1e46f1c5d39c49e4279dec2a9e
    - name: label-studio
      image: ghcr.io/quenchworks/images/label-studio@sha256:e79989bea1790744e02187a2ef01c61db022ec26cc864cae214e661016dffd7b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mlflow
    version: 0.0.44
    repository: oci://ghcr.io/quenchworks/charts
    condition: mlflow.enabled
  - name: jupyterhub
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: jupyterhub.enabled
  - name: label-studio
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: label-studio.enabled

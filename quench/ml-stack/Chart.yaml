apiVersion: v2
name: ml-stack
description: "Hardened machine-learning stack: JupyterHub notebooks, the MLflow tracking server and model registry, and Label Studio for data labeling, wired together in one install. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "1.0.0"
keywords:
  - mlflow
  - jupyterhub
  - label-studio
  - mlops
  - machine-learning
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mlflow/mlflow
  - https://github.com/jupyterhub/jupyterhub
  - https://github.com/HumanSignal/label-studio
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "2026-10-04 security rebuilds: vm2, gitea runner, jackson-core, OpenSSL 4, basic-ftp, Wolfi python/pip/npm"
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: mlflow
      image: ghcr.io/quenchworks/images/mlflow@sha256:c876588c0f061cee2ff056499cdd79a7b96ae27b559ee2a70bd7860a25de9f01
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:48aebfed6b703fc2e8582aff8382063ea6c06b62d8b735e1b13da306182d1f50
    - name: jupyterhub
      image: ghcr.io/quenchworks/images/jupyterhub@sha256:b985a13f9584c03f9c1be97e14f0749059c9dbf7d60c797d62a9953646483861
    - name: configurable-http-proxy
      image: ghcr.io/quenchworks/images/configurable-http-proxy@sha256:3a0fc43f02e95cb78ff77327fc78400b4da0ec1a34c003e513b1f3b435c99a23
    - name: label-studio
      image: ghcr.io/quenchworks/images/label-studio@sha256:abcc901fe0e7511eee6937993ad2ed9fa942c75fce14797a4cba9426f4e5b810
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mlflow
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: mlflow.enabled
  - name: jupyterhub
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: jupyterhub.enabled
  - name: label-studio
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: label-studio.enabled

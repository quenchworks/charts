# Install gate on kind: small volumes and fixed credentials, except mlflow's DB password,
# which is left to the PostgreSQL chart to generate (the default install path).
mlflow:
  postgresql:
    primary:
      persistence:
        size: 1Gi
  persistence:
    size: 1Gi
jupyterhub:
  auth:
    password: quench-ci-password
    adminPassword: quench-ci-admin-password-32-characters-long
  hub:
    persistence:
      enabled: false
  singleuser:
    storage:
      enabled: false
label-studio:
  admin:
    password: ci-admin-password
  persistence:
    size: 1Gi

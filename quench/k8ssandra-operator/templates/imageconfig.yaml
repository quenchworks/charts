# Upstream cass-operator image config (k8ssandra-operator v1.34.0), read by both operators from the
# ConfigMap labelled k8ssandra.io/config=image in their own namespace. Cassandra pods run k8ssandra's
# management-api images from here; override them with imageConfig.
{{- if .Values.imageConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cass-operator-image-config
  labels:
    k8ssandra.io/config: image
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  image_config.yaml: |
    {{- .Values.imageConfig | nindent 4 }}
{{- end }}

{{- /* Upstream RBAC for both operators (k8ssandra-operator v1.34.0 config/deployments/control-plane/cluster-scope,
     rendered with kubectl kustomize), namespace templated. Cluster-scoped names stay upstream: one install per cluster. */ -}}

apiVersion: v2
name: k8ssandra-operator
description: "K8ssandra Operator: run Apache Cassandra clusters from K8ssandraCluster resources, with Medusa backups, Reaper repairs and Stargate, on top of cass-operator. Both operators and their CRDs ship with the chart. Hardened by QuenchWorks: the operators are built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.34.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - cassandra
  - k8ssandra
  - cass-operator
  - database
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/k8ssandra/k8ssandra-operator
  - https://github.com/k8ssandra/cass-operator
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: K8ssandra Operator 1.34.0 with cass-operator 1.33.1, CRDs, and chart-generated webhook certificates (no cert-manager)"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |

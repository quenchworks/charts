# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/opengist
  digest: "sha256:fded289c679fc1c782c0ff7b3ffc46473c3179ff2cb924488607240a3bd22acf"
  pullPolicy: IfNotPresent

nameOverride: ""

# Opengist keeps its SQLite database, the gist repositories and its SSH host key in /opengist:
# run one replica (Recreate with the volume).
replicaCount: 1
updateStrategy:
  type: Recreate

# The admin, seeded by an init container with `opengist admin create-user` (a no-op once the
# user exists). Empty password: generated into a Secret and kept across upgrades
# (kubectl get secret <release>-opengist-admin -o jsonpath='{.data.password}').
admin:
  username: admin
  password: ""
  existingSecret: ""   # a Secret with key "password" instead

# SQLite on the data volume (default). For PostgreSQL or MySQL, name a Secret holding OG_DB_URI,
# e.g. postgres://opengist:<pw>@db:5432/opengist or mysql://opengist:<pw>@db:3306/opengist
database:
  existingSecret: ""
  uriKey: uri

# Git over SSH on 2222 (the Service exposes it on ssh.servicePort).
ssh:
  enabled: true
  servicePort: 2222

# More Opengist settings as OG_* environment variables (https://opengist.io/docs/configuration),
# e.g. OG_EXTERNAL_URL: https://gist.example.com
settings: {}

# The data volume: database, repositories, SSH host key.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

service:
  type: ClusterIP
  port: 6157
  annotations: {}
  externalTrafficPolicy: ""

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# metrics only: cloudflared takes no inbound traffic
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-metrics
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

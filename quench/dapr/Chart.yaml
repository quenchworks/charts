apiVersion: v2
name: dapr
description: "Dapr, the distributed application runtime: the control plane (operator, placement, sentry, sidecar injector, scheduler) and the injected daprd sidecar, all from one hardened QuenchWorks image. Upstream's Dapr chart with every image pinned by digest; nonroot, 0-CVE, cosign-signed."
type: application
version: 0.0.11
appVersion: "1.18.10"
keywords:
  - dapr
  - microservices
  - sidecar
  - pubsub
  - actors
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/dapr/dapr
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-10 CVE-fix lock"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: dapr
      image: ghcr.io/quenchworks/images/dapr@sha256:6caff344ba7e770a937b299ee4a1b71e0b631b8547f3ceab59ac78fb372894fb
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
    - name: upstream chart
      url: https://github.com/dapr/dapr/tree/master/charts/dapr
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: dapr
    version: 1.18.4
    repository: https://dapr.github.io/helm-charts/

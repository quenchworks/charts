# Quenchworks Dapr: upstream's Dapr chart (a dependency, same version as the image) with
# every control-plane component and the injected daprd sidecar on the QuenchWorks dapr
# image (daprd and the control-plane binaries in one image, 0-CVE, cosign-signed,
# pinned by digest). Upstream's templates take a full image reference when the name
# contains a "/", so the digest goes in each image.name. Every other upstream value is
# available under dapr: (see https://docs.dapr.io/operations/hosting/kubernetes/).
quenchworksImage: &image "ghcr.io/quenchworks/images/dapr@sha256:f4832b3ed3ebfbd453ae2874413b1c44016b91a2a17e515e86ffe15e7e61d739"

dapr:
  global:
    logAsJson: true
  dapr_operator:
    image: { name: *image }
  dapr_placement:
    image: { name: *image }
  dapr_sentry:
    image: { name: *image }
  dapr_scheduler:
    image: { name: *image }
  dapr_sidecar_injector:
    # image is the daprd sidecar it injects; injectorImage is the injector itself
    image: { name: *image }
    injectorImage: { name: *image }

{{- if and (eq .Values.architecture "replicaset") (not .Values.ha.existingKeyFileSecret) }}
{{/*
Shared keyFile for replica-set internal (intra-member) auth. mongod requires a
keyFile whenever a replica set enforces access control. Content is a base64-safe
string 6-1024 chars; alphanumeric is a valid subset. Reuse an existing value on
upgrade so members do not get a fresh (mismatched) key and lose internal auth.
*/}}
{{- $name := include "mongodb.keyFileSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $kf := .Values.ha.keyFile -}}
{{- if and (not $kf) $existing -}}
{{- $kf = index $existing.data "mongodb-keyfile" | b64dec -}}
{{- end -}}
{{- if not $kf -}}
{{- $kf = randAlphaNum 756 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  mongodb-keyfile: {{ $kf | b64enc | quote }}
{{- end }}

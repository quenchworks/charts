# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
auth:
  enabled: true
  rootPassword: gatepw        # known root password so the gate can authenticate over the wire
primary:
  persistence:
    enabled: false            # emptyDir for the kind gate
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# Gate the metrics sidecar too: 0-CVE is not proof it starts and serves /metrics.
metrics:
  enabled: true

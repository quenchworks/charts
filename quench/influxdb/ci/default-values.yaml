# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
auth:
  setup: true
  username: admin
  password: "ci-test-password"
  org: quench
  bucket: default
  adminToken: "ci-test-admin-token-0123456789"

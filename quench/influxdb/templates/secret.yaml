{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.password -}}
{{- if and (not $pw) $existing -}}
{{- $pw = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $pw -}}
{{- $pw = randAlphaNum 24 -}}
{{- end -}}
{{- $token := .Values.auth.adminToken -}}
{{- if and (not $token) $existing -}}
{{- $token = index $existing.data "admin-token" | b64dec -}}
{{- end -}}
{{- if not $token -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  admin-token: {{ $token | b64enc | quote }}
{{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# manifests/redis.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/redis
  digest: "sha256:cda19af7491d05b63de6cad2fcdc3f7b9dc7bb4a15fdc1a387b5e6c0dade2259"
  pullPolicy: IfNotPresent

nameOverride: ""

# Hardened busybox helper image, used ONLY by init containers in HA mode (to seed
# Sentinel's writable config and run boot-time master discovery). This keeps the
# redis image itself shell-free. Pinned by digest, never a tag.
busybox:
  repository: ghcr.io/quenchworks/images/busybox
  digest: "sha256:379b162cd4794ee14c63fec0cc501b855b804f33f824c4e46ced6183f644adfe"
  pullPolicy: IfNotPresent

# standalone: one server. replication: one primary plus N read replicas (replicaof).
architecture: standalone

# HA / automatic failover via a Redis Sentinel quorum. Requires
# architecture: replication. When enabled, 3 Sentinels monitor the primary and
# auto-promote a replica on primary loss; clients discover the current master
# with `SENTINEL get-master-addr-by-name <masterSet>` against the sentinel Service.
# The redis containers stay shell-free: config seeding + master discovery run in
# init containers on the `busybox` helper image (above), writing into an emptyDir.
sentinel:
  enabled: false
  replicaCount: 3
  masterSet: mymaster
  # Sentinels agreeing the primary is down before failover. Keep a strict
  # majority of replicaCount (2 of 3).
  quorum: 2
  port: 26379
  downAfterMilliseconds: 5000
  failoverTimeout: 180000
  parallelSyncs: 1
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Authentication. On by default. A random password is generated if you do not set one.
auth:
  enabled: true
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

# Extra redis.conf lines and flags. config is rendered into a ConfigMap; existingConfigmap
# takes precedence when set. extraFlags are appended to the server command.
config: |
  appendonly yes
  save 900 1
  save 300 10
existingConfigmap: ""
extraFlags: []

# In-transit TLS. Provide a secret with tls.crt, tls.key, and ca.crt.
tls:
  enabled: false
  existingSecret: ""
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt
  authClients: true

primary:
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 6379

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# Prometheus metrics via a hardened redis_exporter sidecar, built by our own factory.
metrics:
  enabled: false
  image:
    repository: ghcr.io/quenchworks/images/redis-exporter
    digest: "sha256:41655ee4573807859c2d4fbc9ef5655961ed80cb66434376fc8369f467f7240d"
    pullPolicy: IfNotPresent
  port: 9121
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

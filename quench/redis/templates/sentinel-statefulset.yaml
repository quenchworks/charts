{{- if and (eq .Values.architecture "replication") .Values.sentinel.enabled }}
{{- $s := .Values.sentinel }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.sentinel.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: sentinel
spec:
  serviceName: {{ printf "%s-headless" (include "redis.sentinel.fullname" .) }}
  replicas: {{ $s.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sentinel
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "redis.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- if not .Values.affinity }}
      affinity:
        {{- include "redis.defaultAntiAffinity" (dict "root" . "component" "sentinel") | nindent 8 }}
      {{- end }}
      initContainers:
        # Generate the (writable) sentinel config: resolve the bootstrap primary
        # to an IP, seed the monitor + auth. Runs in the busybox helper image so
        # the redis/redis-sentinel image stays shell-free.
        - name: init-config
          image: {{ include "redis.busyboxImage" . }}
          imagePullPolicy: {{ .Values.busybox.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["sh", "/scripts/init-sentinel.sh"]
          env:
            - name: PRIMARY_HOST
              value: {{ include "redis.primary.bootstrapHost" . | quote }}
            - name: SENTINEL_PORT
              value: {{ $s.port | quote }}
            - name: MASTER_SET
              value: {{ $s.masterSet | quote }}
            - name: QUORUM
              value: {{ $s.quorum | quote }}
            - name: DOWN_AFTER
              value: {{ $s.downAfterMilliseconds | quote }}
            - name: FAILOVER_TIMEOUT
              value: {{ $s.failoverTimeout | quote }}
            - name: PARALLEL_SYNCS
              value: {{ $s.parallelSyncs | quote }}
            {{- if .Values.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis.secretName" . }}
                  key: {{ include "redis.secretPasswordKey" . }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: sentinel-data
              mountPath: /sentinel
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: sentinel
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["redis-sentinel", "/sentinel/sentinel.conf"]
          ports:
            - name: sentinel
              containerPort: {{ $s.port }}
          livenessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            {{- if .Values.tls.enabled }}
            tcpSocket:
              port: sentinel
            {{- else }}
            exec:
              command: ["redis-cli", "-p", "{{ $s.port }}", "ping"]
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: sentinel-data
              mountPath: /sentinel
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/redis/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ printf "%s-scripts" (include "redis.sentinel.fullname" .) }}
            defaultMode: 0555
        - name: sentinel-data
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "redis.tls.secretName" . }}
        {{- end }}
{{- end }}

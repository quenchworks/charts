apiVersion: v2
name: hydra
description: "OAuth2 / OpenID Connect server (Ory Hydra) — a certified, standards-compliant token and consent service that sits in front of your own login UI. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.24
appVersion: "26.2.0"
keywords:
  - hydra
  - ory
  - oauth2
  - oidc
  - identity
  - iam
  - sso
  - authentication
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/hydra
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: hydra
      image: ghcr.io/quenchworks/images/hydra@sha256:b4c85f0851df846b2a0f3c208a5a4f57ed355f31b377a29c85320f947159270e
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |

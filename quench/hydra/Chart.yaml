apiVersion: v2
name: hydra
description: "OAuth2 / OpenID Connect server (Ory Hydra) — a certified, standards-compliant token and consent service that sits in front of your own login UI. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.2
appVersion: "26.2.0"
keywords:
  - hydra
  - ory
  - oauth2
  - oidc
  - identity
  - iam
  - sso
  - authentication
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/hydra
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bumped the bundled postgresql subchart to 0.0.19, which pins the rebuilt PostgreSQL 18.6 image that ships the uuid-ossp extension."
  # ArtifactHub category enum: ai-machine-learning, database, integration-delivery,
  # monitoring-logging, networking, security, skip-prediction, storage,
  # streaming-messaging. An OAuth2/OIDC server fits "security".
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: hydra
      image: ghcr.io/quenchworks/images/hydra@sha256:ffaf6629b97b9c5630a91415c6b58723ae628f0b86522a60ae318e17efffdfd4
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.19
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

    - kind: changed
      description: "Rebuilt images (2026-10-11 CVE wave)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: hydra
      image: ghcr.io/quenchworks/images/hydra@sha256:a8b0e7b42c7a7a9f58230387f1071563a725fd9869659b49cab9f391a3ca5ae7
    - name: postgresql

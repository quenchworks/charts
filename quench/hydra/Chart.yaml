    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-01 wave lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: hydra
      image: ghcr.io/quenchworks/images/hydra@sha256:c4921afe5ebf082f7c382af6a737b82eeb2b5ff1e53305a378dafa7dad4d1986
    - name: postgresql

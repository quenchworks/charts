{{/*
The managed Secret carries:
  - dsn            : the full PostgreSQL DSN Hydra reads via the DSN env var,
                      assembled from host/port/db/user + the resolved password.
                      Keeping the whole DSN in the Secret avoids a plaintext
                      password in the pod spec.
  - secrets-system : SECRETS_SYSTEM, used to encrypt/sign cookies and session
                      data. Must be identical across every replica, so it is
                      generated once (32 chars) and preserved across upgrades.

When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart
renders no Secret at all -- the referenced Secret must supply both keys itself
(see externalDatabase.existingSecretDsnKey / existingSecretSecretsSystemKey).
*/}}
{{- if include "hydra.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- DB password ---- */}}
{{- $dbpw := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbpw = .Values.postgresql.auth.password -}}
{{- else -}}
{{- $dbpw = .Values.externalDatabase.password -}}
{{- end -}}
{{- if and (not $dbpw) $existing -}}
{{- $pgSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name) -}}
{{- if $pgSecret -}}{{- $dbpw = index $pgSecret.data "postgres-password" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end -}}
{{- $host := include "hydra.db.host" . -}}
{{- $port := include "hydra.db.port" . -}}
{{- $db := include "hydra.db.name" . -}}
{{- $user := include "hydra.db.user" . -}}
{{- $sslMode := include "hydra.db.sslMode" . -}}
{{- $dsn := printf "postgres://%s:%s@%s:%s/%s?sslmode=%s&max_conn_lifetime=10m" $user $dbpw $host $port $db $sslMode -}}

{{/* ---- system secret (min 16 chars; 32 here) ---- */}}
{{- $secretsSystem := .Values.secretsSystem -}}
{{- if and (not $secretsSystem) $existing -}}
{{- $secretsSystem = index $existing.data "secrets-system" | default "" | b64dec -}}
{{- end -}}
{{- if not $secretsSystem -}}
{{- $secretsSystem = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  dsn: {{ $dsn | b64enc | quote }}
  secrets-system: {{ $secretsSystem | b64enc | quote }}
{{- end }}

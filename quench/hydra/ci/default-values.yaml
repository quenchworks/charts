# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Bundles the Quenchworks PostgreSQL subchart with persistence off and small
# resources for a quick boot on the runner. The gate confirms Hydra's migrate
# initContainer creates the schema, the server connects to PostgreSQL, and
# /health/ready (Admin API) returns 200 -- i.e. it is actually serving.
postgresql:
  enabled: true
  auth:
    username: hydrauser
    password: ci-test-password
    database: hydra
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

secretsSystem: "ci-test-secrets-system-needs-32-characters"

migrate:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

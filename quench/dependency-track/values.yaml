# Quenchworks OWASP Dependency-Track: the API server and the web UI (both QuenchWorks
# images, 0-CVE, cosign-signed, pinned by digest) and a bundled PostgreSQL.
image:
  repository: ghcr.io/quenchworks/images/dependency-track
  digest: "sha256:860d212cc319acda8911040d5d7f1e2541c3133e0917d9557d3a5db1f58f5970"
  pullPolicy: IfNotPresent

frontend:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/dependency-track-frontend
    digest: "sha256:7aa1f95a94dc5429b1599f3ff3a71754f9622c8506a5e5b3ab2c0acbc261d201"
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

apiServer:
  # Extra JVM flags, appended to the image's defaults (G1, MaxRAMPercentage=80).
  extraJavaOptions: ""
  # Extra DT_* settings as env vars, e.g. [{name: DT_LOGGING_LEVEL, value: DEBUG}].
  extraEnv: []
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

# One Service for users: the UI, with /api proxied to the API server.
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Bundled PostgreSQL (the QuenchWorks postgresql chart). The API server reads the
# password from the Secret that chart generates (<release>-postgresql).
postgresql:
  enabled: true
  auth:
    # the bundled image creates auth.database only when it differs from the superuser
    username: postgres
    database: dtrack
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Used when postgresql.enabled=false.
externalDatabase:
  # jdbc:postgresql://host:5432/dtrack
  url: ""
  username: dtrack
  existingSecret: ""
  existingSecretPasswordKey: password

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
containerSecurityContext: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dtrack.api" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # one API server: its schedulers and caches are not built for several replicas
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The API server exits on a refused database connection instead of retrying,
        # so hold it until PostgreSQL accepts connections.
        - name: wait-for-db
          image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              hp={{ include "dtrack.db.hostport" . | quote }}
              until pg_isready -h "${hp%:*}" -p "${hp##*:}" -t 3; do sleep 2; done
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DT_DATASOURCE_URL
              value: {{ include "dtrack.db.url" . | quote }}
            - name: DT_DATASOURCE_USERNAME
              value: {{ include "dtrack.db.user" . | quote }}
            - name: DT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dtrack.db.secret" . }}
                  key: {{ include "dtrack.db.secretKey" . }}
            # the image's defaults, since setting the variable replaces them
            - name: JDK_JAVA_OPTIONS
              value: {{ printf "-XX:+UseG1GC -XX:+UseStringDeduplication -XX:+UseCompactObjectHeaders -XX:MaxGCPauseMillis=250 -XX:MaxRAMPercentage=80.0 %s" .Values.apiServer.extraJavaOptions | trim | quote }}
            {{- with .Values.apiServer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # first start runs the schema migrations
          startupProbe:
            httpGet: { path: /health, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: management }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # everything durable is in PostgreSQL; /data holds caches and working files
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dtrack.api" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

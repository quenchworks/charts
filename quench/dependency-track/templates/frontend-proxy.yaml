{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dtrack.frontend" . }}-proxy
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # included inside the image's nginx server block: the UI calls the API on its own
  # origin (config.json API_BASE_URL is empty), so /api goes to the API server
  api.conf: |
    location /api/ {
        proxy_pass http://{{ include "dtrack.api" . }}.{{ .Release.Namespace }}.svc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
{{- end }}

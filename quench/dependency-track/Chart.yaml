apiVersion: v2
name: dependency-track
description: "OWASP Dependency-Track, the SBOM analysis platform: the API server, the web UI behind one address, and a bundled PostgreSQL. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.22
appVersion: "5.1.2"
keywords:
  - dependency-track
  - sbom
  - cyclonedx
  - vulnerability
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/DependencyTrack/dependency-track
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles postgresql=0.0.35 (2026-11-13 update round)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: dependency-track
      image: ghcr.io/quenchworks/images/dependency-track@sha256:3a37bc3a8497df147e9ff4485c7f0af08c780f1fee2919c48a1b8a19f6dfe6ea
    - name: dependency-track-frontend
      image: ghcr.io/quenchworks/images/dependency-track-frontend@sha256:dd976193e2332bac91a162a7ee3ee313002f49afdb67d79bd89014ed265e71a6
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

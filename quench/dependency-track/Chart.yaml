apiVersion: v2
name: dependency-track
description: "OWASP Dependency-Track, the SBOM analysis platform: the API server, the web UI behind one address, and a bundled PostgreSQL. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.10
appVersion: "5.1.2"
keywords:
  - dependency-track
  - sbom
  - cyclonedx
  - vulnerability
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/DependencyTrack/dependency-track
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles postgresql=0.0.28 (2026-10-11 CVE wave)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: dependency-track
      image: ghcr.io/quenchworks/images/dependency-track@sha256:a013ed7ca94ca5ddf502e8251dbdbfeb2ee71d6ce6abb16ab0bc49d7f8abc208
    - name: dependency-track-frontend
      image: ghcr.io/quenchworks/images/dependency-track-frontend@sha256:2f3b7dcb6fdc685bb548f3bfd84c48fc3b6748c0c538e6b431c06b1b3c112888
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:48aebfed6b703fc2e8582aff8382063ea6c06b62d8b735e1b13da306182d1f50
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.28
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

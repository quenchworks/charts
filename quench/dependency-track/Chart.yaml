apiVersion: v2
name: dependency-track
description: "OWASP Dependency-Track, the SBOM analysis platform: the API server, the web UI behind one address, and a bundled PostgreSQL. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.28
appVersion: "5.1.2"
keywords:
  - dependency-track
  - sbom
  - cyclonedx
  - vulnerability
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/DependencyTrack/dependency-track
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned dependency-track-frontend to its rebuild with the nginx security fixes of 2026-11-18 (CVE-2026-123007, CVE-2026-123633)."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: dependency-track
      image: ghcr.io/quenchworks/images/dependency-track@sha256:1140d0e300725e7db17144321b68b63c7ddd5feb8b7bbba3998165ef91bf86ca
    - name: dependency-track-frontend
      image: ghcr.io/quenchworks/images/dependency-track-frontend@sha256:92b1ab401099988cfa056780bff068c58c39a794df46e9ebf3a1453a9caf5162
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

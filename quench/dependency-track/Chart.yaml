apiVersion: v2
name: dependency-track
description: "OWASP Dependency-Track, the SBOM analysis platform: the API server, the web UI behind one address, and a bundled PostgreSQL. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.4
appVersion: "5.1.1"
keywords:
  - dependency-track
  - sbom
  - cyclonedx
  - vulnerability
  - supply-chain
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/DependencyTrack/dependency-track
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled PostgreSQL moves to 0.0.26 (18.6 rebuilt: Patroni psycopg no longer carries its own OpenSSL 3.5.8)."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: dependency-track
      image: ghcr.io/quenchworks/images/dependency-track@sha256:cb8b5cb2ac1f186003eca81353864a7b2899bd21e33db25b2a55e97e54fc17ff
    - name: dependency-track-frontend
      image: ghcr.io/quenchworks/images/dependency-track-frontend@sha256:e33caa28408159ed660fbdacc2d426c5131a38da399945b007ddd81dd9ab67e6
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:086dc72597074662dfb828f7f58a0093f98123405cf4bc109a1bd859bc576f21
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

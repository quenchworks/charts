{{- if .Values.serviceAccount.create }}
{{- /*
All three ESO deployments share this ServiceAccount and need its API token:
the controller and cert-controller talk to the API server constantly. The token
is mounted per-pod via automountServiceAccountToken in each Deployment.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "external-secrets.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{/*
ESO cert-controller: generates the webhook's self-signed CA, writes it into the
webhook Secret, and injects the caBundle into the ValidatingWebhookConfigurations
and the named CRDs. This is why no cert-manager dependency is needed. healthz/
readyz are served on .healthPort.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "external-secrets.certControllerName" . }}
  labels:
    {{- include "external-secrets.componentLabels" (dict "ctx" . "component" "cert-controller") | nindent 4 }}
spec:
  replicas: {{ .Values.certController.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "external-secrets.componentSelectorLabels" (dict "ctx" . "component" "cert-controller") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "external-secrets.componentSelectorLabels" (dict "ctx" . "component" "cert-controller") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "external-secrets.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: cert-controller
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/external-secrets"]
          args:
            - "certcontroller"
            - "--crd-requeue-interval={{ .Values.certController.requeueInterval }}"
            - "--service-name={{ include "external-secrets.webhookName" . }}"
            - "--service-namespace={{ .Release.Namespace }}"
            - "--secret-name={{ include "external-secrets.webhookCertSecretName" . }}"
            - "--secret-namespace={{ .Release.Namespace }}"
            - "--metrics-addr=:{{ .Values.certController.metricsPort }}"
            - "--healthz-addr=:{{ .Values.certController.healthPort }}"
            - "--loglevel={{ .Values.certController.logLevel }}"
            {{- if .Values.controller.leaderElect }}
            - "--enable-leader-election=true"
            {{- end }}
            {{- range .Values.certController.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.certController.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.certController.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.certController.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- include "quench-common.extraVolumeMounts" $ | nindent 12 }}
          {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- include "quench-common.extraVolumes" $ | nindent 8 }}
      {{- end }}

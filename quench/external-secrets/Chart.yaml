apiVersion: v2
name: external-secrets
description: "External Secrets Operator: syncs secrets from external APIs (Vault, cloud secret managers, and more) into Kubernetes Secrets via ExternalSecret/SecretStore CRDs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Runs the single ESO binary as three deployments (controller, webhook, cert-controller); the cert-controller manages the webhook's self-signed CA, so no cert-manager dependency is required."
type: application
version: 0.0.9
appVersion: "2.9.0"
keywords:
  - external-secrets
  - secrets
  - secret-management
  - vault
  - kubernetes
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/external-secrets/external-secrets
annotations:
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: security
      description: "Updated external-secrets to 2.9.0 and re-pinned the image to its new 0-CVE digest (multi-arch, cosign-signed, SBOM + SLSA attested)."
  artifacthub.io/images: |
    - name: external-secrets
      image: ghcr.io/quenchworks/images/external-secrets@sha256:8c2b908324875497b4c164cee93f86d6b11f46de1708f7f1b3c88a91dcd22fde
  artifacthub.io/crds: |
    - kind: ExternalSecret
      version: v1
      name: externalsecrets.external-secrets.io
      displayName: ExternalSecret
      description: Declares a target Kubernetes Secret synced from a SecretStore provider.
    - kind: ClusterExternalSecret
      version: v1
      name: clusterexternalsecrets.external-secrets.io
      displayName: ClusterExternalSecret
      description: Templates ExternalSecrets across many namespaces from one cluster-scoped resource.
    - kind: SecretStore
      version: v1
      name: secretstores.external-secrets.io
      displayName: SecretStore
      description: Namespaced configuration for an external secret provider.
    - kind: ClusterSecretStore
      version: v1
      name: clustersecretstores.external-secrets.io
      displayName: ClusterSecretStore
      description: Cluster-scoped configuration for an external secret provider.
    - kind: PushSecret
      version: v1alpha1
      name: pushsecrets.external-secrets.io
      displayName: PushSecret
      description: Pushes a Kubernetes Secret out to an external provider.
    - kind: ClusterPushSecret
      version: v1alpha1
      name: clusterpushsecrets.external-secrets.io
      displayName: ClusterPushSecret
      description: Cluster-scoped PushSecret applied across namespaces.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

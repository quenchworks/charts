{{- /* The account password and the API secret: generated once and read back on upgrade. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.user.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}
  api-secret: {{ .Values.apiSecret | default (get $old "api-secret" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}

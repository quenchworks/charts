# Quenchworks Apache Artemis on the QuenchWorks activemq-artemis image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). One broker with its journal on a PVC.
image:
  repository: ghcr.io/quenchworks/images/activemq-artemis
  digest: "sha256:8d29ae4aa65a0cf6fb0891e83c301e39254df102ab1e58ad47297cacd3410d0b"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

auth:
  # The image requires login and ships no users. The chart writes one admin user
  # (role amq, which the web console also needs). Empty password generates one, kept
  # across upgrades.
  username: admin
  password: ""
  # An existing Secret with keys artemis-users.properties (user = password lines) and
  # artemis-roles.properties (role = user,user lines).
  existingSecret: ""

# The artemis acceptor on 61616 speaks every protocol and is always on. The image also
# listens on the protocol ports below; these add them to the Service.
connectors:
  amqp: false     # 5672
  stomp: false    # 61613
  mqtt: false     # 1883

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

# Heap: the image defaults to -Xms64m -XX:MaxRAMPercentage=75 of the memory limit, and
# Artemis caps in-memory messages at half the heap before paging to /data.
extraEnv: []

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP

# Native TLS: every acceptor (61616 and the protocol ports) speaks SSL, none stays plain.
# Clients add sslEnabled=true and trust ca.crt from the TLS Secret, e.g.
# tcp://host:61616?sslEnabled=true&trustStoreType=PEM&trustStorePath=/path/ca.crt. A busybox
# init container writes the PKCS#8 PEM keystore. The certificate comes from the first source
# set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
busybox:
  repository: ghcr.io/quenchworks/images/busybox
  digest: "sha256:ca51f41cf97009e6913c4ea272879cffa6f8333a691839a3fa40eb7d16945d3a"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

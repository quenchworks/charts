# The digest below is the contract with the image factory. CI rewrites it from
# manifests/solr.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/solr
  digest: "sha256:640585e8eb5c96ad1dcc24868813dd3701d75075c868a869c77b4a74c8126325"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-node standalone for now. SolrCloud (set config.zkHost to a ZooKeeper connect
# string) is a later addition.
replicaCount: 1

# Solr config knobs (the entrypoint reads these as SOLR_* env).
config:
  # JVM heap; maps to SOLR_HEAP (-Xms/-Xmx). 512m keeps the footprint modest.
  heapSize: 512m
  # Optional: precreate a core on first boot from the _default configset. Empty = none.
  core: ""
  # Optional: opt into SolrCloud by pointing at a ZooKeeper connect string
  # (e.g. "zk-headless:2181"). Empty = single-node standalone.
  zkHost: ""
  # Extra JVM opts appended to SOLR_OPTS (SOLR_OPTS_EXTRA passthrough).
  optsExtra: ""

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits: { cpu: "2", memory: 1536Mi }

service:
  type: ClusterIP
  httpPort: 8983

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
config:
  heapSize: 512m
  # Precreate the gate core on first boot so the install gate can index + query it.
  core: gate
resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits: { cpu: "1", memory: 1Gi }

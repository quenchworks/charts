{{- /* The auth password and the server's SSH key. Both are generated once and read back on
       upgrade, so clients keep their credentials and the server fingerprint stays the same. */}}
{{- $name := include "quench-common.fullname" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $oldData := ($old | default dict).data | default dict }}
{{- $pw := .Values.auth.password | default (get $oldData "password" | b64dec) | default (randAlphaNum 24) }}
{{- $key := get $oldData "server.key" | b64dec | default (genPrivateKey "ecdsa") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
  auth: {{ printf "%s:%s" .Values.auth.username $pw | b64enc | quote }}
  server.key: {{ $key | b64enc | quote }}

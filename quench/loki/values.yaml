# The digest below is the contract with the image factory. CI rewrites it from
# manifests/loki.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/loki
  digest: "sha256:8839c82d8c37f1367c416d9ba8001c48183146384861315bb99de67e18499369"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single-binary mode: one process runs every Loki component (-target=all). Loki
# keeps local storage state (chunks/index/wal under path_prefix), so this chart
# ships a StatefulSet. The single-binary topology is the recommended deployment
# up to a few hundred GB/day of ingest; scale-out (read/write/backend targets +
# an object store) is a tracked follow-up. replicaCount > 1 in single-binary
# mode also needs a shared object store and a real ring -- keep it at 1 here.
replicaCount: 1

# Loki configuration. The image entrypoint is the binary directly; the chart
# passes -config.file=/etc/loki/config.yaml and -target=all. The config below is
# rendered into a ConfigMap and mounted at that path. Replace lokiConfig wholesale
# to bring your own config (it is templated, so you may use Helm values inside it).
#
# Defaults: anonymous (auth_enabled: false), filesystem storage under /loki (the
# writable volume), single replica with an in-memory ring, and a current tsdb v13
# schema. analytics reporting is disabled.
lokiConfig: |
  auth_enabled: false

  server:
    http_listen_port: {{ .Values.service.port }}
    grpc_listen_port: {{ .Values.service.grpcPort }}

  common:
    instance_addr: 127.0.0.1
    path_prefix: /loki
    storage:
      filesystem:
        chunks_directory: /loki/chunks
        rules_directory: /loki/rules
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory

  schema_config:
    configs:
      - from: 2020-10-24
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    metric_aggregation_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    volume_enabled: true

  compactor:
    working_directory: /loki/compactor
    retention_enabled: false
    delete_request_store: filesystem

  ruler:
    storage:
      type: local
      local:
        directory: /loki/rules

  analytics:
    reporting_enabled: false

# Extra raw flags appended verbatim after -config.file/-target (entrypoint passes
# them to the binary), e.g. ["-log.level=debug"].
extraArgs: []

persistence:
  enabled: true
  size: 16Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  # HTTP API: push (/loki/api/v1/push), query, /ready, /metrics.
  port: 3100
  # gRPC (inter-component / future scale-out).
  grpcPort: 9095

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loki.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/loki/config.yaml (the chart's -config.file arg). lokiConfig
  # is templated so values like service ports flow in; edit it and `helm upgrade`
  # (the pod checksum annotation rolls the StatefulSet).
  config.yaml: |-
    {{- tpl .Values.lokiConfig . | nindent 4 }}

{{- if .Values.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.datasourcesConfigMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at GF_PATHS_PROVISIONING/datasources/datasources.yaml; Grafana wires
  # these on boot. Point at the Quenchworks Prometheus / VictoriaMetrics service.
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      {{- toYaml .Values.datasources | nindent 6 }}
{{- end }}

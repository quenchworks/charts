{{/* httpGet probes: the runtime image ships no shell HTTP client, so the kubelet
     calls /api/health on the HTTP port. It returns 200 once SQLite is initialized
     and the server is serving. SQLite init on first boot needs a moment, hence the
     modest initialDelay. */}}
{{- $liveness := dict "httpGet" (dict "path" "/api/health" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/api/health" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "grafana.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # roll the pod when provisioned datasources change
        {{- if .Values.datasources }}
        checksum/datasources: {{ include (print $.Template.BasePath "/configmap-datasources.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "grafana.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: grafana
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # bind the HTTP server to the service port; the entrypoint runs
            # `grafana server` which reads GF_* from the environment.
            - name: GF_SERVER_HTTP_PORT
              value: "{{ .Values.service.port }}"
            # admin credentials from the Secret (no anonymous access by default)
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.secretName" . }}
                  key: {{ include "grafana.secretUserKey" . }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.secretName" . }}
                  key: {{ include "grafana.secretPasswordKey" . }}
            {{- range $k, $v := .Values.config.extraIni }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # SQLite grafana.db + plugins live here (read-only rootfs: must be writable)
            - name: data
              mountPath: /var/lib/grafana
            # logs and the provisioning tree are writable scratch on the read-only rootfs
            - name: logs
              mountPath: /var/log/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: tmp
              mountPath: /tmp
            {{- if .Values.datasources }}
            # provisioned datasources: a single file dropped into the datasources dir
            # (subPath so it coexists with the writable provisioning emptyDir).
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: provisioning
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.datasources }}
        - name: datasources
          configMap:
            name: {{ include "grafana.datasourcesConfigMapName" . }}
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

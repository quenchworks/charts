{{/* /live is false on a replica that lost the HA lease, so the kubelet restarts it;
     /metrics answers once the controllers are registered. Both are on 9090. */}}
{{- $liveness := dict "httpGet" (dict "path" "/live" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "failureThreshold" 5 "timeoutSeconds" 5 -}}
{{- $readiness := dict "httpGet" (dict "path" "/metrics" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 "failureThreshold" 5 "timeoutSeconds" 5 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "reloader.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: reloader
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - "--log-level={{ .Values.logLevel }}"
            {{- with .Values.logFormat }}
            - "--log-format={{ . }}"
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - "--enable-ha=true"
            {{- end }}
            {{- if .Values.autoReloadAll }}
            - "--auto-reload-all=true"
            {{- end }}
            {{- with .Values.resourcesToIgnore }}
            - "--resources-to-ignore={{ join "," . }}"
            {{- end }}
            {{- if .Values.watchGlobally }}
            {{- with .Values.namespacesToIgnore }}
            - "--namespaces-to-ignore={{ join "," . }}"
            {{- end }}
            {{- with .Values.namespaceSelector }}
            - "--namespace-selector={{ join "," . }}"
            {{- end }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # GOMEMLIMIT keeps the Go heap under the container limit.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            # The leader-election lock identity and namespace (--enable-ha).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Reloader writes a reloader-meta-info ConfigMap here describing its options.
            - name: RELOADER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELOADER_DEPLOYMENT_NAME
              value: {{ include "quench-common.fullname" . }}
            {{- if not .Values.watchGlobally }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
            {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- include "quench-common.extraVolumeMounts" $ | nindent 12 }}
          {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- include "quench-common.extraVolumes" $ | nindent 8 }}
      {{- end }}

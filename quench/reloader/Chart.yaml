apiVersion: v2
name: reloader
description: "Stakater Reloader watches ConfigMaps and Secrets and rolls the Deployments, StatefulSets and DaemonSets that use them, so a config change reaches running pods without a manual restart. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "1.4.23"
kubeVersion: ">=1.23.0-0"
keywords:
  - reloader
  - configmap
  - secret
  - rollout
  - kubernetes
  - operations
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/stakater/Reloader
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-01 wave lock"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: reloader
      image: ghcr.io/quenchworks/images/reloader@sha256:2c5fe54e4eebb07dcbdd40b52b05d3b356a9664df04a58e268c2181c23353ae1
  artifacthub.io/operator: "false"

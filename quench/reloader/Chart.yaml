apiVersion: v2
name: reloader
description: "Stakater Reloader watches ConfigMaps and Secrets and rolls the Deployments, StatefulSets and DaemonSets that use them, so a config change reaches running pods without a manual restart. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.6
appVersion: "1.4.24"
kubeVersion: ">=1.23.0-0"
keywords:
  - reloader
  - configmap
  - secret
  - rollout
  - kubernetes
  - operations
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/stakater/Reloader
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: reloader
      image: ghcr.io/quenchworks/images/reloader@sha256:bbda25e5db4da55c5ec02fead231f4b9e23483baff29f73db153fa7b51e5db08
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

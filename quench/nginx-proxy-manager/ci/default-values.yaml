# Standalone install gate. No image override: the install uses the chart's pinned
# digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON so the gate proves both PVCs bind and NPM writes its database
# and nginx config to /data. kind has no internet egress guarantee: skip the CDN fetch.
admin:
  email: admin@quench.test
persistence:
  enabled: true
  size: 1Gi
  letsencrypt:
    size: 1Gi
ipRangesFetch: false

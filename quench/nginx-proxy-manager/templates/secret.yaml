{{- if not .Values.admin.existingSecret }}
{{- $name := include "nginx-proxy-manager.adminSecret" . }}
{{- $password := .Values.admin.password }}
{{- if not $password }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = index .data "password" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    # NPM creates the first admin account once, with this password; keep the Secret
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ default (randAlphaNum 24) $password | b64enc | quote }}
{{- end }}

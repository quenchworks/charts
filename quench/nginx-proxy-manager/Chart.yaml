apiVersion: v2
name: nginx-proxy-manager
description: "Nginx Proxy Manager, the web UI that manages nginx proxy hosts, redirections, streams and Let's Encrypt certificates, with SQLite and nginx config on a PVC. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "2.16.0"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/NginxProxyManager/nginx-proxy-manager
keywords:
  - nginx-proxy-manager
  - nginx
  - reverse-proxy
  - letsencrypt
  - proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned nginx-proxy-manager to a rebuilt image digest (no application version change)."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: nginx-proxy-manager
      image: ghcr.io/quenchworks/images/nginx-proxy-manager@sha256:2ab5167d918b9e0ab93cc857b4fd93f2af74b9a64eef03731e5eb3b3ac86c283
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: gokapi
description: "Gokapi: lightweight self-hosted file sharing with expiring links, download limits and optional end-to-end encryption, on SQLite, with the admin configured at install. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "2.2.4"
keywords:
  - gokapi
  - file-sharing
  - upload
  - self-hosted
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Forceu/Gokapi
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "The artifacthub.io/images annotation now names the same Gokapi 2.2.4 digest the chart deploys (values.yaml); it still listed an earlier build."
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: gokapi
      image: ghcr.io/quenchworks/images/gokapi@sha256:a468bf8a135a72ad4facd913c91c58d8daceec6fde32e2394621eb3b93010b5f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

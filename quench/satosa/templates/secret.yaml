{{- /* Generated once and kept across upgrades (lookup), so every replica and every
     rollout shares the same state key and the same SAML key pair. */ -}}
{{- if not .Values.stateEncryption.existingSecret }}
{{- $name := include "satosa.stateSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.stateEncryption.key }}
  state-encryption-key: {{ .Values.stateEncryption.key | b64enc | quote }}
  {{- else if and $old (index $old.data "state-encryption-key") }}
  state-encryption-key: {{ index $old.data "state-encryption-key" | quote }}
  {{- else }}
  state-encryption-key: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.samlKeyPair.existingSecret }}
{{- $name := include "satosa.samlSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if and $old (index $old.data "tls.crt") }}
  tls.crt: {{ index $old.data "tls.crt" | quote }}
  tls.key: {{ index $old.data "tls.key" | quote }}
  {{- else }}
  {{- $cert := genSelfSignedCert (include "quench-common.fullname" .) nil nil 3650 }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  {{- end }}
{{- end }}

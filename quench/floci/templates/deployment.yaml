{{/* Floci serves a LocalStack-compatible health endpoint at GET /_floci/health on
     the edge port; it returns HTTP 200 with JSON {"services":{...}} once the
     in-process services are ready. Used for liveness + readiness. Quarkus/JVM
     boot can take a few seconds, so readiness starts a touch later. */}}
{{- $liveness := dict "httpGet" (dict "path" "/_floci/health" "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 3 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/_floci/health" "port" "http") "initialDelaySeconds" 10 "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 6 -}}
{{- /* Full mode requires explicit floci.full.acknowledgeRisk=true; this fails rendering otherwise. */ -}}
{{- include "floci.riskGate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "floci.serviceAccountName" . }}
      securityContext:
        {{- include "floci.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: floci
          image: {{ include "floci.image" . }}
          imagePullPolicy: {{ include "floci.imagePullPolicy" . }}
          securityContext:
            {{- include "floci.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: FLOCI_PORT
              value: {{ .Values.floci.port | quote }}
            - name: FLOCI_DEFAULT_REGION
              value: {{ .Values.floci.defaultRegion | quote }}
            - name: FLOCI_DEFAULT_ACCOUNT_ID
              value: {{ .Values.floci.defaultAccountId | quote }}
            - name: LOCALSTACK_PARITY
              {{- if include "floci.fullMode" . }}
              value: "true"
              {{- else }}
              value: {{ .Values.floci.localstackParity | quote }}
              {{- end }}
            - name: FLOCI_STORAGE_MODE
              value: {{ .Values.floci.storage.mode | quote }}
            - name: FLOCI_STORAGE_PERSISTENT_PATH
              value: {{ .Values.floci.storage.path | quote }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.floci.port }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if include "floci.persistenceEnabled" . }}
            - name: data
              mountPath: {{ .Values.floci.storage.path }}
            {{- end }}
            {{- if include "floci.fullMode" . }}
            {{- include "floci.dockerSocketVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        {{- if include "floci.persistenceEnabled" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "floci.pvcName" . }}
        {{- end }}
        {{- if include "floci.fullMode" . }}
        {{- include "floci.dockerSocketVolume" . | nindent 8 }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

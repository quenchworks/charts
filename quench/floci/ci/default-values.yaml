# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Minimal, bootable config: in-memory storage (no disk, works on the read-only
# root filesystem), single replica, small footprint. The gate reaches Ready on the
# /_floci/health probe and the workflow curls that endpoint for a real smoke check.
replicaCount: 1
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
floci:
  port: 4566
  storage:
    mode: memory
    path: /data
persistence:
  enabled: false

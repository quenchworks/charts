apiVersion: v2
name: floci
description: "Floci, the self-hosted, LocalStack-compatible local AWS emulator (Quarkus). This chart ships ONLY the in-process services (S3, DynamoDB, SQS, SNS, IAM) that run nonroot without a Docker socket; the Docker-backed services (Lambda, RDS, ECS, EKS, ...) are out of scope. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.2.12
appVersion: "1.6.0"
keywords:
  - floci
  - localstack
  - aws
  - emulator
  - s3
  - dynamodb
  - sqs
  - sns
  - iam
  - testing
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/floci-io/floci
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: security
      description: "Updated floci to 1.6.0 and re-pinned the image to a 0-CVE digest: Apache HttpClient5 5.5.1 to 5.6.3 and HttpCore5 / HttpCore5-H2 5.3.6 to 5.4.3."
  artifacthub.io/images: |
    - name: floci
      image: ghcr.io/quenchworks/images/floci@sha256:b0ad00b1b8c7e4911045df9055acbb02bebe9841fa7e247297fdc33f0cc24827
    - name: floci-full
      image: ghcr.io/quenchworks/images/floci-full@sha256:de65e07d085d55a89b605c446f20de0076b187b712b644da5c69937f956f2ec4
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md

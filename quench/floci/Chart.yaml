apiVersion: v2
name: floci
description: "Floci, the self-hosted, LocalStack-compatible local AWS emulator (Quarkus). This chart ships ONLY the in-process services (S3, DynamoDB, SQS, SNS, IAM) that run nonroot without a Docker socket; the Docker-backed services (Lambda, RDS, ECS, EKS, ...) are out of scope. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.2.30
appVersion: "2.1.0"
keywords:
  - floci
  - localstack
  - aws
  - emulator
  - s3
  - dynamodb
  - sqs
  - sns
  - iam
  - testing

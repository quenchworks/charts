apiVersion: v2
name: floci
description: "Floci, the self-hosted, LocalStack-compatible local AWS emulator (Quarkus). This chart ships ONLY the in-process services (S3, DynamoDB, SQS, SNS, IAM) that run nonroot without a Docker socket; the Docker-backed services (Lambda, RDS, ECS, EKS, ...) are out of scope. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.2.13
appVersion: "1.6.0"
keywords:
  - floci
  - localstack
  - aws
  - emulator
  - s3
  - dynamodb
  - sqs
  - sns
  - iam
  - testing
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/floci-io/floci
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: security
      description: "Updated floci to 1.6.0 and re-pinned the image to a 0-CVE digest: Apache HttpClient5 5.5.1 to 5.6.3 and HttpCore5 / HttpCore5-H2 5.3.6 to 5.4.3."
  artifacthub.io/images: |
    - name: floci
      image: ghcr.io/quenchworks/images/floci@sha256:1c83a712bf07a503a17e683d78dc7cebb0eec539fb64e6faf5d8daaa3b499d1f
    - name: floci-full
      image: ghcr.io/quenchworks/images/floci-full@sha256:cb60501e61c7e0567fb57c27eafa0e316294a7dfa8e636a248952d819e1b6d5e

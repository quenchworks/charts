{{- /* The admin password and the seed config (bcrypt hash, DNS on 5353), generated once and read back on
       upgrade. The seed is copied to the volume only on the first start; AdGuard owns the file after that. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
{{- $seed := get $old "AdGuardHome.yaml" | b64dec }}
{{- if not $seed }}
{{- $hash := htpasswd .Values.admin.username $pw | trimPrefix (printf "%s:" .Values.admin.username) }}
{{- $seed = printf "http:\n  address: 0.0.0.0:3000\nusers:\n  - name: %s\n    password: %s\ndns:\n  bind_hosts: [0.0.0.0]\n  port: 5353\n%sschema_version: 34\n" .Values.admin.username $hash (ternary "" (printf "  upstream_dns:%s" (include "adguardhome.upstreams" .)) (empty .Values.upstreamDNS)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  AdGuardHome.yaml: {{ $seed | b64enc | quote }}
{{- end }}
{{- define "adguardhome.upstreams" -}}
{{- range .Values.upstreamDNS }}
    - {{ . | quote }}
{{- end }}
{{- printf "\n" -}}
{{- end -}}

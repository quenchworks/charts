# The digests below are the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. They are never tags.
image:
  repository: ghcr.io/quenchworks/images/mastodon
  digest: "sha256:409acec194b87b028db9051237a5765c99d2596f7c21b6b487cd47a769e011b9"
  pullPolicy: IfNotPresent
streaming:
  image:
    repository: ghcr.io/quenchworks/images/mastodon-streaming
    digest: "sha256:355ee4d0da987b8d48bfbe324484263f7783b12ce98f8e4de0f617b8f9ba7196"
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

nameOverride: ""

# The domain your accounts live on (@user@<localDomain>). It is written into every
# account and post, so it cannot change after the first start.
localDomain: mastodon.local
# Set when the web interface is served on a different host than localDomain.
webDomain: ""
# Registrations: "open", "approved" or "none".
registrationsMode: none

# Rails secrets. Empty: generated once and kept across upgrades in the Secret
# <fullname>. Losing them breaks sessions, two-factor codes and encrypted columns, so
# back that Secret up, or supply your own with existingSecret (keys: secret-key-base,
# otp-secret, ar-deterministic-key, ar-key-derivation-salt, ar-primary-key).
secrets:
  existingSecret: ""

web:
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "2", memory: 2Gi }
sidekiq:
  replicaCount: 1
  # Extra sidekiq flags, for example ["-c", "10"].
  extraArgs: []
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

# Extra environment for web, sidekiq and the schema step (SMTP_*, S3_*, ...).
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

# --- DATABASE, mode 1 (default): the bundled PostgreSQL subchart. ---
postgresql:
  enabled: true
  auth:
    # username and database MUST differ: the bundled PostgreSQL only creates the
    # application database when its name differs from the superuser's.
    username: mastodondb
    password: ""              # generated if empty; in the Secret <release>-postgresql
    database: mastodon_production
  primary:
    persistence:
      enabled: true
      size: 10Gi

# --- DATABASE, mode 2: external PostgreSQL (postgresql.enabled=false). ---
externalDatabase:
  host: ""
  port: 5432
  database: mastodon_production
  username: mastodon
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password

# --- REDIS, mode 1 (default): the bundled Valkey subchart. ---
valkey:
  enabled: true
  auth:
    password: ""              # generated by the valkey subchart if empty

# --- REDIS, mode 2: external Redis or Valkey (valkey.enabled=false). ---
externalRedis:
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password

# Waits for the database before the schema step. Uses our postgresql image for
# pg_isready (a parent chart cannot read a subchart's pin).
waitForDatabase:
  image:
    repository: ghcr.io/quenchworks/images/postgresql
    digest: "sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46"

# Media uploads, under public/system, shared by web and sidekiq. ReadWriteOnce keeps both
# on one node; use ReadWriteMany (or S3_* in extraEnvVars) to spread them.
persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  existingClaim: ""

service:
  type: ClusterIP
  port: 3000
  streamingPort: 4000

# One host: /api/v1/streaming goes to the streaming server, the rest to web. Mastodon
# needs HTTPS in front of it; set tls here or terminate it upstream.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
podSecurityContext: {}
containerSecurityContext: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

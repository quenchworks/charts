apiVersion: v2
name: mastodon
description: "Mastodon, the federated social network server: web, sidekiq and streaming on QuenchWorks images, with the bundled PostgreSQL and Valkey (or external ones), the schema prepared on every start, media on a PVC, and the Rails secrets generated once and kept across upgrades. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.8
appVersion: "4.7.3"
keywords:
  - mastodon
  - activitypub
  - fediverse
  - social
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mastodon/mastodon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "rebuilt image: 2026-10-06 CVE fixes"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mastodon
      image: ghcr.io/quenchworks/images/mastodon@sha256:00f08ab20748d8140e82ce9c01dacba374a25d423c0d392e9f209f5347743b99
    - name: mastodon-streaming
      image: ghcr.io/quenchworks/images/mastodon-streaming@sha256:13c706bcade068a5b63a4891ce4a32e90e30b1460949252634729c0c67cf1869
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:48aebfed6b703fc2e8582aff8382063ea6c06b62d8b735e1b13da306182d1f50
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:b10dd145a2a8e35039d218b68806b2bc6158223b1970b773de986a1dbe209487
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

apiVersion: v2
name: mastodon
description: "Mastodon, the federated social network server: web, sidekiq and streaming on QuenchWorks images, with the bundled PostgreSQL and Valkey (or external ones), the schema prepared on every start, media on a PVC, and the Rails secrets generated once and kept across upgrades. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.29
appVersion: "4.7.5"
keywords:
  - mastodon
  - activitypub
  - fediverse
  - social
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mastodon/mastodon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mastodon
      image: ghcr.io/quenchworks/images/mastodon@sha256:409acec194b87b028db9051237a5765c99d2596f7c21b6b487cd47a769e011b9
    - name: mastodon-streaming
      image: ghcr.io/quenchworks/images/mastodon-streaming@sha256:355ee4d0da987b8d48bfbe324484263f7783b12ce98f8e4de0f617b8f9ba7196
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:9c4478f8925ca6e4098ef00966036e933f93c54185b38281f74f5ab02208aa0b
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:5ff5a0ea89c59eb1e731d2741642349d2009579863a9bc28ade66706af95f6a0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled
  - name: valkey
    alias: valkey
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: valkey.enabled

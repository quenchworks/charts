apiVersion: v2
name: mastodon
description: "Mastodon, the federated social network server: web, sidekiq and streaming on QuenchWorks images, with the bundled PostgreSQL and Valkey (or external ones), the schema prepared on every start, media on a PVC, and the Rails secrets generated once and kept across upgrades. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.18
appVersion: "4.7.3"
keywords:
  - mastodon
  - activitypub
  - fediverse
  - social
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mastodon/mastodon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles postgresql=0.0.30,valkey=0.0.32 (2026-10-22 CVE rebuild)"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mastodon
      image: ghcr.io/quenchworks/images/mastodon@sha256:75985a180d492ab536e7b4407b660326660e4a0e9cdec7942c23e526b8fdca33
    - name: mastodon-streaming
      image: ghcr.io/quenchworks/images/mastodon-streaming@sha256:f3befe71fe6d3bdbc64f20dc119a716719de340070c0fb3cc3e978889f93cece
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:42316ed44fa7722f611c35af6edb37882ceaac8c83f48a59735d329d5c12d977
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:22b644a4aaef49828a48d2cc0b1753cf7a950dc6315dc2d34731012e2326ec4d
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

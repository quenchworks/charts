apiVersion: v2
name: mastodon
description: "Mastodon, the federated social network server: web, sidekiq and streaming on QuenchWorks images, with the bundled PostgreSQL and Valkey (or external ones), the schema prepared on every start, media on a PVC, and the Rails secrets generated once and kept across upgrades. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.39
appVersion: "4.7.5"
keywords:
  - mastodon
  - activitypub
  - fediverse
  - social
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mastodon/mastodon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the postgresql subchart 0.0.37 -> 0.0.38, valkey subchart 0.0.39 -> 0.0.40."
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mastodon
      image: ghcr.io/quenchworks/images/mastodon@sha256:a0d6626b53dc697291c29077ba606b74428b56b6a655262d3d18b78f354a14cb
    - name: mastodon-streaming
      image: ghcr.io/quenchworks/images/mastodon-streaming@sha256:355ee4d0da987b8d48bfbe324484263f7783b12ce98f8e4de0f617b8f9ba7196
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:bd2f30deb4676d782e9ffdebe2c8d29225c875dc0be09085f750b9e4ac19e255
  artifacthub.io/operator: "false"

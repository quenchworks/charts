apiVersion: v2
name: mastodon
description: "Mastodon, the federated social network server: web, sidekiq and streaming on QuenchWorks images, with the bundled PostgreSQL and Valkey (or external ones), the schema prepared on every start, media on a PVC, and the Rails secrets generated once and kept across upgrades. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.13
appVersion: "4.7.3"
keywords:
  - mastodon
  - activitypub
  - fediverse
  - social
  - rails
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/mastodon/mastodon
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Rebuilt images (2026-10-11 CVE wave)"
  artifacthub.io/category: skip-prediction
  artifacthub.io/images: |
    - name: mastodon
      image: ghcr.io/quenchworks/images/mastodon@sha256:341ac09b566bb125bde71410948b75a4896c2abc3ca3bd364427746addd96d6b
    - name: mastodon-streaming
      image: ghcr.io/quenchworks/images/mastodon-streaming@sha256:2d92eb4817f2aa1f665d53d71387e401a1d41251ee7fe357136a795172fb612b
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:48aebfed6b703fc2e8582aff8382063ea6c06b62d8b735e1b13da306182d1f50
    - name: valkey
      image: ghcr.io/quenchworks/images/valkey@sha256:da2b2d24bdd369959b480a23d289d7fcb209968199e8c621700d8b7d3e8420a5
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

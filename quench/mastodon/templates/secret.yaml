{{- $name := include "quench-common.fullname" . -}}
{{- $needKeys := not .Values.secrets.existingSecret -}}
{{- $needDb := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- $needRedis := and (not .Values.valkey.enabled) (not .Values.externalRedis.existingSecret) .Values.externalRedis.password -}}
{{- if or $needKeys $needDb $needRedis }}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}{{- $old = .data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKeys }}
  {{- /* Generated once and kept: reuse whatever the live Secret already holds. */}}
  {{- range $key, $len := dict "secret-key-base" 128 "otp-secret" 128 "ar-deterministic-key" 32 "ar-key-derivation-salt" 32 "ar-primary-key" 32 }}
  {{ $key }}: {{ index $old $key | default (randAlphaNum $len | b64enc) | quote }}
  {{- end }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if $needRedis }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}
{{- end }}

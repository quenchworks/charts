    - kind: changed
      description: "bundles postgresql=0.0.31 (the 2026-11-01 wave re-pin)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ory-hydra
      image: ghcr.io/quenchworks/images/ory-hydra@sha256:4af1f073989de65da51b107f86e7bfe07b538226b2a7f2ba179befc4fbf7e122
    - name: postgresql

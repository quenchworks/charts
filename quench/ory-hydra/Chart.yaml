    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ory-hydra
      image: ghcr.io/quenchworks/images/ory-hydra@sha256:698d37b26945257eb22808909dd39a11a898b5b264c869bbd9b3e7cba5605bf3
    - name: postgresql

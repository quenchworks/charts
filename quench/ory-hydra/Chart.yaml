dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

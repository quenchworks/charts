    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ory-hydra
      image: ghcr.io/quenchworks/images/ory-hydra@sha256:40e01ffc258cd2adbc7a7e2910d41a4f896d1a17a9bb7f2facf98d07d308546e
    - name: postgresql

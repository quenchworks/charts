apiVersion: v2
name: ory-hydra
description: "Ory Hydra, the OAuth 2.0 and OpenID Connect provider: public and admin APIs, SQL migrations at start, bundled or external PostgreSQL. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "26.2.0"
keywords:
  - hydra
  - ory
  - oauth2
  - openid-connect
  - oidc
  - identity
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/hydra
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: postgresql 0.0.24."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ory-hydra
      image: ghcr.io/quenchworks/images/ory-hydra@sha256:f95fa79894f8f2a0c12b0b601f43240952221220246240c12d4ea92c4b0f817f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

# Two Services so the public API can be exposed without the admin API.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-public
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: public
      port: {{ .Values.service.publicPort }}
      targetPort: public
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-admin
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{- if not .Values.hydra.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $sys := randAlphaNum 32 -}}
{{- $cookie := randAlphaNum 32 -}}
{{- if $existing }}
{{- $sys = index $existing.data "secretsSystem" | b64dec -}}
{{- $cookie = index $existing.data "secretsCookie" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    # rotating the system secret makes every stored client secret and key unreadable
    helm.sh/resource-policy: keep
type: Opaque
data:
  secretsSystem: {{ $sys | b64enc | quote }}
  secretsCookie: {{ $cookie | b64enc | quote }}
{{- end }}

# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-ory-hydra, OCI URL oci://ghcr.io/quenchworks/charts/ory-hydra.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # ory-hydra (oci://ghcr.io/quenchworks/charts/ory-hydra)

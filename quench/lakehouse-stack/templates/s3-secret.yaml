{{- $existing := lookup "v1" "Secret" .Release.Namespace "lake-s3" -}}
{{- $ak := randAlphaNum 20 | upper -}}
{{- $sk := randAlphaNum 40 -}}
{{- if $existing }}
{{- $ak = index $existing.data "AWS_ACCESS_KEY_ID" | b64dec -}}
{{- $sk = index $existing.data "AWS_SECRET_ACCESS_KEY" | b64dec -}}
{{- end }}
# The S3 keys SeaweedFS accepts and Trino signs with. Generated once, kept
# across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: lake-s3
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ $ak | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $sk | b64enc | quote }}

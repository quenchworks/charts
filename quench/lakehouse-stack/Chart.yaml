apiVersion: v2
name: lakehouse-stack
description: "Hardened open lakehouse: Trino queries Apache Iceberg tables cataloged by Nessie and stored in SeaweedFS over S3, wired together with generated S3 keys and a bucket created at install. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.43
appVersion: "1.0.0"
keywords:
  - trino
  - iceberg
  - nessie
  - seaweedfs
  - lakehouse
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/trinodb/trino
  - https://github.com/projectnessie/nessie
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned trino 483 to the rebuilt digests."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: trino
      image: ghcr.io/quenchworks/images/trino@sha256:c5032da90cef22f3708090b40fafc7163952e304cc500aa8f27e51e81a960e31
    - name: nessie
      image: ghcr.io/quenchworks/images/nessie@sha256:3e05ae859fe945c2904cf2881e2d6db51b91b9056eaed4ad8cfa073942616a68
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:5e6bac40b6f6662aa1404dc9b7dade568331002059db2b2842bcb8fd713f1471
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:a18f0c39bb2f4556140fb1130cbb652a0fbc890e171a0c07bb6fb4651d61ab67
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: trino
    version: 0.0.19
    repository: oci://ghcr.io/quenchworks/charts
    condition: trino.enabled
  - name: nessie
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: nessie.enabled
  - name: seaweedfs
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

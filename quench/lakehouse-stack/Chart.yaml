apiVersion: v2
name: lakehouse-stack
description: "Hardened open lakehouse: Trino queries Apache Iceberg tables cataloged by Nessie and stored in SeaweedFS over S3, wired together with generated S3 keys and a bucket created at install. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.24
appVersion: "1.0.0"
keywords:
  - trino
  - iceberg
  - nessie
  - seaweedfs
  - lakehouse
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/trinodb/trino
  - https://github.com/projectnessie/nessie
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles nessie=0.0.7,seaweedfs=0.0.28,trino=0.0.13 (the 2026-11-02 re-pin)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: trino
      image: ghcr.io/quenchworks/images/trino@sha256:dcf1f0854253eb98272272efdc7a7c5ba55a50956e1a02b5939c1f05474270cf
    - name: nessie
      image: ghcr.io/quenchworks/images/nessie@sha256:9f0ab7581fb020caff51b8b4e149e3aefcdaffa196751afd664265f911d76d3f
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:30098690bfb16aec1ef37a6d256dd1abc11c1c9b6134e26ce9395afd8e7b14c9
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:f92483caac15c0f2d75751a86438c8ae76079d74e4e4f0d4289cdfcf61571388
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: trino
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: trino.enabled
  - name: nessie
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: nessie.enabled
  - name: seaweedfs
    version: 0.0.28
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

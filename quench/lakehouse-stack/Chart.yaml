apiVersion: v2
name: lakehouse-stack
description: "Hardened open lakehouse: Trino queries Apache Iceberg tables cataloged by Nessie and stored in SeaweedFS over S3, wired together with generated S3 keys and a bucket created at install. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.8
appVersion: "1.0.0"
keywords:
  - trino
  - iceberg
  - nessie
  - seaweedfs
  - lakehouse
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/trinodb/trino
  - https://github.com/projectnessie/nessie
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "2026-10-04 security rebuilds: vm2, gitea runner, jackson-core, OpenSSL 4, basic-ftp, Wolfi python/pip/npm"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: trino
      image: ghcr.io/quenchworks/images/trino@sha256:f5c24a9d5bb82cf973aa5b5b9d6763d5488eb0fd18590141cdde52243e663dc9
    - name: nessie
      image: ghcr.io/quenchworks/images/nessie@sha256:79193738c4f4766018df8cb5f3c910b7dc8fc5f883ea343dedb2c542581a2a5a
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:10e43740cdf4fb4aa821d2272df73214dbccc34c48dd5ef854f4f22f62d6df8d
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:283c1e9a365c3ab48f92713469e9cc9a61c1377b81b2908c69bae19c3843e105
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: trino
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: trino.enabled
  - name: nessie
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts
    condition: nessie.enabled
  - name: seaweedfs
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

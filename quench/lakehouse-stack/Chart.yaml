apiVersion: v2
name: lakehouse-stack
description: "Hardened open lakehouse: Trino queries Apache Iceberg tables cataloged by Nessie and stored in SeaweedFS over S3, wired together with generated S3 keys and a bucket created at install. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.32
appVersion: "1.0.0"
keywords:
  - trino
  - iceberg
  - nessie
  - seaweedfs
  - lakehouse
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/trinodb/trino
  - https://github.com/projectnessie/nessie
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: trino
      image: ghcr.io/quenchworks/images/trino@sha256:adf530768c128cc8fb1fc16be8d785c33b1a1175dfc8c644133ad410285f2523
    - name: nessie
      image: ghcr.io/quenchworks/images/nessie@sha256:37f273c73301b4a6fc43c53ad66f706f084aa118b0a57e087148477746a646ae
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:8d225b663b6429b66946e56dc1151c8fd3ca2d39c65673cafb15a159d31dc63d
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:04230b53a44e29a1c74d9ecb4b50c71eb50f474fd1e5989093209a2094445133
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: trino
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: trino.enabled
  - name: nessie
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: nessie.enabled
  - name: seaweedfs
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

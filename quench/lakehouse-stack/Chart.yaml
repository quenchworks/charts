apiVersion: v2
name: lakehouse-stack
description: "Hardened open lakehouse: Trino queries Apache Iceberg tables cataloged by Nessie and stored in SeaweedFS over S3, wired together with generated S3 keys and a bucket created at install. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "1.0.0"
keywords:
  - trino
  - iceberg
  - nessie
  - seaweedfs
  - lakehouse
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/trinodb/trino
  - https://github.com/projectnessie/nessie
  - https://github.com/seaweedfs/seaweedfs
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pin to the floor-pass rebuild (go get pins no longer downgrade modules)."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: trino
      image: ghcr.io/quenchworks/images/trino@sha256:f5c24a9d5bb82cf973aa5b5b9d6763d5488eb0fd18590141cdde52243e663dc9
    - name: nessie
      image: ghcr.io/quenchworks/images/nessie@sha256:79193738c4f4766018df8cb5f3c910b7dc8fc5f883ea343dedb2c542581a2a5a
    - name: seaweedfs
      image: ghcr.io/quenchworks/images/seaweedfs@sha256:d884b75765cfb710de2987f5e9d2a38cbc85a77f3497ab393dcc3fe6701c6f32
    - name: rclone
      image: ghcr.io/quenchworks/images/rclone@sha256:99e6849d9b5a82667d934d98baffa0bcc67a47181ec2bc908f375ef1e4d38477
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: trino
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: trino.enabled
  - name: nessie
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: nessie.enabled
  - name: seaweedfs
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: seaweedfs.enabled

    - kind: security
      description: "nessie 0.108.8 image rebuilt: jackson-databind fixed (2026-10-01 advisories)"
    - kind: security
      description: "trino 483 image rebuilt: jackson-databind fixed (2026-10-01 advisories)"
    - kind: changed
      description: "bundles trino 0.0.6 (rebuilt image)"
    - kind: changed
      description: "bundles nessie 0.0.2 (rebuilt image)"
  artifacthub.io/category: database

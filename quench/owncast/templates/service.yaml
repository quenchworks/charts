{{- /* The web player, chat, HLS and admin UI. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
    {{- if include "quench-common.tls.enabled" . }}
    - { name: https, port: {{ .Values.service.httpsPort }}, targetPort: https, protocol: TCP }
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
{{- /* RTMP ingest for OBS or ffmpeg (plain RTMP: Owncast has no RTMPS). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-rtmp
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.rtmpService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.rtmpService.type }}
  {{- with .Values.rtmpService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - { name: rtmp, port: {{ .Values.rtmpService.port }}, targetPort: rtmp, protocol: TCP }
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{- /* The admin password and the stream key, generated once and read back on upgrade. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := include "owncast.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
{{- $pw := .Values.admin.password | default (get $old "admin-password" | b64dec) | default (randAlphaNum 24) }}
{{- $key := .Values.admin.streamKey | default (get $old "stream-key" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  stream-key: {{ $key | b64enc | quote }}
{{- end }}

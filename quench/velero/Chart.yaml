apiVersion: v2
name: velero
description: "Velero, the CNCF backup and disaster-recovery controller for Kubernetes cluster resources and persistent volumes. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Runs the velero server as a single Deployment; object-store and volume-snapshot backends are plugged in as initContainers."
type: application
version: 0.1.2
appVersion: "1.18.2"
keywords:
  - velero
  - backup
  - restore
  - disaster-recovery
  - snapshot
  - storage
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/vmware-tanzu/velero
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial QuenchWorks Velero chart: server Deployment, cluster RBAC, plugin initContainer support, optional BackupStorageLocation and metrics Service."
  artifacthub.io/category: storage
  artifacthub.io/images: |
    - name: velero
      image: ghcr.io/quenchworks/images/velero@sha256:6d22413905ef1e3c2c04197fb2b6b446665ad9f2e72050dc75894b3029d196f8
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: BackupStorageLocation
      version: v1
      name: backupstoragelocations.velero.io
      displayName: Backup Storage Location
      description: Where Velero stores backup tarballs and metadata (an object-store bucket).
    - kind: Backup
      version: v1
      name: backups.velero.io
      displayName: Backup
      description: A request to back up a set of cluster resources (and optionally volumes).
    - kind: Restore
      version: v1
      name: restores.velero.io
      displayName: Restore
      description: A request to restore resources from a backup.
    - kind: Schedule
      version: v1
      name: schedules.velero.io
      displayName: Schedule
      description: A cron schedule that produces Backups.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts

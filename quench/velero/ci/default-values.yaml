# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Velero reaches Ready here without any cloud credentials: the CRDs come from the
# chart's crds/ dir, and with backupStorageLocation.create=false the server boots
# idle (no BSL to reconcile, no provider plugin required) and answers /metrics.
# That is enough for the rollout/Ready gate.
replicaCount: 1
backupStorageLocation:
  create: false
rbac:
  create: true
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 1000m, memory: 512Mi }

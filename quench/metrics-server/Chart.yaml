apiVersion: v2
name: metrics-server
description: "Kubernetes Metrics Server, the cluster-wide aggregator of container resource metrics that backs `kubectl top` and the Horizontal Pod Autoscaler. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.9.0"
keywords:
  - metrics-server
  - metrics
  - kubectl-top
  - autoscaling
  - hpa
  - monitoring
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes-sigs/metrics-server
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Metrics Server 0.9.0 on the hardened QuenchWorks image, registering the v1beta1.metrics.k8s.io APIService with clean-room delegated-auth RBAC. Kubelet certificate verification stays ON by default."
    - kind: fixed
      description: "Re-pinned before first release to the 0.9.0 image; the originally pinned 0.8.1 image crash-loops with \"Failed to build open api spec for root: cannot find model definition for io.k8s.apimachinery.pkg.version.Info\" and never becomes Ready."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: metrics-server
      image: ghcr.io/quenchworks/images/metrics-server@sha256:17af75b28850741938443d738c21a761cae2da464bbebd46b6bf17d4c01ecf40
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

# Quenchworks Karapace: the Kafka schema registry and REST proxy on the QuenchWorks
# karapace image (nonroot, 0-CVE, cosign-signed, pinned by digest). Both read their
# settings from KARAPACE_* variables; the chart sets the connection ones and passes the
# rest through config.
image:
  repository: ghcr.io/quenchworks/images/karapace
  digest: "sha256:5dc9f086aeabe8ee3c7188667b54e16ec75d533196ba9f1d7e24e093e0f238f6"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

kafka:
  # Kafka bootstrap servers, e.g. kafka.data.svc:9092 (required)
  bootstrapServers: ""

registry:
  # Registry replicas elect a primary through the Kafka group; followers forward writes.
  replicas: 1
  # schemas topic and its replication factor (raise to 3 on a 3-broker cluster)
  topicName: _schemas
  replicationFactor: 1
  compatibility: BACKWARD
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

restProxy:
  enabled: false
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# Any other Karapace setting, as KARAPACE_ variables without the prefix, e.g.
#   config:
#     SECURITY_PROTOCOL: SASL_SSL
#     SASL_MECHANISM: SCRAM-SHA-512
#     LOG_LEVEL: INFO
config: {}
# Secret-backed settings (passwords): a Secret whose keys are KARAPACE_* variable names.
existingSecret: ""

extraEnvVars: []
nodeSelector: {}
tolerations: []
affinity: {}

# Native TLS: the registry and the REST proxy serve https on their ports, and the proxy reaches
# the registry over TLS with the chart CA; the certificate names both Services. Needs
# registry.replicas=1 for now (followers forward to the primary by pod IP). It comes from the
# first source set: existingSecret, then a cert-manager Certificate, else a Helm-generated CA.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

service:
  type: ClusterIP
  registryPort: 8081
  restProxyPort: 8082

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

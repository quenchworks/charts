{{- $r := .Values.registry -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-registry
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: {{ $r.replicas }}
  selector:
    matchLabels:
      {{- include "karapace.selectorLabels" (dict "ctx" . "component" "registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karapace.selectorLabels" (dict "ctx" . "component" "registry") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "karapace.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: registry
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/karapace/venv/bin/python", "-m", "karapace"]
          env:
            - name: KARAPACE_KARAPACE_REGISTRY
              value: "true"
            - name: KARAPACE_PORT
              value: "8081"
            # followers forward writes to the primary by this address: the pod's own IP
            - name: KARAPACE_ADVERTISED_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KARAPACE_TOPIC_NAME
              value: {{ $r.topicName | quote }}
            - name: KARAPACE_REPLICATION_FACTOR
              value: {{ $r.replicationFactor | quote }}
            - name: KARAPACE_COMPATIBILITY
              value: {{ $r.compatibility | quote }}
            {{- if include "quench-common.tls.enabled" . }}
            # native TLS: this server serves https on its port
            - name: KARAPACE_SERVER_TLS_CERTFILE
              value: /tls/tls.crt
            - name: KARAPACE_SERVER_TLS_KEYFILE
              value: /tls/tls.key
            - name: KARAPACE_ADVERTISED_PROTOCOL
              value: https
            {{- end }}
            {{- include "karapace.env" . | nindent 12 }}
          {{- include "karapace.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
              {{- if include "quench-common.tls.enabled" . }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-registry
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.registryPort }}
      targetPort: http
  selector:
    {{- include "karapace.selectorLabels" (dict "ctx" . "component" "registry") | nindent 4 }}

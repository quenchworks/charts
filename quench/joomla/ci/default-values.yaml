# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest from values.yaml. Bundles MariaDB on a small PVC with deterministic credentials
# and small resources for the runner. --wait passes only once the init container has
# run the CLI installer against MariaDB and the front page renders.
joomla:
  admin:
    password: ci-test-admin-password
mariadb:
  enabled: true
  auth:
    rootPassword: ci-test-root-password
    password: ci-test-password
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
persistence:
  size: 1Gi

  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/joomla/joomla-cms
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: joomla
      image: ghcr.io/quenchworks/images/joomla@sha256:de98fb2f8523e6c8fd6e70a0e7e3354a3aa5c8347e40df73840e68c6282889f5
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:cbbc5155a64005079f7ad67701244989f70229feb96830424bd36228af628227
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

apiVersion: v2
name: joomla
description: Hardened Joomla CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, installed by its CLI installer into a bundled MariaDB.
type: application
version: 0.0.1
appVersion: "6.1.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/joomla/joomla-cms
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - joomla
  - cms
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Joomla 6.1 with a CLI-installer init container and a bundled MariaDB."
  # A CMS fits no ArtifactHub category; skip-prediction is AH's "none fits" value (as quench/wordpress).
  category: skip-prediction
  licenses: GPL-2.0-or-later
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: GPL-2.0-or-later
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/joomla/joomla-cms
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: joomla
      image: ghcr.io/quenchworks/images/joomla@sha256:6acc639a1298c54ea7e45ec42ca37e36609fefdf2440dd79b829372c305e1096
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:147848cf3b18956a3ba15b3db79fa81ab3bc6013048379cad06c476c0eb8eed5
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.19
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

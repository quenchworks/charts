apiVersion: v2
name: joomla
description: Hardened Joomla CMS (PHP-FPM + nginx) on a 0-CVE nonroot image, installed by its CLI installer into a bundled MariaDB.
type: application
version: 0.0.12
appVersion: "6.1.4"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/joomla/joomla-cms
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - joomla
  - cms
  - publishing
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:

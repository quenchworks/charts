{{- $fullname := include "quench-common.fullname" . -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-media
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if not .Values.configPersistence.existingClaim }}
---
# Always a PVC: losing configuration.php would make the next start reinstall over a
# live database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.configPersistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.configPersistence.accessModes | nindent 4 }}
  {{- if .Values.configPersistence.storageClass }}
  storageClassName: {{ .Values.configPersistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.configPersistence.size }}
{{- end }}

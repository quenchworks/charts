{{/* Readiness asks for the front page, which renders only once configuration.php exists
     and the database answers, so --wait on readiness is an integration test. */}}
{{- $liveness := dict "httpGet" (dict "path" "/" "port" "http") "initialDelaySeconds" 20 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $fullname := include "quench-common.fullname" . -}}
{{/* Writable paths on the read-only docroot. The installer writes tmp and logs paths
     under these into configuration.php. */}}
{{- $scratch := list (list "tmp" "/tmp") (list "site-tmp" "/var/www/html/tmp") (list "cache" "/var/www/html/cache") (list "admin-cache" "/var/www/html/administrator/cache") (list "admin-logs" "/var/www/html/administrator/logs") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The config and media PVCs are ReadWriteOnce; Recreate keeps two pods from
  # contending for them during a rollout.
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "joomla.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        - name: install
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "/etc/joomla/install/install.sh"]
          env:
            - name: JOOMLA_CONFIG_DIR
              value: /var/www/config
            - name: JOOMLA_SITE_NAME
              value: {{ .Values.joomla.siteName | quote }}
            - name: JOOMLA_ADMIN_NAME
              value: {{ .Values.joomla.admin.name | quote }}
            - name: JOOMLA_ADMIN_USERNAME
              value: {{ .Values.joomla.admin.username | quote }}
            - name: JOOMLA_ADMIN_EMAIL
              value: {{ .Values.joomla.admin.email | quote }}
            - name: JOOMLA_DB_TYPE
              value: {{ .Values.database.type | quote }}
            - name: JOOMLA_DB_HOST
              value: {{ include "joomla.db.host" . | quote }}
            - name: JOOMLA_DB_PORT
              value: {{ include "joomla.db.port" . | quote }}
            - name: JOOMLA_DB_NAME
              value: {{ include "joomla.db.name" . | quote }}
            - name: JOOMLA_DB_USER
              value: {{ include "joomla.db.user" . | quote }}
            - name: JOOMLA_DB_PREFIX
              value: {{ .Values.database.prefix | quote }}
            - name: JOOMLA_DB_WAIT
              value: {{ .Values.init.dbWaitSeconds | quote }}
          resources:
            {{- toYaml .Values.init.resources | nindent 12 }}
          volumeMounts:
            - name: install
              mountPath: /etc/joomla/install
              readOnly: true
            - name: secrets
              mountPath: /etc/joomla/secrets
              readOnly: true
            - name: config
              mountPath: /var/www/config
            {{- range $scratch }}
            - name: {{ index . 0 }}
              mountPath: {{ index . 1 }}
            {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: joomla
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: JOOMLA_CONFIG_DIR
              value: /var/www/config
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /var/www/config
            - name: media
              mountPath: /var/www/html/images
            {{- range $scratch }}
            - name: {{ index . 0 }}
              mountPath: {{ index . 1 }}
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: install
          configMap:
            name: {{ $fullname }}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "joomla.admin.secretName" . }}
                  items:
                    - key: {{ include "joomla.admin.secretKey" . }}
                      path: admin-password
              - secret:
                  name: {{ include "joomla.db.secretName" . }}
                  items:
                    - key: {{ include "joomla.db.secretKey" . }}
                      path: db-password
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.configPersistence.existingClaim | default (printf "%s-config" $fullname) }}
        - name: media
        {{- if not .Values.persistence.enabled }}
          emptyDir: {}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-media" $fullname) }}
        {{- end }}
        {{- range $scratch }}
        - name: {{ index . 0 }}
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Run by the init container. The CLI installer has no password-file options, so the
  # passwords pass as installer arguments; they come from the mounted Secret files and
  # are visible only inside this container.
  install.sh: |
    set -eu
    if [ -s "$JOOMLA_CONFIG_DIR/configuration.php" ]; then
      echo "configuration.php exists, Joomla is installed"
      exit 0
    fi
    # The installer fails on an unreachable database, and a half-run install leaves
    # tables behind, so wait for the port first. busybox here has no nc; PHP does it.
    echo "waiting for $JOOMLA_DB_HOST:$JOOMLA_DB_PORT"
    php -r '$t = time() + (int) getenv("JOOMLA_DB_WAIT");
      while (!($s = @fsockopen(getenv("JOOMLA_DB_HOST"), (int) getenv("JOOMLA_DB_PORT"), $e, $m, 3))) {
        if (time() > $t) { fwrite(STDERR, "database not reachable: $m\n"); exit(1); }
        sleep(2);
      }'
    cd /var/www/html
    php installation/joomla.php install --no-interaction \
      --site-name="$JOOMLA_SITE_NAME" \
      --admin-user="$JOOMLA_ADMIN_NAME" \
      --admin-username="$JOOMLA_ADMIN_USERNAME" \
      --admin-email="$JOOMLA_ADMIN_EMAIL" \
      --admin-password="$(cat /etc/joomla/secrets/admin-password)" \
      --db-type="$JOOMLA_DB_TYPE" \
      --db-host="$JOOMLA_DB_HOST:$JOOMLA_DB_PORT" \
      --db-user="$JOOMLA_DB_USER" \
      --db-pass="$(cat /etc/joomla/secrets/db-password)" \
      --db-name="$JOOMLA_DB_NAME" \
      --db-prefix="$JOOMLA_DB_PREFIX" \
      --db-encryption=0
    test -s "$JOOMLA_CONFIG_DIR/configuration.php"

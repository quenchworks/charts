{{/*
The managed Secret carries the installer's super-user password (unless
joomla.admin.existingSecret supplies it) and, for an external database without an
existingSecret, the DB password. Values are read back from the existing Secret so they
stay stable across upgrades. The bundled MariaDB's password lives in its own Secret,
which the pod reads directly.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $admin := not .Values.joomla.admin.existingSecret -}}
{{- $db := and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $admin $db }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $admin }}
  {{- $pw := .Values.joomla.admin.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "admin-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $db }}
  {{- $pw := .Values.externalDatabase.password }}
  {{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
  {{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
  db-password: {{ $pw | b64enc | quote }}
  {{- end }}
{{- end }}

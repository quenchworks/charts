{{/*
Pgpool-II ships no HTTP/health endpoint, and by design it must STAY UP while a backend
is down (that is when failover and node detach happen), so the pod-level probe is a
tcpSocket check on the client listener: once 9999 accepts, the pooler is serving. The
real end-to-end check — `SELECT 1` and `SHOW POOL_NODES` over the pooler — is the
release workflow's install gate, which is where a dead-but-listening service would be
caught.
*/}}
{{- $liveness := dict "tcpSocket" (dict "port" "pgpool") "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 3 "failureThreshold" 6 -}}
{{- $readiness := dict "tcpSocket" (dict "port" "pgpool") "initialDelaySeconds" 5 "periodSeconds" 10 "timeoutSeconds" 3 "failureThreshold" 6 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the rendered config or the credential files change.
        checksum/config: {{ print (include "pgpool.conf" .) (include "pgpool.hba" .) | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pgpool.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: pgpool
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: pgpool
              containerPort: {{ .Values.service.port }}
            - name: pcp
              containerPort: {{ .Values.service.pcpPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The entrypoint reads these exact paths (-f / -a / -F plus pool_passwd from
            # pgpool.conf), so each file is mounted over the image's baked-in default.
            - name: config
              mountPath: /etc/pgpool/pgpool.conf
              subPath: pgpool.conf
              readOnly: true
            - name: config
              mountPath: /etc/pgpool/pool_hba.conf
              subPath: pool_hba.conf
              readOnly: true
            - name: passwd
              mountPath: /etc/pgpool/pool_passwd
              subPath: pool_passwd
              readOnly: true
            - name: pcp
              mountPath: /etc/pgpool/pcp.conf
              subPath: pcp.conf
              readOnly: true
            # Read-only rootfs: the client + PCP unix sockets and the pidfile go here.
            - name: run
              mountPath: /var/run/pgpool
            # pgpool_status and the lock files. Pgpool-II's default location is /tmp and
            # the parameter was renamed (logdir <= 4.6 -> work_dir >= 4.7), so the config
            # sets neither name and /tmp is simply made writable.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pgpool.configMapName" . }}
        - name: passwd
          secret:
            secretName: {{ include "pgpool.poolPasswdSecretName" . }}
        - name: pcp
          secret:
            secretName: {{ include "pgpool.pcpSecretName" . }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

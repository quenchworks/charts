apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: pgpool
      name: pgpool
      protocol: TCP
    # PCP admin protocol (pcp_node_count, pcp_detach_node, pcp_recovery_node, ...).
    - port: {{ .Values.service.pcpPort }}
      targetPort: pcp
      name: pcp
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

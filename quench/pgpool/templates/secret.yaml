{{/*
pool_passwd — the credential store Pgpool-II reads. Each line is:
    username:password
An UNPREFIXED value is treated as PLAINTEXT, which is exactly what scram-sha-256 needs:
Pgpool-II uses it to verify the client over SCRAM AND to authenticate to the backends,
and it also resolves the (deliberately blank) health_check_password / sr_check_password
from here, so no credential is ever written into the ConfigMap.

When poolPasswd.existingSecret is set the user owns the file and we render nothing.
*/}}
{{- if not .Values.poolPasswd.existingSecret }}
{{- $user := include "pgpool.db.user" . -}}
{{- $pw := include "pgpool.db.password" . -}}
{{- $lines := list -}}
{{- if $pw -}}
{{- $lines = append $lines (printf "%s:%s" $user $pw) -}}
{{- end -}}
{{- range $u, $p := .Values.poolPasswd.extraUsers -}}
{{- $lines = append $lines (printf "%s:%s" $u $p) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-passwd" (include "quench-common.fullname" .) }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  pool_passwd: {{ printf "%s\n" (join "\n" $lines) | b64enc | quote }}
{{- end }}
---
{{/*
pcp.conf — the PCP admin protocol's password file on port 9898. Format is
"username:md5(password)" (plain unsalted MD5 of the password, same as `pg_md5`).
Values in pcp.users are the MD5 HASHES, not plaintext: Helm's sprig has no md5
function, and hashing client-side keeps the plaintext out of the release values.
Generate one with `pg_md5 <password>` or `printf %s <password> | md5sum`.

Empty by default: the listener is up but nobody can authenticate, which is the safe
default. Add pcp.users to run pcp_node_count / pcp_detach_node against the pod.
*/}}
{{- if not .Values.pcp.existingSecret }}
{{- $pcp := list -}}
{{- range $u, $h := .Values.pcp.users -}}
{{- $pcp = append $pcp (printf "%s:%s" $u $h) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-pcp" (include "quench-common.fullname" .) }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  pcp.conf: {{ printf "%s\n" (join "\n" $pcp) | b64enc | quote }}
{{- end }}

apiVersion: v2
name: pgpool
description: "PostgreSQL connection pooler, load balancer and query router. Pools client connections, spreads read-only queries across replicas, and fails over to a new primary automatically. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "4.7.2"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
keywords:
  - pgpool
  - pgpool-ii
  - postgresql
  - connection-pooler
  - load-balancer
  - failover
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
sources:
  - https://github.com/quenchworks/charts
  - https://git.postgresql.org/gitweb/?p=pgpool2.git
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled PostgreSQL moves to 0.0.26 (18.6 rebuilt: Patroni psycopg no longer carries its own OpenSSL 3.5.8)."
  artifacthub.io/license: HPND
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: pgpool
      image: ghcr.io/quenchworks/images/pgpool@sha256:55b82e469be0654aa79641d3b8f5cc960aaa14650966748f987adbe393325812
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:086dc72597074662dfb828f7f58a0093f98123405cf4bc109a1bd859bc576f21
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

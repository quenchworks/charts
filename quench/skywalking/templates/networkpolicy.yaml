{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agent data (gRPC 11800) + query/GraphQL (HTTP 12800). Default restricts ingress to the
    # release namespace (allowExternal: false); set it true when agents/UI live elsewhere.
    - ports:
        - port: grpc
          protocol: TCP
        - port: rest
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Elasticsearch storage (bundled subchart or external cluster).
    - ports:
        - port: 9200
          protocol: TCP
    # General egress (alternate storage backends, telemetry, etc.).
    - {}
{{- end }}

{{/*
Managed Secret for the Elasticsearch password OAP authenticates with, under es-password. It
is injected into the pod as SW_ES_PASSWORD via secretKeyRef so the password never appears in
the pod's argv / process list. Rendered only when storage.elasticsearch.password is set and no
externalDatabase-style existingSecret is supplied; with an existingSecret this chart renders no
Secret and reads the password from the referenced one instead. The bundled Elasticsearch
subchart runs with security disabled, so no password is needed by default.
*/}}
{{- if include "skywalking.es.manageSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  es-password: {{ .Values.storage.elasticsearch.password | b64enc | quote }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Agent data ingestion (SkyWalking agents connect here).
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      name: grpc
      protocol: TCP
    # GraphQL query API + health (a SkyWalking UI / Grafana / clients read from here).
    - port: {{ .Values.service.restPort }}
      targetPort: rest
      name: rest
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

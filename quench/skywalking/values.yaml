# The digest below is the contract with the image factory. CI rewrites it from the
# image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/skywalking
  digest: "sha256:92d7131dd02a99da25913a2ee091ccc4a0b7a968bcfff3c5f34d4a9bb7821a96"
  pullPolicy: IfNotPresent

nameOverride: ""

# This chart deploys the SkyWalking OAP SERVER only. The Quenchworks image ships the OAP
# backend (the CVE surface Trivy scans) and deliberately DROPS the Rocketbot web UI to keep
# that surface minimal, so there is NO UI workload here. OAP exposes gRPC 11800 (agents push
# trace/metric/log data) and HTTP 12800 (GraphQL query API + health). Point a SkyWalking UI,
# Grafana, or any GraphQL client at the REST port to read the data. OAP is stateless — all
# durable state lives in the storage backend — so it runs as a Deployment and scales out.
replicaCount: 1

# OAP is a JVM app. JAVA_OPTS sets its heap; raise the max for production ingest volume.
oap:
  javaOpts: "-Xms256M -Xmx2048M"

# --- Storage backend ---
# SkyWalking 10.2+ REMOVED the H2 embedded store; OAP has NO built-in storage and REQUIRES
# an external backend to become Ready.
#
# storage.type is the SW_STORAGE selector and stays "elasticsearch": OAP 10.4 has no separate
# opensearch selector — its Elasticsearch client reads the distribution off the cluster root and
# switches dialect, so the same driver serves both. What it will NOT serve is Elasticsearch 9;
# ElasticSearchVersion accepts ES 6/7/8 and any OpenSearch, and throws
# "Unsupported version: ElasticSearch 9.4" on anything newer. The Quenchworks Elasticsearch
# chart ships ES 9, so the bundled backend here is OpenSearch (opensearch.* below).
#
# Either bundle it (opensearch.enabled=true, self-contained) or point
# storage.elasticsearch.clusterNodes at an external cluster — an OpenSearch cluster or a real
# Elasticsearch 8, both of which OAP supports. Other selectors (banyandb, mysql, postgresql)
# are reachable via storage.type + extraEnvVars, but only the ES/OpenSearch driver is
# first-class wired here.
storage:
  type: elasticsearch
  elasticsearch:
    # host:port (comma-separated) of an EXTERNAL cluster. Used only when opensearch.enabled=false.
    # When opensearch.enabled=true the chart wires OAP to the bundled "<release>-opensearch:9200".
    # An external Elasticsearch must be 8.x or older — OAP 10.4 rejects ES 9.
    clusterNodes: ""
    protocol: http
    namespace: ""
    # Auth for a secured cluster (the bundled subchart runs with security disabled, so leave blank).
    user: ""
    password: ""              # rendered into this chart's managed Secret if set (and no existingSecret)
    existingSecret: ""        # a Secret already holding the ES password
    existingSecretPasswordKey: "es-password"

# --- Bundled OpenSearch storage (OPTIONAL, disabled by default) ---
# When enabled, the Quenchworks OpenSearch subchart is deployed and OAP is wired to
# "<release>-opensearch:9200". Disabled by default so the default render is dependency-light;
# production should enable it (or supply an external cluster via storage.elasticsearch.clusterNodes).
#
# The subchart's 0.1.x layout: `mode` picks the topology and heap/persistence live under the
# matching section; `config` is clusterName/extraConfig/securityDisabled only. `single` is the
# right shape for a bundled backend — switch to mode: ha (and size master/data) or move to an
# external cluster when OAP's ingest outgrows one node.
opensearch:
  enabled: false
  mode: single
  single:
    heapSize: 1g
    persistence:
      enabled: true
      size: 16Gi

# Resources. OAP idles ~500MB-1GB heap; grows with ingest volume and query load. Defaults
# schedule anywhere; the CI gate overrides them smaller.
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2560Mi }

# OAP receiver (gRPC 11800, agent data) + query/GraphQL (HTTP 12800, UI/health).
service:
  type: ClusterIP
  grpcPort: 11800
  restPort: 12800

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
# Extra env vars (list of {name,value} or {name,valueFrom}). Appended after the chart's own
# env, so these win on conflict. Use for SW_CLUSTER, SW_RECEIVER_*, alternate SW_STORAGE_* keys, etc.
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (nonroot uid 1001,
# read-only rootfs). OAP writes only logs and JVM temp files, both backed by writable
# emptyDir mounts, so the read-only rootfs default is kept. Your keys still win on conflict.
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
# Liveness watches the gRPC port (binds early — proves the JVM is alive); readiness watches
# the query port (opens only after OAP finished module init against storage).
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
# OAP's first boot is slow: JVM start, then connect to storage and create/verify all indices
# before the query port opens — often 60-180s on a fresh store. A startup probe gates
# liveness/readiness on the query port until OAP is actually up, so the slow boot isn't killed
# mid-init. Up to 600s grace (60 x 10s); after it passes, normal probe timing resumes.
customStartupProbe:
  tcpSocket:
    port: rest
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

# Ingress opens the agent (gRPC 11800) and query (HTTP 12800) ports. Default restricts them
# to the release namespace (allowExternal: false); set true when agents/UI live in other
# namespaces or you front OAP with a gateway. Egress opens DNS + the store port plus general egress.
networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

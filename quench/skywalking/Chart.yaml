      image: ghcr.io/quenchworks/images/skywalking@sha256:c5d30d8fbf30bf846657d6c928a749cc193b940e79ce513565c4e31eccddec6c
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:36f153657718e39bdfdecc8f3fd8c6fb1a788462f543fcfc5c5a3f02a411a2c3
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts

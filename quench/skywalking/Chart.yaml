apiVersion: v2
name: skywalking
description: Hardened Apache SkyWalking OAP (Observability Analysis Platform) backend — APM metrics/traces/logs collector — on a 0-CVE nonroot image, with an optional bundled OpenSearch storage backend.
type: application
version: 0.0.23
appVersion: "11.0.0"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/apache/skywalking
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - skywalking
  - apm
  - observability
  - tracing
  - monitoring
  - oap
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:

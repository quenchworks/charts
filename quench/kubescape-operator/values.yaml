# Kubescape components, each pinned by digest. They find each other by fixed Service names
# (operator, kubescape, kubevuln, storage) in the release namespace, so one release per cluster.
operator:
  image:
    repository: ghcr.io/quenchworks/images/kubescape-operator
    digest: "sha256:da72f75c25d19c2ec3e3f4a994571b510717d61f77278a5d6565bf6f7e1a89c0"
  resources:
    requests: { cpu: 50m, memory: 100Mi }
    limits: { cpu: 300m, memory: 300Mi }
kubescape:
  image:
    repository: ghcr.io/quenchworks/images/kubescape
    digest: "sha256:7cb3b81f54d53aa7a406831cf19a36891460311b09d44996dc842a437ff7038e"
  resources:
    requests: { cpu: 250m, memory: 400Mi }
    limits: { cpu: 600m, memory: 1Gi }
kubevuln:
  image:
    repository: ghcr.io/quenchworks/images/kubevuln
    digest: "sha256:d28e2714371fa71421053343ec577dc23d1df4bd61082291bc76c7e4c6b6f611"
  resources:
    requests: { cpu: 300m, memory: 1000Mi }
    limits: { cpu: 1500m, memory: 5000Mi }
  # Images larger than this are skipped (bytes).
  maxImageSize: 5368709120
  scanTimeout: 5m
storage:
  image:
    repository: ghcr.io/quenchworks/images/kubescape-storage
    digest: "sha256:f92ab89f15492300ad7d2e4f8b1082ee2aab2070f488db97191a62c485c9b1f2"
  resources:
    requests: { cpu: 100m, memory: 400Mi }
    limits: { cpu: 1500m, memory: 1500Mi }
  # Scan results live in a SQLite file under /data. Off: an emptyDir (results go with the pod).
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  cleanupInterval: 6h

# Scans are triggered through the operator's REST API (POST v1/triggerAction), the way upstream's
# scheduler does it: a post-install Job runs the first configuration and vulnerability scan, and a
# CronJob repeats them. Both use the kubectl image and reach the operator through the API server's
# service proxy, so they need no network policy exception and no extra image.
scheduler:
  enabled: true
  schedule: "17 3 * * *"
  scanOnInstall: true
  image:
    repository: ghcr.io/quenchworks/images/kubectl
    digest: "sha256:924a275fd41f0e83a6cfdac29eea1587ebc88fc91d400e9c766bc9601b1f986c"

imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Shown on results and used as the kubescape context name.
clusterName: cluster
# Namespaces left out of scanning, comma separated.
excludeNamespaces: "kube-system,kube-public,kube-node-lease"
# Scan workloads in these namespaces as soon as they change (cs-matching-rules).
continuousScanNamespaces: []

logger:
  level: info

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}

# The node agent (opt-in): a privileged eBPF DaemonSet that learns what each container runs,
# opens and calls, and stores it as application profiles (kubectl get applicationprofiles -A).
# Runtime threat detection, malware scanning and host sensing are not enabled.
nodeAgent:
  enabled: false
  image:
    repository: ghcr.io/quenchworks/images/kubescape-node-agent
    digest: "sha256:af6cb0fe25efc9232c09b362e66d9a75e35211d3048f7f013a8d9e635d480862"
  resources:
    requests: { cpu: 100m, memory: 180Mi }
    limits: { cpu: 500m, memory: 1400Mi }
  # Wait this long after a container starts before recording, write the profile this often,
  # and finish learning a container after maxLearningPeriod.
  learningPeriod: 2m
  updatePeriod: 10m
  maxLearningPeriod: 24h

# Install gate: a small cluster name and no PVC dependency on the kind storage class timing.
clusterName: kind-gate
storage:
  persistence:
    enabled: false
# The node agent learns the demo workload's profile: short periods so the gate sees one written.
nodeAgent:
  enabled: true
  learningPeriod: 30s
  updatePeriod: 1m
  maxLearningPeriod: 4m

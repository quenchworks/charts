---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storage
    spec:
      serviceAccountName: storage
      {{- include "ks.podSpec" . | nindent 6 }}
      containers:
        - name: storage
          image: "{{ .Values.storage.image.repository }}@{{ .Values.storage.image.digest }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "ks.containerSecurity" . | nindent 10 }}
          env:
            {{- include "ks.env" . | nindent 12 }}
          ports:
            - { name: https, containerPort: 8443 }
          livenessProbe:
            httpGet: { path: /livez, port: https, scheme: HTTPS }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.storage.resources | nindent 12 }}
          volumeMounts:
            {{- include "ks.clusterDataMount" . | nindent 12 }}
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /etc/config/config.json, subPath: config.json, readOnly: true }
            - { name: certs, mountPath: /etc/storage-ca-certificates, readOnly: true }
      volumes:
        {{- include "ks.clusterDataVolume" . | nindent 8 }}
        - name: data
          {{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim: { claimName: kubescape-storage }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - { name: tmp, emptyDir: {} }
        - { name: config, configMap: { name: storage } }
        - { name: certs, secret: { secretName: storage-tls } }

---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  ports:
    - { name: https, port: 443, targetPort: https }

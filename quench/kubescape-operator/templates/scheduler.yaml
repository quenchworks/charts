{{- if or .Values.scheduler.enabled .Values.scheduler.scanOnInstall }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubescape-scheduler
  namespace: {{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
data:
  # A configuration scan and a vulnerability scan of every running image, as the OperatorCommand
  # objects upstream's kubescape-ops-tool creates: spec.body is one command, base64; spec.guid is
  # filled per run.
  {{- range $name, $cmd := dict "kubescape" `{"CommandName":"kubescapeScan","args":{"scanV1":{}}}` "kubevuln" `{"commandName":"scan","designators":[{"designatorType":"Attributes","attributes":{}}]}` }}
  {{ $name }}.yaml: |
    apiVersion: kubescape.io/v1alpha1
    kind: OperatorCommand
    metadata:
      generateName: kubescape-scheduler-
      labels: { kubescape.io/app-name: operator }
    spec: { guid: __GUID__, commandType: OperatorAPI, body: {{ b64enc $cmd }} }
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescape-scheduler
  namespace: {{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
---
# Scans are requested as OperatorCommand objects, which the operator watches. (Its HTTP
# triggerAction now demands an API token that the API server's service proxy would not pass on.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubescape-scheduler
  namespace: {{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
rules:
  - apiGroups: [kubescape.io]
    resources: [operatorcommands]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubescape-scheduler
  namespace: {{ $ns }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubescape-scheduler}
subjects:
  - {kind: ServiceAccount, name: kubescape-scheduler, namespace: {{ $ns }}}
{{- end }}
{{- define "ks.triggerPod" -}}
serviceAccountName: kubescape-scheduler
restartPolicy: OnFailure
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile: { type: RuntimeDefault }
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
containers:
  - name: trigger
    image: "{{ .Values.scheduler.image.repository }}@{{ .Values.scheduler.image.digest }}"
    imagePullPolicy: {{ .Values.imagePullPolicy }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    command: [/bin/sh, -c]
    args:
      - |
        set -e
        for body in kubescape kubevuln; do
          sed "s/__GUID__/$(cat /proc/sys/kernel/random/uuid)/" "/body/$body.yaml" | kubectl create -f -
        done
    env:
      - { name: HOME, value: /tmp }
    volumeMounts:
      - { name: body, mountPath: /body, readOnly: true }
      - { name: tmp, mountPath: /tmp }
volumes:
  - name: body
    configMap: { name: kubescape-scheduler }
  - { name: tmp, emptyDir: {} }
{{- end }}
{{- if .Values.scheduler.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          {{- include "ks.triggerPod" . | nindent 10 }}
{{- end }}
{{- if .Values.scheduler.scanOnInstall }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubescape-first-scan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      {{- include "ks.triggerPod" . | nindent 6 }}
{{- end }}

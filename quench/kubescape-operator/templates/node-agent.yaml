{{- if .Values.nodeAgent.enabled }}
{{- $na := .Values.nodeAgent -}}
# The node agent watches every container on its node through eBPF and records what it does
# (executables, files, syscalls, capabilities) as application profiles in storage. Only that
# learning runs here; runtime threat detection, malware scanning, host sensing and network
# neighbourhoods stay off. eBPF and the host's PID namespace need root and the capabilities
# below, as upstream runs it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-node-agent
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
rules:
  - apiGroups: ['']
    resources: [nodes, nodes/proxy, services, endpoints, namespaces, configmaps, pods, events]
    verbs: [get, watch, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, watch, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, watch, list]
  - apiGroups: [kubescape.io]
    resources: [seccompprofiles, operatorcommands]
    verbs: [get, watch, list]
  - apiGroups: [kubescape.io]
    resources: [operatorcommands/status]
    verbs: [get, watch, list, update, patch]
  - apiGroups: [kubescape.io]
    resources: [runtimerulealertbindings, rules]
    verbs: [list, watch]
  - apiGroups: [spdx.softwarecomposition.kubescape.io]
    resources: [containerprofiles, sbomsyfts]
    verbs: [create, get, update, watch, list, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch, get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-node-agent
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "{{ .Release.Name }}-node-agent"}
subjects:
  - {kind: ServiceAccount, name: node-agent, namespace: "{{ .Release.Namespace }}"}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
data:
  config.json: |
    {
      "applicationProfileServiceEnabled": true,
      "prometheusExporterEnabled": false,
      "runtimeDetectionEnabled": false,
      "httpDetectionEnabled": false,
      "networkServiceEnabled": false,
      "malwareDetectionEnabled": false,
      "hostSensorEnabled": false,
      "nodeProfileServiceEnabled": false,
      "networkStreamingEnabled": false,
      "sbomGenerationEnabled": false,
      "enableEmbeddedSBOMs": false,
      "seccompServiceEnabled": false,
      "maxTsProfileSize": 2097152,
      "initialDelay": {{ $na.learningPeriod | quote }},
      "updateDataPeriod": {{ $na.updatePeriod | quote }},
      "maxSniffingTimePerContainer": {{ $na.maxLearningPeriod | quote }},
      "excludeNamespaces": {{ printf "%s,%s" .Release.Namespace .Values.excludeNamespaces | quote }},
      "exporters": { "stdoutExporter": true }
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: node-agent
      automountServiceAccountToken: true
      hostPID: true
      securityContext:
        appArmorProfile: { type: Unconfined }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # one agent per node, tainted or not
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: "{{ $na.image.repository }}@{{ $na.image.digest }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 0
            privileged: false
            seLinuxOptions: { type: spc_t }
            capabilities:
              add: [SYS_ADMIN, SYS_PTRACE, NET_ADMIN, SYSLOG, SYS_RESOURCE, IPC_LOCK, NET_RAW]
          env:
            - { name: GOMEMLIMIT, value: {{ include "ks.gomemlimit" $na.resources.limits.memory | quote }} }
            - { name: HOST_ROOT, value: /host }
            - { name: KUBELET_ROOT, value: /var/lib/kubelet }
            - { name: KS_LOGGER_LEVEL, value: {{ .Values.logger.level | quote }} }
            - { name: KS_LOGGER_NAME, value: zap }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NAMESPACE_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - { name: health, containerPort: 7888 }
          startupProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $na.resources | nindent 12 }}
          volumeMounts:
            {{- include "ks.clusterDataMount" . | nindent 12 }}
            - { name: config, mountPath: /etc/config/config.json, subPath: config.json, readOnly: true }
            - { name: cloud-secret, mountPath: /etc/credentials, readOnly: true }
            - { name: host, mountPath: /host, readOnly: true }
            - { name: kubeletdir, mountPath: /var/lib/kubelet }
            - { name: run, mountPath: /run }
            - { name: var, mountPath: /var, readOnly: true }
            - { name: modules, mountPath: /lib/modules, readOnly: true }
            - { name: debugfs, mountPath: /sys/kernel/debug }
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            - { name: bpffs, mountPath: /sys/fs/bpf }
            - { name: boot, mountPath: /boot, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: profiles, mountPath: /profiles }
      volumes:
        {{- include "ks.clusterDataVolume" . | nindent 8 }}
        - { name: config, configMap: { name: node-agent } }
        - { name: cloud-secret, secret: { secretName: cloud-secret } }
        - { name: host, hostPath: { path: / } }
        - { name: kubeletdir, hostPath: { path: /var/lib/kubelet } }
        - { name: run, hostPath: { path: /run } }
        - { name: var, hostPath: { path: /var } }
        - { name: modules, hostPath: { path: /lib/modules } }
        - { name: debugfs, hostPath: { path: /sys/kernel/debug } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
        - { name: bpffs, hostPath: { path: /sys/fs/bpf } }
        - { name: boot, hostPath: { path: /boot } }
        - { name: data, emptyDir: {} }
        - { name: profiles, emptyDir: {} }
{{- end }}

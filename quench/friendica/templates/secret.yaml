{{/*
The managed Secret exists only for an external database without an existingSecret: it
carries that DB password, read back from the existing Secret so it stays stable across
upgrades. The bundled MariaDB's password lives in its own Secret, which the pod reads
directly, so the two can never disagree.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.externalDatabase.password }}
{{- if and (not $pw) $existing }}{{- $pw = index $existing.data "db-password" | default "" | b64dec }}{{- end }}
{{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $pw | b64enc | quote }}
{{- end }}

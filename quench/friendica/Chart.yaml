dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

apiVersion: v2
name: friendica
description: Hardened Friendica federated social network (PHP-FPM + nginx + worker daemon) on a CVE-gated nonroot image, installed by its CLI installer into a bundled MariaDB.
type: application
version: 0.0.11
appVersion: "2026.05"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/friendica/friendica
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - friendica
  - fediverse
  - activitypub
  - social-network
  - php
maintainers:
  - name: mkabumattar
    email: info@quench-works.com

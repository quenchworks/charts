# Install gate. No image override: the install uses the chart's real, CI-maintained
# digest from values.yaml. Bundles MariaDB on a small PVC with small resources for the
# runner. No passwords are set, so the gate installs the default path (MariaDB generates
# the password into its own Secret and Friendica reads it from there). --wait passes only
# once the init container has run autoinstall against MariaDB and nodeinfo answers.
friendica:
  url: http://rtest-friendica:8080
mariadb:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

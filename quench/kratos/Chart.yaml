apiVersion: v2
name: kratos
description: "Identity server (Ory Kratos) — API-first identity management: registration, login, MFA, account recovery and profile management with no vendor-locked UI. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.25
appVersion: "26.2.0"
keywords:
  - kratos
  - ory
  - identity
  - iam
  - authentication
  - sso
  - user-management
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/kratos
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Image rebuilt: GO-2026-5932 (x/crypto/openpgp via go-github) VEXed with a build guard"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kratos
      image: ghcr.io/quenchworks/images/kratos@sha256:f06200bac6bad6d201daa3631d4f919d25227a1c282c95526aef7e603a1f3a23
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

      image: ghcr.io/quenchworks/images/kratos@sha256:78bd1268edaa8db2d61913923fc0bf1ba7fed552b081b94eabe5a2cebf58708b
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f

apiVersion: v2
name: kratos
description: "Identity server (Ory Kratos) — API-first identity management: registration, login, MFA, account recovery and profile management with no vendor-locked UI. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.5
appVersion: "26.2.0"
keywords:
  - kratos
  - ory
  - identity
  - iam
  - authentication
  - sso
  - user-management
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/kratos
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: kratos republished to a new 0-CVE digest."
  # ArtifactHub category enum: ai-machine-learning, database, integration-delivery,
  # monitoring-logging, networking, security, skip-prediction, storage,
  # streaming-messaging. An identity server fits "security".
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kratos
      image: ghcr.io/quenchworks/images/kratos@sha256:049375cbf94b81ee9da369438ee6a41eb90154b20f7880c480961e7f591324b1
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

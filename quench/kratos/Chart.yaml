apiVersion: v2
name: kratos
description: "Identity server (Ory Kratos) — API-first identity management: registration, login, MFA, account recovery and profile management with no vendor-locked UI. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Bundles PostgreSQL."
type: application
version: 0.0.22
appVersion: "26.2.0"
keywords:
  - kratos
  - ory
  - identity
  - iam
  - authentication
  - sso
  - user-management
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ory/kratos
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore: re-pin bundled postgresql/mysql/mongodb/openbao images to the TLS-capable builds"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: kratos
      image: ghcr.io/quenchworks/images/kratos@sha256:51b48974003d9a0b639b6ab5a4bd50aec29eae4c3718f7dfb42a391f9931cb3e
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:beda4af6174e30ad6ed2d9ca9a8962e2d2cb59af2ffd98a9b846b1edc41a0636
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

{{/*
The managed Secret carries:
  - dsn : the full PostgreSQL DSN Kratos reads via the DSN env var, assembled from
          host/port/db/user + the resolved password. Keeping the whole DSN in the
          Secret avoids a plaintext password in the pod spec (and keeps it out of
          the kratos.yaml ConfigMap -- see configmap.yaml).

When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart
renders no Secret at all -- the referenced Secret must supply the DSN itself (see
externalDatabase.existingSecretDsnKey). Nor does it with the bundled PostgreSQL and no
explicit password: the pod then reads the PostgreSQL chart's Secret and builds the DSN
itself (kratos.dsnEnv).
*/}}
{{- if include "kratos.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $dbpw := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbpw = .Values.postgresql.auth.password -}}
{{- else -}}
{{- $dbpw = .Values.externalDatabase.password -}}
{{- end -}}
{{- if not $dbpw -}}{{- $dbpw = randAlphaNum 24 -}}{{- end -}}
{{- $host := include "kratos.db.host" . -}}
{{- $port := include "kratos.db.port" . -}}
{{- $db := include "kratos.db.name" . -}}
{{- $user := include "kratos.db.user" . -}}
{{- $sslMode := include "kratos.db.sslMode" . -}}
{{- $dsn := printf "postgres://%s:%s@%s:%s/%s?sslmode=%s&max_conn_lifetime=10m" $user $dbpw $host $port $db $sslMode -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  dsn: {{ $dsn | b64enc | quote }}
{{- end }}

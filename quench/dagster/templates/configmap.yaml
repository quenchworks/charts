apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # The Dagster instance: every process reads it from DAGSTER_HOME. Run, event-log and
  # schedule storage all live in PostgreSQL so the webserver and daemon share them.
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          hostname: { env: DAGSTER_PG_HOST }
          port: { env: DAGSTER_PG_PORT }
          db_name: { env: DAGSTER_PG_DB }
          username: { env: DAGSTER_PG_USERNAME }
          password: { env: DAGSTER_PG_PASSWORD }
    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator
      {{- with .Values.runCoordinator.maxConcurrentRuns }}
      config:
        max_concurrent_runs: {{ . }}
      {{- end }}
    telemetry:
      enabled: false
    {{- with .Values.instanceConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  # Code locations: gRPC servers running user code (your own image built FROM the
  # QuenchWorks dagster image, or the bundled example).
  workspace.yaml: |
    load_from:
    {{- if .Values.example.enabled }}
      - grpc_server:
          host: {{ include "quench-common.fullname" . }}-example
          port: 4000
          location_name: example
    {{- end }}
    {{- range .Values.codeLocations }}
      - grpc_server:
          host: {{ .host }}
          port: {{ .port | default 4000 }}
          location_name: {{ .name }}
    {{- end }}
    {{- if not (or .Values.example.enabled .Values.codeLocations) }} []{{- end }}

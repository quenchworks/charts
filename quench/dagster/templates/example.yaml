{{- if .Values.example.enabled }}
{{/* A tiny code location (one asset) served from the dagster image itself, so a fresh
     install has something to load and run. Real deployments point codeLocations at their
     own images. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-example
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  defs.py: |
    from dagster import Definitions, asset

    @asset
    def hello_quenchworks() -> str:
        return "hello from a QuenchWorks Dagster code location"

    defs = Definitions(assets=[hello_quenchworks])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-example
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: example
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dagster.selectorLabels" (dict "ctx" . "component" "example") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dagster.selectorLabels" (dict "ctx" . "component" "example") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dagster.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "dagster.waitForDb" . | nindent 8 }}
      containers:
        - name: code-server
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/dagster/venv/bin/dagster"]
          args: ["code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-f", "/example/defs.py"]
          env:
            {{- include "dagster.env" . | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 4000
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.example.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /example
              readOnly: true
            {{- include "dagster.mounts" . | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: {{ include "quench-common.fullname" . }}-example
        {{- include "dagster.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-example
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: example
spec:
  ports:
    - name: grpc
      port: 4000
      targetPort: grpc
  selector:
    {{- include "dagster.selectorLabels" (dict "ctx" . "component" "example") | nindent 4 }}
{{- end }}

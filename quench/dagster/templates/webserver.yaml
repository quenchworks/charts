{{- $w := .Values.webserver -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}-webserver
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: webserver
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      {{- include "dagster.selectorLabels" (dict "ctx" . "component" "webserver") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dagster.selectorLabels" (dict "ctx" . "component" "webserver") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dagster.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "dagster.waitForDb" . | nindent 8 }}
      containers:
        - name: webserver
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/dagster/venv/bin/dagster-webserver"]
          args: ["-h", "0.0.0.0", "-p", "3000", "-w", "/etc/dagster/workspace.yaml"]
          env:
            {{- include "dagster.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "dagster.mounts" . | nindent 12 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "dagster.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-webserver
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: webserver
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "dagster.selectorLabels" (dict "ctx" . "component" "webserver") | nindent 4 }}

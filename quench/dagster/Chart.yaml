apiVersion: v2
name: dagster
description: "Dagster, the asset-oriented data orchestrator: webserver (UI), daemon (schedules, sensors, run queue) and PostgreSQL instance storage. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "1.13.24"
keywords:
  - dagster
  - orchestration
  - data-pipelines
  - etl
  - workflow
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/dagster-io/dagster
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: postgresql 0.0.24."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: dagster
      image: ghcr.io/quenchworks/images/dagster@sha256:bd7df6bfb8834e908ab60747af5050edb2add70c353f936a07647225e1cd1041
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

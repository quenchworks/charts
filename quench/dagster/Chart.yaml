    - kind: changed
      description: "Updated dagster to 1.13.31 and re-pinned the image to its new rebuilt digest."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: dagster
      image: ghcr.io/quenchworks/images/dagster@sha256:ecaa47bc491201d3427cada9d54afe6aa22821ebe778140fd915ad1075cd5223
    - name: postgresql

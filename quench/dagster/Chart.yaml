apiVersion: v2
name: dagster
description: "Dagster, the asset-oriented data orchestrator: webserver (UI), daemon (schedules, sensors, run queue) and PostgreSQL instance storage. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.25
appVersion: "1.13.30"
keywords:
  - dagster
  - orchestration
  - data-pipelines
  - etl
  - workflow
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/dagster-io/dagster
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: dagster
      image: ghcr.io/quenchworks/images/dagster@sha256:e14a840cf3159f918677d94346f860d4cb01fc62e183ae539163b3a9c29b977f
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.35
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

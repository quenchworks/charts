{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distribution.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at /etc/distribution/config.yml (the image's `registry serve` argument).
  config.yml: |-
    {{- .Values.config.configYml | nindent 4 }}
{{- end }}

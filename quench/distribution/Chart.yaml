apiVersion: v2
name: distribution
description: "The CNCF reference OCI and Docker registry server for storing and distributing container images and other OCI artifacts. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.13
appVersion: "3.1.1"
keywords:
  - distribution
  - registry
  - oci
  - containers
  - docker
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/distribution/distribution
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "rebuild on otlploggrpc 0.21.0 for CVE-2026-81871"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: distribution
      image: ghcr.io/quenchworks/images/distribution@sha256:d6a9b6be2cad5625bce89c6b05feed01644742e377364c5fbe8e2c3beabae9db
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

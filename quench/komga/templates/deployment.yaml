{{- $probe := dict "tcpSocket" (dict "port" 25600) "initialDelaySeconds" 3 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Komga reads its environment at start: a change rolls the pods
        checksum/config: {{ toJson (list (include "komga.env" .) .Values.tls) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: komga
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "komga.env" . | nindent 12 }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "komga.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          # the JVM starts and migrates its SQLite databases before it listens: give the first start minutes
          startupProbe:
            {{- toYaml (.Values.customStartupProbe | default (dict "tcpSocket" (dict "port" 25600) "periodSeconds" 5 "failureThreshold" 60)) | nindent 12 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/komga
            {{- with .Values.media }}{{ if or .existingClaim .hostPath }}
            - name: media
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly }}
            {{- end }}{{ end }}
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "komga.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.media }}
        {{- if .existingClaim }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
            readOnly: {{ .readOnly }}
        {{- else if .hostPath }}
        - name: media
          hostPath:
            path: {{ .hostPath }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

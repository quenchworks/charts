# Quenchworks Easegress on the QuenchWorks easegress image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). One member with its embedded etcd; objects
# (HTTPServers, Pipelines, ...) live in etcd on the PVC.
image:
  repository: ghcr.io/quenchworks/images/easegress
  digest: "sha256:9a5240da500c2f17a22a04c7444eed2a60d7534fb7424a8bc0b595afd671de97"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Objects created on startup if they do not exist yet, one entry per object. Later
# edits here do not change an existing object; use `egctl apply -f` for that.
# Example:
#   initialObjects:
#     - name: demo-server
#       kind: HTTPServer
#       port: 10080
#       rules:
#         - paths:
#             - pathPrefix: /
#               backend: demo-pipeline
initialObjects: []

# Container and Service ports for your HTTPServer objects. Easegress opens a port
# only once an HTTPServer asks for it.
trafficPorts: []
#  - name: http
#    port: 10080

# Extra easegress-server flags, e.g. ["--debug"].
extraArgs: []

extraEnvVars: []

# Native TLS: the admin API on 2381 serves HTTPS only (--tls with the PEM pair at /tls); the
# probes and egctl move to HTTPS. Traffic ports belong to your HTTPServer objects (set their TLS
# there). The certificate comes from the first source set: existingSecret, then a cert-manager
# Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 2000m, memory: 1Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  # The admin API has no authentication and full control of the gateway: keep it
  # cluster-internal.
  adminPort: 2381

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

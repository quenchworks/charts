{{- if .Values.initialObjects }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-objects
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $i, $o := .Values.initialObjects }}
  {{ printf "%02d-%s.yaml" $i $o.name }}: |
    {{- toYaml $o | nindent 4 }}
  {{- end }}
{{- end }}

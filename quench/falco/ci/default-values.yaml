# Install gate on kind: the defaults (modern eBPF, least capabilities). kind
# nodes share the runner's kernel, which has BTF. A gate-only rules file proves
# customRules load next to the default ruleset.
customRules:
  quench-gate.yaml: |-
    - rule: Quench gate marker
      desc: Gate-only rule; fires when a process named qwgatemark starts.
      condition: spawned_process and proc.name = qwgatemark
      output: quench gate marker ran (command=%proc.cmdline)
      priority: NOTICE
resources:
  requests: { cpu: 50m, memory: 256Mi }

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  falco.yaml: |
    {{- include "falco.config" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-rules
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- range $file, $body := .Values.customRules }}
  {{ $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}

name: falco
description: "Falco runtime threat detection: a DaemonSet that watches every node's syscalls with the modern eBPF probe, enriches them with container and pod metadata through the container plugin, and prints rule alerts as JSON on stdout. Hardened by QuenchWorks, built from source, CVE-gated, cosign-signed and pinned by digest."

{{/* Both components watch the API server, so both need a token (quench-common's
     serviceAccount helper defaults automount off for workloads that never call it). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metallb.controllerName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.speaker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metallb.speakerName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}

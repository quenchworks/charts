apiVersion: v2
name: metallb
description: "MetalLB, the load-balancer implementation for bare-metal Kubernetes: assigns LoadBalancer Service IPs from address pools and announces them over L2 (ARP/NDP) or BGP. Hardened by QuenchWorks with controller and speaker images built from source, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "0.16.0"
keywords:
  - metallb
  - loadbalancer
  - bare-metal
  - bgp
  - arp
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/metallb/metallb
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: metallb-controller
      image: ghcr.io/quenchworks/images/metallb-controller@sha256:7339eedcd4a04035ee807c995820453bb3c57bc73320edbff340bef88dcc8f42
    - name: metallb-speaker
      image: ghcr.io/quenchworks/images/metallb-speaker@sha256:7e20e3a1b36e8be66ee70dd4ea181bb79d26188066f5c5820a21bc23cd99c36a
  artifacthub.io/crds: |
    - kind: IPAddressPool
      version: v1beta1
      name: ipaddresspools.metallb.io
      displayName: IPAddressPool
      description: Address ranges MetalLB assigns to LoadBalancer Services.
    - kind: L2Advertisement
      version: v1beta1
      name: l2advertisements.metallb.io
      displayName: L2Advertisement
      description: Announces pool addresses over ARP/NDP.
    - kind: BGPPeer
      version: v1beta2
      name: bgppeers.metallb.io
      displayName: BGPPeer
      description: A BGP router the speakers peer with.
    - kind: BGPAdvertisement
      version: v1beta1
      name: bgpadvertisements.metallb.io
      displayName: BGPAdvertisement
      description: Announces pool addresses over BGP.
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

{{- if eq (include "postgrest.createsSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if include "postgrest.ownsURI" . }}
  # Carries the database password, hence a Secret and not a ConfigMap.
  database-uri: {{ include "postgrest.databaseURI" . | b64enc | quote }}
  {{- end }}
  {{- if include "postgrest.ownsJWT" . }}
  jwt-secret: {{ .Values.jwt.secret | b64enc | quote }}
  {{- end }}
{{- end }}

apiVersion: v2
name: postgrest
description: "PostgREST, a standalone web server that turns a PostgreSQL database directly into a RESTful API, with authorization derived from the database's own roles and row-level security. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Ships a bundled PostgreSQL by default for a self-contained install."
type: application
version: 0.0.2
appVersion: "16.1"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PostgREST/postgrest
keywords:
  - postgrest
  - postgresql
  - rest
  - api
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: PostgREST 16.1 as a stateless Deployment on the hardened 0-CVE QuenchWorks image, pinned by digest."
    - kind: added
      description: "Bundled QuenchWorks PostgreSQL subchart by default, so the chart is bootable out of the box; set postgresql.enabled=false and fill externalDatabase.* to point at your own server."
    - kind: added
      description: "The connection URI carries a password, so it is always rendered into a Secret (never a ConfigMap or a flag) and externalDatabase.existingSecret accepts one you manage yourself."
    - kind: added
      description: "Admin server on port 3001 backs the /live and /ready probes, so readiness means a working database connection and a loaded schema cache."
  artifacthub.io/license: MIT
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgrest
      image: ghcr.io/quenchworks/images/postgrest@sha256:051e9c0f4fda51e6e4cfc8bce1cb83fcea1178576114bc470179b3d1fac499ad
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:ac4c4674d703666282dbbae9e4365114039160a982a9a72b7ea7241bfb23c829
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

apiVersion: v2
name: postgrest
description: "PostgREST, a standalone web server that turns a PostgreSQL database directly into a RESTful API, with authorization derived from the database's own roles and row-level security. Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest. Ships a bundled PostgreSQL by default for a self-contained install."
type: application
version: 0.0.23
appVersion: "16.3"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/PostgREST/postgrest
keywords:
  - postgrest
  - postgresql
  - rest
  - api
  - database
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-12 Go stdlib rebuild (CVE-2026-97054)"
  artifacthub.io/license: MIT
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgrest
      image: ghcr.io/quenchworks/images/postgrest@sha256:6b819c300ac06cc38bd30f1688c712f67eeb61776341ce04d6a5a72654037eef
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:9c4478f8925ca6e4098ef00966036e933f93c54185b38281f74f5ab02208aa0b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

# Quenchworks OpenCost: Kubernetes cost monitoring (the CNCF OpenCost cost model).
# The image is built from source, nonroot (uid 1001), 0-CVE, cosign-signed, and pinned
# by digest below.
image:
  repository: ghcr.io/quenchworks/images/opencost
  digest: "sha256:420c082184a37a51f0b477aafbfc37d9f4d7426146d0ef94dbce348556f518a9"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Name this cluster in the cost data (CLUSTER_ID).
clusterId: "default-cluster"

prometheus:
  # PROMETHEUS_SERVER_ENDPOINT, e.g. http://prometheus-server.monitoring:9090. Empty
  # means OpenCost runs on its built-in collector data source instead.
  endpoint: ""

# CLOUD_PROVIDER override (aws, azure, gcp, ...). Empty lets OpenCost detect it.
cloudProvider: ""

# OpenCost's anonymous usage reporting. Off by default in this hardened build.
productAnalytics: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 1000m, memory: 1Gi }

service:
  type: ClusterIP
  port: 9003

podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}

extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}

podSecurityContext: {}
containerSecurityContext: {}

livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Cluster-wide read-only access to the objects OpenCost prices. Required for it to work.
rbac:
  create: true

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  hosts: []
  tls: []

{{/* Centrifugo serves /health once health.enabled is on (this chart forces it on).
     It returns 200 as soon as the HTTP server is listening. Used for both probes. */}}
{{- $liveness := dict "httpGet" (dict "path" "/health" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" "/health" "port" "http") "initialDelaySeconds" 2 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "centrifugo.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: centrifugo
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Serve on 8000 and enable the /health endpoint (off by default upstream).
            - name: CENTRIFUGO_HTTP_SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: CENTRIFUGO_HEALTH_ENABLED
              value: "true"
            - name: CENTRIFUGO_ENGINE_TYPE
              value: {{ .Values.engine.type | quote }}
            - name: CENTRIFUGO_ADMIN_ENABLED
              value: {{ .Values.admin.enabled | quote }}
            {{- with .Values.allowedOrigins }}
            - name: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
              value: {{ join " " . | quote }}
            {{- end }}
            - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "centrifugo.secretName" . }}
                  key: {{ include "centrifugo.tokenHmacKey" . }}
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "centrifugo.secretName" . }}
                  key: {{ include "centrifugo.apiKeyKey" . }}
            {{- if .Values.admin.enabled }}
            - name: CENTRIFUGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "centrifugo.secretName" . }}
                  key: {{ include "centrifugo.adminPasswordKey" . }}
            - name: CENTRIFUGO_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "centrifugo.secretName" . }}
                  key: {{ include "centrifugo.adminSecretKey" . }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read-only rootfs: give Centrifugo a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

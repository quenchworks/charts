# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# Fixed secret values make the render deterministic and let the gate exercise the
# admin UI and HTTP API with known credentials.
replicaCount: 1
engine:
  type: memory
admin:
  enabled: true
secrets:
  tokenHmacSecretKey: ci-token-hmac-secret-key
  apiKey: ci-http-api-key
  adminPassword: ci-admin-password
  adminSecret: ci-admin-secret
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

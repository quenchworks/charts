# Install gate. One slapd pod on an emptyDir (no PVC to wait on in kind), the
# default dc=example,dc=org base DN and a generated admin password in a Secret, so
# the gate exercises the whole first-boot path: render slapd.conf from the Secret,
# slapadd the base entry, then serve it. No image override — the install uses the
# chart's real, CI-maintained digest, so the gate pulls the actual signed image.
persistence:
  enabled: false
ldap:
  organization: QuenchWorks CI

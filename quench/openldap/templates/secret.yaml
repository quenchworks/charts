{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := .Values.auth.adminPassword -}}
{{- if and (not $pw) $existing -}}
{{/* keep the generated password stable across upgrades */}}
{{- $pw = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $pw -}}
{{- $pw = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}

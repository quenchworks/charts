apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: ldap
      name: ldap
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.tlsPort }}
      targetPort: ldaps
      name: ldaps
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openldap.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: ldap
      name: ldap
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.tlsPort }}
      targetPort: ldaps
      name: ldaps
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

{{- /* Cloudreve makes the first account that registers the administrator, so an install left open hands
       that to whoever registers first. This hook registers the admin with the generated password right after
       install, then turns open registration off (unless registration.enabled). It is idempotent: on upgrade
       the account exists and only the registration setting is re-applied. busybox wget cannot send PATCH, so
       the settings call is a raw HTTP request over nc (the Service speaks plain HTTP inside the cluster). */}}
{{- $fullname := include "quench-common.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-bootstrap
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        # not the Deployment's selector labels: the Service must not route to this pod
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ printf "%s@%s" .Values.busybox.repository .Values.busybox.digest }}
          imagePullPolicy: {{ .Values.busybox.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: HOST, value: {{ printf "%s.%s.svc" $fullname .Release.Namespace | quote }} }
            - { name: PORT, value: {{ .Values.service.port | quote }} }
            - { name: ADMIN_EMAIL, value: {{ .Values.admin.email | quote }} }
            - { name: REGISTER, value: {{ ternary "1" "0" .Values.registration.enabled | quote }} }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudreve.secretName" . }}
                  key: admin-password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              U="http://$HOST:$PORT"
              for i in $(seq 1 60); do wget -q -O /dev/null "$U/api/v4/site/ping" && break; sleep 5; done
              body="{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\",\"language\":\"en-US\"}"
              # registers the first account (the admin); on upgrade it answers that the email is taken
              wget -q -O - --header 'Content-Type: application/json' --post-data "$body" "$U/api/v4/user" || true
              echo
              tok=$(wget -q -O - --header 'Content-Type: application/json' --post-data "$body" "$U/api/v4/session/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$tok" ] || { echo "admin login failed: is admin.email the first account on this volume?"; exit 1; }
              data="{\"settings\":{\"register_enabled\":\"$REGISTER\"}}"
              # keep nc's input open: if it half-closes right after sending, Go cancels the request mid-save
              resp=$( { printf 'PATCH /api/v4/admin/settings HTTP/1.0\r\nHost: %s\r\nAuthorization: Bearer %s\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "$HOST" "$tok" "${#data}" "$data"; sleep 3; } | nc "$HOST" "$PORT")
              echo "$resp" | grep -q '"code":0' || { echo "setting register_enabled failed:"; echo "$resp" | tail -3; exit 1; }
              echo "admin ready, register_enabled=$REGISTER"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }

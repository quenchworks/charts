{{- /* The path prefix clients must use (--http-upgrade-path-prefix): generated once, read back on upgrade. */}}
{{- if and .Values.pathPrefix.enabled (not .Values.pathPrefix.existingSecret) }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $p := .Values.pathPrefix.value | default (get $old "path-prefix" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  path-prefix: {{ $p | b64enc | quote }}
{{- end }}

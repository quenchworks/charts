apiVersion: v2
name: traefik
description: "Cloud-native reverse proxy and load balancer with automatic service discovery, dynamic config, and built-in Let's Encrypt TLS. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.7
appVersion: "3.7.5"
keywords:
  - traefik
  - ingress
  - proxy
  - gateway
  - networking
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/traefik/traefik
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Add an ArtifactHub changelog; maintenance re-release re-validated against the chart's pinned, signed image."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: traefik
      image: ghcr.io/quenchworks/images/traefik@sha256:0198bfece165e147aa144255df2dbeed0f35e718e8a5a6de98e345e552db14ea
  artifacthub.io/crds: |
    - kind: IngressRoute
      version: v1alpha1
      name: ingressroutes.traefik.io
      displayName: IngressRoute
      description: Traefik HTTP routing rules for an ingress.
    - kind: IngressRouteTCP
      version: v1alpha1
      name: ingressroutetcps.traefik.io
      displayName: IngressRouteTCP
      description: Traefik TCP routing rules for an ingress.
    - kind: IngressRouteUDP
      version: v1alpha1
      name: ingressrouteudps.traefik.io
      displayName: IngressRouteUDP
      description: Traefik UDP routing rules for an ingress.
    - kind: Middleware
      version: v1alpha1
      name: middlewares.traefik.io
      displayName: Middleware
      description: Traefik HTTP middleware applied to a route.
    - kind: MiddlewareTCP
      version: v1alpha1
      name: middlewaretcps.traefik.io
      displayName: MiddlewareTCP
      description: Traefik TCP middleware applied to a route.
    - kind: ServersTransport
      version: v1alpha1
      name: serverstransports.traefik.io
      displayName: ServersTransport
      description: Transport configuration between Traefik and HTTP backends.
    - kind: ServersTransportTCP
      version: v1alpha1
      name: serverstransporttcps.traefik.io
      displayName: ServersTransportTCP
      description: Transport configuration between Traefik and TCP backends.
    - kind: TLSOption
      version: v1alpha1
      name: tlsoptions.traefik.io
      displayName: TLSOption
      description: TLS connection options for Traefik routers.
    - kind: TLSStore
      version: v1alpha1
      name: tlsstores.traefik.io
      displayName: TLSStore
      description: TLS certificate store used by Traefik routers.
    - kind: TraefikService
      version: v1alpha1
      name: traefikservices.traefik.io
      displayName: TraefikService
      description: Advanced Traefik service (weighted round robin, mirroring).
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.2
    repository: oci://ghcr.io/quenchworks/charts

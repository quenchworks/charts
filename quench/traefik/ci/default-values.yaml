# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
replicaCount: 1
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
# Exercise the dashboard/api gate over the internal traefik entryPoint.
dashboard:
  enabled: true
  insecure: true
service:
  type: ClusterIP
# Both providers on so the CRD RBAC + CRD install path are exercised too.
providers:
  kubernetesIngress: true
  kubernetesCRD: true

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "traefik.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Traefik needs its token to call the Kubernetes API (the providers list/watch
# Ingresses, Services, Endpoints, Secrets and the traefik.io CRDs), so unlike the
# stateless web charts the token must be mounted.
automountServiceAccountToken: true
{{- end }}

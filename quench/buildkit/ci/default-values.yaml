# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# The gate's client pod reaches the TCP endpoint from the same namespace, which the
# default NetworkPolicy allows.
replicaCount: 1
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "2", memory: 2Gi }

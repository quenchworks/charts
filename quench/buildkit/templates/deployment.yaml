{{/* buildctl talks to the local socket (BUILDKIT_HOST is set in the image), so
     the probe only passes once the worker is registered, not merely listening. */}}
{{- $probe := dict "exec" (dict "command" (list "buildctl" "debug" "workers")) -}}
{{- $liveness := merge (dict "initialDelaySeconds" 10 "periodSeconds" 30 "timeoutSeconds" 5) $probe -}}
{{- $readiness := merge (dict "initialDelaySeconds" 3 "periodSeconds" 10 "timeoutSeconds" 5) (deepCopy $probe) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "buildkit.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: buildkitd
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/rootlesskit", "/usr/bin/buildkitd"]
          args:
            - --addr
            - unix:///run/user/1001/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            {{- if .Values.tls.existingSecret }}
            - --tlscacert
            - /certs/ca.crt
            - --tlscert
            - /certs/tls.crt
            - --tlskey
            - /certs/tls.key
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.extraEnvVars }}
          env:
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: grpc
              containerPort: 1234
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; rootlesskit and buildkitd write
            # only under these.
            - name: cache
              mountPath: /home/nonroot/.local/share/buildkit
            - name: tmp
              mountPath: /home/nonroot/.local/tmp
            # rootlesskit makes its bind directory under /tmp regardless of TMPDIR
            - name: roottmp
              mountPath: /tmp
            - name: runtime
              mountPath: /run/user/1001
            {{- if .Values.tls.existingSecret }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "buildkit.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: roottmp
          emptyDir: {}
        {{- if .Values.tls.existingSecret }}
        - name: certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

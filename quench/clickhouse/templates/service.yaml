apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.nativePort }}
      targetPort: native
      name: native
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    - port: {{ .Values.service.nativeTlsPort }}
      targetPort: native-tls
      name: native-tls
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.nativePort }}
      targetPort: native
      name: native
    {{- if include "quench-common.tls.enabled" . }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    - port: {{ .Values.service.nativeTlsPort }}
      targetPort: native-tls
      name: native-tls
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

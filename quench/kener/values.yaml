# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kener
  digest: "sha256:9c5f7e5ae24523bbe0890f3e9e26ac7e0eb31465dd7dc4d8c5e1d8fc0c85b89b"
  pullPolicy: IfNotPresent

nameOverride: ""

# The public URL Kener is served at (scheme, host and port, no trailing slash). SvelteKit rejects form posts whose
# Origin differs, so sign-in fails without it. Required.
origin: ""

# Kener keeps its data in SQLite on one volume: one replica, replaced with Recreate (the default when this is empty).
replicaCount: 1
updateStrategy: {}

# KENER_SECRET_KEY: generated into the Secret <fullname> and kept on upgrade.
secret:
  existingSecret: ""   # a Secret with key "secret-key" instead

# The SQLite database (/app/database).
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 2Gi
  annotations: {}

# The bundled QuenchWorks Valkey (Kener v4 needs Redis for its monitor queues), with a generated password.
valkey:
  enabled: true
  auth:
    password: ""        # generated by the subchart if empty

# Your own Redis or Valkey instead (valkey.enabled=false): a Secret holding the full REDIS_URL.
externalRedis:
  existingSecret: ""
  existingSecretKey: REDIS_URL

# More Kener settings as environment variables. The first account to sign up becomes the admin; Kener refuses
# later sign-ups, so create it right after install.
settings: {}

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: 1, memory: 768Mi }

service:
  type: ClusterIP
  port: 3000
  annotations: {}
  externalTrafficPolicy: ""

# Kener has no TLS listener: terminate TLS here (and set origin to the https URL).
ingress:
  enabled: false
  className: ""
  annotations: {}
  servicePort: null
  # e.g. [{host: status.example.com, paths: [{path: /, pathType: Prefix}]}]
  hosts: []
  # e.g. [{hosts: [status.example.com], secretName: status-tls}]
  tls: []

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

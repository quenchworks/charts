# The digests below are the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. Never a tag.
image:
  repository: ghcr.io/quenchworks/images/dragonfly-operator
  digest: "sha256:b4361b58bdbd8a3b9e2cce25cb062e641dc87254a10632606473ddc9062c8fa7"
  pullPolicy: IfNotPresent

# The Dragonfly image every Dragonfly resource gets unless it sets spec.image (--dragonfly-image).
# Our hardened Dragonfly. Set to null to keep upstream's default.
dragonflyImage:
  repository: ghcr.io/quenchworks/images/dragonfly
  tag: "1.40.2"
  digest: "sha256:bec2cfa7cfee8969f8deb1922107443cda389cad8b6d5665b3bf56f623cbd77b"

nameOverride: ""

# Watch only the release namespace (--watch-current-namespace). Default: every namespace.
watchCurrentNamespace: false
# Leader election is always on; extra replicas are standbys.
replicaCount: 1
# More operator flags
extraArgs: []

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

rbac:
  create: true

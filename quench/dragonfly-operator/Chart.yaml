apiVersion: v2
name: dragonfly-operator
description: "Dragonfly Operator: run Dragonfly, the Redis- and Memcached-compatible in-memory store, from Kubernetes Dragonfly resources, with replication and failover, snapshots and TLS. The CRD ships with the chart and Dragonfly pods default to the QuenchWorks dragonfly image. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "1.8.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - dragonfly
  - redis
  - cache
  - in-memory
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/dragonflydb/dragonfly-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: dragonfly-operator
      image: ghcr.io/quenchworks/images/dragonfly-operator@sha256:b4361b58bdbd8a3b9e2cce25cb062e641dc87254a10632606473ddc9062c8fa7
    - name: dragonfly
      image: ghcr.io/quenchworks/images/dragonfly@sha256:bec2cfa7cfee8969f8deb1922107443cda389cad8b6d5665b3bf56f623cbd77b
  artifacthub.io/crds: |
    - kind: Dragonfly
      version: v1alpha1
      name: dragonflies.dragonflydb.io
      displayName: Dragonfly
      description: A Dragonfly primary with replicas, run as a StatefulSet.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

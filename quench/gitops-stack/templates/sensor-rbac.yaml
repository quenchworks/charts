{{- if .Values.sensorServiceAccount.create }}
# Lets an Argo Events sensor submit Argo Workflows in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-sensor
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-sensor
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-sensor
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: gitops-sensor
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: gitops-sensor
  apiGroup: rbac.authorization.k8s.io
{{- end }}

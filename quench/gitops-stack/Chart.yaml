apiVersion: v2
name: gitops-stack
description: "Hardened GitOps and delivery stack: Argo CD for GitOps sync, Argo Rollouts for canary and blue-green releases, Argo Workflows for pipelines, and Argo Events to start them from webhooks, with a sensor ServiceAccount already allowed to submit workflows. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.20
appVersion: "1.0.0"
keywords:
  - argocd
  - argo-rollouts
  - argo-workflows
  - argo-events
  - gitops
  - stack
maintainers:

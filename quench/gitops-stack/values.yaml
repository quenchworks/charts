# gitops-stack: Argo CD + Argo Rollouts + Argo Workflows + Argo Events.
#
# Names are FIXED (gitops-argocd, gitops-rollouts, gitops-workflows,
# gitops-events) so the addresses below are the same in every install. One
# stack per namespace; the controllers watch the whole cluster.
#
#   Argo CD          http://gitops-argocd-server:8080
#   Argo Workflows   http://gitops-workflows-server:2746

argocd:
  enabled: true
  fullnameOverride: gitops-argocd

argo-rollouts:
  enabled: true
  fullnameOverride: gitops-rollouts

argo-workflows:
  enabled: true
  fullnameOverride: gitops-workflows

argo-events:
  enabled: true
  fullnameOverride: gitops-events

# A ServiceAccount for Argo Events sensors that may submit Argo Workflows in
# this namespace: set `spec.template.serviceAccountName: gitops-sensor` on a
# Sensor and use an argoWorkflow or k8s trigger that creates a Workflow.
sensorServiceAccount:
  create: true

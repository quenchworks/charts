{{/* liveness: CQL port is listening. readiness: this node reports Up/Normal in its own
     ring view (nodetool talks to local JMX). A node needs ~30-60s to reach UN, so the
     readiness probe is patient (long initialDelay + high failureThreshold) and liveness
     starts even later so a slow bootstrap is never killed mid-flight. */}}
{{- $liveness := dict "tcpSocket" (dict "port" "cql") "initialDelaySeconds" 120 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "exec" (dict "command" (list "/bin/sh" "-c" "nodetool status | grep -q '^UN'")) "initialDelaySeconds" 45 "periodSeconds" 15 "timeoutSeconds" 10 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cassandra.headlessName" . }}
  podManagementPolicy: OrderedReady
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cassandra.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: cassandra
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            - name: CASSANDRA_SEEDS
              value: {{ include "cassandra.seeds" . | quote }}
            # auto -> the entrypoint resolves the pod IP via `hostname -i`
            - name: CASSANDRA_LISTEN_ADDRESS
              value: "auto"
            - name: CASSANDRA_RPC_ADDRESS
              value: "0.0.0.0"
            - name: CASSANDRA_NUM_TOKENS
              value: {{ .Values.config.numTokens | quote }}
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: {{ .Values.config.endpointSnitch | quote }}
            {{- with .Values.config.dc }}
            - name: CASSANDRA_DC
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.rack }}
            - name: CASSANDRA_RACK
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: CASSANDRA_AUTHENTICATOR
              value: {{ .Values.auth.authenticator | quote }}
            - name: CASSANDRA_AUTHORIZER
              value: {{ .Values.auth.authorizer | quote }}
            {{- end }}
            - name: MAX_HEAP_SIZE
              value: {{ .Values.config.maxHeapSize | quote }}
            - name: HEAP_NEWSIZE
              value: {{ .Values.config.heapNewSize | quote }}
            {{- with .Values.config.yamlExtra }}
            - name: CASSANDRA_YAML_EXTRA
              value: {{ . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: internode
              containerPort: {{ .Values.service.internodePort }}
            - name: cql
              containerPort: {{ .Values.service.cqlPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # data/commitlog/saved_caches/hints/cdc_raw + JVM tmpdir
            - name: data
              mountPath: /var/lib/cassandra
            # read-only rootfs: /conf is seeded from the dist on first start and logs
            # are written at runtime, so both ride on emptyDir
            - name: conf
              mountPath: /conf
            - name: logs
              mountPath: /var/log/cassandra
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

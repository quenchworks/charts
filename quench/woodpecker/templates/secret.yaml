{{- if and .Values.agentSecret.value (not .Values.agentSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-agent" (include "quench-common.fullname" .) }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  WOODPECKER_AGENT_SECRET: {{ .Values.agentSecret.value | quote }}
{{- end }}

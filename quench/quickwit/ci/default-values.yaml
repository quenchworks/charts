# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and Quickwit writes its
# index data + local split cache to it under /quickwit/qwdata. The image ships a
# baked default config (QW_CONFIG), so a single-node node boots with no extra config.
persistence:
  enabled: true
  size: 8Gi

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/kanboard
  digest: "sha256:7cd8b2f63fc091b7c6a9caddbe75341bf35f5b4b89ae4543abbfbdf09e922979"
  pullPolicy: IfNotPresent

nameOverride: ""

# Kanboard settings as environment variables (https://docs.kanboard.org/v1/admin/config/), e.g.
# DB_DRIVER: postgres with DB_HOSTNAME, DB_NAME, DB_USERNAME and DB_PASSWORD (through
# extraEnvVarsSecret), or LOG_DRIVER. SQLite on the data volume by default.
settings:
  LOG_DRIVER: stderr

# /var/www/app/data: the SQLite database, uploaded files and cache.
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  # HTTPS Service port (to the TLS sidecar's 8443), only with tls.enabled
  httpsPort: 443
  annotations: {}
  externalTrafficPolicy: ""

# TLS: Kanboard serves plain HTTP, so with tls.enabled a caddy sidecar terminates HTTPS on 8443
# (Service port service.httpsPort) and proxies to it over localhost. Certificate: existingSecret,
# then certManager, else a Helm-generated CA.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# The TLS sidecar (our caddy image, pinned by digest).
proxy:
  image:
    repository: ghcr.io/quenchworks/images/caddy
    digest: "sha256:6377c513134e78bd41fad0819c9d45830b1868398c1805a5b3ee8494f93072d7"
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 500m, memory: 128Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

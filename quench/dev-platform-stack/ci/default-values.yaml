# Install gate on kind: small volumes. The gate checks the OAuth app exists in Forgejo, Woodpecker
# starts with it, and Woodpecker's sign-in sends the browser to Forgejo's authorize endpoint with it.
forgejo:
  persistence:
    size: 1Gi
woodpecker:
  persistence:
    size: 256Mi
postgresql:
  primary:
    persistence:
      enabled: false
valkey:
  primary:
    persistence:
      enabled: false

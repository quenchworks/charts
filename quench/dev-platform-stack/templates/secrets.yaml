{{- /* Generated once and kept across upgrades (and on uninstall). Fixed name: the subcharts read
it from plain values. forgejo-admin-basic is the administrator's HTTP Basic header value, for the
OAuth Job. */ -}}
{{- $name := "devplat-secrets" -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $adminPw := index $old "forgejo-admin-password" | default (randAlphaNum 32 | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "devplat.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ index $old "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  valkey-password: {{ index $old "valkey-password" | default (randAlphaNum 32 | b64enc) }}
  woodpecker-agent-secret: {{ index $old "woodpecker-agent-secret" | default (randAlphaNum 48 | b64enc) }}
  forgejo-admin-password: {{ $adminPw }}
  forgejo-admin-basic: {{ printf "%s:%s" .Values.admin.username ($adminPw | b64dec) | b64enc | b64enc }}

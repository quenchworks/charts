apiVersion: v2
name: dev-platform-stack
description: "Forgejo (Git hosting) with Woodpecker CI, PostgreSQL and Valkey: repositories, pull requests and pipelines in one install, with Forgejo on PostgreSQL and Valkey and the Forgejo OAuth app for Woodpecker created at install. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.2
appVersion: "15.0.11"
keywords:
  - forgejo
  - git
  - woodpecker
  - ci
  - postgresql
  - valkey
  - stack

# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-openresty, OCI URL oci://ghcr.io/quenchworks/charts/openresty.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # openresty (oci://ghcr.io/quenchworks/charts/openresty)

# The digest below is the contract with the image factory. CI rewrites it from
# manifests/openbao.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/openbao
  digest: "sha256:8cd6bade1357e80b74a9e5eaf9e909f55ddf13735904e513041ad6214cc91ba0"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single node. OpenBao's HA story is a multi-node raft cluster over the headless
# service (8201); that, plus TLS and auto-unseal, is a tracked follow-up. This
# chart ships the self-contained single-node server.
replicaCount: 1

# --- Server mode ---------------------------------------------------------------
# DEFAULT: a real (non-dev) single node with raft integrated storage. It boots
# SEALED and UNINITIALIZED — that is EXPECTED. Run `bao operator init` then
# unseal before it serves secrets (see NOTES / README).
#
# DEV MODE (dev.enabled=true): an auto-unsealed, IN-MEMORY server with a fixed
# root token. For quick start / smoke tests ONLY — never for production: data is
# not persisted and the root token is well-known.
dev:
  enabled: false
  # Root token for dev mode. Empty => a random token is generated into a Secret.
  rootToken: ""

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

service:
  type: ClusterIP
  # HTTP API / CLI port.
  apiPort: 8200
  # Raft cluster (server-to-server) port; used by the headless service for HA.
  clusterPort: 8201

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
startupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

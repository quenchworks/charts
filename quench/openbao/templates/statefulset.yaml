{{/*
Probes. The DEFAULT (real) server boots SEALED + UNINITIALIZED, and OpenBao's
/v1/sys/health returns 503 (sealed) / 501 (uninitialized) — gating readiness on a
plain 200 would leave the pod NotReady forever. OpenBao/Vault health accepts query
params to remap those statuses, so we ask it to return 200 for standby/sealed/uninit:
the pod is "up and reachable" even before init/unseal. In dev mode the node auto-unseals
and the same endpoint returns 200 anyway. Liveness is a cheap tcpSocket on the API port.
*/}}
{{- $healthPath := "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" -}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 15 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" $healthPath "port" "http") "initialDelaySeconds" 5 "periodSeconds" 10 -}}
{{- $startup := dict "httpGet" (dict "path" $healthPath "port" "http") "initialDelaySeconds" 5 "periodSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "openbao.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openbao.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: openbao
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # read-only rootfs: raft state lives on the writable PVC (BAO_DATA_DIR),
            # the seeded bao.hcl + the CLI token-helper's HOME live on a writable
            # emptyDir (BAO_CONFIG_DIR). The entrypoint reads these.
            - name: BAO_DATA_DIR
              value: /openbao/data
            - name: BAO_CONFIG_DIR
              value: /openbao/config
            # Stable raft node id + advertised addresses over the headless service.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_NODE_ID
              value: "$(POD_NAME)"
            - name: BAO_API_ADDR
              value: "http://$(POD_NAME).{{ include "openbao.headlessName" . }}:{{ .Values.service.apiPort }}"
            - name: BAO_CLUSTER_ADDR
              value: "http://$(POD_NAME).{{ include "openbao.headlessName" . }}:{{ .Values.service.clusterPort }}"
            {{- if .Values.dev.enabled }}
            # DEV MODE: auto-unsealed, in-memory. NOT for production.
            - name: BAO_DEV
              value: "1"
            - name: BAO_DEV_ROOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openbao.devSecretName" . }}
                  key: dev-root-token
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.apiPort }}
            - name: cluster
              containerPort: {{ .Values.service.clusterPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # raft integrated storage (PVC on a read-only rootfs).
            - name: data
              mountPath: /openbao/data
            # writable seeded config dir; also HOME for the CLI token-helper.
            - name: config
              mountPath: /openbao/config
            # writable scratch.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

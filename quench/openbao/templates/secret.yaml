{{- if .Values.dev.enabled }}
{{/*
Dev-mode root token. Used ONLY when dev.enabled=true (auto-unsealed, in-memory
server for quick start / smoke tests). If dev.rootToken is unset, generate a
random one; reuse the existing Secret's value across upgrades so the token is stable.
*/}}
{{- $name := include "openbao.devSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.dev.rootToken -}}
{{- if and (not $token) $existing -}}{{- $token = index $existing.data "dev-root-token" | b64dec -}}{{- end -}}
{{- if not $token -}}{{- $token = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  dev-root-token: {{ $token | b64enc | quote }}
{{- end }}

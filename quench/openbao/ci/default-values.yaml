# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
# Dev mode so the node auto-unseals and /v1/sys/health returns 200 in the gate, and a
# kv put/get roundtrip can run. In-memory (no PVC) keeps the gate tiny.
dev:
  enabled: true
  rootToken: "ci-gate-root-token"
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

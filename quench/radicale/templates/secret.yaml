{{- /* The account: its password is generated once and read back on upgrade. "htpasswd" is the bcrypt
       line Radicale reads; it is kept while the password stays the same, so upgrades do not roll the pod. */}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $oldpw := get $old "password" | b64dec }}
{{- $pw := .Values.auth.password | default $oldpw | default (randAlphaNum 24) }}
{{- $line := get $old "htpasswd" | b64dec }}
{{- if or (ne $pw $oldpw) (not (hasPrefix (printf "%s:" .Values.auth.username) $line)) }}
{{- $line = htpasswd .Values.auth.username $pw }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.auth.username | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
  htpasswd: {{ printf "%s\n" $line | b64enc | quote }}
{{- end }}

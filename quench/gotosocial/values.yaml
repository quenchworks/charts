# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/gotosocial
  digest: "sha256:c08fd922ad683d044d47f52cfa17eaec3b625688633d2ae0b3cc77b7c22f27e8"
  pullPolicy: IfNotPresent

nameOverride: ""

# GoToSocial keeps its SQLite database and media under /gotosocial/storage: one replica (Recreate).
replicaCount: 1
updateStrategy:
  type: Recreate

# The instance's domain (required, cannot change once the instance has federated), the protocol clients use
# (https behind an ingress), and an optional account domain for user@domain handles on another host.
host: ""
protocol: https
accountDomain: ""

# The admin account the chart creates (CLI, after the first start) and keeps in step with the Secret.
# Empty password: generated into the Secret <fullname> (password). GoToSocial wants a strong password.
admin:
  username: admin
  email: admin@example.com
  password: ""
  existingSecret: ""   # a Secret with key "password" instead

# Let anyone submit a sign-up request (an admin still approves it).
registrationOpen: false
# Proxies whose X-Forwarded-For GoToSocial trusts (your ingress), e.g. ["10.0.0.0/8"].
trustedProxies: []

# More GTS_* settings, e.g. GTS_INSTANCE_LANGUAGES: "en", GTS_MEDIA_REMOTE_CACHE_DAYS: "7".
settings: {}

# The data volume: the SQLite database and media (/gotosocial/storage).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { cpu: 1, memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: GoToSocial serves HTTPS instead of HTTP on its one port from the PEM pair at /tls. The
# certificate comes from the first source set: existingSecret, then a cert-manager Certificate, else a
# Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

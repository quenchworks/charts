# Install gate values. Fits a single kind node: Loki runs with ephemeral storage
# (emptyDir at /loki), modest resources. Components use their charts' real
# CI-maintained image digests; Vector uses the umbrella's pinned digest.
loki:
  enabled: true
  persistence:
    enabled: false        # emptyDir at /loki for the gate
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

grafana:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Vector is ON for this stack (log aggregation needs to read pod logs); it takes
# host access (read-only node log dirs) by design.
vector:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: loki
    version: 0.0.31
    repository: oci://ghcr.io/quenchworks/charts
    condition: loki.enabled
  - name: grafana
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
# ponytail: Vector is NOT a chart dependency. The quench/vector component chart is
# deployment-only and renders its config via `toYaml .Values.vectorConfig` — so it
# cannot run as a DaemonSet, cannot mount host log dirs, and cannot template the
# Loki sink URL with {{ .Release.Name }}. We template the Vector log-shipper
# DaemonSet inline (templates/vector.yaml) instead, exactly as observability-stack
# templates node-exporter inline. Image still pinned to the vector 0.54.0 digest.
# (vector 0.0.4 is referenced in artifacthub.io/images for provenance, not as a dep.)

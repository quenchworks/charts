apiVersion: v2
name: logging-stack
description: "Hardened, operator-free logging stack: Loki + Grafana + Vector, wired together for cluster log aggregation and browsing. Vector ships every pod's logs to Loki; Grafana queries Loki through a pre-provisioned datasource with a ready-made logs dashboard. No CRDs, no logging operator. All components are QuenchWorks-hardened, nonroot, 0-CVE images pinned by digest and cosign-signed. Vector runs as a host DaemonSet (read-only node log dirs) by design — that is the deliberate, toggleable trade-off for a log shipper."
type: application
version: 0.0.21
appVersion: "0.58.0"
keywords:
  - logging
  - logs
  - loki
  - grafana
  - vector
  - log-aggregation
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/loki
  - https://github.com/grafana/grafana
  - https://github.com/vectordotdev/vector
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Rebuilt image with cargo auditable (Rust crates now scanned) and crate floors"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: loki
      image: ghcr.io/quenchworks/images/loki@sha256:6d2b4f48926d4059fb060b4cb3e447b3e1b06cb1cf716bd8903e0bad27b8df3a
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:dc5f670bac19c33670a33db6f724907093e8037a5578086643bb117088db9fd7
    - name: vector
      image: ghcr.io/quenchworks/images/vector@sha256:6ebe2c55233d5904bfb515675e95c98c01d93b2f6ecdea92cc1c7389e547fda9
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images

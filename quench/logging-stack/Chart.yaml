apiVersion: v2
name: logging-stack
description: "Hardened, operator-free logging stack: Loki + Grafana + Vector, wired together for cluster log aggregation and browsing. Vector ships every pod's logs to Loki; Grafana queries Loki through a pre-provisioned datasource with a ready-made logs dashboard. No CRDs, no logging operator. All components are QuenchWorks-hardened, nonroot, 0-CVE images pinned by digest and cosign-signed. Vector runs as a host DaemonSet (read-only node log dirs) by design — that is the deliberate, toggleable trade-off for a log shipper."
type: application
version: 0.0.6
appVersion: "1.0.0"
keywords:
  - logging
  - logs
  - loki
  - grafana
  - vector
  - log-aggregation
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/loki
  - https://github.com/grafana/grafana
  - https://github.com/vectordotdev/vector
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Re-pinned loki to rebuilt 0-CVE image digests."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: loki
      image: ghcr.io/quenchworks/images/loki@sha256:f6b33056aba27769cf21c1f9f096ac44efd565e3bb312414ed1389850bb18335
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:ae5dfc810d218c92a6e3e5ae2401317c86ab76206e5f53c3388c74ef7961f995
    - name: vector
      image: ghcr.io/quenchworks/images/vector@sha256:4d67202d12a453b1347b271982b54dde292563235b6bc3500f2cf23579ba2df2
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: loki
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: loki.enabled
  - name: grafana
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled
# ponytail: Vector is NOT a chart dependency. The quench/vector component chart is
# deployment-only and renders its config via `toYaml .Values.vectorConfig` — so it
# cannot run as a DaemonSet, cannot mount host log dirs, and cannot template the
# Loki sink URL with {{ .Release.Name }}. We template the Vector log-shipper
# DaemonSet inline (templates/vector.yaml) instead, exactly as observability-stack
# templates node-exporter inline. Image still pinned to the vector 0.54.0 digest.
# (vector 0.0.4 is referenced in artifacthub.io/images for provenance, not as a dep.)

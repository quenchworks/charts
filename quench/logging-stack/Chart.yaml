apiVersion: v2
name: logging-stack
description: "Hardened, operator-free logging stack: Loki + Grafana + Vector, wired together for cluster log aggregation and browsing. Vector ships every pod's logs to Loki; Grafana queries Loki through a pre-provisioned datasource with a ready-made logs dashboard. No CRDs, no logging operator. All components are QuenchWorks-hardened, nonroot, CVE-gated images pinned by digest and cosign-signed. Vector runs as a host DaemonSet (read-only node log dirs) by design — that is the deliberate, toggleable trade-off for a log shipper."
type: application
version: 0.0.37
appVersion: "0.58.0"
keywords:
  - logging
  - logs
  - loki
  - grafana
  - vector
  - log-aggregation
  - observability
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/grafana/loki
  - https://github.com/grafana/grafana
  - https://github.com/vectordotdev/vector
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles loki=0.0.31 (loki 3.7.10)"
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |

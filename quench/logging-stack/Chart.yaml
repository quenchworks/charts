    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:b57a376c691e019e391fcb472247c14a8c825879bcf9a5d760590b0d887bbd72
    - name: vector
      image: ghcr.io/quenchworks/images/vector@sha256:95a1bf64d6c32604f02fc319cbcf538dcb0ddbb7077371e93eb8315343152ac9

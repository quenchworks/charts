{{- if .Values.grafana.enabled }}
# Grafana datasource provisioning, owned by the umbrella (not the grafana
# subchart) so the content can reference the release-prefixed Loki service name.
# FIXED name (not release-prefixed) so it can be referenced from the static
# grafana.extraVolumes value in values.yaml.
# ponytail: fixed ConfigMap name => one logging-stack per namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-stack-datasources
  labels:
    {{- include "logging-stack.labels" . | nindent 4 }}
data:
  # Dropped into GF_PATHS_PROVISIONING/datasources/stack.yaml; Grafana wires it
  # on boot. Points at this stack's Loki.
  stack.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        # Fixed uid: the bundled dashboard is normalized to bind every datasource
        # reference to uid "loki", so this MUST stay "loki".
        uid: loki
        access: proxy
        url: http://{{ include "logging-stack.lokiName" . }}:{{ .Values.loki.service.port | default 3100 }}
        isDefault: true
        editable: false
{{- end }}

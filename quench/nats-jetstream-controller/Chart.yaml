apiVersion: v2
name: nats-jetstream-controller
description: "NATS JetStream Controller (NACK): manage JetStream streams, consumers, key-value and object stores and accounts on a NATS server from Kubernetes custom resources. The six CRDs ship with the chart. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.2
appVersion: "0.25.0"
kubeVersion: ">=1.26.0-0"
keywords:
  - nats
  - jetstream
  - nack
  - messaging
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nats-io/nack
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: streaming-messaging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: nats-jetstream-controller
      image: ghcr.io/quenchworks/images/nats-jetstream-controller@sha256:3500fa4cc58cf85c83ff8989ce76186e72d79cc3d783e420dfe7951fc4fabb9f
  artifacthub.io/crds: |
    - kind: Stream
      version: v1beta2
      name: streams.jetstream.nats.io
      displayName: Stream
      description: JetStream Stream managed by NACK.
    - kind: Consumer
      version: v1beta2
      name: consumers.jetstream.nats.io
      displayName: Consumer
      description: JetStream Consumer managed by NACK.
    - kind: StreamTemplate
      version: v1beta1
      name: streamtemplates.jetstream.nats.io
      displayName: StreamTemplate
      description: JetStream StreamTemplate managed by NACK.
    - kind: Account
      version: v1beta2
      name: accounts.jetstream.nats.io
      displayName: Account
      description: JetStream Account managed by NACK.
    - kind: KeyValue
      version: v1beta2
      name: keyvalues.jetstream.nats.io
      displayName: KeyValue
      description: JetStream KeyValue managed by NACK.
    - kind: ObjectStore
      version: v1beta2
      name: objectstores.jetstream.nats.io
      displayName: ObjectStore
      description: JetStream ObjectStore managed by NACK.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

# Install gate. freshclam is off: database.clamav.net rate-limits CI ranges, so a
# gate that downloaded the real database would fail for reasons unrelated to
# the chart. customSignatures is the whole database instead: the EICAR test
# file's MD5. The smoke check streams EICAR and a clean payload to clamd.
freshclam:
  enabled: false
customSignatures:
  quench-test.hdb: |
    44d88612fea8a8f36de82e1278abb02f:68:Quench.Test.EICAR
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

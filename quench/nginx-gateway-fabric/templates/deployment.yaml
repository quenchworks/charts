{{/* Both digests are checked before anything renders -- see the helper for why. */}}
{{- include "nginx-gateway-fabric.assertDigest" (dict "digest" .Values.image.digest "field" "image.digest") -}}
{{- if .Values.nginx.image.digest -}}
{{- include "nginx-gateway-fabric.assertDigest" (dict "digest" .Values.nginx.image.digest "field" "nginx.image.digest") -}}
{{- end -}}
{{/* The health server is pod-local: /readyz reports ready once the caches have synced
     and the agent gRPC server is listening. There is no /healthz, so liveness uses the
     same endpoint -- a control plane whose caches never sync is not alive either. */}}
{{- $readiness := dict "httpGet" (dict "path" "/readyz" "port" "health") "periodSeconds" 10 "timeoutSeconds" 1 -}}
{{- $startup := dict "httpGet" (dict "path" "/readyz" "port" "health") "periodSeconds" 2 "timeoutSeconds" 1 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{/* The data plane's spec lives in the NginxProxy, not in this pod, so a change
             there must NOT roll the control plane -- the controller picks it up by
             watching. Only the NginxGateway is hashed here, because --config is read at
             startup for its initial value. */}}
        checksum/config: {{ include (print $.Template.BasePath "/nginxgateway.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        {{- if .Values.metrics.secure }}
        prometheus.io/scheme: "https"
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: nginx-gateway
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{/* The image entrypoint is the bare binary: this same image also runs
               `generate-certs` in the Job and `initialize` as the data plane's init
               container, so the subcommand belongs here. */}}
          command: ["/usr/bin/gateway"]
          args:
            - "controller"
            - "--gateway-ctlr-name={{ .Values.controllerName }}"
            - "--gatewayclass={{ .Values.gatewayClass.name }}"
            - "--config={{ include "nginx-gateway-fabric.configName" . }}"
            - "--service={{ include "quench-common.fullname" . }}"
            - "--agent-tls-secret={{ .Values.certGenerator.agentTLSSecretName }}"
            - "--health-port={{ .Values.healthPort }}"
            {{- with .Values.watchNamespaces }}
            - "--watch-namespaces={{ join "," . }}"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - "--metrics-port={{ .Values.metrics.port }}"
            {{- if .Values.metrics.secure }}
            - "--metrics-secure-serving"
            {{- end }}
            {{- else }}
            - "--metrics-disable"
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - "--leader-election-lock-name={{ include "nginx-gateway-fabric.leaderElectionName" . }}"
            {{- else }}
            - "--leader-election-disable"
            {{- end }}
            {{- if not .Values.productTelemetry.enabled }}
            - "--product-telemetry-disable"
            {{- end }}
            {{- if .Values.gatewayApiExperimentalFeatures.enabled }}
            - "--gateway-api-experimental-features"
            {{- end }}
            {{- if .Values.snippetsFilters.enabled }}
            - "--snippets-filters"
            {{- end }}
            {{- if .Values.snippets.enabled }}
            - "--snippets"
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            {{/* NOT decoration: the provisioner reads IMAGE_NAME and uses it verbatim
                 as the init container image of every data-plane pod. A wrong or unset
                 value gives every nginx pod an Init:ImagePullBackOff. */}}
            - name: IMAGE_NAME
              value: {{ include "quench-common.image" . | quote }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{/* The data plane connects here. Named, because the Service targets the
                 name rather than the number. */}}
            - name: agent-grpc
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{/* The server half of the mTLS pair. The path is not configurable: the
                 agent config the control plane generates points the data plane at
                 /var/run/secrets/ngf on ITS side, and the control plane reads its own
                 certificate from the same path here. */}}
            - name: server-tls
              mountPath: /var/run/secrets/ngf
              readOnly: true
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: server-tls
          secret:
            secretName: {{ .Values.certGenerator.serverTLSSecretName }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

{{/*
Control-plane configuration as a custom resource rather than a flag, because NGF
watches it: `kubectl edit nginxgateway` changes the log level of a running control
plane with no restart. The Deployment passes its name as --config.
*/}}
apiVersion: gateway.nginx.org/v1alpha1
kind: NginxGateway
metadata:
  name: {{ include "nginx-gateway-fabric.configName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  logging:
    level: {{ .Values.logLevel }}

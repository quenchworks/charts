     its Gateway's namespace, which may be any namespace. */}}
{{- include "quench-common.networkPolicy" (dict "ctx" . "defaultPorts" (list
     (dict "port" "agent-grpc" "protocol" "TCP")
     (dict "port" "metrics" "protocol" "TCP"))) }}

apiVersion: v2
name: nginx-gateway-fabric
description: "NGINX Gateway Fabric, the F5/NGINX Gateway API implementation: a control plane that watches GatewayClass, Gateway, HTTPRoute and its own gateway.nginx.org policy CRDs, provisions an nginx data plane per Gateway, and configures it over an nginx-agent gRPC stream. Both halves are hardened by QuenchWorks as minimal, nonroot, 0-CVE images, cosign-signed and pinned by digest. Ships only NGF's own CRDs -- the Gateway API CRDs are owned by the separate quench gateway-api-crds chart and must be installed first."
type: application
version: 0.0.2
appVersion: "2.6.7"
kubeVersion: ">=1.29.0-0"
keywords:
  - nginx-gateway-fabric
  - nginx
  - gateway-api
  - ingress
  - api-gateway
  - control-plane
  - networking
  - proxy
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/nginx/nginx-gateway-fabric
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: security
      description: "Automated re-pin: nginx-gateway-fabric republished to a new 0-CVE digest."
  artifacthub.io/images: |
    - name: nginx-gateway-fabric
      image: ghcr.io/quenchworks/images/nginx-gateway-fabric@sha256:185ece330c6221c0a31708c6c90b012765edd05d38f9f173b9408337f8119792
    - name: nginx-gateway-fabric-nginx
      image: ghcr.io/quenchworks/images/nginx-gateway-fabric-nginx@sha256:28f46367ba5da843bafc0a8d454de03a61414e0049de236cbb428a3f9a5f35d0
  artifacthub.io/crds: |
    - kind: NginxProxy
      version: v1alpha2
      name: nginxproxies.gateway.nginx.org
      displayName: NginxProxy
      description: Data-plane settings for a GatewayClass or Gateway -- the nginx workload it provisions, its Service, logging, metrics and global nginx tuning.
    - kind: NginxGateway
      version: v1alpha1
      name: nginxgateways.gateway.nginx.org
      displayName: NginxGateway
      description: Dynamic configuration of the control plane itself, principally its log level, changeable without a restart.
    - kind: ClientSettingsPolicy
      version: v1alpha1
      name: clientsettingspolicies.gateway.nginx.org
      displayName: ClientSettingsPolicy
      description: Downstream client behaviour for a Gateway or route -- body size and buffering limits, keep-alives.
    - kind: ObservabilityPolicy
      version: v1alpha2
      name: observabilitypolicies.gateway.nginx.org
      displayName: ObservabilityPolicy
      description: Per-route tracing settings. Requires ngx_otel_module, which the QuenchWorks data-plane image does not build.
    - kind: UpstreamSettingsPolicy
      version: v1alpha1
      name: upstreamsettingspolicies.gateway.nginx.org
      displayName: UpstreamSettingsPolicy
      description: Upstream behaviour for the Services a route points at -- connection pooling, zone size.
    - kind: ProxySettingsPolicy
      version: v1alpha1
      name: proxysettingspolicies.gateway.nginx.org
      displayName: ProxySettingsPolicy
      description: Proxy timeouts and buffering for a Gateway or route.
    - kind: RateLimitPolicy
      version: v1alpha1
      name: ratelimitpolicies.gateway.nginx.org
      displayName: RateLimitPolicy
      description: nginx limit_req rate limiting attached to a Gateway or route.
    - kind: AuthenticationFilter
      version: v1alpha1
      name: authenticationfilters.gateway.nginx.org
      displayName: AuthenticationFilter
      description: Request authentication (JWT, basic) referenced from an HTTPRoute as an extensionRef filter.
    - kind: SnippetsFilter
      version: v1alpha1
      name: snippetsfilters.gateway.nginx.org
      displayName: SnippetsFilter
      description: Raw nginx directives injected at a route's location, as an extensionRef filter. Disabled unless snippetsFilters.enabled is set.
    - kind: SnippetsPolicy
      version: v1alpha1
      name: snippetspolicies.gateway.nginx.org
      displayName: SnippetsPolicy
      description: Raw nginx directives injected at the http/server/main level. Disabled unless snippets.enabled is set.
    - kind: WAFPolicy
      version: v1alpha1
      name: wafpolicies.gateway.nginx.org
      displayName: WAFPolicy
      description: NGINX App Protect WAF enforcement. Requires NGINX Plus, which this chart does not ship; the CRD is installed because the controller watches the type unconditionally.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
    - name: upstream
      url: https://github.com/nginx/nginx-gateway-fabric
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

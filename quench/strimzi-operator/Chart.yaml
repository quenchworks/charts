apiVersion: v2
name: strimzi-operator
description: "Strimzi cluster operator: run Apache Kafka on Kubernetes from CRDs (Kafka, KafkaNodePool, KafkaTopic, KafkaUser, KafkaConnect, KafkaMirrorMaker2). The CRDs ship with the chart; brokers, controllers, Connect and Kafka Exporter run on the QuenchWorks strimzi-kafka image. Cruise Control is not supported. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "1.2.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - strimzi
  - kafka
  - kraft
  - operator
  - streaming
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/strimzi/strimzi-kafka-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned strimzi-kafka 1.2.0-kafka-4.3.1 to the rebuilt digests."
  artifacthub.io/category: streaming-messaging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: strimzi-operator
      image: ghcr.io/quenchworks/images/strimzi-operator@sha256:289b1b464ca510cff260c9fcb18fe063ff53b6f59f545d23a9a3aaec61323795
    - name: strimzi-kafka
      image: ghcr.io/quenchworks/images/strimzi-kafka@sha256:203e73812015002bba18f508e90d3598e2d2d70693f219fc4dce4afe13d6b4cc
  artifacthub.io/crds: |
    - kind: Kafka
      version: v1
      name: kafkas.kafka.strimzi.io
      displayName: Kafka
      description: A KRaft Kafka cluster.
    - kind: KafkaNodePool
      version: v1

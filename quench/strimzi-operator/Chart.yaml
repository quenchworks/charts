apiVersion: v2
name: strimzi-operator
description: "Strimzi cluster operator: run Apache Kafka on Kubernetes from CRDs (Kafka, KafkaNodePool, KafkaTopic, KafkaUser, KafkaConnect, KafkaMirrorMaker2). The CRDs ship with the chart; brokers, controllers, Connect and Kafka Exporter run on the QuenchWorks strimzi-kafka image. Cruise Control is not supported. Hardened by QuenchWorks, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.9
appVersion: "1.2.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - strimzi
  - kafka
  - kraft
  - operator
  - streaming
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/strimzi/strimzi-kafka-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "quench-common 0.0.14 (no template change; the library release now renders consumer charts before publishing)"
  artifacthub.io/category: streaming-messaging
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: strimzi-operator
      image: ghcr.io/quenchworks/images/strimzi-operator@sha256:95e26ff499c09e0b7a50d1c583903166f8b2cb0229e24237954e49360002f1e5
    - name: strimzi-kafka
      image: ghcr.io/quenchworks/images/strimzi-kafka@sha256:53356b37e76345b3e461c3a34068099ccd690fae016ec590a04ce07f082e666d
  artifacthub.io/crds: |
    - kind: Kafka
      version: v1
      name: kafkas.kafka.strimzi.io
      displayName: Kafka
      description: A KRaft Kafka cluster.
    - kind: KafkaNodePool
      version: v1
      name: kafkanodepools.kafka.strimzi.io
      displayName: Kafka node pool
      description: A group of Kafka nodes with the same roles and storage.
    - kind: KafkaTopic
      version: v1
      name: kafkatopics.kafka.strimzi.io
      displayName: Kafka topic
      description: A topic managed by the topic operator.
    - kind: KafkaUser
      version: v1
      name: kafkausers.kafka.strimzi.io
      displayName: Kafka user
      description: A user and its ACLs managed by the user operator.
    - kind: KafkaConnect
      version: v1
      name: kafkaconnects.kafka.strimzi.io
      displayName: Kafka Connect
      description: A Kafka Connect cluster.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:

{{- /* odyssey.conf carries the user passwords, so the whole file lives in a Secret. */}}
{{- $tls := include "quench-common.tls.enabled" . }}
{{- $users := list }}
{{- range .Values.users }}
{{- $pw := .password | default "" }}
{{- if .existingSecret }}
{{- $s := lookup "v1" "Secret" $.Release.Namespace .existingSecret }}
{{- $pw = (get (($s | default dict).data | default dict) (.existingSecretKey | default "password")) | default "" | b64dec }}
{{- end }}
{{- if not $pw }}{{ fail (printf "odyssey: user %s has no password (password or a readable existingSecret)" .name) }}{{ end }}
{{- $users = append $users (dict "name" .name "password" $pw) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  odyssey.conf: |
    daemonize no
    log_to_stdout yes
    log_format "%p %t %l [%i %s] (%c) %m\n"
    unix_socket_dir "/tmp"
    unix_socket_mode "0644"
    workers {{ .Values.workers }}
    {{- with .Values.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
    listen {
      host "*"
      port {{ .Values.port }}
      {{- if $tls }}
      tls "require"
      tls_cert_file "/tls/tls.crt"
      tls_key_file "/tls/tls.key"
      {{- else }}
      tls "disable"
      {{- end }}
    }
    storage "postgres" {
      type "remote"
      host {{ .Values.postgres.host | quote }}
      port {{ .Values.postgres.port }}
    }
    database default {
    {{- range $users }}
      user {{ .name | quote }} {
        authentication "scram-sha-256"
        password {{ .password | quote }}
        storage "postgres"
        storage_user {{ .name | quote }}
        storage_password {{ .password | quote }}
        pool {{ $.Values.pool.mode | quote }}
        pool_size {{ $.Values.pool.size }}
        pool_discard {{ ternary "yes" "no" $.Values.pool.discard }}
      }
    {{- end }}
    }

{{- $probe := dict "tcpSocket" (dict "port" 4747) "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # gonic refuses to start unless its podcast and playlist directories exist; they live on the volume
        - name: dirs
          image: {{ printf "%s@%s" .Values.busybox.repository .Values.busybox.digest }}
          imagePullPolicy: {{ .Values.busybox.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["mkdir", "-p", "/data/podcasts", "/data/playlists"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - name: data
              mountPath: /data
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: gonic
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: GONIC_PODCAST_PATH, value: /data/podcasts }
            - { name: GONIC_PLAYLISTS_PATH, value: /data/playlists }
            - { name: GONIC_SCAN_INTERVAL, value: {{ .Values.scanIntervalMinutes | quote }} }
            {{- range $k, $v := .Values.settings }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "gonic.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
            - name: music
              mountPath: /music
              readOnly: true
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: music
          {{- if .Values.music.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.music.existingClaim }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gonic.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

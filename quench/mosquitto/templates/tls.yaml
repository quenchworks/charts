{{- include "quench-common.tls.resources" . }}
{{- if include "quench-common.tls.enabled" . }}
---
# An MQTT/TLS listener dropped into /etc/mosquitto/conf.d, which the default config includes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}-tls
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  tls-quench.conf: |
    listener 8883
    certfile /tls/tls.crt
    keyfile /tls/tls.key
    cafile /tls/ca.crt
{{- end }}

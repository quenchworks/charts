{{- if and .Values.config.conf (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosquitto.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted over /etc/mosquitto/mosquitto.conf (replaces the image default).
  mosquitto.conf: |-
    {{- .Values.config.conf | nindent 4 }}
{{- end }}

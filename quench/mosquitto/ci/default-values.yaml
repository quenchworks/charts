# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A tiny PVC (kind ships a default StorageClass) keeps /mosquitto/data writable; the
# gate confirms the broker accepts MQTT connections on 1883.
persistence:
  enabled: true
  size: 256Mi
resources:
  requests: { cpu: 25m, memory: 24Mi }
  limits: { cpu: 250m, memory: 128Mi }

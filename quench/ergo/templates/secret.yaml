{{- /* The oper (IRC operator "admin") password and its bcrypt hash, generated once and read back on upgrade.
       The image ships the hash of a random throwaway password; this one replaces it. */}}
{{- if not .Values.oper.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
{{- $pw := .Values.oper.password | default (get $old "oper-password" | b64dec) | default (randAlphaNum 24) }}
{{- $hash := get $old "oper-password-hash" | b64dec }}
{{- if or (not $hash) (ne $pw (get $old "oper-password" | b64dec)) }}{{ $hash = bcrypt $pw }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  oper-password: {{ $pw | b64enc | quote }}
  oper-password-hash: {{ $hash | b64enc | quote }}
{{- end }}

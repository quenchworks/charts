# The digest below is the contract with the image factory. CI rewrites it from
# manifests/postgresql.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/postgresql
  digest: "sha256:601897da3768720a98ee45b80303da7d4be2eb5b48a64c214dd4b290e04edc9d"
  pullPolicy: IfNotPresent

nameOverride: ""

# Topology.
#   standalone  — one postgres pod (the backward-compatible default).
#   replication — a Patroni-managed HA cluster: N pods in one StatefulSet, each
#                 running `patroni` (which supervises postgres). Patroni elects a
#                 leader through the Kubernetes API (no external etcd), drives
#                 streaming replication, and rejoins a demoted node with pg_rewind.
#                 The <fullname>/<fullname>-primary Services follow the elected
#                 leader (role=master label); <fullname>-replica fans out reads.
architecture: standalone

# Patroni HA settings — only used when architecture: replication.
ha:
  # Cluster members. 3 is the smallest quorum-safe size (tolerates 1 loss).
  # Use an odd count so a majority is unambiguous.
  replicaCount: 3
  # Streaming-replication role Patroni creates and uses to clone/stream.
  replicationUsername: replicator
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""
    accessModes: ["ReadWriteOnce"]
    annotations: {}
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Extra postgresql.parameters merged into Patroni's bootstrap DCS config (applied
  # cluster-wide, e.g. { max_connections: "200", shared_buffers: "256MB" }).
  extraParameters: {}
  # PodDisruptionBudget for the cluster. minAvailable: 2 keeps a 3-node cluster
  # above quorum during a voluntary drain (never let a drain break the majority).
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

# Authentication. On by default; PostgreSQL requires a superuser password to initialize.
# A random password is generated if you do not set one.
auth:
  enabled: true
  username: postgres          # superuser created by initdb
  password: ""
  database: ""                # optional extra database; empty means just the default
  existingSecret: ""
  existingSecretPasswordKey: "postgres-password"

primary:
  persistence:
    enabled: true
    size: 8Gi
    # storageClass: ""        # default class if unset
    accessModes: ["ReadWriteOnce"]
    annotations: {}
    selector: {}
    existingClaim: ""         # bind an existing PVC instead of provisioning one
  # /dev/shm is tiny in containers; back it with memory so parallel queries do not fail
  shmVolume:
    enabled: true
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

service:
  type: ClusterIP
  port: 5432

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

# Prometheus metrics via a hardened postgres_exporter sidecar, built by our own factory.
metrics:
  enabled: false
  image:
    repository: ghcr.io/quenchworks/images/postgres-exporter
    digest: "sha256:fab4d5790531b5cd9daad06a8651fe4ca1009620701394b81c34ed9b7ebc9bbb"
    pullPolicy: IfNotPresent
  port: 9187
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

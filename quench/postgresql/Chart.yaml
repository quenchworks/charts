apiVersion: v2
name: postgresql
description: Quenchworks hardened PostgreSQL. Minimal, nonroot, 0-CVE image pinned by digest.
type: application
version: 0.0.5
appVersion: "18.4"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: changed
      description: "Bundle contrib extensions (btree_gin, btree_gist, pg_trgm, pgcrypto, hstore, citext, pg_stat_statements, intarray, ltree, unaccent, fuzzystrmatch, tablefunc) in the base image; repin to the rebuilt image digest."
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts

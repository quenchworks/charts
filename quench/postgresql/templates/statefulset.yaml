apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  serviceName: {{ include "postgresql.headlessName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: primary
    spec:
      serviceAccountName: {{ include "postgresql.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            # PGDATA is a subdir of the mounted volume so initdb owns a clean directory
            # (avoids lost+found and mount-point ownership issues).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | quote }}
            {{- if .Values.auth.database }}
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: {{ include "postgresql.secretPasswordKey" . }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: {{ include "postgresql.secretPasswordKey" . }}
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "/var/run/postgresql", "-U", {{ .Values.auth.username | quote }}, "-q"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.primary.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            {{- if .Values.primary.shmVolume.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ printf "%s@%s" .Values.metrics.image.repository (required "metrics.image.digest is required" .Values.metrics.image.digest) }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            # DATA_SOURCE_* keeps the password out of a URI, so no URL-encoding is needed
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: {{ .Values.auth.username | quote }}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: {{ include "postgresql.secretPasswordKey" . }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.primary.shmVolume.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if not .Values.primary.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.primary.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.primary.persistence.size }}
  {{- end }}

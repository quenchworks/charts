{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "squid.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # squid reads this once at startup; the Deployment's checksum annotation rolls
  # the pods when it changes.
  squid.conf: |-
    {{- include "squid.conf" . | nindent 4 }}
{{- end }}

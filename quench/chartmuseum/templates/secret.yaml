{{- if and .Values.auth.username (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  basic-auth-user: {{ .Values.auth.username | b64enc | quote }}
  basic-auth-pass: {{ required "auth.password is required when auth.username is set (or use auth.existingSecret)" .Values.auth.password | b64enc | quote }}
{{- end }}

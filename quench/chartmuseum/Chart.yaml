apiVersion: v2
name: chartmuseum
description: "ChartMuseum, an HTTP server for Helm chart repositories, with a pluggable storage backend (local disk, S3, GCS, Azure, and more). Hardened by QuenchWorks as a minimal, nonroot, CVE-gated image, cosign-signed and pinned by digest."
type: application
version: 0.0.11
appVersion: "0.16.6"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/helm/chartmuseum
keywords:
  - chartmuseum
  - helm
  - chart-repository
  - registry
  - artifacts
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Image rebuilt with Helm 3.22.1: drops golang.org/x/crypto/openpgp (GO-2026-5932)"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: chartmuseum
      image: ghcr.io/quenchworks/images/chartmuseum@sha256:855560a1e781a411138e5a3088ca0554160fddab4ebe800974dbaaa19610a110
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: chartmuseum
description: "ChartMuseum, an HTTP server for Helm chart repositories, with a pluggable storage backend (local disk, S3, GCS, Azure, and more). Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "0.16.6"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/helm/chartmuseum
keywords:
  - chartmuseum
  - helm
  - chart-repository
  - registry
  - artifacts
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: ChartMuseum 0.16.6 as a Deployment on the hardened 0-CVE QuenchWorks image, pinned by digest."
    - kind: added
      description: "Local-disk storage backed by a PersistentVolumeClaim by default, with every other ChartMuseum backend (amazon, google, microsoft, oracle, alibaba, openstack, baidu, tencent, etcd) selectable via storage.backend plus extraArgs/extraEnvVars."
    - kind: added
      description: "Optional HTTP basic auth (auth.username/auth.password or auth.existingSecret). Unset by default, which leaves the write API OPEN to anonymous clients -- see the README."
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: chartmuseum
      image: ghcr.io/quenchworks/images/chartmuseum@sha256:3af8698e052404bb8c9291b0233c512d6be065c0f1f3d357857d5ff2e2f4aae6
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

apiVersion: v2
name: clickhouse-operator
description: "Altinity ClickHouse Operator: run ClickHouse installations and ClickHouse Keeper from Kubernetes custom resources, with sharding, replication, schema propagation and rolling upgrades. The four CRDs and upstream's default operator and ClickHouse configuration ship with the chart. Hardened by QuenchWorks: the operator and metrics exporter are built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.3
appVersion: "0.27.4"
kubeVersion: ">=1.26.0-0"
keywords:
  - clickhouse
  - clickhouse-operator
  - altinity
  - analytics
  - operator
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/Altinity/clickhouse-operator
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt for CVE-2026-128085 (OpenTelemetry 1.47) and the 2026-11-14 Wolfi package updates."
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: clickhouse-operator
      image: ghcr.io/quenchworks/images/clickhouse-operator@sha256:17c97954e1d044f54af5f709650b3035db76077d9ce9d74712bdefdbf2259b22
    - name: clickhouse-operator-metrics-exporter
      image: ghcr.io/quenchworks/images/clickhouse-operator-metrics-exporter@sha256:323eff99d3d7bfe394d6933b0c424d4caf7f83a1d23fc96bacf869c6efdbef67
  artifacthub.io/crds: |
    - kind: ClickHouseInstallation
      version: v1
      name: clickhouseinstallations.clickhouse.altinity.com
      displayName: ClickHouseInstallation
      description: ClickHouseInstallation managed by the ClickHouse Operator.
    - kind: ClickHouseInstallationTemplate
      version: v1
      name: clickhouseinstallationtemplates.clickhouse.altinity.com
      displayName: ClickHouseInstallationTemplate
      description: ClickHouseInstallationTemplate managed by the ClickHouse Operator.
    - kind: ClickHouseOperatorConfiguration
      version: v1
      name: clickhouseoperatorconfigurations.clickhouse.altinity.com
      displayName: ClickHouseOperatorConfiguration
      description: ClickHouseOperatorConfiguration managed by the ClickHouse Operator.
    - kind: ClickHouseKeeperInstallation
      version: v1
      name: clickhousekeeperinstallations.clickhouse-keeper.altinity.com
      displayName: ClickHouseKeeperInstallation
      description: ClickHouseKeeperInstallation managed by the ClickHouse Operator.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts

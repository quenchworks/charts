{{- if .Values.rbac.create }}
# Upstream's ClusterRole and Role from the release tag's install bundle, verbatim rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, secrets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch, update, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [clickhouse-operator]
    verbs: [get, patch, update, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallationtemplates, clickhouseoperatorconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations/finalizers, clickhouseinstallationtemplates/finalizers, clickhouseoperatorconfigurations/finalizers]
    verbs: [update]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations/status, clickhouseinstallationtemplates/status, clickhouseoperatorconfigurations/status]
    verbs: [get, update, patch, create, delete]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations/finalizers]
    verbs: [update]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations/status]
    verbs: [get, update, patch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "clickhouse-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, secrets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch, update, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [clickhouse-operator]
    verbs: [get, patch, update, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, patch, update, watch, create, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallationtemplates, clickhouseoperatorconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations/finalizers, clickhouseinstallationtemplates/finalizers, clickhouseoperatorconfigurations/finalizers]
    verbs: [update]
  - apiGroups: [clickhouse.altinity.com]
    resources: [clickhouseinstallations/status, clickhouseinstallationtemplates/status, clickhouseoperatorconfigurations/status]
    verbs: [get, update, patch, create, delete]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations/finalizers]
    verbs: [update]
  - apiGroups: [clickhouse-keeper.altinity.com]
    resources: [clickhousekeeperinstallations/status]
    verbs: [get, update, patch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quench-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "clickhouse-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

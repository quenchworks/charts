{{- /* The login the operator uses on every ClickHouse it manages. config.yaml reads Secret
     "clickhouse-operator" in the operator's namespace. Upstream ships a fixed password; the chart
     generates one once and keeps it across upgrades. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "clickhouse-operator" -}}
{{- $pass := "" -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
{{- $pass = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $pass = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-operator
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ "clickhouse_operator" | b64enc }}
  password: {{ $pass | b64enc }}

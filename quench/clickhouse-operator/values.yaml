# The digests below are the contract with the image factory. CI rewrites them from the
# image-published dispatch after every green image build. Never a tag.
image:
  repository: ghcr.io/quenchworks/images/clickhouse-operator
  digest: "sha256:17c97954e1d044f54af5f709650b3035db76077d9ce9d74712bdefdbf2259b22"
  pullPolicy: IfNotPresent

# The metrics exporter that runs beside the operator and scrapes every ClickHouse it manages
# (port 8888). Our image, pinned by digest.
metricsExporter:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/clickhouse-operator-metrics-exporter
    digest: "sha256:323eff99d3d7bfe394d6933b0c424d4caf7f83a1d23fc96bacf869c6efdbef67"
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 500m, memory: 256Mi }

nameOverride: ""

# Namespaces to watch (WATCH_NAMESPACES, literal names or regexps). Empty: every namespace.
watchNamespaces: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
# Bundles the Quenchworks PostgreSQL subchart with persistence off; deterministic
# shared DB credentials; a fixed test admin password; small resources for the runner.
postgresql:
  enabled: true
  auth:
    username: kcadmin
    password: keycloak
    database: keycloak
  primary:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

auth:
  adminUser: admin
  adminPassword: "ci-test-password"

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1536Mi }

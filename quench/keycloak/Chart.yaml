apiVersion: v2
name: keycloak
description: "Open-source identity and access management server providing SSO, user federation, and OAuth2/OIDC and SAML for apps and APIs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.23
appVersion: "26.7.2"
keywords:
  - keycloak
  - iam
  - sso
  - oidc
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bumped the bundled postgresql subchart to 0.0.19, which pins the rebuilt PostgreSQL 18.6 image that ships the uuid-ossp extension."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:7e9bd0bbbb317589e0fabde9cbddafcd22fdfd79716a3feb621efcbf40fe9184
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:919b69c5c86b3a2a454bbe50a24d9d33feb73441bb0d466e583bc3e1a78ac77b
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

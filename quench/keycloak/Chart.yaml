apiVersion: v2
name: keycloak
description: "Open-source identity and access management server providing SSO, user federation, and OAuth2/OIDC and SAML for apps and APIs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.43
appVersion: "26.7.5"
keywords:
  - keycloak
  - iam
  - sso
  - oidc
  - security
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "tls.enabled serves Keycloak over HTTPS on Service port 443 and the management port over HTTPS (existingSecret, cert-manager or self-signed)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:62cd32c071d5349b5149d7b49c912700611667d93253aa50c445067c300145c7
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:42316ed44fa7722f611c35af6edb37882ceaac8c83f48a59735d329d5c12d977
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

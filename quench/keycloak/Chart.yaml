apiVersion: v2
name: keycloak
description: Quenchworks hardened Keycloak (identity & access management — SSO, OIDC, SAML). Minimal, nonroot, 0-CVE image pinned by digest; runs the OPTIMIZED Quarkus build against PostgreSQL.
type: application
version: 0.0.3
appVersion: "26.6.3"
keywords:
  - keycloak
  - iam
  - sso
  - oidc
  - security
maintainers:
  - name: QuenchWorks
    email: quenchworks@mkabumattar.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quenchworks.mkabumattar.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/keycloak/keycloak
annotations:
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: keycloak
      image: ghcr.io/quenchworks/images/keycloak@sha256:0b459cb826fa8a5e489313a6ca54e03deddb3d8fcb6fae65ba0ccbb83c96d168
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f4facf4fef681b525472ab5b3f74bfe9076fde9646304cac1cc66355a900cb17
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.1
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.4
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

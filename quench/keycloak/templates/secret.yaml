{{/*
The managed Secret carries:
  - admin-user / admin-password : the Keycloak bootstrap admin (KC_BOOTSTRAP_ADMIN_*).
    The password is generated once (24 chars) and preserved across upgrades via lookup.
  - db-password : the database password Keycloak uses for KC_DB_PASSWORD. When the
    bundled PostgreSQL is enabled this is the deterministic postgresql.auth.password
    (the same value the subchart initializes its superuser with). When an external DB
    is used WITHOUT an existingSecret, it is externalDatabase.password.
We always render db-password unless an externalDatabase.existingSecret is supplied.
*/}}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{- $renderAdmin := not .Values.auth.existingSecret -}}
{{- $renderDb := or .Values.postgresql.enabled (not .Values.externalDatabase.existingSecret) -}}

{{- if or $renderAdmin $renderDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderAdmin }}
  {{- $pw := .Values.auth.adminPassword -}}
  {{- if and (not $pw) $existing -}}
  {{- $pw = index $existing.data "admin-password" | b64dec -}}
  {{- end -}}
  {{- if not $pw -}}
  {{- $pw = randAlphaNum 24 -}}
  {{- end }}
  admin-user: {{ .Values.auth.adminUser | b64enc | quote }}
  admin-password: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $renderDb }}
  {{- $dbpw := "" -}}
  {{- if .Values.postgresql.enabled -}}
  {{- $dbpw = .Values.postgresql.auth.password -}}
  {{- else -}}
  {{- $dbpw = .Values.externalDatabase.password -}}
  {{- end -}}
  {{- if and (not $dbpw) $existing -}}
  {{- $dbpw = index $existing.data "db-password" | b64dec -}}
  {{- end -}}
  {{- if not $dbpw -}}
  {{- $dbpw = randAlphaNum 24 -}}
  {{- end }}
  db-password: {{ $dbpw | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP (UI + OIDC/SAML endpoints). Keycloak has its own auth, so external ingress
    # is allowed by default (allowExternal: true); set it false to restrict to the
    # release namespace.
    - ports:
        - port: http
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector: {}
      {{- end }}
    # Management port (health/metrics): restricted to pods in this namespace (kubelet
    # probes use the node IP and are not subject to NetworkPolicy).
    - ports:
        - port: management
          protocol: TCP
      from:
        - podSelector: {}
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Database (PostgreSQL). Open to the DB port cluster-wide so both the bundled
    # subchart and an external DB are reachable.
    - ports:
        - port: {{ include "keycloak.db.port" . }}
          protocol: TCP
    # Infinispan cache clustering between Keycloak replicas + general egress (token
    # introspection to relying parties, identity-provider federation).
    - {}
{{- end }}

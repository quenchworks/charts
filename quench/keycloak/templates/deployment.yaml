{{/* httpGet probes hit the management port (9000): /health/ready gates traffic,
     /health/live restarts a wedged JVM. Keycloak boots the Quarkus runtime + connects
     to Postgres + runs Liquibase migrations on first start, so the readiness window is
     generous. The runtime image ships no shell HTTP client; the kubelet does the GET. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $port := ternary "https" "http" (eq $tls "true") -}}
{{- $scheme := ternary "HTTPS" "HTTP" (eq $tls "true") -}}
{{- $liveness := dict "httpGet" (dict "path" "/health/live" "port" "management" "scheme" $scheme) "initialDelaySeconds" 60 "periodSeconds" 15 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/health/ready" "port" "management" "scheme" $scheme) "initialDelaySeconds" 30 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 60 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # --- HTTP + management ports (must match the image's baked optimized build) ---
            - name: KC_HTTP_PORT
              value: "{{ .Values.service.port }}"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "{{ .Values.service.managementPort }}"
            {{- if $tls }}
            # --- Native TLS: HTTPS on 8443 (nonroot cannot bind 443; the Service maps it).
            # The management port inherits it, so the health probes switch to HTTPS too. ---
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /tls/tls.key
            {{- end }}
            # --- Database (Postgres, required) ---
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ include "keycloak.db.url" . | quote }}
            - name: KC_DB_USERNAME
              value: {{ include "keycloak.db.user" . | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.db.secretName" . }}
                  key: {{ include "keycloak.db.secretPasswordKey" . }}
            # --- Admin bootstrap (seeds the initial master-realm admin) ---
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.secretName" . }}
                  key: {{ include "keycloak.secretUserKey" . }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.secretName" . }}
                  key: {{ include "keycloak.secretPasswordKey" . }}
            {{- if .Values.production.hostname }}
            - name: KC_HOSTNAME
              value: {{ .Values.production.hostname | quote }}
            {{- end }}
            {{- if .Values.production.proxyHeaders }}
            - name: KC_PROXY_HEADERS
              value: {{ .Values.production.proxyHeaders | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: {{ $port }}
              containerPort: {{ ternary 8443 .Values.service.port (eq $tls "true") }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read-only rootfs: Keycloak relocates these to writable mounts. /conf is
            # seeded from the shipped dist on first boot; /data holds runtime state;
            # /tmp is the JVM tmpdir.
            - name: conf
              mountPath: /conf
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
    {{- else }}
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
    {{- end }}
    - port: {{ .Values.service.managementPort }}
      targetPort: management
      name: management
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

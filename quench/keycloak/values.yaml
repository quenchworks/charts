# The digest below is the contract with the image factory. CI rewrites it from
# manifests/keycloak.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/keycloak
  digest: "sha256:5e700e70b7ce773ab14cdb3705591290b33c3dc8fa528741aec10c26eabcb64b"
  pullPolicy: IfNotPresent

nameOverride: ""

# Keycloak is stateless given the database — all state lives in PostgreSQL. Scale
# horizontally by raising replicaCount (the Infinispan cache forms a cluster). The
# default is a single replica.
replicaCount: 1

# Admin bootstrap user. Wired to KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD
# from a Secret (generated if not provided). This seeds the initial master-realm admin.
auth:
  adminUser: admin
  adminPassword: ""              # generated (24 chars) if empty; stored in the Secret
  existingSecret: ""             # use this Secret instead of the managed one
  existingSecretUserKey: "admin-user"
  existingSecretPasswordKey: "admin-password"

# Production hostname / proxy. Keycloak 26 needs the public hostname to build correct
# redirect URIs and issuer URLs. Behind an ingress/proxy that terminates TLS, set
# hostname to the public URL and proxyHeaders to "xforwarded" (or "forwarded").
# Left empty for the self-contained gate (hostname-strict is disabled by the image).
production:
  hostname: ""                   # e.g. https://sso.example.com ; sets KC_HOSTNAME
  proxyHeaders: ""               # "xforwarded" | "forwarded" ; sets KC_PROXY_HEADERS

# Bundled in-cluster PostgreSQL (the Quenchworks postgresql subchart). Default true:
# a self-contained, production-shaped install. Set false to use externalDatabase.
# The auth block below pins DETERMINISTIC credentials so both Keycloak and the
# bundled PG agree on db/user/password.
postgresql:
  enabled: true
  auth:
    # NOTE: the bundled PostgreSQL image creates the application database only when
    # it differs from both "postgres" and the superuser name, so username and
    # database MUST NOT be equal (here: kcadmin vs keycloak).
    username: kcadmin
    password: keycloak
    database: keycloak
  primary:
    persistence:
      enabled: true
      size: 8Gi

# External database, used when postgresql.enabled=false. Point at any reachable
# PostgreSQL. Supply the password inline or via an existingSecret.
externalDatabase:
  host: ""
  port: 5432
  database: keycloak
  user: keycloak
  password: ""
  existingSecret: ""             # Secret holding the DB password
  existingSecretPasswordKey: "password"

resources:
  requests: { cpu: 500m, memory: 768Mi }
  limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  port: 8080                     # HTTP (UI + API)
  managementPort: 9000           # health + metrics

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

# The admin console + OIDC/SAML endpoints are commonly reached from outside the
# cluster (browsers, relying apps), so external ingress is allowed by default. Set
# allowExternal: false to restrict ingress to the release namespace.
networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

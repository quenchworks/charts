  digest: "sha256:149144ecca4a63145f9e076f543fc18f023c1c3f7b644fb942b7258fd1cfc6a0"

# Used only by Backup and Restore resources (BR, Dumpling); QuenchWorks does not build it.
backupManagerImage: pingcap/tidb-backup-manager:v1.6.6

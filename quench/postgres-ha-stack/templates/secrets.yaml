{{/*
One superuser password, rendered into both Secrets in the same pass so they always
agree:
  postgres-ha-auth      postgres-password + replication-password, read by the
                        Patroni pods (auth.existingSecret), the exporter, and
                        anything else connecting as postgres
  postgres-ha-userlist  pgbouncer's userlist.txt (userlist.existingSecret); SCRAM
                        auth uses the plaintext entry for the client and backend
Both are read back from the live Secret first, so upgrades keep the passwords the
running cluster was initialised with.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-ha-auth" -}}
{{- $prior := dict -}}
{{- if $existing }}{{- $prior = $existing.data | default dict }}{{- end -}}
{{- $pw := .Values.auth.password -}}
{{- if not $pw }}{{- $pw = index $prior "postgres-password" | default "" | b64dec }}{{- end -}}
{{- if not $pw }}{{- $pw = randAlphaNum 24 }}{{- end -}}
{{- $repl := index $prior "replication-password" | default "" | b64dec -}}
{{- if not $repl }}{{- $repl = randAlphaNum 24 }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-auth
  labels:
    {{- include "postgres-ha-stack.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $pw | b64enc | quote }}
  replication-password: {{ $repl | b64enc | quote }}
{{- if .Values.pgbouncer.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-userlist
  labels:
    {{- include "postgres-ha-stack.labels" . | nindent 4 }}
type: Opaque
data:
  userlist.txt: {{ printf "\"%s\" \"%s\"\n" .Values.pgbouncer.externalDatabase.user $pw | b64enc | quote }}
{{- end }}

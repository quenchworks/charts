{{- if .Values.exporter.enabled }}
{{- $name := "postgres-ha-exporter" -}}
# postgres_exporter against postgres-ha-primary, which follows the Patroni leader,
# so the metrics are always the current primary's. The Service carries
# app.kubernetes.io/name=postgres-exporter and a port named "metrics", which is
# what the Prometheus job keeps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "postgres-ha-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/auth: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ printf "%s@%s" .Values.exporter.image.repository .Values.exporter.image.digest }}
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # DATA_SOURCE_* keeps the password out of a URI.
            - name: DATA_SOURCE_URI
              value: "postgres-ha-primary:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: postgres
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-ha-auth
                  key: postgres-password
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "postgres-ha-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
spec:
  ports:
    - name: metrics
      port: {{ .Values.exporter.port }}
      targetPort: metrics
  selector:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

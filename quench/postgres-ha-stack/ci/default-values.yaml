# Install gate: the full 3-node cluster on one kind node, small PVCs and
# resources, a fixed Grafana password so the gate can use its API.
postgresql:
  ha:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 512Mi }
prometheus:
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
grafana:
  auth:
    adminPassword: ci-postgres-ha-2026
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.13
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles grafana=0.0.18,pgbouncer=0.0.27,postgresql=0.0.30,prometheus=0.0.22 (2026-10-22 CVE rebuild)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:42316ed44fa7722f611c35af6edb37882ceaac8c83f48a59735d329d5c12d977
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:143cc11a4d6453e6fbe36490dfb664005d2270e273e8fe9cf93adfff27c3dcdf
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:67b61a17789a2b4ab63a8b26d21ae9fc27b5881bebc98636fa1e5d837dd3f9e9
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:6263c43a967820cd827f462f021b70b084d78084de82d2b735b8d30709ae53c5
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:55e1905467f2b38d95705ef32eb46d30cc6fbce8c4a4249c457cf27c487e8ddd
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.30
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.27
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.22
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.18
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles grafana=0.0.20,pgbouncer=0.0.29,postgresql=0.0.31,prometheus=0.0.25 (the 2026-11-01 wave re-pin)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:8e58d8c785a093fe5ad70264f4df02eea9b0567d3a3da4cb8a97f46f75979856
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:143cc11a4d6453e6fbe36490dfb664005d2270e273e8fe9cf93adfff27c3dcdf
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:ba53fc24d9ad47a9461acf293928fafb1e5d977a97d8e67065ac5b0def1fbd40
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:80dfa5cae0143d74c7936e576f875ba303d10882ec9abcb4c216cf8dae36ff85
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:ae745b72a3bdc64caf10472593bfc7c5ce134d78a60631f39c289e23c5fdce7c
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.31
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

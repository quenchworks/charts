apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.1
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: postgresql 0.0.24 (Patroni, 3 nodes), pgbouncer 0.0.18, postgres-exporter, prometheus 0.0.18, grafana 0.0.13."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:4c0580fd2968b8d6e8fb008e0eb74b55c54464b041c235842e4d1cc37ed9a445
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:d066975c823555e37d2cf7d51a0c9ec8b0d68f4654dbe51481ce47ed03c9481f
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:e7dfea0c79bf106078d5d9985106dde12395e7db0bef70a0a4c08d71c9675d93
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:88d05fd90073aef3d50f120a4485b4f4f08861ee15492d74d02bcf190bb82681
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:4b7e7a1342831602a31232c1dce40d8ea6a14bb44d6acb3aa095c029e1520d55
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.18
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.10
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "2026-10-12 updates: grafana 13.1.7, meilisearch 1.53.3, odoo 19.0.20261012"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:e3b4a823a4eb9f6863a0f87b2cd6b2d710f0f5977372b4161873d1861c180655
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:429aab7a75a46178f3506c59c461a6a19c5b102ff16b428b7e13226d2997b075
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:21c17dcdf1c22ed9978a4a846fac16879e20704b70c820c107ebbd1581b8ce06
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:d57cf70aab4c571222c6f5b8cf3912298483b853eda1e39348a170d74aa6c157
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:dc5f670bac19c33670a33db6f724907093e8037a5578086643bb117088db9fd7
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.29
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.21
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.16
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.32
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles pgbouncer=0.0.39 (quench-common 0.0.14 rollout, round 2)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:f2aadd3d9651056f67735ec100ce255fabc86121bfa45f20fa2a06df82886d46
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:08eee2abef4c8b984e3b27649da7f506b540de046f5ec82b86ad26c89ecc7495
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:202ce9ce7c8da0467340c8253d172c311fddeca84e996a1fa9dc4eacefff9ac5
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:8e9254d8deac559c2520e0c295da15d86e099c444b762bfc11682278cc7bca7b
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:b57a376c691e019e391fcb472247c14a8c825879bcf9a5d760590b0d887bbd72
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.36
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.28
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.24
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: postgres-ha-stack
description: "Hardened PostgreSQL HA stack: a 3-node Patroni cluster with automatic failover, PgBouncer pooling in front of the elected leader, postgres_exporter on the leader, and Prometheus + Grafana with the postgres_exporter overview dashboard. All component images are QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.23
appVersion: "1.0.0"
keywords:
  - postgresql
  - postgres
  - patroni
  - high-availability
  - pgbouncer
  - connection-pooling
  - postgres-exporter
  - prometheus
  - grafana
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/postgres/postgres
  - https://github.com/patroni/patroni
  - https://github.com/pgbouncer/pgbouncer
  - https://github.com/prometheus-community/postgres_exporter
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin to the 2026-11-09 lock"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: postgresql
      image: ghcr.io/quenchworks/images/postgresql@sha256:221c15186d136e636c8946226de40e8afcbebbb7f826974f9ddfd8003f9e658f
    - name: pgbouncer
      image: ghcr.io/quenchworks/images/pgbouncer@sha256:143cc11a4d6453e6fbe36490dfb664005d2270e273e8fe9cf93adfff27c3dcdf
    - name: postgres-exporter
      image: ghcr.io/quenchworks/images/postgres-exporter@sha256:326aa606fad8bf323b574da8683870318c4f5ca56a35c4d3659856b33fda7bc3
    - name: prometheus
      image: ghcr.io/quenchworks/images/prometheus@sha256:3aea47c759774709cc343b5ef17a58664475ad62cfe7374acd96d6f472fe8c93
    - name: grafana
      image: ghcr.io/quenchworks/images/grafana@sha256:75c32316603e6b4442f2bda16b25e123d2f073582d7ce2f47d4ce748bfcc17d9
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    version: 0.0.33
    repository: oci://ghcr.io/quenchworks/charts
  - name: pgbouncer
    version: 0.0.34
    repository: oci://ghcr.io/quenchworks/charts
    condition: pgbouncer.enabled
  - name: prometheus
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: prometheus.enabled
  - name: grafana
    version: 0.0.21
    repository: oci://ghcr.io/quenchworks/charts
    condition: grafana.enabled

apiVersion: v2
name: keda
description: "KEDA: Kubernetes Event-Driven Autoscaling. Scales any workload from 0 to N off event sources (queues, streams, databases, Prometheus, cron and 60+ more) by driving a standard HorizontalPodAutoscaler through the ScaledObject/ScaledJob CRDs. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. Runs the operator and the external-metrics adapter as two deployments from one image; the adapter backs the aggregated v1beta1.external.metrics.k8s.io APIService, whose serving certificates the chart issues itself so no cert-manager dependency is required."
type: application
version: 0.0.1
appVersion: "2.20.1"
keywords:
  - keda
  - autoscaling
  - hpa
  - event-driven
  - scale-to-zero
  - scaledobject
  - external-metrics
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kedacore/keda
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/changes: |
    - kind: added
      description: "Initial QuenchWorks KEDA 2.20.1 chart: operator + external-metrics adapter, KEDA CRDs, chart-issued mTLS/serving certificates and the aggregated external metrics APIService."
  artifacthub.io/images: |
    - name: keda
      image: ghcr.io/quenchworks/images/keda@sha256:c79e90e08f150b547c53de1d796b72fd65e70db164705ed8dd4526b8a8c589af
  artifacthub.io/crds: |
    - kind: ScaledObject
      version: v1alpha1
      name: scaledobjects.keda.sh
      displayName: ScaledObject
      description: Scales an existing Deployment/StatefulSet/CustomResource from event sources by managing a HorizontalPodAutoscaler.
    - kind: ScaledJob
      version: v1alpha1
      name: scaledjobs.keda.sh
      displayName: ScaledJob
      description: Runs a Kubernetes Job per unit of work pulled from an event source.
    - kind: TriggerAuthentication
      version: v1alpha1
      name: triggerauthentications.keda.sh
      displayName: TriggerAuthentication
      description: Namespaced credentials (Secret, env, pod identity, Vault) a trigger uses to reach its event source.
    - kind: ClusterTriggerAuthentication
      version: v1alpha1
      name: clustertriggerauthentications.keda.sh
      displayName: ClusterTriggerAuthentication
      description: Cluster-scoped trigger credentials usable from any namespace.
    - kind: CloudEventSource
      version: v1alpha1
      name: cloudeventsources.eventing.keda.sh
      displayName: CloudEventSource
      description: Emits KEDA's own lifecycle events as CloudEvents to an HTTP sink.
    - kind: ClusterCloudEventSource
      version: v1alpha1
      name: clustercloudeventsources.eventing.keda.sh
      displayName: ClusterCloudEventSource
      description: Cluster-scoped CloudEvent emission for KEDA lifecycle events.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

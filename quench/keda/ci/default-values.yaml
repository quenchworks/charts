# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed
# image. Both deployments must reach Ready, and the aggregated APIService must
# report Available=True -- Ready pods alone do not prove the metrics adapter is
# serving. Resources are trimmed to fit a single-node kind runner.
operator:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
metricsApiserver:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }

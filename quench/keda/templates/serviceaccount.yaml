{{- if .Values.serviceAccount.create }}
{{- /*
One ServiceAccount for both deployments. Unlike cert-manager's three isolated
components, KEDA's adapter is not a thin front end: it reads ScaledObjects and
the Secrets referenced by TriggerAuthentications to resolve metric names, so its
grants would end up nearly identical to the operator's anyway. Splitting them
would buy a second identity, not a smaller blast radius.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda.serviceAccountName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

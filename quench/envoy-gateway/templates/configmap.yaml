apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envoy-gateway.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    {{- include "envoy-gateway.config" . | nindent 4 }}

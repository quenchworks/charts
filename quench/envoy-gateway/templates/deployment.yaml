{{/* The controller-runtime health server listens on 8081: /healthz once the
     manager is up, /readyz once the caches have synced and the xDS server is
     serving. Neither is on the Service -- they are pod-local. */}}
{{- $startup := dict "httpGet" (dict "path" "/healthz" "port" "health") "periodSeconds" 1 "timeoutSeconds" 1 "failureThreshold" 30 -}}
{{- $liveness := dict "httpGet" (dict "path" "/healthz" "port" "health") "periodSeconds" 20 "timeoutSeconds" 1 -}}
{{- $readiness := dict "httpGet" (dict "path" "/readyz" "port" "health") "periodSeconds" 10 "timeoutSeconds" 1 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: envoy-gateway
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{/* The image entrypoint is the bare binary -- it is also injected as the
               shutdown-manager sidecar of every provisioned Envoy pod with a
               different argv -- so the subcommand is supplied here. */}}
          command: ["/usr/bin/envoy-gateway"]
          args:
            - "server"
            - "--config-path=/config/envoy-gateway.yaml"
          env:
            - name: ENVOY_GATEWAY_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: KUBERNETES_CLUSTER_DOMAIN
              value: {{ .Values.kubernetesClusterDomain | quote }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: xds
              containerPort: {{ .Values.service.xdsPort }}
              protocol: TCP
            - name: ratelimit
              containerPort: {{ .Values.service.ratelimitPort }}
              protocol: TCP
            - name: wasm
              containerPort: {{ .Values.service.wasmPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "startup" "default" $startup) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{/* xDS CA + serving cert, written by the certgen Job. */}}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{/* Writable Wasm module cache; the root filesystem is read-only. */}}
            - name: wasm-cache
              mountPath: /var/lib/eg/wasm
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "envoy-gateway.configMapName" . }}
        - name: certs
          secret:
            secretName: {{ .Values.certgen.secretName }}
        - name: wasm-cache
          {{- toYaml .Values.wasmCacheVolume | nindent 10 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

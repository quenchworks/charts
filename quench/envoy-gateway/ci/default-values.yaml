# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digests from values.yaml, so the gate pulls the actual signed
# images -- both the control plane and the Envoy data plane it provisions.
#
# The gate installs the quench gateway-api-crds chart FIRST. Those CRDs are not
# part of this chart and the controller cannot start its caches without them.
#
# One replica with a minAvailable-1 PDB is fine on a throwaway cluster; the
# defaults are otherwise used as shipped so the gate tests what ships.
replicaCount: 1
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1, memory: 1Gi }

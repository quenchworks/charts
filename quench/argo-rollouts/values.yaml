# Quenchworks Argo Rollouts on the QuenchWorks argo-rollouts image (nonroot, 0-CVE,
# cosign-signed, pinned by digest). The chart installs the CRDs (crds/, applied once by
# Helm; upgrade them with kubectl apply when the app version moves).
image:
  repository: ghcr.io/quenchworks/images/argo-rollouts
  digest: "sha256:7d0cb969c853bd09caeac66758d483a6f52b8e81919d2bfedbe35ad8faeeaf36"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Two replicas elect a leader; only the leader reconciles.
replicas: 2

# Watch one namespace instead of the cluster (the chart then still needs the CRDs,
# which are cluster-scoped).
namespaced: false

metrics:
  enabled: true
  port: 8090

extraArgs: []
extraEnvVars: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1000m, memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # a controller: it needs its token
  automountServiceAccountToken: true

podSecurityContext: {}
containerSecurityContext: {}

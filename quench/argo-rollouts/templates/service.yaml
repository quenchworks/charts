{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-metrics
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
{{- end }}

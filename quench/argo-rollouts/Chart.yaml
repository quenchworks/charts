apiVersion: v2
name: argo-rollouts
description: "Argo Rollouts, progressive delivery for Kubernetes: the Rollout CRD with canary and blue-green strategies, analysis runs and experiments, and traffic shaping through ingresses and service meshes. Hardened by QuenchWorks, nonroot, 0-CVE, cosign-signed and pinned by digest."
type: application
version: 0.0.5
appVersion: "1.10.1"
keywords:
  - argo
  - argo-rollouts
  - canary
  - blue-green
  - progressive-delivery
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/argoproj/argo-rollouts
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 CVE rebuild"
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: argo-rollouts
      image: ghcr.io/quenchworks/images/argo-rollouts@sha256:3ccc2dd5d2db2c7d35b3c654d2989b954663ab0376f658589448c2e297433531
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/crds: |
    - kind: Rollout
      version: v1alpha1
      name: rollouts.argoproj.io
      displayName: Rollout
      description: A Deployment replacement with canary and blue-green strategies.
    - kind: AnalysisTemplate
      version: v1alpha1
      name: analysistemplates.argoproj.io
      displayName: AnalysisTemplate
      description: Metrics and checks that gate a rollout step.
    - kind: AnalysisRun
      version: v1alpha1
      name: analysisruns.argoproj.io
      displayName: AnalysisRun
      description: One evaluation of an AnalysisTemplate.
    - kind: Experiment
      version: v1alpha1
      name: experiments.argoproj.io
      displayName: Experiment
      description: Temporary ReplicaSets run side by side for comparison.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

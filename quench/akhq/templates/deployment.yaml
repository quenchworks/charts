apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "akhq.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "akhq.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "quench-common.tls.enabled" . }}
      initContainers:
        {{- include "quench-common.tls.pkcs12InitContainer" (dict "ctx" . "image" (printf "%s@%s" .Values.openssl.repository .Values.openssl.digest) "password" "changeit") | nindent 8 }}
      {{- end }}
      containers:
        - name: akhq
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
            {{- if include "quench-common.tls.enabled" . }}
            # Micronaut dual protocol: HTTPS on 8443 from the init container's PKCS12 beside
            # HTTP on 8080. The password guards nothing extra: the PEM key is in the same pod.
            - { name: MICRONAUT_SERVER_DUAL_PROTOCOL, value: "true" }
            - { name: MICRONAUT_SERVER_SSL_ENABLED, value: "true" }
            - { name: MICRONAUT_SERVER_SSL_PORT, value: "8443" }
            - { name: MICRONAUT_SERVER_SSL_KEY_STORE_PATH, value: "file:/tls-pkcs12/keystore.p12" }
            - { name: MICRONAUT_SERVER_SSL_KEY_STORE_TYPE, value: PKCS12 }
            - { name: MICRONAUT_SERVER_SSL_KEY_STORE_PASSWORD, value: changeit }
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 28081
            {{- if include "quench-common.tls.enabled" . }}
            - name: https
              containerPort: 8443
            {{- end }}
          # /health reports DOWN while no cluster is configured, which is a config
          # problem, not a dead process; liveness only asks that the server answers.
          readinessProbe:
            httpGet:
              path: /health
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/akhq/application.yml
              subPath: application.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.pkcs12VolumeMount" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "akhq.secretName" . }}
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.tls.pkcs12Volume" . | nindent 8 }}

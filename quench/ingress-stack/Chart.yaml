apiVersion: v2
name: ingress-stack
description: "Hardened ingress with TLS out of the box: ingress-nginx as the default IngressClass and cert-manager with a cluster CA issuer the stack creates, so an Ingress gets a certificate from a single annotation. Bring your own ACME issuer for public certificates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.8
appVersion: "1.0.0"
keywords:
  - ingress-nginx
  - cert-manager
  - tls
  - ingress
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes/ingress-nginx
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles cert-manager=0.0.13,ingress-nginx=0.0.12 (2026-10-22 CVE rebuild)"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: ingress-nginx-controller
      image: ghcr.io/quenchworks/images/ingress-nginx@sha256:6b73027b493719ec26a2daf078222e28026c5372889ee94d77c3d9177c40e3e3
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:a202d525d948a63054fd8db298415b679131a647eca86f5bbc937afb035a21b5
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:cbd0ba2703dff62adbd07cdfdd39d9d7bff59c1bbcc192884bae297b899a6450
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:6b8901f2d040c2806a99990341206d0f277f76fdc6c893453a0ed04d6b95f181
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:fe0bde7ea5ef06696cf8886cd3f9a7c6793a3d4487fc743b6f9bedc32ce970f5
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:924a275fd41f0e83a6cfdac29eea1587ebc88fc91d400e9c766bc9601b1f986c
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: ingress-nginx
    version: 0.0.12
    repository: oci://ghcr.io/quenchworks/charts
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: 0.0.13
    repository: oci://ghcr.io/quenchworks/charts
    condition: cert-manager.enabled

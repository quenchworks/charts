apiVersion: v2
name: ingress-stack
description: "Hardened ingress with TLS out of the box: ingress-nginx as the default IngressClass and cert-manager with a cluster CA issuer the stack creates, so an Ingress gets a certificate from a single annotation. Bring your own ACME issuer for public certificates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.4
appVersion: "1.0.0"
keywords:
  - ingress-nginx
  - cert-manager
  - tls
  - ingress
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes/ingress-nginx
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pin to the floor-pass rebuild (cel-go no longer pulled back to 0.29.2)."
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: ingress-nginx-controller
      image: ghcr.io/quenchworks/images/ingress-nginx@sha256:cc9001b2995029c121bba0a2c3abd11b67dbc5ab630cbe0cb2c002b9ee239f1c
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:b4e5fb14444228dba86b243c4cc7e55884b5485360674211144b83bd101b8b89
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:d342342b50a64e5729d22f44b5bd245a478fc02f76903fac016fea5effa33fc0
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:cdb9b39d2eafecb6f5cc2bce3743be11a1c986ab0c6022b87023ae3662557bd9
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:78072e6304bbbc81c6b049f44522ef5b774657079fba4926cc957b11f2bf3a63
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:4033ac5e5f359739cf017a256188a8da7592edae86e452c6327dc4865a66a580
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: ingress-nginx
    version: 0.0.10
    repository: oci://ghcr.io/quenchworks/charts
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: cert-manager.enabled

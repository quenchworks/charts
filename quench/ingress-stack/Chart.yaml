apiVersion: v2
name: ingress-stack
description: "Hardened ingress with TLS out of the box: ingress-nginx as the default IngressClass and cert-manager with a cluster CA issuer the stack creates, so an Ingress gets a certificate from a single annotation. Bring your own ACME issuer for public certificates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.15
appVersion: "1.0.0"
keywords:
  - ingress-nginx
  - cert-manager
  - tls
  - ingress
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes/ingress-nginx
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "chore(charts): re-pin kubectl, concourse and vcluster"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: ingress-nginx-controller
      image: ghcr.io/quenchworks/images/ingress-nginx@sha256:fefbacd9f0820901548cbd8cb9eb50c67b09fc78e2f679fcaee2a6d66d8402e3
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:f6d916b6f55940ea25d2cccdda1f76740c7c9b88f8ab7bfbd97b24297b325100
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:dc99c86b6523e86df77a254b64a42fae45b439c6621ddcf6de13c36f3fc01044
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:ae097901ebdcba7a8261cd1d25ca77004883968c4e8bf401b9560c79a25f9dc9
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:58490d9ae80fb05435803a448fc86d908812a6577492590b3eee1db2d5259113
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:579dddb5e9d550f273c067959215b3360fbd055313a7e9f74e449acf95f0c637
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: ingress-nginx
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: cert-manager.enabled

apiVersion: v2
name: ingress-stack
description: "Hardened ingress with TLS out of the box: ingress-nginx as the default IngressClass and cert-manager with a cluster CA issuer the stack creates, so an Ingress gets a certificate from a single annotation. Bring your own ACME issuer for public certificates. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.6
appVersion: "1.0.0"
keywords:
  - ingress-nginx
  - cert-manager
  - tls
  - ingress
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kubernetes/ingress-nginx
  - https://github.com/cert-manager/cert-manager
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Rebuilt images (2026-10-11 CVE wave)"
  artifacthub.io/category: networking
  artifacthub.io/images: |
    - name: ingress-nginx-controller
      image: ghcr.io/quenchworks/images/ingress-nginx@sha256:bfc9db97a1e7943090f33a349e07467fb6e19bca7e3a24c88d4b40c49c2403be
    - name: cert-manager-controller
      image: ghcr.io/quenchworks/images/cert-manager-controller@sha256:4516d1ea539b4613eec5559da3917d27981f38ccc4414ceaa7e291c11f28db2c
    - name: cert-manager-webhook
      image: ghcr.io/quenchworks/images/cert-manager-webhook@sha256:6d183496854d7639196c985bb018ff6551aa4cc3a655af7d73dbd4323904afc5
    - name: cert-manager-cainjector
      image: ghcr.io/quenchworks/images/cert-manager-cainjector@sha256:049b7dacb9edb21aafd15d48746d6e4c971cb10f871fe98ecba3ed02e49b4bee
    - name: cert-manager-acmesolver
      image: ghcr.io/quenchworks/images/cert-manager-acmesolver@sha256:68e4b50e864e83c9360532f7165b2422f988dc138b54ee52ee43c7061c854b86
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:d5c4037b5c931585adcd7d8c997f094c9b8b90e56600ed2ff0f585b1b6b48cee
  artifacthub.io/operator: "false"

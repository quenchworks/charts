{{- if .Values.clusterIssuer.enabled }}
{{- $ns := .Release.Namespace }}
# The issuers cannot be plain release objects: cert-manager's webhook validates
# them and is not serving yet when Helm applies the release. A post-install Job
# applies them once it answers, the way upstream's startupapicheck waits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  issuers.yaml: |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: ingress-selfsigned
    spec:
      selfSigned: {}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: ingress-root-ca
      namespace: {{ $ns }}
    spec:
      isCA: true
      commonName: {{ .Values.clusterIssuer.rootCommonName | quote }}
      secretName: ingress-root-ca
      duration: {{ .Values.clusterIssuer.rootDuration }}
      privateKey: { algorithm: ECDSA, size: 256 }
      issuerRef: { name: ingress-selfsigned, kind: ClusterIssuer, group: cert-manager.io }
    ---
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: ingress-ca
    spec:
      ca:
        secretName: ingress-root-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
subjects:
  - { kind: ServiceAccount, name: ingress-stack-issuers, namespace: {{ $ns }} }
roleRef: { kind: ClusterRole, name: {{ .Release.Name }}-ingress-stack-issuers, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
subjects:
  - { kind: ServiceAccount, name: ingress-stack-issuers, namespace: {{ $ns }} }
roleRef: { kind: Role, name: ingress-stack-issuers, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-stack-issuers
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-stack-issuers
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: ingress-stack-issuers
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      {{- include "quench-common.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: apply
          image: "{{ .Values.clusterIssuer.image.repository }}@{{ .Values.clusterIssuer.image.digest }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # the webhook rejects everything until it serves and its CA is injected
              until kubectl apply -f /manifests/issuers.yaml; do sleep 5; done
              kubectl wait --for=condition=Ready certificate/ingress-root-ca -n {{ $ns }} --timeout=300s
              kubectl wait --for=condition=Ready clusterissuer/ingress-ca --timeout=300s
          env:
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: manifests, mountPath: /manifests }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: manifests
          configMap: { name: ingress-stack-issuers }
        - name: tmp
          emptyDir: {}
{{- end }}

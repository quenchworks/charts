# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:2504213b194d5dc56cef227708d4fae880309aa835ac5d2816dcb3b4a91884cd"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:684f5f8a3fac736e38abee6d97c2061123bcf31f1fe71ca2260c37f65b363635"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:3924621c5a1e707aceaad8a88c27781150e86532cd71db2160752f174b8d8fc2"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:fab439965c7b541a71bbca879b212bc4043accd09d04e46b4f9f129873c08079"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:2cc10b954af4134d6577777e1f7daba554ed51f583e2bdc873342e472a1a0905"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:d7246fda9016bb0432519319293fbc06c3abcdb87cf13b336cd76418904e2799"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:60a336f12407fc7ed033d870709309811f422f1025dca9fcbdbc10f3b14a6fa5"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:c9b61b42ee99d715d3c52bdd2292e8426af6c88787f35d74eee97784d00ea864"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:d470e1d885e1095e5b40a7327208a97782f881dbc6877998e1850aa748a78089"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

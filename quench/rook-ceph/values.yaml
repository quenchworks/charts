# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:50e8ab661685da68b499b5c93cec4a77a5db6bd42225b221bc30e3deeaecb940"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:5dfdce7b3ae637bb15b347fbc783be3c86cffe431138af2ddc9817ddd9fa381d"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:aad114064d079a64790cae666e0960685e13a5ab4a9295fb3ab12aa0896d3d4a"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:9f602ef9cfc6d473d91f23e74f3c033176907ba69757a1a1aed8ab713ec9bbcc"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:5fd784f3c95d409dfe0b4c22414b946e288d6e24143f06d1beb94ca1ba38ee05"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:e1eed319633f8453a7c6779d39c0a5310b95401f26d204b5dd776504bdbc17a6"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:d9e9094eb5eb5f9bb75e57499ce7c106350deaa00af874b679c4e2ce9ed0e525"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:99245bd0e258f5da271410949dd417eb8aa18fb0059da885a09f9980567a13b8"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:a6bca020fc20dc7043f5eb872ec999577240caa59d79346606150851fd577e80"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

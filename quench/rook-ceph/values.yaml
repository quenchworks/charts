# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:50e8ab661685da68b499b5c93cec4a77a5db6bd42225b221bc30e3deeaecb940"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:5dfdce7b3ae637bb15b347fbc783be3c86cffe431138af2ddc9817ddd9fa381d"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:11aead133e806b4d2ad6abdcfabf4433a3baf0c4d391da85bc4dbcda3b686e03"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:2de36f9073f50bd56e2b72efd01781cce6f111b0f64005e51e572ae4dbb8e4c0"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:f7f0e8cba3e9287089ba18e6bbf3e7c8349787af3bc3cc38797032e84a99d863"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:416edf5481d95e700b47349647b28f045d72367b16288f720d6923657aa64057"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:62e987104ae452dbb9706f58fc18db0a042d3768a42f015226a2f3a483fc5460"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:17d016ba7fb043f6e4a0fda660291a6193d6896e3e6d73b5e01c85b7f709edcb"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:c7ba47e38196c68f95416b5d20ebdde47c5aea662409e190223c6e94f667a91b"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

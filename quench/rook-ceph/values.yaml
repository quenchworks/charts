# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:8490a6488ba7554658119300b85f01db8bb07d8582f1e64c1a1331259bc01d8a"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:07f4746b22c0b29b6eb6b756acc37adf95f07378e4ca27e175d33afd735565fa"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:0062777d0e230e00c11ae2b1c153e07c053d3a9fed81ea957d5e79275efcae46"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:e46007a1ed15316f70b8f0c44fe93ae687a43a45211efc511b0888e6b76292ac"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:d66ab0c86264310add410ebfcd6c1529564dbe63f16717c78ad6ef561bc146b1"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:0a3b1955e78456cd7dace37f4d7158a35c46cbb3799bb6931d08e5694d93fdf2"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:4436933168c703a358d8c99afdacb08b134969950f4e6b7bc40bf204a130b6eb"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:f788f0e135c0cccfa26acbe6d427e9e77472c57bb420bb7210b8310107594a0c"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:43090eab8c0f9b2d5361ba3fb0efa85a5b278e820daf57c09aacba49ef380e9e"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

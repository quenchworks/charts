# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:dea9296b15889ee1c2c1d75d647025abed1cb9d7c6173f6627340b4e19c9c7c0"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:c9959b5570578c7a70910004309dfeb65ff99f36299d3b6a6a807361df0175b7"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:0062777d0e230e00c11ae2b1c153e07c053d3a9fed81ea957d5e79275efcae46"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:1513034d252988b78eb874dcb7d2b7c6ed3092ebadae50884345f7bc12580641"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:2e41809080359e9d174acdc118b41cdee2f5e27637292aee26a4fd9a0aa9420e"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:3e7c2c5edd36fe122ac2d36058a76a68bd5c46aa537d41fb28747b8a6cd5d3b8"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:b2ba0178256a4335ce952693ad21dec1a4a83065db266c9edee812aee5e8b499"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:692c0cf9c7bd647b93d89c088fe4ed6817852b2eedf7f8b025dcb04fec9310ff"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:43090eab8c0f9b2d5361ba3fb0efa85a5b278e820daf57c09aacba49ef380e9e"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

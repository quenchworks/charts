# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/rook
  digest: "sha256:7c12286c4ebfbf946c6e69c8b8bf7190c8304ee8b2daab3905ded53fcbd06991"
  pullPolicy: IfNotPresent

nameOverride: ""

# The Ceph image to put in your CephCluster's spec.cephVersion.image (the operator does
# not pick one itself). Printed by NOTES.txt.
cephImage:
  repository: ghcr.io/quenchworks/images/ceph
  tag: "20.2.4"
  digest: "sha256:dda8fb686abf5006d33f6bcedda34fac29c42cb9cd95918161ad3bda73ab1f63"

# Watch CephClusters in every namespace (false) or only the release namespace (true).
currentNamespaceOnly: false

# rook-ceph-operator-config, the settings the operator reads at start and on change.
# ROOK_CREATE_CSI_OPERATOR_RESOURCES follows csi.enabled.
config:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_OPERATOR_METRICS_BIND_ADDRESS: "0"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"

# Ceph CSI: RBD and CephFS PersistentVolumes. The chart runs the ceph-csi-operator; Rook
# creates its OperatorConfig and Driver resources, and the operator runs the plugin and
# sidecars below (rook-csi-operator-image-set-configmap). All QuenchWorks images.
csi:
  enabled: true
  operatorImage:
    repository: ghcr.io/quenchworks/images/ceph-csi-operator
    digest: "sha256:f0cef52814396d04ae07f7de830d5905c14a1db4d29cb11daa0cb27c00ac02ff"
  images:
    plugin: "ghcr.io/quenchworks/images/cephcsi@sha256:d861fab9ab5a4b46d87007272f9fa228938a954cbf6e9d54864d1bb849963f31"
    provisioner: "ghcr.io/quenchworks/images/csi-provisioner@sha256:2e4ea695982a87af54e3347e0698753a1e78c566648613599defb7f8167ef685"
    attacher: "ghcr.io/quenchworks/images/csi-attacher@sha256:81fd95a1f6f1ec2439c6241e49fc924c18b331adaf3df1247e30655b34fdc24b"
    resizer: "ghcr.io/quenchworks/images/csi-resizer@sha256:22bcbcc80215da53317ef594240908dabb6219d85d609caf68b0612fc2333348"
    snapshotter: "ghcr.io/quenchworks/images/csi-snapshotter@sha256:71ca1a68c3e3fd336f3c65f8dbfd724451b185601a4bf60b102e53950a895ce4"
    registrar: "ghcr.io/quenchworks/images/csi-node-driver-registrar@sha256:a91dbbebcec0a60e1469a96ce8d59ad8745f832eee312b248da8e5f5ed15b70a"
    # csi-addons is off (OperatorConfig deployCsiAddons: false); empty means unused.
    addons: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 10
podSecurityContext: {}
containerSecurityContext: {}

{{- /* The operator reads this ConfigMap by name. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-ceph-operator-config
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- toYaml (merge (dict "ROOK_CREATE_CSI_OPERATOR_RESOURCES" (ternary "true" "false" .Values.csi.enabled)) .Values.config) | nindent 2 }}
{{- if .Values.csi.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-csi-operator-image-set-configmap
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.csi.images | nindent 2 }}
{{- end }}

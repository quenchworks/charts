{{- $probe := dict "tcpSocket" (dict "port" 51515) "initialDelaySeconds" 5 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # the server reads its settings at start: a change rolls the pods
        checksum/config: {{ toJson (list .Values.ui.username .Values.settings .Values.tls) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      initContainers:
        # connects to the repository on the volume, or creates it on the first start (the config
        # this writes to /app is shared with the server through an emptyDir)
        - name: repository
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          # connect when the repository exists; create it only when its format blob is absent, so a
          # wrong password fails loudly instead of creating anything
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -f /repository/kopia.repository.f ]; then
                exec kopia repository connect filesystem --path=/repository
              fi
              exec kopia repository create filesystem --path=/repository
          env:
            {{- include "kopia.env" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app
              mountPath: /app
            - name: data
              mountPath: /repository
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: kopia
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - server
            - start
            - --address=0.0.0.0:51515
            {{- if include "quench-common.tls.enabled" . }}
            - --tls-cert-file=/tls/tls.crt
            - --tls-key-file=/tls/tls.key
            {{- else }}
            # plain HTTP; put TLS on the ingress or turn on tls.enabled
            - --insecure
            {{- end }}
          env:
            {{- include "kopia.env" . | nindent 12 }}
            - { name: KOPIA_SERVER_USERNAME, value: {{ .Values.ui.username | quote }} }
            - name: KOPIA_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kopia.secretName" . }}
                  key: ui-password
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            {{- range (include "kopia.ports" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $probe) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $probe) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app
              mountPath: /app
            - name: data
              mountPath: /repository
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        # config written by the init container, cache and logs: rebuilt on every start
        - name: app
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kopia.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

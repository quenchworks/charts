{{- /* The repository password (it encrypts every backup: losing it loses the data) and the web UI
       password, generated once and read back on upgrade. */}}
{{- if not .Values.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
  annotations:
    # the repository password cannot be recovered: keep this Secret when the release is removed
    helm.sh/resource-policy: keep
type: Opaque
data:
  repository-password: {{ .Values.repository.password | b64enc | default (get $old "repository-password") | default (randAlphaNum 32 | b64enc) | quote }}
  ui-password: {{ .Values.ui.password | b64enc | default (get $old "ui-password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}

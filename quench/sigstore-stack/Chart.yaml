      image: ghcr.io/quenchworks/images/fulcio@sha256:7ac158b6f682dab918d19d2e52cbbb0cf2443cbc300c16b4890cd26fbe36d4b4
    - name: rekor-tiles
      image: ghcr.io/quenchworks/images/rekor-tiles@sha256:35a60f0b0a423316a7a8f9eea249eea940862886b91e957b44f707f78f5c54f5
    - name: caddy
      image: ghcr.io/quenchworks/images/caddy@sha256:f7549fb9163c703ebda6d6562ff702efcdc7e729838a9c0019330ad509df0c02
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:2bc325e5acd4be85b9d3017463e412a996628ffe696dab6fe7f947535d415d13
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images

apiVersion: v2
name: sigstore-stack
description: "Self-hosted Sigstore: the Fulcio certificate authority, the Rekor v2 transparency log and the Timestamp Authority in one install, for keyless signing with cosign against your own infrastructure. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.28
appVersion: "1.0.0"
keywords:
  - sigstore
  - fulcio
  - rekor
  - timestamp-authority
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
  - https://github.com/sigstore/rekor-tiles
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned to the image rebuilt with OpenTelemetry 1.47 (CVE-2026-128085) and current Wolfi packages."
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: fulcio
      image: ghcr.io/quenchworks/images/fulcio@sha256:5d19f3e8918e655db85ae73852e35ad2e69623a35db96ccda662186fe9cc8519
    - name: rekor-tiles
      image: ghcr.io/quenchworks/images/rekor-tiles@sha256:bd4918034cb06c9c3496b62b78bae2f6293013e4ce2c43ddad649e70a16f93e9
    - name: caddy
      image: ghcr.io/quenchworks/images/caddy@sha256:0306055405f7162a2e69abe5057ce20f1319f6008af6a03224a841ff7bee74ef
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:51ca58cc1def8431ff680e537b4b307ed6207a35dec5ea87a31a9fe3c3924fbd
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: fulcio
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: fulcio.enabled
  - name: rekor-tiles
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
    condition: rekor-tiles.enabled
  - name: timestamp-authority
    version: 0.0.15
    repository: oci://ghcr.io/quenchworks/charts
    condition: timestamp-authority.enabled

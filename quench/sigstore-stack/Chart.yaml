apiVersion: v2
name: sigstore-stack
description: "Self-hosted Sigstore: the Fulcio certificate authority, the Rekor v2 transparency log and the Timestamp Authority in one install, for keyless signing with cosign against your own infrastructure. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.14
appVersion: "1.0.0"
keywords:
  - sigstore
  - fulcio
  - rekor
  - timestamp-authority
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
  - https://github.com/sigstore/rekor-tiles
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 updates"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: fulcio
      image: ghcr.io/quenchworks/images/fulcio@sha256:7f8ec630c072078cffb16bb11edca18c6ca996dd87a70d864c7923c5913b53f8
    - name: rekor-tiles
      image: ghcr.io/quenchworks/images/rekor-tiles@sha256:95412932b5e7126fdcd7cea046a487fc080989dc7ef237fa0f4857142ee3fab8
    - name: caddy
      image: ghcr.io/quenchworks/images/caddy@sha256:dd2b2a0eac537b1c589b2ed160c59c4e0cda881a7001bd559d461714c4e7114a
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:4fbc03d65f9e80e57b731db821a7b6d14755c29234933b17a56d3141d1241598
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: fulcio
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: fulcio.enabled
  - name: rekor-tiles
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: rekor-tiles.enabled
  - name: timestamp-authority
    version: 0.0.7
    repository: oci://ghcr.io/quenchworks/charts
    condition: timestamp-authority.enabled

apiVersion: v2
name: sigstore-stack
description: "Self-hosted Sigstore: the Fulcio certificate authority, the Rekor v2 transparency log and the Timestamp Authority in one install, for keyless signing with cosign against your own infrastructure. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.17
appVersion: "1.0.0"
keywords:
  - sigstore
  - fulcio
  - rekor
  - timestamp-authority
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
  - https://github.com/sigstore/rekor-tiles
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles fulcio=0.0.6,rekor-tiles=0.0.7,timestamp-authority=0.0.9 (the 2026-11-01 wave re-pin)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: fulcio
      image: ghcr.io/quenchworks/images/fulcio@sha256:2994cf71ebc71573ef0ce5a3db4bd79996e58d7acb77fd1aeec789bb725392b5
    - name: rekor-tiles
      image: ghcr.io/quenchworks/images/rekor-tiles@sha256:000ef41f7a9c1d15886d01899731e72423ea74ec4e8ef63721ac8894a6f09ac5
    - name: caddy
      image: ghcr.io/quenchworks/images/caddy@sha256:5145e208a5f392a4436ee8df0dc115b2fbd3447808c9419ec94412f840fddf5a
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:2413a2f3d3397e0d89ac6e2d588fda954ad793004acc113c3eecc762f4112ea3
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts

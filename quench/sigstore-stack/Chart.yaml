apiVersion: v2
name: sigstore-stack
description: "Self-hosted Sigstore: the Fulcio certificate authority, the Rekor v2 transparency log and the Timestamp Authority in one install, for keyless signing with cosign against your own infrastructure. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.21
appVersion: "1.0.0"
keywords:
  - sigstore
  - fulcio
  - rekor
  - timestamp-authority
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
  - https://github.com/sigstore/rekor-tiles
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-11-11 CVE rebuilds (go-jose v4, x/crypto floor, gopacket)"
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: fulcio
      image: ghcr.io/quenchworks/images/fulcio@sha256:500765c1babff291bc2fb72d5384893249464d8d996f81511671c6877436cde6
    - name: rekor-tiles
      image: ghcr.io/quenchworks/images/rekor-tiles@sha256:ec5d2029400de8f34f143a333f544c0c0ea12e5e25b80ebb54a4bf345251cfa2
    - name: caddy
      image: ghcr.io/quenchworks/images/caddy@sha256:6377c513134e78bd41fad0819c9d45830b1868398c1805a5b3ee8494f93072d7
    - name: timestamp-authority
      image: ghcr.io/quenchworks/images/timestamp-authority@sha256:6d6552362015f0e0e1800c7dff9f9b0071547ea944209c87d8e06089a1939126
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: fulcio
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
    condition: fulcio.enabled
  - name: rekor-tiles
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
    condition: rekor-tiles.enabled
  - name: timestamp-authority
    version: 0.0.11
    repository: oci://ghcr.io/quenchworks/charts
    condition: timestamp-authority.enabled

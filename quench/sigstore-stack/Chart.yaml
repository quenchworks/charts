apiVersion: v2
name: sigstore-stack
description: "Self-hosted Sigstore: the Fulcio certificate authority, the Rekor v2 transparency log and the Timestamp Authority in one install, for keyless signing with cosign against your own infrastructure. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.32
appVersion: "1.0.0"
keywords:
  - sigstore
  - fulcio
  - rekor
  - timestamp-authority
  - supply-chain
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/sigstore/fulcio
  - https://github.com/sigstore/rekor-tiles
  - https://github.com/sigstore/timestamp-authority
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the fulcio subchart 0.0.12 -> 0.0.13, rekor-tiles subchart 0.0.15 -> 0.0.16, timestamp-authority subchart 0.0.16 -> 0.0.17."
  artifacthub.io/category: security
  artifacthub.io/images: |

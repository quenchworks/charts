    repository: oci://ghcr.io/quenchworks/charts
    condition: fulcio.enabled
  - name: rekor-tiles
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: rekor-tiles.enabled
  - name: timestamp-authority
    version: 0.0.5
    repository: oci://ghcr.io/quenchworks/charts
    condition: timestamp-authority.enabled

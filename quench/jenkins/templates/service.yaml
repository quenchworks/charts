apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: agent
      port: {{ .Values.service.ports.agent }}
      targetPort: agent
      protocol: TCP
---
{{/* Headless service backing the StatefulSet for a stable per-pod DNS identity. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jenkins.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: agent
      port: {{ .Values.service.ports.agent }}
      targetPort: agent
      protocol: TCP

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
# A small PVC (kind ships a default StorageClass) keeps JENKINS_HOME writable; the
# setup wizard stays disabled so the gate reaches Ready unattended, and the gate
# confirms GET /login returns 200 (the servlet container booted).
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 1536Mi }

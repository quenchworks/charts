apiVersion: v2
name: kyverno
description: "Kyverno: policy as code for Kubernetes. Validates, mutates, generates and cleans up resources from ClusterPolicy/Policy CRs and the CEL-based policies.kyverno.io API, with no new language to learn. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest. One image drives four deployments (admission, background, cleanup and reports controllers); the admission controller mints its own CA and serving certificate and registers its own webhook configurations, so no cert-manager dependency is required."
type: application
version: 0.0.1
appVersion: "1.18.1"
keywords:
  - kyverno
  - policy
  - policy-as-code
  - admission-control
  - admission-webhook
  - governance
  - compliance
  - security
  - kubernetes
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/kyverno/kyverno
annotations:
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: added
      description: "Initial QuenchWorks release of Kyverno 1.18.1: admission, background, cleanup and reports controllers from one 0-CVE image pinned by digest, self-managed webhook TLS, and the full CRD set installed from crds/."
  artifacthub.io/images: |
    - name: kyverno
      image: ghcr.io/quenchworks/images/kyverno@sha256:90c78c2401575be2e2f496a491e242fbd4ba051decd98ba25b46fc1931c816dd
    - name: kubectl
      image: ghcr.io/quenchworks/images/kubectl@sha256:b98289383cc7f088e2c7d5e263ed3b0b10566b73761a86b11cac28caa0c4a1bc
  artifacthub.io/crds: |
    - kind: ClusterPolicy
      version: v1
      name: clusterpolicies.kyverno.io
      displayName: ClusterPolicy
      description: A cluster-wide Kyverno policy with validate, mutate, generate and verifyImages rules.
    - kind: Policy
      version: v1
      name: policies.kyverno.io
      displayName: Policy
      description: A namespaced Kyverno policy, same rule surface as ClusterPolicy but scoped to one namespace.
    - kind: PolicyException
      version: v2
      name: policyexceptions.kyverno.io
      displayName: PolicyException
      description: Exempts named resources from named policy rules without editing the policy.
    - kind: ValidatingPolicy
      version: v1beta1
      name: validatingpolicies.policies.kyverno.io
      displayName: ValidatingPolicy
      description: CEL-based cluster-wide validation policy, the successor API to ClusterPolicy validate rules.
    - kind: MutatingPolicy
      version: v1beta1
      name: mutatingpolicies.policies.kyverno.io
      displayName: MutatingPolicy
      description: CEL-based cluster-wide mutation policy.
    - kind: GeneratingPolicy
      version: v1beta1
      name: generatingpolicies.policies.kyverno.io
      displayName: GeneratingPolicy
      description: CEL-based policy that generates downstream resources from a trigger.
    - kind: ImageValidatingPolicy
      version: v1beta1
      name: imagevalidatingpolicies.policies.kyverno.io
      displayName: ImageValidatingPolicy
      description: Verifies container image signatures and attestations (cosign / notary) at admission.
    - kind: DeletingPolicy
      version: v1beta1
      name: deletingpolicies.policies.kyverno.io
      displayName: DeletingPolicy
      description: CEL-based scheduled deletion policy, executed by the cleanup controller.
    - kind: ClusterCleanupPolicy
      version: v2
      name: clustercleanuppolicies.kyverno.io
      displayName: ClusterCleanupPolicy
      description: Cron-scheduled cleanup of matching cluster-wide resources.
    - kind: PolicyReport
      version: v1alpha2
      name: policyreports.wgpolicyk8s.io
      displayName: PolicyReport
      description: Per-namespace results of policy evaluation, written by the reports controller.
    - kind: ClusterPolicyReport
      version: v1alpha2
      name: clusterpolicyreports.wgpolicyk8s.io
      displayName: ClusterPolicyReport
      description: Cluster-scoped results of policy evaluation, written by the reports controller.
    - kind: GlobalContextEntry
      version: v2beta1
      name: globalcontextentries.kyverno.io
      displayName: GlobalContextEntry
      description: Cached cluster or API data a policy can reference without a per-request API call.
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts

{{/*
The admission controller -- the image's default entrypoint, /usr/bin/kyverno.

It is the only component that must exist, and it bootstraps its own TLS: on first
start it generates a CA and a serving keypair, stores them in the two Secrets
named by --caSecretName / --tlsSecretName, serves HTTPS on --webhookServerPort,
and then writes the CA bundle into the webhook configurations it registers for
itself. There is nothing to mount and no cert-manager dependency; the Role in
rbac.yaml granting Secret write in this namespace is what makes it possible.

The webhook configurations it registers are named by constants compiled into the
binary, not by anything here, so Helm does not own them -- see
templates/hook-webhook-cleanup.yaml for how they get removed again.
*/}}
{{- $svc := include "kyverno.serviceName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kyverno.admissionName" . }}
  labels:
    {{- include "kyverno.componentLabels" (dict "ctx" . "component" "admission-controller") | nindent 4 }}
spec:
  replicas: {{ .Values.admissionController.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kyverno.componentSelectorLabels" (dict "ctx" . "component" "admission-controller") | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "kyverno.componentSelectorLabels" (dict "ctx" . "component" "admission-controller") | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kyverno.admissionServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: kyverno
          image: {{ include "kyverno.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          args:
            - "--caSecretName={{ include "kyverno.admissionCASecretName" . }}"
            - "--tlsSecretName={{ include "kyverno.admissionTLSSecretName" . }}"
            - "--tlsKeyAlgorithm=RSA"
            - "--servicePort=443"
            - "--webhookServerPort={{ .Values.admissionController.webhookServerPort }}"
            {{- /* Kyverno must recognise its own controllers' writes so it does
                   not evaluate policies against the resources it just generated. */}}
            {{- if .Values.backgroundController.enabled }}
            - "--backgroundServiceAccountName=system:serviceaccount:{{ .Release.Namespace }}:{{ include "kyverno.backgroundServiceAccountName" . }}"
            {{- end }}
            {{- if .Values.reportsController.enabled }}
            - "--reportsServiceAccountName=system:serviceaccount:{{ .Release.Namespace }}:{{ include "kyverno.reportsServiceAccountName" . }}"
            {{- end }}
            - "--admissionReports={{ .Values.admissionController.admissionReports }}"
            - "--autoUpdateWebhooks=true"
            - "--generateValidatingAdmissionPolicy={{ .Values.admissionController.generateValidatingAdmissionPolicy }}"
            - "--generateMutatingAdmissionPolicy={{ .Values.admissionController.generateMutatingAdmissionPolicy }}"
            - "--forceFailurePolicyIgnore={{ .Values.admissionController.forceFailurePolicyIgnore }}"
            - "--metricsPort={{ .Values.admissionController.metricsPort }}"
            - "--otelConfig=prometheus"
            - "--loggingFormat=text"
            - "--v={{ .Values.admissionController.logLevel }}"
            {{- range .Values.admissionController.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: INIT_CONFIG
              value: {{ include "kyverno.configMapName" . }}
            - name: METRICS_CONFIG
              value: {{ include "kyverno.metricsConfigMapName" . }}
            - name: KYVERNO_SVC
              value: {{ $svc }}
            - name: KYVERNO_DEPLOYMENT
              value: {{ include "kyverno.admissionName" . }}
            - name: KYVERNO_SERVICEACCOUNT_NAME
              value: {{ include "kyverno.admissionServiceAccountName" . }}
            - name: KYVERNO_ROLE_NAME
              value: {{ printf "%s:admission-controller" (include "quench-common.fullname" .) }}
            - name: KYVERNO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KYVERNO_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- /* Sigstore's TUF client insists on a writable root. The rootfs is
                   read-only, so point it at an emptyDir; without this, any
                   verifyImages rule fails at the first signature check. */}}
            - name: TUF_ROOT
              value: /.sigstore
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: https
              containerPort: {{ .Values.admissionController.webhookServerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.admissionController.metricsPort }}
              protocol: TCP
          {{- /* All three probes speak HTTPS against the webhook server itself,
                 so a green probe means the admission path is actually serving --
                 not merely that the process is up. */}}
          startupProbe:
            httpGet:
              path: /health/liveness
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 6
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.admissionController.resources | nindent 12 }}
          volumeMounts:
            - name: sigstore
              mountPath: /.sigstore
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: sigstore
          emptyDir: {}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

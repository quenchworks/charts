{{- if .Values.serviceAccount.create }}
{{- /*
One ServiceAccount per controller. The split is not cosmetic: the admission
controller is told the background and reports controllers' identities
(--backgroundServiceAccountName / --reportsServiceAccountName) so it can skip
policy evaluation on Kyverno's own writes. Sharing one account would make those
flags meaningless and Kyverno would evaluate its own generated resources.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyverno.admissionServiceAccountName" . }}
  labels:
    {{- include "kyverno.componentLabels" (dict "ctx" . "component" "admission-controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.backgroundController.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyverno.backgroundServiceAccountName" . }}
  labels:
    {{- include "kyverno.componentLabels" (dict "ctx" . "component" "background-controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.cleanupController.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyverno.cleanupServiceAccountName" . }}
  labels:
    {{- include "kyverno.componentLabels" (dict "ctx" . "component" "cleanup-controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.reportsController.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyverno.reportsServiceAccountName" . }}
  labels:
    {{- include "kyverno.componentLabels" (dict "ctx" . "component" "reports-controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

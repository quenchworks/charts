{{- /* The publisher and subscriber HMAC keys (HS256): generated once and read back on upgrade. Your
       app signs tokens with them; rotating them invalidates every token already issued. */}}
{{- if not .Values.jwt.existingSecret }}
{{- $name := include "quench-common.fullname" . }}
{{- $old := ((lookup "v1" "Secret" .Release.Namespace $name) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  publisher-key: {{ .Values.jwt.publisherKey | default (get $old "publisher-key" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  subscriber-key: {{ .Values.jwt.subscriberKey | default (get $old "subscriber-key" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
{{- end }}

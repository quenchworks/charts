# Install gate: a fixed token and dashboard password the workflow's frpc and curl use; one
# published proxy port the gate tunnels the dashboard through.
auth:
  token: quench-ci-frp-token
dashboard:
  password: quench-ci-dash-pass
allowPorts:
  - { start: 6000, end: 6010 }
proxyPorts:
  - { name: ci-proxy, port: 6000, protocol: TCP }
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

{{- if not .Values.auth.existingSecret }}
{{- /* Keep generated values across upgrades: a new token would lock out every frpc. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (include "quench-common.fullname" .) }}
{{- $oldData := ($old | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.auth.token | default "" | b64enc | default (get $oldData "token") | default (randAlphaNum 32 | b64enc) | quote }}
  dashboard-password: {{ .Values.dashboard.password | default "" | b64enc | default (get $oldData "dashboard-password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}

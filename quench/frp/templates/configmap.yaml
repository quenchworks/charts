apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Secrets come from the environment through frp's own config templating (.Envs),
  # so the token and password never land in this ConfigMap.
  frps.toml: |
    bindPort = {{ .Values.bindPort }}
    auth.method = "token"
    auth.token = "{{ "{{" }} .Envs.FRP_AUTH_TOKEN {{ "}}" }}"
    # /healthz (anonymous, used by the probes) and /metrics
    metricsServer.addr = "0.0.0.0"
    metricsServer.port = 7600
    {{- if .Values.dashboard.enabled }}
    webServer.addr = "0.0.0.0"
    webServer.port = {{ .Values.dashboard.port }}
    webServer.user = {{ .Values.dashboard.user | quote }}
    webServer.password = "{{ "{{" }} .Envs.FRP_DASHBOARD_PASSWORD {{ "}}" }}"
    {{- end }}
    {{- if .Values.vhostHTTPPort }}
    vhostHTTPPort = {{ .Values.vhostHTTPPort }}
    {{- end }}
    {{- if .Values.vhostHTTPSPort }}
    vhostHTTPSPort = {{ .Values.vhostHTTPSPort }}
    {{- end }}
    {{- with .Values.subDomainHost }}
    subDomainHost = {{ . | quote }}
    {{- end }}
    {{- if include "quench-common.tls.enabled" . }}
    transport.tls.force = true
    transport.tls.certFile = "/tls/tls.crt"
    transport.tls.keyFile = "/tls/tls.key"
    {{- end }}
    {{- with .Values.allowPorts }}
    allowPorts = [
    {{- range . }}
      {{ if hasKey . "single" }}{ single = {{ .single }} }{{ else }}{ start = {{ .start }}, end = {{ .end }} }{{ end }},
    {{- end }}
    ]
    {{- end }}
    {{- with .Values.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# Persistence stays ON here so the gate proves the PVC binds and nsqd writes its
# disk-queue to it. A small size keeps the gate fast on kind's default provisioner.
persistence:
  enabled: true
  size: 1Gi

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tetragon.agentName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
{{- if .Values.agent.enableK8sApi }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tetragon.agentName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: [podinfo, tracingpolicies, tracingpoliciesnamespaced]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tetragon.agentName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
subjects:
  - { kind: ServiceAccount, name: {{ include "tetragon.agentName" . }}, namespace: {{ .Release.Namespace }} }
roleRef: { kind: ClusterRole, name: {{ include "tetragon.agentName" . }}, apiGroup: rbac.authorization.k8s.io }
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tetragon.operatorName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tetragon.operatorName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: [podinfo]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [tracingpolicies.cilium.io, tracingpoliciesnamespaced.cilium.io, podinfo.cilium.io]
    verbs: [update, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tetragon.operatorName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
subjects:
  - { kind: ServiceAccount, name: {{ include "tetragon.operatorName" . }}, namespace: {{ .Release.Namespace }} }
roleRef: { kind: ClusterRole, name: {{ include "tetragon.operatorName" . }}, apiGroup: rbac.authorization.k8s.io }
{{- end }}

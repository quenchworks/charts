{{- if .Values.operator.enabled }}
{{- $o := .Values.operator -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tetragon.operatorName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tetragon.selectorLabels" (dict "ctx" . "component" "operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tetragon.selectorLabels" (dict "ctx" . "component" "operator") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tetragon.operatorName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: {{ include "tetragon.image" $o.image }}
          imagePullPolicy: {{ $o.image.pullPolicy }}
          args: ["serve", "--config-dir=/etc/tetragon/operator.conf.d/", "--health-probe-bind-address=:8081"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: health, containerPort: 8081, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/tetragon/operator.conf.d/, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: {{ include "tetragon.operatorName" . }}
{{- end }}

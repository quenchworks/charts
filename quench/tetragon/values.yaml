# Tetragon: an eBPF agent on every node (DaemonSet) plus an operator that
# installs the TracingPolicy and PodInfo CRDs. Digests below are the contract
# with the image factory; they are never tags.

agent:
  image:
    repository: ghcr.io/quenchworks/images/tetragon
    digest: "sha256:fb6307365a953b3a86be9bc1e265739c924ed033c651a2122edbdb85fc46b938"
    pullPolicy: IfNotPresent
  # Name reported on every event, to tell clusters apart in one sink.
  clusterName: ""
  # Watch the Kubernetes API so events carry pod, namespace and labels, and
  # TracingPolicy CRDs are loaded.
  enableK8sApi: true
  # Process credentials and namespaces on every exec event (larger events).
  enableProcessCred: false
  enableProcessNs: false
  # Prometheus metrics on this port (0 turns the metrics server off).
  metricsPort: 2112
  # Raw agent options, as {flag: value} without the leading --, e.g.
  #   extraConfig: { export-rate-limit: "1000", process-cache-size: "131072" }
  extraConfig: {}
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  tolerations:
    - operator: Exists
  nodeSelector: {}
  priorityClassName: ""

operator:
  enabled: true
  image:
    repository: ghcr.io/quenchworks/images/tetragon-operator
    digest: "sha256:cbc70ba87d7a4407ddf1f094db4ca824190eea4ca1c2682aa9a5e9426f7c04ac"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  nodeSelector: {}
  tolerations: []

nameOverride: ""
imagePullSecrets: []

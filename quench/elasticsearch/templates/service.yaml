apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    # Elasticsearch listens on loopback only; the nginx sidecar terminates TLS on 8443
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch.headlessName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true   # nodes must resolve each other before they are ready
  ports:
    {{- if include "quench-common.tls.enabled" . }}
    # headless names resolve to pod IPs, so advertise the sidecar's own port
    - port: 8443
      targetPort: https
      name: https
    {{- else }}
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    {{- end }}
    - port: {{ .Values.service.transportPort }}
      targetPort: transport
      name: transport
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

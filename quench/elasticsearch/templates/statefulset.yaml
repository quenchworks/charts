{{/* security off, single-node: liveness on the HTTP port, readiness on cluster health. */}}
{{- $tls := include "quench-common.tls.enabled" . -}}
{{- $liveness := dict "tcpSocket" (dict "port" "http") "initialDelaySeconds" 60 "periodSeconds" 20 -}}
{{- $readiness := dict "httpGet" (dict "path" "/_cluster/health" "port" "http") "initialDelaySeconds" 40 "periodSeconds" 10 "failureThreshold" 40 -}}
{{- if $tls -}}
{{/* TLS on: HTTP binds loopback, which the kubelet cannot reach. Liveness checks the
     transport listener (pod address); readiness goes through the TLS sidecar (by number: a
     named probe port must belong to the probed container). */}}
{{- $liveness = dict "tcpSocket" (dict "port" "transport") "initialDelaySeconds" 60 "periodSeconds" 20 -}}
{{- $readiness = dict "httpGet" (dict "path" "/_cluster/health" "port" 8443 "scheme" "HTTPS") "initialDelaySeconds" 40 "periodSeconds" 10 "failureThreshold" 40 -}}
{{- end -}}
{{/* TLS on: plain HTTP answers on loopback only (the sidecar's upstream). */}}
{{- $extra := list -}}
{{- if $tls }}{{- $extra = append $extra "http.host: 127.0.0.1" -}}{{- end -}}
{{- with .Values.config.extraConfig }}{{- $extra = append $extra . -}}{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "elasticsearch.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "elasticsearch.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: elasticsearch
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # read-only rootfs: config, logs and tmp live on writable emptyDir mounts;
            # data lives on the (optionally persistent) data volume. ES_TMPDIR lives
            # under /data so the server JVM's java.io.tmpdir is on persistent storage.
            - name: ES_PATH_DATA
              value: /data
            - name: ES_PATH_CONF
              value: /conf
            - name: ES_PATH_LOGS
              value: /var/log/elasticsearch
            - name: ES_TMPDIR
              value: /data/tmp
            - name: ES_NODE_NAME
              value: "$(POD_NAME)"
            - name: ES_CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            - name: ES_HTTP_PORT
              value: {{ .Values.service.httpPort | quote }}
            - name: ES_TRANSPORT_PORT
              value: {{ .Values.service.transportPort | quote }}
            - name: ES_DISCOVERY_TYPE
              value: {{ .Values.config.discoveryType | quote }}
            - name: ES_SECURITY_ENABLED
              value: {{ (not .Values.config.securityDisabled) | quote }}
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.config.heapSize }} -Xmx{{ .Values.config.heapSize }}"
            {{- with $extra }}
            - name: ES_CONFIG_EXTRA
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: transport
              containerPort: {{ .Values.service.transportPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # writable mounts over the read-only rootfs:
            - name: conf
              mountPath: /conf
            - name: logs
              mountPath: /var/log/elasticsearch
            # ES 9.x entitlement agent attaches over a Unix socket at /tmp/.java_pid<pid>;
            # /tmp must be writable or the agent attach fails and the node never boots.
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- if $tls }}
        # TLS terminator: Elasticsearch has HTTPS only with xpack security on.
        - name: tls-proxy
          image: "{{ .Values.tlsProxy.image.repository }}@{{ .Values.tlsProxy.image.digest }}"
          imagePullPolicy: {{ .Values.tlsProxy.image.pullPolicy }}
          args: ["-c", "/etc/tls-proxy/nginx.conf"]
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.tlsProxy.resources | nindent 12 }}
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/tls-proxy
              readOnly: true
            - name: tls-proxy-tmp
              mountPath: /tmp
            {{- include "quench-common.tls.volumeMount" . | nindent 12 }}
        {{- end }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $tls }}
        - name: tls-proxy-config
          configMap:
            name: {{ include "quench-common.fullname" . }}-tls-proxy
        - name: tls-proxy-tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

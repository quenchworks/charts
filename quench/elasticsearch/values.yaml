# Elasticsearch's default distribution is dual SSPL-1.0 / Elastic License 2.0 (ELv2).
# NEITHER is OSI-approved open source. Do NOT represent it as open source. CAUTION TIER.
# CLEAN ALTERNATIVE: OpenSearch (Apache-2.0, shipped at /charts/opensearch) is the
# truly-open drop-in fork of Elasticsearch -- PREFER IT for new deployments.
#
# The digest below is the contract with the image factory. CI rewrites it from
# manifests/elasticsearch.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/elasticsearch
  digest: "sha256:a9554f9e6d9ee0d76179b50a6e9d2dd3067a2d0b4d0de8103e7d18d9869e1fc0"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single node for now. A multi-node cluster (seed hosts + cluster.initial_master_nodes
# over the headless service) is a later addition.
replicaCount: 1

# Elasticsearch config knobs (the image writes elasticsearch.yml from these via ES_* env).
config:
  clusterName: quench-elasticsearch
  discoveryType: single-node
  # xpack.security off by default: this is an internal deployment and the NetworkPolicy
  # is the trust boundary. Enable + configure TLS for exposed clusters.
  securityDisabled: true
  heapSize: 512m
  # extra raw elasticsearch.yml appended verbatim (ES_CONFIG_EXTRA); e.g. "indices.query.bool.max_clause_count: 2048"
  extraConfig: ""

persistence:
  enabled: true
  size: 16Gi
  # storageClass: ""        # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""         # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300
  # With tls.enabled the Service publishes this HTTPS port (the TLS sidecar's 8443)
  # instead of httpPort, and Elasticsearch HTTP binds to loopback only.
  httpsPort: 443

# HTTPS for the API. Elasticsearch serves HTTPS only with xpack security (and so auth) on,
# so an nginx sidecar (tlsProxy) terminates TLS on 8443 and proxies to Elasticsearch on
# 127.0.0.1. Transport (9300) stays plain behind the NetworkPolicy. Off by default. The
# first source set wins: existingSecret, then certManager, else a Helm-generated
# self-signed CA + certificate (mounted at /tls).
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# The TLS sidecar (only with tls.enabled): the QuenchWorks hardened nginx, pinned by digest.
tlsProxy:
  image:
    repository: ghcr.io/quenchworks/images/nginx
    digest: "sha256:37bdf717a858d755aa3edad1ee0f85a674ee9fb9d3a273a86038aa3d0951eda9"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional Ingress (HTTP only). Disabled by default, so enabling it is an explicit
# operator decision and this chart's behaviour is unchanged until then.
ingress:
  enabled: false
  # IngressClass to claim this Ingress. Empty -> the cluster default applies.
  className: ""
  annotations: {}
  # Service port to route to. Unset -> resolved from service.port, then
  # service.ports.http / .https.
  servicePort: null
  # e.g. [{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]
  # `paths` may be omitted for the common "/" Prefix case.
  hosts: []
  # Standard Ingress TLS list, e.g. [{hosts: [app.example.com], secretName: app-tls}]
  tls: []

# Standalone install gate. No image override: the install uses the chart's real,
# CI-maintained digest from values.yaml, so the gate pulls the actual signed image.
#
# The gate sends a real message over SMTP and reads it back through the REST API,
# which is the entire round trip the app exists for. Basic auth is on so the
# credentialed API path is exercised too; these credentials are CI-only.
replicaCount: 1

auth:
  username: quench-ci
  password: quench-ci-pass

persistence:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

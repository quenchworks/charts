{{/* Mailpit serves /livez and /readyz on the UI/HTTP port; both are exempt from
     basic auth, so the probes work with or without auth.* configured. */}}
{{- $root := trimSuffix "/" .Values.ui.webroot -}}
{{- $liveness := dict "httpGet" (dict "path" (printf "%s/livez" $root) "port" "http") "initialDelaySeconds" 5 "periodSeconds" 15 -}}
{{- $readiness := dict "httpGet" (dict "path" (printf "%s/readyz" $root) "port" "http") "initialDelaySeconds" 2 "periodSeconds" 10 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mailpit.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: mailpit
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          command: ["/usr/bin/mailpit"]
          args:
            # Both listeners default to [::], which fails on IPv4-only nodes.
            - "--listen=0.0.0.0:{{ .Values.ui.port }}"
            - "--smtp=0.0.0.0:{{ .Values.smtp.port }}"
            - "--database={{ .Values.persistence.path }}/mailpit.db"
            - "--max={{ .Values.smtp.maxMessages }}"
            # No phoning home from a cluster workload.
            - "--disable-version-check"
            {{- with .Values.ui.webroot }}
            - "--webroot={{ . }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or (include "mailpit.authEnabled" .) .Values.extraEnvVars }}
          env:
            {{- if include "mailpit.authEnabled" . }}
            - name: MP_UI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "mailpit.authSecretName" . }}
                  key: {{ include "mailpit.authSecretKey" . }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" $ | nindent 12 }}
          {{- end }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: smtp
              containerPort: {{ .Values.smtp.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # SQLite message store. The root filesystem is read-only, so this is a
            # writable volume even when persistence is off (emptyDir fallback).
            - name: data
              mountPath: {{ .Values.persistence.path }}
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mailpit.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}

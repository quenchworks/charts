{{/* Both listeners are in the default policy: the SMTP port applications send to
     and the HTTP port the UI/API answer on. allowExternal defaults to false, so
     only same-namespace pods reach either one. */}}
{{- $ports := list (dict "port" "smtp" "protocol" "TCP") (dict "port" "http" "protocol" "TCP") -}}
{{- include "quench-common.networkPolicy" (dict "ctx" . "defaultPorts" $ports) }}

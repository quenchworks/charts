{{- if and .Values.auth.username (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  # MP_UI_AUTH takes a single "user:password" credential string.
  ui-auth: {{ printf "%s:%s" .Values.auth.username (required "auth.password is required when auth.username is set (or use auth.existingSecret)" .Values.auth.password) | b64enc | quote }}
{{- end }}

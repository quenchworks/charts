apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: smtp
      port: {{ .Values.service.ports.smtp }}
      targetPort: smtp
      protocol: TCP
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

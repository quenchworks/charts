apiVersion: v2
name: mailpit
description: "Mailpit, an SMTP server and web UI that captures every message an application sends so developers can inspect it instead of delivering it. A dev/test mail sink -- not a production mail server. Hardened by QuenchWorks as a minimal, nonroot, 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.30.7"
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/axllent/mailpit
keywords:
  - mailpit
  - smtp
  - email
  - mail-testing
  - development
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: Mailpit 1.30.7 as a single-replica Deployment on the hardened 0-CVE QuenchWorks image, pinned by digest."
    - kind: added
      description: "Serves SMTP on 1025 and the web UI/API on 8025, both bound to 0.0.0.0 so they work on IPv4-only nodes."
    - kind: added
      description: "Optional HTTP basic auth for the web UI and API (auth.username/auth.password or auth.existingSecret); the SMTP listener stays open by design, so the NetworkPolicy defaults to namespace-only ingress."
  artifacthub.io/license: MIT
  artifacthub.io/category: skip-prediction

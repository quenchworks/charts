apiVersion: v2
name: matomo
description: "Matomo -- self-hosted, privacy-respecting web analytics; you keep the raw data. Runs nginx + php-fpm from a hardened, nonroot, 0-CVE image built from source on Wolfi, cosign-signed and pinned by digest. Bring your own MySQL/MariaDB."
type: application
version: 0.0.1
appVersion: "5.12.0"
kubeVersion: ">=1.23.0-0"
keywords:
  - matomo
  - analytics
  - web-analytics
  - piwik
  - privacy
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/matomo-org/matomo
maintainers:
  - name: mkabumattar
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "First release: Matomo 5.12.0 on a hardened, nonroot, 0-CVE image (nginx + php-fpm under supervisord), pinned by digest."
    - kind: added
      description: "PVC for config/ so the web installer's config.ini.php survives restarts, opt-in Ingress, and a NetworkPolicy that leaves the HTTP port open so tracked sites can send beacons."
  artifacthub.io/category: integration-delivery
  artifacthub.io/images: |
    - name: matomo
      image: ghcr.io/quenchworks/images/matomo@sha256:8d771a71ca6ee35a1595cda0a87d07d15adbc76d51be874ab251d243a90688b0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"

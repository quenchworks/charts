# Install gate. No image override: uses the chart's real CI-maintained digest.
# emptyDir instead of a PVC keeps the gate small -- the gate only proves Matomo SERVES
# (its installer's first screen), not that an install completes, which needs a database.
persistence:
  enabled: false
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: 1, memory: 1Gi }

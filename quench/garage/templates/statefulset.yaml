{{/* httpGet probes: /health on the admin port is unauthenticated and returns 200 once the node is up and the single-node layout is applied. The first-boot layout bootstrap takes ~10-30s, so the initial delays are generous. */}}
{{- $liveness := dict "httpGet" (dict "path" "/health" "port" "admin") "initialDelaySeconds" 30 "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 6 -}}
{{- $readiness := dict "httpGet" (dict "path" "/health" "port" "admin") "initialDelaySeconds" 15 "periodSeconds" 10 "timeoutSeconds" 5 "failureThreshold" 30 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "garage.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "quench-common.podAnnotations" . | nindent 6 }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "garage.serviceAccountName" . }}
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- include "quench-common.podSpecFields" . | nindent 6 }}
      {{- include "quench-common.initContainers" . | nindent 6 }}
      containers:
        - name: garage
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          {{- include "quench-common.command" . | nindent 10 }}
          {{- include "quench-common.args" . | nindent 10 }}
          env:
            # All state (metadata_dir, data_dir, generated garage.toml) lives under
            # /data (the PVC); the entrypoint defaults the dirs there.
            - name: GARAGE_METADATA_DIR
              value: /data/meta
            - name: GARAGE_DATA_DIR
              value: /data/data
            - name: GARAGE_CONFIG_FILE
              value: /data/garage.toml
            - name: GARAGE_S3_PORT
              value: {{ .Values.service.port | quote }}
            - name: GARAGE_ADMIN_PORT
              value: {{ .Values.service.adminPort | quote }}
            - name: GARAGE_ZONE
              value: {{ .Values.config.zone | quote }}
            - name: GARAGE_CAPACITY
              value: {{ .Values.config.capacity | quote }}
            {{- with .Values.config.defaultBucket }}
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            # rpc_secret + admin_token come from the Secret (generated/persisted if
            # unset). The S3 access/secret key pair is imported as the admin key; the
            # access key MUST be "GK" + 24 hex chars (Garage validates this).
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: {{ include "garage.secretRpcSecretKey" . }}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: {{ include "garage.secretAdminTokenKey" . }}
            - name: GARAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: {{ include "garage.secretAccessKeyKey" . }}
            - name: GARAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: {{ include "garage.secretSecretKeyKey" . }}
            {{- end }}
            {{- include "quench-common.extraEnvVars" . | nindent 12 }}
          {{- include "quench-common.envFrom" . | nindent 10 }}
          ports:
            - name: s3
              containerPort: {{ .Values.service.port }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "liveness" "default" $liveness) | nindent 10 }}
          {{- include "quench-common.probe" (dict "ctx" . "name" "readiness" "default" $readiness) | nindent 10 }}
          {{- with .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "quench-common.lifecycleHooks" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # metadata_dir, data_dir and the generated garage.toml all live here
            # (read-only rootfs: this must be writable).
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.extraVolumeMounts" . | nindent 12 }}
        {{- include "quench-common.sidecars" . | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- include "quench-common.extraVolumes" . | nindent 8 }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

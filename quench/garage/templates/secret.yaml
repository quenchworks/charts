{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{/* Access key: Garage requires "GK" + exactly 24 lowercase hex chars. */}}
{{- $ak := .Values.auth.accessKey -}}
{{- if and (not $ak) $existing -}}
{{- $ak = index $existing.data "access-key" | b64dec -}}
{{- end -}}
{{- if not $ak -}}
{{- $ak = printf "GK%s" (sha256sum (randAlphaNum 32) | trunc 24) -}}
{{- end -}}
{{/* Secret key: 64 hex chars. */}}
{{- $sk := .Values.auth.secretKey -}}
{{- if and (not $sk) $existing -}}
{{- $sk = index $existing.data "secret-key" | b64dec -}}
{{- end -}}
{{- if not $sk -}}
{{- $sk = sha256sum (randAlphaNum 32) -}}
{{- end -}}
{{/* RPC secret: 64 hex chars; persisted so the single node is not orphaned. */}}
{{- $rpc := .Values.auth.rpcSecret -}}
{{- if and (not $rpc) $existing -}}
{{- $rpc = index $existing.data "rpc-secret" | b64dec -}}
{{- end -}}
{{- if not $rpc -}}
{{- $rpc = sha256sum (randAlphaNum 32) -}}
{{- end -}}
{{/* Admin token: 64 hex chars; guards the admin API on :3903. */}}
{{- $admin := .Values.auth.adminToken -}}
{{- if and (not $admin) $existing -}}
{{- $admin = index $existing.data "admin-token" | b64dec -}}
{{- end -}}
{{- if not $admin -}}
{{- $admin = sha256sum (randAlphaNum 32) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ $ak | b64enc | quote }}
  secret-key: {{ $sk | b64enc | quote }}
  rpc-secret: {{ $rpc | b64enc | quote }}
  admin-token: {{ $admin | b64enc | quote }}
{{- end }}

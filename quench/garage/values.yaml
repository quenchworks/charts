# The digest below is the contract with the image factory. CI rewrites it from
# manifests/garage.json after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/garage
  digest: "sha256:feb4e12d18725972ed9eb8a742367af18ecee8b2eaa6127f8294d9bf4a4ff55f"
  pullPolicy: IfNotPresent

nameOverride: ""

# Single node. Garage runs one `garage server` process; the entrypoint seeds
# garage.toml, applies a single-node layout, and imports the S3 key + default
# bucket on first boot. replication_factor=1.
replicaCount: 1

# S3 credentials and cluster secrets. With auth enabled the entrypoint imports
# the access/secret key pair and turns it into the admin key. All four secret
# values live in a Secret (generated + preserved across upgrades if not provided).
#
# IMPORTANT: Garage validates the access key ID format — it MUST be "GK" followed
# by exactly 24 hex chars. A generated key honours this; if you supply your own
# accessKey it must match, or `garage key import` fails ("Invalid key format").
auth:
  # Generate and wire the S3 + RPC + admin secrets into the container. Hardened default.
  enabled: true
  accessKey: ""                # generated as GK + 24 hex if empty
  secretKey: ""                # generated (64 hex) if empty
  rpcSecret: ""                # generated (64 hex) if empty; persisted across restarts
  adminToken: ""               # generated (64 hex) if empty; guards the admin API
  existingSecret: ""           # use this Secret instead of the managed one
  existingSecretAccessKeyKey: "access-key"
  existingSecretSecretKeyKey: "secret-key"
  existingSecretRpcSecretKey: "rpc-secret"
  existingSecretAdminTokenKey: "admin-token"

# Garage runtime config (passed through env to the entrypoint).
config:
  defaultBucket: ""            # optionally create + grant this bucket to the admin key on first boot
  zone: "dc1"                  # GARAGE_ZONE — layout zone for the single node
  capacity: "1G"              # GARAGE_CAPACITY — declared capacity for the single node

persistence:
  enabled: true
  size: 8Gi
  # storageClass: ""           # default class if unset
  accessModes: ["ReadWriteOnce"]
  annotations: {}
  selector: {}
  existingClaim: ""            # bind an existing PVC instead of provisioning one

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

service:
  type: ClusterIP
  port: 3900                   # the S3 API
  adminPort: 3903              # the admin API (/health, unauthenticated, probe-safe)

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 60
updateStrategy: {}
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
command: []
args: []
# Security contexts merge over the hardened quench-common defaults (your keys win).
podSecurityContext: {}
containerSecurityContext: {}
# Probe timing overrides ({enabled, initialDelaySeconds, periodSeconds, ...}); a
# customLivenessProbe/customReadinessProbe/customStartupProbe replaces the block.
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false

networkPolicy:
  enabled: true
  allowExternal: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

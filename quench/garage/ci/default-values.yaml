# Standalone install gate. No image override: uses the chart's real CI-maintained digest.
persistence:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
auth:
  enabled: true
  # Garage validates the access key ID: it MUST be "GK" + exactly 24 hex chars.
  accessKey: "GK0123456789abcdef01234567"
  secretKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
config:
  defaultBucket: "gate"
  capacity: "1G"

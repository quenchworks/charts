# Install gate. No image override: the install uses the chart's real, CI-maintained digest.
# The release workflow starts a PostgreSQL pod and Service named gate-postgres first.
tls:
  enabled: true
databases:
  - name: app
    host: gate-postgres.default.svc.cluster.local
    port: 5432
users:
  - name: postgres
    database: app
    password: quench-ci-password
admin:
  password: quench-ci-admin

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ include "pgdog.adminPassword" . | quote }}
  pgdog.toml: |
    {{- include "pgdog.config" . | nindent 4 }}
  {{- if not .Values.existingUsersSecret }}
  users.toml: |
    {{- include "pgdog.users" . | nindent 4 }}
  {{- end }}

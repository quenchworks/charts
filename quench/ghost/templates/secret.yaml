{{/*
The managed Secret carries the DB password Ghost connects with, under db-password. It is
injected into the pod as database__connection__password via secretKeyRef so the password
never appears in the pod's argv / process list.

When the bundled MariaDB is enabled the password must be IDENTICAL to the one the MariaDB
subchart provisions for its application user (mariadb.auth.username). To keep them in sync
the value is resolved in this order: explicit mariadb.auth.password -> the subchart's
already-rendered Secret (<release>-mariadb / mariadb-password) via lookup -> this Secret's
prior value -> a fresh 24-char random. Set mariadb.auth.password for a deterministic install.

When an EXTERNAL database is used WITH externalDatabase.existingSecret, this chart renders
no Secret — the referenced Secret must already supply the password under
externalDatabase.existingSecretPasswordKey.
*/}}
{{- if include "ghost.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- DB password ---- */}}
{{- $pw := "" -}}
{{- if .Values.mariadb.enabled -}}
{{- $pw = .Values.mariadb.auth.password -}}
{{- if not $pw -}}
{{- $mdbSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mariadb" .Release.Name) -}}
{{- if $mdbSecret -}}{{- $pw = index $mdbSecret.data "mariadb-password" | default "" | b64dec -}}{{- end -}}
{{- end -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- else -}}
{{- $pw = .Values.externalDatabase.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $pw | b64enc | quote }}
{{- end }}

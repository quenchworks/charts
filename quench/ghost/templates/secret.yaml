{{/*
For an external database without an existingSecret, this Secret carries the DB password
under db-password: explicit externalDatabase.password, else this Secret's prior value, else
a fresh 24-char random. With the bundled MariaDB the pod reads the MariaDB chart's Secret,
and with an existingSecret it reads that one, so no Secret is rendered here.
*/}}
{{- if include "ghost.manageSecret" . }}
{{- $name := include "quench-common.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}

{{/* ---- DB password ---- */}}
{{- $pw := .Values.externalDatabase.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = index $existing.data "db-password" | default "" | b64dec -}}{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ $pw | b64enc | quote }}
{{- end }}

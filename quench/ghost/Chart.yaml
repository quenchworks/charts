apiVersion: v2
name: ghost
description: Hardened Ghost publishing platform (Node.js CMS + membership/newsletter engine) on a 0-CVE nonroot image, with a bundled MariaDB backend.
type: application
version: 0.0.18
appVersion: "6.65.0"
kubeVersion: ">=1.23.0-0"
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/TryGhost/Ghost
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
keywords:
  - ghost
  - cms
  - blog
  - publishing
  - newsletter
  - nodejs
maintainers:
  - name: mkabumattar
    email: info@quench-works.com
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Bundled subcharts moved to their current 0-CVE releases: mariadb 0.0.17."
  # Ghost is a content-publishing web application; the ArtifactHub category enum
  # (ai-machine-learning, database, integration-delivery, monitoring-logging, networking,
  # security, skip-prediction, storage, streaming-messaging) has no CMS/web-app bucket.
  # "skip-prediction" is AH's explicit "no category fits" value — the honest choice for a
  # CMS (mirrors quench/mattermost, the nearest general-app analog in this catalog).
  category: skip-prediction
  licenses: MIT
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: upstream
      url: https://github.com/TryGhost/Ghost
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: ghost
      image: ghcr.io/quenchworks/images/ghost@sha256:1d500afed63f3690e4ec1601cca45e3dd0482a2f5c1354ed6e967ecdead92a79
    - name: mariadb
      image: ghcr.io/quenchworks/images/mariadb@sha256:3c37e899fb35ce9fa782363fda52d664ec1eaed22592a2fcba3ca907f1b7944a
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: mariadb
    alias: mariadb
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: mariadb.enabled

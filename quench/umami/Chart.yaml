apiVersion: v2
name: umami
description: "Umami: privacy-focused web analytics without cookies (page views, events, funnels, sessions) on PostgreSQL. Hardened by QuenchWorks: built from source, nonroot, CVE-gated, cosign-signed and pinned by digest."
type: application
version: 0.0.12
appVersion: "3.5.0"
keywords:
  - umami
  - analytics
  - web-analytics
  - privacy
  - nextjs
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/umami-software/umami
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned umami to a rebuilt image digest (no application version change)."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: umami
      image: ghcr.io/quenchworks/images/umami@sha256:10e9817c35441ee516727627a866fc2f176bd4b4f00822f9919826f5ccb77f20
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: postgresql
    alias: postgresql
    version: 0.0.38
    repository: oci://ghcr.io/quenchworks/charts
    condition: postgresql.enabled

{{- $name := include "quench-common.fullname" . -}}
{{- $needKey := not .Values.appSecret.existingSecret -}}
{{- $needDb := and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- if or $needKey $needDb }}
{{- $key := .Values.appSecret.value -}}
{{- if and $needKey (not $key) -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $key = index .data "app-secret" | default "" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if and $needKey (not $key) -}}{{- $key = randAlphaNum 48 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKey }}
  # Signs login tokens and share links. Kept across upgrades.
  app-secret: {{ $key | b64enc | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}

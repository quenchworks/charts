{{- /* The initial superuser's password, generated once and read back on upgrade. linkding
       creates the user on first start only (create_initial_superuser). */}}
{{- if not .Values.superuser.existingSecret }}
{{- $name := include "linkding.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.superuser.password | default (get (($old | default dict).data | default dict) "password" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pw | b64enc | quote }}
{{- end }}

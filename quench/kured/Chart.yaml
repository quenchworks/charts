apiVersion: v2
name: kured
description: "kured, the Kubernetes reboot daemon: a DaemonSet that watches each node for a reboot-required sentinel and reboots nodes one at a time behind a lock, cordoning and draining first. Hardened by QuenchWorks as a minimal 0-CVE image, cosign-signed and pinned by digest."
type: application
version: 0.0.1
appVersion: "1.23.0"
kubeVersion: ">=1.23.0-0"
keywords:
  - kured
  - reboot
  - node
  - maintenance
  - kubernetes

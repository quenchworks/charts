# Quenchworks CrateDB on the QuenchWorks cratedb image (nonroot, 0-CVE, cosign-signed,
# pinned by digest).
image:
  repository: ghcr.io/quenchworks/images/cratedb
  digest: "sha256:f015275a37befdfc22c95d7aa76bedc318ef34044d587d5a6af9a03d28f7b566"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# 1 runs a single node (discovery.type=single-node, which also skips the production
# bootstrap checks). More than 1 forms a cluster over the headless Service, and then
# every node must have vm.max_map_count >= 262144 (a node-level sysctl this chart does
# not set).
replicas: 1

# Heap: the image defaults to -Xms256m -XX:MaxRAMPercentage=50 of the memory limit,
# leaving the rest for Lucene's page cache. Override with JDK_JAVA_OPTIONS in extraEnv.
extraEnv: []
# Extra settings as -C flags, e.g. ["-Cstats.enabled=false"].
extraArgs: []

persistence:
  enabled: true
  size: 16Gi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources:
  requests: { cpu: 500m, memory: 2Gi }
  limits: { cpu: "2", memory: 4Gi }
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  httpPort: 4200
  pgPort: 5432

# Native TLS: HTTP (4200) serves HTTPS only, and PostgreSQL (5432) speaks SSL with password
# logins required to use it (host-based auth entry 99 gets ssl: on; local trust is unchanged).
# CrateDB reads only a keystore, so an init container on the openssl image builds a PKCS12. The
# certificate comes from the first source set: existingSecret, then a cert-manager Certificate,
# else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# Helper image for the TLS init container. Pinned by digest, never a tag.
openssl:
  repository: ghcr.io/quenchworks/images/openssl
  digest: "sha256:81d39521803214393629df2c8c08860b371414b46c2228af9598e0e23ff70f0c"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
containerSecurityContext: {}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: pg
      port: {{ .Values.service.pgPort }}
      targetPort: pg
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quench-common.fullname" . }}-headless
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # nodes must find each other before they are Ready
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: 4300
      targetPort: transport
  selector:
    {{- include "quench-common.selectorLabels" . | nindent 4 }}

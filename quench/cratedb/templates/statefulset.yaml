{{- $full := include "quench-common.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ $full }}-headless
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cratedb.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "quench-common.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "quench-common.tls.enabled" . }}
      initContainers:
        {{- include "quench-common.tls.pkcs12InitContainer" (dict "ctx" . "image" (printf "%s@%s" .Values.openssl.repository .Values.openssl.digest) "password" "changeit") | nindent 8 }}
      {{- end }}
      containers:
        - name: cratedb
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # the image entrypoint is the JVM command; these are CrateDB -C settings
          args:
            - -Cpath.data=/data
            # bind every interface (a port-forward arrives on 127.0.0.1, which is how the
            # locally trusted superuser gets in) but advertise the pod address
            - -Cnetwork.bind_host=0.0.0.0
            - -Cnetwork.publish_host=_site_
            - -Cnode.name=$(POD_NAME)
            - -Ccluster.name={{ $full }}
            {{- if eq (int .Values.replicas) 1 }}
            - -Cdiscovery.type=single-node
            {{- else }}
            - -Cdiscovery.seed_hosts={{ $full }}-headless
            - -Ccluster.initial_master_nodes={{ range $i, $e := until (int .Values.replicas) }}{{ if $i }},{{ end }}{{ $full }}-{{ $i }}{{ end }}
            - -Cgateway.expected_data_nodes={{ .Values.replicas }}
            - -Cgateway.recover_after_data_nodes={{ .Values.replicas }}
            {{- end }}
            {{- if include "quench-common.tls.enabled" . }}
            # HTTP (4200) turns HTTPS only; PostgreSQL (5432) offers SSL, and the image's
            # password entry (99) now demands it, so remote logins cannot fall back to plain.
            # The local trust entry is unchanged. The keystore password guards nothing extra.
            - -Cssl.http.enabled=true
            - -Cssl.psql.enabled=true
            - -Cssl.keystore_filepath=/tls-pkcs12/keystore.p12
            - -Cssl.keystore_password=changeit
            - -Cssl.keystore_key_password=changeit
            - -Cauth.host_based.config.99.ssl=on
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 4200
            - name: pg
              containerPort: 5432
            - name: transport
              containerPort: 4300
          # tcpSocket: host-based auth trusts only local connections, so an HTTP probe
          # from the kubelet would be asked for a password
          startupProbe:
            tcpSocket: { port: pg }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: pg }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "quench-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- include "quench-common.tls.pkcs12VolumeMount" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "quench-common.tls.volume" . | nindent 8 }}
        {{- include "quench-common.tls.pkcs12Volume" . | nindent 8 }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

# The digest below is the contract with the image factory. CI rewrites it from
# the image-published dispatch after every green image build. It is never a tag.
image:
  repository: ghcr.io/quenchworks/images/yarr
  digest: "sha256:952227dc7af4231327ab4e6dd7078be1b8887866016e23f6ed67e45178f6c094"
  pullPolicy: IfNotPresent

nameOverride: ""

# yarr keeps its SQLite database in /data: run one replica (Recreate with the volume).
replicaCount: 1
updateStrategy:
  type: Recreate

# YARR_BASE: serve under a sub-path (e.g. /yarr) behind an ingress; empty serves at /.
basePath: ""

# The login (one user). Empty password: generated into the Secret <fullname> (password). Turning it
# off leaves the reader open to anyone who can reach it.
auth:
  enabled: true
  username: admin
  password: ""
  existingSecret: ""   # a Secret with key "auth" (username:password) instead

# More yarr settings as environment variables, e.g. YARR_LOGFILE.
settings: {}

# The data volume: the SQLite database (/data/yarr.db).
persistence:
  enabled: true
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  storageClass: ""
  annotations: {}

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 7070
  annotations: {}
  externalTrafficPolicy: ""

# Native TLS: yarr serves HTTPS instead of HTTP on its one port from the PEM pair at /tls (the
# probes switch to HTTPS). The certificate comes from the first source set: existingSecret, then a
# cert-manager Certificate, else a Helm-generated CA + certificate.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer }
    dnsNames: []
    duration: ""
  selfSigned:
    validityDays: 365

# --- Common production knobs, wired through quench-common (all optional) ---
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: 30
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
lifecycleHooks: {}
podSecurityContext: {}
containerSecurityContext: {}
livenessProbe: {}
readinessProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true
  allowExternal: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

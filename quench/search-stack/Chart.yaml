apiVersion: v2
name: search-stack
description: "Hardened search with a UI in one install: OpenSearch (search and analytics engine, HA cluster or one node) + OpenSearch Dashboards (Discover, dashboards, visualizations, Dev Tools) wired to it. Every image is QuenchWorks-hardened, nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.6
appVersion: "3.8.0"
keywords:
  - search
  - opensearch
  - opensearch-dashboards
  - analytics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/opensearch-project/OpenSearch
  - https://github.com/opensearch-project/OpenSearch-Dashboards
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles opensearch=0.1.17 (opensearch 0.1.17: TLS on 443, HA restart fix)"
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:7a07c11e843c677f75fb452ddb52667e634c898ec6d22acf7d066097c4be3e16
    - name: opensearch-dashboards
      image: ghcr.io/quenchworks/images/opensearch-dashboards@sha256:fe8e7e8565296ddd38037ff9c31590fe5901b70cf3b257d5a14ea9552a4edd38
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.9
    repository: oci://ghcr.io/quenchworks/charts
  - name: opensearch
    version: 0.1.17
    repository: oci://ghcr.io/quenchworks/charts
  - name: opensearch-dashboards
    version: 0.0.3
    repository: oci://ghcr.io/quenchworks/charts
    condition: opensearch-dashboards.enabled

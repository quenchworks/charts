apiVersion: v2
name: search-stack
description: "Hardened search with a UI in one install: OpenSearch (search and analytics engine, HA cluster or one node) + OpenSearch Dashboards (Discover, dashboards, visualizations, Dev Tools) wired to it. Every image is QuenchWorks-hardened, nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.20
appVersion: "3.8.0"
keywords:
  - search
  - opensearch
  - opensearch-dashboards
  - analytics
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/opensearch-project/OpenSearch
  - https://github.com/opensearch-project/OpenSearch-Dashboards
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Re-pinned opensearch 3.10.0 to the rebuilt digests."
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: opensearch
      image: ghcr.io/quenchworks/images/opensearch@sha256:1e291d4c7d24564855f8d3e918b723bcdc61ae9a82ece6620e9736cb1692fc6a
    - name: opensearch-dashboards
      image: ghcr.io/quenchworks/images/opensearch-dashboards@sha256:7c3dde4ee24ea532c0a5a6db3b685b412f22152cb4720df594eaff2950f6fb22
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: opensearch
    version: 0.1.25
    repository: oci://ghcr.io/quenchworks/charts
  - name: opensearch-dashboards
    version: 0.0.6
    repository: oci://ghcr.io/quenchworks/charts
    condition: opensearch-dashboards.enabled

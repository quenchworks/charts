{{/*
  Front door for the stack. A stack has NO Service of its own, so the Ingress names a
  SUBCHART Service: Dashboards by default. Override ingress.serviceName /
  ingress.servicePort to front OpenSearch instead.
*/}}
{{- $svc := .Values.ingress.serviceName | default (printf "%s-opensearch-dashboards" .Release.Name) -}}
{{- $port := .Values.ingress.servicePort | default 5601 -}}
{{- include "quench-common.ingress" (dict "ctx" . "serviceName" $svc "port" $port) }}

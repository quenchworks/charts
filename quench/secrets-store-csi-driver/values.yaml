# Secrets Store CSI Driver node plugin, pinned by digest. It runs on every node as a
# privileged DaemonSet: it mounts tmpfs volumes into pod directories under the kubelet.
image:
  repository: ghcr.io/quenchworks/images/secrets-store-csi-driver
  digest: "sha256:f18a73799f200a31ef3fb0d4c922b592212cac36d32f80752d6b2fa5edcb566f"
  pullPolicy: IfNotPresent

# Registers the driver's socket with the kubelet.
registrar:
  repository: ghcr.io/quenchworks/images/csi-node-driver-registrar
  digest: "sha256:d470e1d885e1095e5b40a7327208a97782f881dbc6877998e1850aa748a78089"

# Serves /healthz for the driver container's liveness probe.
livenessProbe:
  repository: ghcr.io/quenchworks/images/csi-livenessprobe
  digest: "sha256:7ec2df136e30883a869c957ab2d043ce5402d65abe02475395ed4ae8e9b7a6d7"

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# The kubelet's root directory; change it for distributions that move it (k0s, microk8s).
kubeletDir: /var/lib/kubelet

# Mirror mounted objects into Kubernetes Secrets (SecretProviderClass spec.secretObjects).
# Off by default: it grants the driver create/update/delete on Secrets cluster-wide.
syncSecret:
  enabled: false

# Re-fetch mounted secrets from the provider on an interval.
enableSecretRotation: false
rotationPollInterval: 2m

# Extra arguments for the driver.
extraArgs: []

resources:
  requests: { cpu: 50m, memory: 100Mi }
  limits: { cpu: 200m, memory: 200Mi }
sidecarResources:
  requests: { cpu: 10m, memory: 20Mi }
  limits: { cpu: 100m, memory: 100Mi }

podAnnotations: {}
podLabels: {}
nodeSelector:
  kubernetes.io/os: linux
# A node plugin belongs on every node, tainted or not.
tolerations:
  - operator: Exists
affinity: {}
priorityClassName: ""

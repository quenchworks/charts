{{- $plugin := printf "%s/plugins/csi-secrets-store" (trimSuffix "/" .Values.kubeletDir) -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "quench-common.fullname" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "quench-common.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: secrets-store
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quench-common.selectorLabels" . | nindent 8 }}
        {{- include "quench-common.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quench-common.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: "{{ .Values.registrar.repository }}@{{ .Values.registrar.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --v=2
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $plugin }}/csi.sock
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
            - { name: registration-dir, mountPath: /registration }
          resources:
            {{- toYaml .Values.sidecarResources | nindent 12 }}
        - name: secrets-store
          image: {{ include "quench-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --nodeid=$(KUBE_NODE_NAME)
            - --provider-volume=/var/run/secrets-store-csi-providers
            - --additional-provider-volume-paths=/etc/kubernetes/secrets-store-csi-providers
            - --metrics-addr=:8095
            - --enable-secret-rotation={{ .Values.enableSecretRotation }}
            - --rotation-poll-interval={{ .Values.rotationPollInterval }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - { name: CSI_ENDPOINT, value: "unix:///csi/csi.sock" }
            - name: KUBE_NODE_NAME
              valueFrom: { fieldRef: { apiVersion: v1, fieldPath: spec.nodeName } }
          # Bidirectional mount propagation into the kubelet's pod directories needs privileged.
          securityContext:
            privileged: true
          ports:
            - { containerPort: 9808, name: healthz, protocol: TCP }
            - { containerPort: 8095, name: metrics, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
            - { name: mountpoint-dir, mountPath: {{ trimSuffix "/" .Values.kubeletDir }}/pods, mountPropagation: Bidirectional }
            - { name: providers-dir, mountPath: /etc/kubernetes/secrets-store-csi-providers }
            - { name: providers-dir-0, mountPath: /var/run/secrets-store-csi-providers }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: liveness-probe
          image: "{{ .Values.livenessProbe.repository }}@{{ .Values.livenessProbe.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=0.0.0.0:9808
            - -v=2
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
          resources:
            {{- toYaml .Values.sidecarResources | nindent 12 }}
      volumes:
        - name: mountpoint-dir
          hostPath: { path: {{ trimSuffix "/" .Values.kubeletDir }}/pods, type: DirectoryOrCreate }
        - name: registration-dir
          hostPath: { path: {{ trimSuffix "/" .Values.kubeletDir }}/plugins_registry/, type: Directory }
        - name: plugin-dir
          hostPath: { path: {{ $plugin }}/, type: DirectoryOrCreate }
        # Providers (Vault, AWS, Azure, GCP) drop their sockets in one of these.
        - name: providers-dir
          hostPath: { path: /etc/kubernetes/secrets-store-csi-providers, type: DirectoryOrCreate }
        - name: providers-dir-0
          hostPath: { path: /var/run/secrets-store-csi-providers, type: DirectoryOrCreate }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

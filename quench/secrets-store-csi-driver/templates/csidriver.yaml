# The kubelet looks the driver up by this fixed name; SecretProviderClass volumes name it too.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: secrets-store.csi.k8s.io
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
spec:
  podInfoOnMount: true
  attachRequired: false
  volumeLifecycleModes:
    - Ephemeral
  # Republish keeps rotated secrets current; without rotation it is a no-op.
  requiresRepublish: true

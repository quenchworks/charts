# ArtifactHub repository metadata. For OCI repos this is pushed to the chart's
# OCI path with the reserved tag `artifacthub.io`, which lets ArtifactHub verify
# ownership and award the Verified Publisher badge. One ID per ArtifactHub repo.
# AH identifier convention: quench-secrets-store-csi-driver, OCI URL oci://ghcr.io/quenchworks/charts/secrets-store-csi-driver.
repositoryID: REPLACE_WITH_REPOSITORY_ID   # secrets-store-csi-driver (oci://ghcr.io/quenchworks/charts/secrets-store-csi-driver)
owners:
  - name: QuenchWorks
    email: info@quench-works.com

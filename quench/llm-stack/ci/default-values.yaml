# Install gate on kind: only the small embedding model, small volumes.
models:
  - all-minilm
litellm:
  config:
    model_list:
      - model_name: embed
        litellm_params:
          model: ollama/all-minilm
          api_base: http://llm-ollama:11434
ollama:
  persistence:
    size: 2Gi
qdrant:
  persistence:
    size: 1Gi

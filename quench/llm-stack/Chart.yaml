apiVersion: v2
name: llm-stack
description: "Self-hosted LLM stack: Ollama runs the models, LiteLLM serves them through one OpenAI-compatible API with a generated key, and Qdrant stores embeddings for retrieval. The models you list are pulled at install. All QuenchWorks images are nonroot, 0-CVE, pinned by digest and cosign-signed."
type: application
version: 0.0.30
appVersion: "1.0.0"
keywords:
  - ollama
  - litellm
  - qdrant
  - llm
  - rag
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ollama/ollama
  - https://github.com/BerriAI/litellm
  - https://github.com/qdrant/qdrant
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "re-pin to the 2026-10-22 updates"
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: ollama
      image: ghcr.io/quenchworks/images/ollama@sha256:ab23bcd3babe0650b547cd0eaded6f45fb2dfedf54e40a1253c385bd16e5942b
    - name: litellm
      image: ghcr.io/quenchworks/images/litellm@sha256:2388983ffcb2c64ff6a959b090bb058d6453ac73f4d8266b7544b6b821249ab6
    - name: qdrant
      image: ghcr.io/quenchworks/images/qdrant@sha256:65750911f8e7754e431055b92546e03cd1fa2a511429f54c58279742c35b9a09
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.8
    repository: oci://ghcr.io/quenchworks/charts
  - name: ollama
    version: 0.0.31
    repository: oci://ghcr.io/quenchworks/charts
    condition: ollama.enabled
  - name: litellm
    version: 0.0.17
    repository: oci://ghcr.io/quenchworks/charts
    condition: litellm.enabled
  - name: qdrant
    version: 0.0.20
    repository: oci://ghcr.io/quenchworks/charts
    condition: qdrant.enabled

apiVersion: v2
name: llm-stack
description: "Self-hosted LLM stack: Ollama runs the models, LiteLLM serves them through one OpenAI-compatible API with a generated key, and Qdrant stores embeddings for retrieval. The models you list are pulled at install. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.57
appVersion: "1.0.0"
keywords:
  - ollama
  - litellm
  - qdrant
  - llm
  - rag
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ollama/ollama
  - https://github.com/BerriAI/litellm
  - https://github.com/qdrant/qdrant
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped the ollama subchart 0.0.38 -> 0.0.39, litellm subchart 0.0.30 -> 0.0.32."
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: ollama
      image: ghcr.io/quenchworks/images/ollama@sha256:78897c351c2823c3f6142f920e1bb4874e2fd7811e4dc110a56408c7f4bdf943
    - name: litellm
      image: ghcr.io/quenchworks/images/litellm@sha256:be2a12f49e10f05ab07da00c5c522e36dd82dd93787bfb30a43dfb5b733739ed
    - name: qdrant
      image: ghcr.io/quenchworks/images/qdrant@sha256:af0e2e34f30d417cf45999fc00b6c1e23aeea04527cbdd324ce45be9cf442a1a
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: ollama
    version: 0.0.39
    repository: oci://ghcr.io/quenchworks/charts
    condition: ollama.enabled
  - name: litellm
    version: 0.0.32
    repository: oci://ghcr.io/quenchworks/charts
    condition: litellm.enabled
  - name: qdrant
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: qdrant.enabled

apiVersion: v2
name: llm-stack
description: "Self-hosted LLM stack: Ollama runs the models, LiteLLM serves them through one OpenAI-compatible API with a generated key, and Qdrant stores embeddings for retrieval. The models you list are pulled at install. All QuenchWorks images are nonroot, CVE-gated, pinned by digest and cosign-signed."
type: application
version: 0.0.46
appVersion: "1.0.0"
keywords:
  - ollama
  - litellm
  - qdrant
  - llm
  - rag
  - stack
maintainers:
  - name: QuenchWorks
    email: info@quench-works.com
    url: https://github.com/quenchworks
icon: https://raw.githubusercontent.com/quenchworks/.github/main/profile/assets/chart-icon.png
home: https://quench-works.com
sources:
  - https://github.com/quenchworks/charts
  - https://github.com/ollama/ollama
  - https://github.com/BerriAI/litellm
  - https://github.com/qdrant/qdrant
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "bundles qdrant=0.0.25 (qdrant 1.19.2 rebuild)"
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/images: |
    - name: ollama
      image: ghcr.io/quenchworks/images/ollama@sha256:aa535d508234156693e3de23f60d68c52b29866d6f2010db19f7de191c3d6473
    - name: litellm
      image: ghcr.io/quenchworks/images/litellm@sha256:b04744116d22934572b7ff8219fc1db0143dc07d206b79a7b87dbb3f1d884d2a
    - name: qdrant
      image: ghcr.io/quenchworks/images/qdrant@sha256:731834d72f311b1b42879547954461c7461165647e40c9c590f727e202933c23
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/quenchworks/charts
    - name: image
      url: https://github.com/quenchworks/images
  artifacthub.io/signKey: |
    fingerprint: keyless (cosign / Sigstore)
    url: https://github.com/quenchworks/.github/blob/main/SECURITY.md
dependencies:
  - name: quench-common
    version: 0.0.14
    repository: oci://ghcr.io/quenchworks/charts
  - name: ollama
    version: 0.0.37
    repository: oci://ghcr.io/quenchworks/charts
    condition: ollama.enabled
  - name: litellm
    version: 0.0.26
    repository: oci://ghcr.io/quenchworks/charts
    condition: litellm.enabled
  - name: qdrant
    version: 0.0.25
    repository: oci://ghcr.io/quenchworks/charts
    condition: qdrant.enabled

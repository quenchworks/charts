{{- $name := include "quench-common.fullname" . -}}
{{- $pw := .Values.admin.password -}}
{{- if not $pw -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $pw = index .data "admin-password" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $pw -}}{{- $pw = randAlphaNum 24 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  # The whole config is secret: it carries every user's password.
  proxysql.cnf: {{ include "proxysql.cnf" (dict "ctx" . "adminPassword" $pw) | b64enc | quote }}

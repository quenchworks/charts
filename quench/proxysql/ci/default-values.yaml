# Install gate. The release workflow first installs our mariadb chart as `db`
# (user app / app-gate-pw, database app), so ProxySQL has a real backend and
# the smoke check can route a query through it.
admin:
  password: gate-admin-pw
monitor:
  username: app
  password: app-gate-pw
mysqlServers:
  - { hostname: db-mariadb, port: 3306, hostgroup: 0 }
mysqlUsers:
  - { username: app, password: app-gate-pw, defaultHostgroup: 0 }

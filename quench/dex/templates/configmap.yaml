{{- if and .Values.config.yaml (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dex.configMapName" . }}
  labels:
    {{- include "quench-common.labels" . | nindent 4 }}
data:
  # Mounted at .Values.configMountPath and passed to `dex serve`.
  {{ include "dex.configFileName" . }}: |-
    {{- .Values.config.yaml | nindent 4 }}
{{- end }}
